# Generated from mise.no-env.toml by file-enforcer.
# harper:ignore

# mise configuration - replaces proto and moon
# https://mise.jdx.dev/configuration.html
# After cloning, run `mise trust` to mark this file as trustworthy.
# Mise refuses to evaluate env vars, templates, and `path:` plugin versions
# in untrusted config files. Trusting the monorepo root implicitly trusts
# all descendant config files (packages/**/mise.toml).
# https://mise.jdx.dev/cli/trust.html

# Enables monorepo task discovery: tasks in subdirectories are auto-discovered
# and prefixed with their relative paths, creating a unified task namespace.
# https://mise.jdx.dev/tasks/monorepo.html
experimental_monorepo_root = true

[monorepo]
# Each packages/*/* directory with a mise.toml becomes its own config root,
# giving it its own tools, env, and tasks while inheriting from the root.
config_roots = [
  "packages/*/*",
]

[tools]
# Primary runtime
bun = "latest"

# Package manager
"npm:pnpm" = "11.0.0-rc.1"

# aqua:sharkdp/fd broken as of 2026-03-07, falling back to cargo
"cargo:fd-find" = "latest"
ripgrep = "latest"

# Replacing strings
"cargo:fastmod" = "latest"

# Needed by some packages that depend on Node APIs
node = "latest"

# Non-JS-based linters and formatters
harper-cli = "latest"
dprint = "latest"

# For running Python packages and scripts
uv = "latest"

# Benchmarking
hyperfine = "latest"

# Web Server for deployment
caddy = "latest"

# Required by `mise watch`
watchexec = "latest"

# For executing tasks cross-platform
"aqua:nushell/nushell" = "latest"

# For reliable timeout
rust = "latest"
cargo-binstall = "latest"
"cargo:timeout-cli" = "latest"

# Compression
"github:facebook/zstd" = "latest"

# AI inference server for local development (packages/webapp-productivity/done)
"github:ggml-org/llama.cpp" = "latest"

opentofu = "latest"
hcloud = "latest"
"npm:typescript-language-server" = "latest"
"npm:markdownlint-cli2" = "latest"
"cargo:coreutils" = { version = "latest", features = "unix" }
deno = "latest"
"npm:socket" = "latest"

[settings]
env_shell_expand = false

# Enable automatic tool installation when entering directory
auto_install = true

# Experimental features
experimental = true

# asdf -> Doesn't support Windows.
disable_backends = ["asdf"]

# Per task timeout not implemented yet in Mise.
# task_timeout = "5s"

# Uncomment when debugging
# verbose = true

status.missing_tools = "always"

# Matches the packages/*/* directory depth (e.g. packages/module/es = 3 segments).
task.monorepo_depth = 3

# Skip the extra Tera template pass that collects arg()/option()/flag() from run scripts.
# No tasks in this repo use Tera spec functions; only explicit `usage` fields are needed.
# Avoids two-pass parsing quirks and will be the default after Tera arguments are removed in 2026.11.0.
task.disable_spec_from_run_scripts = true

# Nushell for all task execution ensures consistent behavior across platforms.
unix_default_file_shell_args = "nu"
windows_default_file_shell_args = "nu"
unix_default_inline_shell_args = "nu -c"
windows_default_inline_shell_args = "nu -c"

[hooks]
# `mise install` only installs missing tools; it does not re-resolve "latest"
# for core backends (bun, node, etc.) that cache the resolution via symlink.
# `mise upgrade` re-resolves "latest" and installs newer versions.
# Nushell `;` always runs both commands (no fail-fast like bash `&&`).
enter = """
let quiet_lines = ["mise all tools are installed" "mise All tools are up to date"]
for result in [(mise install | complete) (mise upgrade | complete)] {
  let out = ($result.stdout | str trim)
  if $out != '' { print $out }
  let err_lines = ($result.stderr | str trim | lines | where {|line| ($line | str trim) not-in $quiet_lines })
  if ($err_lines | is-not-empty) { print -e ($err_lines | str join "\n") }
}
"""

[vars]
# Monorepo root for task templates that need to reference root-level config files.
monorepo_root = "{{config_root}}"
# Nushell fanout script: discovers direct child tasks (one `:` level deeper) and runs them in parallel.
# Replaces native `[{ tasks = ["prefix:*"] }]` which matches all descendants due to mise treating `:` as a regular character in `*` globs.
fanout = """
let p = $env.MISE_TASK_NAME + ":"
let d = ($p | split row ":" | length)
let c = (mise tasks --all --hidden --json | from json | get name | where { |n| ($n | str starts-with $p) and (($n | split row ":" | length) == $d) })
if ($c | is-empty) { error make { msg: $"no child tasks for ($env.MISE_TASK_NAME)" } } else { mise run ...($c | reduce -f [] { |it, acc| if ($acc | is-empty) { [$it] } else { ($acc | append ":::" | append $it) } }) }
"""

[task_templates.build]
run = "{{vars.fanout}}"

[task_templates."build:js"]
run = "{{vars.fanout}}"

[task_templates."build:js:browser"]
run = "tsdown --config tsdown.browser.config.ts"

[task_templates."build:js:client"]
run = "tsdown --config tsdown.client.config.ts"

[task_templates."build:js:node"]
run = "tsdown --config tsdown.node.config.ts"

[task_templates."watch:build"]
run = "{{vars.fanout}}"

[task_templates."watch:build:js"]
run = "{{vars.fanout}}"

[task_templates."watch:build:js:browser"]
run = "tsdown --watch --config tsdown.browser.config.ts"

[task_templates."watch:build:js:client"]
run = "tsdown --watch --config tsdown.client.config.ts"

[task_templates."watch:build:js:node"]
run = "tsdown --watch --config tsdown.node.config.ts"

[task_templates.test]
run = "{{vars.fanout}}"

[task_templates."watch:test"]
run = "{{vars.fanout}}"

[task_templates.lint]
run = "{{vars.fanout}}"

[task_templates."lint:oxlint"]
description = "Lint with Oxlint"
run = "task-oxlint --type-aware"

[task_templates."lint:types"]
description = "TypeScript"
run = "task-tsgo --build"

[task_templates."watch:lint:types"]
description = "Type check in watch mode"
run = "tsgo --watch"

[task_templates.prepare]
run = "{{vars.fanout}}"

#region tasks
#
# Task naming follows `${category}${optional(`--${modifier}`)}:${child}`
# never use depends or post depends, use run only because it's the easiest to understand.

#region Utility Tasks

[tasks.try]
description = "Run a task, tolerating failures"
usage = 'arg "task" help="Task name to run with failure tolerance"'
run = "try { mise run $env.usage_task } catch { |e| print -e $e.rendered }"

#endregion Utility Tasks

#region Build Tasks

[tasks.build]
description = "Build all packages, fanout to every package's 'build' task"
run = "mise '//packages/...:build'"

# Monorepo glob syntax: // = absolute from root, ... = all config roots, :task = task name.
# https://mise.jdx.dev/tasks/monorepo.html

[tasks."watch:build"]
description = "Build all packages in watch mode, fanout to every package's 'watch:build' task"
run = "mise '//packages/...:watch:build'"

#endregion Build Tasks

#region Test Tasks

# When args are provided, only unit tests run with those args (for single-file filtering).
# When no args are provided, all test suites (unit + browser) run.
[tasks.test]
description = "Run all tests, or pass args to filter unit tests"
alias = "t"
usage = 'arg "[args]" var=#true help="Test file paths (when provided, only unit tests run)"'
run = """
let args = ($env.usage_args? | default '' | str trim)
if $args == '' {
  mise run test:unit ::: test:browser ::: test:e2e
} else {
  # usage_args shell-escapes values; evaluate to recover the original
  let files = (nu -c $"echo ($args)")
  $files | split row ' ' | where {|f| $f != '' } | par-each { |file| bun $file }
}
"""

[tasks."test:unit"]
hide = true
description = "Run unit tests"
usage = 'arg "[args]" var=#true help="Test file paths to run (when provided, only those files run)"'
run = """
let args = ($env.usage_args? | default '' | str trim | split row ' ' | where {|part| $part != '' })
if ($args | is-empty) {
  glob "**/*.unit.test.ts" | where { not ($in | str contains "/deprecated/") } | par-each { |file| bun $file }
} else {
  $args | par-each { |file| bun $file }
}
"""

[tasks."test:browser"]
hide = true
description = "Run browser tests with Playwright in podman"
usage = 'arg "[args]" var=#true help="Additional arguments passed to playwright"'
run = """
mise run prepare:playwright
let args = ($env.usage_args? | default '' | split row ' ' | where {|part| $part != '' })
podman run --rm -v $"($env.PWD):/work:Z" -w /work monochromatic-playwright bunx playwright test --config playwright.browser.config.ts ...$args
"""

[tasks."test:e2e"]
hide = true
description = "Run e2e tests with Playwright in podman"
usage = 'arg "[args]" var=#true help="Additional arguments passed to playwright"'
run = """
mise run prepare:playwright
let args = ($env.usage_args? | default '' | split row ' ' | where {|part| $part != '' })
podman run --rm -v $"($env.PWD):/work:Z" -w /work monochromatic-playwright bunx playwright test --config playwright.e2e.config.ts ...$args
"""

[tasks."test:browser:chromium"]
hide = true
description = "Run browser tests in Chromium"
usage = 'arg "[args]" var=#true help="Additional arguments passed to playwright"'
run = """
mise run prepare:playwright
let args = ($env.usage_args? | default '' | split row ' ' | where {|part| $part != '' })
podman run --rm -v $"($env.PWD):/work:Z" -w /work monochromatic-playwright bunx playwright test --config playwright.browser.config.ts --project=chromium ...$args
"""

[tasks."test:browser:firefox"]
hide = true
description = "Run browser tests in Firefox"
usage = 'arg "[args]" var=#true help="Additional arguments passed to playwright"'
run = """
mise run prepare:playwright
let args = ($env.usage_args? | default '' | split row ' ' | where {|part| $part != '' })
podman run --rm -v $"($env.PWD):/work:Z" -w /work monochromatic-playwright bunx playwright test --config playwright.browser.config.ts --project=firefox ...$args
"""

# [tasks."test:browser"]
# hide = true
# description = "Run browser tests"
# run = "vitest run --config vitest.browser.config.ts"

[tasks."watch:test:unit"]
hide = true
description = "Run unit tests in watch mode"
usage = 'arg "[args]" var=#true help="Test file paths to watch"'
run = """
let args = ($env.usage_args? | default '' | str trim | split row ' ' | where {|part| $part != '' })
if ($args | is-empty) {
  glob "**/*.unit.test.ts" | where { not ($in | str contains "/deprecated/") } | par-each { |file| bun --watch $file }
} else {
  $args | par-each { |file| bun --watch $file }
}
"""

# [tasks."watch:test:browser"]
# hide = true
# description = "Run browser tests in watch mode"
# run = "vitest watch --config vitest.browser.config.ts"

[tasks."watch:test"]
description = "Run all tests in watch mode"
extends = "watch:test"
alias = "tW"

[tasks."testDockerImage"]
run = "docker build --progress=plain ."

[tasks.buildAndTest]
description = "Build then test; with args, builds only the containing package instead of the entire monorepo"
alias = "bt"
usage = 'arg "[args]" var=#true help="Test file paths"'
run = """
let args = ($env.usage_args? | default '' | str trim)
if $args == '' {
  mise run try -- build
  mise run test
} else {
  # usage_args shell-escapes values (wraps spaces in quotes); evaluate to recover the original
  let files = (nu -c $"echo ($args)")
  # Build only the package containing the test file, not every package in the monorepo
  let clean_path = ($files | str replace --regex '^\\./' '')
  let parts = ($clean_path | split row '/')
  if ($parts | length) >= 3 and ($parts | first) == 'packages' {
    let pkg_path = ($parts | first 3 | str join '/')
    let build_task = $"//($pkg_path):build"
    let has_build = (mise tasks ls --all --json | from json | any {|t| $t.name == $build_task })
    if $has_build {
      try { mise run $build_task } catch { |e| print -e $e.rendered }
    }
  } else {
    mise run try -- build
  }
  $files | split row ' ' | where {|f| $f != '' } | par-each { |file| bun $file }
}
"""

[tasks."watch:buildAndTest"]
description = "Build and test in watch mode"
run = [{ tasks = ["watch:build", "watch:test"] }]

#endregion Test Tasks

#region Linting Tasks

[tasks."lint"]
description = "Lint"
run = [
  "mise '//packages/...:lint'",
  { tasks = ["lint:dprint", "lint:stylelint", "lint:markdownlint"] },
]
[tasks."lint".env]
OXLINT_THREADS = "1"

[tasks."lint:dprint"]
hide = true
description = "Check formatting with dprint"
run = "dprint check --list-different"

[tasks."lint:stylelint"]
hide = true
description = "Lint CSS with Stylelint"
run = 'stylelint --ignore-path .gitignore "**/*.{css,astro,html}"'

[tasks."lint:markdownlint"]
hide = true
description = "Lint Markdown with markdownlint-cli2"
run = "markdownlint-cli2 ."

#endregion Linting Tasks

# Formatter orchestration
# dprint handles formatting (TypeScript, CSS, JSON, YAML, TOML, HTML, markup).
# After dprint, stylelint --fix and oxlint --fix run in parallel
# to apply auto-fixable lint rules that formatters can't cover.
#
# Previously attempted dprint-plugin-exec for inline chaining, but exec is
# incompatible with tools that modify files in-place (oxlint) or exit non-zero
# on unfixable errors. See dprint-plugin-exec handler.rs:299-314 -- it requires
# exit code 0 and reads stdout as formatted content, not the file on disk.
[tasks.format]
description = "Format all files"
run = ["dprint fmt", { tasks = ["format:stylelint", "format:oxlint"] }]

[tasks."format:stylelint"]
hide = true
description = "Auto-fix CSS with Stylelint"
run = 'stylelint --fix --ignore-path .gitignore "**/*.{css,astro,html}"'

[tasks."format:oxlint"]
hide = true
# Runs from the monorepo root without --type-aware, so type-aware rules
# (e.g. typescript/no-unnecessary-condition) are not auto-fixed.
# A proper fix would require per-package fan-out like lint:oxlint,
# but the format task is not the right place for that complexity.
description = "Auto-fix with Oxlint (non-type-aware only)"
run = "task-oxlint --fix"

#region Validation and Check Tasks

[tasks.validate]
description = "Comprehensive validation: format, build, test (runs sequentially)"
run = """
mise run format && mise run build && mise run test
"""

#endregion Validation and Check Tasks

#region Preparation Tasks

[tasks.prepare]
description = "Prepare environment (install Playwright browsers, etc.)"
extends = "prepare"

[tasks."prepare:pnpm"]
run = [{ tasks = ["prepare:pnpm:install"] }, { tasks = ["prepare:pnpm:others:*"] }]

[tasks."prepare:pnpm:install"]
alias = "pi"
run = "task-pnpm install"

[tasks."prepare:pnpm:others:approve-builds"]
description = "Approve build scripts for native dependencies"
run = "pnpm approve-builds sharp"

[tasks."prepare:pnpm:others:files"]
description = "Sync file-enforcer managed files (CLAUDE.md, skill mirrors)"
run = "bun file-enforcer.config.ts"

[tasks."prepare:playwright"]
description = "Build Playwright container image via podman"
run = """
task-depends -s "sh:echo Infinity" -o "sh:podman image exists monochromatic-playwright && echo Infinity || echo -Infinity" -- podman build -t monochromatic-playwright -f playwright.Dockerfile .
"""

[tasks.prepareAndBuild]
description = "Complete setup: prepare environment and build all artifacts"
run = [{ tasks = ["prepare"] }, { tasks = ["build"] }]

[tasks.prepareAndBuild--allowFailure]
description = "Complete setup: prepare and build, allowing failures"
run = """
mise run try -- prepare
mise run try -- build
"""

#endregion Preparation Tasks

#region Development Server Tasks

[tasks.start]
description = "Start development servers"
run = "{{vars.fanout}}"

# TODO: Add package-specific start tasks here

