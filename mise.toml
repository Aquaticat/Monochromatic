# harper:ignore

# mise configuration - replaces proto and moon
# https://mise.jdx.dev/configuration.html
# TODO: Document `mise trust`

# Enables monorepo task discovery: tasks in subdirectories are auto-discovered
# and prefixed with their relative paths, creating a unified task namespace.
# https://mise.jdx.dev/tasks/monorepo.html
experimental_monorepo_root = true

[monorepo]
# Each packages/*/* directory with a mise.toml becomes its own config root,
# giving it its own tools, env, and tasks while inheriting from the root.
config_roots = [
  "packages/*/*",
]

[tools]
# Primary runtime
bun = "latest"

# Package manager
# TODO: Migrating to Bun.
# pnpm = { version = "latest", postinstall = "pnpm install" }

# Scripts assume basic unix tools
coreutils = "latest"

# Find files
fd = "latest"
ripgrep = "latest"

# Needed by some packages that depend on Node APIs
node = "latest"

# Non-JS-based linters and formatters
harper-cli = "latest"
dprint = "latest"

# For running Python packages and scripts
uv = "latest"

# Benchmarking
hyperfine = "latest"

# Web Server for deployment
caddy = "latest"

# Required by `mise watch`
watchexec = "latest"

# For executing tasks cross-platform
"aqua:nushell/nushell" = "latest"

# For reliable timeout
rust = "latest"
cargo-binstall = "latest"
"cargo:timeout-cli" = "latest"

# Compression
"github:facebook/zstd" = "latest"

# AI inference server for local development (packages/webapp-productivity/done)
"github:ggml-org/llama.cpp" = "latest"

[settings]
# Enable automatic tool installation when entering directory
auto_install = true

# Experimental features
experimental = true

# asdf -> Doesn't support Windows.
disable_backends = ["asdf"]

# Per task timeout not implemented yet in Mise.
# task_timeout = "5s"

# Uncomment when debugging
# verbose = true

status.missing_tools = "always"

# Matches the packages/*/* directory depth (e.g. packages/module/es = 3 segments).
task.monorepo_depth = 3

# Nushell for all task execution ensures consistent behavior across platforms.
unix_default_file_shell_args = "nu"
windows_default_file_shell_args = "nu"
unix_default_inline_shell_args = "nu -c"
windows_default_inline_shell_args = "nu -c"

[hooks]
enter = "mise install"

[env]
# Uses native Node.js TypeScript loader for eslint.config.ts (instead of jiti).
ESLINT_FLAGS = "unstable_native_nodejs_ts_config"

# Too verbose
# BUN_CONFIG_VERBOSE_FETCH = "1"

# .env file is optional - mise silently ignores missing files
# https://github.com/jdx/mise/blob/main/src/config/env_directive/file.rs#L155-L163
_.file = [{ path = ".env", redact = true }, { path = ".env.local", redact = true }]
_.path = [
  "node_modules/.bin",
]

# Doesn't work: --experimental-default-config-file is not allowed in NODE_OPTIONS
# NODE_OPTIONS = "--experimental-default-config-file"

# Placeholder for future shared variables across tasks.
[vars]

[task_templates.build]
run = [{ tasks = ["build:*"] }]

[task_templates."build:js"]
run = [{ tasks = ["build:js:*"] }]

[task_templates."build:js:browser"]
run = "tsdown --config tsdown.browser.config.ts"

[task_templates."build:js:node"]
run = "tsdown --config tsdown.node.config.ts"

[task_templates."build--watch"]
run = [{ tasks = ["build--watch:*"] }]

[task_templates."build--watch:js"]
run = [{ tasks = ["build--watch:js:*"] }]

[task_templates."build--watch:js:browser"]
run = "tsdown --watch --config tsdown.browser.config.ts"

[task_templates."build--watch:js:node"]
run = "tsdown --watch --config tsdown.node.config.ts"

[task_templates."build--allowFailure"]
run = [{ tasks = ["build--allowFailure:*"] }]

[task_templates.test]
run = [{ tasks = ["test:*"] }]

[task_templates."test--watch"]
run = [{ tasks = ["test--watch:*"] }]

[task_templates.lint]
run = [{ tasks = ["lint:*"] }]

[task_templates."lint:types"]
description = "TypeScript"
run = "tsgo --build"

[task_templates."lint--allowFailure:types"]
description = "TypeScript"
run = "try { tsgo --build } catch { |e| print -e $e.rendered }"

[task_templates."lint--watch:types"]
description = "Type check in watch mode"
run = "tsgo --watch"

[task_templates.prepare]
run = [{ tasks = ["prepare:*"] }]

[task_templates."prepare--allowFailure"]
run = [{ tasks = ["prepare--allowFailure:*"] }]

#region tasks
#
# Task naming follows `${category}${optional(`--${modifier}`)}:${child}`
# never use depends or post depends, use run only because it's the easiest to understand.

#region Build Tasks

[tasks.build]
description = "Build all packages"
extends = "build"
alias = "b"

# Monorepo glob syntax: // = absolute from root, ... = all config roots, :task = task name.
# https://mise.jdx.dev/tasks/monorepo.html
[tasks."build:js"]
hide = true
description = "Build JavaScript for all packages"
run = "mise '//packages/...:build:js'"

[tasks."build--allowFailure:js"]
hide = true
description = "Build JavaScript for all packages"
run = "mise '//packages/...:build--allowFailure:js'"

[tasks.build--watch]
description = "Build all packages in watch mode"
extends = "build--watch"

[tasks."build--watch:js"]
hide = true
description = "Build JavaScript in watch mode"
run = "mise '//packages/...:build--watch:js'"

[tasks.build--allowFailure]
description = "Build all packages, allowing failures"
extends = "build--allowFailure"

#endregion Build Tasks

#region Test Tasks

[tasks.test]
description = "Run all tests"
extends = "test"
alias = "t"

[tasks."test:unit"]
hide = true
description = "Run unit tests"
usage = 'arg "[args]" var=#true help="Additional arguments passed to bun test"'
run = "bun test ...(rg --files --glob '**/*.unit.test.*' --glob '!**/deprecated/**' | lines) ...($env.usage_args? | default '' | split row ' ' | where {|part| $part != '' })"

[tasks."test:browser"]
hide = true
description = "Run browser tests with Playwright"
usage = 'arg "[args]" var=#true help="Additional arguments passed to playwright"'
run = "bunx playwright test --config playwright.browser.config.ts ...($env.usage_args | split row ' ')"

[tasks."test:browser:chromium"]
hide = true
description = "Run browser tests in Chromium"
usage = 'arg "[args]" var=#true help="Additional arguments passed to playwright"'
run = "bunx playwright test --config playwright.browser.config.ts --project=chromium ...($env.usage_args | split row ' ')"

[tasks."test:browser:firefox"]
hide = true
description = "Run browser tests in Firefox"
usage = 'arg "[args]" var=#true help="Additional arguments passed to playwright"'
run = "bunx playwright test --config playwright.browser.config.ts --project=firefox ...($env.usage_args | split row ' ')"

# [tasks."test:browser"]
# hide = true
# description = "Run browser tests"
# run = "vitest run --config vitest.browser.config.ts"

[tasks."test--watch:unit"]
hide = true
description = "Run unit tests in watch mode"
usage = 'arg "[args]" var=#true help="Additional arguments passed to bun test"'
run = "bun test --watch ...(rg --files --glob '**/*.unit.test.*' --glob '!**/deprecated/**' | lines) ...($env.usage_args? | default '' | split row ' ' | where {|part| $part != '' })"

# [tasks."test--watch:browser"]
# hide = true
# description = "Run browser tests in watch mode"
# run = "vitest watch --config vitest.browser.config.ts"

[tasks."test--watch"]
description = "Run all tests in watch mode"
extends = "test--watch"
alias = "tW"

[tasks.buildAndTest]
description = "Build and test"
run = [{ tasks = ["build"] }, { tasks = ["test"] }]

[tasks.buildAndTest--watch]
description = "Build and test in watch mode"
run = [{ tasks = ["build--watch", "test--watch"] }]

#endregion Test Tasks

#region Linting Tasks

[tasks.lint]
description = "Run all linters"
extends = "lint"

[tasks."lint:eslint"]
hide = true
description = "Lint with ESLint"
run = "timeout 10 bunx eslint --cache --report-unused-disable-directives --report-unused-inline-configs warn --exit-on-fatal-error 'packages/**/*.*'"

[tasks."lint:oxlint"]
hide = true
description = "Lint with Oxlint"
# TODO: Run js plugin in eslint for now until oxlint https://github.com/oxc-project/oxc/issues/14375 is fixed.
# TODO: Make this type aware, need to setup both oxlint and eslint rule disables.
run = "oxlint"

[tasks."lint:dprint"]
hide = true
description = "Check formatting with dprint"
run = "dprint check --list-different"

[tasks."lint:stylelint"]
hide = true
description = "Lint CSS with Stylelint"
run = 'stylelint --ignore-path .gitignore "**/*.{css,astro,html}"'

# Runs lint:types across all package config roots via monorepo glob syntax.
[tasks."lint:types"]
hide = true
description = "TypeScript"
run = "mise '//packages/...:lint:types'"

#endregion Linting Tasks

# Formatter Orchestration via dprint
# dprint orchestrates all formatters using dprint-plugin-exec plugin.
# Sequential execution per file type (documented in packages/config/dprint/index.json):
#   CSS/Astro/HTML: dprint built-in plugins → stylelint --fix
#   TS/JS files:     dprint built-in plugins → oxlint --fix → eslint --fix
# Each formatter's output becomes the next formatter's input, as proven in:
# https://github.com/dprint/dprint/blob/370a23d8e2ae22789972e6574a00070f05b46287/crates/dprint/src/resolution.rs#L343-L365
[tasks.format]
description = "Format all files"
run = ["dprint fmt"]

#region Validation and Check Tasks

[tasks.validate]
description = "Comprehensive validation: format, build, test (runs sequentially)"
run = """
mise run format && mise run build && mise run test
"""

#endregion Validation and Check Tasks

#region Preparation Tasks

[tasks.prepare]
description = "Prepare environment (install Playwright browsers, etc.)"
extends = "prepare"

[tasks.prepare--allowFailure]
description = "Prepare environment, allowing failures"
extends = "prepare--allowFailure"

[tasks."prepare:playwright"]
description = "Install Playwright browsers"
run = "bunx playwright install --with-deps"

[tasks."prepare--allowFailure:playwright"]
description = "Install Playwright browsers, allowing failures"
run = "try { bunx playwright install --with-deps } catch { |e| print -e $e.rendered }"

[tasks.prepareAndBuild]
description = "Complete setup: prepare environment and build all artifacts"
run = [{ tasks = ["prepare"] }, { tasks = ["build"] }]

[tasks.prepareAndBuild--allowFailure]
description = "Complete setup: prepare and build, allowing failures"
run = [{ tasks = ["prepare--allowFailure"] }, { tasks = ["build--allowFailure"] }]

#endregion Preparation Tasks

#region Development Server Tasks

[tasks.start]
description = "Start development servers"
run = [{ tasks = ["start:*"] }]

# TODO: Add package-specific start tasks here

[tasks."start:caddy"]
hide = true
description = "Start Caddy web server"
run = "caddy run --config Caddyfile --adapter caddyfile"

#endregion Development Server Tasks

#region TypeScript Project References
# Moon automatically synced TypeScript project references during build.
# With mise, this needs to be done manually via a script.
# See: packages/module/es/src/mise.syncTsProjectReferences.ts

[tasks."sync:tsReferences"]
description = "Sync TypeScript project references (replaces moon's auto-sync)"
run = "bun packages/module/es/src/mise.syncTsProjectReferences.ts"

#endregion TypeScript Project References

#region File Enforcer

[tasks."sync:files"]
description = "Sync derived files (CLAUDE.md, oxlint config, etc.) via file-enforcer"
run = "bun packages/dev-script/file-enforcer/src/index.ts"

[tasks."sync--watch:files"]
description = "Watch source files and re-sync on changes"
run = "bun packages/dev-script/file-enforcer/src/index.ts --watch"

#endregion File Enforcer

#region Inference Canary -- probes to detect LLM inference degradation before starting work

[tasks.canary]
description = "Run inference canary probes against the configured model"
usage = 'arg "[args]" var=#true help="Additional arguments (--model <id> --runs <n>)"'
run = "bun packages/dev-script/inference-canary/src/index.ts ...($env.usage_args? | default '' | split row ' ' | where {|part| $part != '' })"

#endregion Inference Canary

#endregion tasks
