# Moon automatically synced TypeScript project references during build.
# With mise, this needs to be done manually via a script.
# See: packages/module/es/src/mise.syncTsProjectReferences.ts
# Update: deprecated. tsgo is fast enough that importing ts source w/o any special setup is acceptable.
#endregion TypeScript Project References

#region File Enforcer

[tasks."sync:files"]
alias = "file-enforcer"
description = "Sync derived files (CLAUDE.md, oxlint config, etc.) via file-enforcer"
run = "bun packages/dev-script/file-enforcer/src/cli.ts"

[tasks."watch:sync:files"]
description = "Watch source files and re-sync on changes"
run = "bun packages/dev-script/file-enforcer/src/cli.ts --watch"

#endregion File Enforcer

#region Inference Canary -- probes to detect LLM inference degradation before starting work

[tasks.canary]
description = "Run inference canary probes against the configured model"
usage = 'arg "[args]" var=#true help="Additional arguments (--model <id> --runs <n>)"'
run = "bun packages/dev-script/inference-canary/src/index.ts ...($env.usage_args? | default '' | split row ' ' | where {|part| $part != '' })"

#endregion Inference Canary

#region Catalog Tighten -- tighten >= ranges in pnpm-workspace.yaml catalog to match installed versions

[tasks."catalog:tighten"]
description = "Tighten catalog >=x.y.z ranges to match installed node_modules versions"
usage = 'flag "--dry-run" help="Print what would change without writing"'
run = """
let args = if ($env.usage_dry__run? | default '' | str trim) == 'true' { ['--dry-run'] } else { [] }
bun packages/dev-script/catalog-tighten/src/index.ts ...$args
"""

#endregion Catalog Tighten

#region Page Weight -- audit per-page transfer size (min, max, mean, median) across HTML in a dist directory

[tasks."page:weight"]
description = "Report per-page transfer size (min, max, mean, median) for a dist directory"
usage = 'arg "<dist>" help="Path to the dist directory containing HTML files"'
run = "bun packages/dev-script/page-weight/src/index.ts $env.usage_dist"

#endregion Page Weight

#region Fix Tasks -- workarounds for upstream bugs

[tasks."fix:reinstall"]
description = "Clean reinstall to work around registry or resolution issues"
run = "rm -rf node_modules; task-pnpm install"

#endregion Fix Tasks

#endregion tasks

