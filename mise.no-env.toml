# Lints Markdown and MDX with @monochromatic-dev/cli-markdown-lint, run from
# TypeScript source under Bun (no build-before-lint step, closing issue #231).
# No-arg walks the whole tree, filtering by extension and honouring .gitignore;
# file/dir paths restrict the walk. Exits non-zero when violations remain.
[tasks."lint:markdown"]
hide = true
description = "Lint Markdown and MDX with cli-markdown-lint, optionally restricted to specific files"
# No usage spec: mise appends post-`--` args to the command as a real argv vector
# (preserving spaces). The cli defaults to walking `.` when no paths are given
# (see packages/cli/markdown-lint/src/run.ts).
run = "node packages/cli/markdown-lint/src/cli.ts"

[tasks."lint:rust"]
description = "Enforce the per-file code-line budget on .rs under packages/ (monochromatic-rust-linter)"
# Part of the `lint` aggregate. Pre-existing over-budget files keep this red
# until they are split; tracked in issue #235. Also runnable per package via
# `:lint:max-lines`.
run = "cargo run --quiet --manifest-path packages/linter/rust/Cargo.toml -- packages"

#endregion Linting Tasks

# Formatter orchestration
# dprint handles formatting (CSS, JSON, YAML, TOML, HTML).
# After dprint, stylelint --fix and oxlint --fix run in parallel
# to apply auto-fixable lint rules that formatters can't cover.
#
# Previously attempted dprint-plugin-exec for inline chaining, but exec is
# incompatible with tools that modify files in-place (oxlint) or exit non-zero
# on unfixable errors. See dprint-plugin-exec handler.rs:299-314 -- it requires
# exit code 0 and reads stdout as formatted content, not the file on disk.
[tasks.format]
description = "Format all files"
run = [
  "dprint fmt",
  { tasks = ["format:stylelint", "format:oxlint", "format:markdown"] },
]

[tasks."format:stylelint"]
hide = true
description = "Auto-fix CSS with Stylelint"
run = 'stylelint --fix --ignore-path .gitignore "**/*.{css,astro,html}"'

[tasks."format:oxlint"]
hide = true
# Runs from the monorepo root without --type-aware, so type-aware rules
# (e.g. typescript/no-unnecessary-condition) are not auto-fixed.
# A proper fix would require per-package fan-out like lint:oxlint,
# but the format task is not the right place for that complexity.
description = "Auto-fix with Oxlint (non-type-aware only)"
shell = "node -e"
run = """
{{vars.dispatch_workspace_node}}
ensureOxlintConfig()
runWorkspaceNode('packages/dev-script/task-util', 'oxlint-wrapper', ['--fix'])
"""

# Applies cli-markdown-lint autofixes (e.g. no-pipe-tables converting pipe
# tables to HTML, semantic-line-breaks inserting breaks) over the whole tree or
# the given file paths. dprint handles markdown *formatting*; this is for lint
# fixes dprint cannot do. In the root `format` task it runs after dprint
# (sequential), so it sees already-formatted files.
[tasks."format:markdown"]
hide = true
description = "Apply cli-markdown-lint autofixes, optionally restricted to specific files"
# No usage spec: mise appends post-`--` args after `--fix` as a real argv vector.
# The cli defaults to walking `.` when no paths are given
# (see packages/cli/markdown-lint/src/run.ts).
run = "node packages/cli/markdown-lint/src/cli.ts --fix"

