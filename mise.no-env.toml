[tasks."test:browser:firefox"]
hide = true
description = "Run browser tests in Firefox"
usage = 'arg "[args]" var=#true help="Additional arguments passed to playwright"'
shell = "node -e"
run = """
{{vars.parse_usage_args}}
const { execFileSync } = await import('node:child_process')
execFileSync('mise', ['run', 'prepare:playwright'], { stdio: 'inherit' })
const args = parseUsageArgs(process.env.usage_args ?? '')
execFileSync('podman', ['run', '--rm', '-v', `${process.cwd()}:/work:Z`, '-w', '/work', 'monochromatic-playwright', 'npx', 'playwright', 'test', '--config', 'playwright.browser.config.ts', '--project=firefox', ...args], { stdio: 'inherit' })
"""

[tasks."watch:test:unit"]
hide = true
description = "Run unit tests in watch mode"
usage = 'arg "[args]" var=#true help="Test file paths to watch"'
shell = "node -e"
run = """
{{vars.parse_usage_args}}
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { glob } = await import('node:fs/promises')
const args = parseUsageArgs(process.env.usage_args ?? '')
let files
if (args.length === 0) {
  files = []
  for await (const file of glob('**/*.unit.test.ts', { exclude: (name) => name.includes('node_modules') })) {
    if (!file.includes('/deprecated/')) { files.push(file) }
  }
} else {
  files = args
}
// node --watch runs until interrupted; spawn every watcher and stay alive until they all exit.
const watchers = files.map((file) => spawn('node', ['--watch', file], { stdio: 'inherit' }))
await Promise.all(watchers.map((proc) => once(proc, 'exit')))
"""

[tasks."watch:test"]
description = "Run all tests in watch mode"
extends = "watch:test"
alias = "tW"

[tasks."testDockerImage"]
run = "docker build --progress=plain ."

[tasks.buildAndTest]
description = "Build then test; with args, builds only the containing package instead of the entire monorepo"
alias = "bt"
usage = 'arg "[args]" var=#true help="Test file paths"'
shell = "node -e"
run = """
{{vars.parse_usage_args}}
{{vars.run_test_files}}
const { execFileSync } = await import('node:child_process')
const args = parseUsageArgs(process.env.usage_args ?? '')
if (args.length === 0) {
  execFileSync('mise', ['run', 'try', '--', 'build'], { stdio: 'inherit' })
  execFileSync('mise', ['run', 'test'], { stdio: 'inherit' })
} else {
  // Build only the package containing the first test file, not every package in the monorepo.
  const first = args[0].startsWith('./') ? args[0].slice(2) : args[0]
  const parts = first.split('/')
  if (parts.length >= 3 && parts[0] === 'packages') {
    const buildTask = `//${parts.slice(0, 3).join('/')}:build`
    const allTasks = JSON.parse(execFileSync('mise', ['tasks', 'ls', '--all', '--json'], { encoding: 'utf8' }))
    if (allTasks.some((task) => task.name === buildTask)) {
      try { execFileSync('mise', ['run', buildTask], { stdio: 'inherit' }) } catch { /* tolerate build failure, still run tests */ }
    }
  } else {
    execFileSync('mise', ['run', 'try', '--', 'build'], { stdio: 'inherit' })
  }
  await runTestFiles(args, [])
}
"""

[tasks."watch:buildAndTest"]
description = "Build and test in watch mode"
run = [{ tasks = ["watch:build", "watch:test"] }]

