run = """
{{vars.dispatch_workspace_node}}
runWorkspaceNode('packages/dev-script/task-util', 'depends', ['--sources', 'sh:echo Infinity', '--outputs', 'sh:podman image exists monochromatic-playwright && echo Infinity || echo -Infinity', '--', 'podman', 'build', '-t', 'monochromatic-playwright', '-f', 'playwright.Dockerfile', '.'])
"""

[tasks.prepareAndBuild]
description = "Complete setup: prepare environment and build all artifacts"
run = [{ tasks = ["prepare"] }, { tasks = ["build"] }]

[tasks.prepareAndBuild--allowFailure]
description = "Complete setup: prepare and build, allowing failures"
run = ["mise run try -- prepare", "mise run try -- build"]

#endregion Preparation Tasks

