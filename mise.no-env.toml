[task_templates.prepare]
shell = "node -e"
run = "{{vars.fanout}}"

#region tasks
#
# Task naming follows `${category}${optional(`--${modifier}`)}:${child}`
# never use depends or post depends, use run only because it's the easiest to understand.

#region Utility Tasks

[tasks.try]
description = "Run a task, tolerating failures"
usage = 'arg "task" help="Task name to run with failure tolerance"'
shell = "node -e"
run = """
const { execFileSync } = await import('node:child_process')
// Deliberately tolerant: the child's stderr is inherited (so its failure is
// visible), and try only stops the non-zero exit from propagating.
try { execFileSync('mise', ['run', process.env.usage_task], { stdio: 'inherit' }) } catch { /* tolerated */ }
"""

#endregion Utility Tasks

#region Build Tasks

[tasks.build]
description = "Build all packages, fanout to every package's 'build' task"
run = "mise '//packages/...:build'"

# Monorepo glob syntax: // = absolute from root, ... = all config roots, :task = task name.
# https://mise.jdx.dev/tasks/monorepo.html

[tasks."watch:build"]
description = "Build all packages in watch mode, fanout to every package's 'watch:build' task"
run = "mise '//packages/...:watch:build'"

#endregion Build Tasks

#region Test Tasks

# When args are provided, only unit tests run with those args (for single-file filtering).
# When no args are provided, all test suites (unit + browser) run.
[tasks.test]
description = "Run all tests, or pass args to filter unit tests"
alias = "t"
usage = 'arg "[args]" var=#true help="Test file paths (when provided, only unit tests run)"'
shell = "node -e"
run = """
{{vars.parse_usage_args}}
{{vars.run_test_files}}
const args = parseUsageArgs(process.env.usage_args ?? '')
if (args.length === 0) {
  const suites = ['test:unit', 'test:browser', 'test:e2e']
  const processes = suites.map((suite) => spawn('mise', ['run', suite], { stdio: 'inherit' }))
  const exits = await Promise.all(processes.map((proc) => once(proc, 'exit')))
  const failed = suites.filter((suite, index) => exits[index][0] !== 0)
  if (failed.length > 0) { throw new Error(`test suites failed: ${failed.join(', ')}`) }
} else {
  await runTestFiles(args, [])
}
"""

[tasks."test:unit"]
extends = "test:unit"

[tasks."test:browser"]
hide = true
description = "Run browser tests with Playwright in podman"
usage = 'arg "[args]" var=#true help="Additional arguments passed to playwright"'
shell = "node -e"
run = """
{{vars.parse_usage_args}}
const { execFileSync } = await import('node:child_process')
execFileSync('mise', ['run', 'prepare:playwright'], { stdio: 'inherit' })
const args = parseUsageArgs(process.env.usage_args ?? '')
execFileSync('podman', ['run', '--rm', '-v', `${process.cwd()}:/work:Z`, '-w', '/work', 'monochromatic-playwright', 'npx', 'playwright', 'test', '--config', 'playwright.browser.config.ts', ...args], { stdio: 'inherit' })
"""

[tasks."test:e2e"]
