#region Preparation Tasks

# Invoked by the `enter` hook on first `cd`, before any tool is installed. The
# array `run` lets mise sequence the two commands and stop on the first failure,
# with no shell-specific chaining, so it works under both `sh` and `cmd`. mise
# itself is the only prerequisite, so this runs on a fresh clone with no manual
# step (replacing the former "run `mise install` manually once" instruction).
[tasks.bootstrap]
description = "Install and upgrade mise-managed tools (runs on directory entry)"
run = ["mise install", "mise upgrade"]

[tasks.prepare]
description = "Prepare environment (install Playwright browsers, etc.)"
shell = "node -e"
run = """
const { execFileSync, spawn } = await import('node:child_process')
const { once } = await import('node:events')
execFileSync('mise', ['run', 'prepare:pnpm'], { stdio: 'inherit' })
const prefix = `${process.env.MISE_TASK_NAME}:`
const depth = prefix.split(':').length
const pnpmTask = `${prefix}pnpm`
const tasks = JSON.parse(execFileSync('mise', ['tasks', '--all', '--hidden', '--json'], { encoding: 'utf8' }))
const children = tasks.map((task) => task.name).filter((name) => name.startsWith(prefix) && name.split(':').length === depth && name !== pnpmTask)
const processes = children.map((name) => spawn('mise', ['run', name], { stdio: 'inherit' }))
const exits = await Promise.all(processes.map((proc) => once(proc, 'exit')))
const failed = children.filter((name, index) => exits[index][0] !== 0)
if (failed.length > 0) { throw new Error(`prepare child tasks failed: ${failed.join(', ')}`) }
"""

[tasks."prepare:pnpm"]
run = [{ tasks = ["prepare:pnpm:install"] }, { tasks = ["prepare:pnpm:others:*"] }]

[tasks."prepare:pnpm:install"]
alias = "pi"
run = "pnpm install"

[tasks."prepare:pnpm:others:approve-builds"]
description = "Approve build scripts for native dependencies"
run = "pnpm approve-builds sharp"

[tasks."prepare:pnpm:others:files"]
