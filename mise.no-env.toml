# harper:ignore

# mise configuration - replaces proto and moon
# https://mise.jdx.dev/configuration.html
# After cloning, run `mise trust` to mark this file as trustworthy.
# Mise refuses to evaluate env vars, templates, and `path:` plugin versions
# in untrusted config files. Trusting the monorepo root implicitly trusts
# all descendant config files (packages/**/mise.toml).
# https://mise.jdx.dev/cli/trust.html

# Enables monorepo task discovery: tasks in subdirectories are auto-discovered
# and prefixed with their relative paths, creating a unified task namespace.
# https://mise.jdx.dev/tasks/monorepo.html
experimental_monorepo_root = true

[monorepo]
# Each packages/*/* directory with a mise.toml becomes its own config root,
# giving it its own tools, env, and tasks while inheriting from the root.
# packages-deprecated/*/* mirrors the active layout for archived packages that
# remain installable (e.g. via npm) but are no longer actively maintained.
config_roots = [
  "packages/*/*",
  "packages-deprecated/*/*",
]

[tools]
# Migration note: task execution has moved from Bun to Node. Pin retained only
# for tasks still using Bun-specific features that have no Node equivalent:
# hall-monitor's `bun build --compile --bytecode` standalone binary and the
# runtime-error/bun error-output fixtures.
# Pinned to 1.3.14 because the Rust rewrite's robustness invites serious doubts.
bun = "1.3.14"

# Package manager
pnpm = "11"

# aqua:sharkdp/fd broken as of 2026-03-07, falling back to cargo
"cargo:fd-find" = "latest"
ripgrep = "latest"

# Replacing strings
"cargo:fastmod" = "latest"

# Coverage-guided fuzzing for forbidden-strings (see packages/fuzz/forbidden-strings/).
# Pinned to 0.13.1 because the API around `--fuzzing-workspace=true` and
# the libfuzzer-sys integration has shifted across point releases; this
# version is what was verified locally for the rollout.
"cargo:cargo-fuzz" = "0.13.1"

# Primary runtime
# Runs mise task logic (tasks set shell = "node -e") and the packages that
# depend on Node APIs.
node = "latest"

# Non-JS-based linters and formatters
harper-cli = "latest"
dprint = "latest"

# For running Python packages and scripts
uv = "latest"

# Benchmarking
hyperfine = "latest"

# Web Server for deployment
caddy = "latest"

# Required by `mise watch`
watchexec = "latest"

# For reliable timeout
# Rust toolchain, managed repo-wide here (no per-package override).
# Pinned to nightly because cargo-fuzz (coverage-guided fuzzing under
# packages/fuzz/forbidden-strings/) injects `-Cllvm-args=-sanitizer-coverage-*`
# RUSTFLAGS that only compile on nightly; a single root toolchain keeps every
# crate on one channel rather than forking stable/nightly per directory.
# Floating "nightly" tracks the latest; pin to a dated channel
# (e.g. "nightly-2026-05-23") if reproducible builds matter.
# mise applies components only when it installs the toolchain, so an
# already-installed nightly needs a one-time
# `rustup component add <comp> --toolchain nightly`:
#   rust-src           -- std sources for IDE code insight (RustRover / IntelliJ Rust).
#   llvm-tools-preview -- llvm-cov / llvm-profdata for `cargo fuzz coverage`.
# ASAN backtrace symbolization uses the system llvm-symbolizer (not a rustup component).
rust = { version = "nightly", components = "clippy,rust-src,llvm-tools-preview" }
cargo-binstall = "latest"
"cargo:timeout-cli" = "latest"

# Test runner for every Rust package (replaces `cargo test`). nextest gives a
# per-test process isolation model, faster parallel scheduling, and clearer
# output. The `cargo:` backend resolves through cargo-binstall (installed just
# above) to a prebuilt binary, so no slow source build. Inherited by child
# config roots (e.g. packages/fuzz/forbidden-strings), so the nightly fuzz
# crate gets the same runner without its own entry. The two podman-built
# desktop apps install nextest inside their Containerfiles instead, since the
# container filesystem does not see host mise tools.
"cargo:cargo-nextest" = "latest"

# CMake for building vendored C libraries from Rust -sys crates. music-player's
# `opus` dependency (pinned to opus-rs git HEAD in
# packages/desktop-app/music-player/Cargo.toml) uses opusic-sys, whose `bundled`
# feature is on by default and compiles libopus 1.6.1 from source via CMake on
# every platform. The Linux host carries no system cmake, so mise provides it
# here; the two podman-built desktop apps install cmake inside their Containerfiles
# instead, since the container filesystem does not see host mise tools. A CMake
# generator is also required: the host and macOS fall back to system `make` (Unix
# Makefiles), Windows uses the Visual Studio generator, and the containers install
# ninja. See docs/troubleshooting/audiopus-cmake4-libopus-min-version.md.
cmake = "latest"

# rcodesign (the `apple-codesign` crate) signs, notarizes, and staples the
# packages/desktop-app/music-player macOS .app from Linux (the Mach-O is still
# built on the Mac; only signing is cross-platform). Installed from crates.io by
# crate name through the cargo backend, consistent with the other Rust CLIs in
# this list. The crate's single binary is named `rcodesign` (not after the
# crate), so the package's sign:macos task still resolves it on PATH, the same
# way `cargo:timeout-cli` ships a `timeout` binary. The crate ships no
# cargo-binstall metadata, so cargo-binstall falls back to a from-source build
# here rather than fetching a prebuilt archive. See
# docs/decisions/desktop-app-code-signing.md and the package's sign:macos task.
"cargo:apple-codesign" = "latest"

# Zig toolchain for packages/desktop-app/terminal: its libghostty-vt-sys
# build-dependency compiles vendored Ghostty with Zig and requires Zig 0.15.x
# (Fedora packages an older 0.14). Pinned to 0.15.2 to match the version the
# terminal Containerfile fetches (ENV ZIG_VERSION=0.15.2) and
# docs/decisions/desktop-app-podman-build.md, so a host-native build links the
# same Ghostty core as the container build. Bump both together.
zig = "0.15.2"

# Slint language server (.slint completion, diagnostics, live preview) for the
# two desktop-app packages. Pinned to the SAME git rev as their `slint` dependency
# (packages/desktop-app/{terminal,music-player}/Cargo.toml) so the LSP's compiler
# and live preview match the runtime the apps build against; a crates.io release
# (1.16) lags the pinned master rev. Installed from the slint workspace via mise's
# cargo backend: `crate` selects the slint-lsp member (the repo root is a virtual
# workspace, so a bare --git is ambiguous) and `bin` limits the install to the
# slint-lsp binary (skips the slint-editor bin, which upstream marked TODO: Remove
# and which the LSP's own preview supersedes). Default features already give
# backend-default(=winit on Linux) + renderer-femtovg + renderer-software +
# preview, matching the apps' slint feature set, so no `features` override.
"cargo:https://github.com/slint-ui/slint" = { version = "rev:85e3eb76819762cdcaa732fa87533ff896546bac", crate = "slint-lsp", bin = "slint-lsp" }

# Slint standalone live previewer (renders a .slint file in a window without an
# editor), pinned to the SAME rev as slint-lsp and the apps' slint dependency so
# the preview matches the runtime. mise keys a cargo-git tool by its URL (git_url()
# in mise's src/backend/cargo.rs parses the tool name as the repo URL) and has no
# per-crate key, while TOML forbids a duplicate [tools] key; so a second crate from
# the same repo needs a distinct key. The trailing ".git" makes this key unique
# while resolving to the same repository at the same rev (cargo accepts the .git
# URL). `crate` selects the slint-viewer member; `bin` limits the install to the
# slint-viewer binary. Default features match the apps, so no `features` override.
"cargo:https://github.com/slint-ui/slint.git" = { version = "rev:85e3eb76819762cdcaa732fa87533ff896546bac", crate = "slint-viewer", bin = "slint-viewer" }

# AI inference server for local development (packages/webapp-productivity/done).
# Pinned (not "latest") because llama.cpp's release pipeline tags before the
# Linux build finishes uploading, so any "latest" install run during that
# window fails to find a ubuntu-x64 asset. Bump manually after verifying the
# target tag has all 28 assets (including llama-bNNNN-bin-ubuntu-x64.tar.gz).
"github:ggml-org/llama.cpp" = "b9019"

opentofu = "latest"
hcloud = "latest"
"npm:typescript-language-server" = "latest"
"cargo:coreutils" = { version = "latest", features = "unix" }
"npm:socket" = "latest"
betterleaks = "latest"

# Git hook runner
hk = "latest"
# Pkl: hk's config language
pkl = "latest"

[settings]
env_shell_expand = false

# Enable automatic tool installation when entering directory
auto_install = true

# Experimental features
experimental = true

# asdf -> Doesn't support Windows.
disable_backends = ["asdf"]

# Per task timeout not implemented yet in Mise.
# task_timeout = "5s"

# Uncomment when debugging
# verbose = true

status.missing_tools = "always"

# Matches the packages/*/* directory depth (e.g. packages/module/logger = 3 segments).
task.monorepo_depth = 3

# Skip the extra Tera template pass that collects arg()/option()/flag() from run scripts.
# No tasks in this repo use Tera spec functions; only explicit `usage` fields are needed.
# Avoids two-pass parsing quirks and will be the default after Tera arguments are removed in 2026.11.0.
task.disable_spec_from_run_scripts = true

# No global shell override: mise uses its platform defaults (sh -c -o errexit on
# unix, cmd /c on Windows). Trivial single-command bodies and array `run` runners
# work under both. Bodies needing logic, structured data, or non-portable syntax
# declare `shell = "node -e"` per task (node -e strips TS, runs ESM imports, and
# supports top-level await).

[hooks]
# Runs at first `cd` before any tool is installed, so it must be cross-platform
# and depend only on mise itself (the one guaranteed prerequisite). It delegates
# to the `bootstrap` task: `mise install` installs missing tools, `mise upgrade`
# re-resolves "latest" and installs newer versions. Hooks require a string body,
# so the array `run` (which mise sequences and fails fast on) lives on the task.
enter = { task = "bootstrap" }

[vars]
# Monorepo root for task templates that need to reference root-level config files.
monorepo_root = "{{config_root}}"
# node -e fanout script: discovers direct child tasks (one `:` level deeper) and
# runs each as a plain `mise run <child>` subprocess, all in parallel, then fails
# if any child failed. No `:::` separator or other mise-specific inline sugar:
# each child is an ordinary shelled `mise run`, and Node owns the concurrency.
# Interpolated into the fanout task templates, each of which sets
# `shell = "node -e"`. Runtime depth filtering is still required because the
# native `[{ tasks = ["prefix:*"] }]` glob matches all descendants, since mise
# treats `:` as a regular character in `*` globs.
fanout = """
const { execFileSync, spawn } = await import('node:child_process')
const { once } = await import('node:events')
const prefix = `${process.env.MISE_TASK_NAME}:`
const depth = prefix.split(':').length
const tasks = JSON.parse(execFileSync('mise', ['tasks', '--all', '--hidden', '--json'], { encoding: 'utf8' }))
const children = tasks.map((task) => task.name).filter((name) => name.startsWith(prefix) && name.split(':').length === depth)
if (children.length === 0) { throw new Error(`no child tasks for ${process.env.MISE_TASK_NAME}`) }
const processes = children.map((name) => spawn('mise', ['run', name], { stdio: 'inherit' }))
const exits = await Promise.all(processes.map((proc) => once(proc, 'exit')))
const failed = children.filter((name, index) => exits[index][0] !== 0)
if (failed.length > 0) { throw new Error(`fanout child tasks failed: ${failed.join(', ')}`) }
"""
# Bootstrap-safe dispatch to any workspace package's node entry. Resolves the
# monorepo root (mise sets MISE_MONOREPO_ROOT in monorepo mode; the fallback
# covers non-monorepo invocations), then runs the entry's built dist when present,
# else its TS source through node. runWorkspaceNode(packagePath, entryName, args)
# dispatches a package entry; ensureOxlintConfig builds the root oxlint config on
# fresh trees and rebuilds it when bundled plugin sources are newer than the
# sidecar outputs. Interpolated into the dispatcher tasks (root and per-package),
# each of which sets `shell = "node -e"`. Its imported bindings are reused by any
# inline follow-up in those bodies, so the follow-up must not reimport them.
dispatch_workspace_node = """
const { existsSync, readdirSync, statSync } = await import('node:fs')
const { join, resolve } = await import('node:path')
const { execFileSync } = await import('node:child_process')
const configRoot = process.env.MISE_CONFIG_ROOT ?? process.cwd()
const monorepoRoot = process.env.MISE_MONOREPO_ROOT ?? (existsSync(join(configRoot, 'mise.no-env.toml')) ? configRoot : resolve(configRoot, '..', '..', '..'))
const runWorkspaceNode = (packagePath, entryName, entryArgs) => {
  const packageRoot = join(monorepoRoot, packagePath)
  const built = join(packageRoot, 'dist', 'final', 'node', `${entryName}.mjs`)
  const source = join(packageRoot, 'src', `${entryName}.ts`)
  const entry = existsSync(built) ? built : existsSync(source) ? source : null
  if (entry === null) { throw new Error(`missing built or source entry: ${packagePath}/${entryName}`) }
  execFileSync('node', [entry, ...entryArgs], { stdio: 'inherit' })
}
const newestMtime = (path) => {
  const stats = statSync(path)
  if (!stats.isDirectory()) { return stats.mtimeMs }
  return readdirSync(path, { withFileTypes: true }).reduce((newest, entry) => {
    const entryPath = join(path, entry.name)
    if (entry.isDirectory()) { return Math.max(newest, newestMtime(entryPath)) }
    if (entry.isFile()) { return Math.max(newest, statSync(entryPath).mtimeMs) }
    return newest
  }, stats.mtimeMs)
}
const shouldBuildOxlintConfig = () => {
  const outputPaths = [
    join(monorepoRoot, 'packages', 'config', 'oxlint', 'dist', 'final', 'node', 'index.mjs'),
    join(monorepoRoot, 'packages', 'config', 'oxlint', 'dist', 'final', 'node', 'plugin-no-restricted-syntax.mjs'),
    join(monorepoRoot, 'packages', 'config', 'oxlint', 'dist', 'final', 'node', 'plugin-stylistic.mjs'),
    join(monorepoRoot, 'packages', 'config', 'oxlint', 'dist', 'final', 'node', 'plugin-tsdoc.mjs'),
  ]
  if (outputPaths.some((outputPath) => !existsSync(outputPath))) { return true }
  const sourcePaths = [
    join(monorepoRoot, 'packages', 'config', 'oxlint', 'src'),
    join(monorepoRoot, 'packages', 'config', 'oxlint', 'tsdown.node.config.ts'),
    join(monorepoRoot, 'packages', 'oxlint-plugins', 'no-restricted-syntax', 'src'),
    join(monorepoRoot, 'packages', 'oxlint-plugins', 'stylistic', 'src'),
    join(monorepoRoot, 'packages', 'oxlint-plugins', 'tsdoc', 'src'),
  ]
  const oldestOutputMtime = Math.min(...outputPaths.map((outputPath) => statSync(outputPath).mtimeMs))
  const newestSourceMtime = Math.max(...sourcePaths.map(newestMtime))
  return newestSourceMtime > oldestOutputMtime
}
const ensureOxlintConfig = () => {
  if (shouldBuildOxlintConfig()) { execFileSync('mise', ['run', '//packages/config/oxlint:build:js:node'], { stdio: 'inherit' }) }
}
"""
# Shell-word parser for mise's usage_args, which arrives as a single shell-escaped
# string (e.g. a path with a space becomes `'weird name.ts'`). Recovers the
# original argument vector: bare tokens split on spaces, single/double-quoted
# spans kept whole, backslash escapes honoured.
# Interpolated into tasks that take positional file-path args.
parse_usage_args = """
const parseUsageArgs = (raw) => {
  const argv = []
  let current = null
  let index = 0
  while (index < raw.length) {
    const char = raw[index]
    if (current === null) {
      if (char === ' ') { index += 1; continue }
      current = ''
    }
    if (char === '\\\\') { current += raw[index + 1] ?? ''; index += 2; continue }
    if (char === "'" || char === '"') {
      index += 1
      while (index < raw.length && raw[index] !== char) { current += raw[index]; index += 1 }
      index += 1
      continue
    }
    if (char === ' ') { argv.push(current); current = null; index += 1; continue }
    current += char
    index += 1
  }
  if (current !== null) { argv.push(current) }
  return argv
}
"""
# Runs a list of test files as `node [nodeArgs] <file>` subprocesses, bounded to
# availableParallelism() at a time, and throws listing any that exited non-zero.
# Interpolated into the test tasks; each sets `shell = "node -e"`.
run_test_files = """
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { availableParallelism } = await import('node:os')
const runTestFiles = async (files, nodeArgs) => {
  if (files.length === 0) { return }
  const limit = Math.max(1, Math.min(availableParallelism(), files.length))
  const failures = []
  let next = 0
  const worker = async () => {
    while (next < files.length) {
      const file = files[next]
      next += 1
      const proc = spawn('node', [...nodeArgs, file], { stdio: 'inherit' })
      const [code] = await once(proc, 'exit')
      if (code !== 0) { failures.push(file) }
    }
  }
  await Promise.all(Array.from({ length: limit }, worker))
  if (failures.length > 0) { throw new Error(`test files failed: ${failures.join(', ')}`) }
}
"""

