[tasks.observe]
quiet = true
shell = "node --input-type=module-typescript -e"
run = '''
const {readFileSync,writeFileSync,mkdirSync,chmodSync,appendFileSync}=await import('node:fs');const {homedir,hostname,availableParallelism,totalmem}=await import('node:os');const {join}=await import('node:path');const {execFileSync,spawnSync}=await import('node:child_process');const {createHash,randomBytes}=await import('node:crypto');const {strict:assert}=await import('node:assert');const sha=b=>createHash('sha256').update(b).digest('hex');const root=process.env.GITHUB_WORKSPACE;assert(root);const scratch=join(homedir(),'temp/agent');mkdirSync(scratch,{recursive:true,mode:0o700});chmodSync(scratch,0o700);const evidence=join(scratch,'depot-cache-job-identity-evidence');mkdirSync(evidence,{recursive:true,mode:0o700});appendFileSync(process.env.GITHUB_OUTPUT,'evidence-path='+evidence+'\n');const names=['DEPOT_CACHE_TOKEN','DEPOT_JIT_TOKEN','DEPOT_TOKEN','SCCACHE_WEBDAV_TOKEN','SCCACHE_WEBDAV_USERNAME','SCCACHE_WEBDAV_PASSWORD','SCCACHE_WEBDAV_ENDPOINT','ACTIONS_RUNTIME_TOKEN','ACTIONS_CACHE_URL','ACTIONS_RESULTS_URL','ACTIONS_ID_TOKEN_REQUEST_URL','ACTIONS_ID_TOKEN_REQUEST_TOKEN'];const present=Object.fromEntries(names.map(name=>[name,Boolean(process.env[name])]));const tools=Object.fromEntries(['depot','sccache','cargo','rustc'].map(name=>{const probe=spawnSync(name,['--version'],{encoding:'utf8',timeout:10000});return [name,{present:!probe.error,exitStatus:probe.status,version:probe.status===0?probe.stdout.trim():null,errorCode:probe.error?.code??null}]}));const proof={schemaVersion:1,provider:'depot-ci',createdAt:new Date().toISOString(),sourceHead:execFileSync('git',['rev-parse','HEAD'],{cwd:root,encoding:'utf8'}).trim(),sourceHashes:{workflow:sha(readFileSync(join(root,'.depot/workflows/depot-cache-auth-probe.yml'))),tasks:sha(readFileSync('mise.toml'))},runner:{hostname:hostname(),bootId:readFileSync('/proc/sys/kernel/random/boot_id','utf8').trim(),cpus:availableParallelism(),memoryBytes:totalmem(),node:process.version},variablePresence:present,tools,authorization:{credentialSource:null,excluded:['DEPOT_TOKEN','local CLI config','ACTIONS_RUNTIME_TOKEN','GitHub OIDC exchange'],org:'l4zncjjbj5',note:'Presence is observed without exposing values; source permits Cache/JIT job-token fallback. No long-lived secret added.'},roundtrip:{attempted:false,reason:'No Cache/JIT credential provided in job environment'}};const source=['DEPOT_CACHE_TOKEN','DEPOT_JIT_TOKEN','SCCACHE_WEBDAV_TOKEN'].find(name=>present[name]);let token=source?process.env[source]:null;let credentialSource=source;if(!token&&present.SCCACHE_WEBDAV_PASSWORD&&present.SCCACHE_WEBDAV_USERNAME){token=process.env.SCCACHE_WEBDAV_PASSWORD;credentialSource='SCCACHE_WEBDAV_PASSWORD';}if(token){proof.authorization.credentialSource=credentialSource;const body=Buffer.from('monochromatic-bounded-cache-auth-probe|'+proof.sourceHead+'|'+randomBytes(32).toString('hex'));const key=sha(body);const url='https://cache.depot.dev/'+key;const username=credentialSource==='SCCACHE_WEBDAV_PASSWORD'?process.env.SCCACHE_WEBDAV_USERNAME:'l4zncjjbj5';const authorization='Basic '+Buffer.from(username+':'+token).toString('base64');proof.roundtrip={attempted:true,endpointOrigin:'https://cache.depot.dev',key,bytes:body.length,sha256:sha(body),authentication:'Org-scoped Basic auth as used by depot cargo and documented Gradle Cache',putStatus:null,getStatus:null,bytesMatched:false};try{const put=await fetch(url,{method:'PUT',headers:{Authorization:authorization,'Content-Type':'application/vnd.gradle.build-cache-artifact.v2'},body,redirect:'error',signal:AbortSignal.timeout(15000)});proof.roundtrip.putStatus=put.status;await put.body?.cancel();if(put.ok){const get=await fetch(url,{headers:{Authorization:authorization,Accept:'application/vnd.gradle.build-cache-artifact.v2, */*'},redirect:'error',signal:AbortSignal.timeout(15000)});proof.roundtrip.getStatus=get.status;const bytes=Buffer.from(await get.arrayBuffer());proof.roundtrip.returnedBytes=bytes.length;proof.roundtrip.returnedSha256=sha(bytes);proof.roundtrip.bytesMatched=get.ok&&bytes.equals(body);proof.roundtrip.reason=proof.roundtrip.bytesMatched?'Authenticated HTTP Cache PUT/GET matched fixture':'Cache PUT accepted but GET did not reproduce fixture';}else{proof.roundtrip.reason='Cache PUT returned HTTP '+put.status;}}catch(error){proof.roundtrip.transportErrorName=error instanceof Error?error.name:'UnknownThrownValue';proof.roundtrip.reason='Bounded HTTP request failed; response body and credential were not logged';}}proof.finishedAt=new Date().toISOString();writeFileSync(join(evidence,'identity.json'),JSON.stringify(proof,null,2)+'\n');console.log('CACHE_AUTH_PROOF '+JSON.stringify(proof));if(proof.roundtrip.putStatus!==null&&proof.roundtrip.putStatus>=200&&proof.roundtrip.putStatus<300)assert(proof.roundtrip.bytesMatched,'Cache PUT succeeded without matching GET bytes');
'''
