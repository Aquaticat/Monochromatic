[tasks.workload]
shell = "node --input-type=module-typescript -e"
run = "\nimport {readFileSync,writeFileSync,mkdirSync,realpathSync,existsSync} from 'node:fs';\nimport {join} from 'node:path';import {spawnSync,execFileSync,spawn} from 'node:child_process';\nimport {once} from 'node:events';import {createGuardedApi} from './api-proxy.ts';\nimport {createHash} from 'node:crypto';import {gunzipSync} from 'node:zlib';import {availableParallelism,totalmem} from 'node:os';\nimport {strict as assert} from 'node:assert';\nconst root=realpathSync(process.env.GITHUB_WORKSPACE??execFileSync('git',['rev-parse','--show-toplevel'],{encoding:'utf8'}).trim());\nconst here=join(root,'.depot/probe/native-buildkit-auth');const manifest=JSON.parse(readFileSync(join(here,'manifest.json'),'utf8'));\nconst out=join(here,'output');const receipts=join(out,'receipts');const home=join(out,'empty-home');const temp=join(out,'temp');\nfor(const path of [receipts,home,temp,join(home,'.config')])mkdirSync(path,{recursive:true,mode:0o700});\nconst hash=value=>createHash('sha256').update(value).digest('hex');const token=process.env.DEPOT_TOKEN;\nconst record={schemaVersion:1,startedAt:new Date().toISOString(),frozenSource:manifest.frozenSource,harness:execFileSync('git',['rev-parse','HEAD'],{cwd:root,encoding:'utf8'}).trim(),projectId:manifest.projectId,cohort:manifest.cohort,native:{architecture:process.arch,cpuCount:availableParallelism(),memoryBytes:totalmem()},jobTokenPresent:Boolean(token),onlyInjectedCredential:true,persistentSecretCreated:false,commands:[],requests:[],buildCreateRequests:0,accountWideListing:false,automaticOneCommandCliPathExercised:true,apiAuthorizationThenNormalDerivedBuildTokenAttachment:false};\nlet api;const scrub=value=>String(value).replaceAll(token??'no-token-sentinel','[redacted]');\nfunction save(){const text=JSON.stringify(record,null,2)+'\\n';if(token)assert(!text.includes(token));writeFileSync(join(receipts,'profile.json'),text);}\nfunction command(label,args,environment,maximum=20000){const start=Date.now();const result=spawnSync('depot',args,{cwd:here,env:environment,encoding:'utf8',maxBuffer:4*1024*1024,timeout:maximum,killSignal:'SIGKILL'});const stdout=scrub(result.stdout??'');const stderr=scrub(result.stderr??'');writeFileSync(join(receipts,label+'.stdout'),stdout);writeFileSync(join(receipts,label+'.stderr'),stderr);const row={label,args,status:result.status,signal:result.signal,elapsedMilliseconds:Date.now()-start,error:result.error?{name:result.error.name,code:result.error.code,message:scrub(result.error.message)}:null,stdoutSha256:hash(stdout),stderrSha256:hash(stderr)};record.commands.push(row);save();return {row,stdout,stderr};}\n\nasync function buildCommand(args,environment,maximum){\nconst start=Date.now();const child=spawn('depot',args,{cwd:here,env:environment,stdio:['ignore','pipe','pipe']});const stdout=[];const stderr=[];let bytes=0;let exceeded=false;\nfunction capture(chunks,chunk){bytes+=chunk.length;if(bytes>4*1024*1024){exceeded=true;child.kill('SIGKILL');}else chunks.push(chunk);}\nchild.stdout.on('data',chunk=>capture(stdout,chunk));child.stderr.on('data',chunk=>capture(stderr,chunk));\nconst timer=setTimeout(()=>child.kill('SIGTERM'),maximum);const hard=setTimeout(()=>child.kill('SIGKILL'),maximum+10000);\nlet status;let signal;try{[status,signal]=await once(child,'close');}finally{clearTimeout(timer);clearTimeout(hard);}\nconst output=scrub(Buffer.concat(stdout).toString('utf8'));const diagnostic=scrub(Buffer.concat(stderr).toString('utf8'));\nwriteFileSync(join(receipts,'job-token-cli.stdout'),output);writeFileSync(join(receipts,'job-token-cli.stderr'),diagnostic);\nconst row={label:'job-token-cli',args,status,signal,elapsedMilliseconds:Date.now()-start,exceeded,stdoutSha256:hash(output),stderrSha256:hash(diagnostic)};record.commands.push(row);save();return {row,stdout:output,stderr:diagnostic};\n}\nsave();\ntry{\nassert.equal(process.platform,'linux');assert.equal(process.arch,'x64');assert(availableParallelism()<=2);assert(totalmem()<=8*1024**3);\nassert(typeof token==='string'&&token.length>20);assert(/^[a-z0-9]{10}$/u.test(manifest.projectId));\nassert.equal(hash(readFileSync(join(root,manifest.sourcePath))),manifest.sourceSha256);\nassert.equal(hash(readFileSync(join(here,'context/task-queue.ts'))),manifest.sourceSha256);\nexecFileSync('git',['diff','--exit-code',manifest.frozenSource,'--','.',':!.depot'],{cwd:root});\nconst environment={PATH:process.env.PATH,HOME:home,XDG_CONFIG_HOME:join(home,'.config'),TMPDIR:temp,LANG:'C.UTF-8',DEPOT_NO_SUMMARY_LINK:'1'};\nconst version=command('cli-version',['version'],environment);assert.equal(version.row.status,0);assert(version.stdout.includes('2.102.23'));\nconst negative=command('missing-token',['build','--project',manifest.projectId,'--platform','linux/amd64','context'],environment);assert.notEqual(negative.row.status,0);assert((negative.stdout+negative.stderr).includes('missing API token'));record.missingTokenRejectedBeforeBuildAdmission=true;save();\napi=await createGuardedApi({projectId:manifest.projectId,expectedInitialAuthorization:'Bearer '+token,rows:record.requests,onUpdate:save});\nconst metadata=join(receipts,'build-metadata.json');const exported=join(out,'exported');\nconst built=await buildCommand(['build','--project',manifest.projectId,'--platform','linux/amd64','--build-platform','linux/amd64','--provenance','mode=max','--progress','plain','--metadata-file',metadata,'--save','--save-tag',manifest.cohort,'context'],{...environment,DEPOT_TOKEN:token,DEPOT_API_URL:api.url},125000);\nassert.equal(built.row.status,0,built.stderr.slice(-2000));assert.equal(api.stats.createRequests,1);assert.equal(api.stats.initialCredentialMatched,true);assert.equal(api.stats.deniedRequests,0);const image=JSON.parse(readFileSync(metadata,'utf8'));assert(/^[a-z0-9]+$/u.test(image['depot.build'].buildID));record.build={id:image['depot.build'].buildID,projectId:manifest.projectId,authorizedByInjectedJobToken:true};assert.equal(image['depot.build'].projectID,manifest.projectId);record.build.exporter='image';assert(/^sha256:[a-f0-9]{64}$/u.test(image['containerimage.digest']));record.build.digest=image['containerimage.digest'];\n\nconst host=manifest.organizationId+'.registry.depot.dev';const repository=manifest.projectId;const origin='https://'+host;const prefix='/v2/'+repository+'/';\nasync function request(label,url,authorization,maximum=131072){const target=new URL(url);assert(target.origin===origin||target.origin==='https://api.depot.dev');if(target.origin==='https://api.depot.dev')assert.equal(target.pathname,'/auth/registry/token');let current=target;let auth=authorization;let response;let redirectCount=0;for(;redirectCount<=4;redirectCount++){response=await fetch(current,{headers:{Accept:'application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json',...(auth?{Authorization:auth}:{})},signal:AbortSignal.timeout(8000),redirect:'manual'});if(![301,302,303,307,308].includes(response.status))break;assert(redirectCount<4);const next=new URL(response.headers.get('location'),current);assert.equal(next.protocol,'https:');assert(!next.username&&!next.password);if(next.origin!==current.origin)auth=undefined;await response.body?.cancel();current=next;}const parts=[];let size=0;if(response.body)for await(const chunk of response.body){size+=chunk.length;if(size>maximum){throw new Error('Owned tiny registry response exceeded declared byte bound');}parts.push(chunk);}const bytes=Buffer.concat(parts);const row={kind:'registry-read',label,host:current.hostname,path:current.pathname,redirectCount,status:response.status,bytes:size,sha256:hash(bytes),mediaType:response.headers.get('content-type'),digest:response.headers.get('docker-content-digest'),challenge:response.headers.get('www-authenticate')};record.requests.push(row);save();return {response,bytes,row};}\nconst tagUrl=origin+prefix+'manifests/'+manifest.cohort;const anonymous=await request('registry-anonymous',tagUrl);assert.equal(anonymous.row.status,401);const challenge=anonymous.row.challenge;assert(challenge?.startsWith('Bearer '));const fields=Object.fromEntries([...challenge.matchAll(/([a-zA-Z]+)=\"([^\"]*)\"/gu)].map(row=>[row[1],row[2]]));assert.equal(fields.realm,'https://api.depot.dev/auth/registry/token');assert.equal(fields.service,host);assert.equal(fields.scope,'repository:'+repository+':pull');\nasync function exchange(label,credential){const url=new URL(fields.realm);url.searchParams.set('service',fields.service);url.searchParams.set('scope',fields.scope);const got=await request(label,url,'Basic '+Buffer.from('x-token:'+credential).toString('base64'));if(!got.response.ok)return null;const payload=JSON.parse(got.bytes);const scoped=payload.token??payload.access_token;assert(typeof scoped==='string'&&scoped.length>20);return 'Bearer '+scoped;}\nconst invented=await exchange('invented-token-exchange','owned-invented-invalid-token');let negativeStatus;if(invented)negativeStatus=(await request('invented-token-read',tagUrl,invented)).row.status;else negativeStatus=record.requests.at(-1).status;assert([401,403].includes(negativeStatus));const authorization=await exchange('native-job-token-exchange',token);assert(authorization);const indexRead=await request('native-job-token-manifest',tagUrl,authorization);assert.equal(indexRead.row.status,200);assert.equal('sha256:'+hash(indexRead.bytes),image['containerimage.digest']);writeFileSync(join(receipts,'registry-index.json'),indexRead.bytes);const rootManifest=JSON.parse(indexRead.bytes);let runnable=rootManifest;let runnableDigest=image['containerimage.digest'];if(rootManifest.manifests){const matches=rootManifest.manifests.filter(item=>item.platform?.architecture==='amd64'&&item.platform?.os==='linux');assert.equal(matches.length,1);runnableDigest=matches[0].digest;const fetched=await request('native-job-token-image-manifest',origin+prefix+'manifests/'+runnableDigest,authorization);assert.equal(fetched.row.status,200);assert.equal(fetched.bytes.length,matches[0].size);assert.equal('sha256:'+hash(fetched.bytes),runnableDigest);runnable=JSON.parse(fetched.bytes);writeFileSync(join(receipts,'registry-image-manifest.json'),fetched.bytes);}assert.equal(runnable.schemaVersion,2);assert.equal(runnable.layers.length,1);const config=await request('native-job-token-image-config',origin+prefix+'blobs/'+runnable.config.digest,authorization);assert.equal(config.row.status,200);assert.equal(config.bytes.length,runnable.config.size);assert.equal('sha256:'+hash(config.bytes),runnable.config.digest);const configObject=JSON.parse(config.bytes);assert.equal(configObject.architecture,'amd64');assert.equal(configObject.os,'linux');writeFileSync(join(receipts,'registry-image-config.json'),config.bytes);const layer=runnable.layers[0];assert(['application/vnd.oci.image.layer.v1.tar+gzip','application/vnd.docker.image.rootfs.diff.tar.gzip'].includes(layer.mediaType));assert(layer.size<131072);const blob=await request('native-job-token-image-layer',origin+prefix+'blobs/'+layer.digest,authorization);assert.equal(blob.row.status,200);assert.equal(blob.bytes.length,layer.size);assert.equal('sha256:'+hash(blob.bytes),layer.digest);assert.deepEqual(configObject.rootfs.diff_ids,['sha256:'+hash(gunzipSync(blob.bytes))]);const layerPath=join(receipts,'registry-layer.tar.gz');writeFileSync(layerPath,blob.bytes);const listing=execFileSync('tar',['--list','--gzip','--file',layerPath],{encoding:'utf8',timeout:10000,maxBuffer:131072});const names=listing.trim().split('\\n').filter(name=>name!=='.'&&name!=='./');const normal=name=>name.startsWith('./')?name.slice(2):name;assert(names.every(name=>['result.json','task-queue.ts'].includes(normal(name))));assert.equal(new Set(names.map(normal)).size,2);assert.equal(names.length,2);function take(name){const actual=names.find(item=>normal(item)===name);assert(actual);return execFileSync('tar',['--extract','--to-stdout','--gzip','--file',layerPath,actual],{timeout:10000,maxBuffer:131072});}const resultBytes=take('result.json');const queueBytes=take('task-queue.ts');const result=JSON.parse(resultBytes);assert.equal(result.frozenSource,manifest.frozenSource);assert.equal(result.cohort,manifest.cohort);assert.equal(result.sourceSha256,manifest.sourceSha256);assert.equal(hash(queueBytes),manifest.sourceSha256);assert.deepEqual(result.ran,['one','two']);assert.deepEqual(result.rejected,['three:owned-control']);assert.equal(result.hardwareBoundsEnforced,true);assert(result.cpuCount<=16&&result.memoryBytes<=32*1024**3);assert.equal(result.emptyQueueSize,0);writeFileSync(join(receipts,'registry-result.json'),resultBytes);writeFileSync(join(receipts,'registry-task-queue.ts'),queueBytes);const imported=await import('./output/receipts/registry-task-queue.ts');const queue=imported.createTaskQueue();let executed=false;queue.enqueue({run(){executed=true;},reject(){throw new Error('Unexpected consumer rejection');}});assert.equal(queue.size,1);for(const item of queue.take(1))item.run();assert.equal(executed,true);assert.equal(queue.size,0);\nconst attestationGraphs=[];const descriptors=(rootManifest.manifests??[]).filter(item=>item.digest!==runnableDigest);assert(descriptors.length<=3);for(const [i,descriptor]of descriptors.entries()){assert(descriptor.size<131072);const response=await request('attestation-manifest-'+i,origin+prefix+'manifests/'+descriptor.digest,authorization);assert.equal(response.row.status,200);assert.equal(response.bytes.length,descriptor.size);assert.equal('sha256:'+hash(response.bytes),descriptor.digest);writeFileSync(join(receipts,'registry-attestation-manifest-'+i+'.json'),response.bytes);const object=JSON.parse(response.bytes);assert((object.layers??[]).length<=4);const blobs=[];for(const [j,part]of [object.config,...(object.layers??[])].entries()){assert(part&&part.size<131072);const value=await request('attestation-blob-'+i+'-'+j,origin+prefix+'blobs/'+part.digest,authorization);assert.equal(value.row.status,200);assert.equal(value.bytes.length,part.size);assert.equal('sha256:'+hash(value.bytes),part.digest);writeFileSync(join(receipts,'registry-attestation-blob-'+i+'-'+j+'.json'),value.bytes);blobs.push(part);}attestationGraphs.push({descriptor,blobs});}\nrecord.builder=result;record.registry={qualified:true,anonymousStatus:anonymous.row.status,inventedTokenStatus:negativeStatus,jobTokenManifestStatus:indexRead.row.status,sourceCredential:'Only native injected DEPOT_TOKEN; standard repository-scoped pull exchange in process',scope:fields.scope,indexDigest:image['containerimage.digest'],imageManifestDigest:runnableDigest,config:runnable.config,layer,exactGraphAndBlobHashes:true,attestationGraphs,configDiffIdMatchesDecompressedLayer:true,frozenSourceBytesMatch:true,actualExportedQueueImportAndExecution:true,ordinaryContainerRuntimePullClaim:false,privateCredentialsPersisted:false};record.exportedFileConsumerPassed=true;record.registryImageFileConsumerPassed=true;record.campaignAdmission={attempt:3,previousRuns:['dzsf27t0xx','pxx75mxnw2'],additionalFullWindowReservationUsd:.23,cumulativeFullWindowReservationUsd:.69,nominalCampaignGuardUsd:1};save();\nrecord.completed=true;save();\n}catch(error){record.failure={name:error.name,message:scrub(error.message)};throw error;}\nfinally{if(api){await api.close();record.apiGuard={...api.stats};record.buildCreateRequests=api.stats.createRequests;}record.finishedAt=new Date().toISOString();save();}\n"
