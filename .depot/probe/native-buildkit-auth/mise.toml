[tasks.workload]
shell = "node --input-type=module-typescript -e"
run = "\nimport {readFileSync,writeFileSync,mkdirSync,realpathSync,existsSync} from 'node:fs';\nimport {join} from 'node:path';import {spawnSync,execFileSync} from 'node:child_process';\nimport {createHash} from 'node:crypto';import {availableParallelism,totalmem} from 'node:os';\nimport {strict as assert} from 'node:assert';\nconst root=realpathSync(process.env.GITHUB_WORKSPACE??execFileSync('git',['rev-parse','--show-toplevel'],{encoding:'utf8'}).trim());\nconst here=join(root,'.depot/probe/native-buildkit-auth');const manifest=JSON.parse(readFileSync(join(here,'manifest.json'),'utf8'));\nconst out=join(here,'output');const receipts=join(out,'receipts');const home=join(out,'empty-home');const temp=join(out,'temp');\nfor(const path of [receipts,home,temp,join(home,'.config')])mkdirSync(path,{recursive:true,mode:0o700});\nconst hash=value=>createHash('sha256').update(value).digest('hex');const token=process.env.DEPOT_TOKEN;\nconst record={schemaVersion:1,startedAt:new Date().toISOString(),frozenSource:manifest.frozenSource,harness:execFileSync('git',['rev-parse','HEAD'],{cwd:root,encoding:'utf8'}).trim(),projectId:manifest.projectId,cohort:manifest.cohort,native:{architecture:process.arch,cpuCount:availableParallelism(),memoryBytes:totalmem()},jobTokenPresent:Boolean(token),onlyInjectedCredential:true,persistentSecretCreated:false,commands:[],requests:[],buildCreateRequests:0,accountWideListing:false,automaticOneCommandCliPathExercised:false,apiAuthorizationThenNormalDerivedBuildTokenAttachment:true};\nlet buildToken;let buildId;const scrub=value=>String(value).replaceAll(token??'no-token-sentinel','[redacted]').replaceAll(buildToken??'no-build-token-sentinel','[redacted]');\nfunction save(){const text=JSON.stringify(record,null,2)+'\\n';if(token)assert(!text.includes(token));if(buildToken)assert(!text.includes(buildToken));writeFileSync(join(receipts,'profile.json'),text);}\nfunction command(label,args,environment,maximum=20000){const start=Date.now();const result=spawnSync('depot',args,{cwd:here,env:environment,encoding:'utf8',maxBuffer:4*1024*1024,timeout:maximum,killSignal:'SIGKILL'});const stdout=scrub(result.stdout??'');const stderr=scrub(result.stderr??'');writeFileSync(join(receipts,label+'.stdout'),stdout);writeFileSync(join(receipts,label+'.stderr'),stderr);const row={label,args,status:result.status,signal:result.signal,elapsedMilliseconds:Date.now()-start,error:result.error?{name:result.error.name,code:result.error.code,message:scrub(result.error.message)}:null,stdoutSha256:hash(stdout),stderrSha256:hash(stderr)};record.commands.push(row);save();return {row,stdout,stderr};}\nasync function rpc(label,method,body,credential){const startedAt=new Date().toISOString();const response=await fetch('https://api.depot.dev/depot.cli.v1.BuildService/'+method,{method:'POST',headers:{'content-type':'application/json','connect-protocol-version':'1',Authorization:'Bearer '+credential},body:JSON.stringify(body),signal:AbortSignal.timeout(20000),redirect:'error'});const bytes=Buffer.from(await response.arrayBuffer());assert(bytes.length<128*1024);const parsed=JSON.parse(bytes.toString('utf8'));record.requests.push({label,method,startedAt,finishedAt:new Date().toISOString(),status:response.status,bytes:bytes.length,responseKeys:Object.keys(parsed)});save();return {response,parsed};}\nasync function registry(label,path,credential){const headers={Accept:'application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'};if(credential)headers.Authorization='Basic '+Buffer.from('x-token:'+credential).toString('base64');const response=await fetch('https://registry.depot.dev/v2/'+manifest.projectId+'/'+path,{headers,signal:AbortSignal.timeout(8000),redirect:'error'});const bytes=Buffer.from(await response.arrayBuffer());assert(bytes.length<128*1024);const row={label,path,status:response.status,bytes:bytes.length,sha256:hash(bytes),mediaType:response.headers.get('content-type'),registryDigest:response.headers.get('docker-content-digest')};record.requests.push(row);if(response.ok)writeFileSync(join(receipts,label+'.json'),bytes);save();return {row,bytes};}\nsave();\ntry{\nassert.equal(process.platform,'linux');assert.equal(process.arch,'x64');assert(availableParallelism()<=2);assert(totalmem()<=8*1024**3);\nassert(typeof token==='string'&&token.length>20);assert(/^[a-z0-9]{10}$/u.test(manifest.projectId));\nassert.equal(hash(readFileSync(join(root,manifest.sourcePath))),manifest.sourceSha256);\nassert.equal(hash(readFileSync(join(here,'context/task-queue.ts'))),manifest.sourceSha256);\nexecFileSync('git',['diff','--exit-code',manifest.frozenSource,'--','.',':!.depot'],{cwd:root});\nconst environment={PATH:process.env.PATH,HOME:home,XDG_CONFIG_HOME:join(home,'.config'),TMPDIR:temp,LANG:'C.UTF-8',DEPOT_NO_SUMMARY_LINK:'1'};\nconst version=command('cli-version',['version'],environment);assert.equal(version.row.status,0);assert(version.stdout.includes('2.102.23'));\nconst negative=command('missing-token',['build','--project',manifest.projectId,'--platform','linux/amd64','context'],environment);assert.notEqual(negative.row.status,0);assert((negative.stdout+negative.stderr).includes('missing API token'));record.missingTokenRejectedBeforeBuildAdmission=true;save();\nassert.equal(record.buildCreateRequests,0);record.buildCreateRequests=1;save();\nconst tag=manifest.cohort;const admitted=await rpc('job-token-create-build','CreateBuild',{projectId:manifest.projectId,options:[{command:'COMMAND_BUILD',save:true,saveTags:[tag],outputs:[{kind:'local',attributes:{}}]}]},token);\nif(!admitted.response.ok){record.createDiagnostic=scrub(JSON.stringify(admitted.parsed));save();throw new Error('Native job-token CreateBuild rejected: '+admitted.response.status);}\nassert.equal(admitted.parsed.projectId,manifest.projectId);assert(/^[a-z0-9]+$/u.test(admitted.parsed.buildId));assert(typeof admitted.parsed.buildToken==='string'&&admitted.parsed.buildToken.length>20);\nbuildId=admitted.parsed.buildId;buildToken=admitted.parsed.buildToken;record.build={id:buildId,url:admitted.parsed.buildUrl,projectId:admitted.parsed.projectId,authorizedByInjectedJobToken:true,derivedBuildTokenRetained:false};save();\nconst metadata=join(receipts,'build-metadata.json');const exported=join(out,'exported');\nconst built=command('existing-build-cli',['build','--project',manifest.projectId,'--platform','linux/amd64','--build-platform','linux/amd64','--save','--save-tag',tag,'--provenance','mode=max','--progress','plain','--metadata-file',metadata,'--output','type=local,dest='+exported,'context'],{...environment,DEPOT_TOKEN:buildToken,DEPOT_BUILD_ID:buildId},125000);\nassert.equal(built.row.status,0,built.stderr.slice(-2000));const image=JSON.parse(readFileSync(metadata,'utf8'));assert.equal(image['depot.build'].buildID,buildId);assert.equal(image['depot.build'].projectID,manifest.projectId);assert(/^sha256:[a-f0-9]{64}$/u.test(image['containerimage.digest']));record.build.digest=image['containerimage.digest'];\nconst result=JSON.parse(readFileSync(join(exported,'result.json'),'utf8'));assert.equal(result.frozenSource,manifest.frozenSource);assert.equal(result.cohort,manifest.cohort);assert.equal(result.sourceSha256,manifest.sourceSha256);assert.equal(hash(readFileSync(join(exported,'task-queue.ts'))),manifest.sourceSha256);assert.deepEqual(result.ran,['one','two']);assert.deepEqual(result.rejected,['three:owned-control']);assert.equal(result.hardwareBoundsEnforced,true);assert.equal(result.emptyQueueSize,0);assert(result.cpuCount<=16&&result.memoryBytes<=32*1024**3);writeFileSync(join(receipts,'exported-result.json'),JSON.stringify(result,null,2)+'\\n');writeFileSync(join(receipts,'exported-task-queue.ts'),readFileSync(join(exported,'task-queue.ts')));record.exportedFileConsumerPassed=true;record.builder=result;save();\nconst anonymous=await registry('registry-anonymous','manifests/'+tag,null);const authenticated=await registry('registry-job-token','manifests/'+tag,token);\nrecord.registry={anonymousStatus:anonymous.row.status,jobTokenStatus:authenticated.row.status,authenticatedReadDifferential:anonymous.row.status===401&&authenticated.row.status===200,localCredentialUsed:false,scope:'Legacy project registry manifest read only, no runtime pull or org-hosted repository assertion'};\nif(authenticated.row.status===200){assert.equal('sha256:'+hash(authenticated.bytes),image['containerimage.digest']);record.registry.imageDigestMatches=true;}\nrecord.completed=true;save();\n}catch(error){record.failure={name:error.name,message:scrub(error.message)};throw error;}\nfinally{if(buildId&&buildToken&&!record.completed){try{const finalized=await rpc('failed-fixture-finish-owned-build','FinishBuild',{buildId,error:{error:'Owned native authentication research fixture stopped'}},buildToken);record.failureCleanupFinishStatus=finalized.response.status;}catch(error){record.failureCleanupDiagnostic=scrub(error.message);}}record.finishedAt=new Date().toISOString();save();}\n"
