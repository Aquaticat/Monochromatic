[tasks.workload]
shell = "node --input-type=module-typescript -e"
run = "\nimport {readFileSync,writeFileSync,mkdirSync,realpathSync,existsSync} from 'node:fs';\nimport {join} from 'node:path';import {spawnSync,execFileSync,spawn} from 'node:child_process';\nimport {once} from 'node:events';import {createGuardedApi} from './api-proxy.ts';\nimport {createHash} from 'node:crypto';import {availableParallelism,totalmem} from 'node:os';\nimport {strict as assert} from 'node:assert';\nconst root=realpathSync(process.env.GITHUB_WORKSPACE??execFileSync('git',['rev-parse','--show-toplevel'],{encoding:'utf8'}).trim());\nconst here=join(root,'.depot/probe/native-buildkit-auth');const manifest=JSON.parse(readFileSync(join(here,'manifest.json'),'utf8'));\nconst out=join(here,'output');const receipts=join(out,'receipts');const home=join(out,'empty-home');const temp=join(out,'temp');\nfor(const path of [receipts,home,temp,join(home,'.config')])mkdirSync(path,{recursive:true,mode:0o700});\nconst hash=value=>createHash('sha256').update(value).digest('hex');const token=process.env.DEPOT_TOKEN;\nconst record={schemaVersion:1,startedAt:new Date().toISOString(),frozenSource:manifest.frozenSource,harness:execFileSync('git',['rev-parse','HEAD'],{cwd:root,encoding:'utf8'}).trim(),projectId:manifest.projectId,cohort:manifest.cohort,native:{architecture:process.arch,cpuCount:availableParallelism(),memoryBytes:totalmem()},jobTokenPresent:Boolean(token),onlyInjectedCredential:true,persistentSecretCreated:false,commands:[],requests:[],buildCreateRequests:0,accountWideListing:false,automaticOneCommandCliPathExercised:true,apiAuthorizationThenNormalDerivedBuildTokenAttachment:false};\nlet api;const scrub=value=>String(value).replaceAll(token??'no-token-sentinel','[redacted]');\nfunction save(){const text=JSON.stringify(record,null,2)+'\\n';if(token)assert(!text.includes(token));writeFileSync(join(receipts,'profile.json'),text);}\nfunction command(label,args,environment,maximum=20000){const start=Date.now();const result=spawnSync('depot',args,{cwd:here,env:environment,encoding:'utf8',maxBuffer:4*1024*1024,timeout:maximum,killSignal:'SIGKILL'});const stdout=scrub(result.stdout??'');const stderr=scrub(result.stderr??'');writeFileSync(join(receipts,label+'.stdout'),stdout);writeFileSync(join(receipts,label+'.stderr'),stderr);const row={label,args,status:result.status,signal:result.signal,elapsedMilliseconds:Date.now()-start,error:result.error?{name:result.error.name,code:result.error.code,message:scrub(result.error.message)}:null,stdoutSha256:hash(stdout),stderrSha256:hash(stderr)};record.commands.push(row);save();return {row,stdout,stderr};}\n\nasync function buildCommand(args,environment,maximum){\nconst start=Date.now();const child=spawn('depot',args,{cwd:here,env:environment,stdio:['ignore','pipe','pipe']});const stdout=[];const stderr=[];let bytes=0;let exceeded=false;\nfunction capture(chunks,chunk){bytes+=chunk.length;if(bytes>4*1024*1024){exceeded=true;child.kill('SIGKILL');}else chunks.push(chunk);}\nchild.stdout.on('data',chunk=>capture(stdout,chunk));child.stderr.on('data',chunk=>capture(stderr,chunk));\nconst timer=setTimeout(()=>child.kill('SIGTERM'),maximum);const hard=setTimeout(()=>child.kill('SIGKILL'),maximum+10000);\nlet status;let signal;try{[status,signal]=await once(child,'close');}finally{clearTimeout(timer);clearTimeout(hard);}\nconst output=scrub(Buffer.concat(stdout).toString('utf8'));const diagnostic=scrub(Buffer.concat(stderr).toString('utf8'));\nwriteFileSync(join(receipts,'job-token-cli.stdout'),output);writeFileSync(join(receipts,'job-token-cli.stderr'),diagnostic);\nconst row={label:'job-token-cli',args,status,signal,elapsedMilliseconds:Date.now()-start,exceeded,stdoutSha256:hash(output),stderrSha256:hash(diagnostic)};record.commands.push(row);save();return {row,stdout:output,stderr:diagnostic};\n}\nasync function registry(label,path,credential){const headers={Accept:'application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json'};if(credential)headers.Authorization='Basic '+Buffer.from('x-token:'+credential).toString('base64');const response=await fetch('https://registry.depot.dev/v2/'+manifest.projectId+'/'+path,{headers,signal:AbortSignal.timeout(8000),redirect:'error'});const bytes=Buffer.from(await response.arrayBuffer());assert(bytes.length<128*1024);const row={label,path,status:response.status,bytes:bytes.length,sha256:hash(bytes),mediaType:response.headers.get('content-type'),registryDigest:response.headers.get('docker-content-digest')};record.requests.push(row);if(response.ok)writeFileSync(join(receipts,label+'.json'),bytes);save();return {row,bytes};}\nsave();\ntry{\nassert.equal(process.platform,'linux');assert.equal(process.arch,'x64');assert(availableParallelism()<=2);assert(totalmem()<=8*1024**3);\nassert(typeof token==='string'&&token.length>20);assert(/^[a-z0-9]{10}$/u.test(manifest.projectId));\nassert.equal(hash(readFileSync(join(root,manifest.sourcePath))),manifest.sourceSha256);\nassert.equal(hash(readFileSync(join(here,'context/task-queue.ts'))),manifest.sourceSha256);\nexecFileSync('git',['diff','--exit-code',manifest.frozenSource,'--','.',':!.depot'],{cwd:root});\nconst environment={PATH:process.env.PATH,HOME:home,XDG_CONFIG_HOME:join(home,'.config'),TMPDIR:temp,LANG:'C.UTF-8',DEPOT_NO_SUMMARY_LINK:'1'};\nconst version=command('cli-version',['version'],environment);assert.equal(version.row.status,0);assert(version.stdout.includes('2.102.23'));\nconst negative=command('missing-token',['build','--project',manifest.projectId,'--platform','linux/amd64','context'],environment);assert.notEqual(negative.row.status,0);assert((negative.stdout+negative.stderr).includes('missing API token'));record.missingTokenRejectedBeforeBuildAdmission=true;save();\napi=await createGuardedApi({projectId:manifest.projectId,expectedInitialAuthorization:'Bearer '+token,rows:record.requests,onUpdate:save});\nconst tag=manifest.cohort;\nconst metadata=join(receipts,'build-metadata.json');const exported=join(out,'exported');\nconst built=await buildCommand(['build','--project',manifest.projectId,'--platform','linux/amd64','--build-platform','linux/amd64','--save','--save-tag',tag,'--provenance','mode=max','--progress','plain','--metadata-file',metadata,'--output','type=local,dest='+exported,'context'],{...environment,DEPOT_TOKEN:token,DEPOT_API_URL:api.url},125000);\nassert.equal(built.row.status,0,built.stderr.slice(-2000));assert.equal(api.stats.createRequests,1);assert.equal(api.stats.initialCredentialMatched,true);assert.equal(api.stats.deniedRequests,0);const image=JSON.parse(readFileSync(metadata,'utf8'));assert(/^[a-z0-9]+$/u.test(image['depot.build'].buildID));record.build={id:image['depot.build'].buildID,projectId:manifest.projectId,authorizedByInjectedJobToken:true};assert.equal(image['depot.build'].projectID,manifest.projectId);assert(/^sha256:[a-f0-9]{64}$/u.test(image['containerimage.digest']));record.build.digest=image['containerimage.digest'];\nconst result=JSON.parse(readFileSync(join(exported,'result.json'),'utf8'));assert.equal(result.frozenSource,manifest.frozenSource);assert.equal(result.cohort,manifest.cohort);assert.equal(result.sourceSha256,manifest.sourceSha256);assert.equal(hash(readFileSync(join(exported,'task-queue.ts'))),manifest.sourceSha256);assert.deepEqual(result.ran,['one','two']);assert.deepEqual(result.rejected,['three:owned-control']);assert.equal(result.hardwareBoundsEnforced,true);assert.equal(result.emptyQueueSize,0);assert(result.cpuCount<=16&&result.memoryBytes<=32*1024**3);writeFileSync(join(receipts,'exported-result.json'),JSON.stringify(result,null,2)+'\\n');writeFileSync(join(receipts,'exported-task-queue.ts'),readFileSync(join(exported,'task-queue.ts')));record.exportedFileConsumerPassed=true;record.builder=result;save();\nconst anonymous=await registry('registry-anonymous','manifests/'+tag,null);const authenticated=await registry('registry-job-token','manifests/'+tag,token);\nrecord.registry={anonymousStatus:anonymous.row.status,jobTokenStatus:authenticated.row.status,authenticatedReadDifferential:anonymous.row.status===401&&authenticated.row.status===200,localCredentialUsed:false,scope:'Legacy project registry manifest read only, no runtime pull or org-hosted repository assertion'};\nif(authenticated.row.status===200){assert.equal('sha256:'+hash(authenticated.bytes),image['containerimage.digest']);record.registry.imageDigestMatches=true;}\nrecord.completed=true;save();\n}catch(error){record.failure={name:error.name,message:scrub(error.message)};throw error;}\nfinally{if(api){await api.close();record.apiGuard={...api.stats};record.buildCreateRequests=api.stats.createRequests;}record.finishedAt=new Date().toISOString();save();}\n"
