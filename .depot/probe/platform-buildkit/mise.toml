[tasks."probe:print-controls"]
quiet = true
shell = "node --input-type=module-typescript -e"
run = '''
import {createServer} from 'node:http2';
import {once} from 'node:events';
import {execFile,execFileSync} from 'node:child_process';
import {promisify} from 'node:util';
import {readFileSync,writeFileSync,mkdirSync,chmodSync} from 'node:fs';
import {homedir} from 'node:os';
import {join} from 'node:path';
import {createHash} from 'node:crypto';
import {strict as assert} from 'node:assert';
const invoke=promisify(execFile);
const state=join(homedir(),'temp','agent','depot-platform-buildkit-evidence-20261018');
mkdirSync(state,{recursive:true});chmodSync(state,0o700);
const requests=[];
const server=createServer((request,response)=>{
  requests.push({path:request.url,method:request.method,authorizationPresent:Boolean(request.headers.authorization)});
  response.writeHead(401,{'content-type':'application/json'});
  response.end(JSON.stringify({code:'unauthenticated',message:'local-fixture-auth-negative-control'}));
});
server.listen(0,'127.0.0.1');await once(server,'listening');
const address=server.address();assert(address&&typeof address==='object');
const environment={...process.env,DEPOT_API_URL:'http://127.0.0.1:'+address.port,
  DEPOT_TOKEN:'fixture-not-a-real-token',PROJECT:'unallocated',OUTPUT_DIRECTORY:'.'};
const commands=[];
async function run(args){
  let result;
  try{
    const response=await invoke('depot',args,{env:environment,maxBuffer:1024*1024,signal:AbortSignal.timeout(15000)});
    result={args,status:0,stdout:response.stdout,stderr:response.stderr};
  }catch(error){
    result={args,status:error.code,stdout:error.stdout??'',stderr:error.stderr??''};
  }
  commands.push({...result,stdoutSha256:createHash('sha256').update(result.stdout).digest('hex')});
  return result;
}
try{
  const observer=await run(['projects','get','local-print-control','--output','json']);
  assert.notEqual(observer.status,0);assert(observer.stderr.includes('local-fixture-auth-negative-control'));
  assert.equal(requests.length,1);
  const baseline=await run(['bake','--file','docker-bake.hcl','--print']);
  assert.equal(baseline.status,0,baseline.stderr);
  const parsed=JSON.parse(baseline.stdout);
  assert.deepEqual(parsed.group.default.targets.toSorted(),['evidence','service']);
  assert.deepEqual(parsed.target.service.platforms,['linux/amd64','linux/arm64']);
  assert.equal(parsed.target.service.project_id,'unallocated');
  assert.equal(parsed.target.service.args.BUILD_HARNESS_SHA,'print-control');
  assert.equal(parsed.target.evidence.contexts.fixtureinput,'fixture-input');
  const override=await run(['bake','--file','docker-bake.hcl','--set',
    'service.args.BUILD_HARNESS_SHA=override-positive-control','--print']);
  assert.equal(override.status,0,override.stderr);
  assert.equal(JSON.parse(override.stdout).target.service.args.BUILD_HARNESS_SHA,'override-positive-control');
  assert.equal(JSON.parse(override.stdout).target.evidence.args.BUILD_HARNESS_SHA,'print-control');
  const negative=await run(['bake','--file','docker-bake.hcl','--print','does-not-exist']);
  assert.notEqual(negative.status,0);assert(negative.stderr.includes('does-not-exist'));
  const remote=await run(['bake','--print','https://fixture.invalid/source.git']);
  assert.notEqual(remote.status,0);assert(remote.stderr.includes('cannot use remote target with --print'));
  assert.equal(requests.length,1,'Print controls contacted the local API observer');
  const version=await run(['--version']);assert.equal(version.status,0);
  const receipt={verifiedAt:new Date().toISOString(),harnessCommit:
    execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),repositoryBase:
    'e02be6c8b8fe9efb41a7f8f1a0b311c17796588a',requests,commands,
    controls:{apiObserverPositive:true,sharedTargetInheritance:true,overridePositive:true,
      invalidTargetNegative:true,remotePrintUnsupported:true,noPrintApiRequests:true},cloudAllocation:false};
  writeFileSync(join(state,'print-controls.json'),JSON.stringify(receipt,null,2)+'\n');
  process.stdout.write(JSON.stringify({controls:receipt.controls,cloudAllocation:false})+'\n');
}catch(error){
  writeFileSync(join(state,'print-controls-failed.json'),JSON.stringify({failedAt:new Date().toISOString(),
    diagnostic:String(error),requests,commands,cloudAllocation:false},null,2)+'\n');
  throw error;
}finally{
  const closed=once(server,'close');server.close();await closed;
}
'''
[tasks."probe:build-service"]
depends = ["probe:node-program-controls", "probe:local-service-control"]
quiet = true
shell = "node --input-type=module-typescript -e"
run = '''
import {spawn,execFileSync} from 'node:child_process';
import {once} from 'node:events';
import {readFileSync,writeFileSync,mkdirSync,chmodSync,existsSync,openSync,closeSync,statSync,
  createReadStream,readdirSync} from 'node:fs';
import {join} from 'node:path';
import {homedir} from 'node:os';
import {createHash} from 'node:crypto';
import {strict as assert} from 'node:assert';
const state=join(homedir(),'temp','agent','depot-platform-buildkit-evidence-20261018');
const resource=JSON.parse(readFileSync(join(state,'project-create.json'),'utf8'));
const manifest=JSON.parse(readFileSync('manifest.json','utf8'));
const root=execFileSync('git',['rev-parse','--show-toplevel'],{encoding:'utf8'}).trim();
const source=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
execFileSync('git',['diff','--quiet'],{cwd:root});
execFileSync('git',['diff','--cached','--quiet'],{cwd:root});
assert.equal(resource.eligibleForBuild,true);assert.equal(resource.project.hardware,'HARDWARE_16X32');
assert.equal(resource.project.buildTimeoutMinutes,5);assert.equal(resource.project.maxConcurrentBuilds,undefined);
const intentPath=join(state,'service-build-v4-intent.json');
assert(!existsSync(intentPath),'A service build intent exists; reconcile that attempt before any retry');
const output=join(state,'service-build-v4');mkdirSync(output,{recursive:true});chmodSync(output,0o700);
const dockerConfig=join(state,'docker-config');mkdirSync(dockerConfig,{recursive:true});chmodSync(dockerConfig,0o700);
const token=execFileSync('depot',['login','token'],{encoding:'utf8',maxBuffer:64*1024}).trim();
assert(token&&!/\s/u.test(token));
const projectId=resource.project.projectId;
const metadataPath=join(output,'metadata.json');
const args=['bake','--file','docker-bake.hcl','--project',projectId,'--save','--save-tag',manifest.cohort,
  '--set','service.output=type=image','--metadata-file',metadataPath,'--progress','plain','service'];
const printed=JSON.parse(execFileSync('depot',['bake','--file','docker-bake.hcl','--set',
  'service.output=type=image','--print','service'],{encoding:'utf8',maxBuffer:1024*1024}));
assert.equal(printed.target.service.output.length,1);
assert.equal(printed.target.service.output[0].type,'image');
const startedAt=new Date().toISOString();const startedMilliseconds=Date.now();
const priorClock=JSON.parse(readFileSync(join(state,'campaign-clock.json'),'utf8'));
const priorAttempts=['service-build.json','service-build-v2.json','service-build-v3.json'].map(path=>
  JSON.parse(readFileSync(join(state,path),'utf8')));
assert(priorAttempts.every(attempt=>attempt.exitCode===1&&!attempt.terminatedByGuard));
const priorObservedRequestMilliseconds=priorAttempts.reduce((sum,attempt)=>sum+attempt.elapsedMilliseconds,0);
const maximumJobMilliseconds=300000;
const reservedTimestampComputeUsd=(priorObservedRequestMilliseconds+maximumJobMilliseconds)/60000*2*0.04;
assert(reservedTimestampComputeUsd<=manifest.bounds.timestampComputeCeilingUsd);
const clock={startedAt,deadline:new Date(startedMilliseconds+maximumJobMilliseconds).toISOString(),
  priorClock,priorObservedRequestMilliseconds,reservedTimestampComputeUsd,
  maximumArchitectureBuilders:2,cpuPerBuilder:16,memoryGiBPerBuilder:32,
  publishedRateUsdPerBuilderMinute:0.04,aggregateAccountInvoiceCapProven:false,
  continuationAuthorization:'Parent approved a fresh five-minute request window on2026-10-18; original clock retained'};
const intent={startedAt,args,source,repositoryBase:manifest.repositoryBase,projectId,clock,
  declaredTargets:['service'],maximumJobMilliseconds,priorRejectedBuildIds:['7wjrw9szj0','xj1l6kmvbg','xm26rbm5kt']};
writeFileSync(intentPath,JSON.stringify(intent,null,2)+'\n');
const logPath=join(output,'build.log');const descriptor=openSync(logPath,'wx',0o600);
const child=spawn('depot',args,{stdio:['ignore',descriptor,descriptor],env:{...process.env,PROJECT:projectId,
  OUTPUT_DIRECTORY:output,HARNESS_SHA:source,DEPOT_TOKEN:token,DEPOT_API_URL:'https://api.depot.dev',
  DOCKER_CONFIG:dockerConfig,DEPOT_DEBUG:'',DEPOT_DEBUG_OIDC:'',DEPOT_NO_SUMMARY_LINK:'',DEPOT_IN_AUTOMATION:''}});
let terminatedByGuard=false;let hardGuard;
const guard=setTimeout(()=>{terminatedByGuard=true;child.kill('SIGINT');
  hardGuard=setTimeout(()=>child.kill('SIGKILL'),10000);hardGuard.unref();},maximumJobMilliseconds);
guard.unref();
let code;let signal;
try{[code,signal]=await once(child,'close');}finally{
  clearTimeout(guard);if(hardGuard)clearTimeout(hardGuard);closeSync(descriptor);
}
const finishedAt=new Date().toISOString();
const result={...intent,finishedAt,exitCode:code,signal,pid:child.pid,terminatedByGuard,logPath,
  elapsedMilliseconds:Date.now()-startedMilliseconds,resourceConfigurationProvenByCreateResponse:true,
  buildMetadata:existsSync(metadataPath)?JSON.parse(readFileSync(metadataPath,'utf8')):undefined,
  holdSharedImageAndProjectUntilParentConsumersFinish:true};
writeFileSync(join(state,'service-build-v4.json'),JSON.stringify(result,null,2)+'\n');
assert.equal(code,0,'Native build failed; exact diagnostic retained in '+logPath);
const registryImages=JSON.parse(execFileSync('depot',['image','list','--project',projectId,'--output','json'],
  {encoding:'utf8',env:{...process.env,DEPOT_TOKEN:token},maxBuffer:1024*1024}));
assert(Array.isArray(registryImages));
const serviceTag=manifest.cohort+'-service';const serviceImage=registryImages.find(image=>image.tag===serviceTag);
assert(serviceImage,'The exact newly created service tag was absent');
const pullToken=execFileSync('depot',['pull-token','--project',projectId],
  {encoding:'utf8',env:{...process.env,DEPOT_TOKEN:token},maxBuffer:64*1024}).trim();
assert(pullToken&&!/\s/u.test(pullToken));
const pullTokenPath=join(state,'service-pull-token.private');
writeFileSync(pullTokenPath,pullToken,{mode:0o600});
result.registryImages=registryImages;
result.separateSingleExporterConsumersPending=['Local builder/source identities','OCI archive and attestation subjects'];
result.sharedService={tag:serviceTag,digest:serviceImage.digest,
  imageReference:'registry.depot.dev/'+projectId+'@'+serviceImage.digest,
  taggedImageReference:'registry.depot.dev/'+projectId+':'+serviceTag,
  username:'x-token',pullTokenPrivatePath:pullTokenPath,pullTokenValuePublished:false,
  documentedPullTokenLifetimeSeconds:3600,pullTokenRecordedAt:new Date().toISOString(),
  nonceEnvironment:'MONO_RESEARCH_NONCE',healthPath:'/health',port:8080};
writeFileSync(join(state,'service-build-v4.json'),JSON.stringify(result,null,2)+'\n');
process.stdout.write(JSON.stringify({projectId,source,exitCode:code,elapsedMilliseconds:result.elapsedMilliseconds,
  sharedService:result.sharedService})+'\n');
'''

[tasks."probe:node-program-controls"]
shell = "node --input-type=module-typescript -e"
run = "import {readFileSync,writeFileSync} from 'node:fs';\nimport {join} from 'node:path';import {homedir} from 'node:os';\nimport {spawnSync,execFileSync} from 'node:child_process';\nimport {createHash} from 'node:crypto';import {strict as assert} from 'node:assert';\nimport {stripTypeScriptTypes} from 'node:module';\nconst source=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();\nconst records=[];const dockerfile=readFileSync('context/Dockerfile','utf8');\nfor(const line of dockerfile.split('\\n')){\n  if(!/^(RUN |CMD |HEALTHCHECK .* CMD )/u.test(line))continue;\n  const args=JSON.parse(line.slice(line.indexOf('[')));assert.equal(args[0],'node');\n  const program=args.at(-1);assert(args.includes('--input-type=module-typescript'));\n  const stripped=stripTypeScriptTypes(program);\n  const result=spawnSync(process.execPath,['--input-type=module','--check'],{input:stripped,encoding:'utf8'});\n  assert.equal(result.error,undefined);assert.equal(result.status,0,result.stderr);\n  records.push({instruction:line.split(' ')[0],programSha256:createHash('sha256').update(program).digest('hex'),exitCode:result.status});\n}\nassert.equal(records.length,4);\nlet invalidControl;\ntry{stripTypeScriptTypes(\"const invalid: string = 'literal\\nnewline';\");}catch(error){\n  assert.equal(error.code,'ERR_INVALID_TYPESCRIPT_SYNTAX');invalidControl={errorCode:error.code,diagnostic:String(error)};}\nassert(invalidControl);\nconst proof={source,nodeVersion:process.version,records,invalidControl,\n  invocation:'Node stripTypeScriptTypes then --input-type=module --check; actual JSON-decoded instruction program',\n  cloudAllocation:false,programsExecuted:false};\nwriteFileSync(join(homedir(),'temp','agent','depot-platform-buildkit-evidence-20261018','node-program-controls-'+source+'.json'),\n  JSON.stringify(proof,null,2)+'\\n');process.stdout.write(JSON.stringify(proof)+'\\n');"
[tasks."probe:local-service-control"]
shell = "node --input-type=module-typescript -e"
run = '''
import {readFileSync,writeFileSync,mkdirSync,copyFileSync,existsSync} from 'node:fs';
import {join} from 'node:path';import {homedir} from 'node:os';
import {execFileSync,spawnSync} from 'node:child_process';
import {randomUUID,createHash} from 'node:crypto';import {strict as assert} from 'node:assert';
const source=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
const manifest=JSON.parse(readFileSync('manifest.json','utf8'));
const state=join(homedir(),'temp','agent','depot-platform-buildkit-evidence-20261018');
const context=join(state,'local-service-'+source);assert(!existsSync(context));mkdirSync(context,{mode:0o700});
const dockerfile=readFileSync('context/Dockerfile','utf8');
const command=JSON.parse(dockerfile.split('\n').find(line=>line.startsWith('CMD ')).slice(4));
assert.equal(command[0],'node');assert.equal(command[1],'--input-type=module-typescript');
const program=command.at(-1);const name='depot-local-service-'+source.slice(0,12)+'-'+randomUUID().slice(0,8);
const image='localhost/'+name+':control';const nonce=randomUUID();
writeFileSync(join(context,'Dockerfile'),'FROM '+manifest.nodeBase+'\nWORKDIR /app\nCOPY probe.json /app/probe.json\n');
copyFileSync('context/probe.json',join(context,'probe.json'));
const buildArgs=['build','--file',join(context,'Dockerfile'),'--tag',image,'--memory','512m',
  '--cpu-period','100000','--cpu-quota','200000','--jobs','1','--network','none','--http-proxy=false',context];
const result={source,repositoryBase:manifest.repositoryBase,nodeBase:manifest.nodeBase,image,name,nonce,
  serviceProgramSha256:createHash('sha256').update(program).digest('hex'),startedAt:new Date().toISOString(),
  declaredResources:{cpus:2,memoryBytes:512*1024**2,pids:64,containerTimeoutSeconds:30,hostBindMounts:false,network:'none'},
  buildArgs,cloudAllocation:false};
let failure;
try{
  const build=spawnSync('podman',buildArgs,{encoding:'utf8',maxBuffer:4*1024*1024});
  result.build={exitCode:build.status,stdout:build.stdout,stderr:build.stderr};assert.equal(build.error,undefined);
  assert.equal(build.status,0,build.stderr);
  const consumer=program+`; import {once as controlOnce} from 'node:events'; import {strict as controlAssert} from 'node:assert';
await controlOnce(server,'listening'); const outcomes=[];
for(const [path,expectedStatus] of [['/health',200],['/nonce',200],['/missing-positive-negative-control',404]]){
  const response=await fetch('http://127.0.0.1:8080'+path,{signal:AbortSignal.timeout(1000)});
  const body=await response.json();controlAssert.equal(response.status,expectedStatus);
  controlAssert.equal(body.nonce,process.env.MONO_RESEARCH_NONCE);
  controlAssert.equal(body.repositoryBase,'${manifest.repositoryBase}');
  controlAssert.equal(body.harnessCommit,process.env.BUILD_HARNESS_SHA);
  controlAssert.equal(body.nodeVersion,'v24.22.0');controlAssert.equal(body.architecture,'x64');
  controlAssert.equal(body.path,path);outcomes.push({path,status:response.status,body});
}
const closed=controlOnce(server,'close');server.close();await closed;
process.stdout.write(JSON.stringify({outcomes,nodeVersion:process.version,controlledServerClose:true}));`;
  const args=['run','--name',name,'--memory','512m','--cpus','2','--pids-limit','64','--network','none',
    '--read-only','--read-only-tmpfs=false','--http-proxy=false','--timeout','30','--env','MONO_RESEARCH_NONCE='+nonce,
    '--env','BUILD_HARNESS_SHA='+source,image,...command.slice(0,-1),consumer];
  const run=spawnSync('podman',args,{encoding:'utf8',maxBuffer:4*1024*1024});
  result.run={exitCode:run.status,stdout:run.stdout,stderr:run.stderr};assert.equal(run.error,undefined);
  const inspect=spawnSync('podman',['container','inspect',name],{encoding:'utf8',maxBuffer:4*1024*1024});
  result.inspect=inspect.status===0?JSON.parse(inspect.stdout)[0]:{exitCode:inspect.status,stderr:inspect.stderr};
  assert.equal(run.status,0,run.stderr);result.consumer=JSON.parse(run.stdout);
  assert.equal(result.inspect.State.ExitCode,0);assert.equal(result.inspect.Mounts.length,0);
  assert.equal(result.inspect.HostConfig.Memory,512*1024**2);
  assert.equal(result.inspect.HostConfig.CpuQuota/result.inspect.HostConfig.CpuPeriod,2);
  assert.equal(result.inspect.HostConfig.PidsLimit,64);
}catch(error){failure=error;result.failure={name:error.name,message:error.message,stack:error.stack};}
finally{
  const exists=spawnSync('podman',['container','exists',name],{encoding:'utf8'});
  if(exists.status===0){const cleanup=spawnSync('podman',['container','rm',name],{encoding:'utf8'});
    result.cleanup={exitCode:cleanup.status,stdout:cleanup.stdout,stderr:cleanup.stderr};}
  result.finishedAt=new Date().toISOString();writeFileSync(join(state,'local-service-'+source+'.json'),JSON.stringify(result,null,2)+'\n');
}
if(failure)throw failure;assert.equal(result.cleanup.exitCode,0);
process.stdout.write(JSON.stringify({source,consumer:result.consumer,declaredResources:result.declaredResources,
  containerRemoved:result.cleanup.exitCode===0,imageRetainedForLaterConsumers:image})+'\n');
'''
