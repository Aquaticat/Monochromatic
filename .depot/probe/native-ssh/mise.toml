[tasks.prepare]
quiet = true
shell = "node --input-type=module-typescript -e"
run = '''
import {readFileSync,writeFileSync,mkdirSync,chmodSync,existsSync} from 'node:fs';import {homedir,availableParallelism,totalmem,userInfo} from 'node:os';import {join} from 'node:path';import {execFileSync} from 'node:child_process';import {createHash,randomBytes} from 'node:crypto';import {strict as assert} from 'node:assert';const sha=bytes=>createHash('sha256').update(bytes).digest('hex');const workspace=process.env.GITHUB_WORKSPACE;assert(workspace);assert.equal(availableParallelism(),2);assert(totalmem()>=7000000000&&totalmem()<=9000000000);assert(!existsSync('/continue'));assert(!existsSync(join(workspace,'continue')));const source=execFileSync('git',['rev-parse','HEAD'],{cwd:workspace,encoding:'utf8'}).trim();const root=join(homedir(),'temp/agent','native-ssh-'+source.slice(0,12));mkdirSync(root,{recursive:true,mode:0o700});chmodSync(root,0o700);const marker={kind:'native-ssh-fixture',nonce:randomBytes(32).toString('hex'),source,applicationBase:'e02be6c8b8fe9efb41a7f8f1a0b311c17796588a',bootId:readFileSync('/proc/sys/kernel/random/boot_id','utf8').trim(),uid:userInfo().uid,gid:userInfo().gid,workspace,node:process.version,nodePath:process.execPath};const bytes=JSON.stringify(marker)+'\n';writeFileSync(join(root,'identity.json'),bytes,{mode:0o600});writeFileSync(join(root,'task-source.sha256'),sha(readFileSync('mise.toml'))+'\n',{mode:0o600});console.log('NATIVE_SSH_READY '+JSON.stringify({marker,root,markerPath:join(root,'identity.json'),markerSha256:sha(bytes),taskSha256:sha(readFileSync('mise.toml')),workflowSha256:sha(readFileSync(join(workspace,'.depot/workflows/native-ssh-acceptance.yml'))),syntheticWorkflowEnvironment:process.env.NATIVE_SSH_WORKFLOW_SENTINEL}));
'''

[tasks.verify]
quiet = true
shell = "node --input-type=module-typescript -e"
run = '''
import {readFileSync,writeFileSync,existsSync,unlinkSync,realpathSync,statSync} from 'node:fs';import {homedir} from 'node:os';import {join} from 'node:path';import {execFileSync,spawnSync} from 'node:child_process';import {createHash} from 'node:crypto';import {strict as assert} from 'node:assert';const sha=bytes=>createHash('sha256').update(bytes).digest('hex');const workspace=process.env.GITHUB_WORKSPACE;assert(workspace);const source=execFileSync('git',['rev-parse','HEAD'],{cwd:workspace,encoding:'utf8'}).trim();const root=join(homedir(),'temp/agent','native-ssh-'+source.slice(0,12));const marker=JSON.parse(readFileSync(join(root,'identity.json'),'utf8'));const direct=JSON.parse(readFileSync(join(root,'direct.json'),'utf8'));const cli=JSON.parse(readFileSync(join(root,'cli.json'),'utf8'));const paused=JSON.parse(readFileSync(join(root,'paused.json'),'utf8'));for(const row of [direct,cli,paused]){assert.equal(row.source,source);assert.equal(row.bootId,marker.bootId);assert.equal(row.markerSha256,sha(readFileSync(join(root,'identity.json'))));assert(Number.isSafeInteger(row.uid)&&row.uid>=0);assert(/^[0-9a-f]{64}$/u.test(row.challenge));assert.equal(row.responseSha256,sha(Buffer.concat([readFileSync(join(root,'identity.json')),Buffer.from(row.challenge)])));}assert.equal(direct.mode,'direct-ssh');assert.equal(cli.mode,'cli-pty');assert.equal(paused.mode,'paused-tmate');assert.equal(paused.workflowEnvironment,'workflow-sentinel-e02');assert.equal(realpathSync(paused.cwd),realpathSync(workspace));assert.equal(readFileSync(join(workspace,'continue'),'utf8').trim(),sha(marker.nonce));const fileOwnership=['direct.json','cli.json','paused.json'].map(name=>{const st=statSync(join(root,name));assert.equal(st.uid,marker.uid);assert.equal(st.mode&0o777,0o600);return{name,uid:st.uid,gid:st.gid,modeOctal:(st.mode&0o777).toString(8)};});const tmate=join('/tmp','tmate','tmate');if(existsSync('/tmp/tmate.sock')){const stop=spawnSync(tmate,['-S','/tmp/tmate.sock','kill-server'],{encoding:'utf8',timeout:5000});assert.equal(stop.status,0);}assert(!existsSync('/tmp/tmate.sock'));unlinkSync(join(workspace,'continue'));assert(!existsSync(join(workspace,'continue')));const result={kind:'native-ssh-resumed',source,applicationBase:marker.applicationBase,markerSha256:direct.markerSha256,direct,cli,paused,fileOwnership,continueRemoved:true,tmateSocketAbsent:true};writeFileSync(join(root,'consumer.json'),JSON.stringify(result,null,2)+'\n',{mode:0o600});console.log('NATIVE_SSH_CONSUMER '+JSON.stringify(result));
'''
