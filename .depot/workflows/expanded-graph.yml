{
  "name": "Research repeated immutable expanded Linux graph",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "graph": {
      "runs-on": "depot-ubuntu-24.04-4",
      "timeout-minutes": 30,
      "strategy": {
        "fail-fast": false,
        "max-parallel": 1,
        "matrix": {
          "include": [
            {
              "key": "native-1",
              "repetition": "1"
            },
            {
              "key": "native-2",
              "repetition": "2"
            }
          ]
        }
      },
      "env": {
        "GRAPH_PROVIDER": "native-depot",
        "GRAPH_REPETITION": "${{ matrix.repetition }}",
        "MISE_AUTO_INSTALL": "false",
        "MISE_LOCKED": "1",
        "MISE_JOBS": "2",
        "NODE_OPTIONS": "--max-old-space-size=2048",
        "OXLINT_THREADS": "2",
        "GOMAXPROCS": "2",
        "GOMEMLIMIT": "768MiB",
        "CI": "true"
      },
      "steps": [
        {
          "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 2,
            "lfs": false
          }
        },
        {
          "uses": "jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c",
          "with": {
            "version": "2026.10.9",
            "install": false,
            "cache": false
          }
        },
        {
          "name": "Install only locked Node pnpm Rust and Nextest",
          "run": "mise install --locked node pnpm rust cargo:cargo-nextest",
          "timeout-minutes": 8
        },
        {
          "name": "Install frozen dependencies without prepare umbrella",
          "run": "mise exec node pnpm -- pnpm install --frozen-lockfile",
          "timeout-minutes": 4
        },
        {
          "name": "Set up qualified matching browser environment",
          "run": "mise run bootstrap",
          "working-directory": ".depot/research/graph",
          "timeout-minutes": 1
        },
        {
          "name": "Execute shared prerequisite graph and actual parallel owners",
          "run": "mise run campaign",
          "working-directory": ".depot/research/graph",
          "timeout-minutes": 19
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "expanded-graph-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/expanded-graph",
            "if-no-files-found": "error",
            "include-hidden-files": true,
            "retention-days": 7
          }
        }
      ]
    }
  }
}
