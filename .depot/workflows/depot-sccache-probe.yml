name: depot-sccache-probe
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  MISE_AUTO_INSTALL: 'false'
  PROBE_CACHE_PREFIX: monochromatic-truepeak-20261018T0528-trusted-v1
jobs:
  seed:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    env:
      PROBE_ROLE: seed
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          # Freeze the experiment bootstrap and avoid release-discovery calls.
          version: 2026.10.9
          install: false
          cache: false
      - run: mise install node
      - id: probe
        working-directory: .depot/probe/sccache
        run: mise run //.depot/probe/sccache:exercise
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: depot-sccache-seed
          path: ${{ steps.probe.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 7
  consumers:
    needs: seed
    if: ${{ !cancelled() }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        role: [warm, changed-flags]
    env:
      PROBE_ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          # Freeze the experiment bootstrap and avoid release-discovery calls.
          version: 2026.10.9
          install: false
          cache: false
      - run: mise install node
      - id: probe
        working-directory: .depot/probe/sccache
        run: mise run //.depot/probe/sccache:exercise
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: depot-sccache-${{ matrix.role }}
          path: ${{ steps.probe.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 7
