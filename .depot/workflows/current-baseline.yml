name: current-baseline
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  MISE_AUTO_INSTALL: 'false'
  MISE_JOBS: '4'
jobs:
  baseline:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libgdk-pixbuf-2.0-dev libcairo2-dev \
            libpango1.0-dev libgtk-3-dev libgtk-4-dev qt6-base-dev qt6-declarative-dev podman
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.10.9
          install: false
          cache: false
      - name: Install repository tools
        continue-on-error: true
        run: mise install
      - name: Prepare dependencies
        run: mise run prepare:pnpm
      - name: Build
        id: build
        continue-on-error: true
        timeout-minutes: 90
        run: mise run build
      - name: Unit
        if: steps.build.outcome == 'success'
        timeout-minutes: 60
        run: mise run test:unit
