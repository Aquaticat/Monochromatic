name: depot-complete-ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare fixed-revision dependencies for affected-package checks
    runs-on:
      size: 16x64
      image: monochromatic-trial-typescript:20261015-v1
    snapshot: monochromatic-trial-complete-ci:bae6ef28a1-v1
    timeout-minutes: 15
    env:
      MISE_AUTO_INSTALL: 'false'
      CI: 'true'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        clean: false
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        # Retain the bootstrap version already exercised in this trial.
        version: 2026.10.9
        install: false
        cache: false
    - name: Activate only the dependency-install runtimes
      run: mise install node pnpm
    - name: Verify immutable inputs and refresh frozen workspace dependencies
      run: mise run //package/dev-script/task-util:trial:depot:ci:prepare
