name: depot-complete-mutation-identity-control

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on:
      size: 2x8
      image: monochromatic-trial-desktop-ready:20261016-v1
    timeout-minutes: 5
    env:
      MISE_AUTO_INSTALL: 'false'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        clean: false
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        # Match the verified preparation bootstrap.
        version: 2026.10.9
        install: false
        env: false
        export_path: false
        cache: false
    - name: Probe KVM and installed disposable guest infrastructure
      run: mise run //package/dev-script/task-util:trial:depot:ci:containers
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: virtualization-probe-evidence
        path: ~/temp/agent/depot-complete-ci/*-results.json
        if-no-files-found: ignore
