name: depot-complete-logger-git-host-pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  git-host:
    runs-on:
      size: 2x8
      image: monochromatic-trial-native-bases:20261016-v1
    timeout-minutes: 90
    env:
      MISE_AUTO_INSTALL: 'false'
      MISE_LOCKED: '1'
      CI: 'true'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      DEPOT_CI_CASE: logger
      DEPOT_CI_CPUS: '2'
      DEPOT_CI_MEMORY_GIB: '8'
      DEPOT_CI_WORKERS: '1'
      OXLINT_THREADS: '1'
      TSC_SINGLE_THREADED: '1'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: harness
        persist-credentials: false
        clean: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: source
        ref: ef01490f5e960f8ca0b424c12242caeb3c5a2b5e
        fetch-depth: 2
        persist-credentials: false
        clean: false
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        # Retain the preparation bootstrap already exercised by the TOML wave.
        version: 2026.10.9
        working_directory: harness
        install: false
        env: false
        export_path: false
        cache: false
    - name: Install exact lockfile tool versions outside source
      working-directory: harness
      env:
        MISE_LOCKED: '0'
      run: mise run //package/dev-script/task-util:trial:depot:ci:native-tools
    - name: Verify selected source tools and frozen dependency inputs
      working-directory: harness
      run: mise run //package/dev-script/task-util:trial:depot:ci:native-tool-gate
    - name: Install exact-head frozen dependencies
      working-directory: source
      run: mise run prepare:pnpm:install -- --frozen-lockfile
    - name: Prepare exact source offline Cargo inputs
      working-directory: harness
      continue-on-error: true
      run: mise run //package/module/logger.fuzz:trial:depot:prerequisites
    - name: Gate private Git and authentic source linter then run unchanged host tasks
      working-directory: harness
      run: mise run //package/module/logger.fuzz:trial:depot:git-host
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: logger-git-host-pilot-evidence
        include-hidden-files: true
        path: |
          ~/temp/agent/depot-complete-ci/*.json
          ~/temp/agent/depot-complete-ci/*.log
          ~/temp/agent/depot-complete-ci/*.sha256
          ~/temp/agent/depot-complete-ci/check-logs/
          ~/temp/agent/depot-complete-ci/git-host-2.56.0-elf
          ~/temp/agent/depot-complete-ci/git-host-linter-elf
