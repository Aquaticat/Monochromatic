name: Frozen ARM64 repository functional consumer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functional:
    runs-on: depot-ubuntu-24.04-arm-8
    timeout-minutes: 15
    env:
      CI: 'true'
      MISE_AUTO_INSTALL: 'false'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        fetch-depth: 64
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        version: '2026.10.9'
        cache: 'false'
        install: 'true'
        install_args: node pnpm rust cargo-binstall cargo:cargo-nextest
        wings_enabled: 'false'
    - name: Execute frozen ARM64 owners
      working-directory: .depot/probe/arm64-functional
      timeout-minutes: 12
      run: mise run workload
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: arm64-repository-functional
        path: .depot/probe/arm64-functional/output/receipts
        include-hidden-files: true
        retention-days: 7
        if-no-files-found: error
