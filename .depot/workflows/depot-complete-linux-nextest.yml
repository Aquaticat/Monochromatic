name: depot-complete-linux-nextest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on:
      size: 16x64
      image: monochromatic-trial-desktop-ready:20261016-v1
    timeout-minutes: 40
    env:
      MISE_AUTO_INSTALL: 'false'
      MISE_LOCKED: '1'
      CI: 'true'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      DEPOT_CI_CASE: desktop
      SOURCE_HEAD: 3434eaa455d569c18b52cf15100f77f9db251d21
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: harness
        persist-credentials: false
        clean: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: source
        ref: 3434eaa455d569c18b52cf15100f77f9db251d21
        fetch-depth: 2
        persist-credentials: false
        clean: false
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        # Match the verified trial bootstrap.
        version: 2026.10.9
        working_directory: harness
        install: false
        env: false
        export_path: false
        cache: false
    - name: Install exact source tools
      working-directory: harness
      env:
        MISE_LOCKED: '0'
      run: mise run //package/dev-script/task-util:trial:depot:ci:native-tools
    - name: Verify source tool selection
      working-directory: harness
      run: mise run //package/dev-script/task-util:trial:depot:ci:native-tool-gate
    - name: Install frozen dependencies
      working-directory: source
      run: mise run prepare:pnpm:install -- --frozen-lockfile
    - name: Prepare native host libraries
      working-directory: harness
      run: mise run //package/dev-script/task-util:trial:depot:ci:desktop-host
    - name: Execute every eligible source test
      working-directory: harness
      run: mise run //package/dev-script/task-util:trial:depot:linux-nextest
    - name: Preserve full test output and source identity
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: desktop-linux-nextest-evidence
        path: ~/temp/agent/depot-linux-nextest/
        if-no-files-found: error
