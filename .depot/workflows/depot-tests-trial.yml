name: depot-tests-trial

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-split:
    name: Split real Rust test binaries from timing history
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      MISE_AUTO_INSTALL: 'false'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        minimum_release_age: 1d
        install: false
        cache: false
    - uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c
    - name: Install the selected Rust tools
      run: mise install node rust cargo-binstall cargo:cargo-nextest
    - name: Inspect assignments, execute selected tests, and upload reports
      run: mise run //package/music-player/truepeak-core:trial:depot:split
  audio-results:
    name: Validate real audio tests and controlled result history
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_AUTO_INSTALL: 'false'
      DEPOT_TEST_TRIAL_MODE: ${{ vars.DEPOT_TEST_TRIAL_MODE_20261016 }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        minimum_release_age: 1d
        install: false
        cache: false
    - name: Install the selected Rust tools
      run: mise install node rust cargo-binstall cargo:cargo-nextest
    - name: Run real tests with a controlled assertion and one skipped test
      run: mise run //package/music-player/truepeak-core:trial:depot:results
    - name: Report the actual nextest JUnit output
      if: ${{ !cancelled() }}
      uses: depot/test-report-action@2ad5779840a9c63e884fa26f11d019768a27a941
      with:
        key: audio-core
        path: package/music-player/truepeak-core/target/nextest/depot/junit.xml
    - name: Verify a repeated upload is deduplicated
      if: ${{ !cancelled() }}
      uses: depot/test-report-action@2ad5779840a9c63e884fa26f11d019768a27a941
      with:
        key: audio-core
        path: package/music-player/truepeak-core/target/nextest/depot/junit.xml
