name: research repository secret presence
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  MISE_AUTO_INSTALL: 'false'
  MISE_LOCKED: '1'
jobs:
  observe:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          # Keep the previously exercised research bootstrap fixed.
          version: 2026.10.9
          install: false
          cache: false
      - run: mise install node
      - run: mise run //.depot/research/service:secret-presence
        working-directory: .depot/research/service
        env:
          PROBE_PULL_TOKEN: ${{ secrets.MONO_RESEARCH_SERVICE_PULL_20261018 }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-service-secret-presence
          path: .depot/research/service/evidence/
          if-no-files-found: error
          retention-days: 7
