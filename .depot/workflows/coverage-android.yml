          308].includes(response.status)) {\\\\n    const next = new URL(response.headers.get('location'),
          origin);\\\\n    assert.equal(next.protocol,
          'https:');\\\\n    assert(next.hostname.endsWith('.amazonaws.com') ||
          next.hostname.endsWith('.cloudflarestorage.com') ||
          next.hostname.endsWith('.depot.dev'));\\\\n    response = await fetch(next, { redirect: 'error',
          signal: AbortSignal.timeout(30_000) });\\\\n    proof.requests.push({ redirectedBlobOrigin:
          next.origin, status: response.status });\\\\n  }\\\\n  return response;\\\\n}\\\\n\\\\ntry
          {\\\\n  if (token) {\\\\n    const basic = 'Basic ' + Buffer.from('x-token:' +
          token).toString('base64');\\\\n    let authorization = basic;\\\\n    const path = '/v2/' +
          repository + '/manifests/tools-r1';\\\\n    let response = await get({ path, authorization
