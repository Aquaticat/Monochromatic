          thSync,statSync,statfsSync}=await import('node:fs')\\\\n const {join,relative}=await
          import('node:path')\\\\n const {createHash}=await import('node:crypto')\\\\n const
          {availableParallelism,totalmem,release,homedir}=await import('node:os')\\\\n const
          {strict:assert}=await import('node:assert')\\\\n const
          root=process.env.GITHUB_WORKSPACE??process.cwd()\\\\n const
          evidence=join(root,'.research-android/receipts')\\\\n const
