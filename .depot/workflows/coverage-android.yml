          .GITHUB_RUN_ID??null,startedAt:new
          Date(started).toISOString(),profile:'android_debug_and_instrumented_apks_plus_host_jvm',resourceCla\
          ss:'8x32',jobMaximumMinutes:30,campaignMaximumMinutes:27,cpuAvailable:availableParallelism(),memory\
