          overlap=Boolean(dedicated)&&loads.some(load=>load!==dedicated&&load.writable&&load.start<protectedE\
          nd&&load.end>protectedStart)\\\\n   const safeDedicated=Boolean(dedicated)&&!overlap\\\\n   return
