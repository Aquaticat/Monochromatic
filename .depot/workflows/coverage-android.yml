          fields.service);\\\\n      realm.searchParams.set('scope', 'repository:' + repository +
          ':pull');\\\\n      realm.searchParams.set('client_id',
          'monochromatic-reuse-research');\\\\n      const exchange = await fetch(realm, { headers: {
