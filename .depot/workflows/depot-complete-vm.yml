name: depot-complete-vm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vm:
    runs-on:
      size: 16x64
      image: monochromatic-trial-desktop-ready:20261016-v1
    timeout-minutes: 75
    env:
      MISE_AUTO_INSTALL: 'false'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      DEPOT_CI_CASE: logger
      CI: 'true'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: harness
        persist-credentials: false
        clean: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: source
        ref: ef01490f5e960f8ca0b424c12242caeb3c5a2b5e
        fetch-depth: 2
        persist-credentials: false
        clean: false
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        # Match the bootstrap already exercised by the exact-source trial.
        version: 2026.10.9
        working_directory: harness
        install: false
        env: false
        export_path: false
        cache: false
    - name: Install exact source tool versions
      working-directory: harness
      env:
        MISE_LOCKED: '0'
      run: mise run //package/dev-script/task-util:trial:depot:ci:native-tools
    - name: Verify source tool selection
      working-directory: harness
      run: mise run //package/dev-script/task-util:trial:depot:ci:native-tool-gate
    - name: Install frozen source dependencies
      working-directory: source
      run: mise run prepare:pnpm:install -- --frozen-lockfile
    - name: Exercise isolated virtual machine lifecycle
      working-directory: harness
      run: mise run //package/dev-script/task-util:trial:depot:vm
    - name: Preserve virtual machine evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: logger-vm-evidence
        path: ~/temp/agent/depot-complete-vm-evidence/
        if-no-files-found: error
