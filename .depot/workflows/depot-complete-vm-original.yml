name: depot-complete-vm-original

on:
  workflow_dispatch:
    inputs:
      cohort_id:
        description: Shared coherent cohort identifier
        required: true
        type: string
      manifest_sha256:
        description: SHA256 of the exact outer common manifest bytes
        required: true
        type: string
      requested_at:
        description: Shared UTC ISO request timestamp
        required: true
        type: string

permissions:
  contents: read

jobs:
  vm-original:
    runs-on:
      size: 16x64
      image: monochromatic-trial-desktop-ready:20261016-v1
    timeout-minutes: 20
    env:
      MISE_AUTO_INSTALL: 'false'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      DEPOT_CI_CASE: logger
      DEPOT_CI_COHORT_ID: ${{ inputs.cohort_id }}
      DEPOT_CI_COHORT_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      DEPOT_CI_COHORT_REQUESTED_AT: ${{ inputs.requested_at }}
      CI: 'true'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: harness
        persist-credentials: false
        clean: false
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: source
        ref: ef01490f5e960f8ca0b424c12242caeb3c5a2b5e
        fetch-depth: 2
        persist-credentials: false
        clean: false
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        # Match the bootstrap exercised by the immutable-source VM diagnostic.
        version: 2026.10.9
        working_directory: harness
        install: false
        env: false
        export_path: false
        cache: false
    - name: Bind the exact harness and common cohort
      working-directory: harness
      run: mise run //package/dev-script/task-util:trial:depot:vm:cohort
    - name: Verify immutable source before dependency preparation
      working-directory: harness
      env:
        DEPOT_CI_IDENTITY_PHASE: before
      run: mise run //package/dev-script/task-util:trial:depot:ci:source-identity
    - name: Install exact source tool versions
      working-directory: harness
      env:
        MISE_LOCKED: '0'
      run: mise run //package/dev-script/task-util:trial:depot:ci:native-tools
    - name: Verify source tool selection
      working-directory: harness
      run: mise run //package/dev-script/task-util:trial:depot:ci:native-tool-gate
    - name: Install frozen source dependencies
      working-directory: source
      run: mise run prepare:pnpm:install -- --frozen-lockfile
    - name: Execute the original selected VM lifecycle task
      working-directory: harness
      run: mise run //package/dev-script/task-util:trial:depot:vm:original
    - name: Verify immutable source and cohort after execution
      if: always()
      working-directory: harness
      env:
        DEPOT_CI_IDENTITY_PHASE: after
      run: mise run //package/dev-script/task-util:trial:depot:ci:source-identity
    - name: Preserve original VM task evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: logger-vm-original-evidence
        path: ~/temp/agent/depot-complete-vm-original-evidence/
        if-no-files-found: error
