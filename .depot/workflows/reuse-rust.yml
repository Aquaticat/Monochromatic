name: Isolated native CLI compiler-cache research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on:
      size: 8x32
      image: l4zncjjbj5.registry.depot.dev/research-reuse-20261018:tools-r1
    timeout-minutes: 15
    env:
      CI: 'true'
      MISE_AUTO_INSTALL: 'false'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      RESEARCH_REUSE_ROLE: consume
      REUSE_KIND: rust
      REUSE_PHASE: seed
      REUSE_DEPENDENCIES: installed
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        # Retain the frozen application ancestor for dependency admission.
        fetch-depth: 32
        # Preserve an unexpected old untracked source marker so the image control can detect it.
        clean: false
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        # Avoid unrelated root-tool installation and freeze the task bootstrap.
        version: 2026.10.9
        install: false
        cache: false
    - name: Verify captured tools and installed dependency extraction
      run: mise run //package/dev-script/task-util:research:reuse:tools
    - name: Mount only this experiment's trusted immutable target archive
      uses: depot/cache-mount@38d61fd25163e9ef3a3eff8a61676994d306e549
      with:
        name: aquaticats-monochromatic-reuse-20261018-native-target-trusted-r1
        path: /mnt/aquaticats-monochromatic-reuse-20261018-native-target-trusted-r1
        debug: 'true'
    - name: Build native CLI and execute existing Nextest consumers
      run: mise run //package/dev-script/task-util:research:reuse:rust
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reuse-rust-seed
        path: .research-reuse/receipts
        retention-days: 7
        if-no-files-found: warn
