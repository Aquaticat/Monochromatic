name: depot-prepared-desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-probe:
    runs-on:
      size: 2x8
      image: monochromatic-trial-desktop-packages:20261016-v1
    timeout-minutes: 3
    env:
      MISE_AUTO_INSTALL: 'false'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        clean: false
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        # Pin for the trial because release discovery previously returned HTTP 403.
        version: 2026.10.9
        install: false
        cache: false
    - name: Probe snapshot runtime and namespace capabilities
      run: mise run //package/music-player/desktop-app:trial:depot:prepared:probe
    - name: Boot an isolated systemd runtime from the unchanged installed filesystem
      run: mise run //package/music-player/desktop-app:trial:depot:prepared:boot-probe
