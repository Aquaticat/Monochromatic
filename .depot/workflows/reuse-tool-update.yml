name: Isolated native Git prerequisite tool snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on:
      size: 8x32
      image: l4zncjjbj5.registry.depot.dev/research-reuse-20261018:tools-r1
    timeout-minutes: 15
    env:
      CI: 'true'
      MISE_AUTO_INSTALL: 'false'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      RESEARCH_REUSE_ROLE: consume
      REUSE_KIND: tool-update
      REUSE_PHASE: prepare
      RESEARCH_PERSIST_CONTROL: synthetic-public-environment-20261018-r1
      RESEARCH_SECRET_CONTROL: synthetic-masked-environment-20261018-r1
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        fetch-depth: 64
        clean: false
    - name: Build the frozen CLI's required Git and prepare the audited sccache binary
      env:
        GH_TOKEN: ${{ github.token }}
      run: PATH="${HOME}/.local/share/mise/bin:${PATH}" "${HOME}/.local/share/mise/bin/mise" run //package/dev-script/task-util:research:reuse:tool-update
    - name: Exclude source and synthetic secret while retaining tool receipts
      env:
        RESEARCH_REUSE_ROLE: prepare
        RESEARCH_SEAL_RECEIPTS: /opt/depot-reuse-20261018-r1/receipts-r2
      run: PATH="${HOME}/.local/share/mise/bin:${PATH}" "${HOME}/.local/share/mise/bin/mise" run //package/dev-script/task-util:research:reuse:seal
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: reuse-tool-update
        path: |
          /opt/depot-reuse-20261018-r1/receipts-r2
          .research-reuse/receipts
        retention-days: 7
        if-no-files-found: warn
    - uses: depot/snapshot-action@a082cbabd407afdf324a7b4f41889795636f4b24
      with:
        image: l4zncjjbj5.registry.depot.dev/research-reuse-20261018:tools-r2-git256
        # Preserve the previously inspected resolver artifact across snapshot generations.
        version: 1.2.30
        max-age: 6h
        env-mask: |
          RESEARCH_SECRET_CONTROL
          DEPOT_CACHE_TOKEN
          DEPOT_JIT_TOKEN
          DEPOT_SNAPSHOT_TOKEN
          DEPOT_TOKEN
          SCCACHE_WEBDAV_TOKEN
          ACTIONS_RUNTIME_TOKEN
          ACTIONS_ID_TOKEN_REQUEST_TOKEN
          GITHUB_TOKEN
          GH_TOKEN
