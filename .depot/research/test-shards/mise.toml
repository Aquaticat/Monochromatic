[tools]
# Hold the CLI version whose split/report and credential source paths were audited for this experiment.
"github:depot/cli" = "2.102.23"

[tasks.prepare]
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const fs = await import('node:fs');
const os = await import('node:os');
const { join } = await import('node:path');
const { createHash, randomUUID } = await import('node:crypto');
const { execFileSync } = await import('node:child_process');
class PhysicalInputFailure extends Error {}
if (process.env.GITHUB_ACTIONS !== 'true' || process.env.RUNNER_NAME !== 'Depot CI') throw new PhysicalInputFailure('Physical input preparation requires the owned native CI job');
const root = process.cwd();
const base = join(root, '.depot/research/test-shards');
const input = join(base, 'input');
const tools = join(base, 'tools');
const evidence = join(base, 'evidence');
const transfer = join(base, 'transfer');
for (const path of [input, tools, evidence, transfer]) fs.mkdirSync(path, { recursive: true, mode: 0o700 });
const hash = value => createHash('sha256').update(value).digest('hex');
const zip = join(transfer, 'diagnostic.zip');
const url = process.env.MONO_RESEARCH_TESTS_ARCHIVE_URL_20261018;
delete process.env.MONO_RESEARCH_TESTS_ARCHIVE_URL_20261018;
if (!fs.existsSync(zip)) {
  if (!url || new URL(url).protocol !== 'https:') throw new PhysicalInputFailure('The exact producer object is missing and no owned signed GET URL was supplied');
  let response;
  try { response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(60000) }); }
  catch (error) { throw new PhysicalInputFailure('Producer GET failed before a response: ' + error.name + '; signed URL withheld'); }
  if (response.status !== 200) throw new PhysicalInputFailure('Producer GET HTTP status ' + response.status + '; signed URL withheld');
  const fd = fs.openSync(zip, 'wx', 0o600);
  let received = 0;
  try {
    for await (const chunk of response.body) {
      received += chunk.length;
      if (received > 98192385) throw new PhysicalInputFailure('Producer object exceeds its admitted byte count');
      fs.writeSync(fd, chunk);
    }
  } finally { fs.closeSync(fd); }
}
if (fs.statSync(zip).size !== 98192385 || hash(fs.readFileSync(zip)) !== '019694511127b9d0a3af6b79f62d1560e34d6c76d9e00ee1c8e4d60f04a723cb') throw new PhysicalInputFailure('Producer ZIP length or digest differs');
execFileSync('unzip', ['-t', zip], { timeout: 30000, stdio: 'pipe' });
for (const name of ['diagnostic-archive-manifest.json', 'diagnostic-native-nextest.tar.zst', 'diagnostic-git-2.56.0.tar.zst', 'diagnostic-host-tools.tar.zst']) {
  const fd = fs.openSync(join(input, name), 'wx', 0o600);
  try { execFileSync('unzip', ['-p', zip, name], { stdio: ['ignore', fd, 'pipe'], timeout: 30000 }); }
  finally { fs.closeSync(fd); }
}
const manifestBytes = fs.readFileSync(join(input, 'diagnostic-archive-manifest.json'));
if (hash(manifestBytes) !== '971b898f01f5edf054b02d5d97f9babfc36525982b674859af1fca93520dc70c') throw new PhysicalInputFailure('Producer manifest digest differs');
const manifest = JSON.parse(manifestBytes);
if (manifest.baseSourceSha !== 'e02be6c8b8fe9efb41a7f8f1a0b311c17796588a' || manifest.sourceFiles.length !== 1079) throw new PhysicalInputFailure('Producer source denominator differs');
for (const file of manifest.sourceFiles) if (hash(fs.readFileSync(join(root, file.path))) !== file.sha256) throw new PhysicalInputFailure('Frozen producer source mismatch: ' + file.path);
if (hash(fs.readFileSync(join(root, 'cli-git.config.jsonc'))) !== manifest.rootPolicySha256) throw new PhysicalInputFailure('Frozen root policy mismatch');
for (const bundle of manifest.bundles) if (hash(fs.readFileSync(join(input, bundle.name))) !== bundle.sha256) throw new PhysicalInputFailure('Bundle member digest differs: ' + bundle.name);
execFileSync('tar', ['--extract', '--zstd', '--no-same-owner', '--file', join(input, 'diagnostic-host-tools.tar.zst'), '--directory', tools], { timeout: 30000 });
execFileSync('sudo', ['--non-interactive', 'mkdir', '--parents', '/opt/depot-reuse-20261018-r1'], { timeout: 30000 });
execFileSync('sudo', ['--non-interactive', 'tar', '--extract', '--zstd', '--no-same-owner', '--file', join(input, 'diagnostic-git-2.56.0.tar.zst'), '--directory', '/opt/depot-reuse-20261018-r1'], { timeout: 30000 });
const git = '/opt/depot-reuse-20261018-r1/git-2.56.0/bin/git';
if (hash(fs.readFileSync(git)) !== manifest.gitBinarySha256) throw new PhysicalInputFailure('Producer Git digest differs');
execFileSync('sudo', ['--non-interactive', 'install', '--mode=0755', git, '/usr/bin/git'], { timeout: 30000 });
if (hash(fs.readFileSync(join(tools, 'cargo-nextest'))) !== manifest.nextestBinarySha256 || hash(fs.readFileSync(join(tools, 'monochromatic-lint'))) !== manifest.linterBinarySha256 || hash(fs.readFileSync('/usr/bin/git')) !== manifest.gitBinarySha256) throw new PhysicalInputFailure('Restored executable digest differs');
const cohortNonce = process.env.PROBE_COHORT_NONCE || randomUUID();
const result = { schemaVersion: 1, applicationBase: manifest.baseSourceSha, harness: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), cohortNonce, vmNonce: randomUUID(), hostname: os.hostname(), kernel: os.release(), cpus: os.cpus().length, memoryBytes: os.totalmem(), producerArtifact: '01a14e1d-1935-7a2b-9b89-c63429fec7c7', zipSha256: hash(fs.readFileSync(zip)), sourceFilesVerified: manifest.sourceFiles.length, nextestSha256: manifest.nextestBinarySha256, gitSha256: manifest.gitBinarySha256, publishedLinterPrerequisiteSha256: manifest.linterBinarySha256, downloadedBySignedGet: Boolean(url), secretUrlRetained: false, observedAt: new Date().toISOString() };
fs.writeFileSync(join(evidence, 'preparation.json'), JSON.stringify(result, null, 2) + '\n');
fs.appendFileSync(process.env.GITHUB_OUTPUT, 'cohort_nonce=' + cohortNonce + '\n');
console.log(JSON.stringify(result));
'''

[tasks.execute-selected]
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const fs = await import('node:fs');
const os = await import('node:os');
const { join } = await import('node:path');
const { createHash } = await import('node:crypto');
const { spawnSync, execFileSync } = await import('node:child_process');
class PhysicalExecutionFailure extends Error {}
const base = join(process.cwd(), '.depot/research/test-shards');
const label = process.env.PROBE_REPORT_LABEL;
if (!/^(?:seed-[123]|shard-[01])$/u.test(label ?? '')) throw new PhysicalExecutionFailure('Unexpected physical report label');
const selected = fs.readFileSync(0, 'utf8').trim().split('\n').filter(Boolean);
const candidates = fs.readFileSync(join(base, 'candidates.txt'), 'utf8').trim().split('\n');
if (!selected.length || new Set(selected).size !== selected.length || !selected.every(value => candidates.includes(value) && /^[A-Za-z_0-9:]+$/u.test(value))) throw new PhysicalExecutionFailure('Selected physical candidate identities are empty, duplicate, or outside the frozen cohort');
const scratch = join(os.homedir(), 'temp/agent');
fs.mkdirSync(scratch, { recursive: true, mode: 0o700 });
fs.chmodSync(scratch, 0o700);
const owned = fs.mkdtempSync(join(scratch, 'depot-physical-tests-'));
const temporary = join(owned, 'tmpfs');
const extraction = join(owned, 'archive');
fs.mkdirSync(temporary);
fs.mkdirSync(extraction);
const evidence = join(base, 'evidence');
const config = join(owned, 'nextest.toml');
fs.writeFileSync(config, '[store]\ndir = ' + JSON.stringify(join(evidence, 'nextest')) + '\n[profile.default.junit]\npath = ' + JSON.stringify(label + '.xml') + '\nreport-skipped = "none"\nstore-failure-output = true\n');
const mounted = spawnSync('sudo', ['--non-interactive', 'mount', '--types', 'tmpfs', '--options', 'size=256m,mode=1777,nodev,nosuid', 'tmpfs', temporary], { encoding: 'utf8', timeout: 30000 });
if (mounted.status !== 0) throw new PhysicalExecutionFailure('Owned diagnostic tmpfs mount failed: ' + mounted.stderr);
let result;
let cleaned;
const startedAt = new Date().toISOString();
try {
  if (String(fs.statfsSync(temporary, { bigint: true }).type) !== '16914836') throw new PhysicalExecutionFailure('Owned test directory is not the admitted tmpfs filesystem');
  const args = ['nextest', 'run', '--archive-file', join(base, 'input/diagnostic-native-nextest.tar.zst'), '--workspace-remap', join(process.cwd(), 'package/git-policy/cli'), '--extract-to', extraction, '--config-file', config, '--no-fail-fast', '--filterset', selected.map(value => 'test(=' + value + ')').join(' | ')];
  result = spawnSync(join(base, 'tools/cargo-nextest'), args, { cwd: join(process.cwd(), 'package/git-policy/cli'), env: { ...process.env, TMPDIR: temporary, PATH: join(base, 'tools') + ':/opt/depot-reuse-20261018-r1/git-2.56.0/bin:' + process.env.PATH, GIT_EXEC_PATH: '/opt/depot-reuse-20261018-r1/git-2.56.0/libexec/git-core' }, encoding: 'utf8', timeout: 90000, maxBuffer: 8388608 });
  fs.writeFileSync(join(evidence, label + '.nextest.log'), (result.stdout ?? '') + (result.stderr ?? ''));
} finally {
  cleaned = spawnSync('sudo', ['--non-interactive', 'umount', temporary], { encoding: 'utf8', timeout: 30000 });
}
const xmlPath = join(evidence, 'nextest/default', label + '.xml');
const xml = fs.readFileSync(xmlPath, 'utf8');
const cases = [...xml.matchAll(/<testcase\b([^>]*)>/gu)].map(value => /\bname="([A-Za-z_0-9:]+)"/u.exec(value[1])?.[1]);
const sorted = [...cases].sort();
const expected = [...selected].sort();
const record = { label, startedAt, finishedAt: new Date().toISOString(), status: result?.status ?? null, signal: result?.signal ?? null, selected, actualCases: cases, actualCasesExactlyMatchSelection: JSON.stringify(sorted) === JSON.stringify(expected), failureElements: [...xml.matchAll(/<failure\b/gu)].length, skippedElements: [...xml.matchAll(/<skipped\b/gu)].length, junitSha256: createHash('sha256').update(xml).digest('hex'), junitBytes: Buffer.byteLength(xml), diagnosticFilesystem: 'owned tmpfs,256MiB', cleanup: { unmountStatus: cleaned.status, tmpfsGone: String(fs.statfsSync(temporary, { bigint: true }).type) !== '16914836' }, nextestDefaultConcurrencyPreserved: true, productionSourceRepairClaimed: false };
fs.writeFileSync(join(evidence, label + '.execution.json'), JSON.stringify(record, null, 2) + '\n');
console.log(JSON.stringify(record));
if (record.status !== 0 || !record.actualCasesExactlyMatchSelection || record.failureElements || record.skippedElements || record.cleanup.unmountStatus !== 0 || !record.cleanup.tmpfsGone) throw new PhysicalExecutionFailure('Physical Nextest selection, assertion, or cleanup failed; original log/XML retained');
'''

[tasks.run-cohort]
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const fs = await import('node:fs');
const { join } = await import('node:path');
const { spawnSync, execFileSync } = await import('node:child_process');
class PhysicalReportFailure extends Error {}
const base = join(process.cwd(), '.depot/research/test-shards');
const preparation = JSON.parse(fs.readFileSync(join(base, 'evidence/preparation.json'), 'utf8'));
const phase = process.env.PROBE_PHASE;
const index = process.env.PROBE_SHARD_INDEX;
if (phase !== 'seed' && (phase !== 'shard' || !['0', '1'].includes(index))) throw new PhysicalReportFailure('Unexpected physical seed/shard phase');
const splitKey = 'research-physical-locks-e02be6c8-20261018';
const cliVersion = execFileSync('depot', ['--version'], { encoding: 'utf8' }).trim();
if (!/2\.102\.23/u.test(cliVersion)) throw new PhysicalReportFailure('Actual report CLI differs from the audited release: ' + cliVersion);
const runs = [];
for (const repeat of phase === 'seed' ? [1, 2, 3] : [1]) {
  const label = phase === 'seed' ? 'seed-' + repeat : 'shard-' + index;
  const args = ['tests', 'run', '--candidate-type', 'classname', '--timings-type', 'testname', '--candidates-file', join(base, 'candidates.txt'), '--index', phase === 'seed' ? '0' : index, '--total', phase === 'seed' ? '1' : '2', '--split-key', splitKey, '--command', 'mise run //.depot/research/test-shards:execute-selected', '--report-path', join(base, 'evidence/nextest/default', label + '.xml'), '--report-key', splitKey + ':' + label];
  const result = spawnSync('depot', args, { cwd: base, env: { ...process.env, PROBE_REPORT_LABEL: label }, encoding: 'utf8', timeout: 180000, maxBuffer: 8388608 });
  const log = (result.stdout ?? '') + (result.stderr ?? '');
  fs.writeFileSync(join(base, 'evidence', label + '.depot-tests.log'), log);
  const upload = /Depot uploaded (\d+) test report file\(s\), processed (\d+) file\(s\), reported (\d+) test\(s\), and skipped (\d+) file\(s\)/u.exec(log);
  const execution = fs.existsSync(join(base, 'evidence', label + '.execution.json')) ? JSON.parse(fs.readFileSync(join(base, 'evidence', label + '.execution.json'), 'utf8')) : null;
  runs.push({ label, status: result.status, signal: result.signal, timedCandidates: /Depot found timings for (\d+) candidate/u.exec(log)?.[1] ?? null, upload: upload ? { filesUploaded: Number(upload[1]), filesProcessed: Number(upload[2]), testsReported: Number(upload[3]), filesSkipped: Number(upload[4]) } : null, execution });
  if (result.status !== 0) break;
}
const record = { schemaVersion: 1, phase, shardIndex: phase === 'seed' ? null : Number(index), splitKey, preparation, cliVersion, runs, passed: runs.length === (phase === 'seed' ? 3 : 1) && runs.every(value => value.status === 0 && value.upload?.filesUploaded === 1 && value.upload.filesProcessed === 1 && value.upload.filesSkipped === 0 && value.upload.testsReported === value.execution?.actualCases.length), observedAt: new Date().toISOString() };
fs.writeFileSync(join(base, 'evidence/cohort.json'), JSON.stringify(record, null, 2) + '\n');
console.log(JSON.stringify(record));
if (!record.passed) throw new PhysicalReportFailure('Actual physical test execution or Depot JUnit report upload failed; retained receipt distinguishes them');
'''

[tasks.consume]
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const fs = await import('node:fs');
const { join } = await import('node:path');
const { createHash } = await import('node:crypto');
const { execFileSync } = await import('node:child_process');
class PhysicalConsumerFailure extends Error {}
const base = join(process.cwd(), '.depot/research/test-shards');
const received = join(base, 'received');
const files = [...fs.globSync('**/cohort.json', { cwd: received })];
const harness = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
const expectedNonce = process.env.PROBE_COHORT_NONCE;
if (!expectedNonce || files.length !== 3) throw new PhysicalConsumerFailure('Current seed nonce or exact producer cohort artifacts are missing');
const producers = files.map(path => {
  const bytes = fs.readFileSync(join(received, path));
  const value = JSON.parse(bytes);
  if (!value.passed || value.preparation.harness !== harness || value.preparation.applicationBase !== 'e02be6c8b8fe9efb41a7f8f1a0b311c17796588a' || value.preparation.cohortNonce !== expectedNonce || !value.runs.every(run => run.status === 0 && run.execution.actualCasesExactlyMatchSelection && run.execution.cleanup.tmpfsGone)) throw new PhysicalConsumerFailure('Physical producer/source/current-cohort assertion mismatch');
  return { path, sha256: createHash('sha256').update(bytes).digest('hex'), value };
});
const seed = producers.find(value => value.value.phase === 'seed');
const shards = producers.filter(value => value.value.phase === 'shard').sort((a, b) => a.value.shardIndex - b.value.shardIndex);
if (!seed || shards.length !== 2 || shards[0].value.shardIndex !== 0 || shards[1].value.shardIndex !== 1 || new Set(producers.map(value => value.value.preparation.vmNonce)).size !== 3) throw new PhysicalConsumerFailure('Distinct declared seed/shard producers are missing');
const candidates = fs.readFileSync(join(base, 'candidates.txt'), 'utf8').trim().split('\n').sort();
const union = shards.flatMap(value => value.value.runs[0].execution.actualCases);
if (union.length !== 34 || new Set(union).size !== 34 || JSON.stringify([...union].sort()) !== JSON.stringify(candidates)) throw new PhysicalConsumerFailure('Physical shard cases do not form the exact disjoint frozen union');
const result = { passed: true, harness, cohortNonce: expectedNonce, applicationBase: 'e02be6c8b8fe9efb41a7f8f1a0b311c17796588a', candidateCount: candidates.length, shardCaseCounts: shards.map(value => value.value.runs[0].execution.actualCases.length), distinctProducerVmNonces: true, physicalSandboxIdentityRequiresApiJoin: true, exactDisjointUnion: true, productionSourceRepairClaimed: false, producers };
fs.mkdirSync(join(base, 'evidence'), { recursive: true });
fs.writeFileSync(join(base, 'evidence/consumer.json'), JSON.stringify(result, null, 2) + '\n');
console.log(JSON.stringify({ passed: true, candidateCount: candidates.length, shardCaseCounts: result.shardCaseCounts, exactDisjointUnion: true, physicalSandboxIdentityRequiresApiJoin: true }));
'''
