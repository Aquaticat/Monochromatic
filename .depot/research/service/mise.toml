[tasks.secret-presence]
shell = "node --input-type=module-typescript -e"
run = '''
const fs = await import('node:fs');
const token = process.env.PROBE_PULL_TOKEN ?? '';
const record = { schemaVersion: 1, secretPresent: token.length > 0, tokenLength: token.length, githubRef: process.env.GITHUB_REF ?? null, githubRefName: process.env.GITHUB_REF_NAME ?? null, repository: process.env.GITHUB_REPOSITORY ?? null, harness: process.env.GITHUB_SHA ?? null, observedAt: new Date().toISOString() };
fs.mkdirSync('evidence', { recursive: true });
fs.writeFileSync('evidence/secret-presence.json', JSON.stringify(record, null, 2) + '\n');
console.log(JSON.stringify(record));
'''

[tasks.consume]
shell = "node --input-type=module-typescript -e"
run = '''
const fs = await import('node:fs');
const { createHash } = await import('node:crypto');
const { execFileSync } = await import('node:child_process');
class ServiceConsumerFailure extends Error {}
const endpoint = process.env.PROBE_SERVICE_URL;
const nonce = process.env.PROBE_SERVICE_NONCE;
const architecture = process.env.PROBE_EXPECTED_ARCH;
if (!endpoint || !nonce || !['x64', 'arm64'].includes(architecture)) throw new ServiceConsumerFailure('Required service consumer inputs are absent');
const expected = { repositoryBase: 'e02be6c8b8fe9efb41a7f8f1a0b311c17796588a', harnessCommit: '5cfc1d90f92154cf62fa95789fad9bd7deeda208', architecture, nonce, cohort: 'monochromatic-platform-buildkit-20261018-v1' };
const records = [];
for (const path of ['/health', '/nonce', '/owned-missing-' + nonce]) {
  const response = await fetch(endpoint + path, { cache: 'no-store', signal: AbortSignal.timeout(5000) });
  const text = await response.text();
  if (Buffer.byteLength(text) > 65536) throw new ServiceConsumerFailure('Owned service response exceeds its bounded fixture schema');
  const body = JSON.parse(text);
  const status = path.startsWith('/owned-missing-') ? 404 : 200;
  if (response.status !== status || body.path !== path || body.status !== (status === 200 ? 'ok' : 'not-found') || response.headers.get('cache-control') !== 'no-store') throw new ServiceConsumerFailure('Service HTTP status/path/freshness control mismatch');
  for (const [key, value] of Object.entries(expected)) if (body[key] !== value) throw new ServiceConsumerFailure('Service source, nonce or architecture mismatch for ' + key);
  records.push({ path, httpStatus: response.status, body, bodySha256: createHash('sha256').update(text).digest('hex') });
}
let container;
if (process.env.PROBE_JOB_CONTAINER === 'true') {
  const inputBytes = fs.readFileSync('/app/probe.json');
  const builderBytes = fs.readFileSync('/proof/builder.json');
  const toolsBytes = fs.readFileSync('/opt/depot-research/image-tools.json');
  const tools = JSON.parse(toolsBytes.toString('utf8'));
  const toolsSha256 = createHash('sha256').update(toolsBytes).digest('hex');
  const expectedToolsSha256 = architecture === 'x64' ? '53d2d2c340ef8214c8b9caf2da0b94c38327c63655d4656729a3b54c5d1e7f96' : '1229b983f4c529867d6a0fb1d0b1f1c1ba00f8b941c04d599ecd3d6845f3afa2';
  const jobImageReference = process.env.PROBE_JOB_IMAGE_REFERENCE;
  const expectedJobImage = 'registry.depot.dev/27m5m3vjlv@sha256:853b99050d5420698a02d7cb10978be8824dc0999c9ace08ec453706da54ec31';
  if (toolsBytes.length > 65536 || toolsSha256 !== expectedToolsSha256 || tools.architecture !== architecture || tools.harnessCommit !== '7590bcde15e5ceef4dc36f4e2c3d975e1c1b833f' || jobImageReference !== expectedJobImage) throw new ServiceConsumerFailure('Derived CI image tool/source/digest proof mismatch');
  const nodeHasher = createHash('sha256');
  for await (const chunk of fs.createReadStream(process.execPath)) nodeHasher.update(chunk);
  const actualNodeSha256 = nodeHasher.digest('hex');
  const libatomicMappings = [...new Set(fs.readFileSync('/proc/self/maps', 'utf8').split('\n').filter(line => line.includes('libatomic.so.')).map(line => line.slice(line.indexOf('/'))))];
  if (process.version !== 'v26.12.0' || actualNodeSha256 !== tools.repositoryNode.binarySha256 || libatomicMappings.length === 0) throw new ServiceConsumerFailure('Actual repository Node binary or loaded libatomic mapping does not match the qualified image prerequisite');
  const actualGitVersion = execFileSync('git', ['--version'], { encoding: 'utf8' }).trim();
  if (actualGitVersion !== 'git version 2.39.5') throw new ServiceConsumerFailure('Derived CI image Git executable did not satisfy its measured prerequisite identity');
  if (inputBytes.length > 65536 || builderBytes.length > 65536) throw new ServiceConsumerFailure('Job image proof exceeds the fixture boundary');
  const input = JSON.parse(inputBytes.toString('utf8'));
  const builder = JSON.parse(builderBytes.toString('utf8'));
  if (process.arch !== architecture || input.repositoryBase !== expected.repositoryBase || builder.architecture !== architecture || builder.harnessCommit !== expected.harnessCommit) throw new ServiceConsumerFailure('Actual job-container filesystem/source/architecture proof mismatch');
  container = { input, builder, tools, toolsSha256, actualGitVersion, actualNodeSha256, libatomicMappings, imageReference: jobImageReference, inputSha256: createHash('sha256').update(inputBytes).digest('hex'), builderSha256: createHash('sha256').update(builderBytes).digest('hex'), processArchitecture: process.arch, consumerNodeVersion: process.version };
}
const result = { schemaVersion: 1, passed: true, provider: process.env.PROBE_PLATFORM_PROVIDER, consumerHarness: process.env.GITHUB_SHA, expected, imageReference: 'registry.depot.dev/27m5m3vjlv@sha256:4f2c182b14f816dfe9ab08f531a8d49378b5f76767b8f56f7c9154f05d0ff3e7', endpoint, jobContainer: container ?? null, responses: records, observedAt: new Date().toISOString() };
fs.mkdirSync('evidence', { recursive: true });
fs.writeFileSync('evidence/service-consumer.json', JSON.stringify(result, null, 2) + '\n');
console.log(JSON.stringify(result));
'''
