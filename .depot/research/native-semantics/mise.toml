[tasks.retry-state]
shell = "node --input-type=module-typescript -e"
run = '''
const fs = await import('node:fs');
class IntentionalRetryFailure extends Error {}
fs.mkdirSync('evidence', { recursive: true });
const path = 'evidence/retry-attempts.json';
const attempts = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : [];
const attempt = attempts.length + 1;
if (attempt > 3 || !process.env.GITHUB_ENV || !process.env.GITHUB_OUTPUT) throw new Error('Unexpected retry-state fixture context');
attempts.push({ attempt, at: new Date().toISOString(), pid: process.pid });
fs.writeFileSync(path, JSON.stringify(attempts, null, 2) + '\n');
fs.appendFileSync(process.env.GITHUB_ENV, 'PROBE_RETRY=' + attempt + '\n');
fs.appendFileSync(process.env.GITHUB_OUTPUT, 'attempt=' + attempt + '\n');
console.log(JSON.stringify({ probe: 'retry-state', attempt }));
if (attempt < 3) throw new IntentionalRetryFailure('Intentional retry-state failure before the third execution');
'''

[tasks.assert-retry]
shell = "node --input-type=module-typescript -e"
run = '''
const fs = await import('node:fs');
const attempts = JSON.parse(fs.readFileSync('evidence/retry-attempts.json', 'utf8'));
if (attempts.length !== 3 || attempts.some((value, index) => value.attempt !== index + 1)) throw new Error('Retry state did not retain exactly three ordered executions');
if (process.env.PROBE_RETRY !== '3' || process.env.PROBE_RETRY_OUTPUT !== '3') throw new Error('Retry environment/output did not retain the final value');
fs.writeFileSync('evidence/retry-assertion.json', JSON.stringify({ passed: true, attempts, env: process.env.PROBE_RETRY, output: process.env.PROBE_RETRY_OUTPUT }, null, 2) + '\n');
'''

[tasks.parallel-first]
shell = "node --input-type=module-typescript -e"
run = '''
const fs = await import('node:fs');
const { setTimeout } = await import('node:timers/promises');
const role = process.env.PROBE_ROLE;
if (!['a', 'b'].includes(role) || !process.env.GITHUB_ENV || !process.env.GITHUB_OUTPUT) throw new Error('Unexpected parallel-first fixture context');
const other = role === 'a' ? 'b' : 'a';
fs.mkdirSync('evidence', { recursive: true });
fs.writeFileSync('evidence/parallel-' + role + '-started', role);
const deadline = Date.now() + 10000;
while (!fs.existsSync('evidence/parallel-' + other + '-started') && Date.now() < deadline) await setTimeout(50);
if (!fs.existsSync('evidence/parallel-' + other + '-started')) throw new Error('Parallel sibling filesystem marker did not become visible');
if (process.env.PROBE_A || process.env.PROBE_B) throw new Error('Parallel branch saw an unexpected sibling environment update');
fs.appendFileSync(process.env.GITHUB_ENV, 'PROBE_' + role.toUpperCase() + '=' + role + '\n');
fs.appendFileSync(process.env.GITHUB_OUTPUT, 'value=' + role + '\n');
fs.writeFileSync('evidence/parallel-' + role + '-first.json', JSON.stringify({ role, siblingFilesystemVisible: true, siblingEnvironmentAbsent: true, at: new Date().toISOString() }, null, 2) + '\n');
'''

[tasks.parallel-next]
shell = "node --input-type=module-typescript -e"
run = '''
const fs = await import('node:fs');
const role = process.env.PROBE_ROLE;
if (!['a', 'b'].includes(role)) throw new Error('Unexpected parallel-next role');
const own = 'PROBE_' + role.toUpperCase();
const sibling = role === 'a' ? 'PROBE_B' : 'PROBE_A';
if (process.env[own] !== role || process.env[sibling]) throw new Error('Sequential branch environment isolation did not match its own update');
fs.writeFileSync('evidence/parallel-' + role + '-next.json', JSON.stringify({ role, ownEnvironment: process.env[own], siblingEnvironmentAbsent: true, at: new Date().toISOString() }, null, 2) + '\n');
'''

[tasks.assert-parallel]
shell = "node --input-type=module-typescript -e"
run = '''
const fs = await import('node:fs');
if (process.env.PROBE_A !== 'a' || process.env.PROBE_B !== 'b' || process.env.PROBE_A_OUTPUT !== 'a' || process.env.PROBE_B_OUTPUT !== 'b') throw new Error('Parallel environment/output merge did not retain both independent branch updates');
const branches = ['a', 'b'].map(role => ({ first: JSON.parse(fs.readFileSync('evidence/parallel-' + role + '-first.json', 'utf8')), next: JSON.parse(fs.readFileSync('evidence/parallel-' + role + '-next.json', 'utf8')) }));
fs.writeFileSync('evidence/parallel-assertion.json', JSON.stringify({ passed: true, branches, env: { a: process.env.PROBE_A, b: process.env.PROBE_B }, outputs: { a: process.env.PROBE_A_OUTPUT, b: process.env.PROBE_B_OUTPUT } }, null, 2) + '\n');
'''

[tasks.timeout-renew]
shell = "node --input-type=module-typescript -e"
run = '''
const fs = await import('node:fs');
const { setTimeout } = await import('node:timers/promises');
fs.mkdirSync('evidence', { recursive: true });
const path = 'evidence/timeout-renew.json';
const attempts = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : [];
const attempt = attempts.length + 1;
if (attempt > 2) throw new Error('Unexpected timeout-renew execution count');
const observation = { attempt, startedAt: new Date().toISOString(), intendedHoldMilliseconds: attempt === 1 ? 70000 : 50000 };
attempts.push(observation);
fs.writeFileSync(path, JSON.stringify(attempts, null, 2) + '\n');
console.log(JSON.stringify({ probe: 'timeout-renew', ...observation }));
await setTimeout(observation.intendedHoldMilliseconds);
fs.writeFileSync('evidence/timeout-renew-completed-' + attempt + '.json', JSON.stringify({ attempt, completedAt: new Date().toISOString() }) + '\n');
'''

[tasks.always-fail]
shell = "node --input-type=module-typescript -e"
run = '''
const fs = await import('node:fs');
class IntentionalExhaustionFailure extends Error {}
const key = process.env.PROBE_FAIL_KEY;
if (!['absorbed', 'backoff'].includes(key)) throw new Error('Unexpected intentional failure key');
fs.mkdirSync('evidence', { recursive: true });
const path = 'evidence/' + key + '-attempts.json';
const attempts = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : [];
const value = { probe: key, attempt: attempts.length + 1, at: new Date().toISOString() };
attempts.push(value);
fs.writeFileSync(path, JSON.stringify(attempts, null, 2) + '\n');
console.log(JSON.stringify(value));
throw new IntentionalExhaustionFailure('Intentional exhausted retry control: ' + key);
'''

[tasks.finish-state]
shell = "node --input-type=module-typescript -e"
run = '''
const fs = await import('node:fs');
const { execFileSync } = await import('node:child_process');
const renewal = JSON.parse(fs.readFileSync('evidence/timeout-renew.json', 'utf8'));
const absorbed = JSON.parse(fs.readFileSync('evidence/absorbed-attempts.json', 'utf8'));
if (renewal.length !== 2 || fs.existsSync('evidence/timeout-renew-completed-1.json') || !fs.existsSync('evidence/timeout-renew-completed-2.json')) throw new Error('Per-attempt timeout renewal did not complete only the second execution');
if (absorbed.length !== 2) throw new Error('continue-on-error did not exhaust both retry executions');
const result = { schemaVersion: 1, probe: 'state', passed: true, applicationBase: 'e02be6c8b8fe9efb41a7f8f1a0b311c17796588a', harness: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), renewal, absorbed, retry: JSON.parse(fs.readFileSync('evidence/retry-assertion.json', 'utf8')), parallel: JSON.parse(fs.readFileSync('evidence/parallel-assertion.json', 'utf8')), exhaustedStep: { outcome: process.env.PROBE_EXHAUSTED_OUTCOME, conclusion: process.env.PROBE_EXHAUSTED_CONCLUSION } };
fs.writeFileSync('evidence/state.json', JSON.stringify(result, null, 2) + '\n');
console.log(JSON.stringify({ probe: result.probe, passed: result.passed, harness: result.harness }));
'''

[tasks.parallel-delayed-fail]
shell = "node --input-type=module-typescript -e"
run = '''
const fs = await import('node:fs');
const { setTimeout } = await import('node:timers/promises');
class IntentionalParallelFailure extends Error {}
fs.mkdirSync('evidence', { recursive: true });
fs.writeFileSync('evidence/failure-started', new Date().toISOString());
const deadline = Date.now() + 10000;
while (!fs.existsSync('evidence/sibling-started') && Date.now() < deadline) await setTimeout(50);
if (!fs.existsSync('evidence/sibling-started')) throw new Error('Parallel failure control never observed its sibling start');
await setTimeout(100);
throw new IntentionalParallelFailure('Intentional parallel failure after the sibling started');
'''

[tasks.parallel-sibling]
shell = "node --input-type=module-typescript -e"
run = '''
const fs = await import('node:fs');
const { setTimeout } = await import('node:timers/promises');
fs.mkdirSync('evidence', { recursive: true });
fs.writeFileSync('evidence/sibling-started', new Date().toISOString());
await setTimeout(8000);
fs.writeFileSync('evidence/sibling-finished', new Date().toISOString());
'''

[tasks.record-parallel-failure]
shell = "node --input-type=module-typescript -e"
run = '''
const fs = await import('node:fs');
const { execFileSync } = await import('node:child_process');
const block = process.env.PROBE_BLOCK;
if (!['default', 'allrun'].includes(block)) throw new Error('Unexpected parallel failure control');
const actual = { failureStarted: fs.existsSync('evidence/failure-started'), siblingStarted: fs.existsSync('evidence/sibling-started'), siblingFinished: fs.existsSync('evidence/sibling-finished') };
const passed = actual.failureStarted && actual.siblingStarted && actual.siblingFinished === (block === 'allrun');
const result = { schemaVersion: 1, probe: 'parallel-' + block, passed, applicationBase: 'e02be6c8b8fe9efb41a7f8f1a0b311c17796588a', harness: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), actual, at: new Date().toISOString() };
fs.writeFileSync('evidence/parallel-' + block + '.json', JSON.stringify(result, null, 2) + '\n');
console.log(JSON.stringify(result));
if (!passed) throw new Error('Parallel failure behavior did not match the declared control');
'''

[tasks.artifact-consumer]
shell = "node --input-type=module-typescript -e"
run = '''
const fs = await import('node:fs');
const { createHash } = await import('node:crypto');
const { execFileSync } = await import('node:child_process');
const harness = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
class ArtifactAdmissionFailure extends Error {}
const admit = (value, probe) => {
  if (value.schemaVersion !== 1 || value.probe !== probe || value.passed !== true || value.harness !== harness || value.applicationBase !== 'e02be6c8b8fe9efb41a7f8f1a0b311c17796588a') throw new ArtifactAdmissionFailure('Research artifact identity or assertion mismatch');
};
const receipts = ['state', 'parallel-default', 'parallel-allrun'].map(probe => {
  const path = 'received/' + probe + '.json';
  const bytes = fs.readFileSync(path);
  const value = JSON.parse(bytes.toString('utf8'));
  admit(value, probe);
  let rejected = false;
  try { admit({ ...value, harness: '0'.repeat(40) }, probe); }
  catch (error) { if (!(error instanceof ArtifactAdmissionFailure)) throw error; rejected = true; }
  if (!rejected) throw new Error('Artifact source-mismatch rejection control failed');
  return { probe, path, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex'), sourceMismatchRejected: rejected };
});
fs.mkdirSync('evidence', { recursive: true });
fs.writeFileSync('evidence/consumer.json', JSON.stringify({ passed: true, harness, receipts, needs: JSON.parse(process.env.PROBE_NEEDS) }, null, 2) + '\n');
console.log(JSON.stringify({ passed: true, harness, receipts }));
'''
