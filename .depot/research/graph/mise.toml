\"path\\\":\\\"package/module/logger/src/sink/local-storage.browser.test.ts\\\",\\\"sha256\\\":\\\"dca8c7e058277a166ff77a08602f00e683dfb41254b5945ea2a902b102175224\\\"},{\\\"path\\\":\\\"package/module/logger/src/sink/opfs.browser.test.ts\\\",\\\"sha256\\\":\\\"c5c87179aaba429c50c48c64c36cb918d52832cfae1f86a2e83e194b413aaf54\\\"},{\\\"path\\\":\\\"package/module/logger/src/sink/session-storage.browser.test.ts\\\",\\\"sha256\\\":\\\"2a69896a6641ad0b9d4ba2443bab3a6ec0ab06e97eca7af12afd23172290bc01\\\"},{\\\"path\\\":\\\"package/module/test/src/sinon.browser.test.ts\\\",\\\"sha256\\\":\\\"aac4049bf3609e1bba2256df4a43633b49d2a1986ea012dd131699a029c6c672\\\"},{\\\"path\\\":\\\"package/webapp-productivity/wc/src/page.browser.test.ts\\\",\\\"sha256\\\":\\\"06ffb97d0d41b2b91ece8303aeced8b53239b5df8a2301dd1236dc935e635362\\\"},{\\\"path\\\":\\\"playwright.Dockerfile\\\",\\\"sha256\\\":\\\"e802ff364dc61464c1e868a5fe4d6be4c660dc2728ffb8dda16fcee53200ef83\\\"},{\\\"path\\\":\\\"playwright.browser.config.ts\\\",\\\"sha256\\\":\\\"22481714fd67d226521833e84b99baa0fe51922d3e2d9c1633ed2d4ae441118f\\\"},{\\\"path\\\":\\\"playwright.e2e.config.ts\\\",\\\"sha256\\\":\\\"6b35988518bdae0839af449415228647348ba04322a1c3bc4cf6a255f3a70b6a\\\"},{\\\"path\\\":\\\"playwright/serve.ts\\\",\\\"sha256\\\":\\\"d88b62296e3bd88612de22d748192bc3d564a6b754cadef7b4cf22a8139e68ee\\\"},{\\\"path\\\":\\\"playwright/test-harness.html\\\",\\\"sha256\\\":\\\"179ffca60c45c207ee154c7af1aed30734122cdb515d366222313b06c0fdc584\\\"}]}]}}\");\n\nconst realPodman=require('node:child_process').execFileSync('sh',['-c','command -v podman'],{encoding:'utf8'}).trim();\nconst bin=process.env.RUNNER_TEMP+'/coverage-podman-boundary';mkdirSync(bin,{recursive:true});\nconst wrapper='#!/usr/bin/env node\\nconst {spawnSync}=require(\"node:child_process\");const args=process.argv.slice(2);if(args[0]===\"run\"){args.splice(1,0,\"--memory=2g\",\"--cpus=2\",\"--pids-limit=256\")}const result=spawnSync('+JSON.stringify(realPodman)+',args,{stdio:\"inherit\"});if(result.error)throw result.error;process.exitCode=result.status??1;\\n';\nwriteFileSync(bin+'/podman',wrapper,{mode:0o700});require('node:fs').appendFileSync(process.env.GITHUB_PATH,bin+'\\n');"

[tasks."campaign"]
dir = "../../.."
shell = "node --input-type=module-typescript -e"
run = "await (async function campaign() {\n  const fs = await import('node:fs');\n  const { join } = await import('node:path');\n  const { spawn, execFileSync } = await import('node:child_process');\n  const { once } = await import('node:events');\n  const { setTimeout: wait } = await import('node:timers/promises');\n  const { createHash } = await import('node:crypto');\n  const root = execFileSync('git', ['rev-parse', '--show-toplevel'], { encoding: 'utf8' }).trim();\n  const planBytes = fs.readFileSync(join(root, '.depot/research/graph/plan.json'));\n  const plan = JSON.parse(planBytes);\n  const evidence = join(process.env.RUNNER_TEMP, 'expanded-graph');\n  fs.mkdirSync(evidence, { recursive: true });\n  const started = Date.now();\n  const sourceBoundary = JSON.parse(fs.readFileSync(join(evidence, 'job-start.json'), 'utf8'));\n  const deadline = Math.min(started + plan.campaignMilliseconds, sourceBoundary.startedMilliseconds + 1620000);\n  const changedSource = () => {\n    const committed = plan.topLevelSourceEntries.filter(entry => execFileSync('git', ['rev-parse', 'HEAD:' + entry.path], { cwd: root, encoding: 'utf8' }).trim() !== entry.gitObject).map(entry => 'committed:' + entry.path);\n    const working = execFileSync('git', ['diff', '--name-only'], { cwd: root, encoding: 'utf8' }).trim().split('\\n').filter(Boolean);\n    return [...committed, ...working];\n  };\n  if (changedSource().length) throw new Error('Frozen application source differs before graph');\n  const target = join(process.env.RUNNER_TEMP, 'expanded-graph-cargo-target');\n  if (fs.existsSync(target)) throw new Error('Fresh graph target already exists');\n  const manifest = { schemaVersion: 1, application: plan.application, harness: execFileSync('git', ['rev-parse', 'HEAD'], { cwd: root, encoding: 'utf8' }).trim(), planSha256: createHash('sha256').update(planBytes).digest('hex'), provider: process.env.GRAPH_PROVIDER, repetition: process.env.GRAPH_REPETITION, startedAt: new Date(started).toISOString(), boundary: plan.executionBoundary, cachePolicy: plan.cachePolicy, initialCargoTargetAbsent: true, nodes: [], toolVersions: Object.fromEntries([['mise', ['--version']], ['node', ['--version']], ['pnpm', ['--version']], ['rustc', ['--version','--verbose']], ['cargo', ['nextest','--version']]].map(([tool, args]) => [tool, execFileSync(tool, args, { encoding: 'utf8' }).trim()])) };\n  const save = () => fs.writeFileSync(join(evidence, 'graph.json'), JSON.stringify(manifest, null, 2) + '\\n');\n  const owned = new Set();\n  const signalGroup = (pid, signal) => {\n    try { process.kill(-pid, signal); return true; }\n    catch (error) { if (error.code !== 'ESRCH') throw error; return false; }\n  };\n  async function runCommand({ command, node, index }) {\n    const logName = node.id + '-' + String(index).padStart(3, '0') + '.log';\n    const logPath = join(evidence, logName);\n    const outcome = { ...command, log: logName, startedAt: new Date().toISOString() };\n    if (deadline - Date.now() < 15000) return { ...outcome, state: 'not_started_campaign_budget' };\n    const fd = fs.openSync(logPath, 'w');\n    const environment = { ...process.env, CARGO_TARGET_DIR: target };\n    delete environment.CARGO_BUILD_JOBS;\n    delete environment.NEXTEST_TEST_THREADS;\n    delete environment.RUST_TEST_THREADS;\n    const child = spawn('mise', ['run', command.task, ...(command.args ?? [])], { cwd: root, env: environment, detached: true, stdio: ['ignore', fd, fd] });\n    if (!child.pid) throw new Error('Owned command did not acquire a PID');\n    owned.add(child.pid);\n    let expired = false;\n    let killTimer;\n    const timeout = Math.min(command.kind.startsWith('actual_') && command.kind.endsWith('_owner') && command.task.includes('package/') ? 600000 : 180000, deadline - Date.now() - 10000);\n    const timer = setTimeout(() => {\n      expired = true;\n      signalGroup(child.pid, 'SIGTERM');\n      killTimer = setTimeout(() => signalGroup(child.pid, 'SIGKILL'), 3000);\n    }, timeout);\n    try {\n      const [status, signal] = await once(child, 'close');\n      outcome.status = status;\n      outcome.signal = signal;\n      outcome.state = expired ? 'command_budget_exhausted' : status === 0 ? 'succeeded' : 'failed_requires_classification';\n    } finally {\n      clearTimeout(timer);\n      clearTimeout(killTimer);\n      fs.closeSync(fd);\n      if (signalGroup(child.pid, 0)) {\n        signalGroup(child.pid, 'SIGTERM');\n        await wait(3000);\n        signalGroup(child.pid, 'SIGKILL');\n      }\n      owned.delete(child.pid);\n    }\n    outcome.completedAt = new Date().toISOString();\n    outcome.durationMilliseconds = Date.parse(outcome.completedAt) - Date.parse(outcome.startedAt);\n    const bytes = fs.readFileSync(logPath);\n    outcome.logBytes = bytes.length;\n    outcome.logSha256 = createHash('sha256').update(bytes).digest('hex');\n    return outcome;\n  }\n  async function group({ id, needs, commands }) {\n    const node = { id, needs, startedAt: new Date().toISOString(), outcomes: [] };\n    manifest.nodes.push(node);\n    save();\n    for (const [index, command] of commands.entries()) {\n      node.outcomes.push(await runCommand({ command, node, index }));\n      save();\n    }\n    node.completedAt = new Date().toISOString();\n    node.durationMilliseconds = Date.parse(node.completedAt) - Date.parse(node.startedAt);\n    save();\n    return node;\n  }\n  async function nodeBranch() {\n    const producer = await group({ id: 'shared-node-producer', needs: [], commands: plan.shared });\n    if (producer.outcomes.some(outcome => outcome.state !== 'succeeded')) throw new Error('Shared producer failed; dependent nodes not exercised');\n    await Promise.all([group({ id: 'modules-a', needs: ['shared-node-producer'], commands: plan.modules.a }), group({ id: 'modules-b', needs: ['shared-node-producer'], commands: plan.modules.b }), group({ id: 'browser', needs: ['shared-node-producer'], commands: plan.browser })]);\n  }\n  try {\n    const outcomes = await Promise.allSettled([nodeBranch(), group({ id: 'rust', needs: [], commands: plan.rust })]);\n    manifest.branchErrors = outcomes.flatMap((outcome, index) => outcome.status === 'rejected' ? [{ index, error: String(outcome.reason) }] : []);\n  } finally {\n    for (const pid of owned) signalGroup(pid, 'SIGKILL');\n    manifest.remainingOwnedDriverGroups = owned.size;\n    manifest.changedTrackedApplicationFiles = changedSource();\n    manifest.completedAt = new Date().toISOString();\n    manifest.durationMilliseconds = Date.now() - started;\n    manifest.sharedProducerInvocations = manifest.nodes.filter(node => node.id === 'shared-node-producer').length;\n    manifest.commandCount = manifest.nodes.reduce((count, node) => count + node.outcomes.length, 0);\n    manifest.failedCommands = manifest.nodes.flatMap(node => node.outcomes.filter(outcome => outcome.state !== 'succeeded').map(outcome => ({ node: node.id, task: outcome.task, state: outcome.state, log: outcome.log })));\n    save();\n  }\n  console.log(JSON.stringify({ completedAt: manifest.completedAt, durationMilliseconds: manifest.durationMilliseconds, commands: manifest.commandCount, sharedProducerInvocations: manifest.sharedProducerInvocations, failedCommands: manifest.failedCommands.length, branchErrors: manifest.branchErrors }));\n  if (manifest.failedCommands.length || manifest.branchErrors.length || manifest.changedTrackedApplicationFiles.length) throw new Error('Expanded source graph retains failing gates; inspect actual command receipts');\n})();"
