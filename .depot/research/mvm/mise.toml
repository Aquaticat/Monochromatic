  if (value.error?.code === 'ETIMEDOUT' && value.pid) {
    try { process.kill(-value.pid, 'SIGKILL'); } catch (error) { if (error.code !== 'ESRCH') throw error; }
  }
  fs.writeFileSync(join(evidence, id + '.stdout.log'), value.stdout ?? '');
  fs.writeFileSync(join(evidence, id + '.stderr.log'), value.stderr ?? '');
  const record = { id, command: [command, ...args], startedAt, finishedAt: new Date().toISOString(), status: value.status, signal: value.signal, error: value.error?.message ?? null };
