[tasks.analysis]
shell = "node --input-type=module -e"
run = '''
const {execFileSync,spawnSync} = await import('node:child_process');
const {mkdirSync,readFileSync,writeFileSync} = await import('node:fs');
const {join} = await import('node:path');
const {createHash} = await import('node:crypto');
const token=process.env.INPUT_REPO_TOKEN;
if(!token)throw new Error('Read-only repository token missing');
const repository=process.env.GITHUB_REPOSITORY;
if(repository!=='Aquaticats/Monochromatic')throw new Error('Unexpected repository');
const directory=join(process.cwd(),'output');
mkdirSync(directory,{recursive:true});
const sanitize=value=>String(value??'').replaceAll(token,'[REDACTED]');
const api=async path=>{
  const response=await fetch(`https://api.github.com/${path}`,{headers:{authorization:`Bearer ${token}`,accept:'application/vnd.github+json'},signal:AbortSignal.timeout(30000)});
  if(!response.ok)throw new Error(`Repository metadata request returned HTTP ${response.status}`);
  return await response.json();
};
const metadata=await api(`repos/${repository}`);
if(metadata.default_branch!=='main')throw new Error('Expected main default branch');
const before=await api(`repos/${repository}/commits/main`);
writeFileSync(join(directory,'event.json'),JSON.stringify({repository:{full_name:repository,default_branch:'main',fork:metadata.fork,private:metadata.private}}));
const image='ghcr.io/ossf/scorecard-action:v2.4.1';
execFileSync('docker',['pull',image],{stdio:'inherit'});
const digest=JSON.parse(execFileSync('docker',['image','inspect',image],{encoding:'utf8'}))[0].RepoDigests;
const startedAt=new Date().toISOString();
const start=performance.now();
const containerName=`scorecard-trial-${process.env.GITHUB_RUN_ID}`;
const result=spawnSync('docker',['run','--rm','--name',containerName,'--memory=2g','--cpus=2','--pids-limit=256','--mount',`type=bind,source=${directory},target=/output`,'--workdir','/output','--env','INPUT_REPO_TOKEN','--env','GITHUB_REPOSITORY','--env','GITHUB_REF=refs/heads/main','--env','GITHUB_EVENT_NAME=workflow_dispatch','--env','GITHUB_EVENT_PATH=/output/event.json','--env','GITHUB_WORKSPACE=/output','--env','GITHUB_API_URL=https://api.github.com','--env','INPUT_RESULTS_FORMAT=json','--env','INPUT_RESULTS_FILE=results.json','--env','INPUT_PUBLISH_RESULTS=false',image],{encoding:'utf8',maxBuffer:16*1024*1024,timeout:720000});
if(result.error){
  const cleanup=spawnSync('docker',['container','rm','--force',containerName],{encoding:'utf8',timeout:30000});
  console.error(sanitize(cleanup.stderr));
}
const elapsedMs=performance.now()-start;
const finishedAt=new Date().toISOString();
const stdout=sanitize(result.stdout),stderr=sanitize(result.stderr);
writeFileSync(join(directory,'analysis.stdout.txt'),stdout);
writeFileSync(join(directory,'analysis.stderr.txt'),stderr);
console.log(stdout);
console.error(stderr);
const after=await api(`repos/${repository}/commits/main`);
const runtime={schemaVersion:1,cohort:{id:process.env.COHORT_ID,manifestSha256:process.env.COHORT_MANIFEST_SHA256,requestedAt:process.env.COHORT_REQUESTED_AT,caseId:process.env.DEPOT_CI_CASE,routeId:process.env.DEPOT_CI_ROUTE},startedAt,finishedAt,elapsedMs,exitCode:result.status,signal:result.signal,error:result.error?.message,workflowRevision:process.env.GITHUB_SHA,workflowRef:process.env.GITHUB_REF,runId:process.env.GITHUB_RUN_ID,repository,analysisRef:'refs/heads/main',analysisEvent:'workflow_dispatch',publishResults:false,image,digest,resources:{cpus:2,memory:'2g',pids:256,processTimeoutSeconds:720},liveMainBefore:before.sha,liveMainAfter:after.sha,actionSourceRevision:'f49aabe0b5af0936a0987cfb85d86b75731b0186',contextAdaptation:'Upstream action rejects non-default refs even without publication. Docker receives the intended live-main analysis context; workflow remains on its disposable trial ref.'};
writeFileSync(join(directory,'runtime.json'),JSON.stringify(runtime,null,2));
if(result.status!==0)throw new Error(`Scorecard analysis failed: status ${result.status}, signal ${result.signal}`);
const raw=readFileSync(join(directory,'results.json'));
const report=JSON.parse(raw);
if(!Array.isArray(report.checks)||report.checks.length===0)throw new Error('Scorecard produced no check results');
writeFileSync(join(directory,'result-identity.json'),JSON.stringify({sha256:createHash('sha256').update(raw).digest('hex'),repo:report.repo,scorecard:report.scorecard,checks:report.checks.map(check=>({name:check.name,score:check.score,reason:check.reason})),liveMainBefore:before.sha,liveMainAfter:after.sha},null,2));
console.log(JSON.stringify({checks:report.checks.length,repo:report.repo,elapsedMs,liveMainBefore:before.sha,liveMainAfter:after.sha}));
'''
