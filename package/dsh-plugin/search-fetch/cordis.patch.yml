# Connects the repo's shared search and fetch MCP server to this profile.
#
# The server is `@monochromatic-dev/mcp-search-fetch`, built to
# `package/mcp/search-fetch/dist/final/node/index.mjs`. It exposes `web_search`
# and `web_fetch` that delegate to
# `@monochromatic-dev/agent-harness-shared-search-fetch`, the same core the pi
# extension uses, so the behavior has exactly one implementation. The tools
# mount as `mcp__search-fetch__web_search` and `mcp__search-fetch__web_fetch`.
#
# No explicit `env` is needed for credentials. The server resolves its config
# from `$HOME/.pi/agent/extensions/pi-search-fetch.json`
# (`agent-harness-shared/search-fetch/src/config.ts`), and the harness
# subprocess scrub drops only names matching `KEY|PASSWORD|SECRET|TOKEN` plus
# `DSH_*`, so `HOME` and `PATH` reach the child and `gh` routing still resolves.
#
# The server path resolves through this bundle's own `package.json` instead of a
# hardcoded workspace location, so the wiring follows the checkout.
- insert:
    - id: search-fetch-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: search-fetch
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js process.getBuiltinModule('node:path').resolve(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@monochromatic-dev/dsh-plugin-search-fetch/package.json')), '../../mcp/search-fetch/dist/final/node/index.mjs')
        failOnStartupError: true
