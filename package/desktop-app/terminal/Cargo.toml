[package]
name = "terminal"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false
description = "Slint desktop terminal prototype backed by Ghostty's libghostty-vt core."

[lints.clippy]
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"

[lib]
name = "terminal_app"
path = "src/lib.rs"

[[bin]]
name = "monochromatic-terminal"
path = "src/main.rs"

[dependencies]
# `anyhow` carries application-level errors for the terminal binary and PTY adapter.
anyhow = "1"
# Same Slint release family as package/music-player/desktop-app so both desktop
# prototypes share Flickable smooth wheel and touch scrolling. The explicit winit
# backend lets the app stamp its Wayland app id before the window is created. The
# slint-build build-dependency in this file must stay in this same release family
# because the markup compiler and runtime are versioned together.
# "1.17.0" here is Cargo's default caret requirement (">=1.17.0, <2.0.0"), not an
# exact pin: unlike pnpm, where a bare version string pins the exact release,
# Cargo already lets `cargo update` move to any newer 1.x release past 1.17.0.
i-slint-backend-winit = "1.17.0"
# Safe Rust binding for Ghostty's terminal core. Default features are disabled
# because this prototype renders text cells only and does not need Kitty images.
libghostty-vt = { version = "0.1.1", default-features = false }
# WezTerm's PTY abstraction. It gives this app safe shell spawn, read, write,
# and resize operations without hand-written forkpty or ioctl setup.
portable-pty = "0.9.0"
# "1.17.0" here is Cargo's default caret requirement (">=1.17.0, <2.0.0"), not an
# exact pin, the same as i-slint-backend-winit and slint-build in this file.
slint = { version = "1.17.0", features = ["backend-winit", "renderer-femtovg", "renderer-software"] }
# The logging facade and its subscriber. tracing routes this prototype's callback-error
# diagnostics as structured events; tracing-subscriber installs the stderr sink (RUST_LOG,
# default info) so failures are visible when launched from a terminal.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
# Must match the `slint` release family used for this crate's slint and
# i-slint-backend-winit dependencies because the compiler and runtime are
# versioned together. "1.17.0" here is Cargo's default caret requirement
# (">=1.17.0, <2.0.0"), not an exact pin.
slint-build = "1.17.0"

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]
