# Extend the established Fedora native build environment with Helix's C++ driver.
# Cargo jobs are contained at 2 GiB, 2 CPUs, 512 processes, and 4096 descriptors.
# No home directory or credentials are mounted into the build container.
[vars]
cargo = """
const { execFileSync } = await import('node:child_process')
const image = 'localhost/monochromatic/ide'
const imageCheck = (await import('node:child_process')).spawnSync('podman', ['image', 'exists', image])
if (imageCheck.status !== 0) {
  execFileSync('podman', ['build', '--memory=2g', '--cpu-period=100000', '--cpu-quota=200000', '--tag', image, '--file', 'Containerfile', '.'], { stdio: 'inherit' })
}
const runBounded = (args, options = {}) => execFileSync('podman', [
  'run', '--rm', '--memory=2g', '--cpus=2', '--pids-limit=512',
  '--ulimit', 'nofile=4096:4096', '--security-opt', 'label=disable',
  '--volume', process.cwd() + ':/work', '--volume', 'ide-cargo:/cargo',
  '--workdir', '/work', '--env', 'CARGO_BUILD_JOBS=2',
  '--env', 'SLINT_EMIT_DEBUG_INFO=1',
  '--env', 'HELIX_RUNTIME=/work/target/debug/runtime',
  image, ...args
], { stdio: 'inherit', ...options })
const runCargo = (args, options = {}) => runBounded(['cargo', ...args], options)
"""

[tasks.image]
description = "Rebuild the bounded native IDE toolchain image"
run = "podman build --memory=2g --cpu-period=100000 --cpu-quota=200000 --tag localhost/monochromatic/ide --file Containerfile ."

[tasks.fetch]
description = "Fetch the selected Rust dependencies in the bounded build container"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo}}
runCargo(['fetch'])
"""

[tasks.runtime]
description = "Prepare pinned Helix TypeScript/Rust slice assets in bounded build-only storage"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo}}
const { cpSync, copyFileSync, mkdirSync, readFileSync, readdirSync, renameSync, writeFileSync } = await import('node:fs')
const { dirname, join } = await import('node:path')
const revision = 'ba40e547426b0f9896c8bdc699a4ab11f2b37dbc'
const metadata = JSON.parse(runCargo(['metadata', '--format-version', '1'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'], maxBuffer: 16 * 1024 * 1024 }))
const loader = metadata.packages.find(item => item.name === 'helix-loader')
if (!loader?.source?.endsWith('#' + revision)) throw new Error('Cargo did not resolve the pinned helix-loader revision')
const source = join(dirname(dirname(loader.manifest_path)), 'runtime')
runCargo(['build', '--no-default-features', '--bin', 'ide-runtime'])
const privateEnvironment = ['env', '--unset=CARGO_MANIFEST_DIR', 'XDG_CONFIG_HOME=/work/target/runtime-config', 'XDG_CACHE_HOME=/work/target/runtime-cache', 'XDG_DATA_HOME=/work/target/runtime-data']
runBounded([...privateEnvironment, '/work/target/debug/ide-runtime', 'fetch', source])
runBounded([...privateEnvironment, '/work/target/debug/ide-runtime', 'build', source])
const built = 'target/runtime-config/helix/runtime'
const grammars = readdirSync(join(built, 'grammars'), { withFileTypes: true }).filter(entry => entry.isFile() && entry.name.endsWith('.so'))
const selected = JSON.parse(readFileSync(join(built, 'selected-grammars.json'), 'utf8'))
if (grammars.length !== selected.length || !selected.every(name => grammars.some(entry => entry.name === name + '.so'))) {
  throw new Error('Built grammar files do not match the selected runtime inventory')
}
for (const profile of ['debug', 'release']) {
  const destination = join('target', profile, 'runtime')
  mkdirSync(join(destination, 'grammars'), { recursive: true })
  cpSync(join(built, 'queries'), join(destination, 'queries'), { recursive: true })
  copyFileSync(join(built, 'Helix-LICENSE'), join(destination, 'Helix-LICENSE'))
  for (const grammar of grammars) {
    const output = join(destination, 'grammars', grammar.name)
    copyFileSync(join(built, 'grammars', grammar.name), output + '.new')
    renameSync(output + '.new', output)
    const name = grammar.name.slice(0, -3)
    const sourceRoot = join(built, 'grammars', 'sources', name)
    const notices = readdirSync(sourceRoot).filter(file => /^(?:licen[cs]e|copying|notice|authors)(?:[._-]|$)/i.test(file))
    if (!notices.length) throw new Error('Missing grammar license notices for ' + name)
    const licenseDirectory = join(destination, 'licenses', name)
    mkdirSync(licenseDirectory, { recursive: true })
    for (const notice of notices) cpSync(join(sourceRoot, notice), join(licenseDirectory, notice), { recursive: true })
  }
  writeFileSync(join(destination, 'manifest.json'), JSON.stringify({ helixRevision: revision, grammars: grammars.map(entry => entry.name) }, null, 2))
}
"""

[tasks.build]
depends = ["runtime"]
description = "Build the native IDE in the bounded container"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo}}
runCargo(['build'])
"""

[tasks.test]
depends = ["runtime"]
description = "Run library and integration tests in the bounded container"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo}}
runCargo(['test', '--no-default-features', '--lib', '--tests'])
"""

[tasks."test:native"]
description = "Exercise native window events and fonts in process-isolated headless tests"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo}}
runBounded(['env', 'SLINT_BACKEND=headless', 'SLINT_MCP_PORT=0', 'cargo', 'nextest', 'run', '--features', 'slint/mcp', '--bin', 'monochromatic-ide'])
"""

[tasks."test:fonts"]
description = "Exercise embedded font features and ligature selection through production geometry"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo}}
runCargo(['test', '--no-default-features', '--lib', '--test', 'font_features', '--test', 'inter_features', '--test', 'variable_fonts', '--', '--nocapture'])
"""

[tasks."test:tree"]
description = "Exercise lazy tree snapshots, native names, expansion, and invalid reply rejection"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo}}
runCargo(['test', '--no-default-features', '--test', 'file_tree', '--test', 'file_tree_validation'])
"""

[tasks."test:raster"]
description = "Compare repeated viewport pixels and report shape/raster stage timings"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo}}
runCargo(['test', '--no-default-features', '--test', 'raster_reuse', '--', '--nocapture'])
"""

[tasks."lint:clippy"]
description = "Check all IDE targets with warnings denied"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo}}
runCargo(['clippy', '--all-targets', '--', '--deny', 'warnings'])
"""

[tasks."lint:rust"]
description = "Check source-line budget and Rust documentation"
run = "cargo run --quiet --manifest-path ../../linter/rust/Cargo.toml -- ."

[tasks."lint:slint"]
description = "Check the native UI declaration"
run = "slint-viewer --check ui/app.slint"

[tasks.lint]
run = ["mise run //package/desktop-app/ide:lint:clippy", "mise run //package/desktop-app/ide:lint:rust", "mise run //package/desktop-app/ide:lint:slint"]

[tasks."format:rust"]
description = "Format application-owned Rust sources"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo}}
runCargo(['fmt'])
"""

[tasks.mcp]
depends = ["runtime"]
description = "Build and run the source-view gate with native headless UI inspection"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo}}
const { mkdtempSync, mkdirSync } = await import('node:fs')
const { tmpdir } = await import('node:os')
const { join } = await import('node:path')
runCargo(['build', '--features', 'slint/mcp'])
const scratch = mkdtempSync(join(tmpdir(), 'monochromatic-ide-ui-'))
for (const name of ['config', 'cache', 'data']) { mkdirSync(join(scratch, name)) }
const env = {
  ...process.env,
  HELIX_RUNTIME: join(process.cwd(), 'target/debug/runtime'),
  SLINT_MCP_PORT: process.env.SLINT_MCP_PORT ?? '9317',
  SLINT_BACKEND: process.env.SLINT_BACKEND ?? 'headless',
  XDG_CONFIG_HOME: join(scratch, 'config'),
  XDG_CACHE_HOME: join(scratch, 'cache'),
  XDG_DATA_HOME: join(scratch, 'data'),
}
execFileSync('./target/debug/monochromatic-ide', [], { stdio: 'inherit', env })
"""

[tasks."inspect:native"]
depends = ["runtime"]
description = "Run the IDE in the repo compositor with isolated theme and font configuration"
usage = '''
arg "[scheme]" default="dark" help="Private system appearance: dark or light"
arg "[fixture]" default="basic" help="Source fixture: basic, scroll, or syntax"
'''
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo}}
const { mkdtempSync, mkdirSync, writeFileSync } = await import('node:fs')
const { tmpdir } = await import('node:os')
const { join, resolve } = await import('node:path')
const scheme = process.env.usage_scheme ?? 'dark'
const fixture = process.env.usage_fixture ?? 'basic'
if (scheme !== 'dark' && scheme !== 'light') { throw new Error('scheme must be dark or light') }
if (!['basic', 'scroll', 'syntax'].includes(fixture)) { throw new Error('fixture must be basic, scroll, or syntax') }
runCargo(['build', '--features', 'slint/mcp'])
const scratch = mkdtempSync(join(tmpdir(), 'monochromatic-ide-native-'))
for (const name of ['config', 'cache', 'data']) { mkdirSync(join(scratch, name)) }
const fontConfig = join(scratch, 'fonts.conf')
writeFileSync(fontConfig, '<fontconfig><dir>/usr/share/fonts</dir><cachedir prefix="xdg">fontconfig</cachedir></fontconfig>')
const env = {
  ...process.env,
  HELIX_RUNTIME: resolve('target/debug/runtime'),
  SLINT_BACKEND: 'winit',
  SLINT_MCP_PORT: scheme === 'dark' ? '9318' : '9319',
  FONTCONFIG_FILE: fontConfig,
  XDG_CONFIG_HOME: join(scratch, 'config'),
  XDG_CACHE_HOME: join(scratch, 'cache'),
  XDG_DATA_HOME: join(scratch, 'data'),
}
for (const family of ['Inter Variable', 'JetBrains Mono']) {
  const fallback = execFileSync('fc-match', ['--format', '%{family}', family], { env, encoding: 'utf8' }).trim()
  if (fallback.split(',').includes(family)) { throw new Error('font isolation still exposes ' + family) }
  console.error('System-font isolation: ' + family + ' resolves to ' + fallback)
}
const socket = join(scratch, 'control.sock')
const sourceFile = join(scratch, 'fixture.ts')
const lines = fixture === 'syntax' ? [
  'const 猫: string = "cat";',
  '// Mixed source scripts keep their shared baseline.',
  'function describe(name: string): string {',
  '  return name + " 猫";',
  '}',
  'const answer: number = 42;',
  'const accent = "é";',
  'describe(猫);',
] : ['I am a big cat.', 'Select text and use the native Copy action.', '猫 and é are grapheme test cases.']
if (fixture === 'scroll') { for (let index = 0; index < 200; index++) { lines.push('Line ' + String(index + 4) + ': smooth pixel scrolling, 猫 and Latin.') } }
writeFileSync(sourceFile, lines.join(String.fromCharCode(10)))
console.error('IDE_NATIVE_SOCKET=' + socket)
console.error('IDE_NATIVE_FIXTURE=' + sourceFile)
const compositor = resolve('../../cli/nested-wayland-session/target/release/monochromatic-nested-wayland-session')
execFileSync(compositor, ['--socket', socket, '--size', '1100x660', '--color-scheme', scheme, '--', resolve('target/debug/monochromatic-ide'), sourceFile], { env, stdio: 'inherit' })
"""

[tasks.run]
description = "Run the built IDE against a local root supplied as an argument"
run = "./target/debug/monochromatic-ide"
