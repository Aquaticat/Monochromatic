[package]
name = "musicplayer-native"
version = "0.1.4"
edition = "2024"
publish = false

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

# Standalone crate: this Android package is a Gradle island that no parent cargo
# workspace owns. An empty [workspace] table pins this crate as its own root, so a
# future ancestor Cargo.toml cannot silently absorb it.
[workspace]

[lib]
# System.loadLibrary("musicplayer_native") loads libmusicplayer_native.so, so the
# lib name (not the package name) is what Kotlin references.
name = "musicplayer_native"
crate-type = ["cdylib"]

[dependencies]
# Pure-Rust JNI bindings (no C).
jni = "0.22"

# libopus via opus-rs 0.4: its opusic-sys backend bundles libopus 1.6.1 and
# builds it from source with cmake on every platform. The same release as the
# desktop crate (the CMake 4.x compatibility fix; see that crate's Cargo.toml).
# This is the one C cross-compile the full-Rust variant must clear for arm64 Android.
opus = "0.4"

# Pure-Rust demux + decoders for FLAC/WAV/MP3/Vorbis/AAC/ALAC (Opus is handled by
# the opus crate above). Same version and feature set as the desktop crate; no C,
# so it cross-compiles for Android with no extra toolchain.
symphonia = { version = "0.6", features = ["all"] }

# AAudio output (raw ndk::audio, the chosen output backend): pure-Rust FFI to the
# NDK audio C API, no C/C++ build; links the sysroot libaaudio via #[link]. The
# `audio` feature is off by default and pulls api-level-26 (the app targets 35).
ndk = { version = "0.9", features = ["audio"] }

# Lock-free SPSC ring buffer between the decode worker (producer) and the AAudio
# data callback (consumer), so the realtime callback never decodes or allocates.
# Same major version as the desktop crate, whose engine this one ports.
ringbuf = "0.5"

# Shared true-peak core: the Catmull-Rom meter and whole-buffer helper (src/truepeak.rs),
# plus, behind the `service` feature, the persistent decision cache (`DecisionCache`), the
# policy resolvers (`resolve_decision`, `resolve_full_scan`), and the decision types that
# src/service.rs (the native true-peak service handle) drives. A path dependency (not a
# version) because it is an unpublished in-repo crate; it carries its own empty [workspace]
# table, so this path dep does not pull this Gradle-island crate into a shared cargo
# workspace. The `service` feature pulls Turso (the pure-Rust SQLite rewrite: no C, so it
# cross-compiles for the Android ABIs; the Stage-0 spike proved arm64-v8a + x86_64 builds
# and an in-process round-trip to an app-private path) and Tokio transitively; the cache
# schema, its exact-over-probe precedence, and the gain math all live in the shared crate,
# so Kotlin no longer owns a JSON peak cache or the gain calculation. The `fingerprint` feature
# adds the shared `track_fingerprint` (XXH3-64 through `twox-hash`, run-time AVX2/SSE2/NEON
# selection, no `-C target-feature` flag) behind src/fingerprint.rs, the same function the
# desktop crate calls. See ../../../doc/decision/music-player-fingerprint-hash.md.
truepeak-core = { path = "../../truepeak-core", features = ["service", "fingerprint"] }

# Async runtime for the native true-peak service (src/service.rs): a dedicated thread runs a
# current-thread Tokio runtime that drives the shared `DecisionCache`'s Turso futures, and the
# JNI threads reach it through an `mpsc` request channel + `oneshot` replies. Same feature set
# as the desktop crate's cache actor: `rt` (build the current-thread runtime), `sync` (the
# channels), `macros` (`select!` to bias reads ahead of a warming write backlog). NOT
# `rt-multi-thread`: one actor thread is enough. Tokio is pure Rust, so it cross-compiles for
# the Android ABIs with nothing extra to clear.
tokio = { version = "1", features = ["rt", "sync", "macros"] }

# The logging facade, its subscriber, and the Android logcat layer (src/logging.rs). Android
# stderr never reaches logcat, so tracing events (this crate's and truepeak-core's, now
# default-on) are routed to logcat via paranoid-android's tracing-subscriber layer, installed
# once behind a OnceLock. env-filter reads RUST_LOG (default info). paranoid-android reaches
# logcat through ndk-sys 0.5, which does NOT request `-llog`, so build.rs links liblog; the
# `api-30` feature is left OFF to keep min SDK 26.
paranoid-android = "0.2.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
