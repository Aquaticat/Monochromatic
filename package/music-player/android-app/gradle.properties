# -Duser.home keeps the daemon's Android debug keystore lookup on the real home when the
# build runs inside a user namespace whose mapped-root UID would otherwise resolve to /root.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Duser.home=/home/user
android.useAndroidX=true
kotlin.code.style=official
org.gradle.caching=true
org.gradle.configuration-cache=false
