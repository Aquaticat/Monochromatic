[vars]
build_question = '''
const { readFileSync, writeFileSync } = await import('node:fs');
const { resolve } = await import('node:path');
const renderPaths = {
  IMAGE_BASELINE: 'questions/render/divider-final.png',
  IMAGE_COMMAND_C_D: 'questions/render/command-c-d.png',
  IMAGE_COMMAND_C_P: 'questions/render/command-c-p.png',
  IMAGE_COMMAND_C_F: 'questions/render/command-c-f.png',
  IMAGE_COMMAND_U_D: 'questions/render/command-u-d.png',
  IMAGE_COMMAND_U_P: 'questions/render/command-u-p.png',
  IMAGE_COMMAND_U_F: 'questions/render/command-u-f.png',
  IMAGE_COMMAND_S_D: 'questions/render/command-s-d.png',
  IMAGE_COMMAND_S_P: 'questions/render/command-s-p.png',
  IMAGE_COMMAND_S_F: 'questions/render/command-s-f.png',
};
let output = readFileSync(resolve('questions/current.template.html'), 'utf8');
for (const [name, path] of Object.entries(renderPaths)) {
  const marker = `@@${name}@@`;
  const occurrences = output.split(marker).length - 1;
  if (occurrences !== 1) {
    throw new Error(`Expected one ${marker} marker, found ${occurrences}.`);
  }
  const dataUri = `data:image/png;base64,${readFileSync(resolve(path)).toString('base64')}`;
  output = output.replace(marker, dataUri);
}
writeFileSync(resolve('questions/current.html'), output);
console.log('Built self-contained command-bar matrix.');
'''

validate_question = '''
const { execFileSync } = await import('node:child_process');
const { existsSync, readFileSync } = await import('node:fs');
const { resolve } = await import('node:path');
const requiredPaths = [
  'HANDOFF.md',
  'decisions.md',
  'open-questions.md',
  'device-metrics.md',
  'material-3-compliance.md',
  'questions/current.template.html',
  'questions/current.html',
  'questions/render/divider-final.png',
  'questions/render/command-c-d.png',
  'questions/render/command-c-p.png',
  'questions/render/command-c-f.png',
  'questions/render/command-u-d.png',
  'questions/render/command-u-p.png',
  'questions/render/command-u-f.png',
  'questions/render/command-s-d.png',
  'questions/render/command-s-p.png',
  'questions/render/command-s-f.png',
];
const missingPaths = requiredPaths.filter((path) => !existsSync(resolve(path)));
if (missingPaths.length > 0) {
  throw new Error(`Missing required command-bar matrix files: ${missingPaths.join(', ')}`);
}
const baselinePath = 'questions/render/divider-final.png';
const commandPaths = [
  'questions/render/command-c-d.png',
  'questions/render/command-c-p.png',
  'questions/render/command-c-f.png',
  'questions/render/command-u-d.png',
  'questions/render/command-u-p.png',
  'questions/render/command-u-f.png',
  'questions/render/command-s-d.png',
  'questions/render/command-s-p.png',
  'questions/render/command-s-f.png',
];
const renderPaths = [baselinePath, ...commandPaths];
for (const path of renderPaths) {
  const image = readFileSync(resolve(path));
  const pngSignature = '89504e470d0a1a0a';
  if (image.subarray(0, 8).toString('hex') !== pngSignature) {
    throw new Error(`${path} is not a PNG.`);
  }
  const width = image.readUInt32BE(16);
  const height = image.readUInt32BE(20);
  if (width !== 2076 || height !== 2152) {
    throw new Error(`${path} is ${width}×${height}; expected 2076×2152.`);
  }
  const opaque = execFileSync(
    'magick',
    [resolve(path), '-format', '%[opaque]', 'info:'],
    { encoding: 'utf8' },
  );
  if (opaque !== 'True') {
    throw new Error(`${path} must remain an opaque native emulator capture.`);
  }
}
const pixelAt = ({ path, x, y }) => execFileSync(
  'magick',
  [resolve(path), '-format', `%[pixel:p{${x},${y}}]`, 'info:'],
  { encoding: 'utf8' },
);
const countPixelsMatching = ({ path, crop, predicate }) => {
  const histogram = execFileSync(
    'magick',
    [resolve(path), '-crop', crop, '+repage', '-format', '%c', 'histogram:info:-'],
    { encoding: 'utf8' },
  );
  return histogram.split('\n').reduce((count, line) => {
    const tupleStart = line.indexOf('(');
    const tupleEnd = line.indexOf(')', tupleStart);
    const countEnd = line.indexOf(':');
    if (tupleStart < 0 || tupleEnd < 0 || countEnd < 0) {
      return count;
    }
    const channels = line
      .slice(tupleStart + 1, tupleEnd)
      .split(',')
      .slice(0, 3)
      .map((channel) => Number(channel));
    if (!predicate(channels)) {
      return count;
    }
    return count + Number(line.slice(0, countEnd).trim());
  }, 0);
};
const isBlack = ([red, green, blue]) => red === 0 && green === 0 && blue === 0;
const isDark = ([red, green, blue]) => red < 128 && green < 128 && blue < 128;
const isPrimary = ([red, green, blue]) => red === 76 && green === 94 && blue === 139;
for (const path of renderPaths) {
  const statusIconPixels = countPixelsMatching({
    path,
    crop: '300x88+1700+0',
    predicate: isBlack,
  });
  const navigationHandlePixels = countPixelsMatching({
    path,
    crop: '700x78+688+2074',
    predicate: isDark,
  });
  if (statusIconPixels < 1_500) {
    throw new Error(`${path} is missing native Android status icons.`);
  }
  if (navigationHandlePixels < 2_000) {
    throw new Error(`${path} is missing the native unfolded navigation handle.`);
  }
}
const selectedFolderIndicatorPixels = countPixelsMatching({
  path: baselinePath,
  crop: '200x4+140+499',
  predicate: isPrimary,
});
if (selectedFolderIndicatorPixels < 700) {
  throw new Error(`${baselinePath} must retain the selected folder's separate 2dp target-width indicator.`);
}
const linkLikeUnderlinePixels = countPixelsMatching({
  path: baselinePath,
  crop: '200x5+140+458',
  predicate: isPrimary,
});
if (linkLikeUnderlinePixels > 0) {
  throw new Error(`${baselinePath} must not underline selected folder text like a web link.`);
}
for (const path of commandPaths) {
  const foldColors = Number(execFileSync(
    'magick',
    [resolve(path), '-crop', '40x1700+1018+200', '+repage', '-format', '%k', 'info:'],
    { encoding: 'utf8' },
  ));
  if (foldColors !== 1) {
    throw new Error(`${path} places visible content across the protected center spacer.`);
  }
  const searchPixels = countPixelsMatching({
    path,
    crop: '1000x500+1000+100',
    predicate: isDark,
  });
  if (searchPixels < 2_000) {
    throw new Error(`${path} is missing the focused Material search surface.`);
  }
}
const commandFingerprints = commandPaths.map((path) => readFileSync(resolve(path)).toString('base64'));
if (new Set(commandFingerprints).size !== commandPaths.length) {
  throw new Error('Every command-bar matrix cell must use a distinct native capture.');
}
const white = 'srgba(255,255,255,1)';
const outlineVariant = 'srgba(176,177,188,1)';
const finalRail = pixelAt({ path: 'questions/render/divider-final.png', x: 117, y: 1000 });
const finalCenter = pixelAt({ path: 'questions/render/divider-final.png', x: 1038, y: 1000 });
const finalHorizontal = pixelAt({ path: 'questions/render/divider-final.png', x: 500, y: 1430 });
const finalSelectedRow = pixelAt({ path: 'questions/render/divider-final.png', x: 1100, y: 350 });
if (finalRail !== outlineVariant || finalCenter !== white || finalHorizontal !== white || finalSelectedRow !== white) {
  throw new Error('divider-final must apply the gray rail, white pane spacers, and neutral current row.');
}
const finalOrdinalPixels = countPixelsMatching({
  path: 'questions/render/divider-final.png',
  crop: '100x1200+1068+500',
  predicate: isDark,
});
const finalCurrentTrackIconPixels = countPixelsMatching({
  path: 'questions/render/divider-final.png',
  crop: '112x170+1068+300',
  predicate: isPrimary,
});
if (finalOrdinalPixels !== 0) {
  throw new Error('divider-final must contain no interface-generated track ordinals.');
}
if (finalCurrentTrackIconPixels < 300) {
  throw new Error('divider-final must retain the Material play icon as the non-color current-track cue.');
}
const question = readFileSync(resolve('questions/current.html'), 'utf8');
const forbiddenFragments = [
  '<link ',
  '<script src=',
  'http://',
  'https://',
  '@@IMAGE_',
  '#chosen-baseline',
  'Q1 1c',
  'Q2 3a',
  'what is your definition',
  'd2-before',
  'before your marked correction',
  'Annotated starting point',
  'Rejected and superseded versions',
  'Can we continue',
  'Continue with the current design',
  'name="reviewResult"',
  'value="nothing-else"',
  'value="changes-needed"',
  'prototype commit 89a9f7033',
];
const foundFragments = forbiddenFragments.filter((fragment) => question.includes(fragment));
if (foundFragments.length > 0) {
  throw new Error(`Command-bar matrix contains stale or external content: ${foundFragments.join(', ')}`);
}
const requiredFragments = [
  '<form',
  '<fieldset',
  '<textarea',
  '<dialog',
  'The design you liked',
  'What still deserves design work',
  'Nine command-bar prototypes',
  'Row 1 · commands only',
  'Row 2 · unified, automatic groups',
  'Row 3 · unified, explicit scope controls',
  '1A · rank 8',
  '1B · rank 6',
  '1C · rank 9',
  '2A · rank 2',
  '2B · rank 1 · recommended',
  '2C · rank 5',
  '3A · rank 4',
  '3B · rank 3',
  '3C · rank 7',
  'My recommendation and full ranking',
  'Worth adding regardless of the winning prototype',
  'name="scopeDecision"',
  'name="categoryDecision"',
  'name="placementDecision"',
  'name="additions"',
  'name="otherCorrections"',
  'Q1. What should the global surface contain?',
  'Q2. If library results are included, how should categories work?',
  'Q3. Where should the surface appear on the unfolded screen?',
  'Q4. Which complementary additions should be included?',
  'Other combinations, corrections, or additions, or “None”',
  'Copy answers',
  'prototype commit 49d6568ed',
  'prototype commit 2aba2fb1d',
  'data-preview-width="852"',
  'data-preview-height="883"',
  'data-source-width="2076"',
  'data-source-height="2152"',
  'aspect-ratio: 907 / 937;',
  'const fullFrameWidth = 907;',
  'const frameHeight = 937;',
  '--color-device: #262624;',
  'Close preview and answer',
];
const absentFragments = requiredFragments.filter((fragment) => !question.includes(fragment));
if (absentFragments.length > 0) {
  throw new Error(`Command-bar matrix is incomplete: ${absentFragments.join(', ')}`);
}
const imageCount = question.split('data-candidate-source=').length - 1;
const embeddedImageCount = question.split('data:image/png;base64,').length - 1;
const frameCount = question.split('class="device-frame"').length - 1;
const screenCount = question.split('class="device-screen"').length - 1;
const cameraCount = question.split('class="device-camera"').length - 1;
const radioCount = question.split('type="radio"').length - 1;
const checkboxCount = question.split('type="checkbox"').length - 1;
const matrixScrollerCount = question.split('class="options-scroll" role="region"').length - 1;
if (imageCount !== 10 || embeddedImageCount !== 10) {
  throw new Error(`Expected ten sourced and embedded renders, found ${imageCount} sources and ${embeddedImageCount} images.`);
}
if (frameCount !== 10 || screenCount !== 11 || cameraCount !== 11) {
  throw new Error(`Expected ten cards plus one dialog frame; found ${frameCount} frames, ${screenCount} screens, and ${cameraCount} cameras.`);
}
if (radioCount !== 7 || checkboxCount !== 6 || matrixScrollerCount !== 3) {
  throw new Error(`Expected seven radios, six addition checkboxes, and three matrix scrollers; found ${radioCount}, ${checkboxCount}, and ${matrixScrollerCount}.`);
}
console.log('Command-bar matrix structure is valid.');
'''

[tasks.build]
description = "Embed the accepted design and nine native command-bar prototypes"
shell = "node --input-type=module-typescript -e"
run = "{{vars.build_question}}"

[tasks.lint]
description = "Validate the active command-bar matrix questionnaire"
shell = "node --input-type=module-typescript -e"
run = "{{vars.validate_question}}"

[tasks."test:unit"]
description = "Exercise the command-bar matrix's static completion contract"
shell = "node --input-type=module-typescript -e"
run = "{{vars.validate_question}}"
