[vars]
build_question = '''
const { readFileSync, writeFileSync } = await import('node:fs');
const { resolve } = await import('node:path');
const renderPaths = {
  IMAGE_CUE_RECOMMENDED_FONT_200: 'questions/render/cue-recommended-font-200.png',
  IMAGE_CUE_LABEL_FILLED: 'questions/render/cue-label-filled.png',
  IMAGE_CUE_LABEL_TONAL: 'questions/render/cue-label-tonal.png',
  IMAGE_CUE_LABEL_ELEVATED: 'questions/render/cue-label-elevated.png',
  IMAGE_CUE_LABEL_OUTLINED: 'questions/render/cue-label-outlined.png',
  IMAGE_CUE_ACCENT_FILLED: 'questions/render/cue-accent-filled.png',
  IMAGE_CUE_ACCENT_TONAL: 'questions/render/cue-accent-tonal.png',
  IMAGE_CUE_ACCENT_ELEVATED: 'questions/render/cue-accent-elevated.png',
  IMAGE_CUE_ACCENT_OUTLINED: 'questions/render/cue-accent-outlined.png',
  IMAGE_CUE_CONTAINER_FILLED: 'questions/render/cue-container-filled.png',
  IMAGE_CUE_CONTAINER_TONAL: 'questions/render/cue-container-tonal.png',
  IMAGE_CUE_CONTAINER_ELEVATED: 'questions/render/cue-container-elevated.png',
  IMAGE_CUE_CONTAINER_OUTLINED: 'questions/render/cue-container-outlined.png',
  IMAGE_CUE_OUTLINE_FILLED: 'questions/render/cue-outline-filled.png',
  IMAGE_CUE_OUTLINE_TONAL: 'questions/render/cue-outline-tonal.png',
  IMAGE_CUE_OUTLINE_ELEVATED: 'questions/render/cue-outline-elevated.png',
  IMAGE_CUE_OUTLINE_OUTLINED: 'questions/render/cue-outline-outlined.png',
};
let output = readFileSync(resolve('questions/current.template.html'), 'utf8');
for (const [name, path] of Object.entries(renderPaths)) {
  const marker = `@@${name}@@`;
  const occurrences = output.split(marker).length - 1;
  if (occurrences !== 1) {
    throw new Error(`Expected one ${marker} marker, found ${occurrences}.`);
  }
  const dataUri = `data:image/png;base64,${readFileSync(resolve(path)).toString('base64')}`;
  output = output.replace(marker, dataUri);
}
writeFileSync(resolve('questions/current.html'), output);
console.log('Built self-contained redundant-cue matrix.');
'''

validate_question = '''
const { execFileSync } = await import('node:child_process');
const { existsSync, readFileSync } = await import('node:fs');
const { resolve } = await import('node:path');

const trackCues = ['label', 'accent', 'container', 'outline'];
const openStyles = ['filled', 'tonal', 'elevated', 'outlined'];
const matrixPaths = trackCues.flatMap((trackCue) =>
  openStyles.map((openStyle) => `questions/render/cue-${trackCue}-${openStyle}.png`),
);
const largeTextPath = 'questions/render/cue-recommended-font-200.png';
const transportReferencePath = 'questions/render/refine-tight-outlined.png';
const semanticsPaths = trackCues.map((trackCue) => `questions/evidence/cue-${trackCue}-filled-semantics.xml`);
const allRenderPaths = [largeTextPath, transportReferencePath, ...matrixPaths];
const requiredPaths = [
  'HANDOFF.md',
  'decisions.md',
  'open-questions.md',
  'device-metrics.md',
  'material-3-compliance.md',
  'questions/current.template.html',
  'questions/current.html',
  ...semanticsPaths,
  ...allRenderPaths,
];
const missingPaths = requiredPaths.filter((path) => !existsSync(resolve(path)));
if (missingPaths.length > 0) {
  throw new Error(`Missing required redundant-cue files: ${missingPaths.join(', ')}`);
}

for (const path of allRenderPaths) {
  const image = readFileSync(resolve(path));
  if (image.subarray(0, 8).toString('hex') !== '89504e470d0a1a0a') {
    throw new Error(`${path} is not a PNG.`);
  }
  const width = image.readUInt32BE(16);
  const height = image.readUInt32BE(20);
  if (width !== 2076 || height !== 2152) {
    throw new Error(`${path} is ${width}×${height}; expected 2076×2152.`);
  }
  const opaque = execFileSync('magick', [resolve(path), '-format', '%[opaque]', 'info:'], { encoding: 'utf8' });
  if (opaque !== 'True') {
    throw new Error(`${path} must remain an opaque native emulator capture.`);
  }
}

const imageFingerprint = ({ path, crop }) => execFileSync(
  'magick',
  [resolve(path), '-crop', crop, '+repage', '-format', '%#', 'info:'],
  { encoding: 'utf8' },
);
const pixelAt = ({ path, x, y }) => execFileSync(
  'magick',
  [resolve(path), '-format', `%[pixel:p{${x},${y}}]`, 'info:'],
  { encoding: 'utf8' },
);
const countExactColor = ({ path, crop, color }) => Number(execFileSync(
  'magick',
  [
    resolve(path), '-crop', crop, '+repage', '-alpha', 'off',
    '-fill', 'black', '+opaque', color,
    '-fill', 'white', '-opaque', color,
    '-format', '%[fx:mean*w*h]', 'info:',
  ],
  { encoding: 'utf8' },
));
const countDarkPixels = ({ path, crop }) => {
  const histogram = execFileSync(
    'magick',
    [resolve(path), '-crop', crop, '+repage', '-format', '%c', 'histogram:info:-'],
    { encoding: 'utf8' },
  );
  return histogram.split('\n').reduce((count, line) => {
    const tupleStart = line.indexOf('(');
    const tupleEnd = line.indexOf(')', tupleStart);
    const countEnd = line.indexOf(':');
    if (tupleStart < 0 || tupleEnd < 0 || countEnd < 0) {
      return count;
    }
    const [red, green, blue] = line
      .slice(tupleStart + 1, tupleEnd)
      .split(',')
      .slice(0, 3)
      .map((channel) => Number(channel));
    if (red >= 128 || green >= 128 || blue >= 160) {
      return count;
    }
    return count + Number(line.slice(0, countEnd).trim());
  }, 0);
};
const firstCuePixelX = ({ path, crop, cropWidth, absoluteX }) => {
  const pixels = execFileSync('magick', [resolve(path), '-crop', crop, '+repage', 'rgb:-']);
  let firstX = cropWidth;
  for (let offset = 0; offset < pixels.length; offset += 3) {
    const red = pixels[offset];
    const green = pixels[offset + 1];
    const blue = pixels[offset + 2];
    if (red < 110 && green < 110 && blue < 160) {
      firstX = Math.min(firstX, (offset / 3) % cropWidth);
    }
  }
  return absoluteX + firstX;
};
const largestConnectedBounds = ({ path, color, crop }) => {
  const report = execFileSync(
    'magick',
    [
      resolve(path), '-crop', crop, '+repage', '-alpha', 'off',
      '-fill', 'black', '+opaque', color,
      '-fill', 'white', '-opaque', color,
      '-define', 'connected-components:verbose=true',
      '-connected-components', '8', 'null:',
    ],
    { encoding: 'utf8' },
  );
  const componentLine = report.split('\n').find((line) => line.includes('srgb(255,255,255)'));
  if (!componentLine) {
    throw new Error(`${path} is missing its connected segmented outline.`);
  }
  const geometry = componentLine.trim().split(' ')[1];
  const sizeSeparator = geometry.indexOf('x');
  const firstOffset = geometry.indexOf('+');
  const secondOffset = geometry.indexOf('+', firstOffset + 1);
  return {
    width: Number(geometry.slice(0, sizeSeparator)),
    height: Number(geometry.slice(sizeSeparator + 1, firstOffset)),
    x: Number(geometry.slice(firstOffset + 1, secondOffset)),
    y: Number(geometry.slice(secondOffset + 1)),
  };
};

const transportFingerprint = imageFingerprint({ path: transportReferencePath, crop: '1009x674+0+1400' });
const pickerFingerprint = imageFingerprint({ path: transportReferencePath, crop: '1009x1100+0+300' });
for (const path of matrixPaths) {
  const currentTransport = imageFingerprint({ path, crop: '1009x674+0+1400' });
  if (currentTransport !== transportFingerprint) {
    throw new Error(`${path} does not preserve chosen transport option 1B.`);
  }
  const currentTitleX = firstCuePixelX({ path, crop: '500x80+1090+320', cropWidth: 500, absoluteX: 1090 });
  const ordinaryTitleX = firstCuePixelX({ path, crop: '500x90+1090+490', cropWidth: 500, absoluteX: 1090 });
  if (currentTitleX < 1107 || currentTitleX > 1110 || ordinaryTitleX < 1107 || ordinaryTitleX > 1111) {
    throw new Error(`${path} restores a space-consuming leading track column or misaligns row titles.`);
  }
  const systemPixels = countDarkPixels({ path, crop: '300x88+1700+0' });
  const navigationPixels = countDarkPixels({ path, crop: '700x78+688+2074' });
  if (systemPixels < 2000 || navigationPixels < 2000) {
    throw new Error(`${path} does not retain native Android system UI.`);
  }
  const folderIndicatorPixels = countExactColor({ path, crop: '200x4+140+499', color: '#4C5E8B' });
  const linkUnderlinePixels = countExactColor({ path, crop: '200x5+140+458', color: '#4C5E8B' });
  if (folderIndicatorPixels < 700 || linkUnderlinePixels > 0) {
    throw new Error(`${path} does not retain the separate selected-folder indicator.`);
  }
  const foldColorCount = Number(execFileSync(
    'magick',
    [resolve(path), '-crop', '59x1700+1009+200', '+repage', '-format', '%k', 'info:'],
    { encoding: 'utf8' },
  ));
  if (foldColorCount !== 1 || pixelAt({ path, x: 1038, y: 1000 }) !== 'srgba(255,255,255,1)') {
    throw new Error(`${path} does not keep the protected center spacer uniformly white.`);
  }
  if (pixelAt({ path, x: 117, y: 1000 }) !== 'srgba(176,177,188,1)') {
    throw new Error(`${path} does not preserve the accepted letter-rail boundary.`);
  }
  if (imageFingerprint({ path, crop: '1009x1100+0+300' }) !== pickerFingerprint) {
    throw new Error(`${path} changes the accepted picker outside the Open app-bar action.`);
  }
}

for (const trackCue of trackCues) {
  const paths = openStyles.map((openStyle) => `questions/render/cue-${trackCue}-${openStyle}.png`);
  const rightFingerprint = imageFingerprint({ path: paths[0], crop: '1067x2002+1009+150' });
  for (const path of paths.slice(1)) {
    if (imageFingerprint({ path, crop: '1067x2002+1009+150' }) !== rightFingerprint) {
      throw new Error(`${path} changes track treatment across Open columns.`);
    }
  }
}

for (const openStyle of openStyles) {
  const paths = trackCues.map((trackCue) => `questions/render/cue-${trackCue}-${openStyle}.png`);
  const appBarFingerprint = imageFingerprint({ path: paths[0], crop: '400x180+609+120' });
  for (const path of paths.slice(1)) {
    if (imageFingerprint({ path, crop: '400x180+609+120' }) !== appBarFingerprint) {
      throw new Error(`${path} changes Open treatment across current-track rows.`);
    }
  }
}

const rowFingerprints = trackCues.map((trackCue) => imageFingerprint({
  path: `questions/render/cue-${trackCue}-filled.png`,
  crop: '1067x220+1009+290',
}));
if (new Set(rowFingerprints).size !== trackCues.length) {
  throw new Error('Current-track rows are not four distinct redundant-cue treatments.');
}
const openFingerprints = openStyles.map((openStyle) => imageFingerprint({
  path: `questions/render/cue-label-${openStyle}.png`,
  crop: '400x180+609+120',
}));
if (new Set(openFingerprints).size !== openStyles.length) {
  throw new Error('Open columns are not four distinct Material button treatments.');
}

const currentCrop = '1000x200+1050+290';
const supportCrop = '600x60+1090+385';
const primary = '#4C5E8B';
const surfaceContainerLow = '#F3F3FA';
const onSurfaceVariant = '#5D5F68';
const labelSupport = countExactColor({ path: 'questions/render/cue-label-filled.png', crop: supportCrop, color: onSurfaceVariant });
if (labelSupport < 1000) {
  throw new Error('Explicit-label row does not retain visible Playing text.');
}
const accentPrimary = countExactColor({ path: 'questions/render/cue-accent-filled.png', crop: currentCrop, color: primary });
if (accentPrimary < 2000) {
  throw new Error('Accent row does not combine primary title color with bold weight.');
}
const containerPixels = countExactColor({ path: 'questions/render/cue-container-filled.png', crop: currentCrop, color: surfaceContainerLow });
if (containerPixels < 150000) {
  throw new Error('Soft-container row does not retain its neutral current-row surface.');
}
const outlinePixels = countExactColor({ path: 'questions/render/cue-outline-filled.png', crop: currentCrop, color: primary });
if (outlinePixels < 5000) {
  throw new Error('Outlined row does not retain its primary boundary and bold title.');
}

const openCrop = '300x150+710+140';
const filledPixels = countExactColor({ path: 'questions/render/cue-label-filled.png', crop: openCrop, color: primary });
const tonalPixels = countExactColor({ path: 'questions/render/cue-label-tonal.png', crop: openCrop, color: '#DCE2F9' });
const elevatedPixels = countExactColor({ path: 'questions/render/cue-label-elevated.png', crop: openCrop, color: surfaceContainerLow });
const outlinedPixels = countExactColor({ path: 'questions/render/cue-label-outlined.png', crop: openCrop, color: '#B0B1BC' });
if (filledPixels < 20000 || tonalPixels < 20000 || elevatedPixels < 20000 || outlinedPixels < 1500) {
  throw new Error('Open columns do not retain filled, tonal, elevated, and outlined treatments.');
}

for (const path of semanticsPaths) {
  const hierarchy = readFileSync(resolve(path), 'utf8');
  if (!hierarchy.includes('content-desc="Current track: Another Xronixle"')) {
    throw new Error(`${path} does not expose current-track semantics.`);
  }
  if (!hierarchy.includes('bounds="[1068,292][2003,468]"')) {
    throw new Error(`${path} does not expose the full-width current-track row bounds.`);
  }
  if (hierarchy.includes('content-desc="Playing"')) {
    throw new Error(`${path} restores the rejected play-icon accessibility node.`);
  }
  if (/text="[0-9]+"/u.test(hierarchy)) {
    throw new Error(`${path} restores interface-generated track ordinals.`);
  }
  if (!/text="Burning Aquamarine"[^>]+bounds="\[1107,507\]\[1483,566\]"/u.test(hierarchy)) {
    throw new Error(`${path} does not retain full-width ordinary-track alignment.`);
  }
}

const largeModeBounds = largestConnectedBounds({
  path: largeTextPath,
  color: '#787A84',
  crop: '1009x752+0+1400',
});
if (
  largeModeBounds.width !== 863
  || largeModeBounds.height !== 518
  || largeModeBounds.x !== 73
  || largeModeBounds.y !== 117
) {
  throw new Error('The 200% state does not retain one navigation-safe vertical segmented control.');
}
const selectedLargePixels = countExactColor({
  path: largeTextPath,
  crop: '900x220+55+1600',
  color: '#DCE2F9',
});
if (selectedLargePixels < 100000) {
  throw new Error('The 200% vertical segmented control loses its selected container.');
}

const template = readFileSync(resolve('questions/current.template.html'), 'utf8');
const question = readFileSync(resolve('questions/current.html'), 'utf8');
const requiredFragments = [
  'Existing screen only · 4 × 4 matrix',
  'matrix size is uncapped. These sixteen cells come from four meaningful current-track treatments',
  'UI Automator exposes “Current track: Another Xronixle” in every row treatment.',
  'the play icon and its empty leading column are gone',
  'No option relies only on color or only on shape.',
  'Current and ordinary track titles both begin at x=1107 physical pixels.',
  'Q1. How should the current track be distinguished without a play column?',
  'Q2. How prominent should the existing Open action be?',
  '1A: explicit Playing label plus bold title, with a filled Open button.',
  '1A &gt; 2A',
  'Anything else you want settled or changed, or “None”',
  'prototype commit 9938e8244',
  'Production assistive technology must still confirm those announcements',
  'Answers changed. Prepare them again before copying or downloading.',
  'spaces alone do not complete this field.',
  'Math.max(0.02, value)',
  'No addition is proposed.',
];
for (const fragment of requiredFragments) {
  if (!question.includes(fragment)) {
    throw new Error(`Questionnaire is missing required evidence: ${fragment}`);
  }
}
const disallowedFragments = [
  'command-bar',
  'volume control',
  'radio rows',
  'Nine refinements',
  'Nine was never treated as a cap',
  'standard skips',
  'balanced 12dp',
];
for (const fragment of disallowedFragments) {
  if (question.includes(fragment)) {
    throw new Error(`Questionnaire contains stale or unauthorized content: ${fragment}`);
  }
}
if (/https?:\/\//u.test(question)) {
  throw new Error('Questionnaire must remain offline and self-contained.');
}
if (question.includes('@@')) {
  throw new Error('Built questionnaire still contains an unresolved image marker.');
}
const templateMarkers = template.match(/@@IMAGE_CUE_[A-Z0-9_]+@@/gu) ?? [];
if (templateMarkers.length !== 17 || new Set(templateMarkers).size !== 17) {
  throw new Error(`Expected seventeen unique native image markers; found ${templateMarkers.length}.`);
}
const embeddedImages = question.split('data:image/png;base64,').length - 1;
const radioCount = question.split('type="radio" name=').length - 1;
if (embeddedImages !== 17 || radioCount !== 8) {
  throw new Error(`Expected seventeen embedded renders and eight decision radios; found ${embeddedImages} and ${radioCount}.`);
}
for (const code of Object.keys({
  '1A': 1, '1B': 3, '1C': 6, '1D': 9,
  '2A': 2, '2B': 4, '2C': 8, '2D': 11,
  '3A': 5, '3B': 7, '3C': 12, '3D': 14,
  '4A': 10, '4B': 13, '4C': 15, '4D': 16,
})) {
  if (!question.includes(`'${code}'`)) {
    throw new Error(`Questionnaire does not map matrix code ${code}.`);
  }
}
console.log('Redundant-cue matrix structure is valid.');
'''

[tasks.build]
description = "Embed sixteen native cue combinations and the 200% state into the self-contained review"
shell = "node --input-type=module-typescript -e"
run = "{{vars.build_question}}"

[tasks.lint]
description = "Validate the active redundant-cue matrix"
shell = "node --input-type=module-typescript -e"
run = "{{vars.validate_question}}"

[tasks."test:unit"]
description = "Exercise the redundant-cue matrix completion contract"
shell = "node --input-type=module-typescript -e"
run = "{{vars.validate_question}}"
