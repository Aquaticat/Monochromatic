[vars]
build_question = '''
const { readFileSync, writeFileSync } = await import("node:fs")
const { join } = await import("node:path")
const root = process.cwd()
const templatePath = join(root, "questions", "current.template.html")
const outputPath = join(root, "questions", "current.html")
const images = [
  ["@@A11Y_FOCUS_PANE@@", "questions/render/a11y-focus-pane.png"],
  ["@@A11Y_FOCUS_BROWSE@@", "questions/render/a11y-focus-browse.png"],
  ["@@A11Y_FOCUS_PLAYBACK@@", "questions/render/a11y-focus-playback.png"],
  ["@@A11Y_CURRENT_STATE@@", "questions/render/a11y-current-state.png"],
  ["@@A11Y_CURRENT_COMPOSED@@", "questions/render/a11y-current-composed.png"],
  ["@@A11Y_MODE_085@@", "questions/render/a11y-mode-085.png"],
  ["@@A11Y_MODE_100@@", "questions/render/a11y-mode-100.png"],
  ["@@A11Y_MODE_150@@", "questions/render/a11y-mode-150.png"],
]
let html = readFileSync(templatePath, "utf8")
for (const [placeholder, relativePath] of images) {
  const encoded = readFileSync(join(root, relativePath)).toString("base64")
  html = html.replaceAll(placeholder, `data:image/png;base64,${encoded}`)
}
if (html.includes("@@A11Y_")) {
  throw new Error("Accessibility review still contains an unresolved image placeholder.")
}
writeFileSync(outputPath, html)
console.log("Built self-contained unfolded TalkBack review.")
'''

validate_question = '''
const { readFileSync } = await import("node:fs")
const { join } = await import("node:path")
const root = process.cwd()
const htmlPath = join(root, "questions", "current.html")
const html = readFileSync(htmlPath, "utf8")
if (html.includes("@@A11Y_")) {
  throw new Error("Accessibility review contains unresolved image placeholders.")
}
if (/<script\s+[^>]*src=|<link\s+[^>]*href=/i.test(html)) {
  throw new Error("Accessibility review depends on an external script or stylesheet.")
}
const dataUrls = [...html.matchAll(/data:image\/png;base64,([A-Za-z0-9+/=]+)/g)]
if (dataUrls.length !== 16) {
  throw new Error(`Accessibility review embeds ${dataUrls.length} image references; expected 16.`)
}
const uniqueImages = new Map(dataUrls.map((match) => [match[1], Buffer.from(match[1], "base64")]))
if (uniqueImages.size !== 8) {
  throw new Error(`Accessibility review embeds ${uniqueImages.size} distinct captures; expected 8.`)
}
const pngSignature = "89504e470d0a1a0a"
for (const [encoded, image] of uniqueImages) {
  if (image.subarray(0, 8).toString("hex") !== pngSignature) {
    throw new Error(`Embedded evidence ${encoded.slice(0, 16)} is not a PNG.`)
  }
  const width = image.readUInt32BE(16)
  const height = image.readUInt32BE(20)
  if (width !== 2076 || height !== 2152) {
    throw new Error(`Embedded TalkBack evidence is ${width} × ${height}; expected 2076 × 2152.`)
  }
}
const required = [
  "Choose unfolded TalkBack behavior",
  "It does not authorize production implementation.",
  "Fixed requirements, not choices",
  "TalkBack says “1 of 4” through “4 of 4”",
  "F1 · recommended",
  "F2",
  "F3",
  "Pane by pane",
  "Browse first",
  "Playback first",
  "Ranking: F1 &gt; F2 &gt; F3.",
  "S1 · recommended",
  "S2",
  "Structured state",
  "Composed sentence",
  "Ranking: S1 &gt; S2.",
  "Current track. Another Xronixle. 4:35 · −1.2 dBTP. Button.",
  "Selected. Current track: Another Xronixle, 4:35, −1.2 dBTP. Button.",
  "Reduced motion:",
  "name=\"focusOrder\"",
  "name=\"currentSpeech\"",
  "spaces alone do not complete this field",
  "Native pixels",
  "Reset 100%",
  "Source 2076 × 2152 physical px · design 852 × 883dp",
]
for (const fragment of required) {
  if (!html.includes(fragment)) {
    throw new Error(`Accessibility review is missing required content: ${fragment}`)
  }
}
const radioCount = (html.match(/type="radio"/g) ?? []).length
if (radioCount !== 5) {
  throw new Error(`Accessibility review has ${radioCount} radio choices; expected 5.`)
}
const evidence = (name) => JSON.parse(readFileSync(join(root, "questions", "evidence", name), "utf8"))
const first = (sequence, fragment) => sequence.findIndex((entry) => entry.speech.includes(fragment))
const baseline = evidence("a11y-baseline-focus-100.json")
const pane = evidence("a11y-pane-focus-100.json")
const browse = evidence("a11y-browse-focus-100.json")
const playback = evidence("a11y-playback-focus-100.json")
const assertOrder = (sequence, fragments, label) => {
  const positions = fragments.map((fragment) => first(sequence, fragment))
  if (positions.some((position) => position < 0)) {
    throw new Error(`${label} transcript is missing one required focus landmark.`)
  }
  if (!positions.every((position, index) => index === 0 || positions[index - 1] < position)) {
    throw new Error(`${label} transcript does not preserve required traversal order.`)
  }
}
assertOrder(baseline, ["Settings. Button", "Current track:", "Selected. Camellia", "1 of 16"], "Baseline")
assertOrder(pane, ["Selected. Camellia", "1 of 16", "Current track."], "Pane candidate")
assertOrder(browse, ["Selected. Camellia", "Current track.", "1 of 16"], "Browse candidate")
assertOrder(playback, ["1 of 16", "Current track.", "Selected. Camellia"], "Playback candidate")
if (!html.includes("dialog.showModal()") || !html.includes("returnTarget.focus()")) {
  throw new Error("Accessibility preview does not retain native modal and focus restoration behavior.")
}
console.log("Unfolded TalkBack review is valid.")
'''

[tasks.build]
description = "Embed native TalkBack evidence into the self-contained unfolded accessibility review"
dir = "{{config_root}}"
shell = "node --input-type=module-typescript -e"
run = "{{vars.build_question}}"

[tasks.lint]
description = "Validate the active unfolded TalkBack design review"
dir = "{{config_root}}"
shell = "node --input-type=module-typescript -e"
run = "{{vars.validate_question}}"

[tasks."test:unit"]
description = "Exercise the unfolded TalkBack review completion contract"
dir = "{{config_root}}"
shell = "node --input-type=module-typescript -e"
run = "{{vars.validate_question}}"
