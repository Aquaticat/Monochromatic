[vars]
build_question = '''
const { readFileSync, writeFileSync } = await import('node:fs');
const { resolve } = await import('node:path');
const renderPaths = {
  IMAGE_FONT_085: 'questions/render/accepted-3b-font-085.png',
  IMAGE_FONT_100: 'questions/render/accepted-3b-font-100.png',
  IMAGE_FONT_115: 'questions/render/accepted-3b-font-115.png',
  IMAGE_FONT_130: 'questions/render/accepted-3b-font-130.png',
  IMAGE_FONT_150: 'questions/render/accepted-3b-font-150.png',
  IMAGE_FONT_180: 'questions/render/accepted-3b-font-180.png',
  IMAGE_FONT_200: 'questions/render/accepted-3b-font-200.png',
};
let output = readFileSync(resolve('questions/current.template.html'), 'utf8');
for (const [name, path] of Object.entries(renderPaths)) {
  const marker = `@@${name}@@`;
  const occurrences = output.split(marker).length - 1;
  if (occurrences !== 1) {
    throw new Error(`Expected one ${marker} marker, found ${occurrences}.`);
  }
  const dataUri = `data:image/png;base64,${readFileSync(resolve(path)).toString('base64')}`;
  output = output.replace(marker, dataUri);
}
writeFileSync(resolve('questions/current.html'), output);
console.log('Built self-contained accepted-3B scale review.');
'''

validate_question = '''
const { execFileSync } = await import('node:child_process');
const { existsSync, readFileSync } = await import('node:fs');
const { resolve } = await import('node:path');

const scaleLabels = ['085', '100', '115', '130', '150', '180', '200'];
const renderPaths = scaleLabels.map((label) => `questions/render/accepted-3b-font-${label}.png`);
const semanticsPaths = scaleLabels.map((label) => `questions/evidence/accepted-3b-font-${label}.xml`);
const requiredPaths = [
  'HANDOFF.md',
  'decisions.md',
  'open-questions.md',
  'device-metrics.md',
  'material-3-compliance.md',
  'questions/current.template.html',
  'questions/current.html',
  'questions/render/cue-container-tonal.png',
  ...renderPaths,
  ...semanticsPaths,
];
const missingPaths = requiredPaths.filter((path) => !existsSync(resolve(path)));
if (missingPaths.length > 0) {
  throw new Error(`Missing required accepted-3B scale files: ${missingPaths.join(', ')}`);
}

const imageFingerprint = ({ path, crop }) => execFileSync(
  'magick',
  [resolve(path), '-crop', crop, '+repage', '-format', '%#', 'info:'],
  { encoding: 'utf8' },
);
const pixelAt = ({ path, x, y }) => execFileSync(
  'magick',
  [resolve(path), '-format', `%[pixel:p{${x},${y}}]`, 'info:'],
  { encoding: 'utf8' },
);
const countExactColor = ({ path, crop, color }) => Number(execFileSync(
  'magick',
  [
    resolve(path), '-crop', crop, '+repage', '-alpha', 'off',
    '-fill', 'black', '+opaque', color,
    '-fill', 'white', '-opaque', color,
    '-format', '%[fx:mean*w*h]', 'info:',
  ],
  { encoding: 'utf8' },
));
const countDarkPixels = ({ path, crop }) => {
  const histogram = execFileSync(
    'magick',
    [resolve(path), '-crop', crop, '+repage', '-format', '%c', 'histogram:info:-'],
    { encoding: 'utf8' },
  );
  return histogram.split('\n').reduce((count, line) => {
    const tupleStart = line.indexOf('(');
    const tupleEnd = line.indexOf(')', tupleStart);
    const countEnd = line.indexOf(':');
    if (tupleStart < 0 || tupleEnd < 0 || countEnd < 0) {
      return count;
    }
    const channels = line.slice(tupleStart + 1, tupleEnd).split(',').slice(0, 3).map((channel) => Number(channel));
    if (channels[0] >= 128 || channels[1] >= 128 || channels[2] >= 160) {
      return count;
    }
    return count + Number(line.slice(0, countEnd).trim());
  }, 0);
};
const attributeValue = ({ node, name }) => {
  const marker = `${name}="`;
  const start = node.indexOf(marker);
  if (start < 0) {
    return '';
  }
  const valueStart = start + marker.length;
  const end = node.indexOf('"', valueStart);
  return node.slice(valueStart, end);
};
const hierarchyNodes = (hierarchy) => hierarchy
  .split('<node ')
  .slice(1)
  .map((fragment) => fragment.slice(0, fragment.indexOf('/>')));
const parseBounds = (bounds) => {
  const values = bounds
    .replaceAll('[', '')
    .replaceAll(']', ',')
    .split(',')
    .filter((value) => value.length > 0)
    .map((value) => Number(value));
  if (values.length !== 4 || values.some((value) => !Number.isFinite(value))) {
    throw new Error(`Invalid UI Automator bounds: ${bounds}`);
  }
  return { left: values[0], top: values[1], right: values[2], bottom: values[3] };
};

for (const path of renderPaths) {
  const image = readFileSync(resolve(path));
  if (image.subarray(0, 8).toString('hex') !== '89504e470d0a1a0a') {
    throw new Error(`${path} is not a PNG.`);
  }
  const width = image.readUInt32BE(16);
  const height = image.readUInt32BE(20);
  if (width !== 2076 || height !== 2152) {
    throw new Error(`${path} is ${width}×${height}; expected 2076×2152.`);
  }
  const opaque = execFileSync('magick', [resolve(path), '-format', '%[opaque]', 'info:'], { encoding: 'utf8' });
  if (opaque !== 'True') {
    throw new Error(`${path} must remain an opaque native emulator capture.`);
  }
  const statusPixels = countDarkPixels({ path, crop: '300x88+1700+0' });
  const navigationPixels = countDarkPixels({ path, crop: '700x78+688+2074' });
  if (statusPixels < 600 || navigationPixels < 5000) {
    throw new Error(`${path} does not retain native Android system UI.`);
  }
  const foldColorCount = Number(execFileSync(
    'magick',
    [resolve(path), '-crop', '59x1700+1009+200', '+repage', '-format', '%k', 'info:'],
    { encoding: 'utf8' },
  ));
  if (foldColorCount !== 1 || pixelAt({ path, x: 1038, y: 1000 }) !== 'srgba(255,255,255,1)') {
    throw new Error(`${path} does not keep the protected center spacer uniformly white.`);
  }
  if (pixelAt({ path, x: 117, y: 1000 }) !== 'srgba(176,177,188,1)') {
    throw new Error(`${path} does not preserve the accepted letter-rail boundary.`);
  }
  const currentContainerPixels = countExactColor({ path, crop: '1000x220+1050+270', color: '#F3F3FA' });
  const tonalOpenPixels = countExactColor({ path, crop: '300x150+710+140', color: '#DCE2F9' });
  if (currentContainerPixels < 150000 || tonalOpenPixels < 18000) {
    throw new Error(`${path} does not retain exact accepted treatment 3B.`);
  }
}

const acceptedDefaultPath = 'questions/render/accepted-3b-font-100.png';
const selectedBaselinePath = 'questions/render/cue-container-tonal.png';
if (
  imageFingerprint({ path: acceptedDefaultPath, crop: '1067x1850+1009+150' })
  !== imageFingerprint({ path: selectedBaselinePath, crop: '1067x1850+1009+150' })
) {
  throw new Error('The 100% state changes selected T3 track treatment or alignment.');
}
if (
  imageFingerprint({ path: acceptedDefaultPath, crop: '300x150+710+140' })
  !== imageFingerprint({ path: selectedBaselinePath, crop: '300x150+710+140' })
) {
  throw new Error('The 100% state changes selected O2 tonal Open treatment.');
}
const defaultTransportFingerprint = imageFingerprint({
  path: acceptedDefaultPath,
  crop: '1009x674+0+1400',
});
if (defaultTransportFingerprint !== '945d52d93b878c2b98a08b45bf812b5fa1af2dff450cfa7ba62df131dda4b99a') {
  throw new Error('The 100% state changes transport 1B, seek position, or adaptive mode geometry.');
}

const uniqueCaptures = new Set(renderPaths.map((path) => imageFingerprint({ path, crop: '2076x2152+0+0' })));
if (uniqueCaptures.size !== renderPaths.length) {
  throw new Error('Android font presets did not produce seven distinct native captures.');
}

const expectedRowCounts = {
  '085': 1,
  '100': 1,
  '115': 2,
  '130': 2,
  '150': 2,
  '180': 4,
  '200': 4,
};
const expectedOneRowWidths = {
  '085': [153, 224, 276, 190],
  '100': [138, 214, 284, 184],
};
const expectedDescriptions = ['Repeat track', 'Play in order', 'Shuffle Camellia', 'Shuffle all folders'];
const expectedVisibleLabels = ['Repeat', 'In order', 'Shuffle all'];
for (const label of scaleLabels) {
  const path = `questions/evidence/accepted-3b-font-${label}.xml`;
  const hierarchy = readFileSync(resolve(path), 'utf8');
  if (!hierarchy.includes('content-desc="Current track: Another Xronixle"')) {
    throw new Error(`${path} does not expose current-track semantics.`);
  }
  if (hierarchy.includes('content-desc="Playing"')) {
    throw new Error(`${path} restores the rejected play-icon accessibility node.`);
  }
  if (expectedVisibleLabels.some((text) => !hierarchy.includes(`text="${text}"`))) {
    throw new Error(`${path} does not retain all four visible mode labels.`);
  }
  const shuffleLabelVisible = expectedRowCounts[label] === 1
    ? hierarchy.includes('text="Shuffle "') && hierarchy.includes('text="Camellia"')
    : hierarchy.includes('text="Shuffle Camellia"');
  if (!shuffleLabelVisible) {
    throw new Error(`${path} does not retain visible Shuffle Camellia content.`);
  }
  if (hierarchy.includes('text="Shuffle"') || hierarchy.includes('content-desc="Shuffle current folder"')) {
    throw new Error(`${path} restores a context-free current-folder Shuffle label.`);
  }
  const nodes = hierarchyNodes(hierarchy);
  if (nodes.some((node) => {
    const text = attributeValue({ node, name: 'text' });
    return text.length > 0 && [...text].every((character) => character >= '0' && character <= '9');
  })) {
    throw new Error(`${path} restores interface-generated track ordinals.`);
  }
  if (label === '100') {
    const currentTitleAligned = nodes.some((node) =>
      attributeValue({ node, name: 'text' }) === 'Another Xronixle'
      && attributeValue({ node, name: 'bounds' }) === '[1107,331][1420,390]'
    );
    const ordinaryTitleAligned = nodes.some((node) =>
      attributeValue({ node, name: 'text' }) === 'Burning Aquamarine'
      && attributeValue({ node, name: 'bounds' }) === '[1107,507][1483,566]'
    );
    if (!currentTitleAligned || !ordinaryTitleAligned) {
      throw new Error(`${path} restores a leading state column or misaligns track titles.`);
    }
  }
  const modeNodes = nodes.filter((node) => expectedDescriptions.includes(attributeValue({ node, name: 'content-desc' })));
  if (modeNodes.length !== expectedDescriptions.length) {
    throw new Error(`${path} does not expose exactly four mode options.`);
  }
  const descriptions = new Set(modeNodes.map((node) => attributeValue({ node, name: 'content-desc' })));
  if (descriptions.size !== expectedDescriptions.length) {
    throw new Error(`${path} duplicates or omits a mode option.`);
  }
  const bounds = modeNodes.map((node) => parseBounds(attributeValue({ node, name: 'bounds' })));
  const rowBounds = new Set(bounds.map((bound) => `${bound.top}:${bound.bottom}`));
  if (rowBounds.size !== expectedRowCounts[label]) {
    throw new Error(`${path} uses ${rowBounds.size} mode rows; expected ${expectedRowCounts[label]}.`);
  }
  const targetWidths = bounds.map((bound) => bound.right - bound.left);
  if (bounds.some((bound) => bound.right - bound.left < 117 || bound.bottom - bound.top < 117)) {
    throw new Error(`${path} reduces a mode target below 48dp.`);
  }
  if (
    expectedOneRowWidths[label]
    && targetWidths.some((width, index) => width !== expectedOneRowWidths[label][index])
  ) {
    throw new Error(`${path} does not preserve measured content-sized one-row cells.`);
  }
  const groupBottom = Math.max(...bounds.map((bound) => bound.bottom));
  if (groupBottom > 2035) {
    throw new Error(`${path} does not clear the Android navigation inset.`);
  }
}

const template = readFileSync(resolve('questions/current.template.html'), 'utf8');
const question = readFileSync(resolve('questions/current.html'), 'utf8');
const requiredFragments = [
  'Review accepted 3B across text sizes',
  'the installed <code>SettingsGoogle.apk</code> exposes exactly 85%, 100%, 115%, 130%, 150%, 180%, and 200%',
  'Shuffle Camellia',
  '85% and 100% use one content-sized row. 115%, 130%, and 150% use 2×2. 180% and 200% use four rows.',
  'longer names middle-ellipsize the subdirectory only while accessibility retains the full name',
  'one row &gt; two rows &gt; four rows',
  'soft neutral current-track container, bold current title, tonal Open, and transport 1B',
  'The one-row branch sizes each cell to its content and tries 12dp horizontal padding, then 6dp.',
  'Production assistive technology must still verify one mutually exclusive group announcement.',
  'What should change? Enter “None” if the scale behavior is accepted.',
  'Answer changed. Prepare it again before copying or downloading.',
  'spaces alone do not complete this field.',
  'Math.max(0.02, value)',
  'prototype commit 7b30db15e',
];
for (const fragment of requiredFragments) {
  if (!question.includes(fragment)) {
    throw new Error(`Questionnaire is missing required evidence: ${fragment}`);
  }
}
const disallowedFragments = [
  'Choose redundant cues',
  '4 × 4 matrix',
  'recommendation is 1A',
  'Shuffle current folder',
  'command-bar',
  'volume control',
];
for (const fragment of disallowedFragments) {
  if (question.includes(fragment)) {
    throw new Error(`Questionnaire contains stale or unauthorized content: ${fragment}`);
  }
}
if (question.includes('http://') || question.includes('https://')) {
  throw new Error('Questionnaire must remain offline and self-contained.');
}
if (question.includes('@@')) {
  throw new Error('Built questionnaire still contains an unresolved image marker.');
}
const templateMarkers = template.split('@@IMAGE_FONT_').length - 1;
const embeddedImages = question.split('data:image/png;base64,').length - 1;
const radioCount = question.split('type="radio" name="scaleVerdict"').length - 1;
if (templateMarkers !== 7 || embeddedImages !== 7 || radioCount !== 2) {
  throw new Error(`Expected seven image markers, seven renders, and two verdict radios; found ${templateMarkers}, ${embeddedImages}, and ${radioCount}.`);
}
console.log('Accepted-3B scale review is valid.');
'''

[tasks.build]
description = "Embed seven native accepted-3B text-scale captures into the self-contained review"
shell = "node --input-type=module-typescript -e"
run = "{{vars.build_question}}"

[tasks.lint]
description = "Validate the active accepted-3B text-scale review"
shell = "node --input-type=module-typescript -e"
run = "{{vars.validate_question}}"

[tasks."test:unit"]
description = "Exercise the accepted-3B text-scale completion contract"
shell = "node --input-type=module-typescript -e"
run = "{{vars.validate_question}}"
