[vars]
build_question = '''
const { readFileSync, writeFileSync } = await import('node:fs');
const { resolve } = await import('node:path');
const renderPaths = {
  IMAGE_LIGHT_A: 'questions/render/light-a.png',
  IMAGE_LIGHT_B: 'questions/render/light-b.png',
  IMAGE_LIGHT_C: 'questions/render/light-c.png',
  IMAGE_DBTP_A: 'questions/render/dbtp-a.png',
  IMAGE_DBTP_B: 'questions/render/dbtp-b.png',
  IMAGE_DBTP_C: 'questions/render/dbtp-c.png',
};
let output = readFileSync(resolve('questions/current.template.html'), 'utf8');
for (const [name, path] of Object.entries(renderPaths)) {
  const marker = `@@${name}@@`;
  const occurrences = output.split(marker).length - 1;
  if (occurrences !== 1) {
    throw new Error(`Expected one ${marker} marker, found ${occurrences}.`);
  }
  const dataUri = `data:image/png;base64,${readFileSync(resolve(path)).toString('base64')}`;
  output = output.replace(marker, dataUri);
}
writeFileSync(resolve('questions/current.html'), output);
console.log('Built self-contained design questionnaire.');
'''

validate_question = '''
const { execFileSync } = await import('node:child_process');
const { existsSync, readFileSync } = await import('node:fs');
const { resolve } = await import('node:path');
const requiredPaths = [
  'HANDOFF.md',
  'review-notes.md',
  'decisions.md',
  'open-questions.md',
  'device-metrics.md',
  'candidates/light-a.dc.html',
  'candidates/light-b.dc.html',
  'candidates/light-c.dc.html',
  'questions/current.template.html',
  'questions/current.html',
  'questions/render/light-a.png',
  'questions/render/light-b.png',
  'questions/render/light-c.png',
  'questions/render/dbtp-a.png',
  'questions/render/dbtp-b.png',
  'questions/render/dbtp-c.png',
];
const missingPaths = requiredPaths.filter((path) => !existsSync(resolve(path)));
if (missingPaths.length > 0) {
  throw new Error(`Missing required design files: ${missingPaths.join(', ')}`);
}
const renderDimensions = [
  ['questions/render/light-a.png', 2076, 2152],
  ['questions/render/light-b.png', 2076, 2152],
  ['questions/render/light-c.png', 2076, 2152],
  ['questions/render/dbtp-a.png', 1019, 2152],
  ['questions/render/dbtp-b.png', 1019, 2152],
  ['questions/render/dbtp-c.png', 1019, 2152],
];
for (const [path, expectedWidth, expectedHeight] of renderDimensions) {
  const image = readFileSync(resolve(path));
  const pngSignature = '89504e470d0a1a0a';
  if (image.subarray(0, 8).toString('hex') !== pngSignature) {
    throw new Error(`${path} is not a PNG.`);
  }
  const width = image.readUInt32BE(16);
  const height = image.readUInt32BE(20);
  if (width !== expectedWidth || height !== expectedHeight) {
    throw new Error(`${path} is ${width}×${height}; expected ${expectedWidth}×${expectedHeight}.`);
  }
}
const screenCapturePaths = renderDimensions.map(([path]) => path);
for (const path of screenCapturePaths) {
  const opaque = execFileSync(
    'magick',
    [resolve(path), '-format', '%[opaque]', 'info:'],
    { encoding: 'utf8' },
  );
  if (opaque !== 'True') {
    throw new Error(`${path} must remain an opaque emulator screen capture.`);
  }
}
const pixelAt = ({ path, x, y }) => execFileSync(
  'magick',
  [resolve(path), '-format', `%[pixel:p{${x},${y}}]`, 'info:'],
  { encoding: 'utf8' },
);
for (const path of renderDimensions.slice(0, 3).map(([entryPath]) => entryPath)) {
  const selectedRowPixel = pixelAt({ path, x: 1100, y: 350 });
  const navigationPixel = pixelAt({ path, x: 1038, y: 2112 });
  if (selectedRowPixel !== 'srgba(232,222,248,1)') {
    throw new Error(`${path} did not replace the Android launch splash with Compose content.`);
  }
  if (navigationPixel === 'srgba(255,255,255,1)' || navigationPixel === 'srgba(254,247,255,1)') {
    throw new Error(`${path} is missing the native unfolded gesture handle.`);
  }
}
for (const path of renderDimensions.slice(3).map(([entryPath]) => entryPath)) {
  const statusPixel = pixelAt({ path, x: 700, y: 40 });
  const selectedRowPixel = pixelAt({ path, x: 500, y: 350 });
  const navigationPixel = pixelAt({ path, x: 100, y: 2112 });
  const bottomEndPixel = pixelAt({ path, x: 1018, y: 2151 });
  if (statusPixel !== 'srgba(14,14,14,1)') {
    throw new Error(`${path} is missing the native Android status icons.`);
  }
  if (selectedRowPixel !== 'srgba(232,222,248,1)') {
    throw new Error(`${path} did not replace the Android launch splash with Compose content.`);
  }
  if (navigationPixel === 'srgba(255,255,255,1)') {
    throw new Error(`${path} is missing the native unfolded gesture handle crop.`);
  }
  if (bottomEndPixel !== 'srgba(255,255,255,1)') {
    throw new Error(`${path} still double-wraps the full-height track surface.`);
  }
}
const question = readFileSync(resolve('questions/current.html'), 'utf8');
const deviceRasterSelector = '.preview-open img,\n.zoom-image {';
const deviceRasterRuleStart = question.indexOf(deviceRasterSelector);
const deviceRasterRuleEnd = question.indexOf('\n}', deviceRasterRuleStart);
const deviceRasterRule = question.slice(deviceRasterRuleStart, deviceRasterRuleEnd);
if (deviceRasterRuleStart < 0 || deviceRasterRuleEnd < 0) {
  throw new Error(`Missing device raster rule: ${deviceRasterSelector}`);
}
if (deviceRasterRule.includes('border-radius')) {
  throw new Error(`${deviceRasterSelector} must not round the screen-content raster.`);
}
const deviceFrameSelector = '.device-frame {';
const deviceFrameRuleStart = question.indexOf(deviceFrameSelector);
const deviceFrameRuleEnd = question.indexOf('\n}', deviceFrameRuleStart);
const deviceFrameRule = question.slice(deviceFrameRuleStart, deviceFrameRuleEnd);
const missingFrameProperties = [
  'overflow: hidden;',
  'background-color: var(--device-body);',
].filter((property) => !deviceFrameRule.includes(property));
if (deviceFrameRuleStart < 0 || deviceFrameRuleEnd < 0 || missingFrameProperties.length > 0) {
  throw new Error(`Device chassis must be opaque and clip only at its outer silhouette: ${missingFrameProperties.join(', ')}`);
}
const deviceScreenSelector = '.device-screen {';
const deviceScreenRuleStart = question.indexOf(deviceScreenSelector);
const deviceScreenRuleEnd = question.indexOf('\n}', deviceScreenRuleStart);
const deviceScreenRule = question.slice(deviceScreenRuleStart, deviceScreenRuleEnd);
const missingScreenProperties = [
  'overflow: hidden;',
  'background-color: var(--device-screen-fill);',
].filter((property) => !deviceScreenRule.includes(property));
if (deviceScreenRuleStart < 0 || deviceScreenRuleEnd < 0 || missingScreenProperties.length > 0) {
  throw new Error(`Screen content must sit inside an opaque screen opening: ${missingScreenProperties.join(', ')}`);
}
const forbiddenFragments = [
  '<link ',
  '<script src=',
  'http://',
  'https://',
  'class="foldable"',
  'class="track-study"',
  '@@IMAGE_',
];
const foundFragments = forbiddenFragments.filter((fragment) => question.includes(fragment));
if (foundFragments.length > 0) {
  throw new Error(`Questionnaire violates its self-contained render contract: ${foundFragments.join(', ')}`);
}
const requiredFragments = [
  '<form',
  '<textarea',
  '<dialog',
  'name="lightSeparation"',
  'name="peakEmphasis"',
  'name="anythingElse"',
  'id="zoom-scale"',
  'id="zoom-fit"',
  'id="zoom-native"',
  'id="zoom-actual"',
  'data-preview-width="852"',
  'data-preview-height="883"',
  'data-preview-width="418"',
  'data-source-width="2076"',
  'data-source-height="2152"',
  'data-source-width="1019"',
  'class="device-frame"',
  'data-frame-kind="full"',
  'data-frame-kind="right-half"',
  'class="device-screen"',
  'class="device-camera"',
  'Native Compose capture from Pixel 9 Pro Fold emulator',
  'Android 17 API 37',
  '--device-body: #262624;',
  'aspect-ratio: 907 / 937;',
  'aspect-ratio: 454 / 937;',
  'padding-inline-start: 1.7621%',
  'const fullFrameWidth = 907;',
  'const halfFrameWidth = 454;',
  'const frameHeight = 937;',
  'data-preview-title="1a: Tonal ramp, no outlines" data-preview-width="852" data-preview-height="883" data-preview-unit="dp" data-source-width="2076" data-source-height="2152" data-frame-kind="full"',
  'data-preview-title="1b: One flat surface with hairlines" data-preview-width="852" data-preview-height="883" data-preview-unit="dp" data-source-width="2076" data-source-height="2152" data-frame-kind="full"',
  'data-preview-title="1c: Tonal panes with one rail hairline" data-preview-width="852" data-preview-height="883" data-preview-unit="dp" data-source-width="2076" data-source-height="2152" data-frame-kind="full"',
  'data-preview-title="3a: One secondary treatment" data-preview-width="418" data-preview-height="883" data-preview-unit="dp" data-source-width="1019" data-source-height="2152" data-frame-kind="right-half"',
  'data-preview-title="3b: Stronger true-peak value" data-preview-width="418" data-preview-height="883" data-preview-unit="dp" data-source-width="1019" data-source-height="2152" data-frame-kind="right-half"',
  'data-preview-title="3c: Value only on playing row" data-preview-width="418" data-preview-height="883" data-preview-unit="dp" data-source-width="1019" data-source-height="2152" data-frame-kind="right-half"',
  'grid-template-columns: repeat(3, minmax(0, 1fr))',
  'Copy answers',
];
const absentFragments = requiredFragments.filter((fragment) => !question.includes(fragment));
if (absentFragments.length > 0) {
  throw new Error(`Questionnaire is incomplete: ${absentFragments.join(', ')}`);
}
const imageCount = question.split('data-candidate-source=').length - 1;
const embeddedImageCount = question.split('data:image/png;base64,').length - 1;
const cardFrameCount = question.split('class="device-frame"').length - 1;
const screenOpeningCount = question.split('class="device-screen"').length - 1;
const cameraCount = question.split('class="device-camera"').length - 1;
if (imageCount !== 6 || embeddedImageCount !== 6) {
  throw new Error(`Expected six sourced and embedded candidate renders, found ${imageCount} sources and ${embeddedImageCount} images.`);
}
if (cardFrameCount !== 6 || screenOpeningCount !== 7 || cameraCount !== 7) {
  throw new Error(`Expected six card frames plus one dialog frame, found ${cardFrameCount} card frames, ${screenOpeningCount} screens and ${cameraCount} cameras.`);
}
console.log('Design questionnaire structure is valid.');
'''

[tasks.build]
description = "Embed exact candidate renders into the self-contained questionnaire"
shell = "node --input-type=module-typescript -e"
run = "{{vars.build_question}}"

[tasks.lint]
description = "Validate the active self-contained design questionnaire"
shell = "node --input-type=module-typescript -e"
run = "{{vars.validate_question}}"

[tasks."test:unit"]
description = "Exercise the design questionnaire's static completion contract"
shell = "node --input-type=module-typescript -e"
run = "{{vars.validate_question}}"
