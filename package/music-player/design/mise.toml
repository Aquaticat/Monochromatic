[vars]
build_question = '''
const { readFileSync, writeFileSync } = await import('node:fs');
const { resolve } = await import('node:path');
const renderPaths = {
  IMAGE_LIGHT_A: 'questions/render/light-a.png',
  IMAGE_LIGHT_B: 'questions/render/light-b.png',
  IMAGE_LIGHT_C: 'questions/render/light-c.png',
  IMAGE_DBTP_A: 'questions/render/dbtp-a.png',
  IMAGE_DBTP_B: 'questions/render/dbtp-b.png',
  IMAGE_DBTP_C: 'questions/render/dbtp-c.png',
};
let output = readFileSync(resolve('questions/current.template.html'), 'utf8');
for (const [name, path] of Object.entries(renderPaths)) {
  const marker = `@@${name}@@`;
  const occurrences = output.split(marker).length - 1;
  if (occurrences !== 1) {
    throw new Error(`Expected one ${marker} marker, found ${occurrences}.`);
  }
  const dataUri = `data:image/png;base64,${readFileSync(resolve(path)).toString('base64')}`;
  output = output.replace(marker, dataUri);
}
writeFileSync(resolve('questions/current.html'), output);
console.log('Built self-contained design questionnaire.');
'''

render_candidates = '''
const { execFileSync } = await import('node:child_process');
const { readFileSync } = await import('node:fs');
const { resolve } = await import('node:path');
const { pathToFileURL } = await import('node:url');
const cdpPort = process.env.PI_HELIUM_CDP_PORT ?? '9224';
const panelScale = 2076 / 852;
const candidates = [
  { name: 'light-a', logicalWidth: 852, frameWidth: 852, pixelWidth: 2076 },
  { name: 'light-b', logicalWidth: 852, frameWidth: 852, pixelWidth: 2076 },
  { name: 'light-c', logicalWidth: 852, frameWidth: 852, pixelWidth: 2076 },
  { name: 'dbtp-a', logicalWidth: 418, frameWidth: 434, pixelWidth: 1019 },
  { name: 'dbtp-b', logicalWidth: 418, frameWidth: 434, pixelWidth: 1019 },
  { name: 'dbtp-c', logicalWidth: 418, frameWidth: 434, pixelWidth: 1019 },
];
const logicalHeight = 883;
const pixelHeight = 2152;
const runBrowser = (args) => execFileSync(
  'agent-browser',
  ['--cdp', cdpPort, ...args],
  { encoding: 'utf8' },
);
runBrowser(['get', 'url']);
for (const candidate of candidates) {
  const sourceUrl = pathToFileURL(resolve(`candidates/${candidate.name}.dc.html`)).href;
  const outputPath = resolve(`questions/render/${candidate.name}.png`);
  runBrowser([
    'set',
    'viewport',
    String(candidate.logicalWidth),
    String(logicalHeight),
    String(panelScale),
  ]);
  runBrowser(['open', sourceUrl]);
  runBrowser(['wait', '--load', 'networkidle']);
  runBrowser([
    'wait',
    '--fn',
    `document.readyState === 'complete'
      && [...document.querySelectorAll('div')].some((element) =>
        element.style.width === '${candidate.frameWidth}px'
        && element.children.length > 1
      )
      && document.body.textContent.includes('Camellia')`,
  ]);
  runBrowser([
    'eval',
    `(async () => {
      await document.fonts.ready;
      const frame = [...document.querySelectorAll('div')].find((element) =>
        element.style.width === '${candidate.frameWidth}px'
        && element.children.length > 1
      );
      if (!frame) {
        throw new Error('Candidate frame not found.');
      }
      const fontFamily = getComputedStyle(frame).fontFamily;
      document.body.replaceChildren(frame);
      document.documentElement.style.inlineSize = '${candidate.logicalWidth}px';
      document.documentElement.style.blockSize = '${logicalHeight}px';
      document.documentElement.style.overflow = 'hidden';
      document.body.style.inlineSize = '${candidate.logicalWidth}px';
      document.body.style.blockSize = '${logicalHeight}px';
      document.body.style.marginBlock = '0';
      document.body.style.marginInline = '0';
      document.body.style.overflow = 'hidden';
      frame.style.inlineSize = '${candidate.logicalWidth}px';
      frame.style.blockSize = '${logicalHeight}px';
      frame.style.transform = 'none';
      frame.style.transformOrigin = '0 0';
      frame.style.fontFamily = fontFamily;
      const rect = frame.getBoundingClientRect();
      if (rect.width !== ${candidate.logicalWidth} || rect.height !== ${logicalHeight}) {
        throw new Error('Prepared frame is ' + rect.width + '×' + rect.height + '.');
      }
    })()`,
  ]);
  runBrowser(['screenshot', outputPath]);
  execFileSync('mogrify', ['-strip', outputPath]);
  const image = readFileSync(outputPath);
  const width = image.readUInt32BE(16);
  const height = image.readUInt32BE(20);
  if (width !== candidate.pixelWidth || height !== pixelHeight) {
    throw new Error(`${candidate.name} rendered at ${width}×${height}; expected ${candidate.pixelWidth}×${pixelHeight}.`);
  }
  console.log(`Rendered ${candidate.name} at ${width}×${height}px.`);
}
'''

validate_question = '''
const { existsSync, readFileSync } = await import('node:fs');
const { resolve } = await import('node:path');
const requiredPaths = [
  'HANDOFF.md',
  'review-notes.md',
  'decisions.md',
  'open-questions.md',
  'questions/current.template.html',
  'questions/current.html',
  'questions/render/light-a.png',
  'questions/render/light-b.png',
  'questions/render/light-c.png',
  'questions/render/dbtp-a.png',
  'questions/render/dbtp-b.png',
  'questions/render/dbtp-c.png',
];
const missingPaths = requiredPaths.filter((path) => !existsSync(resolve(path)));
if (missingPaths.length > 0) {
  throw new Error(`Missing required design files: ${missingPaths.join(', ')}`);
}
const renderDimensions = [
  ['questions/render/light-a.png', 2076, 2152],
  ['questions/render/light-b.png', 2076, 2152],
  ['questions/render/light-c.png', 2076, 2152],
  ['questions/render/dbtp-a.png', 1019, 2152],
  ['questions/render/dbtp-b.png', 1019, 2152],
  ['questions/render/dbtp-c.png', 1019, 2152],
];
for (const [path, expectedWidth, expectedHeight] of renderDimensions) {
  const image = readFileSync(resolve(path));
  const pngSignature = '89504e470d0a1a0a';
  if (image.subarray(0, 8).toString('hex') !== pngSignature) {
    throw new Error(`${path} is not a PNG.`);
  }
  const width = image.readUInt32BE(16);
  const height = image.readUInt32BE(20);
  if (width !== expectedWidth || height !== expectedHeight) {
    throw new Error(`${path} is ${width}×${height}; expected ${expectedWidth}×${expectedHeight}.`);
  }
}
const question = readFileSync(resolve('questions/current.html'), 'utf8');
const forbiddenFragments = [
  '<link ',
  '<script src=',
  'http://',
  'https://',
  'class="foldable"',
  'class="track-study"',
  '@@IMAGE_',
];
const foundFragments = forbiddenFragments.filter((fragment) => question.includes(fragment));
if (foundFragments.length > 0) {
  throw new Error(`Questionnaire violates its self-contained render contract: ${foundFragments.join(', ')}`);
}
const requiredFragments = [
  '<form',
  '<textarea',
  '<dialog',
  'name="lightSeparation"',
  'name="peakEmphasis"',
  'name="anythingElse"',
  'id="zoom-scale"',
  'id="zoom-fit"',
  'id="zoom-native"',
  'id="zoom-actual"',
  'data-preview-width="852"',
  'data-preview-height="883"',
  'data-preview-width="418"',
  'data-source-width="2076"',
  'data-source-height="2152"',
  'data-source-width="1019"',
  'data-preview-title="1a: Tonal ramp, no outlines" data-preview-width="852" data-preview-height="883" data-preview-unit="dp" data-source-width="2076" data-source-height="2152"',
  'data-preview-title="1b: One flat surface with hairlines" data-preview-width="852" data-preview-height="883" data-preview-unit="dp" data-source-width="2076" data-source-height="2152"',
  'data-preview-title="1c: Tonal panes with one rail hairline" data-preview-width="852" data-preview-height="883" data-preview-unit="dp" data-source-width="2076" data-source-height="2152"',
  'data-preview-title="3a: One secondary treatment" data-preview-width="418" data-preview-height="883" data-preview-unit="dp" data-source-width="1019" data-source-height="2152"',
  'data-preview-title="3b: Stronger true-peak value" data-preview-width="418" data-preview-height="883" data-preview-unit="dp" data-source-width="1019" data-source-height="2152"',
  'data-preview-title="3c: Value only on playing row" data-preview-width="418" data-preview-height="883" data-preview-unit="dp" data-source-width="1019" data-source-height="2152"',
  'grid-template-columns: repeat(3, minmax(0, 1fr))',
  'Copy answers',
];
const absentFragments = requiredFragments.filter((fragment) => !question.includes(fragment));
if (absentFragments.length > 0) {
  throw new Error(`Questionnaire is incomplete: ${absentFragments.join(', ')}`);
}
const imageCount = question.split('data-candidate-source=').length - 1;
const embeddedImageCount = question.split('data:image/png;base64,').length - 1;
if (imageCount !== 6 || embeddedImageCount !== 6) {
  throw new Error(`Expected six sourced and embedded candidate renders, found ${imageCount} sources and ${embeddedImageCount} images.`);
}
console.log('Design questionnaire structure is valid.');
'''

[tasks."render:candidates"]
description = "Render candidate rasters through Helium CDP at Pixel 9 Pro Fold panel density"
shell = "node --input-type=module-typescript -e"
run = ["{{vars.render_candidates}}", "{{vars.build_question}}"]

[tasks.build]
description = "Embed exact candidate renders into the self-contained questionnaire"
shell = "node --input-type=module-typescript -e"
run = "{{vars.build_question}}"

[tasks.lint]
description = "Validate the active self-contained design questionnaire"
shell = "node --input-type=module-typescript -e"
run = "{{vars.validate_question}}"

[tasks."test:unit"]
description = "Exercise the design questionnaire's static completion contract"
shell = "node --input-type=module-typescript -e"
run = "{{vars.validate_question}}"
