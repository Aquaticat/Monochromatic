[vars]
build_question = '''
const { readFileSync, writeFileSync } = await import('node:fs');
const { resolve } = await import('node:path');
const renderPaths = {
  IMAGE_DIVIDER_B: 'questions/render/divider-b.png',
  IMAGE_DIVIDER_FINAL: 'questions/render/divider-final.png',
};
let output = readFileSync(resolve('questions/current.template.html'), 'utf8');
for (const [name, path] of Object.entries(renderPaths)) {
  const marker = `@@${name}@@`;
  const occurrences = output.split(marker).length - 1;
  if (occurrences !== 1) {
    throw new Error(`Expected one ${marker} marker, found ${occurrences}.`);
  }
  const dataUri = `data:image/png;base64,${readFileSync(resolve(path)).toString('base64')}`;
  output = output.replace(marker, dataUri);
}
writeFileSync(resolve('questions/current.html'), output);
console.log('Built self-contained D2 correction review.');
'''

validate_question = '''
const { execFileSync } = await import('node:child_process');
const { existsSync, readFileSync } = await import('node:fs');
const { resolve } = await import('node:path');
const requiredPaths = [
  'HANDOFF.md',
  'decisions.md',
  'open-questions.md',
  'device-metrics.md',
  'material-3-compliance.md',
  'questions/current.template.html',
  'questions/current.html',
  'questions/render/divider-b.png',
  'questions/render/divider-final.png',
];
const missingPaths = requiredPaths.filter((path) => !existsSync(resolve(path)));
if (missingPaths.length > 0) {
  throw new Error(`Missing required D2 review files: ${missingPaths.join(', ')}`);
}
const renderPaths = [
  'questions/render/divider-b.png',
  'questions/render/divider-final.png',
];
for (const path of renderPaths) {
  const image = readFileSync(resolve(path));
  const pngSignature = '89504e470d0a1a0a';
  if (image.subarray(0, 8).toString('hex') !== pngSignature) {
    throw new Error(`${path} is not a PNG.`);
  }
  const width = image.readUInt32BE(16);
  const height = image.readUInt32BE(20);
  if (width !== 2076 || height !== 2152) {
    throw new Error(`${path} is ${width}×${height}; expected 2076×2152.`);
  }
  const opaque = execFileSync(
    'magick',
    [resolve(path), '-format', '%[opaque]', 'info:'],
    { encoding: 'utf8' },
  );
  if (opaque !== 'True') {
    throw new Error(`${path} must remain an opaque native emulator capture.`);
  }
}
const pixelAt = ({ path, x, y }) => execFileSync(
  'magick',
  [resolve(path), '-format', `%[pixel:p{${x},${y}}]`, 'info:'],
  { encoding: 'utf8' },
);
const countPixelsMatching = ({ path, crop, predicate }) => {
  const histogram = execFileSync(
    'magick',
    [resolve(path), '-crop', crop, '+repage', '-format', '%c', 'histogram:info:-'],
    { encoding: 'utf8' },
  );
  return histogram.split('\n').reduce((count, line) => {
    const tupleStart = line.indexOf('(');
    const tupleEnd = line.indexOf(')', tupleStart);
    const countEnd = line.indexOf(':');
    if (tupleStart < 0 || tupleEnd < 0 || countEnd < 0) {
      return count;
    }
    const channels = line
      .slice(tupleStart + 1, tupleEnd)
      .split(',')
      .slice(0, 3)
      .map((channel) => Number(channel));
    if (!predicate(channels)) {
      return count;
    }
    return count + Number(line.slice(0, countEnd).trim());
  }, 0);
};
const isBlack = ([red, green, blue]) => red === 0 && green === 0 && blue === 0;
const isDark = ([red, green, blue]) => red < 128 && green < 128 && blue < 128;
const isPrimary = ([red, green, blue]) => red === 76 && green === 94 && blue === 139;
for (const path of renderPaths) {
  const statusIconPixels = countPixelsMatching({
    path,
    crop: '300x88+1700+0',
    predicate: isBlack,
  });
  const navigationHandlePixels = countPixelsMatching({
    path,
    crop: '700x78+688+2074',
    predicate: isDark,
  });
  if (statusIconPixels < 1_500) {
    throw new Error(`${path} is missing native Android status icons.`);
  }
  if (navigationHandlePixels < 2_000) {
    throw new Error(`${path} is missing the native unfolded navigation handle.`);
  }
  const selectedFolderIndicatorPixels = countPixelsMatching({
    path,
    crop: '200x4+140+499',
    predicate: isPrimary,
  });
  if (selectedFolderIndicatorPixels < 700) {
    throw new Error(`${path} must retain the selected folder's separate 2dp target-width indicator.`);
  }
  const linkLikeUnderlinePixels = countPixelsMatching({
    path,
    crop: '200x5+140+458',
    predicate: isPrimary,
  });
  if (linkLikeUnderlinePixels > 0) {
    throw new Error(`${path} must not underline selected folder text like a web link.`);
  }
}
const white = 'srgba(255,255,255,1)';
const surfaceDim = 'srgba(216,217,228,1)';
const outlineVariant = 'srgba(176,177,188,1)';
const beforeRail = pixelAt({ path: 'questions/render/divider-b.png', x: 117, y: 1000 });
const beforeCenter = pixelAt({ path: 'questions/render/divider-b.png', x: 1038, y: 1000 });
const beforeHorizontal = pixelAt({ path: 'questions/render/divider-b.png', x: 500, y: 1430 });
const beforeSelectedRow = pixelAt({ path: 'questions/render/divider-b.png', x: 1100, y: 350 });
const finalRail = pixelAt({ path: 'questions/render/divider-final.png', x: 117, y: 1000 });
const finalCenter = pixelAt({ path: 'questions/render/divider-final.png', x: 1038, y: 1000 });
const finalHorizontal = pixelAt({ path: 'questions/render/divider-final.png', x: 500, y: 1430 });
const finalSelectedRow = pixelAt({ path: 'questions/render/divider-final.png', x: 1100, y: 350 });
if (
  beforeRail !== outlineVariant
  || beforeCenter !== white
  || beforeHorizontal !== surfaceDim
  || beforeSelectedRow !== 'srgba(185,203,255,1)'
) {
  throw new Error('divider-b must preserve the exact annotated D2 before-state.');
}
if (finalRail !== outlineVariant || finalCenter !== white || finalHorizontal !== white || finalSelectedRow !== white) {
  throw new Error('divider-final must apply the gray rail, white pane spacers, and neutral current row.');
}
const beforeOrdinalPixels = countPixelsMatching({
  path: 'questions/render/divider-b.png',
  crop: '100x1200+1068+500',
  predicate: isDark,
});
const finalOrdinalPixels = countPixelsMatching({
  path: 'questions/render/divider-final.png',
  crop: '100x1200+1068+500',
  predicate: isDark,
});
const finalCurrentTrackIconPixels = countPixelsMatching({
  path: 'questions/render/divider-final.png',
  crop: '112x170+1068+300',
  predicate: isPrimary,
});
if (beforeOrdinalPixels < 500 || finalOrdinalPixels !== 0) {
  throw new Error('divider-final must remove interface-generated track ordinals shown in divider-b.');
}
if (finalCurrentTrackIconPixels < 300) {
  throw new Error('divider-final must retain the Material play icon as the non-color current-track cue.');
}
const question = readFileSync(resolve('questions/current.html'), 'utf8');
const forbiddenFragments = [
  '<link ',
  '<script src=',
  'http://',
  'https://',
  '@@IMAGE_',
  '#chosen-baseline',
  'Q1 1c',
  'Q2 3a',
  'what is your definition',
];
const foundFragments = forbiddenFragments.filter((fragment) => question.includes(fragment));
if (foundFragments.length > 0) {
  throw new Error(`D2 review contains stale or external content: ${foundFragments.join(', ')}`);
}
const requiredFragments = [
  '<form',
  '<fieldset>',
  '<textarea',
  '<dialog',
  'What changed',
  'Before:',
  'Revised:',
  'name="reviewResult"',
  'name="otherCorrections"',
  'value="d2-before"',
  'value="d2-revised"',
  'Ranking: revised D2 &gt; previous D2.',
  'Every remaining correction, or “None”',
  'Copy answers',
  'prototype commit 89a9f7033',
  'prototype commit 49d6568ed',
  'data-preview-width="852"',
  'data-preview-height="883"',
  'data-source-width="2076"',
  'data-source-height="2152"',
  'aspect-ratio: 907 / 937;',
  'const fullFrameWidth = 907;',
  'const frameHeight = 937;',
  '--color-device: #262624;',
  'Close preview and answer',
];
const absentFragments = requiredFragments.filter((fragment) => !question.includes(fragment));
if (absentFragments.length > 0) {
  throw new Error(`D2 review is incomplete: ${absentFragments.join(', ')}`);
}
const imageCount = question.split('data-candidate-source=').length - 1;
const embeddedImageCount = question.split('data:image/png;base64,').length - 1;
const frameCount = question.split('class="device-frame"').length - 1;
const screenCount = question.split('class="device-screen"').length - 1;
const cameraCount = question.split('class="device-camera"').length - 1;
const radioCount = question.split('type="radio" name="reviewResult"').length - 1;
if (imageCount !== 2 || embeddedImageCount !== 2) {
  throw new Error(`Expected two sourced and embedded renders, found ${imageCount} sources and ${embeddedImageCount} images.`);
}
if (frameCount !== 2 || screenCount !== 3 || cameraCount !== 3 || radioCount !== 2) {
  throw new Error(`Expected two cards plus one dialog frame; found ${frameCount} frames, ${screenCount} screens, ${cameraCount} cameras, and ${radioCount} radios.`);
}
console.log('D2 correction review structure is valid.');
'''

[tasks.build]
description = "Embed native D2 before-and-after renders into the self-contained review"
shell = "node --input-type=module-typescript -e"
run = "{{vars.build_question}}"

[tasks.lint]
description = "Validate the active D2 correction review"
shell = "node --input-type=module-typescript -e"
run = "{{vars.validate_question}}"

[tasks."test:unit"]
description = "Exercise the D2 correction review's static completion contract"
shell = "node --input-type=module-typescript -e"
run = "{{vars.validate_question}}"
