# Per-target build overrides for this crate: the Windows MSVC linker (lld-link).

# Windows MSVC. `lld-link.exe` is LLVM's MSVC-compatible linker (a drop-in for
# Visual Studio's `link.exe`). It must be on PATH: LLVM ships it in its `bin`
# directory (`C:\Program Files\LLVM\bin`), which is not on PATH by default, so that
# directory has to be added (see README "Windows" and
# HANDOVER.windows-toolchain-and-check.md). rustc still discovers the Visual Studio
# CRT and Windows SDK import libraries and passes them as `/LIBPATH:` arguments,
# which lld-link consumes unchanged.
[target.x86_64-pc-windows-msvc]
linker = "lld-link.exe"
