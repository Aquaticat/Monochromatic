[tasks.run]
description = "Build (host if dev libs present, else container), then run the music-player GUI on the host (pass file/folder paths after --)"
usage = '''
arg "[args]" var=#true help="File or folder paths to enqueue"
'''
# The binary is BUILT host-first (or in the container when the host lacks the
# PipeWire/Opus/clang dev headers) and RUN directly on the host. Running on the
# host means the window, audio, D-Bus, and the KDE taskbar all use the host
# session natively: no socket passthrough, no --userns=keep-id, and the .desktop
# association + LauncherEntry taskbar progress work without the container's SASL
# EXTERNAL uid juggling. A container-built binary links only against runtime libs
# present on the host (verified with `ldd`), and a binary built on the older
# container glibc (Fedora 41) runs on the newer host glibc (Fedora 44+).
#
# The host environment already provides WAYLAND_DISPLAY, XDG_RUNTIME_DIR, the
# D-Bus session bus, PipeWire, and the XDG user dirs, so the empty-launch auto-load
# finds the music directory, GPU GL uses /dev/dri directly, and the session file
# lands in the real ~/.config/music-player. SLINT_BACKEND is read from the host env
# if set (to force the software renderer). The KDE .desktop uses a bare
# `Exec=music-player`, resolved on the systemd user PATH which includes ~/.local/bin
# (verified via `systemctl --user show-environment`) but NOT this package's
# target/release, so the binary is copied to ~/.local/bin to exercise the SAME
# binary the launcher resolves. When HOME is unset, both installs are skipped and
# the freshly built target/release copy is run instead.
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
{{vars.parse_usage_args}}
const { mkdirSync, copyFileSync } = await import('node:fs')
const { join } = await import('node:path')
const home = process.env.HOME ?? ''
runCargo(['build', '--release'])
let bin
if (process.platform !== 'linux') {
  bin = process.platform === 'win32' ? './target/release/music-player.exe' : './target/release/music-player'
} else if (home !== '') {
  const appsDir = join(home, '.local/share/applications')
  mkdirSync(appsDir, { recursive: true })
  copyFileSync('share/applications/monochromatic.music-player.desktop', join(appsDir, 'monochromatic.music-player.desktop'))
  const binDir = join(home, '.local/bin')
  mkdirSync(binDir, { recursive: true })
  copyFileSync('target/release/music-player', join(binDir, 'music-player'))
  bin = join(binDir, 'music-player')
} else {
  bin = './target/release/music-player'
}
const extras = parseUsageArgs(process.env.usage_args ?? '')
execFileSync(bin, extras, { stdio: 'inherit' })
"""

[tasks."run-quick"]
description = "Release-optimised build WITHOUT link-time optimisation, then run it on the host for fast iteration (pass file/folder paths after --)"
usage = '''
arg "[args]" var=#true help="File or folder paths to enqueue"
'''
# Middle path between `run` (thin LTO since 2026-10-11, the distributed binary) and `run-debug` (unoptimised, too slow
# to analyse a library). Measured on this crate on a loaded 16-core host (load average 27 to 43, so compare the settings with each
# other, not the absolute numbers): rebuilding only this crate took ~300 s with fat LTO, ~60 s with thin LTO and
# ~17 s with LTO off (two runs each, within 3 s of each other); the binary is 41.6 MB, 46.4 MB and 46.7 MB. Fat LTO
# spends 287 of the 302 s of rustc time in `LLVM_fatlto` (rustc -Ztime-passes), not in compiling this crate's code.
# `CARGO_PROFILE_RELEASE_LTO=off` overrides the profile for this run only, so Cargo.toml (generated by file-enforcer)
# is untouched, and a separate target directory keeps the `run` build cache warm. Like `run-debug`, it does NOT
# install into ~/.local/bin or the .desktop file.
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
{{vars.parse_usage_args}}
const { join } = await import('node:path')
process.env.CARGO_PROFILE_RELEASE_LTO = 'off'
process.env.CARGO_TARGET_DIR = join(process.cwd(), 'target', 'quick')
runCargo(['build', '--release'])
const extras = parseUsageArgs(process.env.usage_args ?? '')
const bin = process.platform === 'win32' ? './target/quick/release/music-player.exe' : './target/quick/release/music-player'
execFileSync(bin, extras, { stdio: 'inherit' })
"""

[tasks."run-debug"]
description = "Debug build (host if dev libs present, else container), then run it on the host for fast iteration (pass file/folder paths after --)"
usage = '''
arg "[args]" var=#true help="File or folder paths to enqueue"
'''
# Fast-iteration sibling of `run`: builds the unoptimised DEBUG binary (~10s
# incremental, no LTO/strip) and runs target/debug/music-player directly. It does
# NOT copy into ~/.local/bin or install the .desktop, so the installed release
# binary the launcher resolves is left untouched.
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
{{vars.parse_usage_args}}
runCargo(['build'])
const extras = parseUsageArgs(process.env.usage_args ?? '')
const bin = process.platform === 'win32' ? './target/debug/music-player.exe' : './target/debug/music-player'
execFileSync(bin, extras, { stdio: 'inherit' })
"""

[tasks."gen:fixtures"]
description = "Generate tiny per-codec audio fixtures with host ffmpeg (run once, commit results)"
# Runs on the host: ffmpeg is present there. 0.3s 440Hz stereo sine per codec.
# 48000 Hz is used because libopus only accepts a fixed set of input rates
# (8000/12000/16000/24000/48000); 48000 is the safe common rate.
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const specs = [
  { ext: 'wav', args: [] },
  { ext: 'flac', args: [] },
  { ext: 'mp3', args: ['-c:a', 'libmp3lame'] },
  { ext: 'ogg', args: ['-c:a', 'libvorbis'] },
  { ext: 'opus', args: ['-c:a', 'libopus'] },
  { ext: 'aac.m4a', args: ['-c:a', 'aac'] },
  { ext: 'alac.m4a', args: ['-c:a', 'alac'] },
]
for (const spec of specs) {
  const out = `fixture/tone.${spec.ext}`
  console.log(`generating ${out}`)
  execFileSync('ffmpeg', ['-y', '-f', 'lavfi', '-i', 'sine=frequency=440:duration=0.3', '-ac', '2', '-ar', '48000', ...spec.args, out], { stdio: 'inherit' })
}
// offset.opus: a remux of tone.opus with a +0.5s timestamp offset so its first
// audio frame is NOT frame 0, reproducing the Ogg/Opus seek-to-start bug that the
// seek_to_start_of_offset_opus regression test depends on.
console.log('generating fixture/offset.opus')
execFileSync('ffmpeg', ['-y', '-i', 'fixture/tone.opus', '-c', 'copy', '-output_ts_offset', '0.5', 'fixture/offset.opus'], { stdio: 'inherit' })
"""

[tasks."gen:icons"]
description = "Regenerate the macOS .icns + Windows .ico from asset/icon.svg (run once, commit results)"
