{{vars.cargo_dispatch}}
runCargo(['clippy', '--fix', '--allow-dirty', '--allow-staged', '--allow-no-vcs', '--all-targets'])
"""

[tasks.test]
description = "cargo nextest run (macOS/Windows native, else Linux host if dev libs present, else container)"
# The native (non-Linux) branch needs cargo-nextest on PATH (`cargo install
# cargo-nextest`, or `brew install cargo-nextest` on macOS); the tests are pure
# logic with no audio backend, so they run identically on macOS and Windows.
# SLINT_EMIT_DEBUG_INFO=1 makes slint-build embed element ids + source locations in
# the generated UI so src/ui_binding_tests.rs's ElementHandle locators work; the
# testing crate refuses to run without it. It is set here (not in [env]) so the
# size-optimized production build/run binaries stay free of the extra metadata.
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
process.env.SLINT_EMIT_DEBUG_INFO = '1'
runCargo(['nextest', 'run'])
"""

[tasks.mcp]
description = "Build --features slint/mcp (debug) and run HEADLESS with the embedded Slint MCP server on SLINT_MCP_PORT (default 9315) so an agent can drive/inspect the UI. Pass file/folder paths after --."
usage = '''
arg "[args]" var=#true help="File or folder paths to enqueue (loaded PAUSED)"
'''
# The embedded MCP server (Slint 1.18 `slint/mcp` feature, activated by
# SLINT_MCP_PORT) exposes get_element_tree / find_elements_by_id / take_screenshot
# / click_element / set_element_value etc. over MCP Streamable HTTP on
# 127.0.0.1:<port>/mcp. The repo-root .mcp.json points Claude at that URL, so a
# session runs THIS task first, then drives the running app through the MCP tools.
# - `mcp` is passed on the command line, NEVER added to Cargo.toml [features], so
#   the size-optimized production binary never carries the introspection server.
# - SLINT_EMIT_DEBUG_INFO=1 is required so element ids + source locations survive
#   into the compiled UI for find_elements_by_id / the element tree.
# - SLINT_BACKEND=headless renders real frames off-screen (software renderer, which
#   this crate already enables) so take_screenshot works with no window on your
#   desktop; override to empty (SLINT_BACKEND= ) to run on the live session, or run
#   nested under niri for a GPU render off your main workspace.
# The app loads PAUSED (no --start-playing), so nothing plays until an MCP client
# clicks the transport; drive volume down first if a test must exercise playback.
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
{{vars.parse_usage_args}}
const { mkdirSync } = await import('node:fs')
const { join } = await import('node:path')
process.env.SLINT_EMIT_DEBUG_INFO = '1'
process.env.SLINT_MCP_PORT = process.env.SLINT_MCP_PORT ?? '9315'
process.env.SLINT_BACKEND = process.env.SLINT_BACKEND ?? 'headless'
// Isolate this test instance's state under a gitignored throwaway (target/mcp-xdg)
// so it never grabs the real ~/.config/musicplayer cache lock held by an installed
// music-player, and never mutates the user's real session/cache (throwaway-fixture
// rule). directories/ProjectDirs honors these XDG vars.
const xdgRoot = join(process.cwd(), 'target', 'mcp-xdg')
for (const sub of ['config', 'cache', 'data']) { mkdirSync(join(xdgRoot, sub), { recursive: true }) }
process.env.XDG_CONFIG_HOME = join(xdgRoot, 'config')
process.env.XDG_CACHE_HOME = join(xdgRoot, 'cache')
process.env.XDG_DATA_HOME = join(xdgRoot, 'data')
runCargo(['build', '--features', 'slint/mcp'])
const extras = parseUsageArgs(process.env.usage_args ?? '')
const bin = process.platform === 'win32' ? './target/debug/music-player.exe' : './target/debug/music-player'
console.error(`music-player MCP server: http://127.0.0.1:${process.env.SLINT_MCP_PORT}/mcp (backend=${process.env.SLINT_BACKEND || 'default'})`)
execFileSync(bin, extras, { stdio: 'inherit' })
"""

[tasks."lint:slint"]
description = "Type-check ui/app.slint with slint-viewer --check (compiles the markup, opens no window, exits non-zero on error)"
# slint-viewer is the same 1.18 compiler family as slint-build, and
# SLINT_ENABLE_EXPERIMENTAL_FEATURES (from [env]) enables the FlexboxLayout builtin
# the UI uses, so this catches .slint markup errors fast without a full Rust build.
run = "slint-viewer --check ui/app.slint"

[tasks."test:e2e"]
description = "Release build, then press every D106 shortcut as a real key event in the nested compositor (own PipeWire null sink, scratch XDG dirs)"
# One task builds, then runs the end-to-end script, in this order, so a stale binary is never exercised.
run = [{ tasks = ["build"] }, { tasks = ["test:e2e:run"] }]

[tasks."test:e2e:run"]
description = "Run the keyboard end-to-end script against the existing release binary (use test:e2e to build first)"
# The script holds its logic inline, in the shell form every task of this package uses. It hosts the release binary in
# monochromatic-nested-wayland-session 0.3.0, presses keys through the compositor's control socket, and reads state from
# the app's `ui_state` log lines (the release build has no MCP server), from screenshots, files and the nested clipboard.
# Environment: E2E_ONLY (a check id or group prefix to run alone), E2E_OUT (screenshots and summary, default
# target/e2e), E2E_TMP (scratch root), E2E_LIBRARY_GENERATOR (the library generator script).
shell = "node --input-type=module-typescript -e"
run = '''
// Core of the keyboard end-to-end run: environment, library, audio sink, compositor session, log state, screenshots.
// The real run (mise task test:e2e) is this file plus the scenarios, joined by a generator, because the task holds its
// logic inline. Nothing here imports outside node's own modules.
import { execFileSync, spawn, spawnSync } from 'node:child_process';
import { chmodSync, closeSync, existsSync, mkdirSync, mkdtempSync, openSync, readSync, rmSync, statSync, writeFileSync, copyFileSync, readFileSync, readdirSync } from 'node:fs';
import { connect } from 'node:net';
import { homedir } from 'node:os';
import { join } from 'node:path';

// ---- configuration -------------------------------------------------------------------------------------------------
const packageDir = process.cwd();
const releaseBinary = join(packageDir, 'target', 'release', 'music-player');
const outputRoot = process.env.E2E_OUT ?? join(packageDir, 'target', 'e2e');
const scratchRoot = process.env.E2E_TMP ?? join(homedir(), 'temp', 'agent', 'music-player-e2e');
const only = process.env.E2E_ONLY ?? '';
const generatorPath = process.env.E2E_LIBRARY_GENERATOR ?? join(homedir(), 'temp', 'agent', 'agent-scale', 'make-scale-library.ts');
// Pinned to 0.3.0 because the control API and the key names the checks use were probed on that version (0.3.0 answers
// "unknown key" for F5, F10 and Menu); another version could change them.
const compositorGuess = join(homedir(), '.local', 'share', 'mise', 'installs', 'cargo-monochromatic-nested-wayland-session', '0.3.0', 'bin', 'monochromatic-nested-wayland-session');

const sleep = (ms: number) => new Promise<void>((resolve) => setTimeout(resolve, ms));
const stripAnsi = (text: string) => text.replace(/\x1b\[[0-9;]*m/g, '');

// ---- results -------------------------------------------------------------------------------------------------------
type Outcome = { id: string; title: string; ok: boolean; skipped: boolean; detail: string; ms: number };
const outcomes: Outcome[] = [];
let currentGroup = '';

class Failure extends Error {}
// A routing fault that ends the whole run at once: nothing may play anywhere but the private sink.
class SafetyStop extends Error {}
function expect(condition: unknown, message: string): asserts condition {
  if (!condition) throw new Failure(message);
}

// Runs one named check; the outcome is recorded whether it passes or fails, and a failure never stops the run.
async function check(id: string, title: string, body: () => Promise<string | void>): Promise<void> {
  if (only !== '' && !id.includes(only) && !currentGroup.includes(only)) return;
  const started = Date.now();
  try {
    const detail = (await body()) ?? '';
    outcomes.push({ id, title, ok: true, skipped: false, detail, ms: Date.now() - started });
    console.log(`PASS ${id} ${title}${detail === '' ? '' : ' :: ' + detail}`);
  } catch (error) {
    if (error instanceof SafetyStop) throw error;
    const detail = error instanceof Error ? error.message : String(error);
    outcomes.push({ id, title, ok: false, skipped: false, detail, ms: Date.now() - started });
    console.log(`FAIL ${id} ${title} :: ${detail}`);
  }
}

// A check that cannot run here, recorded with the evidence; it counts neither as a pass nor as a failure.
function skip(id: string, title: string, reason: string): void {
  if (only !== '' && !id.includes(only) && !currentGroup.includes(only)) return;
  outcomes.push({ id, title, ok: true, skipped: true, detail: reason, ms: 0 });
  console.log(`SKIP ${id} ${title} :: ${reason}`);
}

// ---- audio: a private PipeWire null sink ---------------------------------------------------------------------------
const sinkName = `music_player_e2e_${process.pid}`;
let sinkModule = '';
let sinkNodeId = -1;

type PwObject = { id: number; type?: string; info?: { props?: Record<string, string | number | boolean>; 'input-node-id'?: number; 'output-node-id'?: number } };
function pwObjects(): PwObject[] {
  const result = spawnSync('pw-dump', [], { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 });
  return JSON.parse(result.stdout || '[]') as PwObject[];
}

function createSink(): void {
  const loaded = spawnSync('pactl', ['load-module', 'module-null-sink', `sink_name=${sinkName}`, `sink_properties=device.description=${sinkName}`], { encoding: 'utf8' });
  expect(loaded.status === 0, `could not create the null sink: ${loaded.stderr}`);
  sinkModule = loaded.stdout.trim();
  for (let attempt = 0; attempt < 40; attempt++) {
    const node = pwObjects().find((object) => (object.type ?? '').includes('Node') && object.info?.props?.['node.name'] === sinkName);
    if (node) { sinkNodeId = node.id; return; }
  }
  throw new Failure('the null sink node never appeared');
}

function destroySink(): void {
  if (sinkModule !== '') spawnSync('pactl', ['unload-module', sinkModule], { encoding: 'utf8' });
  sinkModule = '';
}

// Every output stream of the app process must link to the null sink only. Returns a description, or throws.
function routingOf(appPid: string): { linked: number; detail: string } {
  const objects = pwObjects();
  const nodes = objects.filter((object) => (object.type ?? '').includes('Node'));
  const links = objects.filter((object) => (object.type ?? '').includes('Link'));
  const clientIds = objects
    .filter((object) => (object.type ?? '').includes('Client') && String(object.info?.props?.['application.process.id'] ?? '') === appPid)
    .map((object) => object.id);
  const streams = nodes.filter((node) => clientIds.includes(Number(node.info?.props?.['client.id'])) && node.info?.props?.['media.class'] === 'Stream/Output/Audio');
  let linked = 0;
  for (const stream of streams) {
    for (const link of links.filter((candidate) => candidate.info?.['output-node-id'] === stream.id)) {
      const target = link.info?.['input-node-id'];
      if (target !== sinkNodeId) throw new SafetyStop(`SAFETY STOP: the app stream ${stream.id} links to node ${target}, not to the private sink ${sinkNodeId}`);
      linked++;
    }
  }
  return { linked, detail: `${streams.length} output streams, ${linked} links, all to node ${sinkNodeId}` };
}

// ---- the library ---------------------------------------------------------------------------------------------------
function waveBytes(seconds: number, hertz: number): Buffer {
  const rate = 22050;
  const frames = rate * seconds;
  const data = Buffer.alloc(44 + frames * 2);
  data.write('RIFF', 0, 'ascii'); data.writeUInt32LE(36 + frames * 2, 4); data.write('WAVE', 8, 'ascii'); data.write('fmt ', 12, 'ascii');
  data.writeUInt32LE(16, 16); data.writeUInt16LE(1, 20); data.writeUInt16LE(1, 22); data.writeUInt32LE(rate, 24); data.writeUInt32LE(rate * 2, 28);
  data.writeUInt16LE(2, 32); data.writeUInt16LE(16, 34); data.write('data', 36, 'ascii'); data.writeUInt32LE(frames * 2, 40);
  for (let frame = 0; frame < frames; frame++) data.writeInt16LE(Math.round(Math.sin((2 * Math.PI * hertz * frame) / rate) * 0.05 * 32767), 44 + frame * 2);
  return data;
}

// Builds the scratch library: the 1k scale library (real files), plus folders of long tone tracks that make seeking and
// track changes possible and one short file that the Delete test sends to the trash.
function buildLibrary(root: string): { library: string } {
  const library = join(root, 'library');
  if (existsSync(generatorPath)) {
    execFileSync('node', [generatorPath, '--preset', '1k', '--out', join(root, 'paths-1k.txt'), '--materialize', library], { stdio: 'ignore' });
  } else {
    mkdirSync(library, { recursive: true });
    for (let index = 1; index <= 30; index++) writeFileSync(join(library, `Fallback ${String(index).padStart(2, '0')}.wav`), waveBytes(1, 330));
  }
  const tones = join(library, 'Aaa Tones');
  mkdirSync(tones, { recursive: true });
  for (const [name, seconds, hertz] of [['01 Alpha tone.wav', 200, 220], ['02 Bravo tone.wav', 200, 247], ['03 Charlie tone.wav', 200, 262], ['04 Delta tone.wav', 200, 294]] as const) {
    writeFileSync(join(tones, name), waveBytes(seconds, hertz));
  }
  const last = join(library, 'Zzz Tones');
  mkdirSync(last, { recursive: true });
  writeFileSync(join(last, '01 Omega tone.wav'), waveBytes(30, 392));
  writeFileSync(join(last, '99 Trash me.wav'), waveBytes(2, 440));
  return { library };
}

// ---- the compositor session ----------------------------------------------------------------------------------------
type UiState = {
  seq: number; reason: string; route: string; zone: string; focus: string; unfolded: boolean; picker_open: boolean; menu_open: boolean;
  folder: string; ring_track: number | null; ring_track_title: string | null; ring_folder: string | null; menu_ring: number | null;
  search_ring: number | null; search_query: string; current_index: number | null; playing: boolean; mode: number; position: number;
  duration: number; settings_selected: number; ring_visible: boolean; focus_request: number; badges: string[]; primary: string; canvas: string;
  width: number; height: number;
};

type SessionOptions = { width: number; height: number; scheme: 'dark' | 'light'; accent: string; library: string; label: string; extraEnv?: Record<string, string>; appArgs?: string[] };

function compositorPath(): string {
  // The pinned 0.3.0 install is used directly: the mise shim on PATH needs the user's trusted config, which the
  // systemd unit does not have.
  expect(existsSync(compositorGuess), `the nested compositor 0.3.0 is not installed at ${compositorGuess}`);
  return compositorGuess;
}

class Session {
  readonly unit: string;
  readonly socket: string;
  readonly logPath: string;
  readonly shots: string;
  readonly xdg: string;
  readonly home: string;
  readonly opts: SessionOptions;
  states: UiState[] = [];
  private logOffset = 0;
  private pending = '';
  appPid = '';

  constructor(opts: SessionOptions, base: string) {
    this.opts = opts;
    this.unit = `music-player-e2e-${process.pid}-${opts.label}`;
    this.socket = join(base, `${opts.label}.sock`);
    this.logPath = join(base, `${opts.label}.log`);
    this.shots = join(outputRoot, 'shots');
    this.xdg = join(base, `${opts.label}-xdg`);
    this.home = join(base, `${opts.label}-home`);
  }

  static async start(opts: SessionOptions, base: string): Promise<Session> {
    const session = new Session(opts, base);
    for (const sub of ['config', 'data', 'cache', 'state']) mkdirSync(join(session.xdg, sub), { recursive: true });
    mkdirSync(session.home, { recursive: true });
    mkdirSync(join(base, 'bin'), { recursive: true });
    mkdirSync(session.shots, { recursive: true });
    writeFileSync(session.logPath, '');
    const env: Record<string, string> = {
      WAYLAND_DISPLAY: process.env.WAYLAND_DISPLAY ?? 'wayland-0',
      XDG_RUNTIME_DIR: process.env.XDG_RUNTIME_DIR ?? '/run/user/1000',
      PIPEWIRE_NODE: sinkName,
      RUST_LOG: 'info,music_player=debug',
      RUST_BACKTRACE: '1',
      XDG_CONFIG_HOME: join(session.xdg, 'config'),
      XDG_DATA_HOME: join(session.xdg, 'data'),
      XDG_CACHE_HOME: join(session.xdg, 'cache'),
      XDG_STATE_HOME: join(session.xdg, 'state'),
      // The file manager and the clipboard tools resolve here first, so a key that would open a real file manager records
      // its request in a file instead.
      PATH: `${join(base, 'bin')}:${process.env.PATH ?? ''}`,
      MUSIC_PLAYER_ACCENT: '',
      MUSIC_PLAYER_COLOR_SCHEME: '',
      ...(opts.extraEnv ?? {}),
    };
    const args = [
      '--user', `--unit=${session.unit}`, '--collect', '--property=MemoryMax=8G',
      `--property=StandardOutput=append:${session.logPath}`, `--property=StandardError=append:${session.logPath}`,
      ...Object.entries(env).map(([key, value]) => `--setenv=${key}=${value}`),
      compositorPath(), '--socket', session.socket, '--size', `${opts.width}x${opts.height}`, '--color-scheme', opts.scheme,
      '--accent-color', opts.accent, '--', releaseBinary, ...(opts.appArgs ?? [opts.library]),
    ];
    const launched = spawnSync('systemd-run', args, { encoding: 'utf8' });
    expect(launched.status === 0, `systemd-run failed: ${launched.stderr}`);
    for (let attempt = 0; attempt < 120 && !existsSync(session.socket); attempt++) await sleep(250);
    expect(existsSync(session.socket), `the compositor socket never appeared; log: ${session.tail(600)}`);
    return session;
  }

  tail(chars: number): string {
    try { return stripAnsi(readFileSync(this.logPath, 'utf8')).slice(-chars); } catch { return ''; }
  }

  // Reads new log lines and keeps the ui_state ones.
  pump(): void {
    const size = statSync(this.logPath).size;
    if (size <= this.logOffset) return;
    const descriptor = openSync(this.logPath, 'r');
    const buffer = Buffer.alloc(size - this.logOffset);
    readSync(descriptor, buffer, 0, buffer.length, this.logOffset);
    closeSync(descriptor);
    this.logOffset = size;
    this.pending += buffer.toString('utf8');
    const lines = this.pending.split('\n');
    this.pending = lines.pop() ?? '';
    for (const line of lines) {
      const match = /ui_state (\{.*\})/.exec(stripAnsi(line));
      if (match) {
        try { this.states.push(JSON.parse(match[1]) as UiState); } catch { /* a torn line is skipped */ }
      }
    }
  }

  last(): UiState {
    this.pump();
    const state = this.states[this.states.length - 1];
    expect(state !== undefined, 'the app has written no ui_state line yet');
    return state;
  }

  seq(): number {
    this.pump();
    return this.states.length === 0 ? 0 : this.states[this.states.length - 1].seq;
  }

  // Waits for a state line newer than `after` (a sequence number) that satisfies the predicate.
  async waitState(predicate: (state: UiState) => boolean, what: string, after = -1, timeoutMs = 6000): Promise<UiState> {
    const deadline = Date.now() + timeoutMs;
    for (;;) {
      this.pump();
      const hit = this.states.find((state) => state.seq > after && predicate(state));
      if (hit) return hit;
      if (Date.now() > deadline) {
        const recent = this.states.slice(-3).map((state) => JSON.stringify(state)).join('\n   ');
        throw new Failure(`timed out waiting for ${what}; last states:\n   ${recent}`);
      }
      await sleep(40);
    }
  }

  // The latest state at or after a settle time, for "nothing changed" checks.
  async settle(ms = 400): Promise<UiState> {
    await sleep(ms);
    return this.last();
  }

  async send(line: string): Promise<string> {
    return await new Promise<string>((resolve, reject) => {
      const client = connect(this.socket);
      let data = '';
      client.on('data', (chunk) => { data += chunk; if (data.includes('\n')) client.end(); });
      client.on('end', () => resolve(data.trim()));
      client.on('error', reject);
      client.write(line + '\n');
    });
  }

  async ok(line: string): Promise<void> {
    const answer = await this.send(line);
    expect(answer.startsWith('ok'), `compositor answered "${answer}" to "${line}"`);
  }

  async tap(key: string): Promise<void> { await this.ok(`key ${key} tap`); }
  async down(key: string): Promise<void> { await this.ok(`key ${key} press`); }
  async up(key: string): Promise<void> { await this.ok(`key ${key} release`); }

  // Holds the modifiers, taps the key, releases the modifiers in reverse order, as a person does.
  async chord(mods: string[], key: string): Promise<void> {
    for (const mod of mods) await this.down(mod);
    await this.tap(key);
    for (const mod of [...mods].reverse()) await this.up(mod);
  }

  async type(text: string): Promise<void> { await this.ok(`type ${text}`); }

  async click(x: number, y: number, button = 'left'): Promise<void> { await this.ok(`click ${x} ${y} ${button}`); }

  async shot(name: string): Promise<string> {
    const file = join(this.shots, `${this.opts.label}-${name}.png`);
    await this.ok('move 2 2');
    await sleep(350);
    await this.ok(`screenshot ${file}`);
    return file;
  }

  // The app's process id: the music-player process that lives in this run's own systemd unit, never another one.
  findAppPid(): string {
    const found = spawnSync('pgrep', ['--exact', 'music-player'], { encoding: 'utf8' });
    for (const pid of found.stdout.trim().split('\n').filter((entry) => entry !== '')) {
      try {
        if (readFileSync(`/proc/${pid}/cgroup`, 'utf8').includes(`${this.unit}.service`)) { this.appPid = pid; return pid; }
      } catch { /* the process ended */ }
    }
    return '';
  }

  // Lines of the log, without colors.
  lines(): string[] {
    try { return stripAnsi(readFileSync(this.logPath, 'utf8')).split('\n'); } catch { return []; }
  }

  // How many times the app reported using a shortcut action (the "shortcut used" line), optionally one action only.
  used(action?: string): number {
    return this.lines().filter((line) => line.includes('shortcut used') && (action === undefined || line.includes(`action="${action}"`))).length;
  }

  // The nested Wayland display name, so the clipboard can be read from the nested session only.
  waylandDisplay(): string {
    for (const line of this.lines()) {
      const match = /Created new socket\s+name=Some\("(wayland-[0-9]+)"\)/.exec(line);
      if (match) return match[1];
    }
    return '';
  }

  async stop(): Promise<void> {
    try { await this.send('quit'); } catch { /* already gone */ }
    for (let attempt = 0; attempt < 40; attempt++) {
      const active = spawnSync('systemctl', ['--user', 'is-active', `${this.unit}.service`], { encoding: 'utf8' }).stdout.trim();
      if (active !== 'active' && active !== 'activating' && active !== 'deactivating') return;
      await sleep(200);
    }
    spawnSync('systemctl', ['--user', 'stop', `${this.unit}.service`], { encoding: 'utf8' });
  }

  // Waits for the process to exit by itself (Ctrl+Q) and returns its journal exit status text.
  async waitExit(timeoutMs = 8000): Promise<boolean> {
    const deadline = Date.now() + timeoutMs;
    while (Date.now() < deadline) {
      const active = spawnSync('systemctl', ['--user', 'is-active', `${this.unit}.service`], { encoding: 'utf8' }).stdout.trim();
      if (active !== 'active' && active !== 'activating') return true;
      await sleep(150);
    }
    return false;
  }
}

// ---- pixels --------------------------------------------------------------------------------------------------------
type Image = { width: number; height: number; data: Buffer };
function load(png: string): Image {
  const size = execFileSync('magick', ['identify', '-format', '%wx%h', png], { encoding: 'utf8' }).split('x').map(Number);
  const data = execFileSync('magick', [png, '-alpha', 'off', '-depth', '8', 'rgb:-'], { maxBuffer: 512 * 1024 * 1024 });
  return { width: size[0], height: size[1], data };
}
const hexOf = (image: Image, x: number, y: number) => {
  const offset = (y * image.width + x) * 3;
  return '#' + [image.data[offset], image.data[offset + 1], image.data[offset + 2]].map((value) => value.toString(16).padStart(2, '0')).join('').toUpperCase();
};
type Box = { x: number; y: number; width: number; height: number };
// Bounding box and count of the pixels that differ between two images.
function diffBox(a: Image, b: Image): { count: number; box: Box | null } {
  let count = 0; let minX = 1e9; let minY = 1e9; let maxX = -1; let maxY = -1;
  const width = Math.min(a.width, b.width); const height = Math.min(a.height, b.height);
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const offsetA = (y * a.width + x) * 3; const offsetB = (y * b.width + x) * 3;
      if (a.data[offsetA] !== b.data[offsetB] || a.data[offsetA + 1] !== b.data[offsetB + 1] || a.data[offsetA + 2] !== b.data[offsetB + 2]) {
        count++; minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
      }
    }
  }
  return { count, box: maxX < 0 ? null : { x: minX, y: minY, width: maxX - minX + 1, height: maxY - minY + 1 } };
}
// Number of pixels of exactly `hex` inside the box.
function countColor(image: Image, box: Box, hex: string): number {
  let count = 0;
  for (let y = box.y; y < Math.min(image.height, box.y + box.height); y++) {
    for (let x = box.x; x < Math.min(image.width, box.x + box.width); x++) if (hexOf(image, x, y) === hex.toUpperCase()) count++;
  }
  return count;
}

// ---- scenarios -----------------------------------------------------------------------------------------------------
// Every check presses real keys through the nested compositor's control socket and reads the effect from the app's own
// ui_state log lines (and from pixels, files and the clipboard where the effect is not state).

const WIDE = { width: 1000, height: 800 };
const NARROW = { width: 443, height: 900 };

const UNFOLDED_ORDER = ['open-pill', 'folder-list', 'track-list', 'seek', 'previous', 'play', 'next', 'mode-group', 'search', 'settings'];
const FOLDED_ORDER = ['folder-trigger', 'open-pill', 'track-list', 'seek', 'previous', 'play', 'next', 'mode-group', 'search', 'settings'];

// Presses through `act`, then waits for a state line (newer than the press) that satisfies `predicate`.
async function press(session: Session, act: () => Promise<void>, predicate: (state: UiState) => boolean, what: string, timeoutMs = 6000): Promise<UiState> {
  const after = session.seq();
  await act();
  return await session.waitState(predicate, what, after, timeoutMs);
}

// Presses through `act` and proves nothing happened: no shortcut was used, and none of the watched fields moved.
async function noEffect(session: Session, act: () => Promise<void>, watch: (state: UiState) => unknown, what: string, settleMs = 500): Promise<void> {
  const before = session.last();
  const usedBefore = session.used();
  await act();
  await sleep(settleMs);
  const after = session.last();
  expect(session.used() === usedBefore, `${what}: the app reported using a shortcut (${session.used() - usedBefore} new "shortcut used" lines)`);
  expect(JSON.stringify(watch(before)) === JSON.stringify(watch(after)), `${what}: state changed from ${JSON.stringify(watch(before))} to ${JSON.stringify(watch(after))}`);
}

const nothingMoved = (state: UiState) => [state.route, state.current_index, state.playing, state.mode, state.folder, state.picker_open, state.menu_open];

// Taps Tab until the focus label equals `label`, at most `limit` times.
async function tabTo(session: Session, label: string, limit = 14): Promise<UiState> {
  for (let count = 0; count < limit; count++) {
    if (session.last().focus === label) return session.last();
    await press(session, () => session.tap('tab'), () => true, 'a state line after Tab', 3000).catch(() => undefined);
    await sleep(120);
  }
  expect(session.last().focus === label, `Tab never reached "${label}"; stopped on "${session.last().focus}"`);
  return session.last();
}

async function tabSequence(session: Session, expected: string[], key: () => Promise<void>): Promise<string> {
  const seen: string[] = [];
  for (const label of expected) {
    const state = await press(session, key, (candidate) => candidate.focus === label, `focus on "${label}"`);
    seen.push(state.focus);
  }
  return seen.join(' > ');
}

const near = (value: number, expected: number, tolerance: number) => Math.abs(value - expected) <= tolerance;

async function waitPosition(session: Session, expected: number, tolerance: number, what: string, after: number): Promise<UiState> {
  return await session.waitState((state) => near(state.position, expected, tolerance), `${what} (position near ${expected.toFixed(1)} s)`, after, 4000);
}

function readClipboard(display: string): string {
  const result = spawnSync('wl-paste', ['--no-newline'], { encoding: 'utf8', env: { ...process.env, WAYLAND_DISPLAY: display }, timeout: 4000 });
  return result.status === 0 ? result.stdout : `<wl-paste failed: ${result.stderr.trim()}>`;
}

// Writes the file-manager stub: the app's "Show in file manager" runs xdg-open, and this one records its arguments.
function writeFileManagerStub(binDir: string, record: string): void {
  mkdirSync(binDir, { recursive: true });
  const stub = join(binDir, 'xdg-open');
  writeFileSync(stub, `#!/usr/bin/env node\nrequire('node:fs').appendFileSync(${JSON.stringify(record)}, process.argv.slice(2).join(' ') + '\\n');\n`);
  chmodSync(stub, 0o755);
}

// ---- the wide session ----------------------------------------------------------------------------------------------
async function wideSession(base: string, library: string): Promise<void> {
  const record = join(base, 'xdg-open.record');
  writeFileSync(record, '');
  mkdirSync(join(base, 'bin'), { recursive: true });
  writeFileManagerStub(join(base, 'bin'), record);
  const session = await Session.start({ ...WIDE, scheme: 'dark', accent: '3B82F6', library, label: 'wide' }, base);
  try {
    await session.waitState((state) => state.folder !== '' && state.unfolded, 'the unfolded player page with its first folder', -1, 20000);
    session.findAppPid();
    currentGroup = 'start';
    await check('start/page', 'launch shows the player page, nothing playing, no ring', async () => {
      const state = session.last();
      expect(state.route === 'Player', `route ${state.route}`);
      expect(state.current_index === null && !state.playing, 'something plays at launch');
      expect(!state.ring_visible, 'a ring shows before any key');
      expect(session.appPid !== '', 'the app process was not found in its own unit');
      return `folder "${state.folder}", app pid ${session.appPid} in unit ${session.unit}`;
    });

    // ---- focus model ----
    currentGroup = 'focus';
    await check('focus/tab-order', 'Tab walks folder picker, track list, deck controls, search, settings, then wraps', async () => {
      const first = await tabSequence(session, [...UNFOLDED_ORDER, 'open-pill', 'folder-list', 'track-list'], () => session.tap('tab'));
      return first;
    });
    await check('focus/shift-tab', 'Shift+Tab walks the same order backwards, no trap', async () => {
      const back = await tabSequence(session, ['folder-list', 'open-pill', 'settings', 'search', 'mode-group'], () => session.chord(['shift'], 'tab'));
      return back;
    });
    await check('focus/ring-visible', 'a key press turns the ring on', async () => {
      expect(session.last().ring_visible, 'the ring is off after Tab');
    });
    await check('focus/ring-moves', 'the focus ring (2 px primary) moves with Tab: pixels differ between two focus positions', async () => {
      await tabTo(session, 'open-pill');
      const first = await session.shot('ring-open-pill');
      await press(session, () => session.tap('tab'), (state) => state.focus === 'folder-list', 'focus on the folder list');
      const second = await session.shot('ring-folder-list');
      const delta = diffBox(load(first), load(second));
      expect(delta.box !== null && delta.count > 40, `the two focus positions look the same (${delta.count} differing pixels)`);
      return `${delta.count} pixels differ, in ${JSON.stringify(delta.box)}`;
    });
    await check('focus/alt-1-2', 'Alt+1 and Alt+2 focus the folder list and the track list', async () => {
      await press(session, () => session.chord(['alt'], '2'), (state) => state.focus === 'track-list', 'Alt+2 to the track list');
      await press(session, () => session.chord(['alt'], '1'), (state) => state.focus === 'folder-list', 'Alt+1 to the folder list');
    });
    await check('focus/pointer-hides-ring', 'a pointer press turns the ring off', async () => {
      await press(session, () => session.click(100, 118), (state) => !state.ring_visible, 'the ring turning off after a click on a folder');
      await press(session, () => session.tap('tab'), (state) => state.ring_visible, 'the ring coming back on a key press');
    });

    // ---- playing ----
    currentGroup = 'playback';
    await check('play/enter-plays-row', 'Alt+2 then Enter plays the row under the ring', async () => {
      await press(session, () => session.chord(['alt'], '2'), (state) => state.focus === 'track-list', 'the track list');
      const ring = session.last().ring_track_title;
      const state = await press(session, () => session.tap('enter'), (candidate) => candidate.current_index !== null && candidate.playing, 'a playing track');
      return `ring on "${ring}", now playing index ${state.current_index}, duration ${state.duration.toFixed(0)} s`;
    });
    await check('audio/private-sink', 'playback goes to the private null sink (node id) and nowhere else', async () => {
      let detail = '';
      for (let attempt = 0; attempt < 30; attempt++) {
        const routing = routingOf(session.appPid);
        detail = routing.detail;
        if (routing.linked > 0) return `${detail}; sink node ${sinkNodeId}`;
        await sleep(300);
      }
      throw new Failure(`the app never linked to the private sink: ${detail}`);
    });
    await check('play/space-list', 'Space toggles play and pause in the track list', async () => {
      await press(session, () => session.tap('space'), (state) => !state.playing, 'pause');
      await press(session, () => session.tap('space'), (state) => state.playing, 'play');
    });
    await check('play/space-folder-list', 'Space toggles play and pause in the folder list', async () => {
      await press(session, () => session.chord(['alt'], '1'), (state) => state.focus === 'folder-list', 'the folder list');
      await press(session, () => session.tap('space'), (state) => !state.playing, 'pause');
      await press(session, () => session.tap('space'), (state) => state.playing, 'play');
    });
    await check('play/space-button', 'Space on the focused Play button presses it once', async () => {
      await tabTo(session, 'play');
      await press(session, () => session.tap('space'), (state) => !state.playing, 'pause');
      await sleep(600);
      expect(!session.last().playing, 'Space toggled twice');
      await press(session, () => session.tap('enter'), (state) => state.playing, 'play by Enter');
      await sleep(600);
      expect(session.last().playing, 'Enter toggled twice');
    });
    await check('mode/ctrl-shift-digits', 'Ctrl+Shift+1 to 4 pick Repeat, In order, Shuffle folder, Shuffle all', async () => {
      const seen: string[] = [];
      for (const [key, mode] of [['1', 0], ['2', 1], ['3', 2], ['4', 3]] as const) {
        const state = await press(session, () => session.chord(['ctrl', 'shift'], key), (candidate) => candidate.mode === mode, `mode ${mode}`);
        seen.push(`${key}->${state.mode}`);
      }
      await press(session, () => session.chord(['ctrl', 'shift'], '2'), (state) => state.mode === 1, 'in order again');
      return seen.join(' ');
    });
    await check('mode/ctrl-m', 'Ctrl+M cycles the mode through all four and wraps', async () => {
      const seen: number[] = [session.last().mode];
      for (let step = 0; step < 4; step++) {
        const expected = (seen[seen.length - 1] + 1) % 4;
        const state = await press(session, () => session.chord(['ctrl'], 'm'), (candidate) => candidate.mode === expected, `mode ${expected}`);
        seen.push(state.mode);
      }
      await press(session, () => session.chord(['ctrl', 'shift'], '2'), (state) => state.mode === 1, 'in order again');
      return seen.join(' > ');
    });
    await check('track/ctrl-right-left', 'Ctrl+Right is the next track and Ctrl+Left the previous', async () => {
      const start = session.last().current_index;
      expect(start !== null, 'nothing plays');
      const next = await press(session, () => session.chord(['ctrl'], 'right'), (state) => state.current_index === start! + 1, `track ${start! + 1}`);
      const previous = await press(session, () => session.chord(['ctrl'], 'left'), (state) => state.current_index === start, `track ${start} again`);
      return `${start} > ${next.current_index} > ${previous.current_index}`;
    });

    // ---- seeking (paused, so the position holds still) ----
    await press(session, () => session.tap('space'), (state) => !state.playing, 'pause for the seek checks');
    await press(session, () => session.chord(['ctrl'], 'home'), (state) => state.position < 1.5, 'start of the track');
    await check('seek/ctrl-home', 'Ctrl+Home restarts the track', async () => {
      await press(session, () => session.chord(['alt', 'shift'], 'right'), (state) => state.position > 50, 'a seek forward');
      const state = await press(session, () => session.chord(['ctrl'], 'home'), (candidate) => candidate.position < 1.5, 'the start');
      return `position ${state.position.toFixed(2)} s`;
    });
    const seekSteps: Array<[string, string[], string, number]> = [
      ['seek/alt-right', ['alt'], 'right', 10], ['seek/alt-shift-right', ['alt', 'shift'], 'right', 60],
      ['seek/alt-left', ['alt'], 'left', -10], ['seek/alt-shift-left', ['alt', 'shift'], 'left', -60],
    ];
    let expected = session.last().position;
    for (const [id, mods, key, delta] of seekSteps) {
      await check(id, `${mods.map((mod) => mod[0].toUpperCase() + mod.slice(1)).join('+')}+${key[0].toUpperCase()}${key.slice(1)} seeks ${delta > 0 ? '+' : ''}${delta} s`, async () => {
        expected += delta;
        const state = await press(session, () => session.chord(mods, key), (candidate) => near(candidate.position, expected, 1.5), `position near ${expected.toFixed(1)} s`);
        return `position ${state.position.toFixed(2)} s`;
      });
    }
    await check('seek/alt-right-held', 'a held Alt+Right keeps seeking (key repeat)', async () => {
      await press(session, () => session.chord(['ctrl'], 'home'), (state) => state.position < 1.5, 'the start');
      const before = session.last().position;
      await session.down('alt');
      await session.down('right');
      await sleep(900);
      await session.up('right');
      await session.up('alt');
      await sleep(300);
      const gained = session.last().position - before;
      expect(gained > 15, `only ${gained.toFixed(1)} s gained while held: no repeat reached the seek`);
      return `${gained.toFixed(1)} s gained in 0.9 s (each press is 10 s)`;
    });
    await check('seek/bar-arrows', 'a focused seek bar moves with Left and Right', async () => {
      await press(session, () => session.chord(['ctrl'], 'home'), (state) => state.position < 1.5, 'the start');
      await tabTo(session, 'seek');
      const base = session.last().position;
      const right = await press(session, () => session.tap('right'), (state) => state.position > base + 1, 'a step forward');
      const left = await press(session, () => session.tap('left'), (state) => state.position < right.position - 1, 'a step back');
      return `${base.toFixed(1)} > ${right.position.toFixed(1)} > ${left.position.toFixed(1)} s`;
    });
    await check('mode/group-arrows', 'a focused mode group moves with Left and Right', async () => {
      await tabTo(session, 'mode-group');
      const start = session.last().mode;
      const right = await press(session, () => session.tap('right'), (state) => state.mode !== start, 'a mode change');
      const back = await press(session, () => session.tap('left'), (state) => state.mode === start, 'back to the first mode');
      return `${start} > ${right.mode} > ${back.mode}`;
    });

    // ---- browsing ----
    currentGroup = 'browse';
    const firstFolder = session.last().folder;
    await check('browse/alt-down-up', 'Alt+Down and Alt+Up show the next and previous folder', async () => {
      const down = await press(session, () => session.chord(['alt'], 'down'), (state) => state.folder !== firstFolder, 'the next folder');
      const down2 = await press(session, () => session.chord(['alt'], 'down'), (state) => state.folder !== down.folder, 'the folder after');
      const up = await press(session, () => session.chord(['alt'], 'up'), (state) => state.folder === down.folder, 'back one folder');
      return `${firstFolder} > ${down.folder} > ${down2.folder} > ${up.folder}`;
    });
    await check('browse/ctrl-shift-g', 'Ctrl+Shift+G shows the folder of the playing track', async () => {
      const state = await press(session, () => session.chord(['ctrl', 'shift'], 'g'), (candidate) => candidate.folder === firstFolder, `folder "${firstFolder}"`);
      return `folder "${state.folder}"`;
    });
    await check('browse/ctrl-g', 'Ctrl+G shows the playing track', async () => {
      await press(session, () => session.chord(['alt'], 'down'), (state) => state.folder !== firstFolder, 'another folder');
      const before = session.used('reveal');
      await session.chord(['ctrl'], 'g');
      await sleep(500);
      expect(session.used('reveal') === before + 1, 'Ctrl+G was not used as Reveal');
      await press(session, () => session.chord(['ctrl', 'shift'], 'g'), (state) => state.folder === firstFolder, 'back to the playing folder');
    });
    await check('browse/ctrl-o', 'Ctrl+O puts the keyboard in the folder list (two-pane layout)', async () => {
      await press(session, () => session.chord(['alt'], '2'), (state) => state.focus === 'track-list', 'the track list');
      await press(session, () => session.chord(['ctrl'], 'o'), (state) => state.focus === 'folder-list', 'the folder list');
    });

    // ---- folder list keys ----
    currentGroup = 'folder-list';
    await press(session, () => session.chord(['alt'], '1'), (state) => state.focus === 'folder-list', 'the folder list');
    await check('folder-list/ring-start', 'the ring starts on the current folder', async () => {
      const state = session.last();
      expect(state.ring_folder === state.folder, `ring on ${state.ring_folder}, folder ${state.folder}`);
      return `ring on "${state.ring_folder}"`;
    });
    await check('folder-list/down-up-home-end', 'Down, Up, Home and End move the folder ring', async () => {
      const home = await press(session, () => session.tap('home'), (state) => state.ring_folder !== null, 'Home');
      const down = await press(session, () => session.tap('down'), (state) => state.ring_folder !== home.ring_folder, 'Down');
      const up = await press(session, () => session.tap('up'), (state) => state.ring_folder === home.ring_folder, 'Up');
      const end = await press(session, () => session.tap('end'), (state) => state.ring_folder !== home.ring_folder, 'End');
      return `Home ${home.ring_folder}, Down ${down.ring_folder}, Up ${up.ring_folder}, End ${end.ring_folder}`;
    });
    await check('folder-list/page-keys', 'PageUp and PageDown move the folder ring to the ends of a short list', async () => {
      await press(session, () => session.tap('pageup'), (state) => state.ring_folder === state.ring_folder, 'PageUp');
      const top = session.last().ring_folder;
      const bottom = await press(session, () => session.tap('pagedown'), (state) => state.ring_folder !== top, 'PageDown');
      return `PageUp ${top}, PageDown ${bottom.ring_folder}`;
    });
    await check('folder-list/letter', 'a letter jumps to the first folder starting with it', async () => {
      const state = await press(session, () => session.tap('z'), (candidate) => (candidate.ring_folder ?? '').toLowerCase().startsWith('z'), 'a folder starting with Z');
      return `ring on "${state.ring_folder}"`;
    });
    await check('folder-list/left-right', 'Left and Right also move the folder ring', async () => {
      const before = session.last().ring_folder;
      const left = await press(session, () => session.tap('left'), (state) => state.ring_folder !== before, 'Left');
      const right = await press(session, () => session.tap('right'), (state) => state.ring_folder === before, 'Right');
      return `${before} > ${left.ring_folder} > ${right.ring_folder}`;
    });
    await check('folder-list/enter', 'Enter shows the folder under the ring', async () => {
      const ring = session.last().ring_folder;
      const state = await press(session, () => session.tap('enter'), (candidate) => candidate.folder === ring, `folder "${ring}"`);
      expect(state.focus === 'folder-list', `focus left the folder list: ${state.focus}`);
      return `folder "${state.folder}"`;
    });

    // ---- track list keys, in the Zzz folder (the last, with the file that gets trashed) ----
    currentGroup = 'track-list';
    await press(session, () => session.tap('z'), (state) => (state.ring_folder ?? '').toLowerCase().startsWith('z'), 'Z folder');
    await press(session, () => session.tap('enter'), (state) => state.folder.startsWith('Zzz'), 'the Zzz folder');
    await press(session, () => session.chord(['alt'], '2'), (state) => state.focus === 'track-list', 'the track list');
    await check('track-list/keys', 'Down, Up, Home, End, PageUp and PageDown move the track ring', async () => {
      const home = await press(session, () => session.tap('home'), (state) => state.ring_track_title !== null, 'Home');
      const down = await press(session, () => session.tap('down'), (state) => state.ring_track !== home.ring_track, 'Down');
      const up = await press(session, () => session.tap('up'), (state) => state.ring_track === home.ring_track, 'Up');
      const end = await press(session, () => session.tap('end'), (state) => state.ring_track !== home.ring_track, 'End');
      const pageUp = await press(session, () => session.tap('pageup'), (state) => state.ring_track === home.ring_track, 'PageUp');
      const pageDown = await press(session, () => session.tap('pagedown'), (state) => state.ring_track === end.ring_track, 'PageDown');
      return `Home "${home.ring_track_title}", Down "${down.ring_track_title}", Up "${up.ring_track_title}", End "${end.ring_track_title}", PageUp "${pageUp.ring_track_title}", PageDown "${pageDown.ring_track_title}"`;
    });
    await check('track-list/enter-plays', 'Enter on a row plays it, and on the playing row pauses it', async () => {
      await press(session, () => session.tap('home'), (state) => state.ring_track_title !== null, 'Home');
      const ring = session.last().ring_track;
      const playing = await press(session, () => session.tap('enter'), (state) => state.current_index === ring && state.playing, 'the row playing');
      const paused = await press(session, () => session.tap('enter'), (state) => !state.playing, 'a pause');
      return `index ${playing.current_index} played, then ${paused.playing ? 'playing' : 'paused'}`;
    });

    // ---- row chords ----
    currentGroup = 'row';
    await press(session, () => session.tap('down'), (state) => state.ring_track_title !== null && state.ring_track_title.includes('Trash me'), 'the ring on the file to trash');
    const trashFile = join(library, 'Zzz Tones', '99 Trash me.wav');
    await check('row/ctrl-shift-c', 'Ctrl+Shift+C copies the file name of the row under the ring to the clipboard', async () => {
      await session.chord(['ctrl', 'shift'], 'c');
      await sleep(700);
      const display = session.waylandDisplay();
      expect(display !== '', 'the nested Wayland display name is unknown');
      const text = readClipboard(display);
      expect(text.includes('99 Trash me'), `the clipboard holds ${JSON.stringify(text)}`);
      return `clipboard of ${display}: ${JSON.stringify(text)}`;
    });
    await check('row/ctrl-shift-e', 'Ctrl+Shift+E opens the file manager on the folder of the row', async () => {
      await session.chord(['ctrl', 'shift'], 'e');
      let recorded = '';
      for (let attempt = 0; attempt < 20 && recorded === ''; attempt++) { await sleep(200); recorded = readFileSync(record, 'utf8'); }
      expect(recorded.includes('Zzz Tones'), `the file manager stub was asked for ${JSON.stringify(recorded)}`);
      return `xdg-open ${recorded.trim()}`;
    });
    await check('row/alt-enter', 'Alt+Enter shows the details notice of the row', async () => {
      const before = await session.shot('before-details');
      const used = session.used('row-details');
      await session.chord(['alt'], 'enter');
      await sleep(700);
      expect(session.used('row-details') === used + 1, 'Alt+Enter was not used as the details action');
      const after = await session.shot('details-notice');
      const delta = diffBox(load(before), load(after));
      expect(delta.count > 200, `no notice appeared (${delta.count} pixels differ)`);
      return `${delta.count} pixels changed, in ${JSON.stringify(delta.box)}`;
    });
    await check('row/menu-keys', 'in the open track menu Down, Up, Enter and Escape work (menu opened by right click)', async () => {
      await session.click(700, 80, 'right');
      const open = await session.waitState((state) => state.menu_open, 'the track menu opening', -1, 4000);
      const down = await press(session, () => session.tap('down'), (state) => state.menu_ring !== null, 'Down in the menu');
      const down2 = await press(session, () => session.tap('down'), (state) => state.menu_ring === down.menu_ring! + 1, 'Down again');
      const up = await press(session, () => session.tap('up'), (state) => state.menu_ring === down.menu_ring, 'Up');
      const closed = await press(session, () => session.tap('escape'), (state) => !state.menu_open, 'Escape closing the menu');
      expect(closed.route === 'Player', `Escape left the page: ${closed.route}`);
      await session.click(700, 80, 'right');
      await session.waitState((state) => state.menu_open, 'the menu reopening', closed.seq, 4000);
      await press(session, () => session.tap('down'), (state) => state.menu_ring !== null, 'Down');
      const first = session.last().menu_ring;
      const chosen = await press(session, () => session.tap('enter'), (state) => !state.menu_open, 'Enter running a row');
      return `menu_ring ${open.menu_ring} > ${down.menu_ring} > ${down2.menu_ring} > ${up.menu_ring}; Enter ran row ${first}; closed (index ${chosen.current_index})`;
    });
    await check('row/delete', 'Delete moves the file of the row to the trash (scratch XDG trash), with an Undo message', async () => {
      await press(session, () => session.chord(['alt'], '2'), (state) => state.focus === 'track-list', 'the track list');
      await press(session, () => session.tap('end'), (state) => state.ring_track_title !== null, 'End');
      expect(session.last().ring_track_title?.includes('Trash me') === true, `the ring is on ${session.last().ring_track_title}`);
      expect(existsSync(trashFile), 'the file to trash is missing before the key');
      await session.tap('delete');
      let gone = false;
      for (let attempt = 0; attempt < 25 && !gone; attempt++) { await sleep(200); gone = !existsSync(trashFile); }
      expect(gone, 'the file is still in the library after Delete');
      const trashed = join(session.xdg, 'data', 'Trash', 'files', '99 Trash me.wav');
      expect(existsSync(trashed), `the file is not in the scratch trash at ${trashed}`);
      await sleep(400);
      await session.shot('after-delete');
      return `moved to ${trashed}`;
    });
    skip('row/menu-key', 'the Menu key opens the row menu', 'the compositor 0.3.0 cannot inject it: "key menu tap" answers "err unknown key: menu"; the window tests press it');
    skip('row/shift-f10', 'Shift+F10 opens the row menu', 'the compositor 0.3.0 cannot inject F10: "key f10 tap" answers "err unknown key: f10"; the window tests press it');
    skip('row/ctrl-shift-f5', 'Ctrl+Shift+F5 re-analyses the row', 'the compositor 0.3.0 cannot inject F5: "key f5 tap" answers "err unknown key: f5"; the window tests press it');
    skip('browse/f5', 'F5 rescans the library', 'the compositor 0.3.0 cannot inject F5: "key f5 tap" answers "err unknown key: f5"; the window tests press it');

    // ---- tooltips ----
    currentGroup = 'tooltip';
    await check('tooltip/search-shows-shortcut', 'hovering the Search button shows a tooltip that names Ctrl+F', async () => {
      const plain = load(await session.shot('tooltip-before'));
      await session.ok('move 911 28');
      await sleep(1800);
      const file = join(session.shots, `${session.opts.label}-tooltip-search.png`);
      await session.ok(`screenshot ${file}`);
      const delta = diffBox(plain, load(file));
      expect(delta.box !== null && delta.box.width > 60 && delta.count > 300, `no tooltip-sized change appeared (${delta.count} pixels, ${JSON.stringify(delta.box)})`);
      await session.ok('move 2 2');
      return `${delta.count} pixels changed, in ${JSON.stringify(delta.box)}; the text is in ${file}`;
    });

    // ---- search ----
    currentGroup = 'search';
    await check('search/ctrl-f', 'Ctrl+F opens Search with the query field focused', async () => {
      await press(session, () => session.chord(['alt'], '1'), (state) => state.focus === 'folder-list', 'the folder list');
      const state = await press(session, () => session.chord(['ctrl'], 'f'), (candidate) => candidate.route === 'Search' && candidate.zone === 'text-field', 'the Search page with the query field focused');
      return `focus ${state.focus}`;
    });
    await check('search/bare-keys-are-text', 'bare keys do nothing as shortcuts in the Search field, and typing works', async () => {
      const playingBefore = session.last().playing;
      await noEffect(session, async () => {
        await session.tap('space');
        await session.tap('home');
        await session.tap('end');
        await session.tap('delete');
        await session.tap('left');
        await session.tap('right');
        await session.chord(['ctrl'], 'left');
        await session.chord(['ctrl'], 'right');
        await session.chord(['ctrl'], 'm');
        await session.chord(['ctrl'], 'home');
        await session.chord(['ctrl', 'shift'], '3');
      }, (state) => [state.route, state.current_index, state.playing, state.mode], 'bare keys in the Search field');
      expect(session.last().playing === playingBefore, 'playback changed');
      await press(session, () => session.type('tone'), (state) => state.search_query.includes('tone'), 'the typed query');
      return `query "${session.last().search_query}"`;
    });
    await check('search/down-up-enter', 'Down and Up move through results, Enter opens one and leaves Search', async () => {
      const first = await session.waitState((state) => state.search_ring !== null, 'a highlighted result', -1, 8000);
      const down = await press(session, () => session.tap('down'), (state) => state.search_ring !== null && state.search_ring > (first.search_ring ?? -1), 'Down');
      const up = await press(session, () => session.tap('up'), (state) => state.search_ring === first.search_ring, 'Up');
      const opened = await press(session, () => session.tap('enter'), (state) => state.route === 'Player' && state.current_index !== null, 'the result opened');
      return `ring ${first.search_ring} > ${down.search_ring} > ${up.search_ring}; opened index ${opened.current_index}`;
    });
    await check('search/escape', 'Escape leaves Search', async () => {
      await press(session, () => session.chord(['ctrl'], 'f'), (state) => state.route === 'Search', 'Search');
      await press(session, () => session.tap('escape'), (state) => state.route === 'Player', 'the player page');
    });

    // ---- double Shift ----
    currentGroup = 'double-shift';
    await press(session, () => session.chord(['alt'], '2'), (state) => state.focus === 'track-list', 'the track list');
    await check('double-shift/opens-search', 'two quick Shift taps open Search on the player page', async () => {
      await session.tap('shift');
      await sleep(120);
      await session.tap('shift');
      await session.waitState((state) => state.route === 'Search', 'Search opening', -1, 3000);
      await press(session, () => session.tap('escape'), (state) => state.route === 'Player', 'the player page');
    });
    await check('double-shift/slow', 'two slow Shift taps (600 ms apart) do nothing', async () => {
      await noEffect(session, async () => { await session.tap('shift'); await sleep(600); await session.tap('shift'); }, nothingMoved, 'slow double Shift', 700);
    });
    await check('double-shift/interrupted', 'a key between the Shift taps cancels the double tap', async () => {
      await noEffect(session, async () => { await session.tap('shift'); await sleep(60); await session.tap('x'); await sleep(60); await session.tap('shift'); }, nothingMoved, 'interrupted double Shift', 700);
    });
    await check('double-shift/with-key', 'Shift held with another key is not a tap', async () => {
      await noEffect(session, async () => {
        await session.down('shift'); await session.tap('x'); await session.up('shift');
        await sleep(60);
        await session.tap('shift');
      }, nothingMoved, 'Shift with another key', 700);
    });
    skip('double-shift/repeat', 'a held Shift with repeats is not a double tap', 'modifier keys send no repeat events through the compositor, so this case cannot be produced here; the pure detector test covers it');

    // ---- Settings ----
    currentGroup = 'settings';
    await check('settings/ctrl-alt-s', 'Ctrl+Alt+S opens Settings with the list focused', async () => {
      const state = await press(session, () => session.chord(['ctrl', 'alt'], 's'), (candidate) => candidate.route === 'Settings', 'Settings');
      return `focus ${state.focus}`;
    });
    await check('settings/ctrl-f-nothing', 'Ctrl+F does nothing in Settings', async () => {
      await noEffect(session, () => session.chord(['ctrl'], 'f'), nothingMoved, 'Ctrl+F in Settings');
    });
    await check('settings/double-shift-nothing', 'double Shift does nothing in Settings', async () => {
      await noEffect(session, async () => { await session.tap('shift'); await sleep(120); await session.tap('shift'); }, nothingMoved, 'double Shift in Settings', 700);
    });
    await check('settings/escape-ladder', 'template field: the first Escape returns to the list row, the second closes Settings; bare keys do nothing in the field', async () => {
      let reached = false;
      for (let count = 0; count < 12 && !reached; count++) {
        await session.tap('tab');
        await sleep(150);
        reached = session.last().zone === 'text-field';
      }
      expect(reached, `Tab never reached a text field in Settings; stopped on ${session.last().focus} (${session.last().zone})`);
      const field = session.last().focus;
      await noEffect(session, async () => {
        await session.tap('space');
        await session.tap('delete');
        await session.tap('home');
        await session.chord(['ctrl'], 'm');
        await session.chord(['ctrl'], 'left');
      }, (state) => [state.route, state.current_index, state.playing, state.mode], 'bare keys in the template field');
      const first = await press(session, () => session.tap('escape'), (state) => state.zone === 'settings-list' || state.focus !== field, 'the first Escape');
      expect(first.route === 'Settings', `the first Escape left Settings: ${first.route}`);
      const second = await press(session, () => session.tap('escape'), (state) => state.route === 'Player', 'the second Escape');
      return `field "${field}" > "${first.focus}" (${first.zone}) > page ${second.route}`;
    });
    await check('settings/screens-after', 'the player page is back with focus restored for keys', async () => {
      await press(session, () => session.chord(['alt'], '2'), (state) => state.focus === 'track-list', 'the track list');
    });

    // ---- badges ----
    currentGroup = 'badges';
    await check('badges/after-300ms', 'Ctrl held: no badge before 300 ms, badges after, gone on release', async () => {
      // A playing track moves the time text, which would differ between two screenshots for another reason.
      if (session.last().playing) await press(session, () => session.tap('space'), (state) => !state.playing, 'pause');
      await sleep(400);
      const clean = await session.shot('badges-none');
      const after = session.seq();
      const pressedAt = Date.now();
      await session.down('ctrl');
      await sleep(150);
      expect(session.last().badges.length === 0, `badges at 150 ms: ${session.last().badges.join(',')}`);
      const shown = await session.waitState((state) => state.badges.length > 0, 'the badges appearing', after, 2000);
      const elapsed = Date.now() - pressedAt;
      expect(elapsed >= 250, `the badges appeared after only ${elapsed} ms`);
      const withBadges = await session.shot('badges-ctrl');
      await session.up('ctrl');
      const gone = await session.waitState((state) => state.badges.length === 0, 'the badges going away', shown.seq, 2000);
      await sleep(300);
      const released = await session.shot('badges-released');
      const delta = diffBox(load(clean), load(withBadges));
      const after2 = diffBox(load(clean), load(released));
      expect(delta.count > 100, `no badge pixels (${delta.count})`);
      expect(after2.count === 0, `${after2.count} pixels still differ after release, in ${JSON.stringify(after2.box)}`);
      return `shown at about ${elapsed} ms with [${shown.badges.join(', ')}]; ${delta.count} pixels differ with badges, 0 after release; badges ${gone.badges.length}`;
    });
    await check('badges/narrow-with-shift', 'adding Shift narrows the badges to the Ctrl+Shift chords; releasing Shift brings the Ctrl badges back', async () => {
      await session.down('ctrl');
      const plain = await session.waitState((state) => state.badges.length > 0, 'Ctrl badges', session.seq(), 2000);
      const narrowed = await press(session, () => session.down('shift'), (state) => state.badges.some((entry) => entry.startsWith('mode-repeat')), 'Ctrl+Shift badges');
      expect(!narrowed.badges.some((entry) => entry.startsWith('search=')), 'the plain Ctrl badge for Search is still shown with Shift held');
      await session.shot('badges-ctrl-shift');
      const back = await press(session, () => session.up('shift'), (state) => state.badges.some((entry) => entry.startsWith('search=')), 'Ctrl badges again');
      await session.up('ctrl');
      await session.waitState((state) => state.badges.length === 0, 'the badges going away', back.seq, 2000);
      return `Ctrl [${plain.badges.join(', ')}] > Ctrl+Shift [${narrowed.badges.join(', ')}]`;
    });
    await check('badges/alt', 'Alt held shows the seek and focus badges', async () => {
      await session.down('alt');
      const state = await session.waitState((candidate) => candidate.badges.some((entry) => entry.startsWith('seek-back')), 'Alt badges', session.seq(), 2000);
      await session.up('alt');
      await session.waitState((candidate) => candidate.badges.length === 0, 'the badges going away', state.seq, 2000);
      return `[${state.badges.join(', ')}]`;
    });
    await check('badges/quick-chord', 'a quick chord (under 300 ms) never flashes the badges', async () => {
      const after = session.seq();
      await session.chord(['ctrl'], 'o');
      await sleep(700);
      const flashed = session.states.filter((state) => state.seq > after && state.badges.length > 0);
      expect(flashed.length === 0, `badges flashed: ${flashed.map((state) => state.badges.join(',')).join(' | ')}`);
    });
    await check('badges/no-pointer-input', 'badges never take pointer input: a click through a shown badge reaches the control beneath', async () => {
      await press(session, () => session.chord(['alt'], '2'), (state) => state.focus === 'track-list', 'the track list');
      await session.down('ctrl');
      await session.waitState((state) => state.badges.length > 0, 'the badges', session.seq(), 2000);
      // The Search button is at the top right; its badge sits on it. Clicking there must open Search.
      await press(session, () => session.click(911, 28), (state) => state.route === 'Search', 'Search opening from a click through its badge');
      await session.up('ctrl');
      await press(session, () => session.tap('escape'), (state) => state.route === 'Player', 'the player page');
    });
  } finally {
    await session.stop();
  }
}

// ---- the narrow (folded) session -----------------------------------------------------------------------------------
async function narrowSession(base: string, library: string): Promise<void> {
  const session = await Session.start({ ...NARROW, scheme: 'light', accent: 'E91E63', library, label: 'narrow' }, base);
  try {
    await session.waitState((state) => state.folder !== '' && !state.unfolded, 'the folded player page', -1, 20000);
    currentGroup = 'folded';
    await check('folded/tab-order', 'folded layout: Tab walks the folder trigger and Open, the track list, the deck, search, settings', async () => {
      return await tabSequence(session, FOLDED_ORDER, () => session.tap('tab'));
    });
    await check('folded/alt-1-opens-picker', 'Alt+1 opens the folder picker overlay and focuses its list', async () => {
      const state = await press(session, () => session.chord(['alt'], '1'), (candidate) => candidate.picker_open && candidate.focus === 'folder-list', 'the picker with focus');
      return `picker_open ${state.picker_open}, focus ${state.focus}`;
    });
    await check('folded/escape-closes-picker', 'Escape closes the picker overlay and focuses the track list, without leaving the page', async () => {
      const state = await press(session, () => session.tap('escape'), (candidate) => !candidate.picker_open && candidate.focus === 'track-list', 'the picker closing');
      expect(state.route === 'Player', `route ${state.route}`);
    });
    await check('folded/ctrl-o-toggles', 'Ctrl+O opens the picker and Ctrl+O closes it', async () => {
      await press(session, () => session.chord(['ctrl'], 'o'), (state) => state.picker_open && state.focus === 'folder-list', 'the picker');
      await press(session, () => session.chord(['ctrl'], 'o'), (state) => !state.picker_open, 'the picker closing');
    });
    await check('folded/alt-2-closes-picker', 'Alt+2 closes the picker and focuses the track list', async () => {
      await press(session, () => session.chord(['alt'], '1'), (state) => state.picker_open, 'the picker');
      await press(session, () => session.chord(['alt'], '2'), (state) => !state.picker_open && state.focus === 'track-list', 'the track list');
    });
    await check('folded/escape-on-player', 'Escape on the player page with nothing open does nothing', async () => {
      await noEffect(session, () => session.tap('escape'), nothingMoved, 'Escape on the player page');
    });
    await check('folded/picker-enter-focuses-tracks', 'Enter on a folder in the picker shows it and moves the keyboard to the track list', async () => {
      await press(session, () => session.chord(['alt'], '1'), (state) => state.picker_open && state.focus === 'folder-list', 'the picker');
      const start = session.last().folder;
      const down = await press(session, () => session.tap('down'), (state) => state.ring_folder !== null && state.ring_folder !== start, 'Down');
      const state = await press(session, () => session.tap('enter'), (candidate) => !candidate.picker_open && candidate.focus === 'track-list', 'the picker closing on Enter');
      expect(state.folder === down.ring_folder, `folder ${state.folder}, ring was ${down.ring_folder}`);
      return `${start} > ${state.folder}`;
    });
    currentGroup = 'editor-page';
    await check('editor-page/enter-and-escape', 'Settings list Enter opens the editor page; Escape returns to the Settings list; Escape leaves Settings', async () => {
      await press(session, () => session.chord(['ctrl', 'alt'], 's'), (state) => state.route === 'Settings', 'Settings');
      const editor = await press(session, () => session.tap('enter'), (state) => state.route === 'TemplateEditor', 'the editor page');
      await noEffect(session, async () => { await session.chord(['ctrl'], 'f'); }, nothingMoved, 'Ctrl+F on the editor page');
      await noEffect(session, async () => { await session.tap('shift'); await sleep(120); await session.tap('shift'); }, nothingMoved, 'double Shift on the editor page', 700);
      const back = await press(session, () => session.tap('escape'), (state) => state.route === 'Settings', 'Escape to the Settings list');
      const left = await press(session, () => session.tap('escape'), (state) => state.route === 'Player', 'Escape leaving Settings');
      return `${editor.route} (focus ${editor.focus}) > ${back.route} (focus ${back.focus}) > ${left.route}`;
    });
    await check('editor-page/ctrl-enter', 'Ctrl+Enter applies the template and returns to the Settings list', async () => {
      await press(session, () => session.chord(['ctrl', 'alt'], 's'), (state) => state.route === 'Settings', 'Settings');
      await press(session, () => session.tap('enter'), (state) => state.route === 'TemplateEditor', 'the editor page');
      await press(session, () => session.chord(['ctrl'], 'enter'), (state) => state.route === 'Settings', 'the Settings list');
      await press(session, () => session.tap('escape'), (state) => state.route === 'Player', 'the player page');
    });
  } finally {
    await session.stop();
  }
}

// ---- Ctrl+Shift+O, in a session of its own -------------------------------------------------------------------------
// The system folder dialog is a window of its own. The nested compositor does not hand keyboard focus back to the player
// window after that dialog closes (probed: after Escape closed it and after a click on the player, no key reached the
// app), so no later key could be pressed in the same session.
async function dialogSession(base: string, library: string): Promise<void> {
  const session = await Session.start({ ...WIDE, scheme: 'dark', accent: '3B82F6', library, label: 'dialog' }, base);
  try {
    await session.waitState((state) => state.folder !== '' && state.unfolded, 'the unfolded player page', -1, 20000);
    currentGroup = 'dialog';
    await check('browse/ctrl-shift-o', 'Ctrl+Shift+O opens the system folder dialog', async () => {
      const before = load(await session.shot('dialog-before'));
      const used = session.used('open-folder-dialog');
      await session.chord(['ctrl', 'shift'], 'o');
      let delta = { count: 0, box: null as Box | null };
      for (let attempt = 0; attempt < 20 && delta.count < before.width * before.height * 0.3; attempt++) {
        await sleep(300);
        delta = diffBox(before, load(await session.shot('dialog-open')));
      }
      expect(session.used('open-folder-dialog') === used + 1, 'the app did not use Ctrl+Shift+O as the folder dialog request');
      expect(delta.count > before.width * before.height * 0.3, `no dialog window covered the player (${delta.count} pixels differ)`);
      await session.tap('escape');
      await sleep(800);
      const closed = diffBox(before, load(await session.shot('dialog-closed')));
      expect(closed.count < before.width * before.height * 0.01, `the dialog is still showing after Escape (${closed.count} pixels differ)`);
      return `a dialog covered ${delta.count} pixels, and Escape closed it`;
    });
  } finally {
    await session.stop();
  }
}

// ---- Ctrl+Q, in a session of its own -------------------------------------------------------------------------------
async function quitSession(base: string, library: string): Promise<void> {
  const session = await Session.start({ ...WIDE, scheme: 'dark', accent: '3B82F6', library, label: 'quit' }, base);
  try {
    await session.waitState((state) => state.folder !== '', 'the player page', -1, 20000);
    currentGroup = 'quit';
    await check('quit/ctrl-q', 'Ctrl+Q quits the app', async () => {
      const pid = session.findAppPid();
      expect(pid !== '', 'the app process was not found');
      await session.chord(['ctrl'], 'q');
      let gone = false;
      for (let attempt = 0; attempt < 40 && !gone; attempt++) { await sleep(200); gone = !existsSync(`/proc/${pid}`); }
      expect(gone, `the app process ${pid} is still running after Ctrl+Q`);
      return `process ${pid} ended`;
    });
  } finally {
    await session.stop();
  }
}

// ---- screenshots: focus ring and badges, light and dark, two accents -----------------------------------------------
async function visualSession(base: string, library: string, scheme: 'dark' | 'light', accent: string): Promise<void> {
  const label = `visual-${scheme}-${accent}`;
  const session = await Session.start({ ...WIDE, scheme, accent, library, label }, base);
  try {
    await session.waitState((state) => state.folder !== '', 'the player page', -1, 20000);
    currentGroup = 'visual';
    await check(`visual/${scheme}-${accent}`, `focus ring and badges in ${scheme} with accent #${accent}: ring and badges draw, and are gone after release`, async () => {
      const plain = await session.shot('1-plain');
      await tabTo(session, 'play');
      const ring = await session.shot('2-ring-play');
      await press(session, () => session.chord(['alt'], '2'), (state) => state.focus === 'track-list', 'the track list');
      await session.shot('3-ring-track-list');
      await session.down('ctrl');
      await session.waitState((state) => state.badges.length > 0, 'the badges', session.seq(), 2000);
      await session.shot('4-badges-ctrl');
      await session.down('shift');
      await sleep(500);
      await session.shot('5-badges-ctrl-shift');
      await session.up('shift');
      await session.up('ctrl');
      await sleep(600);
      expect(session.last().badges.length === 0, `badges still showing after release: ${session.last().badges.join(', ')}`);
      const ringDelta = diffBox(load(plain), load(ring));
      expect(ringDelta.count > 40, `the ring did not draw (${ringDelta.count} pixels)`);
      return `ring pixels ${ringDelta.count} in ${JSON.stringify(ringDelta.box)}; shots in ${session.shots}/${label}-*.png`;
    });
  } finally {
    await session.stop();
  }
}

// ---- main ----------------------------------------------------------------------------------------------------------
async function main(): Promise<void> {
  expect(existsSync(releaseBinary), `the release binary ${releaseBinary} does not exist; the task builds it first`);
  expect(spawnSync('pw-dump', [], { encoding: 'utf8' }).status === 0, 'PipeWire is not reachable');
  const running = spawnSync('systemctl', ['--user', 'list-units', 'music-player-e2e-*', '--state=active,activating', '--no-legend', '--plain'], { encoding: 'utf8' }).stdout.trim();
  expect(running === '', `another end-to-end run is active, and this one must run alone:\n${running}`);
  mkdirSync(scratchRoot, { recursive: true, mode: 0o700 });
  chmodSync(scratchRoot, 0o700);
  mkdirSync(outputRoot, { recursive: true });
  const base = mkdtempSync(join(scratchRoot, 'run-'));
  const startedAt = Date.now();
  const { library } = buildLibrary(base);
  // The trash check needs the library and the scratch XDG data on one filesystem, or the trash crate would use the
  // mount's own trash directory instead of the scratch one.
  const libraryDevice = statSync(library).dev;
  expect(libraryDevice === statSync(base).dev, 'the library and the scratch directory are on different filesystems');
  createSink();
  console.log(`private null sink ${sinkName} is node ${sinkNodeId}; scratch ${base}`);
  try {
    if (only === '' || ['start', 'focus', 'playback', 'browse', 'folder-list', 'track-list', 'row', 'search', 'double-shift', 'settings', 'badges', 'play', 'mode', 'seek', 'audio', 'track'].some((name) => only.startsWith(name))) await wideSession(base, library);
    if (only === '' || ['folded', 'editor-page'].some((name) => only.startsWith(name))) await narrowSession(base, library);
    if (only === '' || only.startsWith('dialog') || only === 'browse/ctrl-shift-o') await dialogSession(base, library);
    if (only === '' || only.startsWith('quit')) await quitSession(base, library);
    if (only === '' || only.startsWith('visual')) {
      for (const [scheme, accent] of [['dark', '3B82F6'], ['dark', '22C55E'], ['light', '3B82F6'], ['light', '22C55E']] as const) await visualSession(base, library, scheme, accent);
    }
  } finally {
    destroySink();
  }
  const failed = outcomes.filter((outcome) => !outcome.ok);
  const skipped = outcomes.filter((outcome) => outcome.skipped);
  const passed = outcomes.filter((outcome) => outcome.ok && !outcome.skipped);
  console.log('\n==== per-shortcut results ====');
  for (const outcome of outcomes) console.log(`${outcome.skipped ? 'SKIP' : outcome.ok ? 'PASS' : 'FAIL'}  ${outcome.id.padEnd(34)} ${outcome.title}`);
  console.log(`\n${passed.length} passed, ${failed.length} failed, ${skipped.length} not injectable; ${((Date.now() - startedAt) / 1000).toFixed(1)} s`);
  writeFileSync(join(outputRoot, 'e2e-summary.json'), JSON.stringify({ startedAt, seconds: (Date.now() - startedAt) / 1000, passed: passed.length, failed: failed.length, skipped: skipped.length, outcomes }, null, 2));
  rmSync(base, { recursive: true, force: true });
  if (failed.length > 0) {
    for (const outcome of failed) console.error(`FAILED ${outcome.id}: ${outcome.detail}`);
    process.exitCode = 1;
  }
}

await main();
'''

[tasks.screenshot]
description = "Render ui/app.slint to target/app.slint.png HEADLESS; set SLINT_SCREENSHOT_WIDTH/HEIGHT for responsive snapshots"
# --screenshot installs slint-viewer's own offscreen platform; SLINT_BACKEND=software
# pins the software renderer for a deterministic frame. This renders the MARKUP with
# default property values only (no engine/model data); drive the running app via the
# `mcp` task's take_screenshot for real-data snapshots. Optional dimensions create a
# gitignored derived source so the actual component defaults remain unchanged.
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { mkdirSync, readFileSync, writeFileSync } = await import('node:fs')
mkdirSync('target', { recursive: true })
const widthText = process.env.SLINT_SCREENSHOT_WIDTH
const heightText = process.env.SLINT_SCREENSHOT_HEIGHT
const customSize = widthText !== undefined || heightText !== undefined
const width = Number(widthText ?? '480')
const height = Number(heightText ?? '600')
if (!Number.isFinite(width) || width < 360 || !Number.isFinite(height) || height <= 0) {
  throw new Error(`Invalid Slint screenshot size: ${width}x${height}`)
}
const sourcePath = customSize ? 'target/app.screenshot.slint' : 'ui/app.slint'
if (customSize) {
  const source = readFileSync('ui/app.slint', 'utf8')
  const withWidth = source.replace('preferred-width: 480px;', `preferred-width: ${width}px;`)
  if (withWidth === source) { throw new Error('AppWindow preferred-width anchor not found') }
  const sizedSource = withWidth.replace('preferred-height: 600px;', `preferred-height: ${height}px;`)
  if (sizedSource === withWidth) { throw new Error('AppWindow preferred-height anchor not found') }
  writeFileSync(sourcePath, sizedSource)
}
execFileSync('slint-viewer', ['--screenshot', 'target/app.slint.png', sourcePath], { stdio: 'inherit', env: { ...process.env, SLINT_BACKEND: 'software' } })
console.error(`rendered ${sourcePath} at ${width}x${height} -> target/app.slint.png`)
"""

