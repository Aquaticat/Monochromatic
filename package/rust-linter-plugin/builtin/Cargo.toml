[package]
name = "monochromatic-rust-linter-plugin-builtin"
version = "0.1.0"
authors = ["Aquaticat"]
categories = ["development-tools"]
documentation = "https://docs.rs/monochromatic-rust-linter-plugin-builtin"
edition = "2024"
homepage = "https://github.com/Aquaticat/Monochromatic/tree/main/package/rust-linter-plugin/builtin"
include = [
  "src/**/*.rs",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSES/*.txt",
]
keywords = ["lint", "linter", "rust", "max-lines", "rustdoc"]
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticat/Monochromatic.git"
description = "The rules monochromatic-rust-linter ships with: max-lines, require-rustdoc, and the declarative pattern rule driver."

[lints.clippy]
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"

[lib]
name = "monochromatic_rust_linter_plugin_builtin"
path = "src/lib.rs"

[dependencies]
# The shared foundation. This package depends on it and on NOTHING else from
# the linter: that is the whole point of the split, and it is what proves a rule
# package can be written without depending on the binary that runs it.
monochromatic-rust-linter-core = { path = "../../rust-module/rust-linter-core", version = "0.1.0" }

# Structural matching, for the declarative pattern rule driver.
monochromatic-rust-linter-pattern = { path = "../../rust-module/rust-linter-pattern", version = "0.1.0" }

# Pinned to EXACTLY the version the other crates pin, because all of them pass
# `SyntaxNode` values across their boundaries.
ra_ap_syntax = "=0.0.335"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]
