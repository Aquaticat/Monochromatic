[tasks."inspect:clipboard"]
description = "Verify nested clipboard text, binary data, replacement, and clearing without host clipboard access"
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const client = async () => {
  const { spawn, spawnSync } = await import('node:child_process')
  const { once } = await import('node:events')
  const { setTimeout: wait } = await import('node:timers/promises')
  const { default: assert } = await import('node:assert/strict')
  assert(process.env.WAYLAND_DISPLAY)
  assert.notEqual(process.env.WAYLAND_DISPLAY, process.argv[1])
  assert.equal(process.env.WAYLAND_SOCKET, undefined)
  assert.equal(process.env.DISPLAY, undefined)
  assert.equal(process.env.XAUTHORITY, undefined)
  const primary = spawnSync('wl-paste', ['--primary', '--list-types'], { timeout: 1000 })
  assert.equal(primary.status, 1)
  assert.match(primary.stderr.toString(), /does not seem to support primary selection/)
  const fixtures = [
    { mime: 'text/plain;charset=utf-8', bytes: Buffer.from('Nested clipboard: 猫 é') },
    { mime: 'application/octet-stream', bytes: Buffer.from([0, 1, 127, 128, 255, 10]) },
    { mime: 'application/octet-stream', bytes: Buffer.alloc(2 * 1024 * 1024, 0xa5), abrupt: true },
  ]
  for (const fixture of fixtures) {
    const producer = spawn('wl-copy', ['--foreground', '--type', fixture.mime], { stdio: ['pipe', 'ignore', 'pipe'] })
    const exited = once(producer, 'exit')
    const errors = []
    producer.stderr.on('data', chunk => errors.push(chunk))
    const deadline = setTimeout(() => producer.kill(), 5000)
    producer.stdin.end(fixture.bytes)
    try {
      let transferred = false
      const started = performance.now()
      for (let attempt = 0; attempt < 30 && performance.now() - started < 3000; attempt++) {
        const result = spawnSync('wl-paste', ['--no-newline', '--type', fixture.mime], {
          env: { ...process.env, WAYLAND_DEBUG: 'client' }, timeout: 500, maxBuffer: 4 * 1024 * 1024,
        })
        if (result.status === 0) {
          assert.deepEqual(result.stdout, fixture.bytes)
          const protocol = result.stderr.toString()
          assert(protocol.includes('zwlr_data_control_manager_v1'))
          assert(protocol.includes('ext_data_control_manager_v1'))
          transferred = true
          break
        }
        await wait(20)
      }
      assert(transferred, 'nested clipboard did not serve ' + fixture.mime)
      if (fixture.abrupt) {
        producer.kill('SIGKILL')
      } else {
        const cleared = spawnSync('wl-copy', ['--clear'], { timeout: 1000 })
        assert.equal(cleared.status, 0)
      }
      const [code, signal] = await exited
      assert.equal(code, fixture.abrupt ? null : 0, 'clipboard source must reach the expected shutdown state')
      assert.equal(signal, fixture.abrupt ? 'SIGKILL' : null)
      const empty = spawnSync('wl-paste', ['--list-types'], { timeout: 1000 })
      assert.equal(empty.status, 1)
      assert.match(empty.stderr.toString(), /Nothing is copied/)
      assert.equal(Buffer.concat(errors).length, 0, 'clipboard source shutdown must not emit errors')
      console.log('Nested clipboard verified: ' + fixture.mime + ', ' + fixture.bytes.length + ' bytes, ' + (fixture.abrupt ? 'abrupt owner disconnect' : 'clear and clean source exit'))
    } finally {
      clearTimeout(deadline)
      if (producer.exitCode === null && producer.signalCode === null) producer.kill()
      await exited
    }
  }
}
execFileSync('./target/release/monochromatic-nested-wayland-session', [
  '--size', '480x320', '--', 'node', '--input-type=module', '-e',
  'await (' + client.toString() + ')()', '--', process.env.WAYLAND_DISPLAY ?? '',
], { stdio: 'inherit' })
"""

[tasks."inspect:color-scheme"]
description = "Verify the runtime color-scheme switch on the private bus with a bus monitor, a Slint client, screenshots, and a decoy session bus"
shell = "node --input-type=module-typescript -e"
run = '''
const { spawn, spawnSync } = await import('node:child_process')
const { once } = await import('node:events')
const { mkdtempSync, writeFileSync } = await import('node:fs')
const { tmpdir } = await import('node:os')
const { join } = await import('node:path')
const { setTimeout: wait } = await import('node:timers/promises')
const { default: assert } = await import('node:assert/strict')
// Runs inside the nested session as the hosted command.
const client = async () => {
{{vars.slint_scheme_probe}}
  const [hostDisplay, decoyAddress, socketPath, evidence] = process.argv.slice(1)
  const privateAddress = process.env.DBUS_SESSION_BUS_ADDRESS ?? String()
  assert(process.env.WAYLAND_DISPLAY)
  assert.notEqual(process.env.WAYLAND_DISPLAY, hostDisplay)
  assert.equal(process.env.DISPLAY, undefined)
  assert.match(privateAddress, /monochromatic-nested-wayland-session-/)
  assert.notEqual(privateAddress, decoyAddress)
  assert.equal(process.env.DBUS_STARTER_ADDRESS, undefined)
  const portal = ['--session', '--dest', 'org.freedesktop.portal.Desktop', '--object-path', '/org/freedesktop/portal/desktop']
  const served = () => {
    const result = spawnSync('gdbus', ['call', ...portal, '--method', 'org.freedesktop.portal.Settings.ReadOne', 'org.freedesktop.appearance', 'color-scheme'], { timeout: 3000 })
    assert.equal(result.status, 0, result.stderr.toString())
    return result.stdout.toString().trim()
  }
  // Bus-level observer: every signal the private portal emits, in order.
  const monitor = spawn('gdbus', ['monitor', ...portal], { stdio: ['ignore', 'pipe', 'inherit'] })
  const monitorOutput = []
  monitor.stdout.on('data', chunk => monitorOutput.push(chunk))
  const monitored = () => Buffer.concat(monitorOutput).toString()
  const signals = () => monitored().split('\n').filter(line => line.includes('SettingChanged'))
  // Mean luminance of one background pixel in the last frame of a short recording.
  const frame = async name => {
    const directory = join(evidence, 'frames-' + name)
    mkdirSync(directory)
    assert.equal(await control(socketPath, 'record ' + directory + ' 20 bmp'), 'ok')
    await wait(500)
    assert.match(await control(socketPath, 'record stop'), /^ok captured=/)
    const bytes = readFileSync(join(directory, readdirSync(directory).sort().at(-1)))
    const pixel = bytes.readUInt32LE(10) + 4 * 9
    return (bytes[pixel] + bytes[pixel + 1] + bytes[pixel + 2]) / 3
  }
  const empty = await screenshot(socketPath, evidence, 'empty')
  // Toolkit-level observer: Slint reports each Palette.color-scheme value it applies.
  const viewer = startViewer(evidence)
  const { seen } = viewer
  try {
    await until('the bus monitor to attach', () => monitored().includes('Monitoring signals'))
    await until('Slint to apply the startup scheme', () => seen().at(-1) === 'dark')
    assert.equal(served(), '(<uint32 1>,)')
    const startup = seen().length

    // Phase one never records, so each screenshot shows only what the client committed unprompted.
    await firstFrame(socketPath, evidence, empty)
    await wait(settle)
    const darkShot = await screenshot(socketPath, evidence, 'dark')
    // Negative control: the value already served changes nothing and emits nothing.
    assert.equal(await control(socketPath, 'color-scheme dark'), 'ok unchanged')
    // Positive control: a real change reaches the bus monitor and the toolkit.
    assert.equal(await control(socketPath, 'color-scheme light'), 'ok changed')
    await until('Slint to apply light', () => seen().at(-1) === 'light')
    await until('the light signal', () => signals().length >= 1)
    assert.equal(served(), '(<uint32 2>,)')
    await wait(settle)
    const lightShot = await screenshot(socketPath, evidence, 'light')
    assert.notEqual(lightShot, darkShot, 'screenshot did not change after the switch to light')

    assert.equal(await control(socketPath, 'color-scheme light'), 'ok unchanged')
    assert.equal(await control(socketPath, 'color-scheme dark'), 'ok changed')
    await until('Slint to apply dark again', () => seen().length === startup + 2 && seen().at(-1) === 'dark')
    await until('the dark signal', () => signals().length >= 2)
    assert.equal(served(), '(<uint32 1>,)')
    await wait(settle)
    const darkAgainShot = await screenshot(socketPath, evidence, 'dark-again')
    assert.notEqual(darkAgainShot, lightShot, 'screenshot did not change after the switch back to dark')
    assert.equal(darkAgainShot, darkShot, 'the first dark screenshot was not the frame the client shows for dark')

    // Signals arrive in order, so exactly these two prove both unchanged requests emitted nothing.
    assert.deepEqual(signals().map(line => line.replace(/^.*SettingChanged /, String())), [
      "('org.freedesktop.appearance', 'color-scheme', <uint32 2>)",
      "('org.freedesktop.appearance', 'color-scheme', <uint32 1>)",
    ])
    assert.deepEqual(seen().slice(startup), ['light', 'dark'])
    assert.match(await control(socketPath, 'color-scheme system'), /^err color-scheme value must be dark or light/)

    // Phase two reads pixels from recorded frames, an independent capture path.
    const darkLuminance = await frame('dark')
    assert(darkLuminance < 96, 'dark frame luminance ' + darkLuminance)
    assert.equal(await control(socketPath, 'color-scheme light'), 'ok changed')
    await until('Slint to apply light again', () => seen().at(-1) === 'light')
    const lightLuminance = await frame('light')
    assert(lightLuminance > 160, 'light frame luminance ' + lightLuminance)

    writeFileSync(join(evidence, 'private-bus-monitor.log'), monitored())
    writeFileSync(join(evidence, 'slint-seen.log'), viewer.reported())
    console.log('Slint observed: ' + seen().join(' -> '))
    console.log('Private bus signals: ' + signals().length + '; the two unchanged requests emitted none')
    console.log('Screenshots without recording: dark ' + darkShot.slice(0, 12) + ', light ' + lightShot.slice(0, 12) + ', dark ' + darkAgainShot.slice(0, 12))
    console.log('Recorded frame luminance: dark ' + darkLuminance + ', light ' + lightLuminance)
  } finally {
    monitor.kill()
    await viewer.stop()
  }
}
const evidence = mkdtempSync(join(tmpdir(), 'nested-color-scheme-'))
const socketPath = join(evidence, 'control.sock')
// A disposable decoy stands in for the host session bus in the compositor's own environment.
const decoyAddress = 'unix:path=' + join(evidence, 'decoy-bus')
const decoy = spawn('dbus-daemon', ['--session', '--nofork', '--nopidfile', '--nosyslog', '--print-address=1', '--address=' + decoyAddress], { stdio: ['ignore', 'pipe', 'inherit'] })
let failure
try {
  await once(decoy.stdout, 'data')
  const watcher = spawn('dbus-monitor', ['--address', decoyAddress], { stdio: ['ignore', 'pipe', 'inherit'] })
  const watcherOutput = []
  watcher.stdout.on('data', chunk => watcherOutput.push(chunk))
  const watched = () => Buffer.concat(watcherOutput).toString()
  const untilWatched = async text => {
    const started = performance.now()
    while (!watched().includes(text) && performance.now() - started < 3000) await wait(25)
    assert(watched().includes(text), 'decoy session bus watcher did not report ' + text)
  }
  try {
    await untilWatched('NameAcquired')
    const session = spawn('./target/release/monochromatic-nested-wayland-session', [
      '--size', '640x240', '--socket', socketPath, '--color-scheme', 'dark', '--',
      'node', '--input-type=module', '-e', 'await (' + client.toString() + ')()', '--',
      process.env.WAYLAND_DISPLAY ?? String(), decoyAddress, socketPath, evidence,
    ], { stdio: 'inherit', env: { ...process.env, DBUS_SESSION_BUS_ADDRESS: decoyAddress } })
    const [code] = await once(session, 'exit')
    assert.equal(code, 0, 'nested color-scheme client failed')
    // Positive control: the watcher must see a deliberate environment-addressed connection.
    const sentinel = spawnSync('dbus-send', ['--session', '--type=signal', '/sentinel', 'org.example.Sentinel.Ping'], {
      timeout: 3000, env: { ...process.env, DBUS_SESSION_BUS_ADDRESS: decoyAddress },
    })
    assert.equal(sentinel.status, 0, sentinel.stderr.toString())
    await untilWatched('member=Ping')
    writeFileSync(join(evidence, 'decoy-session-bus.log'), watched())
    // Every connection must call Hello first, so one Hello before the sentinel signal is the sentinel itself.
    const beforeSentinel = watched().slice(0, watched().indexOf('member=Ping'))
    assert.equal(beforeSentinel.split('member=Hello').length - 1, 1,
      'something other than the sentinel connected to the decoy session bus')
    assert(!watched().includes('SettingChanged'), 'a SettingChanged signal reached the decoy session bus')
    console.log('Decoy session bus saw only the sentinel connection; no portal traffic left the private bus')
  } finally {
    watcher.kill()
  }
} catch (error) {
  failure = error
} finally {
  decoy.kill()
}
console.log('Evidence: ' + evidence)
if (failure) throw failure
console.log('Nested runtime color-scheme switch verified')
'''

[tasks."inspect:stalled-parent"]
description = "Verify screenshots stay current while a parent compositor withholds frame callbacks, by hosting one session inside another"
shell = "node --input-type=module-typescript -e"
run = '''
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { mkdtempSync } = await import('node:fs')
const { tmpdir } = await import('node:os')
const { join } = await import('node:path')
const { default: assert } = await import('node:assert/strict')
// Runs inside the inner session as its hosted command.
const client = async () => {
{{vars.slint_scheme_probe}}
  const [outerSocket, innerSocket, evidence] = process.argv.slice(1)
  const empty = await screenshot(innerSocket, evidence, 'empty')
  const viewer = startViewer(evidence)
  const { seen } = viewer
  const switchTo = async (value, count) => {
    assert.equal(await control(innerSocket, 'color-scheme ' + value), 'ok changed')
    await until('Slint to apply ' + value, () => seen().length === count && seen().at(-1) === value)
    await wait(settle)
  }
  let recording = false
  try {
    await until('Slint to apply the startup scheme', () => seen().at(-1) === 'dark')
    const startup = seen().length
    await firstFrame(innerSocket, evidence, empty)
    await wait(settle)
    // One frame every ten seconds: the outer session now withholds frame callbacks from the
    // inner one, which is what a locked or hidden host window does to a single session.
    const frames = join(evidence, 'outer-frames')
    mkdirSync(frames)
    assert.equal(await control(outerSocket, 'record ' + frames + ' 0.1 bmp'), 'ok')
    recording = true
    const starved = performance.now()
    await wait(600)
    const dark = await screenshot(innerSocket, evidence, 'starved-dark')
    await switchTo('light', startup + 1)
    const light = await screenshot(innerSocket, evidence, 'starved-light')
    await switchTo('dark', startup + 2)
    const darkAgain = await screenshot(innerSocket, evidence, 'starved-dark-again')
    await switchTo('light', startup + 3)
    const lightAgain = await screenshot(innerSocket, evidence, 'starved-light-again')
    const elapsed = Math.round(performance.now() - starved)
    assert(elapsed < 8000, 'the starved phase outlived one outer recording period: ' + elapsed + ' ms')
    console.log('Starved screenshots: dark ' + dark.slice(0, 12) + ', light ' + light.slice(0, 12)
      + ', dark ' + darkAgain.slice(0, 12) + ', light ' + lightAgain.slice(0, 12) + ' in ' + elapsed + ' ms')
    // A client may still draw its first change unprompted; the later ones need frame callbacks.
    assert.notEqual(light, dark, 'inner screenshot did not change after the first switch')
    assert.equal(darkAgain, dark, 'inner screenshot is stale after the second switch')
    assert.equal(lightAgain, light, 'inner screenshot is stale after the third switch')
  } finally {
    if (recording) await control(outerSocket, 'record stop')
    await viewer.stop()
  }
}
const binary = './target/release/monochromatic-nested-wayland-session'
const evidence = mkdtempSync(join(tmpdir(), 'nested-stalled-parent-'))
const outerSocket = join(evidence, 'outer.sock')
const innerSocket = join(evidence, 'inner.sock')
const session = spawn(binary, [
  '--size', '640x240', '--socket', outerSocket, '--',
  binary, '--size', '640x240', '--socket', innerSocket, '--color-scheme', 'dark', '--',
  'node', '--input-type=module', '-e', 'await (' + client.toString() + ')()', '--',
  outerSocket, innerSocket, evidence,
], { stdio: 'inherit' })
const [code] = await once(session, 'exit')
console.log('Evidence: ' + evidence)
assert.equal(code, 0, 'the inner session did not keep its client current while its parent withheld frames')
console.log('Hosted client stays current while the parent compositor withholds frame callbacks')
'''

[tasks."run:built"]
description = "Run the already-built release compositor without rebuilding"
run = "./target/release/monochromatic-nested-wayland-session"

[tasks."inspect:cli"]
description = "Run the already-built debug CLI for help and argument-boundary verification"
run = "./target/debug/monochromatic-nested-wayland-session"

[tasks."test:cli:container"]
description = "Exercise clap parsing and real CLI help without a display in the bounded container"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
containerCargo(['test', '--lib', 'cli::tests'])
containerCargo(['test', '--test', 'cli'])
"""

[tasks."format:rust:container"]
description = "Format the compositor's Rust sources in the build container"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
containerCargo(['fmt'])
"""

[tasks."build:container"]
description = "Force the release build inside the container regardless of host libraries"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
containerCargo(['build', '--release'])
"""

[tasks."lint:clippy:container"]
description = "Force clippy inside the container (the stable reference lint)"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
containerCargo(['clippy', '--release', '--', '-D', 'warnings'])
"""

[tasks."test:container"]
description = "Force the tests inside the container"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
containerCargo(['nextest', 'run'])
"""

[tasks."verify:container"]
description = "Build image, then build + clippy + test inside the container, aborting on first failure"
depends = ["image"]
run = [
  "mise run build:container",
  "mise run lint:clippy:container",
  "mise run test:container",
]

[tasks.run]
description = "Build and run compositor; supports socket, size, color-scheme, and child arguments"
usage = '''
arg "[args]" var=#true help="Compositor arguments, then the client command to host"
'''
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
{{vars.parse_usage_args}}
runCargo(['build', '--release'])
const args = parseUsageArgs(process.env.usage_args ?? '')
execFileSync('./target/release/monochromatic-nested-wayland-session', args, { stdio: 'inherit' })
"""
