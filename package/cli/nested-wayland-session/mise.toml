# Cargo work runs on the HOST when the native dev libraries are present, and falls
# back to the Fedora build container otherwise (see Containerfile and
# doc/decision/desktop-app-podman-build.md). Unlike the desktop apps this package
# is Linux-only: it is a Wayland compositor, so there is no macOS/Windows branch.
#
# The built binary always RUNS on the host (it is a nested winit client of the host
# Wayland session and needs the host GPU), regardless of where it was compiled, so
# the `run` task executes the host-facing binary directly.

[vars]
# Bootstrap-safe cargo dispatch for this package, interpolated into the cargo tasks
# (each sets `shell = "node --input-type=module-typescript -e"`).
# - hostOk: `cargo` on PATH and pkg-config resolves the compositor's link-time
#   libraries (wayland-server for use_system_lib, xkbcommon for the keyboard, libdrm
#   for the dmabuf render-node query). When all are present the task runs cargo
#   natively; otherwise containerCargo runs the same command in podman.
# - containerCargo(args): build the image when missing, then run cargo in podman
#   (package dir bind-mounted at /work, cargo cache in a named volume, `label=disable`
#   to skip SELinux relabeling of the host tree).
# Its imported binding (execFileSync) is reused by inline follow-ups, so those must
# not reimport it.
cargo_dispatch = """
const { execFileSync } = await import('node:child_process')
const onPath = (command) => { try { execFileSync('which', [command], { stdio: 'ignore' }); return true } catch { return false } }
const pkgConfigOk = () => { try { execFileSync('pkg-config', ['--exists', 'wayland-server', 'xkbcommon', 'libdrm'], { stdio: 'ignore' }); return true } catch { return false } }
const hostOk = onPath('cargo') && pkgConfigOk()
const IMAGE = 'localhost/monochromatic/nested-wayland-session'
const containerCargo = (cargoArgs) => {
  let imageExists = true
  try { execFileSync('podman', ['image', 'exists', IMAGE], { stdio: 'ignore' }) } catch { imageExists = false }
  if (!imageExists) { execFileSync('podman', ['build', '-t', IMAGE, '-f', 'Containerfile', '.'], { stdio: 'inherit' }) }
  execFileSync('podman', ['run', '--rm', '--memory=2g', '--cpus=2', '--pids-limit=512', '--ulimit', 'nofile=4096:4096', '--env', 'CARGO_BUILD_JOBS=2', '--security-opt', 'label=disable', '--volume', `${process.cwd()}:/work`, '--volume', 'nested-wayland-session-cargo:/cargo', '--workdir', '/work', IMAGE, 'cargo', ...cargoArgs], { stdio: 'inherit' })
}
const runCargo = (cargoArgs) => { if (hostOk) { execFileSync('cargo', cargoArgs, { stdio: 'inherit' }) } else { containerCargo(cargoArgs) } }
"""

# Shared body for hosted inspection clients (interpolated inside an async function whose
# source is passed to a nested `node -e`). It provides:
# - until(label, probe): poll until probe() is truthy, failing after ten seconds.
# - control(socketPath, line): send one control command, resolve with its response line.
# - startViewer(evidence): show a Slint scene through slint-viewer whose scheme-seen callback
#   reports every Palette.color-scheme value the toolkit applies. slint-viewer runs the --on
#   handler as a plain command, so the report arrives on the viewer's stdout.
# - screenshot(socketPath, evidence, name): write a PNG and return its SHA-256.
# - firstFrame(socketPath, evidence, emptyHash): wait until the client has committed a frame.
# Literal ''' strings keep JavaScript escapes such as '\n' out of TOML's own escaping.
slint_scheme_probe = '''
  const { spawn, spawnSync } = await import('node:child_process')
  const { once } = await import('node:events')
  const { createConnection } = await import('node:net')
  const { readFileSync, readdirSync, writeFileSync, mkdirSync } = await import('node:fs')
  const { join } = await import('node:path')
  const { createHash } = await import('node:crypto')
  const { setTimeout: wait } = await import('node:timers/promises')
  const { default: assert } = await import('node:assert/strict')
  // Time for the client to draw and commit after it reports a value.
  const settle = 400
  const until = async (label, probe, limit = 10000) => {
    const started = performance.now()
    while (performance.now() - started < limit) {
      const value = probe()
      if (value) return value
      await wait(25)
    }
    assert.fail('timed out waiting for ' + label)
  }
  const control = (socketPath, line) => new Promise((resolve, reject) => {
    const socket = createConnection(socketPath)
    let reply = ''
    socket.on('error', reject)
    socket.on('data', chunk => {
      reply += chunk
      if (reply.includes('\n')) { socket.end(); resolve(reply.trim()) }
    })
    socket.write(line + '\n')
  })
  const startViewer = evidence => {
    const scene = join(evidence, 'scene.slint')
    writeFileSync(scene, [
      'import { Palette } from "std-widgets.slint";',
      'export component Scene inherits Window {',
      '    callback scheme-seen(string);',
      '    property <string> scheme: Palette.color-scheme == ColorScheme.dark ? "dark"',
      '        : Palette.color-scheme == ColorScheme.light ? "light" : "unknown";',
      '    background: Palette.background;',
      '    init => { root.scheme-seen(root.scheme); }',
      '    changed scheme => { root.scheme-seen(root.scheme); }',
      '    Text {',
      '        text: "Palette.color-scheme: " + root.scheme;',
      '        color: Palette.foreground;',
      '        font-size: 28px;',
      '    }',
      '}',
      '',
    ].join('\n'))
    const viewer = spawn('slint-viewer', ['--on', 'scheme-seen', 'echo scheme-seen $1', scene], { stdio: ['ignore', 'pipe', 'inherit'] })
    const output = []
    viewer.stdout.on('data', chunk => output.push(chunk))
    const reported = () => Buffer.concat(output).toString()
    const seen = () => reported().split('\n').filter(line => line.startsWith('scheme-seen ')).map(line => line.slice(12))
    const stop = async () => {
      viewer.kill()
      if (viewer.exitCode === null && viewer.signalCode === null) await once(viewer, 'exit')
    }
    return { reported, seen, stop }
  }
  const screenshot = async (socketPath, evidence, name) => {
    const path = join(evidence, name + '.png')
    assert.equal(await control(socketPath, 'screenshot ' + path), 'ok')
    return createHash('sha256').update(readFileSync(path)).digest('hex')
  }
  // The toolkit reports its first value before its first frame is committed, so poll until
  // the screenshot stops being the empty screen captured before the client started.
  const firstFrame = async (socketPath, evidence, emptyHash) => {
    const started = performance.now()
    while (performance.now() - started < 10000) {
      if (await screenshot(socketPath, evidence, 'first-frame') !== emptyHash) return
      await wait(50)
    }
    assert.fail('timed out waiting for the client to commit its first frame')
  }
'''

