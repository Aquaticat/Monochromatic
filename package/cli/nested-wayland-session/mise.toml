# Cargo work runs on the HOST when the native dev libraries are present, and falls
# back to the Fedora build container otherwise (see Containerfile and
# doc/decision/desktop-app-podman-build.md). Unlike the desktop apps this package
# is Linux-only: it is a Wayland compositor, so there is no macOS/Windows branch.
#
# The built binary always RUNS on the host (it is a nested winit client of the host
# Wayland session and needs the host GPU), regardless of where it was compiled, so
# the `run` task executes the host-facing binary directly.

[vars]
# Bootstrap-safe cargo dispatch for this package, interpolated into the cargo tasks
# (each sets `shell = "node --input-type=module-typescript -e"`).
# - hostOk: `cargo` on PATH and pkg-config resolves the compositor's link-time
#   libraries (wayland-server for use_system_lib, xkbcommon for the keyboard, libdrm
#   for the dmabuf render-node query). When all are present the task runs cargo
#   natively; otherwise containerCargo runs the same command in podman.
# - containerCargo(args): build the image when missing, then run cargo in podman
#   (package dir bind-mounted at /work, cargo cache in a named volume, `label=disable`
#   to skip SELinux relabeling of the host tree).
# Its imported binding (execFileSync) is reused by inline follow-ups, so those must
# not reimport it.
cargo_dispatch = """
const { execFileSync } = await import('node:child_process')
const onPath = (command) => { try { execFileSync('which', [command], { stdio: 'ignore' }); return true } catch { return false } }
const pkgConfigOk = () => { try { execFileSync('pkg-config', ['--exists', 'wayland-server', 'xkbcommon', 'libdrm'], { stdio: 'ignore' }); return true } catch { return false } }
const hostOk = onPath('cargo') && pkgConfigOk()
const IMAGE = 'localhost/monochromatic/nested-wayland-session'
const containerCargo = (cargoArgs) => {
  let imageExists = true
  try { execFileSync('podman', ['image', 'exists', IMAGE], { stdio: 'ignore' }) } catch { imageExists = false }
  if (!imageExists) { execFileSync('podman', ['build', '-t', IMAGE, '-f', 'Containerfile', '.'], { stdio: 'inherit' }) }
  execFileSync('podman', ['run', '--rm', '--security-opt', 'label=disable', '-v', `${process.cwd()}:/work`, '-v', 'nested-wayland-session-cargo:/cargo', '-w', '/work', IMAGE, 'cargo', ...cargoArgs], { stdio: 'inherit' })
}
const runCargo = (cargoArgs) => { if (hostOk) { execFileSync('cargo', cargoArgs, { stdio: 'inherit' }) } else { containerCargo(cargoArgs) } }
"""

[tasks.image]
description = "Build the Fedora build container image"
run = "podman build -t localhost/monochromatic/nested-wayland-session -f Containerfile ."

[tasks.build]
description = "Release build (host if dev libs present, else container)"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
runCargo(['build', '--release'])
"""

[tasks."build:debug"]
description = "Debug build (host if dev libs present, else container)"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
runCargo(['build'])
"""

[tasks.lint]
description = "cargo check, no codegen (host if dev libs present, else container)"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
runCargo(['check'])
"""

[tasks."lint:clippy"]
description = "Run clippy with warnings denied (host if dev libs present, else container)"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
runCargo(['clippy', '--release', '--', '-D', 'warnings'])
"""

[tasks."format:clippy"]
description = "Apply clippy's machine-applicable suggestions in place (host if dev libs present, else container)"
# --allow-no-vcs is harmless on the host and required in the container, where only the
# package dir is bind-mounted so the repo-root .git is not visible.
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
runCargo(['clippy', '--fix', '--allow-dirty', '--allow-staged', '--allow-no-vcs'])
"""

[tasks."lint:rust"]
description = "Run monochromatic-rust-linter (max-lines + require-rustdoc) over this package's .rs"
# Runs on the HOST: the linter is a separate crate with no compositor deps, so it needs
# no container. .gitignore-aware walking skips target/.
run = "cargo run --quiet --manifest-path ../../linter/rust/Cargo.toml -- ."

[tasks.test]
description = "cargo nextest run (host if dev libs present, else container)"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
runCargo(['nextest', 'run'])
"""

[tasks.package]
description = "Build the crates.io package tarball (container)"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
runCargo(['package'])
"""

[tasks."build:container"]
description = "Force the release build inside the container regardless of host libraries"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
containerCargo(['build', '--release'])
"""

[tasks."lint:clippy:container"]
description = "Force clippy inside the container (the stable reference lint)"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
containerCargo(['clippy', '--release', '--', '-D', 'warnings'])
"""

[tasks."test:container"]
description = "Force the tests inside the container"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
containerCargo(['nextest', 'run'])
"""

[tasks."verify:container"]
description = "Build image, then build + clippy + test inside the container, aborting on first failure"
depends = ["image"]
run = [
  "mise run build:container",
  "mise run lint:clippy:container",
  "mise run test:container",
]

[tasks.run]
description = "Build and run compositor; supports socket, size, color-scheme, and child arguments"
usage = '''
arg "[args]" var=#true help="Compositor arguments, then the client command to host"
'''
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
const { execFileSync } = await import('node:child_process')
runCargo(['build', '--release'])
const args = process.argv.slice(1)
execFileSync('./target/release/monochromatic-nested-wayland-session', args, { stdio: 'inherit' })
"""
