run = ["mise run build", "mise run test:unit"]

# Live, BILLED Hetzner provisioning test. Excluded from test:unit (the .expensive.
# marker); run deliberately. Auto-extracts HCLOUD_TOKEN from the tofu tfvars so
# you do not have to export it. Provisions and then destroys real, billed servers.
[tasks.'test:hetzner']
description = "Run the live, BILLED Hetzner provisioning test (token auto-read from package/config/tofu/hetzner.auto.tfvars)"
shell = "node --input-type=module-typescript -e"
run = """
const { readFileSync } = await import('node:fs')
const { execFileSync } = await import('node:child_process')
const tfvars = '../../config/tofu/hetzner.auto.tfvars'
const tokenLine = readFileSync(tfvars, 'utf8').split('\\n').find((line) => line.trimStart().startsWith('hcloud_token'))
if (tokenLine === undefined) { throw new Error(`hcloud_token not found in ${tfvars}`) }
const token = tokenLine.slice(tokenLine.indexOf('"') + 1, tokenLine.lastIndexOf('"'))
execFileSync('node', ['src/backend/hetzner/provision.expensive.unit.test.ts'], { stdio: 'inherit', env: { ...process.env, HCLOUD_TOKEN: token } })
"""
