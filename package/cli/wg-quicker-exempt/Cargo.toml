[package]
name = "wg-quicker-exempt"
version = "0.0.1"
categories = ["command-line-utilities", "network-programming"]
edition = "2024"
homepage = "https://github.com/Aquaticat/Monochromatic/tree/main/package/cli/wg-quicker-exempt"
include = [
  "src/**/*.rs",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSES/*.txt",
]
keywords = ["wireguard", "vpn", "cgroup", "bpf", "policy-routing"]
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticat/Monochromatic.git"
description = "Loads a cgroup-BPF program that marks sockets from chosen app cgroups so a policy-routing rule sends their traffic outside the WireGuard tunnel."

[lints.clippy]
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"

[[bin]]
name = "wg-quicker-exempt"
path = "src/main.rs"

[dependencies]
# Raw syscalls only; `libc` supplies the syscall numbers, bpf attr layout, and
# error types. No libbpf/bpftool so the binary runs on rpm-ostree (Atomic) hosts
# where those headers/tools are not installed.
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]
