[tasks.build]
description = "Build the wg-quicker-exempt binary in release mode"
run = "cargo build --release"

[tasks."build:debug"]
description = "Build the wg-quicker-exempt binary in debug mode"
run = "cargo build"

[tasks.lint]
description = "cargo check (no codegen)"
run = "cargo check"

[tasks."lint:clippy"]
description = "Run clippy over the bin and tests"
run = "cargo clippy --release --all-targets -- -D warnings"

[tasks."lint:rust"]
description = "Run monochromatic-rust-linter (max-lines + require-rustdoc) over this package's .rs"
run = "cargo run --quiet --manifest-path ../../linter/rust/Cargo.toml -- ."

[tasks.buildAndTest]
description = "Build wg-quicker-exempt and run its lints"
run = ["mise run build", "mise run lint", "mise run lint:clippy", "mise run lint:rust"]
