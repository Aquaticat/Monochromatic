# Monorepo-wide Kotlin linter (custom detekt rule set), the Kotlin sibling of
# package/linter/rust. The whole-tree scan lives in the root `lint:detekt` task (in
# mise.no-env.toml), not here, so the fanout-discovered package `lint` below stays a
# local compile check and does not scan the repo twice.
#
# Gradle is the committed wrapper (gradle 9.5.1), matching the android-app pattern;
# java is inherited from the root mise manifest. detekt and the detekt CLI resolve
# from mavenCentral.

[tasks.build]
description = "Build the require-kdoc plugin jar"
dir = "{{config_root}}"
run = "./gradlew jar --no-daemon --console=plain"

[tasks.lint]
description = "Local compile check of the rule set (the monorepo scan is the root lint:detekt)"
dir = "{{config_root}}"
run = "./gradlew compileKotlin compileTestKotlin --no-daemon --console=plain"

[tasks.test]
description = "Run the JVM unit tests for the require-kdoc rule set"
dir = "{{config_root}}"
run = "./gradlew test --no-daemon --console=plain"

[tasks."lint:detekt"]
description = "Dogfood: run require-kdoc over this package's own Kotlin sources"
dir = "{{config_root}}"
run = "./gradlew detektCheck -PdetektInput={{config_root}}/src/main/kotlin --no-daemon --console=plain"
