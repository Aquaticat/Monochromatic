[env]
# Bound compiler fan-out during local iteration; container gates also cap memory and CPUs.
CARGO_BUILD_JOBS = "2"

[tasks.build]
description = "Build the native unified-linter implementation"
run = "cargo build --release"

[tasks."build:debug"]
description = "Build the native unified-linter implementation for iteration"
run = "cargo build"

[tasks.lint]
description = "Check the Rust implementation without code generation"
run = "cargo check"

[tasks."lint:types"]
description = "Check Rust types and deny Clippy findings"
run = ["cargo check", "cargo clippy --all-targets -- -D warnings"]

[tasks."lint:rust"]
description = "Check documented items and source code-line budgets using the incumbent Rust linter"
run = "cargo run --quiet --manifest-path ../rust/Cargo.toml -- ."

[tasks."format:rust"]
description = "Format the native unified-linter source"
run = "cargo fmt"

[tasks."lint:rustfmt"]
description = "Check native source formatting"
run = "cargo fmt --check"

[tasks.test]
description = "Run native unit and conformance tests"
run = "cargo test --all-targets"

[tasks."dependencies:fetch"]
description = "Fetch the locked dependency archives before offline container verification"
run = "cargo fetch --locked"

[tasks.lock]
description = "Regenerate the owning Cargo lockfile without fetching dependencies"
run = "cargo generate-lockfile --offline"

[tasks."lint:container"]
description = "Run Clippy against the tested source snapshot with a read-only bounded compiler"
depends = ["test:container"]
shell = "node --input-type=module -e"
run = '''
import { spawnSync } from 'node:child_process'
const toolchain = spawnSync('rustc', ['--print', 'sysroot'], { encoding: 'utf8' })
if (toolchain.error) throw toolchain.error
if (toolchain.status !== 0) throw new Error(toolchain.stderr)
const root = toolchain.stdout.trim()
const child = spawnSync('podman', [
  'run', '--rm', '--init', '--network=none', '--memory=2g', '--cpus=2', '--pids-limit=128',
  '--security-opt', 'label=disable', '--volume', `${root}:/toolchain:ro`,
  '--env', 'PATH=/toolchain/bin:/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin',
  '--env', 'RUSTC=/toolchain/bin/rustc', '--env', 'RUSTDOC=/toolchain/bin/rustdoc',
  'localhost/monochromatic-lint-test:development',
  '/toolchain/bin/cargo', 'clippy', '--offline', '--locked', '--all-targets', '--', '-D', 'warnings',
], { stdio: 'inherit' })
if (child.error) throw child.error
if (child.status !== 0) throw new Error(`Container Clippy failed: ${child.status}`)
'''

[tasks.mutation]
description = "Run cargo-mutants in the tested, mount-free 2 GiB / 2 CPU source snapshot"
depends = ["test:container"]
run = "node bin/mutate-container.mjs"

[tasks."mutation:rust-style"]
description = "Mutate the anonymous-function rule with its focused baseline in the bounded source snapshot"
depends = ["test:rust-style"]
run = "node bin/mutate-container.mjs --rust-style"

[tasks."test:container"]
description = "Run artifact tests in a mount-free, network-disabled 2 GiB / 2 CPU container"
run = "node bin/test-container.mjs"

[tasks."test:rust-style"]
description = "Verify the Rust style rule independently of unfinished Markdown adapters, under the same container bounds"
run = "node bin/test-container.mjs rust_no_anonymous_functions"
