[tasks.build]
description = "Build the rust-linter binary in release mode"
run = "cargo build --release"

[tasks."build:debug"]
description = "Build the rust-linter binary in debug mode"
run = "cargo build"

[tasks.lint]
description = "cargo check (no codegen)"
run = "cargo check"

[tasks."lint:clippy"]
description = "Run clippy with warnings denied"
run = "cargo clippy --release -- -D warnings"

[tasks."format:clippy"]
description = "Apply clippy's machine-applicable suggestions in place"
# Mirrors the sibling task in package/rust-module/rust-linter-core and
# package/rust-module/forbidden-regex. This crate denies `implicit_return`, and
# the fix for it is machine-applicable, so the whole class is remediated here
# rather than by loosening the lint.
run = "cargo clippy --fix --allow-dirty --allow-staged --all-targets"

[tasks.test]
description = "cargo nextest run"
run = "cargo nextest run --release"

[tasks."lint:rust"]
description = "Dogfood: run monochromatic-rust-linter (max-lines + require-rustdoc) over its own src"
run = "cargo run --release -- src"

[tasks.package]
description = "Build the crates.io package tarball"
run = "cargo package"

[tasks.run]
description = "Run the linter (pass paths and flags like --max after --)"
usage = '''
arg "[args]" var=#true help="Paths to lint and flags such as --max 300"
'''
# usage_args arrives shell-escaped; parseUsageArgs recovers the argument vector.
shell = "node --input-type=module-typescript -e"
run = """
{{vars.parse_usage_args}}
const { execFileSync } = await import('node:child_process')
const extras = parseUsageArgs(process.env.usage_args ?? '')
execFileSync('cargo', ['run', '--release', '--', ...extras], { stdio: 'inherit' })
"""
