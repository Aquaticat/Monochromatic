[package]
name = "monochromatic-rust-linter"
version = "0.1.0"
categories = ["development-tools", "command-line-utilities"]
edition = "2024"
homepage = "https://github.com/Aquaticat/Monochromatic/tree/main/package/linter/rust"
include = [
  "src/**/*.rs",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSES/*.txt",
]
keywords = ["rust", "linter", "max-lines", "lint", "ci"]
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticat/Monochromatic.git"
description = "Pluggable Rust linter written in Rust. First rule: max-lines, a per-file code-line budget mirroring oxlint's eslint/max-lines for TypeScript."

[lints.clippy]
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"

[lib]
name = "monochromatic_rust_linter"
path = "src/lib.rs"

[[bin]]
name = "rust-linter"
path = "src/main.rs"

[dependencies]
# The shared foundation: `Rule`, `LintContext`, `Config`, and the diagnostic and
# fix model. Rule packages depend on this crate alone, never on this CLI, which
# is what lets a rule live outside the binary that runs it. Its `ra_ap_syntax`
# pin must stay identical to the one below, because the two crates pass
# `SyntaxNode` values across the boundary and a version skew would make them two
# unrelated types.
monochromatic-rust-linter-core = { path = "../../rust-module/rust-linter-core", version = "0.1.0" }

# `anyhow` carries application-level setup errors for the compatibility entry point.
anyhow = "1"
# `clap` owns argv parsing, generated help/version output, and validation for the
# rust-linter binary. The derive feature keeps the command shape declared beside
# the parsed `Cli` struct.
clap = { version = "4", features = ["derive"] }

# `ignore` is the gitignore-aware parallel file walker that ripgrep uses; we
# use it to enumerate `.rs` files while automatically skipping `target/` and
# anything else .gitignore excludes.
ignore = "0.4"

# `ra_ap_syntax` is rust-analyzer's own lossless syntax-tree crate, auto-published
# to crates.io under the `ra_ap_*` prefix. Pinned to EXACTLY 0.0.335: these
# bot-published mirrors carry NO API-stability guarantee and the parse/token API
# can shift between point releases, so a caret range would risk silent breakage.
# Re-pin deliberately (and re-verify the token API) when bumping. Verified to
# build and tokenize on stable rustc 1.96.0; in particular it keeps `//`/`/* */`
# that appear inside string literals out of the COMMENT token stream, which the
# max-lines code-line count depends on.
ra_ap_syntax = "=0.0.335"

# The logging facade and its subscriber. tracing routes the linter's own diagnostics
# (file-read failures) as structured events to stderr via tracing-subscriber, keeping the
# lint findings printed to stdout clean and machine-parseable. env-filter reads RUST_LOG.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]
