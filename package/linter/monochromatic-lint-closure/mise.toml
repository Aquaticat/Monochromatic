[env]
# The dated nightly of rust-toolchain.toml. The repository root mise.toml exports RUSTUP_TOOLCHAIN for a floating nightly
# without rustc-dev, and that variable outranks rust-toolchain.toml, so this package restates its own pin.
RUSTUP_TOOLCHAIN = "nightly-2026-10-17"
# Bound compiler fan-out during local iteration, matching the sibling Rust packages.
CARGO_BUILD_JOBS = "2"

[tasks.build]
description = "Build the Dylint library"
run = "cargo build"

[tasks.test]
description = "Run the UI tests and the unit tests"
run = "cargo nextest run --all-targets"

[tasks."lint:clippy"]
description = "Run Clippy over the library and tests, denying warnings"
run = "cargo clippy --all-targets -- --deny warnings"

[tasks."lint:rustfmt"]
description = "Check formatting"
run = "cargo fmt --check"

[tasks."format:rust"]
description = "Format the Rust sources"
run = "cargo fmt"

[tasks.lint]
description = "Run every static check of the library"
run = ["cargo check --all-targets", "cargo clippy --all-targets -- --deny warnings", "cargo fmt --check"]

[tasks.bless]
description = "Rewrite tests/ui/*.stderr from the lint's current output; review the diff against the verdict markers before committing"
shell = "node --input-type=module-typescript -e"
run = '''
import { spawnSync } from 'node:child_process';
import { copyFileSync, mkdtempSync, readdirSync } from 'node:fs';
import { tmpdir } from 'node:os';
import { join } from 'node:path';
// compiletest writes each differing actual output next to its scratch files in TMPDIR, so a fresh TMPDIR collects exactly them.
const scratch = mkdtempSync(join(tmpdir(), 'bless-'));
const run = spawnSync('cargo', ['nextest', 'run', 'ui_tests::ui', '--no-fail-fast'], {
  env: { ...process.env, TMPDIR: scratch },
  stdio: 'inherit',
});
if (run.error) throw run.error;
for (const name of readdirSync(scratch)) {
  if (name.endsWith('.stage-id.stderr')) {
    // The harness pads each golden file with a blank line; the commit policy trims it again, and the test pads it back.
    copyFileSync(join(scratch, name), join('tests/ui', name.replace('.stage-id.stderr', '.stderr')));
    console.log('blessed ' + name);
  }
}
'''

[tasks.run]
description = "Lint another package: mise run //package/linter/monochromatic-lint-closure:run <package directory>"
depends = ["build"]
# mise appends raw arguments to an inline script's text, so the directory is declared as a usage argument and read from the environment.
usage = 'arg "<directory>" help="Directory of the package to lint; relative paths resolve against the directory the command was typed in"'

shell = "node --input-type=module-typescript -e"
run = '''
import { spawnSync } from 'node:child_process';
import { copyFileSync, existsSync, mkdtempSync } from 'node:fs';
import { tmpdir } from 'node:os';
import { join, resolve } from 'node:path';
const directory = process.env.usage_directory;
if (directory === undefined) throw new Error('Pass the directory of the package to lint');
// mise runs a task in this package's directory, so a relative argument is resolved against the directory it was typed in.
const manifest = join(resolve(process.env.MISE_ORIGINAL_CWD ?? process.cwd(), directory), 'Cargo.toml');
if (!existsSync(manifest)) throw new Error('No Cargo.toml at ' + manifest);
const hostLine = spawnSync('rustc', ['--version', '--verbose'], { encoding: 'utf8' }).stdout.split('\n').find((line) => line.startsWith('host: '));
const toolchain = process.env.RUSTUP_TOOLCHAIN + '-' + hostLine.slice('host: '.length);
// cargo dylint finds a library only by the file name lib<name>@<toolchain>.so, and this repository's shared cargo
// build-dir setting keeps dylint-link's copy of that name away from target/, so stage a copy under the expected name.
const staged = join(mkdtempSync(join(tmpdir(), 'avoidable-closure-')), 'libmonochromatic_lint_closure@' + toolchain + '.so');
copyFileSync('target/debug/libmonochromatic_lint_closure.so', staged);
const result = spawnSync('cargo', ['dylint', '--lib-path', staged, '--manifest-path', manifest, '--', '--all-targets'], { stdio: 'inherit' });
if (result.error) throw result.error;
process.exitCode = result.status ?? 1;
'''
