[package]
name = "git-policy-cli-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[lints.clippy]
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

[dependencies]
# Existing repository libFuzzer harness; no structured-generator crate is needed because
# every generator here builds values through the subject's own types.
libfuzzer-sys = "0.4"
git-policy-cli = { path = "../cli" }
monochromatic-jsonc-edit = { path = "../../rust-module/jsonc-edit" }

# Library target hosting the shared generators and invariants used by every fuzz target
# and by the generator controls that `cargo test --lib` runs.
[lib]
name = "git_policy_cli_fuzz"
path = "src/lib.rs"

# cargo-fuzz discovers targets through `cargo metadata`, so each harness needs an explicit bin entry.
[[bin]]
name = "global_arguments"
path = "fuzz_targets/global_arguments.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_loading"
path = "fuzz_targets/config_loading.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_schema"
path = "fuzz_targets/config_schema.rs"
test = false
doc = false
bench = false

# libFuzzer records and minimizes a failing input by unwinding out of the assertion.
[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"

# Independent workspace, matching the other fuzz sidecars.
[workspace]
members = ["."]
