[tasks.lock]
description = "Regenerate the owning fuzz Cargo lockfile without network"
run = "cargo generate-lockfile --offline"

[tasks.list]
description = "List registered fuzz targets"
run = "cargo fuzz list --fuzz-dir ."

[tasks.test]
description = "Run generator and invariant controls"
run = "cargo test --lib"

[tasks."test:planted"]
description = "Plant five defects in a disposable copy of the subject and require the generator controls to fail"
run = "node bin/planted-controls.mjs"

[tasks."lint:types"]
description = "Check the fuzz helper library with denied Clippy warnings"
run = ["cargo check --lib", "cargo clippy --lib -- -D warnings"]

[tasks."format:rust"]
description = "Format fuzz source and targets"
run = "cargo fmt"

[tasks.build]
description = "Build AddressSanitizer targets in a 2 GiB / 2 CPU container"
run = "node bin/container.mjs --build-only"

[tasks.smoke]
description = "Run generator controls, Clippy, then ASAN targets for 30s each in mount-free bounded containers"
run = "node bin/container.mjs"

[tasks."lock:subject"]
description = "Seed the fuzz lockfile from the subject's lockfile, then let Cargo add only this sidecar's own packages, so both lock the same registry versions"
run = ["cp ../cli/Cargo.lock Cargo.lock", "cargo update --workspace --offline"]
