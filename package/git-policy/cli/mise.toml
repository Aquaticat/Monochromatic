[tasks.'build:js']
extends = "build:js"

[tasks.'build:js:node']
extends = "build:js:node"

[tasks.'watch:build']
extends = "watch:build"

[tasks.'watch:build:js']
extends = "watch:build:js"

[tasks.'watch:build:js:node']
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks.'lint:types']
extends = "lint:types"

[tasks.'lint:oxlint']
extends = "lint:oxlint"

[tasks.'lint:oxlint:paths']
description = "Lint explicitly selected git-policy-cli source paths without unrelated package diagnostics"
usage = 'arg "[paths]" var=#true help="Package-relative files to lint"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
const files = parseUsageArgs(process.env.usage_paths ?? '')
if (files.length === 0) { throw new Error('lint:oxlint:paths requires at least one file') }
ensureOxlintConfig()
runWorkspaceNode('package/dev-script/task-util', 'oxlint-wrapper', files)
"""

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks.'format:oxlint:paths']
description = "Auto-fix explicitly selected git-policy-cli paths with Oxlint without touching unrelated package files"
usage = 'arg "[paths]" var=#true help="Package-relative files to fix"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
const files = parseUsageArgs(process.env.usage_paths ?? '')
if (files.length === 0) { throw new Error('format:oxlint:paths requires at least one file') }
ensureOxlintConfig()
runWorkspaceNode('package/dev-script/task-util', 'oxlint-wrapper', ['--fix', ...files])
"""

[tasks.'test:unit']
extends = "test:unit"

[tasks.'verify:supported-runtime']
description = "Import built public MJS and exercise representative CLI behavior at selected engines.node floor"
run = "node src/runtime-contract.host-evidence.ts"

[tasks.'pack:npm']
description = "Build and create the unpublished npm tarball"
depends = ["build"]
# pnpm 12.3.4 drops --config.dedupe-direct-deps=false without a message; only the environment variable takes effect
# (doc/troubleshooting/pnpm-pack-dedupe-direct-deps.md).
env = { pnpm_config_dedupe_direct_deps = "false" }
run = [
  "pnpm install --force --filter @monochromatic-dev/git-policy-cli",
  "node -e \"const { mkdirSync } = await import('node:fs'); mkdirSync('dist/pack', { recursive: true })\"",
  "pnpm pack --pack-destination dist/pack",
]

[tasks.'test:built:trust']
description = "Exercise packed shadow git trust lifecycle in a disposable container"
depends = ["pack:npm"]
shell = "node --input-type=module-typescript -e"
run = '''
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { readFile } = await import('node:fs/promises')
const { join } = await import('node:path')
const packageRoot = process.cwd()
const manifest = JSON.parse(await readFile(join(packageRoot, 'package.json'), 'utf8'))
const tarballName = `${manifest.name.replace('@', '').replace('/', '-')}-${manifest.version}.tgz`
const child = spawn('podman', [
  'run',
  '--memory=1g',
  '--cpus=1',
  '--cap-add',
  'SYS_ADMIN',
  '--rm',
  '--volume',
  `${join(packageRoot, 'dist', 'pack', tarballName)}:/fixture/cli.tgz:ro,Z`,
  '--volume',
  `${join(packageRoot, 'src', 'trust', 'fixture')}:/fixture/tests:ro,Z`,
  '--tmpfs',
  '/work/recursive/child:rw,size=16m',
  'docker.io/library/node:24-slim',
  'node',
  '/fixture/tests/built-trust-consumer.ts',
], { stdio: 'inherit' })
const [code] = await once(child, 'exit')
if (code !== 0) throw new Error(`Packed trust container exited with ${String(code)}`)
'''

[tasks.'test:hk-config-cleanup']
description = "Verify exact idempotent hk Git-config cleanup in disposable local and global fixtures"
run = "node src/trust/fixture/hk-config-cleanup-consumer.ts"

[tasks.'perf:lifecycle-latency']
description = "Measure and enforce packed lifecycle latency budgets in a bounded container"
depends = ["pack:npm"]
shell = "node --input-type=module-typescript -e"
run = '''
const { execFile, spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { mkdir, readFile } = await import('node:fs/promises')
const { join } = await import('node:path')
const { promisify } = await import('node:util')
const packageRoot = process.cwd()
const evidenceRoot = join(packageRoot, 'dist/perf')
await mkdir(evidenceRoot, { recursive: true })
const execute = promisify(execFile)
// Derived, never spelled out: a stale tarball under the previous package name
// outlives a rename in dist/pack, so a literal path keeps mounting it and the
// benchmark measures the package it replaced.
const manifest = JSON.parse(await readFile(join(packageRoot, 'package.json'), 'utf8'))
const tarballName = `${manifest.name.replace('@', '').replace('/', '-')}-${manifest.version}.tgz`
const tarballPath = join(packageRoot, 'dist/pack', tarballName)
await readFile(tarballPath)
const { stdout: revisionOutput } = await execute('/usr/bin/git', ['rev-parse', 'HEAD'], { cwd: packageRoot })
const revision = revisionOutput.trim()
const bootstrap = `
const { execFile } = await import('node:child_process')
const { mkdir } = await import('node:fs/promises')
const { promisify } = await import('node:util')
const run = promisify(execFile)
await run('apt-get', ['update'])
await run('apt-get', ['install', '--yes', '--no-install-recommends', 'git'])
await mkdir('/work', { recursive: true })
await run('npm', ['init', '--yes'], { cwd: '/work' })
await run('npm', ['pkg', 'set', 'type=module'], { cwd: '/work' })
await run('npm', ['install', '--ignore-scripts', '/fixture/cli.tgz'], { cwd: '/work' })
await import('/work/perf/lifecycle-latency-benchmark.ts')
`
const child = spawn('podman', [
  'run',
  '--memory=2g',
  '--cpus=2',
  '--rm',
  '--env',
  'CLI_GIT_CAPTURE_LATENCY_BASELINE',
  '--env',
  `CLI_GIT_BENCHMARK_REVISION=${revision}`,
  '--env',
  'CLI_GIT_BENCHMARK_OUTPUT=/evidence/lifecycle-latency.json',
  '--volume',
  `${tarballPath}:/fixture/cli.tgz:ro,Z`,
  '--volume',
  `${evidenceRoot}:/evidence:rw,Z`,
  '--volume',
  `${join(packageRoot, 'perf')}:/work/perf:ro,Z`,
  '--tmpfs',
  '/work:rw,size=1g',
  'docker.io/library/node:24-slim',
  'node',
  '--input-type=module-typescript',
  '--eval',
  bootstrap,
], { stdio: 'inherit' })
const [code] = await once(child, 'exit')
if (code !== 0) throw new Error(`Lifecycle latency container exited with ${String(code)}`)
'''

[tasks.'perf:concurrent-commits']
description = "Measure packed concurrent-commit throughput, lock holds, and lost races in a bounded container"
depends = ["pack:npm"]
usage = '''
flag "--scenarios <ids>" help="Comma-separated scenario ids, measured in the listed order (default: the complete matrix)"
flag "--output <name>" help="Evidence file name under dist/perf" default="concurrent-commit-latency.json"
'''
shell = "node --input-type=module-typescript -e"
run = '''
const { execFile, spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { mkdir, readFile } = await import('node:fs/promises')
const { join } = await import('node:path')
const { promisify } = await import('node:util')
const packageRoot = process.cwd()
const evidenceRoot = join(packageRoot, 'dist/perf')
await mkdir(evidenceRoot, { recursive: true })
const execute = promisify(execFile)
const manifest = JSON.parse(await readFile(join(packageRoot, 'package.json'), 'utf8'))
const tarballName = `${manifest.name.replace('@', '').replace('/', '-')}-${manifest.version}.tgz`
const tarballPath = join(packageRoot, 'dist/pack', tarballName)
await readFile(tarballPath)
const { stdout: revisionOutput } = await execute('/usr/bin/git', ['rev-parse', 'HEAD'], { cwd: packageRoot })
const revision = revisionOutput.trim()
const bootstrap = `
const { execFile } = await import('node:child_process')
const { mkdir } = await import('node:fs/promises')
const { promisify } = await import('node:util')
const run = promisify(execFile)
await run('apt-get', ['update'])
await run('apt-get', ['install', '--yes', '--no-install-recommends', 'git'])
await mkdir('/work', { recursive: true })
await run('npm', ['init', '--yes'], { cwd: '/work' })
await run('npm', ['pkg', 'set', 'type=module'], { cwd: '/work' })
await run('npm', ['install', '--ignore-scripts', '/fixture/cli.tgz'], { cwd: '/work' })
await import('/work/perf/concurrent-commit-latency-benchmark.ts')
`
const child = spawn('podman', [
  'run',
  '--memory=2g',
  '--cpus=2',
  // An init reaps orphaned children; with the benchmark's Node as PID 1 they stay zombies
  // until the container's 2048-PID limit fails spawns with EAGAIN.
  '--init',
  '--rm',
  '--env',
  `CLI_GIT_BENCHMARK_REVISION=${revision}`,
  '--env',
  `CLI_GIT_BENCHMARK_OUTPUT=/evidence/${process.env.usage_output ?? 'concurrent-commit-latency.json'}`,
  '--env',
  `CLI_GIT_BENCHMARK_SCENARIOS=${process.env.usage_scenarios ?? ''}`,
  '--volume',
  `${tarballPath}:/fixture/cli.tgz:ro,Z`,
  '--volume',
  `${evidenceRoot}:/evidence:rw,Z`,
  '--volume',
  `${join(packageRoot, 'perf')}:/work/perf:ro,Z`,
  '--tmpfs',
  '/work:rw,size=1g',
  // Debian trixie: bookworm's Git 2.39.5 predates git merge-tree --merge-base (Git 2.40.0),
  // so every commit that loses a landing race there fails fast with head-moved instead of replaying.
  'docker.io/library/node:24-trixie-slim',
  'node',
  '--input-type=module-typescript',
  '--eval',
  bootstrap,
], { stdio: 'inherit' })
const [code] = await once(child, 'exit')
if (code !== 0) throw new Error(`Concurrent-commit benchmark container exited with ${String(code)}`)
'''

[tasks.'e2e:concurrent:trace']
description = "Mine anonymized commit shapes from repository history with real Git into e2e/commit-shape-trace.json"
# Runs on the host with /usr/bin/git, bypassing the wrapper; the output holds shapes only
# (no contents, paths, object IDs, messages, or author data).
usage = '''
flag "--repository <path>" help="Repository whose history is mined (default: this checkout)"
flag "--revision <rev>" help="Revision whose history is mined" default="HEAD"
flag "--limit <count>" help="Newest non-merge commits mined" default="4000"
'''
shell = "node --input-type=module-typescript -e"
run = '''
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const args = [
  ...(process.env.usage_repository ? ['--repository', process.env.usage_repository] : []),
  '--revision', process.env.usage_revision ?? 'HEAD',
  '--limit', process.env.usage_limit ?? '4000',
]
const child = spawn('node', ['e2e/commit-shape-trace-generator.ts', ...args], { stdio: 'inherit' })
const [code] = await once(child, 'exit')
if (code !== 0) throw new Error(`commit-shape trace generator exited with ${String(code)}`)
'''

[tasks.'test:e2e:concurrent:image']
description = "Build the concurrent-commit e2e image: Git 2.39.5, 2.40.0, and 2.55.0 from source, Node at the engines floor, packed cli-git"
depends = ["pack:npm"]
# Layer-cached: only the tarball layer rebuilds after a new pack. The build fetches Git sources
# (checksum-pinned) and the tarball's npm dependencies; the suite itself runs with --network=none.
shell = "node --input-type=module-typescript -e"
run = '''
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { readFile } = await import('node:fs/promises')
const { join } = await import('node:path')
const packageRoot = process.cwd()
// Derived, never spelled out, so a renamed package never mounts a stale tarball (see perf:lifecycle-latency).
const manifest = JSON.parse(await readFile(join(packageRoot, 'package.json'), 'utf8'))
const tarballName = `${manifest.name.replace('@', '').replace('/', '-')}-${manifest.version}.tgz`
const startedAt = performance.now()
const child = spawn('podman', [
  'build',
  '--memory=2g',
  '--tag', 'cli-git-concurrent-e2e',
  '--file', 'e2e/concurrent-commits.Containerfile',
  '--build-arg', `TARBALL=${tarballName}`,
  join(packageRoot, 'dist', 'pack'),
], { stdio: 'inherit' })
const [code] = await once(child, 'exit')
if (code !== 0) throw new Error(`concurrent e2e image build exited with ${String(code)}`)
console.log(`concurrent e2e image built in ${String(Math.round((performance.now() - startedAt) / 1000))} s`)
'''

[tasks.'test:e2e:concurrent']
description = "Replay concurrent-commit workloads through the packed wrapper on Git 2.39.5, 2.40.0, and 2.55.0 in a bounded, network-isolated container"
depends = ["test:e2e:concurrent:image"]
usage = '''
flag "--seed <seed>" help="Replay this decimal seed (printed by every run)"
flag "--scenario <names>" help="Comma-separated scenario names to run"
flag "--git <versions>" help="Comma-separated Git versions to run (2.39.5, 2.40.0, 2.55.0)"
'''
# Bounds per AGENTS.md BOX: 2 GiB, 2 CPUs, no network. Inputs are mounted read-only;
# repositories are created inside the container and discarded with it.
shell = "node --input-type=module-typescript -e"
run = '''
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { join } = await import('node:path')
const packageRoot = process.cwd()
const child = spawn('podman', [
  'run',
  '--memory=2g',
  '--cpus=2',
  '--rm',
  '--network=none',
  '--env', `E2E_SEED=${process.env.usage_seed ?? ''}`,
  '--env', `E2E_SCENARIOS=${process.env.usage_scenario ?? ''}`,
  '--env', `E2E_GIT_VERSIONS=${process.env.usage_git ?? ''}`,
  '--volume', `${join(packageRoot, 'e2e')}:/fixture/e2e:ro,Z`,
  '--volume', `${join(packageRoot, '..', '..', 'module', 'caught-value')}:/fixture/caught-value:ro,Z`,
  'cli-git-concurrent-e2e',
  'node',
  '/fixture/e2e/concurrent-e2e-consumer.ts',
], { stdio: 'inherit' })
const [code] = await once(child, 'exit')
if (code !== 0) throw new Error(`concurrent e2e container exited with ${String(code)}`)
'''
