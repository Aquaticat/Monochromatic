[package]
name = "git-policy-cli"
version = "0.0.1"
edition = "2024"
description = "Native repository-owned Git policy wrapper implementation."
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticat/Monochromatic.git"
# First crates.io publication requires separate approval; the TypeScript executable remains active meanwhile.
publish = false

[lib]
name = "git_policy_cli"
path = "src/native/lib.rs"

# The artifact is deliberately not named `git`: a `target/*/git` on PATH would shadow Git by accident.
# Installation wiring gives the executable its `git` name at cutover.
[[bin]]
name = "cli-git-native"
path = "src/native/main.rs"

# Consumer-level controls that start the built executable against real Git.
[[test]]
name = "native_binary"
path = "src/native/binary_tests.rs"

[dependencies]
# Both native tools use the already adopted comment-preserving JSONC foundation.
monochromatic-jsonc-edit = { path = "../../rust-module/jsonc-edit", version = "0.1.0" }

[lints.clippy]
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

[profile.release]
panic = "unwind"
overflow-checks = true

# The native implementation keeps the repository's standalone Cargo ownership convention.
[workspace]
