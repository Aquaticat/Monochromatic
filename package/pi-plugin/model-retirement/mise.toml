[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."test:unit"]
extends = "test:unit"
depends = ["build"]

[tasks."verify:extension"]
depends = ["build"]
run = "node src/mise.verify-extension.ts"

[tasks."verify:host"]
description = "Exercise built model retirement in a guarded disposable Pi host"
run = ["mise run //package/pi-plugin/model-retirement:build", "node src/verify-host.ts"]

[tasks."verify:host".env]
PI_MODEL_RETIREMENT_VERIFY_HOST = "1"
