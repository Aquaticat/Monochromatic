[vars]
# The full semantic lint uses both Node and Go workers. These are the worker
# settings verified under the session's 4-GiB aggregate cgroup limit; no rules are disabled.
auto_mode_lint_resources = """
process.env.OXLINT_THREADS = '1'
process.env.GOMEMLIMIT = '768MiB'
process.env.NODE_OPTIONS = `${process.env.NODE_OPTIONS ?? ''} --max-old-space-size=512`.trim()
"""

[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

# Preserve the inherited package configuration while accepting an explicit
# file subset for resource-bounded verification. No arguments still covers all files.
[tasks."lint:oxlint"]
extends = "lint:oxlint"
usage = 'arg "[args]" var=#true help="Package-relative source paths; omitted means the entire package"'
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
{{vars.auto_mode_lint_resources}}
ensureOxlintConfig()
runWorkspaceNode('package/dev-script/task-util', 'oxlint-wrapper', parseUsageArgs(process.env.usage_args ?? ''))
"""

[tasks."format:oxlint"]
extends = "format:oxlint"
usage = 'arg "[args]" var=#true help="Package-relative source paths; omitted means the entire package"'
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
{{vars.auto_mode_lint_resources}}
ensureOxlintConfig()
runWorkspaceNode('package/dev-script/task-util', 'oxlint-wrapper', ['--fix', ...parseUsageArgs(process.env.usage_args ?? '')])
"""

[tasks."test:unit"]
extends = "test:unit"

[tasks."dependencies:install"]
description = "Install declared native parsers and regenerate the workspace lock without lifecycle scripts"
run = "pnpm install --ignore-scripts"

[tasks."build:native"]
description = "Build the qualified native Pi source and owned runtime without private integration imports"
run = "node native/build.ts"

[tasks."build:native:owned"]
description = "Rebuild owned native transformations against the already emitted qualified Pi source"
run = "node native/build.ts --owned"

[tasks."test:native:domain"]
run = [
  "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/domain-frontier.test.mjs permission --require-resolution",
  "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/domain-frontier.test.mjs prohibition --require-resolution",
  "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/domain-frontier.test.mjs none --require-resolution",
]

[tasks."test:native:cli-manager"]
run = "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/cli-manager.test.mjs"

[tasks."test:native:approval"]
description = "Verify original approval routing and independent prerequisite evidence with fixture presentation"
run = [
  "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/approval-domain.test.mjs allow",
  "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/approval-domain.test.mjs deny",
  "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/approval-domain.test.mjs stop",
  "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/approval-domain.test.mjs missing",
  "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/approval-domain.test.mjs unsupported",
  "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/approval-domain.test.mjs unresolved",
  "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/approval-domain.test.mjs satisfied",
  "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/approval-domain.test.mjs bare",
  "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/approval-domain.test.mjs prohibited",
  "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/approval-domain.test.mjs retired",
]

[tasks."test:native:sdk-stream"]
run = "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/domain-frontier.test.mjs permission --require-resolution --sdk-stream"

[tasks."test:native:approval-context"]
description = "Exercise Pi's native extension context before and after reload with fixture UI responses"
run = [
  "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/approval-domain.test.mjs allow --native-context",
  "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/approval-domain.test.mjs deny --native-context",
  "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/approval-domain.test.mjs stop --native-context",
  "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/approval-domain.test.mjs allow --native-context --reload-context",
]

[tasks."native:cli"]
description = "Run the candidate owned native host; semantic admission remains unconfigured"
run = "node dist/native/cli.mjs"

[tasks."test:native:host-lifecycle"]
run = "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-host/lifecycle.test.mjs"

[tasks."test:native:cli-process"]
run = "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-host/process.test.mjs"

[tasks."test:native:serializer-receipts"]
run = [
  "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/domain-frontier.test.mjs permission --require-resolution --sdk-stream --copied-payload",
  "node --max-old-space-size=512 --import ./dist/native/loader.mjs ./dist/native/contract/integration/native-batch/domain-frontier.test.mjs permission --require-resolution --sdk-stream --copied-transcript",
]

[tasks."docs:render:native"]
run = [
  "mkdir --parents .cache/native-docs",
  "pandoc --from=commonmark --to=html --output=.cache/native-docs/integration.html README.md native/README.md ../../../doc/handover/pi-auto-mode-current-frontier.md ../../../doc/troubleshooting/pi-sdk-staging.md",
]
