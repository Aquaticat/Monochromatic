[vars]
# The full semantic lint uses both Node and Go workers. These are the worker
# settings verified under the session's 4-GiB aggregate cgroup limit; no rules are disabled.
auto_mode_lint_resources = """
process.env.OXLINT_THREADS = '1'
process.env.GOMAXPROCS = '2'
process.env.GOMEMLIMIT = '768MiB'
process.env.NODE_OPTIONS = `${process.env.NODE_OPTIONS ?? ''} --max-old-space-size=512`.trim()
"""

[tasks.build]
description = "Build maintained exports before the native host consumes them"
run = [
  "mise run //package/pi-plugin/auto-mode:build:js",
  "mise run //package/pi-plugin/auto-mode:build:native",
]

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:native:syntax"]
description = "Check every maintained native module with the consuming Node parser"
shell = "node --input-type=module-typescript -e"
run = """
const { readdir, readFile } = await import('node:fs/promises')
const { stripTypeScriptTypes } = await import('node:module')
const { join } = await import('node:path')
const { default: spawn } = await import('nano-spawn')
const paths = await readdir('native', { recursive: true })
const modules = paths.filter(function isModule(path) {
  return path.endsWith('.mjs') || path.endsWith('.ts')
})
for (const path of modules) {
  const filename = join('native', path)
  const source = await readFile(filename, 'utf8')
  const javascript = path.endsWith('.ts') ? stripTypeScriptTypes(source, { sourceUrl: filename }) : source
  try {
    await spawn(process.execPath, ['--check', '--input-type=module'], {
      stdin: { string: javascript }, stdout: 'inherit', stderr: 'inherit',
    })
  } catch (error) {
    throw new Error(`Native module failed syntax verification: ${filename}`, { cause: error })
  }
}
console.log(JSON.stringify({ complete: true, parsedNativeModules: modules.length }))
"""

# Preserve the inherited package configuration while accepting an explicit
# file subset for resource-bounded verification. No arguments still covers all files.
[tasks."lint:oxlint"]
extends = "lint:oxlint"
usage = 'arg "[args]" var=#true help="Package-relative source paths; omitted means the entire package"'
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
{{vars.auto_mode_lint_resources}}
ensureOxlintConfig()
runWorkspaceNode('package/dev-script/task-util', 'oxlint-wrapper', parseUsageArgs(process.env.usage_args ?? ''))
"""

[tasks."format:oxlint"]
extends = "format:oxlint"
usage = 'arg "[args]" var=#true help="Package-relative source paths; omitted means the entire package"'
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
{{vars.auto_mode_lint_resources}}
ensureOxlintConfig()
runWorkspaceNode('package/dev-script/task-util', 'oxlint-wrapper', ['--fix', ...parseUsageArgs(process.env.usage_args ?? '')])
"""

