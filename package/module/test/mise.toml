[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:browser"]
extends = "build:js:browser"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:browser"]
extends = "watch:build:js:browser"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
description = "Auto-fix this package or explicit package-relative paths"
usage = 'arg "[args]" var=#true help="Package-relative files to auto-fix; omitted means the package"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.parse_usage_args}}
{{vars.dispatch_workspace_node}}
ensureOxlintConfig()
runWorkspaceNode('package/dev-script/task-util', 'oxlint-wrapper', ['--fix', ...parseUsageArgs(process.env.usage_args ?? '')])
"""

[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"

[tasks.buildAndTest]
description = "Build the harness, then run every *.unit.test.ts in its own node process"
run = ["mise run build", "mise run test:unit"]
