assert.equal(process.env.DEPOT_CI_CASE,'logger','Route and selected source case differ');
assert.equal(logger.completeGraph,true,'Final route requires a frozen complete case manifest');
assert.equal(binding.sourceRevision,logger.sourceRevision);
assert.equal(binding.baseRevision,logger.baseRevision);
assert.equal(binding.manifestSha256,sha256(loggerBytes));
const workflowBytes=readFileSync(join(harness,workflowPath));
assert.deepEqual(workflowBytes,execFileSync('git',['show',`${harnessRevision}:${workflowPath}`],{cwd:harness,maxBuffer:16*1024*1024}));
const sourceRevision=git(source,['rev-parse','HEAD']);
assert.equal(sourceRevision,binding.sourceRevision);
const sourceStatus=git(source,['status','--porcelain','--untracked-files=no']);
assert.equal(sourceStatus,'','Cohort source has tracked modifications');
const identity={cohortId,cohortManifestPath:manifestPath,cohortManifestSha256:expectedSha256,cohortManifestBlobSha:blobSha,requestedAt,routeId,workflowPath,workflowSha256:sha256(workflowBytes),caseId:'logger',sourceRevision,baseRevision:logger.baseRevision,sourceTree:git(source,['rev-parse','HEAD^{tree}']),manifestSha256:sha256(loggerBytes),harnessRevision,harnessTree:git(harness,['rev-parse','HEAD^{tree}']),harnessStatus,sourceStatus};
const directory=process.env.DEPOT_COHORT_IDENTITY_OUTPUT_DIRECTORY??join(homedir(),'temp/agent/depot-complete-ci');
mkdirSync(directory,{recursive:true,mode:0o700});
if(phase==='after')assert.deepEqual(identity,JSON.parse(readFileSync(join(directory,'logger-cohort-before-results.json'),'utf8')).identity,'Before and after common cohort bindings differ');
const receipt={schemaVersion:1,phase,collectedAt:new Date().toISOString(),identity,host:{logicalCpus:cpus().length,availableParallelism:availableParallelism(),physicalMemoryBytes:totalmem()},runtimeProviderJobUrl:process.env.DEPOT_JOB_URL,providerUrlAssociationRequiresCollectedAttemptVerification:true};
writeFileSync(join(directory,`logger-cohort-${phase}-results.json`),JSON.stringify(receipt,null,2)+'\n',{flag:'wx',mode:0o600});
console.log(JSON.stringify({event:'common-cohort-verified',phase,cohortId,routeId,requestedAt,cohortManifestSha256:expectedSha256,manifestSha256:identity.manifestSha256,harnessRevision,sourceRevision}));
'''

