assert.equal(new Date(requestedAt).toISOString(),requestedAt,'Request instant must use canonical UTC ISO form');
const routeId=process.env.DEPOT_COHORT_ROUTE;
assert(['logger.combined','logger.browser'].includes(routeId),'A declared logger cohort route is required');
const workflowPath=process.env.DEPOT_COHORT_WORKFLOW;
assert(typeof workflowPath==='string'&&workflowPath.startsWith('.depot/workflows/')&&workflowPath.endsWith('.yml')&&posix.normalize(workflowPath)===workflowPath&&!workflowPath.split('/').includes('..'),'A canonical logger workflow path is required');
const sha256=bytes=>createHash('sha256').update(bytes).digest('hex');
const manifestPath=`doc/audit/depot-complete-cohort-${cohortId}.json`;
const endpoint=`repos/Aquaticats/Monochromatic/contents/${manifestPath.split('/').map(encodeURIComponent).join('/')}?ref=main`;
const object=JSON.parse(execFileSync('gh',['api','--method','GET','--header','Accept: application/vnd.github.object+json',endpoint],{encoding:'utf8',maxBuffer:4*1024*1024,timeout:30000}));
assert.equal(object.type,'file');
assert.equal(object.path,manifestPath);
assert.equal(object.encoding,'base64');
assert(Number.isInteger(object.size)&&object.size>0&&object.size<1024*1024,'Common manifest must be smaller than1MiB');
assert.equal(typeof object.content,'string');
const encoded=object.content.replaceAll('\r','').replaceAll('\n','');
const commonBytes=Buffer.from(encoded,'base64');
assert.equal(commonBytes.toString('base64'),encoded,'GitHub content must be canonical base64');
assert.equal(commonBytes.length,object.size);
assert.equal(sha256(commonBytes),expectedSha256,'Downloaded common cohort bytes differ from requested digest');
const blobSha=createHash('sha1').update(`blob ${commonBytes.length}\0`).update(commonBytes).digest('hex');
assert.equal(object.sha,blobSha,'GitHub content blob identity differs from decoded bytes');
const cohort=JSON.parse(commonBytes.toString('utf8'));
assert.equal(cohort.schemaVersion,1);
assert.equal(cohort.cohortId,cohortId);
const binding=cohort.cases?.logger;
const route=cohort.routes?.[routeId];
assert(binding&&route,'Common manifest must contain logger case and selected route');
assert.equal(route.caseId,'logger');
assert.equal(route.workflow,workflowPath);
assert(/^[a-f0-9]{40}$/u.test(route.harnessRevision),'Common route must pin a complete harness revision');
const harness=join(workspace,'harness');
const source=join(workspace,'source');
const git=(cwd,args)=>execFileSync('git',args,{cwd,encoding:'utf8',maxBuffer:16*1024*1024}).trim();
const harnessRevision=git(harness,['rev-parse','HEAD']);
