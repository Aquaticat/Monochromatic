[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"

[tasks.fuzz]
description = "Build module-logger, then run *.property.unit.test.ts as a time-budgeted fast-check campaign under node"
usage = '''
flag "--budget <ms>" help="Per-property time budget in milliseconds (default 60000)"
'''
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { glob } = await import('node:fs/promises')
const budget = (process.env.usage_budget ?? '60000').trim()
// Property files import the built module-logger entry points, so the runtime
// package's dist must be fresh before any property runs; rebuild it first to
// avoid chasing a bug the stale artifact has not yet seen fixed.
execFileSync('mise', ['run', '//package/module/logger:build'], { stdio: 'inherit' })
const files = []
for await (const file of glob('src/**/*.property.unit.test.ts')) { files.push(file) }
console.log(`Fuzz campaign over ${files.length} property files at ${budget}ms each`)
for (const file of files) {
  console.log(`fuzzing ${file}`)
  execFileSync('node', [file], { stdio: 'inherit', env: { ...process.env, LOGGER_FUZZ_BUDGET_MS: budget } })
}
"""
