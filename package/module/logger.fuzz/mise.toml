if(process.env.CI==='true'||process.env.GITHUB_ACTIONS==='true')assert.match(process.env.GITHUB_SHA??'',/^[a-f0-9]{40}$/u,'Provider harness revision is required in CI');
if(process.env.GITHUB_SHA)assert.equal(harnessRevision,process.env.GITHUB_SHA,'Provider harness revision differs from actual checkout');
const index=git(harness,['ls-files','-v','-z']).split('\0').filter(Boolean);
assert(index.every(entry=>entry[0]!=='S'&&!/[a-z]/u.test(entry[0])),'Harness index must not hide tracked inputs');
const harnessStatus=git(harness,['status','--porcelain','--untracked-files=no']);
assert.equal(harnessStatus,'','Cohort harness has tracked modifications');
const loggerBytes=readFileSync(join(harness,'.depot/manifests/logger.json'));
assert.deepEqual(loggerBytes,execFileSync('git',['show',`${harnessRevision}:.depot/manifests/logger.json`],{cwd:harness,maxBuffer:16*1024*1024}));
