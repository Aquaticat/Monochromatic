[tasks."trial:depot:cohort-identity"]
description = "Verify authenticated common cohort bytes and paired immutable logger route identities"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const {execFileSync}=await import('node:child_process');
