# Named `bundle:*`, not `build:*`: this sidecar ships nothing, and the browser
# property bundle is test tooling loaded by the Playwright harness page. A
# `build` task would mark the package as shipping an artifact, and the
# require-eventual-artifact lint would then reject every relative helper import
# in the test files here.
[tasks."bundle:browser-properties"]
description = "Bundle the browser property layer (fast-check, the neutral logger artifact, the properties) for the Playwright harness page"
extends = "build:js:client"

[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"

[tasks.fuzz]
description = "Build module-logger, then run *.property.unit.test.ts as a time-budgeted fast-check campaign under node"
usage = '''
flag "--budget <ms>" help="Per-property time budget in milliseconds (default 60000)"
'''
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { glob } = await import('node:fs/promises')
const budget = (process.env.usage_budget ?? '60000').trim()
// Property files import the built module-logger entry points, so the runtime
// package's dist must be fresh before any property runs; rebuild it first to
// avoid chasing a bug the stale artifact has not yet seen fixed.
execFileSync('mise', ['run', '//package/module/logger:build'], { stdio: 'inherit' })
const files = []
for await (const file of glob('src/**/*.property.unit.test.ts')) { files.push(file) }
console.log(`Fuzz campaign over ${files.length} property files at ${budget}ms each`)
for (const file of files) {
  console.log(`fuzzing ${file}`)
  execFileSync('node', [file], { stdio: 'inherit', env: { ...process.env, LOGGER_FUZZ_BUDGET_MS: budget } })
}
"""

[tasks."fuzz:coverage"]
description = "Deterministic V8 line-coverage reachability gate over the module-logger runtime src; --write refreezes the baseline"
usage = '''
flag "--write" help="Refreeze the committed baseline from this run instead of checking against it"
'''
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { mkdtempSync, rmSync } = await import('node:fs')
const { tmpdir } = await import('node:os')
const { join } = await import('node:path')
const root = process.cwd()
const mode = (process.env.usage_write === 'true') ? 'write' : 'check'
// The driver imports the module-logger package source through its `/ts` subpath,
// so no build step is needed; the report projects coverage onto the runtime
// package's src files (resolved through the same subpath), never this sidecar.
// `--localstorage-file` gives the process a real localStorage so that sink
// elects and its store paths run instead of the flagless short-circuit.
const dir = mkdtempSync(join(tmpdir(), 'logger-cov-'))
try {
  execFileSync('node', ['--localstorage-file', join(dir, 'localstorage.sqlite'), `${root}/src/coverage-driver.ts`], { stdio: 'inherit', env: { ...process.env, NODE_V8_COVERAGE: join(dir, 'v8') } })
  execFileSync('node', [`${root}/src/coverage-report.ts`, mode, join(dir, 'v8'), `${root}/coverage-baseline.json`], { stdio: 'inherit' })
} finally {
  rmSync(dir, { recursive: true, force: true })
}
"""

[tasks."trial:depot:remainder"]
description = "Run one explicit logger remainder partition against immutable source with retained prerequisite evidence"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync, spawnSync } = await import('node:child_process')
const { readFileSync, writeFileSync, mkdirSync, existsSync, chmodSync } = await import('node:fs')
const { createHash } = await import('node:crypto')
const { homedir } = await import('node:os')
const { join } = await import('node:path')
const { strict: assert } = await import('node:assert')
assert(process.env.GITHUB_WORKSPACE)
const harness = join(process.env.GITHUB_WORKSPACE, 'harness')
const source = join(process.env.GITHUB_WORKSPACE, 'source')
const manifestBytes = readFileSync(join(harness, '.depot/manifests/logger.json'))
const manifest = JSON.parse(manifestBytes)
const partitions = JSON.parse(readFileSync(join(harness, '.depot/manifests/logger-partitions.json'), 'utf8'))
assert.equal(partitions.manifestSha256, createHash('sha256').update(manifestBytes).digest('hex'))
assert.equal(partitions.sourceRevision, manifest.sourceRevision)
assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { cwd: source, encoding: 'utf8' }).trim(), manifest.sourceRevision)
const continuationId = process.env.DEPOT_LOGGER_CONTINUATION_ID
const selectionPlan = process.env.DEPOT_LOGGER_SELECTION_PLAN ?? 'development'
assert(['development', 'complete'].includes(selectionPlan), 'Unknown logger selection plan')
const selectionPath = selectionPlan === 'complete' ? '.depot/manifests/logger-complete-selectors.json' : '.depot/manifests/logger-continuation.json'
const continuationManifest = continuationId ? JSON.parse(readFileSync(join(harness, selectionPath), 'utf8')) : undefined
if (continuationManifest) {
  assert.equal(continuationManifest.manifestSha256, partitions.manifestSha256)
  assert.equal(continuationManifest.sourceRevision, manifest.sourceRevision)
}
const continuation = continuationManifest?.checks.find(item => item.name === continuationId)
if (continuationId) assert(continuation, 'Unknown logger continuation identity')
if (continuation) assert.equal(continuation.partition, process.env.DEPOT_CI_PARTITION)
const partition = continuation ? { name: continuation.partition, selectedCheckIds: continuation.selectedCheckIds, activeCheckIds: continuation.activeCheckIds } : partitions.partitions.find(item => item.name === process.env.DEPOT_CI_PARTITION)
assert(partition, 'Unknown logger remainder partition')
assert.equal(new Set(partition.selectedCheckIds).size, partition.selectedCheckIds.length)
assert(partition.selectedCheckIds.every(id => manifest.checks.some(check => check.id === id)))
const active = new Set(partition.selectedCheckIds)
const pending = [...active]
for (let index = 0; index < pending.length; index += 1) {
  const check = manifest.checks.find(item => item.id === pending[index])
  for (const id of check.prerequisites ?? []) {
    assert(manifest.checks.some(item => item.id === id), `Unknown prerequisite: ${id}`)
    if (active.has(id)) continue
    active.add(id)
    pending.push(id)
  }
}
assert.deepEqual([...active].sort(), [...partition.activeCheckIds].sort())
const directory = join(homedir(), 'temp/agent/depot-complete-ci')
mkdirSync(directory, { recursive: true, mode: 0o700 })
chmodSync(directory, 0o700)
writeFileSync(join(directory, 'logger-partition.json'), JSON.stringify({ ...partition, manifestSha256: partitions.manifestSha256, sourceRevision: partitions.sourceRevision, providerJobUrl: process.env.DEPOT_JOB_URL }, null, 2))
const suiteEnv = { ...process.env, DEPOT_CI_CASE: 'logger', DEPOT_CI_CHECK_IDS: JSON.stringify(partition.selectedCheckIds), DEPOT_CI_WORKERS: '1', DEPOT_CI_WAVE: 'all' }
const task = '//package/dev-script/task-util:trial:depot:ci:execute'
const executionBudgetMs = Number(process.env.DEPOT_LOGGER_EXECUTION_BUDGET_MS ?? 1440000)
assert(Number.isInteger(executionBudgetMs) && executionBudgetMs > 0 && executionBudgetMs <= 7200000, 'Logger execution budget must be a positive integer no greater than two hours')
let executionError
try {
if (partition.name !== 'fuzz') {
  execFileSync('mise', ['run', task], { cwd: harness, env: suiteEnv, stdio: 'inherit', timeout: executionBudgetMs })
} else {
  const name = `depot-logger-fuzz-${process.pid}`
  const marker = join(homedir(), `temp/agent/depot-fuzz-overlay-${process.pid}`)
  assert(!existsSync(marker))
  function podman({ args, required = true, inherit = false, limit = 60000 }) {
    const result = spawnSync('sudo', ['--non-interactive', 'podman', '--cgroup-manager=cgroupfs', ...args], { encoding: 'utf8', timeout: limit, ...(inherit ? { stdio: 'inherit' } : {}) })
    console.log(JSON.stringify({ event: 'fuzz-container-operation', operation: args[0], status: result.status, signal: result.signal, error: result.error?.message, stdout: result.stdout, stderr: result.stderr }))
    if (required) assert.equal(result.status, 0, `Container operation failed: ${args[0]}`)
    return result
  }
  let suite
  let cleanupVerified = false
  let evidenceCopied = true
  try {
    podman({ args: ['run', '--detach', '--init', '--name', name, '--network=none', '--memory=2g', '--cpus=2', '--pids-limit=512', `--timeout=${Math.ceil(executionBudgetMs / 1000) + 120}`, '--rootfs', '/:O', '/usr/bin/sleep', String(Math.ceil(executionBudgetMs / 1000) + 60)] })
    podman({ args: ['exec', '--user', `${process.getuid()}:${process.getgid()}`, name, 'touch', marker] })
    const allowedKeys = ['HOME', 'PATH', 'MISE_DATA_DIR', 'MISE_CONFIG_DIR', 'MISE_STATE_DIR', 'MISE_NODE_VERSION', 'MISE_PNPM_VERSION', 'MISE_BUN_VERSION', 'MISE_DENO_VERSION', 'MISE_LOCKED', 'MISE_AUTO_INSTALL', 'MISE_TRUSTED_CONFIG_PATHS', 'GITHUB_WORKSPACE', 'DEPOT_JOB_URL', 'DEPOT_CI_CASE', 'DEPOT_CI_CHECK_IDS', 'DEPOT_CI_WORKERS', 'DEPOT_CI_WAVE', 'OXLINT_THREADS', 'TSC_SINGLE_THREADED']
    const environment = allowedKeys.filter(key => suiteEnv[key] !== undefined).map(key => `${key}=${suiteEnv[key]}`)
    suite = podman({ args: ['exec', '--user', `${process.getuid()}:${process.getgid()}`, '--workdir', harness, name, 'env', '-i', ...environment, 'DEPOT_CI_CPUS=2', 'DEPOT_CI_MEMORY_GIB=2', 'CI=true', 'LANG=C.UTF-8', 'mise', 'run', task], required: false, inherit: true, limit: executionBudgetMs })
    for (const file of ['logger-results.json', 'check-logs']) {
      const copied = podman({ args: ['cp', `${name}:${directory}/${file}`, join(directory, file)], required: false })
      if (copied.status !== 0) evidenceCopied = false
    }
    execFileSync('sudo', ['--non-interactive', 'chown', '--recursive', `${process.getuid()}:${process.getgid()}`, directory], { stdio: 'inherit', timeout: 60000 })
  } finally {
    podman({ args: ['logs', name], required: false })
    podman({ args: ['stop', '--time=10', name], required: false })
    podman({ args: ['rm', name], required: false })
    cleanupVerified = podman({ args: ['container', 'exists', name], required: false }).status === 1 && !existsSync(marker)
    writeFileSync(join(directory, 'fuzz-container-results.json'), JSON.stringify({ exitCode: suite?.status ?? null, signal: suite?.signal ?? null, cleanupVerified, evidenceCopied, resources: { cpus: 2, memoryGiB: 2 }, network: 'none' }, null, 2))
  }
  assert(cleanupVerified, 'Fuzz overlay must be removed without modifying the host marker')
  assert(evidenceCopied, 'Fuzz records and logs must be copied before removing the overlay')
  assert.equal(suite?.status, 0, 'Fuzz partition checks failed; see retained per-check records')
}
const preparation = JSON.parse(readFileSync(join(directory, 'logger-remainder-preparation-results.json'), 'utf8'))
assert(!preparation.records.some(record => record.status === 'failed'), 'Independent checks completed, but preparation failures remain infrastructure failures')
} catch (error) {
  executionError = { name: error.name, message: error.message, code: error.code, status: error.status, signal: error.signal }
  throw error
} finally {
  if (continuation) {
    const resultPath = join(directory, 'logger-results.json')
    const results = existsSync(resultPath) ? JSON.parse(readFileSync(resultPath, 'utf8')).results : []
    const records = partition.selectedCheckIds.map(checkId => {
      const result = results.find(record => record.checkId === checkId)
      return result ? { checkId, status: result.status, skipReason: result.skipReason, startedAt: result.startedAt, finishedAt: result.finishedAt, exitCode: result.exitCode, signal: result.signal, outputSha256: result.outputSha256 } : { checkId, status: existsSync(join(directory, 'check-logs', `${checkId}.log`)) ? 'started-without-terminal-record' : 'unstarted' }
    })
    writeFileSync(join(directory, 'logger-continuation-results.json'), JSON.stringify({ sourceRevision: manifest.sourceRevision, manifestSha256: partitions.manifestSha256, continuationId, partition: partition.name, selectedCheckIds: partition.selectedCheckIds, activeCheckIds: partition.activeCheckIds, executionError, executionBudgetMs, records, providerJobUrl: process.env.DEPOT_JOB_URL }, null, 2))
  }
}
'''

[tasks."trial:depot:remainder:prepare"]
description = "Prepare explicit historical executables, offline Cargo inputs and disposable OpenTofu fixtures for logger remainder checks"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { spawnSync, execFileSync } = await import('node:child_process')
const { readFileSync, writeFileSync, mkdirSync, existsSync, appendFileSync, statSync } = await import('node:fs')
const { createHash } = await import('node:crypto')
const { homedir } = await import('node:os')
const { join } = await import('node:path')
const { strict: assert } = await import('node:assert')
assert(process.env.GITHUB_WORKSPACE)
const source = join(process.env.GITHUB_WORKSPACE, 'source')
const sourceRevision = 'ef01490f5e960f8ca0b424c12242caeb3c5a2b5e'
assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { cwd: source, encoding: 'utf8' }).trim(), sourceRevision)
const lock = readFileSync(join(source, 'mise.lock'), 'utf8')
const versions = new Map([...lock.matchAll(/^\[\[tools\.(?:"([^"]+)"|([^\]]+))\]\]\nversion = "([^"]+)"/gm)].map(match => [match[1] ?? match[2], match[3]]))
const partition = process.env.DEPOT_CI_PARTITION
assert(['containers', 'fuzz', 'mutation', 'native-mutation', 'pi-regression', 'regular', 'rust'].includes(partition))
const directory = join(homedir(), 'temp/agent/depot-complete-ci')
mkdirSync(directory, { recursive: true, mode: 0o700 })
const records = []
const env = { ...process.env, MISE_LOCKED: '1', MISE_RUST_VERSION: versions.get('rust'), CARGO_NET_OFFLINE: 'false' }
function run({ name, command, args, cwd = source, limit = 300000 }) {
  const startedAt = new Date().toISOString()
  const installing = command === 'mise' && args[0] === 'install'
  const invocation = command === 'mise' ? args : ['exec', '--', command, ...args]
  const result = spawnSync('mise', invocation, { cwd: installing ? join(process.env.GITHUB_WORKSPACE, 'harness') : cwd, env: installing ? { ...env, MISE_LOCKED: '0' } : env, encoding: 'utf8', timeout: limit, maxBuffer: 16 * 1024 * 1024 })
  const output = `${result.stdout ?? ''}${result.stderr ?? ''}`
  writeFileSync(join(directory, `prepare-${name}.log`), output, { mode: 0o600 })
  const record = { name, command, args, status: result.status === 0 ? 'passed' : 'failed', exitCode: result.status, signal: result.signal, error: result.error?.message, startedAt, finishedAt: new Date().toISOString(), outputSha256: createHash('sha256').update(output).digest('hex') }
  records.push(record)
  writeFileSync(join(directory, 'logger-remainder-preparation-results.json'), JSON.stringify({ sourceRevision, partition, records, providerJobUrl: process.env.DEPOT_JOB_URL }, null, 2))
  console.log(JSON.stringify(record))
  if (result.status !== 0) console.error(output.slice(-8000))
  return result
}
const requested = partition === 'regular' ? ['opentofu', 'npm:wrangler'] : partition === 'containers' ? ['cargo:cargo-fuzz'] : []
for (const name of requested) {
  assert(versions.has(name))
  run({ name: name.replaceAll(':', '-'), command: 'mise', args: ['install', `${name}@${versions.get(name)}`] })
}
if (['containers', 'native-mutation', 'rust'].includes(partition)) {
  for (const owner of ['package/git-policy/cli', 'package/git-policy/cli.fuzz', 'package/linter/monochromatic-lint']) run({ name: `cargo-fetch-${owner.split('/').slice(1).join('-')}`, command: 'cargo', args: ['fetch', '--locked', '--manifest-path', join(source, owner, 'Cargo.toml')] })
}
if (partition === 'containers') run({ name: 'rust-src', command: 'rustup', args: ['component', 'add', '--toolchain', versions.get('rust'), 'rust-src'] })
if (partition === 'rust') run({ name: 'windows-gnu-target', command: 'rustup', args: ['target', 'add', '--toolchain', versions.get('rust'), 'x86_64-pc-windows-gnu'] })
if (partition === 'native-mutation') {
  // Historical native mutation documentation and the measured host both use 27.1.0; the source lockfile does not own this executable.
  const version = '27.1.0'
  const cargoHome = process.env.CARGO_HOME ?? join(homedir(), '.cargo')
  run({ name: 'cargo-mutants-install', command: 'cargo-binstall', args: ['--no-confirm', '--strategies', 'crate-meta-data,quick-install', '--root', cargoHome, `cargo-mutants@${version}`] })
  const binary = join(cargoHome, 'bin/cargo-mutants')
  if (existsSync(binary)) {
    const result = run({ name: 'cargo-mutants-version', command: binary, args: ['mutants', '--version'] })
    assert.equal(result.stdout.trim(), `cargo-mutants ${version}`)
    records.push({ name: 'cargo-mutants-identity', version, sha256: createHash('sha256').update(readFileSync(binary)).digest('hex'), bytes: statSync(binary).size, sourceLockfileOwned: false })
  }
}
if (partition === 'regular') {
  run({ name: 'tofu-init', command: 'tofu', args: ['init', '-backend=false', '-input=false', '-no-color'], cwd: join(source, 'package/config/tofu') })
  const providerLock = join(source, 'package/config/tofu/.terraform.lock.hcl')
  if (existsSync(providerLock)) {
    const bytes = readFileSync(providerLock)
    writeFileSync(join(directory, 'tofu-providers.lock.hcl'), bytes)
    records.push({ name: 'tofu-provider-identity', sha256: createHash('sha256').update(bytes).digest('hex'), sourceLockfileOwned: false })
  }
  const fixtures = { 'cache_AS41231.txt': '192.0.2.0/24\n', 'cache_tor_relays.txt': '192.0.2.1/32', 'cache_resolved_hosts.json': '{"fixture.example.invalid":"192.0.2.2"}\n' }
  for (const [name, value] of Object.entries(fixtures)) {
    const path = join(source, 'package/config/tofu/src', name)
    if (existsSync(path)) assert.equal(readFileSync(path, 'utf8'), value, 'Only disposable known cache fixtures may be reused')
    else writeFileSync(path, value, { mode: 0o600, flag: 'wx' })
    records.push({ name: `tofu-fixture-${name}`, sha256: createHash('sha256').update(value).digest('hex'), bytes: Buffer.byteLength(value) })
  }
  appendFileSync(process.env.GITHUB_ENV, 'IPINFO_TOKEN=\n')
}
assert.equal(readFileSync(join(source, 'mise.lock'), 'utf8'), lock)
assert.equal(execFileSync('git', ['diff', '--name-only', 'HEAD'], { cwd: source, encoding: 'utf8' }).trim(), '', 'Preparation must preserve tracked source files')
writeFileSync(join(directory, 'logger-remainder-preparation-results.json'), JSON.stringify({ sourceRevision, partition, records, providerJobUrl: process.env.DEPOT_JOB_URL }, null, 2))
if (records.some(record => record.status === 'failed')) throw new Error('Remainder preparation failed; retained logs identify infrastructure prerequisites')
'''

[tasks."trial:depot:external"]
description = "Run explicit logger external checks with immutable identity and prerequisite records"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync, spawnSync } = await import('node:child_process')
const { readFileSync, writeFileSync, mkdirSync, existsSync, openSync, closeSync, lstatSync, readlinkSync } = await import('node:fs')
const { createHash } = await import('node:crypto')
const { homedir } = await import('node:os')
const { join } = await import('node:path')
const { strict: assert } = await import('node:assert')
const harness = join(process.env.GITHUB_WORKSPACE, 'harness')
const source = join(process.env.GITHUB_WORKSPACE, 'source')
const bytes = readFileSync(join(harness, '.depot/manifests/logger.json'))
const manifest = JSON.parse(bytes)
const digest = createHash('sha256').update(bytes).digest('hex')
assert.equal(digest, JSON.parse(readFileSync(join(harness, '.depot/manifests/logger-orchestrator.json'), 'utf8')).manifestSha256)
assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { cwd: source, encoding: 'utf8' }).trim(), manifest.sourceRevision)
const group = process.env.DEPOT_LOGGER_EXTERNAL
const groups = {
  browser: ['root.browser'],
  e2e: ['root.e2e'],
  electron: ['package.desktop-app.electron-counter.test.wayland', 'package.desktop-app.file-manager-electron.test.wayland'],
  generated: ['root.generated-consistency', 'sidecar.generated-type-consistency'],
  'root-lint': ['root.config-oxlint'],
  desktop: ['artifact.music-desktop-e2e'],
}
assert(Object.hasOwn(groups, group), 'Unknown logger external group')
const requested = process.env.DEPOT_LOGGER_EXTERNAL_IDS ? JSON.parse(process.env.DEPOT_LOGGER_EXTERNAL_IDS) : groups[group]
assert(Array.isArray(requested) && requested.length > 0 && new Set(requested).size === requested.length)
assert(requested.every(id => groups[group].includes(id)), 'External recovery must select known check identities')
const selected = requested.map(id => manifest.externalChecks.find(check => check.id === id))
assert(selected.every(Boolean))
const browserPartitionId = process.env.DEPOT_LOGGER_BROWSER_PARTITION
let browserPartition
let browserScope
let browserPartitionManifestSha256
if (browserPartitionId) {
  const partitionBytes = readFileSync(join(harness, '.depot/manifests/logger-browser-partitions.json'))
  const partitionManifest = JSON.parse(partitionBytes)
  browserPartitionManifestSha256 = createHash('sha256').update(partitionBytes).digest('hex')
  assert.equal(partitionManifest.manifestSha256, digest)
  assert.equal(partitionManifest.sourceRevision, manifest.sourceRevision)
  browserPartition = partitionManifest.partitions.find(partition => partition.id === browserPartitionId)
  assert(browserPartition && browserPartition.group === group)
  assert.deepEqual(requested, [browserPartition.checkId])
  const specification = selected[0]
  const full = partitionManifest.groups.find(item => item.group === group)
  assert.equal(full.checkId, specification.id)
  assert.equal(full.task, specification.task)
  assert.deepEqual(full.files, specification.args)
  assert.deepEqual(full.projects, specification.projects)
  assert(full.files.includes(browserPartition.file) && full.projects.includes(browserPartition.project))
  const configuration = readFileSync(join(source, full.configPath))
  assert.equal(createHash('sha256').update(configuration).digest('hex'), full.configSha256)
  browserScope = { ...browserPartition, fullFiles: full.files, fullProjects: full.projects, browserPartitionManifestSha256 }
}
const directory = join(homedir(), 'temp/agent/depot-complete-ci')
mkdirSync(join(directory, 'check-logs'), { recursive: true, mode: 0o700 })
const records = []
const generatedConsumers = []
function run({ id, command = 'mise', args, cwd = source, env = process.env, limit = 1200000 }) {
  const startedAt = new Date().toISOString()
  const log = join(directory, 'check-logs', `${id}.log`)
  const descriptor = openSync(log, 'w', 0o600)
  let result
  try { result = spawnSync(command, args, { cwd, env, stdio: ['ignore', descriptor, descriptor], timeout: limit }) }
  finally { closeSync(descriptor) }
  const output = readFileSync(log)
  const record = { checkId: id, command, args, cwd, startedAt, finishedAt: new Date().toISOString(), exitCode: result.status, signal: result.signal, error: result.error?.message, errorCode: result.error?.code, termination: result.error?.code === 'ETIMEDOUT' ? 'adapter-time-budget' : result.error ? 'spawn-error' : result.signal ? 'signal' : 'process-exit', executionBudgetMs: limit, status: result.status === 0 ? 'passed' : 'failed', ...(browserPartition && id === browserPartition.checkId ? { partitionId: browserPartition.id, partitionFile: browserPartition.file, partitionProject: browserPartition.project, coversWholeCheck: false, browserPartitionManifestSha256 } : {}), outputLog: log, outputSha256: createHash('sha256').update(output).digest('hex'), outputBytes: output.length }
  records.push(record)
  writeFileSync(join(directory, `logger-external-${group}-results.json`), JSON.stringify({ sourceRevision: manifest.sourceRevision, manifestSha256: digest, group, selectedCheckIds: requested, providerJobUrl: process.env.DEPOT_JOB_URL, generatedConsumers, records }, null, 2))
  console.log('\n' + JSON.stringify(record))
  if (result.status !== 0) console.error(output.subarray(-16000).toString())
  return record
}
const prerequisiteIds = [...new Set(selected.flatMap(check => check.prerequisites ?? []))]
if (prerequisiteIds.length) run({ id: `external-${group}-prerequisites`, args: ['run', '//package/dev-script/task-util:trial:depot:ci:execute'], cwd: harness, env: { ...process.env, DEPOT_CI_CHECK_IDS: JSON.stringify(prerequisiteIds), DEPOT_CI_WORKERS: '1', DEPOT_CI_WAVE: 'all' } })
const resultPath = join(directory, 'logger-results.json')
const prerequisiteResults = prerequisiteIds.length && existsSync(resultPath) ? JSON.parse(readFileSync(resultPath, 'utf8')).results : []
if (group === 'generated') {
  for (const check of selected) {
    for (const [index, task] of (check.task ? [check.task] : check.tasks).entries()) {
      const label = `${check.id}.${index}`, fixture = join(directory, `logger-generated-${label}`)
      const env = { ...process.env, GIT_LFS_SKIP_SMUDGE: '1', MISE_TRUSTED_CONFIG_PATHS: `${process.env.MISE_TRUSTED_CONFIG_PATHS}:${fixture}`, DEPOT_LOGGER_GENERATED_CONSUMER: fixture, DEPOT_LOGGER_GENERATED_LABEL: label }
      const consumer = { checkId: check.id, task, args: ['run', task], fixture, initialIdentityVerified: false, actualCommandExecuted: false, cleanupVerified: false }
      generatedConsumers.push(consumer)
      try {
        execFileSync('git', ['worktree', 'add', '--detach', fixture, manifest.sourceRevision], { cwd: source, env, stdio: 'inherit' })
        const prepare = run({ id: `${label}.frozen-install`, args: ['run', 'prepare:pnpm:install', '--', '--frozen-lockfile'], cwd: fixture, env })
        assert.equal(prepare.status, 'passed', 'Generated consumer frozen dependency preparation failed')
        const before = run({ id: `${label}.identity-before`, args: ['run', '//package/module/logger.fuzz:trial:depot:generated:identity'], cwd: harness, env: { ...env, DEPOT_LOGGER_GENERATED_PHASE: 'before' } })
        assert.equal(before.status, 'passed', 'Generated consumer initial input or dependency identity failed')
        consumer.initialIdentityVerified = true
        const observed = run({ id: index === 0 ? check.id : `${check.id}.declared`, args: ['run', task], cwd: fixture, env })
        consumer.actualCommandExecuted = observed.termination !== 'spawn-error'
        observed.parentCheckId = check.id
        const patch = join(directory, `${label}.patch`), descriptor = openSync(patch, 'wx', 0o600)
        try { execFileSync('git', ['diff', '--binary', manifest.sourceRevision], { cwd: fixture, stdio: ['ignore', descriptor, 'inherit'] }) }
        finally { closeSync(descriptor) }
        const diff = readFileSync(patch)
        const changedPaths = execFileSync('git', ['diff', '--name-only', '-z', manifest.sourceRevision], { cwd: fixture, encoding: 'utf8' }).split('\0').filter(Boolean)
        const changedFiles = changedPaths.map(path => {
          const absolute = join(fixture, path)
          if (!existsSync(absolute)) return { path, deleted: true }
          const stat = lstatSync(absolute), bytes = stat.isSymbolicLink() ? Buffer.from(readlinkSync(absolute)) : readFileSync(absolute)
          return { path, sha256: createHash('sha256').update(bytes).digest('hex'), bytes: bytes.length, mode: stat.mode & 0o777 }
        })
        const untracked = execFileSync('git', ['ls-files', '--others', '--exclude-standard', '-z'], { cwd: fixture, encoding: 'utf8' }).split('\0').filter(Boolean)
        const headAfter = execFileSync('git', ['rev-parse', 'HEAD'], { cwd: fixture, encoding: 'utf8' }).trim()
        consumer.processExitCode = observed.exitCode
        consumer.processTermination = observed.termination
        consumer.headAfter = headAfter
        consumer.changedTrackedBytes = diff.length
        consumer.diffSha256 = createHash('sha256').update(diff).digest('hex')
        consumer.changedFiles = changedFiles
        consumer.untracked = untracked
        consumer.authoredGeneratedOutputDrift = Boolean(diff.length || untracked.length || headAfter !== manifest.sourceRevision)
        observed.changedTrackedBytes = diff.length
        observed.generatedConsumer = label
        if (consumer.authoredGeneratedOutputDrift) observed.status = 'failed'
        const after = run({ id: `${label}.identity-after`, args: ['run', '//package/module/logger.fuzz:trial:depot:generated:identity'], cwd: harness, env: { ...env, DEPOT_LOGGER_GENERATED_PHASE: 'after' } })
        consumer.authoritativeAfterVerified = after.status === 'passed'
      } catch (error) {
        consumer.error = { name: error.name, message: error.message, code: error.code }
        consumer.disposition = consumer.actualCommandExecuted ? 'consumer-observation-failed' : 'unexecuted-prerequisite-failed'
      } finally {
        if (existsSync(fixture)) {
          const observe = (command, args) => { const result = spawnSync(command, args, { cwd: fixture, encoding: 'utf8', timeout: 60000 }); return { command, args, exitCode: result.status, stdout: result.stdout, stderr: result.stderr, error: result.error?.message } }
          consumer.cleanupIgnoredDryRun = observe('git', ['clean', '--dry-run', '-d', '-X'])
          consumer.rootGitDirProbe = observe('ls', ['--directory', '--', 'HEAD', 'config', 'hooks', 'objects', 'refs'])
          consumer.rootGitDirIgnoreProbe = observe('git', ['check-ignore', '--verbose', '--', 'HEAD', 'config', 'hooks', 'objects', 'refs'])
          const removed = spawnSync('git', ['worktree', 'remove', '--force', fixture], { cwd: source, encoding: 'utf8', timeout: 180000 })
          consumer.cleanupResult = { exitCode: removed.status, stdout: removed.stdout, stderr: removed.stderr, error: removed.error?.message }
          const inventory = execFileSync('git', ['worktree', 'list', '--porcelain'], { cwd: source, encoding: 'utf8' })
          consumer.cleanupVerified = removed.status === 0 && !existsSync(fixture) && !inventory.includes('worktree ' + fixture + '\n')
        }
        writeFileSync(join(directory, `generated-${label}-results.json`), JSON.stringify(consumer, null, 2) + '\n', { flag: 'wx', mode: 0o600 })
      }
    }
  }
} else if (group === 'desktop') {
  run({ id: 'external-desktop-host', args: ['run', '//package/dev-script/task-util:trial:depot:ci:desktop-host'], cwd: harness })
  run({ id: 'external-desktop-compositor', args: ['run', '//package/cli/nested-wayland-session:build'] })
  run({ id: 'external-desktop-artifact', args: ['run', '//package/music-player/desktop-app:build'] })
  run({ id: 'artifact.music-desktop-e2e', args: ['run', '//package/dev-script/task-util:trial:depot:ci:desktop-runtime'], cwd: harness, limit: 7200000 })
} else if (group === 'electron') {
  run({ id: 'external-electron-compositor', args: ['run', '//package/cli/nested-wayland-session:build'] })
  const runtime = join(directory, 'electron-runtime')
  mkdirSync(runtime, { recursive: true, mode: 0o700 })
  const compositor = join(source, 'package/cli/nested-wayland-session/target/release/monochromatic-nested-wayland-session')
  for (const check of selected) {
    run({ id: check.id, command: compositor, args: ['--headless', '--gpu', 'software', '--socket', join(runtime, `${check.packages[0].split('/').at(-1)}.sock`), '--size', '1920x1080', '--', 'mise', 'run', check.task], env: { ...process.env, XDG_RUNTIME_DIR: runtime, LIBGL_ALWAYS_SOFTWARE: '1' }, limit: 600000 })
  }
} else {
  for (const check of selected) {
    const failed = (check.prerequisites ?? []).filter(id => prerequisiteResults.find(record => record.checkId === id)?.status !== 'passed')
    if (failed.length) {
      records.push({ checkId: check.id, status: 'skipped', failedPrerequisites: failed, finishedAt: new Date().toISOString() })
      continue
    }
    const args = browserPartition ? [browserPartition.file] : check.args ?? []
    run({ id: check.id, args: ['run', check.task, ...(args.length ? ['--', ...args] : [])], env: browserScope ? { ...process.env, DEPOT_LOGGER_BROWSER_SCOPE: JSON.stringify(browserScope) } : process.env })
  }
}
assert.equal(execFileSync('git', ['diff', '--name-only', 'HEAD'], { cwd: source, encoding: 'utf8' }).trim(), '', 'External checks must preserve tracked source')
writeFileSync(join(directory, `logger-external-${group}-results.json`), JSON.stringify({ sourceRevision: manifest.sourceRevision, manifestSha256: digest, group, selectedCheckIds: requested, browserPartition, browserPartitionManifestSha256, coversWholeCheck: !browserPartition, prerequisiteIds, providerJobUrl: process.env.DEPOT_JOB_URL, generatedConsumers, records }, null, 2))
assert(generatedConsumers.every(consumer => consumer.initialIdentityVerified && consumer.actualCommandExecuted && consumer.authoritativeAfterVerified && consumer.cleanupVerified && !consumer.error), 'Generated consumer prerequisite, observation or cleanup remained incomplete')
assert(records.every(record => record.status === 'passed'), 'Logger external checks failed or lack verified prerequisites; see retained records')
'''

[tasks."trial:depot:prerequisites"]
description = "Prepare locked logger executables and offline Cargo inputs before selected checks"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { spawnSync, execFileSync } = await import('node:child_process')
const { readFileSync, writeFileSync, mkdirSync, appendFileSync } = await import('node:fs')
const { homedir } = await import('node:os')
const { join } = await import('node:path')
const { createHash } = await import('node:crypto')
const { strict: assert } = await import('node:assert')
const source = join(process.env.GITHUB_WORKSPACE, 'source')
const harness = join(process.env.GITHUB_WORKSPACE, 'harness')
const lock = readFileSync(join(source, 'mise.lock'), 'utf8')
const versions = new Map([...lock.matchAll(/^\[\[tools\.(?:"([^"]+)"|([^\]]+))\]\]\nversion = "([^"]+)"/gm)].map(match => [match[1] ?? match[2], match[3]]))
const directory = join(homedir(), 'temp/agent/depot-complete-ci')
mkdirSync(directory, { recursive: true, mode: 0o700 })
const records = []
function run({ name, args, cwd = source, env = process.env, limit = 300000 }) {
  const startedAt = new Date().toISOString()
  const result = spawnSync('mise', args, { cwd, env, timeout: limit, encoding: 'utf8', maxBuffer: 32 * 1024 * 1024 })
  const output = `${result.stdout ?? ''}${result.stderr ?? ''}`
  writeFileSync(join(directory, `prepare-${name}.log`), output, { mode: 0o600 })
  const record = { name, args, startedAt, finishedAt: new Date().toISOString(), exitCode: result.status, signal: result.signal, error: result.error?.message, status: result.status === 0 ? 'passed' : 'failed', outputSha256: createHash('sha256').update(output).digest('hex') }
  records.push(record)
  writeFileSync(join(directory, 'logger-global-preparation-results.json'), JSON.stringify({ sourceRevision: execFileSync('git', ['rev-parse', 'HEAD'], { cwd: source, encoding: 'utf8' }).trim(), sourceLockSha256: createHash('sha256').update(lock).digest('hex'), records }, null, 2))
  console.log(JSON.stringify(record))
  if (result.status !== 0) console.error(output.slice(-8000))
}
for (const name of ['bun', 'npm:pagefind', 'cargo:cargo-fuzz', 'cargo:monochromatic-nested-wayland-session']) {
  assert(versions.has(name))
  run({ name: name.replaceAll(':', '-'), args: ['install', `${name}@${versions.get(name)}`], cwd: harness, env: { ...process.env, MISE_LOCKED: '0' } })
}
const snapshotDirectory = join(homedir(), 'temp/agent/depot-package-snapshot')
const snapshot = JSON.parse(readFileSync(join(snapshotDirectory, 'manifest.json'), 'utf8'))
const imageMagick = join(snapshotDirectory, 'bin/magick')
assert.equal(execFileSync(imageMagick, ['--version'], { encoding: 'utf8' }), snapshot.magickVersion)
appendFileSync(process.env.GITHUB_PATH, `${join(snapshotDirectory, 'bin')}\n`)
// The historical task selects latest without a lock entry. Retain the same 2.2.0 conformance executable already exercised in the TOML case.
run({ name: 'toml-test-install', args: ['install', 'github:toml-lang/toml-test@2.2.0'], cwd: harness, env: { ...process.env, MISE_LOCKED: '0' } })
run({ name: 'toml-test-version', args: ['exec', 'github:toml-lang/toml-test@2.2.0', '--', 'toml-test', 'version'] })
for (const owner of ['package/git-policy/cli', 'package/git-policy/cli.fuzz', 'package/linter/monochromatic-lint']) {
  run({ name: `cargo-fetch-${owner.split('/').slice(1).join('-')}`, args: ['exec', '--', 'cargo', 'fetch', '--locked', '--manifest-path', join(source, owner, 'Cargo.toml')], env: { ...process.env, CARGO_NET_OFFLINE: 'false' } })
}
assert.equal(readFileSync(join(source, 'mise.lock'), 'utf8'), lock)
assert.equal(execFileSync('git', ['diff', '--name-only', 'HEAD'], { cwd: source, encoding: 'utf8' }).trim(), '')
assert(records.every(record => record.status === 'passed'), 'Logger prerequisite preparation failed; independent checks still need execution')
'''

