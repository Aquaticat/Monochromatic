assert(['before','after'].includes(phase),'Identity phase must be before or after');
const cohortId=process.env.DEPOT_COHORT_ID;
assert(typeof cohortId==='string'&&/^[A-Za-z0-9._-]{1,128}$/u.test(cohortId),'A safe common cohort ID is required');
