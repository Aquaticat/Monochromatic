[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"

[tasks.buildAndTest]
description = "Build the node bundle, then run unit tests against the built dist"
run = ["mise run build", "mise run test:unit"]

[tasks."corpus-pass"]
description = "Run the pipeline over every complete corpus pair; artifacts land in node_modules/.monochromatic (append -- --plan for a zero-quota setup check)"
run = "node src/corpus-run/corpus-pass.ts"

[tasks."sentinel-probe"]
description = "Run named corpus entries through the pipeline to validate a change (pass ids after --)"
run = "node src/corpus-run/sentinel-probe.ts"

[tasks."draw-sample"]
description = "Draw the stratified precision sample from settled artifacts into a grading sheet outside the repo (append -- --final for the gate sheet)"
run = "node src/corpus-run/draw-sample.ts"

[tasks."score-attribution"]
description = "Report per-critic calibration from a run's settled artifacts: what each critic was asked, what it raised, and how often an accepted issue rested on it alone"
run = "node src/corpus-run/score-attribution.ts"

[tasks."score-agreement"]
description = "Report precision off a graded sheet, plus agreement against blind pre-grades when they exist (override with -- --sheet PATH --pre-grades PATH)"
run = "node src/corpus-run/score-agreement.ts"

[tasks."score-probe"]
description = "Report what the shadow-mode introduced-defect probe found across a run's settled artifacts, over distinct shipped regions"
run = "node src/corpus-run/score-probe.ts"

[tasks."recall-benchmark"]
description = "Measure recall: plant known omissions into clean translations, run the repair loop, and grade restoration against the deletions (append -- --plan for a zero-quota setup check)"
run = "node src/corpus-run/recall-benchmark.ts"

[tasks."probe-sensitivity"]
description = "Ask whether the introduced-defect probe can detect damage at all: one clean region and two with damage injected, cat-themed fixtures only"
run = "node src/corpus-run/probe-sensitivity.ts"

[tasks."translate-probe"]
description = "PROTOTYPE for #70: ask a translator ensemble to render the corpus section with the worst coverage gap, which the repair loop cannot express"
run = "node src/corpus-run/translate-probe.ts"

[tasks."damage-sample"]
description = "Draw shipped regions at random and ask a human the same source-anchored damage question the probe asks, with the probe's verdict kept in the manifest"
run = "node src/corpus-run/damage-sample.ts"

[tasks."probe-verify"]
description = "Probe damaged and unread regions with the accepted issues withheld, and write one blind sheet asking whether each flagged edit really damaged the text"
run = "node src/corpus-run/probe-verify.ts"

[tasks."score-verify"]
description = "Join the graded blind verification sheet to its manifest and report what the unlabelled probe's flags are worth on regions nobody had read"
run = "node src/corpus-run/score-verify.ts"

[tasks."probe-relabel"]
description = "Re-probe the regions a human read as damaged, once with the accepted issues shown and once withheld, to separate a suppressing label from a hard judgement"
run = "node src/corpus-run/probe-relabel.ts"

[tasks."model-health"]
description = "Ask every roster model one trivial structured question and report what came back, so schema-mismatch can be told apart from a dead model"
run = "node src/corpus-run/model-health.ts"
[tasks."checker-sensitivity"]
description = "Ask whether the resolution checkers can say no: a genuine fix, an untouched text, and a fix that damaged its slice, cat-themed fixtures only"
run = "node src/corpus-run/checker-sensitivity.ts"
