[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"

[tasks.buildAndTest]
description = "Build the node bundle, then run unit tests against the built dist"
run = ["mise run build", "mise run test:unit"]

[tasks."corpus-pass"]
description = "Run the pipeline over every complete corpus pair; artifacts land in node_modules/.monochromatic (append -- --plan for a zero-quota setup check, or -- --only Id1,Id2 to target named entries, which wants a throwaway TRANSLATION_REPAIR_RUNS_DIR)"
depends = ["build"]
run = "node dist/final/node/corpus-pass.mjs"

[tasks."sentinel-probe"]
description = "Run named corpus entries through the pipeline to validate a change (pass ids after --)"
depends = ["build"]
run = "node dist/final/node/sentinel-probe.mjs"

[tasks."draw-sample"]
description = "Draw the stratified precision sample from settled artifacts into a grading sheet outside the repo (append -- --final for the gate sheet)"
depends = ["build"]
run = "node dist/final/node/draw-sample.mjs"

[tasks."score-attribution"]
description = "Report per-critic calibration from a run's settled artifacts: what each critic was asked, what it raised, and how often an accepted issue rested on it alone"
depends = ["build"]
run = "node dist/final/node/score-attribution.mjs"

[tasks."score-agreement"]
description = "Report precision off a graded sheet, plus agreement against blind pre-grades when they exist (override with -- --sheet PATH --pre-grades PATH)"
depends = ["build"]
run = "node dist/final/node/score-agreement.mjs"

[tasks."score-crosscheck"]
description = "Report the population a judge crosscheck would run over, per author and per arm, spending no quota"
depends = ["build"]
run = "node dist/final/node/score-crosscheck.mjs"

[tasks."score-probe"]
description = "Report what the shadow-mode introduced-defect probe found across a run's settled artifacts, over distinct shipped regions"
depends = ["build"]
run = "node dist/final/node/score-probe.mjs"

[tasks."recall-benchmark"]
description = "Measure recall: plant known omissions into clean translations, run the repair loop, and grade restoration against the deletions (append -- --plan for a zero-quota setup check)"
depends = ["build"]
run = "node dist/final/node/recall-benchmark.mjs"

[tasks."probe-sensitivity"]
description = "#247: ask whether the introduced-defect probe can detect damage at all, each region under three prior-issue lists (none, withheld from the prompt as production sends, rendered as the abandoned prompt did), cat-themed fixtures only; SPENDS QUOTA"
depends = ["build"]
run = "node dist/final/node/probe-sensitivity.mjs"

[tasks."audit-sensitivity"]
description = "Ask whether the rendering audit can detect a planted defect at all, and whether it invents one: one flipped rendering and one faithful, cat-themed fixtures only; SPENDS QUOTA"
depends = ["build"]
run = "node dist/final/node/audit-sensitivity.mjs"

[tasks."rendering-audit-settled"]
description = "#115: run the rendering audit over every decided slice of every settled version 2 artifact in an archive, reading retained and replaced slices apart; TELEMETRY ONLY, nothing it says gates what ships; SPENDS QUOTA unless --cap 0 (pass --archive dir, --clone dir, --only ids, --cap n after --)"
depends = ["build"]
run = "node dist/final/node/rendering-audit-settled.mjs"

[tasks."rendering-audit-settled-report"]
description = "#115: read a persisted settled-audit run: the archive and fresh halves apart, what each auditor thought was worth a claim, and the #107 relocation candidates; SPENDS NO QUOTA (pass --run path after -- to read a run other than the newest)"
depends = ["build"]
run = "node dist/final/node/rendering-audit-settled-report.mjs"

[tasks."prototype-accountable-editor"]
description = "PROTOTYPE: run superseded five-payload accountable-editor design over Carena fixture; SPENDS QUOTA"
depends = ["build"]
run = "node dist/final/node/prototype-accountable-editor.mjs"

[tasks."prototype-brief-editor"]
description = "PROTOTYPE: run Candidate C brief-before-prose finite DAG on Carena; SPENDS QUOTA"
depends = ["build"]
run = "node dist/final/node/prototype-brief-editor.mjs"

[tasks."prototype-brief-editor-controls"]
description = "PROTOTYPE: run Candidate C local controls"
depends = ["build"]
run = "node dist/final/node/prototype-brief-editor-controls.mjs"

[tasks."prototype-conditional-audit-calibration"]
description = "PROTOTYPE: calibrate Candidate E quote-bound auditors against retained Carena outputs; SPENDS QUOTA"
depends = ["build"]
run = "node dist/final/node/prototype-conditional-audit-calibration.mjs"

[tasks."prototype-conditional-audit-controls"]
description = "PROTOTYPE: run Candidate E quote-bound audit local controls"
depends = ["build"]
run = "node dist/final/node/prototype-conditional-audit-controls.mjs"

[tasks."prototype-conditional-audit-replay"]
description = "PROTOTYPE: replay Candidate E1 double-prime admission over retained Carena auditor replies"
depends = ["build"]
run = "node dist/final/node/prototype-conditional-audit-replay.mjs"

[tasks."prototype-conditional-shell"]
description = "PROTOTYPE: run Candidate E1 double-prime conditional immutable-shell graph on Carena; SPENDS QUOTA"
depends = ["build"]
run = "node dist/final/node/prototype-conditional-shell.mjs"

[tasks."prototype-hyper-reserve-evaluation"]
description = "PROTOTYPE: evaluate MiniMax M3 as Hyper reserve author and auditor on Carena; SPENDS QUOTA"
depends = ["build"]
run = "node dist/final/node/prototype-hyper-reserve-evaluation.mjs"

[tasks."prototype-hyper-roster-expansion"]
description = "PROTOTYPE: evaluate live out-of-roster Hyper models equally on Carena; SPENDS QUOTA"
depends = ["build"]
run = "node dist/final/node/prototype-hyper-roster-expansion.mjs"

[tasks."prototype-immutable-shell"]
description = "PROTOTYPE: run Candidate D immutable-shell candidate graph on Carena; SPENDS QUOTA"
depends = ["build"]
run = "node dist/final/node/prototype-immutable-shell.mjs"

[tasks."prototype-immutable-shell-controls"]
description = "PROTOTYPE: run Candidate D local controls"
depends = ["build"]
run = "node dist/final/node/prototype-immutable-shell-controls.mjs"

[tasks."provider-concurrency-aggregate-probe"]
description = "PROTOTYPE: measure live aggregate Synthetic concurrency across active models; SPENDS QUOTA"
depends = ["build"]
run = "node dist/final/node/provider-concurrency-aggregate-probe.mjs"

[tasks."provider-concurrency-probe"]
description = "PROTOTYPE: measure live same-model provider concurrency with unique tiny tasks; SPENDS QUOTA"
depends = ["build"]
run = "node dist/final/node/provider-concurrency-probe.mjs"

[tasks."prototype-serial-controls"]
description = "PROTOTYPE: run provider-free serial producer transaction controls"
depends = ["build"]
run = "node dist/final/node/prototype-serial-controls.mjs"

[tasks."prototype-serial-producers"]
description = "PROTOTYPE: run corrected four-payload serial producer design over Carena fixture; SPENDS QUOTA"
depends = ["build"]
run = "node dist/final/node/prototype-serial-producers.mjs"

[tasks."prototype-specification-compiler"]
description = "PROTOTYPE: run Candidate B finite specification compiler on Carena; SPENDS QUOTA"
depends = ["build"]
run = "node dist/final/node/prototype-specification-compiler.mjs"

[tasks."prototype-specification-compiler-controls"]
description = "PROTOTYPE: run Candidate B local controls"
depends = ["build"]
run = "node dist/final/node/prototype-specification-compiler-controls.mjs"

[tasks."coverage-probe"]
description = "PROTOTYPE for question 28: ask a roster whether the translation already carries each passage the aligners refuse to pair, at both scales; SPENDS QUOTA (pass --only ids and --cap n after --)"
depends = ["build"]
run = "node dist/final/node/coverage-probe.mjs"

[tasks."coverage-control-probe"]
description = "#106: ask the coverage roster about a passage, delete the spans it anchored on, and ask again, to find out whether an absence vote is reachable at all; SPENDS QUOTA (pass --only ids after --)"
depends = ["build"]
run = "node dist/final/node/coverage-control-probe.mjs"

[tasks."run-timing-report"]
description = "#215: read back where a run's wall-clock went, splitting every round into the time it worked and the time it waited on a straggler, and counting how many calls were in flight at once; SPENDS NO QUOTA (name one or more log paths after --)"
depends = ["build"]
run = "node dist/final/node/run-timing-report.mjs"

[tasks."spend-report"]
description = "#210: read what a run cost from the SPEND lines its own log carries, priced against a DATED Charm Hyper rate table; subscription seats are counted but never priced; SPENDS NO QUOTA (name one or more log paths after --)"
depends = ["build"]
run = "node dist/final/node/spend-report.mjs"

[tasks."ledger-report"]
description = "#212: read the candidate ledger a run wrote, saying who produced what, how often it was chosen, and what judges said about it; pass --model <id> after -- to read one seat's candidates and its judges' verbatim reasons; SPENDS NO QUOTA (prints corpus wording when a model is named)"
depends = ["build"]
run = "node dist/final/node/ledger-report.mjs"

[tasks."slice-cost-report"]
description = "Read the per-slice cost telemetry a pass wrote, and say whether cost tracks slice size or a fixed overhead (pass a log path after --)"
depends = ["build"]
run = "node dist/final/node/slice-cost-report.mjs"

[tasks."displacement-probe"]
description = "#107: read per-slice size ratios against each document's own median to find passages the translation moved across a section boundary; SPENDS NO QUOTA"
depends = ["build"]
run = "node dist/final/node/displacement-probe.mjs"

[tasks."editor-calibrate"]
description = "#200: rank every model on the EDITOR's own job by driving the whole repair lane, all ten editing and judging each slice, and report the refiner standing off the same spend; SPENDS QUOTA (pass a slice count after --, default 6; TRANSLATION_REPAIR_SLICE_OVERLAP=N runs N slices at once, default 4, and the straggler window is 300000 ms unless TRANSLATION_REPAIR_STRAGGLER_GRACE_MS says otherwise, both decided 2026-08-26)"
depends = ["build"]
run = "node dist/final/node/editor-calibrate.mjs"

[tasks."editor-width-probe"]
description = "#186: run the same slices at the production editor width and at the whole roster, judged by one fixed panel, with the narrow arm repeated as a null band and the two winners contested in both seating orders; SPENDS QUOTA (pass a sample size after --, default 18 halved into two draws)"
depends = ["build"]
run = "node dist/final/node/editor-width-probe.mjs"

[tasks."judge-fidelity-probe"]
description = "#84: ask the translate judges to choose between a real archive slice and a damaged twin, in both directions and both ballot positions; SPENDS QUOTA (pass --only ids, --cap n, --damage deletion|insertion|alteration, --context after --)"
depends = ["build"]
run = "node dist/final/node/judge-fidelity-probe.mjs"

[tasks."translate-probe"]
description = "PROTOTYPE for #70: ask a translator ensemble to render the corpus section with the worst coverage gap, which the repair loop cannot express"
depends = ["build"]
run = "node dist/final/node/translate-probe.mjs"

[tasks."damage-sample"]
description = "Draw shipped regions at random and ask a human the same source-anchored damage question the probe asks, with the probe's verdict kept in the manifest"
depends = ["build"]
run = "node dist/final/node/damage-sample.mjs"

[tasks."probe-verify"]
description = "Probe damaged and unread regions with the accepted issues withheld, and write one blind sheet asking whether each flagged edit really damaged the text"
depends = ["build"]
run = "node dist/final/node/probe-verify.mjs"

[tasks."score-verify"]
description = "Join the graded blind verification sheet to its manifest and report what the unlabelled probe's flags are worth on regions nobody had read"
depends = ["build"]
run = "node dist/final/node/score-verify.mjs"

[tasks."probe-relabel"]
description = "#247: re-probe the regions a human read as damaged under three arms (the production disclosure, the other prompt, no list at all), to separate a suppressing prompt from a dismissing screen from a hard judgement; SPENDS QUOTA"
depends = ["build"]
run = "node dist/final/node/probe-relabel.mjs"

[tasks."model-health"]
description = "Ask every roster model one trivial structured question and report what came back, so schema-mismatch can be told apart from a dead model"
depends = ["build"]
run = "node dist/final/node/model-health.mjs"

[tasks."budget-sample"]
description = "#201: take one reading of both providers' meters and leave it in the log, so an outage's END is observed during the quiet stretches when no pass is running; SPENDS NO GENERATION (capture both streams: `> log 2>&1`)"
depends = ["build"]
run = "node dist/final/node/budget-sample.mjs"

[tasks."editor-standing-read"]
description = "#200: read the EDITOR and REFINER standings off already-settled artifacts, reported per pipeline digest and never pooled across them; OBSERVATIONAL, so it ranks only models that held a seat and is silent about the rest; SPENDS NOTHING (pass one or more run directories after --, default this run's)"
depends = ["build"]
run = "node dist/final/node/editor-standing-read.mjs"

[tasks."meter-report"]
description = "#201: read provider availability back out of run logs and report each provider's duty cycle and longest outage as bounded ranges; SPENDS NO QUOTA (pass one or more log paths after --)"
depends = ["build"]
run = "node dist/final/node/meter-report.mjs"

[tasks."model-catalog"]
description = "Compare what the provider serves against the compiled catalog, so a model that vanished stops costing a silent lost voice per call and a model holding no run role becomes visible"
