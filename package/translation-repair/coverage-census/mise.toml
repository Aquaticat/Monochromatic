[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"
# Tests load each sibling from its own build, so siblings build first.
depends = ["//package/translation-repair/adjudication:build:js:node", "//package/translation-repair/archive:build:js:node", "//package/translation-repair/corpus-pass:build:js:node", "//package/translation-repair/corpus-source:build:js:node", "//package/translation-repair/document-structure:build:js:node", "//package/translation-repair/glossary:build:js:node", "//package/translation-repair/insertion:build:js:node", "//package/translation-repair/markup:build:js:node", "//package/translation-repair/probe:build:js:node", "//package/translation-repair/provider:build:js:node", "//package/translation-repair/provider-stream:build:js:node", "//package/translation-repair/reference:build:js:node", "//package/translation-repair/run:build:js:node", "//package/translation-repair/shared-contract:build:js:node", "//package/translation-repair/slice-reading:build:js:node", "//package/translation-repair/stage:build:js:node", "//package/translation-repair/typography:build:js:node"]

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"

[tasks.buildAndTest]
description = "Build the node bundle, then run unit tests against the built dist"
run = ["mise run build", "mise run test:unit"]

[tasks."coverage-probe"]
description = "PROTOTYPE for question 28: ask a roster whether the translation already carries each passage the aligners refuse to pair, at both scales; SPENDS QUOTA (pass --only ids and --cap n after --)"
depends = ["build"]
env.TRANSLATION_REPAIR_STARTED_BY = "coverage-probe"
run = "node dist/final/node/coverage-probe.mjs"

[tasks."coverage-control-probe"]
description = "Ask the coverage roster about a passage, delete the spans it anchored on, and ask again, to find out whether an absence vote is reachable at all; SPENDS QUOTA (pass --only ids after --)"
depends = ["build"]
env.TRANSLATION_REPAIR_STARTED_BY = "coverage-control-probe"
run = "node dist/final/node/coverage-control-probe.mjs"

[tasks."coverage-census:build"]
description = "Ledger T8: the node build's entries with a source map beside every chunk, which the coverage census maps V8's offsets through; unminified, unlike the normal build, since compression folds guards into expressions V8 gives no range (ledger M79); never a child of build, whose fan-out would run it beside the normal build into the same directory"
run = "rolldown --configLoader native --config rolldown.coverage.config.ts"

[tasks."coverage-census"]
description = "Ledger T8: build unminified with source maps, run the unit suite (or the unit test files named after --) under V8 coverage, and print the package code no test ran, mapped to source lines, with each stretch that is nothing but invariant throws (an Error whose message begins unreachable:, or a class named ...InvariantError) counted and listed apart from the cold code, since a guard is never removed to close a stretch; add --baseline <census.json> and --source <src/file.ts> after -- to read an earlier census's stretches against this run (a census written before invariant throws were counted apart is refused: take it again); rebuilds the normal build after; SPENDS NO QUOTA (the whole suite writes about 8 GB of coverage under ~/.cache/translation-repair/coverage, on disk rather than in a memory-backed /tmp, deleted once read; the census and the suite's log stay beside it)"
depends = ["coverage-census:build"]
depends_post = ["build"]
env.TRANSLATION_REPAIR_STARTED_BY = "coverage-census"
run = "node dist/final/node/coverage-census.mjs"
