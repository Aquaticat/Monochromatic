[tasks.build]
description = "Build the native Codex Bash resource hook"
run = "cargo build --release --jobs 1"

[tasks."lint:types"]
description = "Check all native targets with warnings denied"
run = "cargo clippy --locked --all-targets --jobs 1 -- --deny warnings"

[tasks.lint]
depends = ["lint:types"]

[tasks.test]
description = "Run native Rust integration tests through nextest"
run = "cargo nextest run --locked --release"

[tasks."test:host"]
description = "Verify the installed Codex hook boundary using a local deterministic provider"
run = "cargo nextest run --locked --release --test native_host --run-ignored only --success-output final"
