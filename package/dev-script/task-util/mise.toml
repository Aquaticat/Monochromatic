  if (timedOut) {
    signals.push(groupSignal('SIGTERM'))
    await delay(graceMs)
    signals.push(groupSignal('SIGKILL'))
    const exitController = new AbortController()
    const exitDeadline = delay(5000, { kind: 'exit-unobserved-after-kill' }, { signal: exitController.signal })
    exit = await Promise.race([exited, exitDeadline])
    exitController.abort()
    await Promise.allSettled([exitDeadline])
