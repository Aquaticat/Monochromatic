const allowed = spawnSync(join(base, 'podman'), [...controlArgs, '--tmpfs', '/work:rw,exec,size=1m', 'docker.io/library/alpine:3.22', 'sh', '-c', 'stat -c %u:%g /work && cp /manifest/shard-manifest.json /work/input && cp /work/input /manifest/result.json'], { encoding: 'utf8', timeout: 45000 })
console.log('\n' + JSON.stringify({ event: 'mutation-identity-control', boundary: 'owned-tmpfs-volume', deniedStatus: denied.status, deniedError: denied.stderr, ownedTmpfsStatus: allowed.status, ownedTmpfsError: allowed.stderr, uid: process.getuid(), gid: process.getgid() }))
assert.equal(allowed.status, 0, allowed.stderr)
assert.equal(allowed.stdout.trim(), `${process.getuid()}:${process.getgid()}`, 'Mutation work tmpfs must match the unchanged nonroot source owner')
assert.equal(readFileSync(join(fixture, 'result.json'), 'utf8'), 'mutation-private-input\n')
assert.equal(statSync(join(fixture, 'result.json')).uid, process.getuid())
