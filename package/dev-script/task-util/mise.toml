record.consumerSpawnedAt = consumerSpawnedAt
record.consumerOutcomeObservedAt = consumerOutcomeObservedAt
record.containerIdsAfter = remainingAfter
record.consumer = { command, args, cwd: control ? source : process.cwd(), selectedSourceTask: manifest?.checks.find(row => row.id === checkId)?.task }
