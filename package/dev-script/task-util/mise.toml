let selectedResult
const resultsPath = join(directory, 'toml-results.json')
if (!control && existsSync(resultsPath)) selectedResult = JSON.parse(readFileSync(resultsPath, 'utf8')).results.find(row => row.checkId === checkId)
const record = { schemaVersion: 1, event: 'bounded-gate-finished', checkId, sourceRevision: manifest?.sourceRevision, cohort: { id: process.env.COHORT_ID, manifestSha256: process.env.COHORT_MANIFEST_SHA256, requestedAt: process.env.COHORT_REQUESTED_AT }, startedAt, finishedAt: new Date().toISOString(), elapsedMs: performance.now() - started, maxMs, graceMs, timedOut, exit, selectedResult, sourceGateTerminal: !!selectedResult && ['passed', 'failed'].includes(selectedResult.status), label, signals, cleanup, cleanupVerified, processGroupAfter, instrumentationErrors, logLimitExceeded, output: { bytes: stdout.length, sha256: createHash('sha256').update(stdout).digest('hex') }, wrapperSha256: createHash('sha256').update(wrapper).digest('hex'), fixtureOnly: !!control }
