[tasks.build]
extends = "build"

[tasks.'build:js']
extends = "build:js"

[tasks.'build:js:node']
extends = "build:js:node"

[tasks.'watch:build']
extends = "watch:build"

[tasks.'watch:build:js']
extends = "watch:build:js"

[tasks.'watch:build:js:node']
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks.'lint:types']
extends = "lint:types"

[tasks.'lint:oxlint']
extends = "lint:oxlint"
usage = 'arg "[args]" var=#true help="Package-relative source paths; omitted means the entire package"'
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
ensureOxlintConfig()
runWorkspaceNode('package/dev-script/task-util', 'oxlint-wrapper', parseUsageArgs(process.env.usage_args ?? ''))
"""

[tasks."format:oxlint"]
extends = "format:oxlint"
usage = 'arg "[args]" var=#true help="Package-relative source paths; omitted means the entire package"'
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
ensureOxlintConfig()
runWorkspaceNode('package/dev-script/task-util', 'oxlint-wrapper', ['--fix', ...parseUsageArgs(process.env.usage_args ?? '')])
"""

[tasks.'test:unit']
extends = "test:unit"

[tasks."test:tsc-failure"]
description = "Verify built TypeScript wrapper exit handling with disposable compiler processes"
run = "node src/tsc-failure.unit.test.ts"

[tasks.buildAndTest]
description = "Build the seven node entries, then run unit tests against the built testing seam"
run = ["mise run build", "mise run test:unit"]

[tasks."trial:depot:native:identity"]
description = "Verify native trial source identity and record installed tool versions"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync } = await import('node:child_process')
const { createHash } = await import('node:crypto')
const { readFileSync } = await import('node:fs')
const { join } = await import('node:path')
const { strict: assert } = await import('node:assert')
const source = join(process.env.GITHUB_WORKSPACE, 'source')
const run = args => execFileSync('git', args, { cwd: source, encoding: 'utf8' }).trim()
assert.match(process.env.SOURCE_HEAD, /^[0-9a-f]{40}$/)
assert.equal(run(['rev-parse', 'HEAD']), process.env.SOURCE_HEAD)
assert.equal(run(['diff', '--name-only', 'HEAD']), '', 'Native checks changed tracked source')
const paths = ['mise.lock', 'package/music-player/desktop-app/Cargo.lock', 'package/music-player/truepeak-core/Cargo.lock']
const inputs = Object.fromEntries(paths.map(path => [path, createHash('sha256').update(readFileSync(join(source, path))).digest('hex')]))
console.log(JSON.stringify({ sourceRevision: process.env.SOURCE_HEAD, platform: process.platform, architecture: process.arch, inputs }))
execFileSync('mise', ['ls', '--current', '--json'], { cwd: source, stdio: 'inherit' })
for (const [program, args] of [['node', ['--version']], ['rustc', ['--version', '--verbose']], ['cargo', ['nextest', '--version']], ['cmake', ['--version']]]) {
  console.log(JSON.stringify({ program, output: execFileSync(program, args, { cwd: source, encoding: 'utf8' }).trim() }))
}
'''

[tasks."trial:depot:native:components"]
description = "Install and verify Clippy in the exact native trial toolchain"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync } = await import('node:child_process')
const { join } = await import('node:path')
const { strict: assert } = await import('node:assert')
const source = join(process.env.GITHUB_WORKSPACE, 'source')
const toolchain = process.env.MISE_RUST_VERSION
assert.equal(toolchain, 'nightly-2026-10-13')
const run = args => execFileSync('mise', ['exec', '--', ...args], { cwd: source, stdio: 'inherit' })
run(['rustup', 'component', 'list', '--installed', '--toolchain', toolchain])
run(['rustup', 'component', 'add', 'clippy', '--toolchain', toolchain])
run(['rustup', 'component', 'list', '--installed', '--toolchain', toolchain])
run(['cargo', 'clippy', '--version'])
'''

[tasks."trial:depot:native:nextest"]
description = "Execute the source test task body with nextest fail-fast disabled"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync } = await import('node:child_process')
const { createHash } = await import('node:crypto')
const { join } = await import('node:path')
const { strict: assert } = await import('node:assert')
const source = join(process.env.GITHUB_WORKSPACE, 'source')
const packageDir = join(source, 'package/music-player/desktop-app')
const read = args => execFileSync('mise', args, { cwd: packageDir, encoding: 'utf8' })
const task = JSON.parse(read(['tasks', 'info', '//package/music-player/desktop-app:test', '--json']))
assert.equal(task.shell, 'node --input-type=module-typescript -e')
assert.equal(task.run.length, 1)
const dispatcher = read(['config', 'get', '--file', join(packageDir, 'mise.toml'), 'vars.cargo_dispatch'])
const template = '{'.repeat(2) + 'vars.cargo_dispatch' + '}'.repeat(2)
const originalCall = "runCargo(['nextest', 'run'])"
assert.equal(task.run[0].split(template).length, 2)
assert.equal(task.run[0].split(originalCall).length, 2)
const body = task.run[0].replace(template, dispatcher)
const adapted = body.replace(originalCall, "runCargo(['nextest', 'run', '--no-fail-fast'])")
assert(!adapted.includes('{'.repeat(2)), 'Unexpected unresolved task template')
const sha256 = value => createHash('sha256').update(value).digest('hex')
console.log(JSON.stringify({ sourceRevision: process.env.SOURCE_HEAD, task: task.name, originalBodySha256: sha256(body), adaptedBodySha256: sha256(adapted), adapter: '--no-fail-fast', packageEnvironment: true }))
execFileSync('mise', ['exec', '--', 'node', '--input-type=module-typescript', '-e', adapted], { cwd: packageDir, stdio: 'inherit' })
'''

[tasks."trial:depot:native:smoke"]
description = "Call the immutable-head release artifact as a CLI consumer"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync } = await import('node:child_process')
const { createHash } = await import('node:crypto')
const { readFileSync } = await import('node:fs')
const { join } = await import('node:path')
const { strict: assert } = await import('node:assert')
const source = join(process.env.GITHUB_WORKSPACE, 'source/package/music-player/desktop-app')
const manifest = readFileSync(join(source, 'Cargo.toml'), 'utf8')
const version = /^version = "([^"]+)"$/m.exec(manifest)?.[1]
assert(version, 'Package version is required')
const binary = join(source, 'target/release', process.platform === 'win32' ? 'music-player.exe' : 'music-player')
const output = execFileSync(binary, ['--version'], { cwd: source, encoding: 'utf8', timeout: 30_000 }).trim()
assert.equal(output, `music-player ${version}`)
console.log(JSON.stringify({ sourceRevision: process.env.SOURCE_HEAD, output, sha256: createHash('sha256').update(readFileSync(binary)).digest('hex') }))
'''

