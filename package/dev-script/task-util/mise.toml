 return [path,sha256(bytes)];
}));
const identity={cohort:cohortRecord.cohort,harnessRevision:cohortRecord.harnessRevision,caseId,sourceRevision:head,sourceTree:git(['rev-parse','HEAD^{tree}']),trackedStatus,inputs,manifestSha256:sha256(manifestBytes)};
const directory=process.env.DEPOT_CI_IDENTITY_OUTPUT_DIRECTORY??join(homedir(),'temp/agent/depot-complete-vm-original-evidence');
