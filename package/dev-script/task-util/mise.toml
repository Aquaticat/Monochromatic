const startedAt = new Date().toISOString()
const started = performance.now()
const prefix = join(directory, 'toml-bounded-' + checkId)
const outputPath = prefix + '.log'
const descriptor = openSync(outputPath, 'wx', 0o600)
const telemetry = []
const instrumentationErrors = []
