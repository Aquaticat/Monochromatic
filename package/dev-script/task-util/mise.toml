  assert(negative.stderr.includes('Permission denied'), negative.stderr)
  const positive = spawnSync(join(base, 'podman'), [...controlArgs, '--tmpfs', '/work:rw,exec,size=1m', '--workdir', '/work', metadataImage, 'cat', '/baked/node_modules/.pnpm-workspace-state-v1.json'], { encoding: 'utf8', timeout: 45000 })
