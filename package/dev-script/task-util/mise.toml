writeFileSync(join(metadataContext, 'Containerfile'), 'FROM docker.io/library/alpine:3.22\nCOPY state.json /baked/node_modules/.pnpm-workspace-state-v1.json\n')
const metadataImage = `localhost/mutation-test-runtime:${(await import('node:crypto')).randomUUID().replaceAll('-', '').slice(0, 12)}`
execFileSync('sudo', ['--non-interactive', podman, 'build', '--memory=2g', '--cpu-period=100000', '--cpu-quota=200000', '--network=none', '--tag', metadataImage, '--file', join(metadataContext, 'Containerfile'), metadataContext], { stdio: 'inherit' })
try {
