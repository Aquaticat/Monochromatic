const metadata = setInterval(safeSnapshot, 10000)
const timerController = new AbortController()
const timer = delay(maxMs, { kind: 'deadline' }, { signal: timerController.signal })
const exited = childExit()
const outcome = await Promise.race([exited, timer])
const consumerOutcomeObservedAt = new Date().toISOString()
const timedOut = outcome.kind === 'deadline'
const signals = []
let exit = outcome
try {
