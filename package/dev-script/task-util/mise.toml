}
const remaining = safeSnapshot() ?? []
const cleanup = remaining.map(id => ({ id, kill: podman({ args: ['kill', '--signal=SIGKILL', id], budgetMs: 60000 }), remove: podman({ args: ['rm', '--force', '--time=0', '--ignore', id], budgetMs: 60000 }) }))
const processGroupAfter = groupMembers()
let remainingAfter
try { remainingAfter = containers() } catch (error) { instrumentationErrors.push(String(error)) }
const cleanupVerified = remainingAfter?.length === 0 && cleanup.every(row => row.remove.status === 0) && processGroupAfter.every(row => row.state === 'Z')
const events = podman({ args: ['events', '--since', startedAt, '--until', new Date().toISOString(), '--stream=false', '--filter', 'label=' + label, '--format', 'json'] })
