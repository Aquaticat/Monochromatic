const wrapper = ['#!/usr/bin/env node', "const { spawnSync } = await import('node:child_process')", 'const [command, ...args] = process.argv.slice(2)', 'const labels = command === "run" ? ["--label", ' + JSON.stringify(label) + '] : []', 'const result = spawnSync(' + JSON.stringify(originalPodman) + ', [command, ...labels, ...args], { stdio: "inherit" })', 'if (result.error) throw result.error', 'process.exitCode = result.status ?? 1', ''].join('\n')
