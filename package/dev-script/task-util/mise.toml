[tasks."trial:depot:ci:native-tools"]
description = "Install exact native tool versions read from the immutable source lockfile"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync } = await import('node:child_process')
const { readFileSync, writeFileSync, appendFileSync, mkdirSync, chmodSync, existsSync, realpathSync, symlinkSync } = await import('node:fs')
const { homedir } = await import('node:os')
const { join } = await import('node:path')
const { strict: assert } = await import('node:assert')
const { createHash } = await import('node:crypto')
const source = join(process.env.GITHUB_WORKSPACE, 'source')
const lock = readFileSync(join(source, 'mise.lock'), 'utf8')
const tools = new Map([...lock.matchAll(/^\[\[tools\.(?:"([^"]+)"|([^\]]+))\]\]\nversion = "([^"]+)"/gm)].map((match) => [match[1] ?? match[2], match[3]]))
const requested = ['node', 'pnpm', 'rust', 'cargo-binstall', 'cargo:cargo-nextest', 'cargo:monochromatic-lint', 'cargo:monochromatic-git-policy-cli']
if (process.env.DEPOT_CI_WAVE === 'native-android') requested.push('java', 'android-sdk', 'cargo:cargo-ndk', 'cmake')
if (process.env.DEPOT_CI_WAVE === 'native-desktop') requested.push('cargo:slint-viewer', 'cmake')
const selected = requested.map((name) => {
  assert(tools.has(name), `Required tool missing from exact source lockfile: ${name}`)
  return { name, version: tools.get(name) }
})
const rust = tools.get('rust')
assert(/^nightly-\d{4}-\d{2}-\d{2}$/.test(rust), 'Expected dated historical Rust nightly')
const env = { ...process.env, MISE_RUST_VERSION: rust, MISE_LOCKED: '0' }
const prerequisiteNames = new Set(['node', 'pnpm', 'rust', 'cargo-binstall'])
execFileSync('mise', ['install', ...selected.filter(({ name }) => prerequisiteNames.has(name)).map(({ name, version }) => `${name}@${version}`)], { env, stdio: 'inherit' })
execFileSync('mise', ['install', ...selected.filter(({ name }) => !prerequisiteNames.has(name)).map(({ name, version }) => `${name}@${version}`)], { env, stdio: 'inherit' })
const policyRoot = execFileSync('mise', ['where', `cargo:monochromatic-git-policy-cli@${tools.get('cargo:monochromatic-git-policy-cli')}`], { env, encoding: 'utf8' }).trim()
const policyBinary = join(policyRoot, 'bin/cli-git-native')
assert(existsSync(policyBinary), 'Locked published Git policy binary must be installed')
const policyDirectory = join(source, '.cache/cli-git-bin')
mkdirSync(policyDirectory, { recursive: true })
const policyLink = join(policyDirectory, 'git')
if (existsSync(policyLink)) assert.equal(realpathSync(policyLink), realpathSync(policyBinary), 'Source Git policy link must resolve to the locked published binary')
else symlinkSync(policyBinary, policyLink)
appendFileSync(process.env.GITHUB_PATH, `${policyDirectory}\n`)
const directory = join(homedir(), 'temp/agent/depot-complete-ci')
mkdirSync(directory, { recursive: true, mode: 0o700 })
chmodSync(directory, 0o700)
const selectedManifest = JSON.parse(readFileSync(join(process.env.GITHUB_WORKSPACE, `harness/.depot/manifests/${process.env.DEPOT_CI_CASE ?? 'native'}.json`), 'utf8'))
const record = { source: selectedManifest.sourceRevision, lockSha256: createHash('sha256').update(lock).digest('hex'), tools: selected, policyBinary, policyLink }
writeFileSync(join(directory, 'native-tools.json'), JSON.stringify(record, null, 2))
appendFileSync(process.env.GITHUB_ENV, `MISE_RUST_VERSION=${rust}\n`)
assert.equal(readFileSync(join(source, 'mise.lock'), 'utf8'), lock, 'Tool installation changed source lockfile')
console.log("\n" + JSON.stringify({ event: 'native-tools-installed', ...record }))
'''

