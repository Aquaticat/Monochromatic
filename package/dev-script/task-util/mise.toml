[tasks."trial:depot:ci:prepare"]
description = "Prepare locked dependencies and record available tools without running repository checks"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync } = await import('node:child_process')
const { readFileSync, writeFileSync, mkdirSync, chmodSync } = await import('node:fs')
const { createHash } = await import('node:crypto')
const { homedir } = await import('node:os')
const { join } = await import('node:path')
const { strict: assert } = await import('node:assert')
const sourceRevision = 'bae6ef28a183039a6c4ba509179dc4baaedeac2e'
const base = join(homedir(), 'temp/agent/depot-complete-ci')
mkdirSync(base, { recursive: true, mode: 0o700 })
chmodSync(base, 0o700)
const started = Date.now()
execFileSync('git', ['merge-base', '--is-ancestor', sourceRevision, 'HEAD'])
const inputs = ['mise.lock', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json']
const hashes = inputs.map(function input(path) {
  const expected = execFileSync('git', ['show', `${sourceRevision}:${path}`])
  const actual = readFileSync(path)
  assert.deepEqual(actual, expected, `${path} must match the immutable source revision`)
  return { path, sha256: createHash('sha256').update(actual).digest('hex') }
})
const before = JSON.parse(execFileSync('mise', ['ls', '--current', '--json'], { encoding: 'utf8', maxBuffer: 8 * 1024 * 1024 }))
writeFileSync(join(base, 'tools-before.json'), JSON.stringify(before, null, 2))
execFileSync('pnpm', ['install', '--frozen-lockfile'], { stdio: 'inherit' })
for (const input of hashes) assert.equal(createHash('sha256').update(readFileSync(input.path)).digest('hex'), input.sha256, `${input.path} changed during frozen dependency preparation`)
const tasks = JSON.parse(execFileSync('mise', ['tasks', '--all', '--hidden', '--json'], { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 }))
writeFileSync(join(base, 'available-tasks.json'), JSON.stringify(tasks, null, 2))
const record = { sourceRevision, inputs: hashes, elapsedMs: Date.now() - started, availableTaskCount: tasks.length, checksExecuted: false }
writeFileSync(join(base, 'prepared.json'), JSON.stringify(record, null, 2))
console.log(JSON.stringify({ phase: 'affected-ci-dependencies-prepared', ...record }))
console.log(JSON.stringify({ phase: 'affected-ci-tools', tools: Object.fromEntries(Object.entries(before).map(([name, versions]) => [name, versions.map(({ version, installed }) => ({ version, installed }))])) }))
'''

[tasks."trial:depot:ci:execute"]
description = "Execute explicit affected-package checks against a separate immutable checkout"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync, spawnSync } = await import('node:child_process')
const { readFileSync, writeFileSync, mkdirSync, chmodSync } = await import('node:fs')
const { createHash } = await import('node:crypto')
const { homedir } = await import('node:os')
const { join } = await import('node:path')
const { strict: assert } = await import('node:assert')
assert(process.env.GITHUB_WORKSPACE, 'GITHUB_WORKSPACE is required for the isolated cloud source checkout')
process.chdir(join(process.env.GITHUB_WORKSPACE, 'source'))
const manifestName = process.env.DEPOT_CI_CASE ?? 'toml'
assert(['toml', 'native', 'logger', 'desktop'].includes(manifestName), 'Unknown affected-case manifest')
const manifestBytes = readFileSync(join(process.env.GITHUB_WORKSPACE, `harness/.depot/manifests/${manifestName}.json`))
const manifest = JSON.parse(manifestBytes)
const wave = process.env.DEPOT_CI_WAVE ?? 'core'
assert(['core', 'containers', 'all', 'static', 'native-core', 'native-android', 'native-desktop'].includes(wave), `Unknown execution wave: ${wave}`)
const manifestSha256 = createHash('sha256').update(manifestBytes).digest('hex')
const sourceRevision = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
assert.equal(sourceRevision, manifest.sourceRevision)
const changedFiles = execFileSync('git', ['diff', '--name-only', manifest.baseRevision, sourceRevision], { encoding: 'utf8' }).trim().split('\n').sort()
assert.deepEqual(changedFiles, [...manifest.changedFiles].sort())
const catalog = JSON.parse(execFileSync('mise', ['tasks', '--all', '--hidden', '--json'], { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 }))
const selectedPackages = new Set(manifest.selectedPackages)
const tracked = execFileSync('git', ['ls-files'], { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 }).trim().split('\n')
for (const check of manifest.checks) {
  const fileCheck = check.scope === 'files' && check.task === '//:lint:monochromatic-lint' && check.args.length > 0 && check.args.every((path) => manifest.changedFiles.includes(path))
  assert(check.scope === 'package' || fileCheck, `unreviewed non-package check: ${check.id}`)
  assert((check.packages ?? []).every((path) => selectedPackages.has(path)), `check outside affected closure: ${check.id}`)
  assert(catalog.some((task) => task.name === check.task), `missing exact-head task: ${check.task}`)
  if (check.task.endsWith(':lint:oxlint')) assert.deepEqual(check.args, [], 'Oxlint must retain full package reach')
  if (check.expectedFiles) {
    const actual = tracked.filter((path) => check.packages.some((pkg) => path.startsWith(`${pkg}/`)) && path.endsWith('.unit.test.ts') && (check.args.includes('--all') || check.args.includes(path))).sort()
    assert.deepEqual(actual, [...check.expectedFiles].sort(), `unit input identity mismatch: ${check.id}`)
  }
}
const inputs = ['mise.lock', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json']
for (const path of inputs) assert.deepEqual(readFileSync(path), execFileSync('git', ['show', `HEAD:${path}`]), `${path} changed during setup`)
const directory = join(homedir(), 'temp/agent/depot-complete-ci')
mkdirSync(directory, { recursive: true, mode: 0o700 })
chmodSync(directory, 0o700)
const identity = { schemaVersion: 1, caseId: manifest.caseId, sourceRevision, manifestSha256, providerJobUrl: process.env.DEPOT_JOB_URL, resources: { cpus: 16, memoryGiB: 64 }, selectedCheckIds: manifest.checks.map((check) => check.id) }
const results = []
const deferredChecks = manifest.checks.filter((check) => {
  const container = check.task.endsWith(':test:mutation') || check.task.endsWith(':test:container')
  if (wave === 'static') return !check.task.endsWith(':lint:oxlint') && !check.task.endsWith(':lint:types')
  if (wave === 'native-core') return !check.id.startsWith('truepeak-core.') && !check.id.startsWith('root.changed-')
  if (wave === 'native-android') return !check.id.startsWith('android-app.') || check.task.endsWith(':test:instrumented')
  if (wave === 'native-desktop') return !check.id.startsWith('desktop-app.') || check.task.endsWith(':test:e2e')
  return wave === 'core' ? container : wave === 'containers' ? !container && check.family !== 'build' : false
}).map((check) => ({ checkId: check.id, reason: `Required check belongs to another execution wave; current wave: ${wave}` }))
console.log(JSON.stringify({ ...identity, event: 'case-started', completeGraph: false, deferredChecks, tools: JSON.parse(execFileSync('mise', ['ls', '--current', '--json'], { encoding: 'utf8', maxBuffer: 8 * 1024 * 1024 })) }))
for (const check of manifest.checks) {
  const startedAt = new Date().toISOString()
  const started = performance.now()
  const checkIdentity = { ...identity, checkId: check.id, task: check.task, args: check.args, startedAt, expectedFiles: check.expectedFiles }
  const deferred = deferredChecks.find((item) => item.checkId === check.id)
  const failedPrerequisites = (check.prerequisites ?? []).filter((id) => !deferredChecks.some((item) => item.checkId === id) && results.find((result) => result.checkId === id)?.status !== 'passed')
  const skipReason = deferred?.reason ?? (failedPrerequisites.length > 0 ? `Required builds did not pass: ${failedPrerequisites.join(', ')}` : undefined)
  console.log(JSON.stringify({ ...checkIdentity, event: 'check-started' }))
  const result = skipReason ? undefined : spawnSync('mise', ['run', check.task, ...(check.args.length > 0 ? ['--', ...check.args] : [])], { stdio: 'inherit', env: { ...process.env, ...(check.env ?? {}) } })
  if (result?.error) console.error(result.error)
  const record = { ...checkIdentity, event: 'check-finished', finishedAt: new Date().toISOString(), elapsedMs: performance.now() - started, exitCode: result?.status ?? null, signal: result?.signal ?? null, status: skipReason ? 'skipped' : result?.status === 0 ? 'passed' : 'failed', skipReason }
  results.push(record)
  console.log(JSON.stringify(record))
  writeFileSync(join(directory, `${manifest.caseId}-results.json`), JSON.stringify({ ...identity, event: 'case-finished', completeGraph: false, results, deferredChecks, externalChecks: manifest.externalChecks }, null, 2))
}
for (const path of inputs) assert.deepEqual(readFileSync(path), execFileSync('git', ['show', `HEAD:${path}`]), `${path} changed during checks`)
console.log(JSON.stringify({ ...identity, event: 'case-finished', completeGraph: false, results, deferredChecks, externalChecks: manifest.externalChecks }))
if (results.some((result) => result.status === 'failed')) throw new Error('Affected-package checks failed; see retained per-check records')
'''

[tasks."trial:depot:ci:containers"]
description = "Activate the previously verified rootful container boundary outside the immutable source"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync } = await import('node:child_process')
const { readFileSync, writeFileSync, mkdirSync, chmodSync, realpathSync, existsSync, appendFileSync } = await import('node:fs')
const { join, delimiter } = await import('node:path')
const { homedir } = await import('node:os')
const { strict: assert } = await import('node:assert')
const executable = process.env.PATH.split(delimiter).map((directory) => join(directory, 'podman')).find((path) => existsSync(path))
assert(executable, 'Podman must exist in the prepared image')
const podman = realpathSync(executable)
const base = join(homedir(), 'temp/agent/depot-complete-ci/container-bin')
mkdirSync(base, { recursive: true, mode: 0o700 })
chmodSync(base, 0o700)
const wrapper = [
  '#!/usr/bin/env node',
  "const { spawnSync } = await import('node:child_process');",
  'const [command, ...args] = process.argv.slice(2);',
  "const limits = command === 'run' ? ['--memory=2g', '--cpus=2', '--pids-limit=512'] : [];",
  `const result = spawnSync('sudo', ['--non-interactive', ${JSON.stringify(podman)}, command, ...limits, ...args], { stdio: 'inherit' });`,
  'if (result.error) throw result.error;',
  'process.exitCode = result.status ?? 1;',
  '',
].join('\n')
writeFileSync(join(base, 'podman'), wrapper, { mode: 0o700 })
execFileSync('sudo', ['--non-interactive', podman, '--version'], { stdio: 'inherit' })
execFileSync('sudo', ['--non-interactive', podman, 'run', '--memory=2g', '--cpus=2', '--pids-limit=512', '--rm', 'docker.io/library/alpine:3.22', 'true'], { stdio: 'inherit' })
appendFileSync(process.env.GITHUB_PATH, `${base}\n`)
console.log(JSON.stringify({ event: 'container-boundary-ready', executable: podman, boundary: 'sudo --non-interactive', memory: '2g', cpus: 2, pidsLimit: 512 }))
'''

[tasks."trial:depot:ci:generated"]
description = "Run affected generator consistency against a disposable exact-head checkout"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync, spawnSync } = await import('node:child_process')
const { readFileSync, writeFileSync, mkdirSync, chmodSync } = await import('node:fs')
const { join } = await import('node:path')
const { homedir } = await import('node:os')
const { strict: assert } = await import('node:assert')
const source = join(process.env.GITHUB_WORKSPACE, 'source')
const { createHash } = await import('node:crypto')
const manifestBytes = readFileSync(join(process.env.GITHUB_WORKSPACE, 'harness/.depot/manifests/toml.json'))
const manifest = JSON.parse(manifestBytes)
const manifestSha256 = createHash('sha256').update(manifestBytes).digest('hex')
const sourceRevision = execFileSync('git', ['rev-parse', 'HEAD'], { cwd: source, encoding: 'utf8' }).trim()
assert.equal(sourceRevision, manifest.sourceRevision)
const base = join(homedir(), 'temp/agent/depot-complete-ci')
mkdirSync(base, { recursive: true, mode: 0o700 })
chmodSync(base, 0o700)
const fixture = join(base, `${manifest.caseId}-generated-fixture`)
execFileSync('git', ['worktree', 'add', '--detach', fixture, sourceRevision], { cwd: source, stdio: 'inherit' })
const env = { ...process.env, MISE_TRUSTED_CONFIG_PATHS: `${process.env.MISE_TRUSTED_CONFIG_PATHS ?? ''}:${fixture}` }
execFileSync('mise', ['run', 'prepare:pnpm:install', '--', '--frozen-lockfile'], { cwd: fixture, env, stdio: 'inherit' })
execFileSync('mise', ['run', '//package/git-policy/cli:build'], { cwd: fixture, env, stdio: 'inherit' })
const startedAt = new Date().toISOString()
const started = performance.now()
const result = spawnSync('mise', ['run', 'sync:files'], { cwd: fixture, env, stdio: 'inherit' })
if (result.error) console.error(result.error)
const diff = execFileSync('git', ['diff', '--name-only'], { cwd: fixture, encoding: 'utf8' }).trim()
writeFileSync(join(base, `${manifest.caseId}-generated.patch`), execFileSync('git', ['diff', '--binary'], { cwd: fixture, maxBuffer: 32 * 1024 * 1024 }))
const untracked = execFileSync('git', ['ls-files', '--others', '--exclude-standard'], { cwd: fixture, encoding: 'utf8' }).trim()
const record = { schemaVersion: 1, event: 'check-finished', caseId: manifest.caseId, sourceRevision, manifestSha256, checkId: 'root.generated-consistency', task: '//:sync:files', args: [], startedAt, finishedAt: new Date().toISOString(), elapsedMs: performance.now() - started, exitCode: result.status, signal: result.signal, status: result.status === 0 && diff === '' && untracked === '' ? 'passed' : 'failed', changedTrackedFiles: diff, newFiles: untracked }
writeFileSync(join(base, `${manifest.caseId}-generated-results.json`), JSON.stringify(record, null, 2))
console.log(JSON.stringify(record))
assert.equal(record.status, 'passed', 'Generated outputs differ or generation failed in the disposable fixture')
'''

[tasks."trial:depot:ci:control"]
description = "Exercise the actual CI executor against isolated passing, failing, and invalid-scope fixtures"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync, spawnSync } = await import('node:child_process')
const { mkdirSync, chmodSync, writeFileSync, readFileSync } = await import('node:fs')
const { join } = await import('node:path')
const { homedir } = await import('node:os')
const { strict: assert } = await import('node:assert')
const control = process.env.DEPOT_CI_CONTROL_CASE
assert(['passing', 'failure', 'oxlint-args', 'oxlint-scope'].includes(control), 'Unknown executor control')
const base = join(homedir(), 'temp/agent/depot-complete-ci', `control-${control}`)
const source = join(base, 'source')
const packageRoot = join(source, 'package/control/fixture')
const manifestRoot = join(base, 'harness/.depot/manifests')
mkdirSync(packageRoot, { recursive: true, mode: 0o700 })
mkdirSync(manifestRoot, { recursive: true, mode: 0o700 })
chmodSync(base, 0o700)
writeFileSync(join(source, 'mise.toml'), 'monorepo_root = true\n[monorepo]\nconfig_roots = ["package/*/*"]\n')
writeFileSync(join(source, 'mise.lock'), '')
writeFileSync(join(source, 'pnpm-lock.yaml'), '{}\n')
writeFileSync(join(source, 'pnpm-workspace.yaml'), '{}\n')
writeFileSync(join(source, 'package.json'), '{"private":true,"type":"module"}\n')
const command = control === 'failure' ? 'throw new Error("intentional executor failure control")' : 'console.log("executor passing control")'
writeFileSync(join(packageRoot, 'mise.toml'), `[tasks."lint:oxlint"]\nshell = "node --input-type=module-typescript -e"\nrun = ${JSON.stringify(command)}\n`)
writeFileSync(join(packageRoot, 'input.txt'), 'base\n')
const git = (args) => execFileSync('git', args, { cwd: source, encoding: 'utf8' }).trim()
git(['init', '--initial-branch=fixture'])
git(['config', 'user.name', 'Executor fixture'])
git(['config', 'user.email', 'executor-fixture@example.invalid'])
const paths = ['mise.toml', 'mise.lock', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'package/control/fixture/mise.toml', 'package/control/fixture/input.txt']
git(['add', '--', ...paths])
git(['commit', '--message', 'test(fixture): initialize executor control', '--', ...paths])
const baseRevision = git(['rev-parse', 'HEAD'])
writeFileSync(join(packageRoot, 'input.txt'), 'head\n')
git(['add', '--', 'package/control/fixture/input.txt'])
git(['commit', '--message', 'test(fixture): change selected input', '--', 'package/control/fixture/input.txt'])
const sourceRevision = git(['rev-parse', 'HEAD'])
const check = { id: 'control.lint.oxlint', task: '//package/control/fixture:lint:oxlint', args: control === 'oxlint-args' ? ['input.txt'] : [], family: 'lint', scope: control === 'oxlint-scope' ? 'files' : 'package', packages: ['package/control/fixture'], prerequisites: [] }
const manifest = { schemaVersion: 1, caseId: `control-${control}`, sourceRevision, baseRevision, headRevision: sourceRevision, changedFiles: ['package/control/fixture/input.txt'], selectedPackages: ['package/control/fixture'], checks: [check], externalChecks: [], completeGraph: false }
writeFileSync(join(manifestRoot, 'toml.json'), JSON.stringify(manifest, null, 2))
const env = { ...process.env, GITHUB_WORKSPACE: base, MISE_TRUSTED_CONFIG_PATHS: `${process.env.MISE_TRUSTED_CONFIG_PATHS ?? ''}:${base}`, DEPOT_CI_WAVE: 'all' }
const result = spawnSync('mise', ['run', '//package/dev-script/task-util:trial:depot:ci:execute'], { env, stdio: 'inherit' })
if (result.error) throw result.error
if (control === 'passing') assert.equal(result.status, 0, 'Passing control must succeed')
else assert.notEqual(result.status, 0, 'Negative control must fail the executor')
if (control === 'failure') {
  const report = JSON.parse(readFileSync(join(homedir(), 'temp/agent/depot-complete-ci/control-failure-results.json')))
  assert.equal(report.results[0].status, 'failed')
  assert.equal(report.results[0].exitCode, 1)
}
console.log(JSON.stringify({ event: 'executor-control-observed', control, executorExitCode: result.status, expectedFailure: control !== 'passing' }))
if (control !== 'passing') throw new Error(`Intentional negative control ${control} propagates to workflow failure`)
'''
