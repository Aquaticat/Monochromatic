[tasks.build]
extends = "build"

[tasks."research:rust:coverage"]
description = "Execute immutable current-source Rust consumers within the explicitly bounded Depot research allocation"
run = "node bin/rust-coverage.mjs"

[tasks."research:rust:harness-check"]
description = "Parse the new owned research harness without compiling application code"
run = "node --check bin/rust-coverage.mjs"

[tasks."research:rust:core"]
description = "Run frozen standalone Rust owners and produce the exact native wg routing prerequisite"
run = "node bin/rust-core-coverage.mjs"

[tasks."research:rust:core-check"]
description = "Parse the standalone research harness without compiling application code"
run = "node --check bin/rust-core-coverage.mjs"

[tasks."research:rust:tools"]
description = "Prepare verified fuzz and deterministic host tools, or seal only this owned cloud checkout"
run = "node bin/rust-research-tools.mjs"

[tasks."research:rust:tools-check"]
description = "Parse the additional tool snapshot harness without installing or compiling application code"
run = "node --check bin/rust-research-tools.mjs"

[tasks.'build:js']
extends = "build:js"

[tasks.'build:js:node']
extends = "build:js:node"

[tasks.'watch:build']
extends = "watch:build"

[tasks.'watch:build:js']
extends = "watch:build:js"

[tasks.'watch:build:js:node']
