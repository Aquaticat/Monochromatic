  "const invocation = browserScope ? [...mappedArgs.slice(0,browserIndex+1),'node','--input-type=module','--eval','('+browserPartitionMain.toString()+')()',JSON.stringify(browserScope),...mappedArgs.slice(browserIndex+1)] : browser ? [...mappedArgs.slice(0, browserIndex + 1), 'node', '--input-type=module', '--eval', browserProbe, ...mappedArgs.slice(browserIndex + 1), '--workers=1'] : mappedArgs;",
  "if(browser) console.log(JSON.stringify({event:'browser-concurrency-adaptation',workers:1,originalCommand:mappedArgs.slice(browserIndex + 1),filesAndProjectsUnchanged:!browserScope,partitionScope:browserScope,caseInventoryRequired:Boolean(browserScope)}));",
  'let result; let metadata; let created = false; let cleanup; let remaining;',
