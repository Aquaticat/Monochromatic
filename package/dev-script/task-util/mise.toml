[tasks."trial:depot:ci:desktop-host"]
description = "Bridge discovered Ubuntu Clang paths for unchanged historical native tasks"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync } = await import('node:child_process')
const { globSync, existsSync, realpathSync, readFileSync, appendFileSync } = await import('node:fs')
const { basename, dirname, join } = await import('node:path')
const { homedir } = await import('node:os')
const { strict: assert } = await import('node:assert')
const candidates = globSync('/usr/lib/llvm-*/lib/libclang.so*').sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
const libraries = candidates.filter((path) => dirname(path) === dirname(candidates.at(-1) ?? ''))
const resources = globSync('/usr/lib/llvm-*/lib/clang/*/include/stddef.h').map((path) => dirname(dirname(path))).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
assert(libraries.length > 0 && resources.length > 0, 'Prepared host must contain libclang and builtin headers')
execFileSync('sudo', ['--non-interactive', 'mkdir', '--parents', '/usr/lib64', '/usr/lib/clang'])
for (const source of [...libraries, resources.at(-1)]) {
  const target = join(source === resources.at(-1) ? '/usr/lib/clang' : '/usr/lib64', basename(source))
  if (existsSync(target) && source === resources.at(-1)) {
    assert(existsSync(join(target, 'include/stddef.h')), 'Existing Clang resource directory must contain builtin headers')
    execFileSync('clang', [`-resource-dir=${target}`, '-fsyntax-only', '-x', 'c', '-'], { input: '#include <stddef.h>\nsize_t value;\n', stdio: ['pipe', 'inherit', 'inherit'] })
  }
  else if (existsSync(target)) assert.equal(realpathSync(target), realpathSync(source), `Unexpected existing native bridge: ${target}`)
  else execFileSync('sudo', ['--non-interactive', 'ln', '--symbolic', source, target])
}
const base = join(homedir(), 'temp/agent/depot-package-snapshot')
const snapshot = JSON.parse(readFileSync(join(base, 'manifest.json'), 'utf8'))
assert.equal(execFileSync('dpkg-query', ['--show', `--showformat=${snapshot.format}`, ...snapshot.packages], { encoding: 'utf8' }), snapshot.manifest)
assert.equal(execFileSync(join(base, 'bin/magick'), ['--version'], { encoding: 'utf8' }), snapshot.magickVersion)
execFileSync('sudo', ['--non-interactive', 'apt-get', 'update'], { stdio: 'inherit' })
execFileSync('sudo', ['--non-interactive', 'apt-get', 'install', '--yes', '--no-install-recommends', 'libinput10'], { stdio: 'inherit' })
execFileSync('slint-viewer', ['--version'], { stdio: 'inherit' })
appendFileSync(process.env.GITHUB_PATH, `${join(base, 'bin')}\n`)
execFileSync('pkg-config', ['--exists', 'libpipewire-0.3', 'fontconfig', 'freetype2', 'wayland-server', 'xkbcommon', 'libdrm'], { stdio: 'inherit' })
console.log('\n' + JSON.stringify({ event: 'desktop-host-verified', libraries, resources, preparedPackageCount: snapshot.packages.length }))
'''

[tasks."trial:depot:linux-nextest"]
description = "Run the historical Linux desktop tests without fail-fast and retain full output"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync, spawnSync } = await import('node:child_process')
const { createHash } = await import('node:crypto')
const { mkdirSync, chmodSync, readFileSync, writeFileSync, openSync, closeSync } = await import('node:fs')
const { homedir } = await import('node:os')
const { join } = await import('node:path')
const { strict: assert } = await import('node:assert')
const source = join(process.env.GITHUB_WORKSPACE, 'source')
const packageDir = join(source, 'package/music-player/desktop-app')
const output = join(homedir(), 'temp/agent/depot-linux-nextest')
mkdirSync(output, { recursive: true, mode: 0o700 })
chmodSync(output, 0o700)
const git = args => execFileSync('git', args, { cwd: source, encoding: 'utf8' }).trim()
const sha256 = value => createHash('sha256').update(value).digest('hex')
const identity = () => ({ head: git(['rev-parse', 'HEAD']), trackedStatus: git(['status', '--porcelain', '--untracked-files=no']), hashes: Object.fromEntries(['mise.lock', 'pnpm-lock.yaml', 'package/music-player/desktop-app/Cargo.lock', 'package/music-player/desktop-app/mise.toml'].map(path => [path, sha256(readFileSync(join(source, path)))])) })
const before = identity()
assert.equal(before.head, process.env.SOURCE_HEAD)
assert.equal(before.trackedStatus, '')
const read = args => execFileSync('mise', args, { cwd: packageDir, encoding: 'utf8' })
const task = JSON.parse(read(['tasks', 'info', '//package/music-player/desktop-app:test', '--json']))
assert.equal(task.shell, 'node --input-type=module-typescript -e')
assert.equal(task.run.length, 1)
const dispatcher = read(['config', 'get', '--file', join(packageDir, 'mise.toml'), 'vars.cargo_dispatch'])
const template = '{'.repeat(2) + 'vars.cargo_dispatch' + '}'.repeat(2)
const originalCall = "runCargo(['nextest', 'run'])"
assert.equal(task.run[0].split(template).length, 2)
assert.equal(task.run[0].split(originalCall).length, 2)
const body = task.run[0].replace(template, dispatcher)
const adapted = body.replace(originalCall, "runCargo(['nextest', 'run', '--no-fail-fast'])")
assert(!adapted.includes('{'.repeat(2)), 'Unexpected unresolved task template')
const stdout = openSync(join(output, 'stdout.log'), 'w', 0o600)
const stderr = openSync(join(output, 'stderr.log'), 'w', 0o600)
const startedAt = new Date().toISOString()
let result
try {
  result = spawnSync('mise', ['exec', '--', 'node', '--input-type=module-typescript', '-e', adapted], { cwd: packageDir, stdio: ['ignore', stdout, stderr], timeout: 30 * 60 * 1000 })
}
finally {
  closeSync(stdout)
  closeSync(stderr)
  const after = identity()
  const record = { before, after, task: task.name, originalBodySha256: sha256(body), adaptedBodySha256: sha256(adapted), adapter: '--no-fail-fast', startedAt, finishedAt: new Date().toISOString(), exitCode: result?.status, signal: result?.signal, error: result?.error?.message }
  writeFileSync(join(output, 'result.json'), JSON.stringify(record, null, 2))
  console.log(JSON.stringify(record))
  assert.deepEqual(after, before, 'Tests changed tracked historical source')
}
assert.equal(result?.status, 0, 'Historical tests failed; complete stdout and stderr retained in artifact')
'''

[tasks."trial:depot:ci:desktop-runtime"]
description = "Run the complete unchanged desktop E2E task in private user services and a software parent display"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { spawnSync } = await import('node:child_process')
const { strict: assert } = await import('node:assert')
const { existsSync, mkdirSync, readFileSync, writeFileSync } = await import('node:fs')
const { homedir, userInfo } = await import('node:os')
const { join } = await import('node:path')
const { createHash } = await import('node:crypto')
const source = join(process.env.GITHUB_WORKSPACE, 'source')
const { createRequire } = await import('node:module')
const require = createRequire(join(source, 'package/music-player/desktop-e2e/package.json'))
const { wait } = await import(require.resolve('@monochromatic-dev/module-async-time/ts'))
const app = join(source, 'package/music-player/desktop-app')
const compositor = join(source, 'package/cli/nested-wayland-session/target/release/monochromatic-nested-wayland-session')
assert(existsSync(compositor), 'The exact-head repository compositor must be built before runtime validation')
const directory = join(homedir(), 'temp/agent/depot-complete-ci')
const manifestName = process.env.DEPOT_CI_CASE ?? 'native'
const manifestBytes = readFileSync(join(process.env.GITHUB_WORKSPACE, `harness/.depot/manifests/${manifestName}.json`))
const manifest = JSON.parse(manifestBytes)
const startedAt = new Date().toISOString()
const started = performance.now()
const name = `depot-full-desktop-${process.pid}`
const parentSocket = join(directory, 'desktop-parent.sock')
const marker = join(directory, 'desktop-overlay-only')
const scratch = join(directory, 'desktop-runtime-scratch')
assert.equal(existsSync(marker), false, 'Fresh desktop runtime must not inherit another overlay marker')
const podman = ['--non-interactive', 'podman', '--cgroup-manager=cgroupfs']
function run({ args, required = true, inherit = false, input, limit = 45000 }) {
  const inputArgs = args[0] === 'exec' && input !== undefined ? ['exec', '--interactive', ...args.slice(1)] : args
  const result = spawnSync('sudo', [...podman, ...inputArgs], { encoding: 'utf8', timeout: limit, input, ...(inherit ? { stdio: 'inherit' } : {}) })
  console.log('\n' + JSON.stringify({ event: 'desktop-runtime-operation', operation: args[0], tail: args.slice(-5), status: result.status, signal: result.signal, error: result.error?.message, stdout: result.stdout, stderr: result.stderr }))
  if (required && result.status !== 0) throw new Error(`Desktop runtime operation failed: ${args[0]}`)
  return result
}
let suite
let runtimeCompleted = false
let failure
try {
  run({ args: ['run', '--detach', '--name', name, '--systemd=always', '--cgroupns=private', '--network=none', '--memory=2g', '--cpus=2', '--pids-limit=512', '--timeout=900', '--rootfs', '/:O', '/usr/lib/systemd/systemd', '--unit=basic.target', '--log-target=console'] })
  let ready = false
  for (let attempt = 0; attempt < 30; attempt += 1) {
    const result = run({ args: ['exec', name, 'systemctl', 'show', '--property=Version', '--value'], required: false })
    if (result.status === 0 && result.stdout.trim() !== '') { ready = true; break }
    await wait(500)
  }
  assert(ready, 'Isolated systemd manager must answer before user services start')
  run({ args: ['exec', name, 'systemctl', 'start', `user@${process.getuid()}.service`] })
  const user = ['exec', '--workdir', app, name, 'runuser', '--user', userInfo().username, '--', 'env', `XDG_RUNTIME_DIR=/run/user/${process.getuid()}`, `DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${process.getuid()}/bus`, `PATH=${process.env.PATH}`, 'MISE_AUTO_INSTALL=false', 'MISE_LOCKED=1', `MISE_RUST_VERSION=${process.env.MISE_RUST_VERSION}`, `MISE_TRUSTED_CONFIG_PATHS=${source}`, 'LIBGL_ALWAYS_SOFTWARE=1', 'E2E_ONLY=', `E2E_COMPOSITOR=${compositor}`]
  run({ args: [...user, 'touch', marker] })
  assert.equal(run({ args: [...user, 'cat'], input: 'container-stdin-positive-control\n' }).stdout, 'container-stdin-positive-control\n')
  run({ args: [...user, 'systemd-run', '--user', '--wait', '--pipe', '--unit=depot-full-desktop-probe', '--property=MemoryMax=256M', '/bin/cat', '/proc/self/cgroup'] })
  run({ args: [...user, 'systemctl', '--user', 'start', 'pipewire.socket', 'pipewire-pulse.socket', 'wireplumber.service'] })
  run({ args: [...user, 'pactl', 'info'] })
  const before = run({ args: [...user, 'pactl', 'list', 'short', 'sinks'] })
  run({ args: [...user, 'systemd-run', '--user', '--unit=depot-full-desktop-parent', '--property=MemoryMax=1G', '--setenv=LIBGL_ALWAYS_SOFTWARE=1', `--setenv=XDG_RUNTIME_DIR=/run/user/${process.getuid()}`, compositor, '--headless', '--gpu', 'software', '--socket', parentSocket, '--size', '1920x1080', '--', '/usr/bin/sleep', '850'] })
  let display = ''
  for (let attempt = 0; attempt < 30; attempt += 1) {
    const reply = run({ args: [...user, 'socat', '-', `UNIX-CONNECT:${parentSocket}`], input: 'display\n', required: false })
    const matched = /^ok (wayland-\d+)$/.exec(reply.stdout.trim())
    if (reply.status === 0 && matched) { display = matched[1]; break }
    await wait(500)
  }
  assert(display, 'Parent compositor must publish a real Wayland display before E2E starts')
  suite = run({ args: [...user, `WAYLAND_DISPLAY=${display}`, `E2E_TMP=${scratch}`, 'mise', 'run', '//package/music-player/desktop-app:test:e2e'], required: false, inherit: true, limit: 780000 })
  const output = join(directory, 'desktop-e2e')
  mkdirSync(output, { recursive: true, mode: 0o700 })
  run({ args: ['cp', `${name}:${app}/target/e2e/.`, output], required: false })
  const after = run({ args: [...user, 'pactl', 'list', 'short', 'sinks'] })
  const names = (text) => text.trim().split('\n').filter(Boolean).map((line) => line.split('\t')[1]).sort()
  assert.deepEqual(names(after.stdout), names(before.stdout), 'Suite must restore private audio sinks')
  const units = run({ args: [...user, 'systemctl', '--user', 'list-units', '--state=active', '--no-legend', 'music-player-e2e*'] })
  assert.equal(units.stdout.trim(), '', 'Suite must leave no running test user units')
  assert.equal(run({ args: ['exec', name, 'pgrep', '--exact', 'music-player'], required: false }).status, 1, 'Suite must leave no application process')
  run({ args: [...user, 'systemctl', '--user', 'stop', 'depot-full-desktop-parent.service', 'wireplumber.service', 'pipewire-pulse.service', 'pipewire-pulse.socket', 'pipewire.service', 'pipewire.socket'] })
  runtimeCompleted = true
} catch (error) {
  failure = String(error)
  console.error(error)
} finally {
  const retained = join(directory, 'desktop-runtime-logs')
  mkdirSync(retained, { recursive: true, mode: 0o700 })
  run({ args: ['cp', `${name}:${scratch}/.`, retained], required: false })
  const ownership = spawnSync('sudo', ['--non-interactive', 'chown', '--recursive', `${process.getuid()}:${process.getgid()}`, retained], { encoding: 'utf8' })
  if (ownership.status !== 0) console.error(ownership.stderr)
  run({ args: ['exec', name, 'journalctl', '--no-pager', `--unit=user@${process.getuid()}.service`, '--lines=80'], required: false })
  run({ args: ['logs', name], required: false })
  run({ args: ['stop', '--time=10', name], required: false })
  run({ args: ['rm', name], required: false })
  const cleanupVerified = run({ args: ['container', 'exists', name], required: false }).status === 1 && !existsSync(marker)
  runtimeCompleted = runtimeCompleted && cleanupVerified
  const record = { schemaVersion: 1, event: 'check-finished', caseId: manifest.caseId, sourceRevision: manifest.sourceRevision, manifestSha256: createHash('sha256').update(manifestBytes).digest('hex'), checkId: 'desktop-app.test.e2e', task: '//package/music-player/desktop-app:test:e2e', args: [], startedAt, finishedAt: new Date().toISOString(), elapsedMs: performance.now() - started, exitCode: suite?.status ?? null, signal: suite?.signal ?? null, status: runtimeCompleted && suite?.status === 0 ? 'passed' : 'failed', runtimeCompleted, cleanupVerified, failure, sessions: ['wide', 'narrow', 'dialog', 'quit', 'states', 'visual'], resources: { cpus: 2, memoryGiB: 2 }, providerJobUrl: process.env.DEPOT_JOB_URL }
  writeFileSync(join(directory, `${manifestName}-desktop-e2e-results.json`), JSON.stringify(record, null, 2))
  console.log('\n' + JSON.stringify(record))
}
assert(runtimeCompleted && suite?.status === 0, 'Complete desktop E2E task and cleanup must pass')
'''

[tasks."trial:depot:ci:host-probe"]
description = "Probe disposable cloud virtualization resources without creating guests"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { spawnSync } = await import('node:child_process')
const { accessSync, constants, existsSync, readdirSync, mkdirSync, writeFileSync } = await import('node:fs')
const { homedir } = await import('node:os')
const { join } = await import('node:path')
let kvmReadWrite = false
try { accessSync('/dev/kvm', constants.R_OK | constants.W_OK); kvmReadWrite = true } catch (error) { console.error(error) }
const commands = [['uname', ['--all']], ['virsh', ['--connect', 'qemu:///system', 'list', '--all']], ['virsh', ['--connect', 'qemu:///system', 'pool-list', '--all']], ['virsh', ['--connect', 'qemu:///system', 'vol-list', 'default']], ['mvm', ['--help']]]
const results = commands.map(([command, args]) => {
  const result = spawnSync(command, args, { encoding: 'utf8', timeout: 15000, maxBuffer: 1024 * 1024 })
