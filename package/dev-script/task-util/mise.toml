        const pid = Number(readFileSync(pidFile, 'utf8').trim())
        assert(Number.isSafeInteger(pid) && pid > 1)
        assert(readFileSync(`/proc/${pid}/cmdline`, 'utf8').split('\0').includes(`/usr/sbin/${name}`), 'Private PID file must still name its owned daemon')
        process.kill(pid, 'SIGTERM')
        results.push({ id: `shutdown-${name}`, pid, signal: 'SIGTERM', requestedAt: new Date().toISOString() })
      }
    }
    catch (error) {
      cleanupErrors.push(error)
      console.error(error)
    }
  }
  try {
    finalIdentity = { head: execFileSync('git', ['rev-parse', 'HEAD'], { cwd: source, encoding: 'utf8' }).trim(), trackedStatus: execFileSync('git', ['status', '--porcelain', '--untracked-files=no'], { cwd: source, encoding: 'utf8' }).trim(), inputs: inputs.map(function input(entry) { return { path: entry.path, sha256: createHash('sha256').update(readFileSync(join(source, entry.path))).digest('hex') } }) }
    assert.equal(finalIdentity.head, sourceRevision)
    assert.equal(finalIdentity.trackedStatus, '')
    assert.deepEqual(finalIdentity.inputs, inputs)
  }
  catch (error) {
    cleanupErrors.push(error)
    console.error(error)
  }
  writeFileSync(join(evidenceDirectory, 'lifecycle.json'), JSON.stringify({ sourceRevision, finalIdentity, primaryFailure: primaryFailure?.stack, cleanupErrors: cleanupErrors.map(function message(error) { return error.stack ?? String(error) }), results }, null, 2))
  if (primaryFailure) throw primaryFailure
  if (cleanupErrors.length) throw new AggregateError(cleanupErrors, 'VM cleanup or source identity verification failed')
}
'''

