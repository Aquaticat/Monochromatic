[tasks."trial:depot:ci:prepare"]
description = "Prepare locked dependencies and record available tools without running repository checks"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync } = await import('node:child_process')
const { readFileSync, writeFileSync, mkdirSync, chmodSync } = await import('node:fs')
const { createHash } = await import('node:crypto')
const { homedir } = await import('node:os')
const { join } = await import('node:path')
const { strict: assert } = await import('node:assert')
const sourceRevision = 'bae6ef28a183039a6c4ba509179dc4baaedeac2e'
const base = join(homedir(), 'temp/agent/depot-complete-ci')
mkdirSync(base, { recursive: true, mode: 0o700 })
chmodSync(base, 0o700)
const started = Date.now()
execFileSync('git', ['merge-base', '--is-ancestor', sourceRevision, 'HEAD'])
const inputs = ['mise.lock', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json']
const hashes = inputs.map(function input(path) {
  const expected = execFileSync('git', ['show', `${sourceRevision}:${path}`])
  const actual = readFileSync(path)
  assert.deepEqual(actual, expected, `${path} must match the immutable source revision`)
  return { path, sha256: createHash('sha256').update(actual).digest('hex') }
})
const before = JSON.parse(execFileSync('mise', ['ls', '--current', '--json'], { encoding: 'utf8', maxBuffer: 8 * 1024 * 1024 }))
writeFileSync(join(base, 'tools-before.json'), JSON.stringify(before, null, 2))
execFileSync('pnpm', ['install', '--frozen-lockfile'], { stdio: 'inherit' })
for (const input of hashes) assert.equal(createHash('sha256').update(readFileSync(input.path)).digest('hex'), input.sha256, `${input.path} changed during frozen dependency preparation`)
const tasks = JSON.parse(execFileSync('mise', ['tasks', '--all', '--hidden', '--json'], { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 }))
writeFileSync(join(base, 'available-tasks.json'), JSON.stringify(tasks, null, 2))
const record = { sourceRevision, inputs: hashes, elapsedMs: Date.now() - started, availableTaskCount: tasks.length, checksExecuted: false }
writeFileSync(join(base, 'prepared.json'), JSON.stringify(record, null, 2))
console.log("\n" + JSON.stringify({ phase: 'affected-ci-dependencies-prepared', ...record }))
console.log("\n" + JSON.stringify({ phase: 'affected-ci-tools', tools: Object.fromEntries(Object.entries(before).map(([name, versions]) => [name, versions.map(({ version, installed }) => ({ version, installed }))])) }))
'''

[tasks."trial:depot:ci:execute"]
description = "Execute explicit affected-package checks against a separate immutable checkout"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync, spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { readFileSync, writeFileSync, mkdirSync, chmodSync, openSync, closeSync, statSync } = await import('node:fs')
const { createHash } = await import('node:crypto')
const { homedir } = await import('node:os')
const { join } = await import('node:path')
const { strict: assert } = await import('node:assert')
assert(process.env.GITHUB_WORKSPACE, 'GITHUB_WORKSPACE is required for the isolated cloud source checkout')
process.chdir(join(process.env.GITHUB_WORKSPACE, 'source'))
const manifestName = process.env.DEPOT_CI_CASE ?? 'toml'
assert(['toml', 'native', 'logger', 'desktop'].includes(manifestName), 'Unknown affected-case manifest')
const manifestBytes = readFileSync(join(process.env.GITHUB_WORKSPACE, `harness/.depot/manifests/${manifestName}.json`))
const manifest = JSON.parse(manifestBytes)
const wave = process.env.DEPOT_CI_WAVE ?? 'core'
assert(['core', 'containers', 'all', 'static', 'unit', 'native-core', 'native-android', 'native-desktop'].includes(wave), `Unknown execution wave: ${wave}`)
const manifestSha256 = createHash('sha256').update(manifestBytes).digest('hex')
const sourceRevision = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
assert.equal(sourceRevision, manifest.sourceRevision)
const changedFiles = execFileSync('git', ['diff', '--name-only', manifest.baseRevision, sourceRevision], { encoding: 'utf8' }).trim().split('\n').sort()
assert.deepEqual(changedFiles, [...manifest.changedFiles].sort())
const catalog = JSON.parse(execFileSync('mise', ['tasks', '--all', '--hidden', '--json'], { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 }))
const selectedPackages = new Set(manifest.selectedPackages)
const tracked = execFileSync('git', ['ls-files'], { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 }).trim().split('\n')
for (const check of manifest.checks) {
  assert((check.artifactPrerequisites ?? []).every((id) => check.prerequisites.includes(id)), `Artifact prerequisites must participate in scheduling: ${check.id}`)
  const fileCheck = check.scope === 'files' && check.task === '//:lint:monochromatic-lint' && check.args.length > 0 && check.args.every((path) => manifest.changedFiles.includes(path))
  assert(check.scope === 'package' || fileCheck, `unreviewed non-package check: ${check.id}`)
  assert((check.packages ?? []).every((path) => selectedPackages.has(path)), `check outside affected closure: ${check.id}`)
  assert(catalog.some((task) => task.name === check.task), `missing exact-head task: ${check.task}`)
  if (check.task.endsWith(':lint:oxlint')) assert.deepEqual(check.args, [], 'Oxlint must retain full package reach')
  if (check.expectedFiles) {
    const actual = tracked.filter((path) => check.packages.some((pkg) => path.startsWith(`${pkg}/`)) && path.endsWith('.unit.test.ts') && (check.args.includes('--all') || check.args.includes(path))).sort()
    assert.deepEqual(actual, [...check.expectedFiles].sort(), `unit input identity mismatch: ${check.id}`)
  }
}
const inputs = ['mise.lock', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json']
for (const path of inputs) assert.deepEqual(readFileSync(path), execFileSync('git', ['show', `HEAD:${path}`]), `${path} changed during setup`)
const directory = join(homedir(), 'temp/agent/depot-complete-ci')
mkdirSync(directory, { recursive: true, mode: 0o700 })
chmodSync(directory, 0o700)
const identity = { schemaVersion: 1, caseId: manifest.caseId, sourceRevision, manifestSha256, providerJobUrl: process.env.DEPOT_JOB_URL, resources: { cpus: Number(process.env.DEPOT_CI_CPUS ?? 16), memoryGiB: Number(process.env.DEPOT_CI_MEMORY_GIB ?? 64) } }
const results = []
const logDirectory = join(directory, 'check-logs')
mkdirSync(logDirectory, { recursive: true, mode: 0o700 })
const requestedIds = process.env.DEPOT_CI_CHECK_IDS ? JSON.parse(process.env.DEPOT_CI_CHECK_IDS) : undefined
if (requestedIds) {
  assert(Array.isArray(requestedIds) && requestedIds.length > 0, 'Explicit check selection must be a nonempty JSON array')
  assert.equal(new Set(requestedIds).size, requestedIds.length, 'Explicit check selection must not repeat IDs')
  for (const id of requestedIds) assert(typeof id === 'string' && manifest.checks.some((check) => check.id === id), `Unknown explicitly selected check: ${id}`)
}
const initialDeferred = manifest.checks.filter((check) => {
  if (requestedIds) return !requestedIds.includes(check.id)
  const container = check.task.endsWith(':test:mutation') || check.task.endsWith(':test:container')
  if (wave === 'static') return !check.task.endsWith(':lint:oxlint') && !check.task.endsWith(':lint:types')
  if (wave === 'unit') return !check.task.endsWith(':test:unit')
  if (wave === 'native-core') return !check.id.startsWith('truepeak-core.') && !check.id.startsWith('root.changed-')
  if (wave === 'native-android') return !check.id.startsWith('android-app.') || check.task.endsWith(':test:instrumented')
  if (wave === 'native-desktop') return (!check.id.startsWith('desktop-app.') && !check.id.startsWith('root.changed-')) || check.task.endsWith(':test:e2e')
  return wave === 'core' ? container : wave === 'containers' ? !container && check.family !== 'build' : false
}).map((check) => check.id)
const activeIds = new Set(manifest.checks.filter((check) => !initialDeferred.includes(check.id)).map((check) => check.id))
const prerequisiteQueue = [...activeIds]
for (let index = 0; index < prerequisiteQueue.length; index += 1) {
  const check = manifest.checks.find((item) => item.id === prerequisiteQueue[index])
  assert(check, `Unknown prerequisite check: ${prerequisiteQueue[index]}`)
  for (const id of check.prerequisites ?? []) {
    if (activeIds.has(id)) continue
    activeIds.add(id)
    prerequisiteQueue.push(id)
  }
}
const deferredChecks = manifest.checks.filter((check) => !activeIds.has(check.id)).map((check) => ({ checkId: check.id, reason: `Required check belongs to another execution wave; current wave: ${wave}` }))
for (const check of manifest.checks.filter((item) => activeIds.has(item.id))) assert((check.prerequisites ?? []).every((id) => activeIds.has(id)), `Selected check has a deferred prerequisite: ${check.id}`)
const requestedCheckIds = requestedIds ?? manifest.checks.filter(check => !initialDeferred.includes(check.id)).map(check => check.id)
const selectedCheckIds = [...activeIds]
const caseIdentity = { ...identity, completeGraph: manifest.completeGraph === true, manifestCheckIds: manifest.checks.map(check => check.id), requestedCheckIds, selectedCheckIds, activeCheckIds: selectedCheckIds, prerequisiteCheckIds: selectedCheckIds.filter(id => !requestedCheckIds.includes(id)) }
const runningCheckRecords = new Map()
let sourceInputsVerified = false
function writeCase({ event, executionState, conclusion, caseError }) {
  const remainingActiveCheckIds = selectedCheckIds.filter(id => !results.some(record => record.checkId === id))
  const record = { ...caseIdentity, event, executionState, conclusion, caseError, sourceInputsVerified, allActiveChecksHaveTerminalRecords: remainingActiveCheckIds.length === 0, remainingActiveCheckIds, runningChecks: [...runningCheckRecords.values()], results, deferredChecks, externalChecks: manifest.externalChecks }
  writeFileSync(join(directory, `${manifest.caseId}-results.json`), JSON.stringify(record, null, 2))
  return record
}
console.log("\n" + JSON.stringify({ ...caseIdentity, event: 'case-started', executionState: 'running', deferredChecks, tools: JSON.parse(execFileSync('mise', ['ls', '--current', '--json'], { encoding: 'utf8', maxBuffer: 8 * 1024 * 1024 })) }))
writeCase({ event: 'case-started', executionState: 'running' })
async function execute(check) {
  const startedAt = new Date().toISOString()
  const started = performance.now()
  const noFailFast = check.id === 'desktop-app.test' && process.env.DEPOT_CI_TEST_NO_FAIL_FAST === '1'
  const execution = noFailFast ? { task: '//package/dev-script/task-util:trial:depot:linux-nextest', adapter: '--no-fail-fast', workingDirectory: join(process.env.GITHUB_WORKSPACE, 'harness') } : undefined
  const checkIdentity = { ...identity, selectedCheckIds, checkId: check.id, task: check.task, args: check.args, startedAt, expectedFiles: check.expectedFiles, execution }
  const deferred = deferredChecks.find((item) => item.checkId === check.id)
  const failedPrerequisites = (check.prerequisites ?? []).filter((id) => results.find((result) => result.checkId === id)?.status !== 'passed')
  const skipReason = deferred?.reason ?? (failedPrerequisites.length > 0 ? `Required builds did not pass: ${failedPrerequisites.join(', ')}` : undefined)
  console.log("\n" + JSON.stringify({ ...checkIdentity, event: skipReason ? 'check-skipped' : 'check-started', skipReason }))
  let exitCode = null
  let signal = null
  let outputLog
  let outputSha256
  let outputBytes
  let spawnError
  if (!skipReason) {
    runningCheckRecords.set(check.id, { checkId: check.id, task: check.task, args: check.args, startedAt })
    writeCase({ event: 'case-progress', executionState: 'running' })
    assert(/^[a-zA-Z0-9._-]+$/.test(check.id), 'Check ID must be safe as an evidence filename')
    outputLog = join(logDirectory, `${check.id}.log`)
    const descriptor = openSync(outputLog, 'w', 0o600)
    try {
      const child = spawn('mise', ['run', execution?.task ?? check.task, ...(check.args.length > 0 ? ['--', ...check.args] : [])], { ...(execution ? { cwd: execution.workingDirectory } : {}), stdio: ['ignore', descriptor, descriptor], env: { ...process.env, ...(check.env ?? {}), ...(noFailFast ? { SOURCE_HEAD: manifest.sourceRevision } : {}) } })
      ;[exitCode, signal] = await once(child, 'exit')
    } catch (error) {
      spawnError = { name: error.name, message: error.message, code: error.code }
      console.error(error)
    } finally {
      closeSync(descriptor)
    }
    const output = readFileSync(outputLog)
    outputSha256 = createHash('sha256').update(output).digest('hex')
    outputBytes = statSync(outputLog).size
    if (exitCode !== 0) console.error(JSON.stringify({ event: 'check-diagnostic-tail', checkId: check.id, output: output.subarray(-16000).toString() }))
  }
  const record = { ...checkIdentity, event: 'check-finished', finishedAt: new Date().toISOString(), elapsedMs: performance.now() - started, exitCode, signal, spawnError, status: skipReason ? 'skipped' : exitCode === 0 ? 'passed' : 'failed', skipReason, outputLog, outputSha256, outputBytes }
  results.push(record)
  runningCheckRecords.delete(check.id)
  console.log("\n" + JSON.stringify(record))
  writeCase({ event: 'case-progress', executionState: 'running' })
  return check.id
}
const workers = Number(process.env.DEPOT_CI_WORKERS ?? 1)
assert(Number.isInteger(workers) && workers >= 1 && workers <= 4, 'Worker count must be between one and four')
const pending = new Map(manifest.checks.map((check) => [check.id, check]))
const running = new Map()
let caseError
try {
while (pending.size > 0 || running.size > 0) {
  for (const [id, check] of pending) {
    if (running.size >= workers) break
    const deferred = deferredChecks.some((item) => item.checkId === id)
    const dependenciesFinished = (check.prerequisites ?? []).every((prerequisite) => results.some((result) => result.checkId === prerequisite))
    if (!deferred && !dependenciesFinished) continue
    pending.delete(id)
    running.set(id, execute(check))
  }
  assert(running.size > 0, 'Selected check graph has unresolved or cyclic prerequisites')
  const finished = await Promise.race(running.values())
  running.delete(finished)
}
for (const path of inputs) assert.deepEqual(readFileSync(path), execFileSync('git', ['show', `HEAD:${path}`]), `${path} changed during checks`)
sourceInputsVerified = true
} catch (error) {
  caseError = { name: error.name, message: error.message, code: error.code }
  throw error
} finally {
  const incomplete = caseError !== undefined || selectedCheckIds.some(id => !results.some(record => record.checkId === id))
  const failed = results.some(result => activeIds.has(result.checkId) && result.status !== 'passed')
  const record = writeCase({ event: incomplete ? 'case-aborted' : 'case-finished', executionState: incomplete ? 'aborted' : 'finished', conclusion: incomplete ? 'incomplete' : failed ? 'failed' : 'passed', caseError })
  console.log("\n" + JSON.stringify(record))
}
if (results.some((result) => result.status === 'failed')) throw new Error('Affected-package checks failed; see retained per-check records')
'''

[tasks."trial:depot:ci:containers"]
description = "Activate the previously verified rootful container boundary outside the immutable source"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync, spawnSync } = await import('node:child_process')
const { readFileSync, writeFileSync, mkdirSync, chmodSync, realpathSync, existsSync, appendFileSync, statSync } = await import('node:fs')
const { join, delimiter } = await import('node:path')
const { homedir } = await import('node:os')
const { strict: assert } = await import('node:assert')
const executable = process.env.PATH.split(delimiter).map((directory) => join(directory, 'podman')).find((path) => existsSync(path))
assert(executable, 'Podman must exist in the prepared image')
const podman = realpathSync(executable)
const base = join(homedir(), 'temp/agent/depot-complete-ci/container-bin')
mkdirSync(base, { recursive: true, mode: 0o700 })
chmodSync(base, 0o700)
const wrapper = [
  '#!/usr/bin/env node',
  "const { spawnSync } = await import('node:child_process');",
  'const [command, ...args] = process.argv.slice(2);',
  "const limits = command === 'run' ? ['--memory=2g', '--cpus=2', '--pids-limit=512'] : [];",
  "const mutation = command === 'run' && args.some((arg) => arg.includes(':/manifest:'));",
  "const identity = mutation ? ['--user', `${process.getuid()}:${process.getgid()}`] : [];",
  "const mappedArgs = args.map((arg, index) => mutation && args[index - 1] === '--tmpfs' ? `${arg},mode=1777` : arg);",
  `const result = spawnSync('sudo', ['--non-interactive', ${JSON.stringify(podman)}, command, ...limits, ...identity, ...mappedArgs], { stdio: 'inherit' });`,
  'if (result.error) throw result.error;',
  'process.exitCode = result.status ?? 1;',
  '',
].join('\n')
writeFileSync(join(base, 'podman'), wrapper, { mode: 0o700 })
execFileSync('sudo', ['--non-interactive', podman, '--version'], { stdio: 'inherit' })
execFileSync('sudo', ['--non-interactive', podman, 'run', '--memory=2g', '--cpus=2', '--pids-limit=512', '--rm', 'docker.io/library/alpine:3.22', 'true'], { stdio: 'inherit' })
const fixture = join(base, 'mutation-private-fixture')
mkdirSync(fixture, { recursive: true, mode: 0o700 })
chmodSync(fixture, 0o700)
writeFileSync(join(fixture, 'shard-manifest.json'), 'mutation-private-input\n', { mode: 0o600 })
const controlArgs = ['run', '--rm', '--network=none', '--read-only', '--cap-drop=ALL', '--security-opt=no-new-privileges', '--memory=2g', '--cpus=2', '--pids-limit=64', '--timeout=30', '--volume', `${fixture}:/manifest:rw`]
const denied = spawnSync('sudo', ['--non-interactive', podman, ...controlArgs, 'docker.io/library/alpine:3.22', 'cat', '/manifest/shard-manifest.json'], { encoding: 'utf8', timeout: 45000 })
assert.notEqual(denied.status, 0, 'Unmapped root without capabilities must demonstrate the private-directory permission boundary')
assert(denied.stderr.includes('Permission denied'), 'Negative control must fail on fixture access')
const allowed = spawnSync(join(base, 'podman'), [...controlArgs, '--tmpfs', '/work:rw,exec,size=1m', 'docker.io/library/alpine:3.22', 'sh', '-c', 'cp /manifest/shard-manifest.json /work/input && cp /work/input /manifest/result.json'], { encoding: 'utf8', timeout: 45000 })
console.log('\n' + JSON.stringify({ event: 'mutation-identity-control', deniedStatus: denied.status, deniedError: denied.stderr, mappedStatus: allowed.status, mappedError: allowed.stderr, uid: process.getuid(), gid: process.getgid() }))
assert.equal(allowed.status, 0, allowed.stderr)
assert.equal(readFileSync(join(fixture, 'result.json'), 'utf8'), 'mutation-private-input\n')
assert.equal(statSync(join(fixture, 'result.json')).uid, process.getuid())
appendFileSync(process.env.GITHUB_PATH, `${base}\n`)
console.log("\n" + JSON.stringify({ event: 'container-boundary-ready', executable: podman, boundary: 'sudo --non-interactive', memory: '2g', cpus: 2, pidsLimit: 512 }))
'''

[tasks."trial:depot:ci:generated"]
description = "Run affected generator consistency against a disposable exact-head checkout"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync, spawnSync } = await import('node:child_process')
const { readFileSync, writeFileSync, mkdirSync, chmodSync } = await import('node:fs')
const { join } = await import('node:path')
const { homedir } = await import('node:os')
const { strict: assert } = await import('node:assert')
const source = join(process.env.GITHUB_WORKSPACE, 'source')
const { createHash } = await import('node:crypto')
const manifestBytes = readFileSync(join(process.env.GITHUB_WORKSPACE, 'harness/.depot/manifests/toml.json'))
const manifest = JSON.parse(manifestBytes)
const manifestSha256 = createHash('sha256').update(manifestBytes).digest('hex')
const sourceRevision = execFileSync('git', ['rev-parse', 'HEAD'], { cwd: source, encoding: 'utf8' }).trim()
assert.equal(sourceRevision, manifest.sourceRevision)
const base = join(homedir(), 'temp/agent/depot-complete-ci')
mkdirSync(base, { recursive: true, mode: 0o700 })
chmodSync(base, 0o700)
const fixture = join(base, `${manifest.caseId}-generated-fixture`)
const env = { ...process.env, GIT_LFS_SKIP_SMUDGE: '1', MISE_TRUSTED_CONFIG_PATHS: `${process.env.MISE_TRUSTED_CONFIG_PATHS ?? ''}:${fixture}` }
execFileSync('git', ['worktree', 'add', '--detach', fixture, sourceRevision], { cwd: source, env, stdio: 'inherit' })
execFileSync('mise', ['run', 'prepare:pnpm:install', '--', '--frozen-lockfile'], { cwd: fixture, env, stdio: 'inherit' })
execFileSync('mise', ['run', '//package/git-policy/cli:build'], { cwd: fixture, env, stdio: 'inherit' })
execFileSync('mise', ['exec', '--', 'node', join(fixture, 'package/git-policy/cli/dist/final/node/index.mjs'), 'cli-git', 'trust', '--yes'], { cwd: fixture, env, stdio: 'inherit' })
const startedAt = new Date().toISOString()
const started = performance.now()
const result = spawnSync('mise', ['run', 'sync:files'], { cwd: fixture, env, stdio: 'inherit' })
if (result.error) console.error(result.error)
const diff = execFileSync('git', ['diff', '--name-only'], { cwd: fixture, encoding: 'utf8' }).trim()
writeFileSync(join(base, `${manifest.caseId}-generated.patch`), execFileSync('git', ['diff', '--binary'], { cwd: fixture, maxBuffer: 32 * 1024 * 1024 }))
const untracked = execFileSync('git', ['ls-files', '--others', '--exclude-standard'], { cwd: fixture, encoding: 'utf8' }).trim()
const record = { schemaVersion: 1, event: 'check-finished', caseId: manifest.caseId, sourceRevision, manifestSha256, checkId: 'root.generated-consistency', task: '//:sync:files', args: [], startedAt, finishedAt: new Date().toISOString(), elapsedMs: performance.now() - started, exitCode: result.status, signal: result.signal, status: result.status === 0 && diff === '' && untracked === '' ? 'passed' : 'failed', changedTrackedFiles: diff, newFiles: untracked }
writeFileSync(join(base, `${manifest.caseId}-generated-results.json`), JSON.stringify(record, null, 2))
console.log("\n" + JSON.stringify(record))
assert.equal(record.status, 'passed', 'Generated outputs differ or generation failed in the disposable fixture')
'''

[tasks."trial:depot:ci:control"]
description = "Exercise the actual CI executor against isolated passing, failing, and invalid-scope fixtures"
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync, spawnSync } = await import('node:child_process')
const { mkdirSync, chmodSync, writeFileSync, readFileSync } = await import('node:fs')
const { join } = await import('node:path')
const { homedir } = await import('node:os')
const { strict: assert } = await import('node:assert')
const control = process.env.DEPOT_CI_CONTROL_CASE
assert(['passing', 'failure', 'oxlint-args', 'oxlint-scope', 'deferred-prerequisite', 'metadata-progress'].includes(control), 'Unknown executor control')
const base = join(homedir(), 'temp/agent/depot-complete-ci', `control-${control}`)
const source = join(base, 'source')
const packageRoot = join(source, 'package/control/fixture')
const manifestRoot = join(base, 'harness/.depot/manifests')
mkdirSync(packageRoot, { recursive: true, mode: 0o700 })
mkdirSync(manifestRoot, { recursive: true, mode: 0o700 })
chmodSync(base, 0o700)
writeFileSync(join(source, 'mise.toml'), 'monorepo_root = true\n[monorepo]\nconfig_roots = ["package/*/*"]\n')
writeFileSync(join(source, 'mise.lock'), '')
