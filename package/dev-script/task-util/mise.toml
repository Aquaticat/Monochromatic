const results = []
const sourceRevision = execFileSync('git', ['rev-parse', 'HEAD'], { cwd: source, encoding: 'utf8' }).trim()
assert.equal(sourceRevision, 'ef01490f5e960f8ca0b424c12242caeb3c5a2b5e')
const inputs = ['mise.lock', 'pnpm-lock.yaml', 'package/cli/vmsync/src/lifecycle.expensive.unit.test.ts'].map(function input(path) { return { path, sha256: createHash('sha256').update(readFileSync(join(source, path))).digest('hex') } })
assert.equal(execFileSync('git', ['status', '--porcelain', '--untracked-files=no'], { cwd: source, encoding: 'utf8' }).trim(), '', 'Immutable checkout must begin with no staged or unstaged tracked changes')
const deadline = Date.now() + 60 * 60 * 1000
function run({ id, command, args, timeout = 120000, commandEnv = env, cleanup = false }) {
  const remaining = deadline - Date.now() - 120000
  if (!cleanup && remaining <= 0) throw new Error('VM experiment deadline reached; reserve remaining time for cleanup')
  const startedAt = new Date().toISOString()
  const result = spawnSync(command, args, { cwd: source, env: commandEnv, encoding: 'utf8', timeout: cleanup ? timeout : Math.min(timeout, remaining), maxBuffer: 32 * 1024 * 1024 })
