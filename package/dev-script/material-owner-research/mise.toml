[tasks."material:source"]
quiet = true
shell = "node --max-old-space-size=768 --input-type=module-typescript -e"
run = "{{vars.material_stage}}\nawait materialStage({stage:\"source\"})"

[tasks."material:prerequisites"]
quiet = true
shell = "node --max-old-space-size=768 --input-type=module-typescript -e"
run = "{{vars.material_stage}}\nawait materialStage({stage:\"prerequisites\"})"

[tasks."material:producer"]
quiet = true
shell = "node --max-old-space-size=768 --input-type=module-typescript -e"
run = "{{vars.material_stage}}\nawait materialStage({stage:\"producer\"})"

[tasks."material:consumer"]
quiet = true
shell = "node --max-old-space-size=768 --input-type=module-typescript -e"
run = "{{vars.material_stage}}\nawait materialStage({stage:\"consumer\"})"

[tasks."material:finalize"]
quiet = true
shell = "node --max-old-space-size=768 --input-type=module-typescript -e"
run = "{{vars.material_stage}}\nawait materialStage({stage:\"finalize\"})"

[tasks."material:cleanup"]
quiet = true
shell = "node --max-old-space-size=768 --input-type=module-typescript -e"
run = "{{vars.material_stage}}\nawait materialStage({stage:\"cleanup\"})"
