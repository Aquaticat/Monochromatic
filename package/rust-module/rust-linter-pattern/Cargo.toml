[package]
name = "monochromatic-rust-linter-pattern"
version = "0.1.0"
authors = ["Aquaticat"]
categories = ["development-tools"]
documentation = "https://docs.rs/monochromatic-rust-linter-pattern"
edition = "2024"
homepage = "https://github.com/Aquaticat/Monochromatic/tree/main/package/rust-module/rust-linter-pattern"
include = [
  "src/**/*.rs",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSES/*.txt",
]
keywords = ["lint", "pattern", "rust", "ast", "structural-search"]
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticat/Monochromatic.git"
description = "Structural pattern matching over Rust syntax trees, for declarative monochromatic-rust-linter rules."

[lints.clippy]
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"

[lib]
name = "monochromatic_rust_linter_pattern"
path = "src/lib.rs"

[dependencies]
# The shared foundation, for the span and diagnostic types a pattern rule emits.
monochromatic-rust-linter-core = { path = "../rust-linter-core", version = "0.1.0" }

# `ra_ap_syntax` is pinned to EXACTLY the version the other two crates pin,
# because all three pass `SyntaxNode` values across their boundaries and a
# version skew would make them unrelated types that do not unify.
ra_ap_syntax = "=0.0.335"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]
