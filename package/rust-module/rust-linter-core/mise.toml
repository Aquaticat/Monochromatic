[tasks.build]
description = "Build the rust-linter-core library in release mode"
run = "cargo build --release"

[tasks."build:debug"]
description = "Build the rust-linter-core library in debug mode"
run = "cargo build"

[tasks.lint]
description = "cargo check (no codegen)"
run = "cargo check"

[tasks."lint:clippy"]
description = "Run clippy with warnings denied"
run = "cargo clippy --release --all-targets -- -D warnings"

[tasks."format:clippy"]
description = "Apply clippy's machine-applicable suggestions in place"
run = "cargo clippy --fix --allow-dirty --allow-staged"

[tasks."lint:rust"]
description = "Run monochromatic-rust-linter (max-lines + require-rustdoc) over this package's .rs"
# This looks like a cycle and is not one. The linter depends on this crate, and
# this task runs the linter over this crate. Cargo resolves it in one direction:
# it builds the linter from the linter's own manifest, reading this crate's
# source as it stands on disk, then runs the resulting binary over that same
# source. Nothing here depends on the linter having already been built.
run = "cargo run --quiet --manifest-path ../../linter/rust/Cargo.toml -- ."

[tasks.test]
description = "cargo nextest run"
run = "cargo nextest run --release"

[tasks."test:debug"]
description = "cargo nextest run in debug mode for fast iteration"
run = "cargo nextest run"

[tasks.package]
description = "Build the crates.io package tarball"
run = "cargo package"
