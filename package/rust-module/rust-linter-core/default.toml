# Built-in configuration for monochromatic-rust-linter.
#
# Compiled into the binary by `include_str!` in src/config.rs and applied
# beneath every discovered `rust-linter.toml`, so a checkout with no
# configuration behaves exactly as the linter did when these exemptions were
# hardcoded Rust predicates in the CLI crate.
#
# Anything here can be overridden by a `rust-linter.toml`, because a discovered
# file is merged on top of this one.

[categories]
# Both shipped rules are `pedantic`, which is off by default in oxlint's
# category scheme. They are enabled explicitly under [rules] below rather than
# by turning the whole category on, so adding a future pedantic rule does not
# silently switch it on for every consumer.
pedantic = "off"

[rules]
# The per-file code-line budget, mirroring oxlint's eslint/max-lines. The 300
# is the same budget oxlint enforces on TypeScript in this repository.
"builtin/max-lines" = { severity = "error", max = 300 }

# Rustdoc on every documentable item, mirroring the require-tsdoc rule.
"builtin/require-rustdoc" = "error"

# Integration tests. Test code is exempt from both the budget and the
# documentation requirement, matching oxlint's overrides for `**/*.test.ts`.
[[overrides]]
files = ["**/tests/**"]

[overrides.rules]
"builtin/max-lines" = "off"
"builtin/require-rustdoc" = "off"

# The repository's unit-test convention: tests live in a sibling `*_tests.rs`
# beside the module they cover.
[[overrides]]
files = ["**/*_tests.rs"]

[overrides.rules]
"builtin/max-lines" = "off"
"builtin/require-rustdoc" = "off"

# Fuzz harnesses. Generated or throwaway entry points, not production code.
[[overrides]]
files = ["**/fuzz/**"]

[overrides.rules]
"builtin/max-lines" = "off"
"builtin/require-rustdoc" = "off"

# Cargo build scripts. Configuration-like glue, and tiny in practice.
[[overrides]]
files = ["**/build.rs", "build.rs"]

[overrides.rules]
"builtin/max-lines" = "off"
"builtin/require-rustdoc" = "off"

# Deliberate linter samples. Files under these directories exist precisely to
# violate rules, so scanning them is self-defeating. Mirrors oxlint's
# ignorePatterns for `**/fixture/**`, `**/test-fixture/**` and `**/invalid/**`.
#
# Both rules are exempted, which is what the replaced Rust predicates did: the
# integration test `undocumented_fixture_in_place_is_exempt` asserts that
# `fixture/undocumented.rs` is silent where it sits, while
# `undocumented_fixture_exits_nonzero` copies it somewhere without a `fixture`
# segment and asserts it is reported there.
#
# Note this contradicts README.md, which claims require-rustdoc has no fixtures
# carve-out. The code and its tests are the authority; the README is wrong and
# is rewritten in work item 12.
[[overrides]]
files = ["**/fixture/**", "**/test-fixture/**", "**/invalid/**"]

[overrides.rules]
"builtin/max-lines" = "off"
"builtin/require-rustdoc" = "off"
