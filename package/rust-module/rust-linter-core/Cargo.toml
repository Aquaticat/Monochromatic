[package]
name = "monochromatic-rust-linter-core"
version = "0.1.0"
authors = ["Aquaticat"]
categories = ["development-tools"]
documentation = "https://docs.rs/monochromatic-rust-linter-core"
edition = "2024"
homepage = "https://github.com/Aquaticat/Monochromatic/tree/main/package/rust-module/rust-linter-core"
include = [
  "src/**/*.rs",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSES/*.txt",
]
keywords = ["lint", "linter", "rust", "diagnostics", "autofix"]
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticat/Monochromatic.git"
description = "Rule trait, lint context, diagnostic and fix model shared by monochromatic-rust-linter and its rule packages."

[lints.clippy]
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"

[lib]
name = "monochromatic_rust_linter_core"
path = "src/lib.rs"

[dependencies]
# `serde` derives the config deserializers; `toml` is the config file format
# chosen in doc/planning/rust-linter-oxlint-parity.md decision D3, so the binary
# reads its configuration with no external runtime. Issue #400 tracks revisiting
# that format.
serde = { version = "1", features = ["derive"] }
toml = "1"

# `globset` compiles the `files`, `exclude-files` and `ignore-patterns` globs
# into a single matcher. It is BurntSushi's, the same family as the `ignore`
# walker the CLI already uses, so glob semantics match between the two.
globset = "0.4"

# `ra_ap_syntax` is rust-analyzer's own lossless syntax-tree crate. Pinned to
# EXACTLY the same version the CLI crate pins, because the two share `SyntaxNode`
# values across the crate boundary: a version skew would make them two unrelated
# types that do not unify. Re-pin both together, never one alone.
ra_ap_syntax = "=0.0.335"

[dev-dependencies]
# `tempfile` gives each config-loading test its own throwaway directory, so a
# test that writes rust-linter.toml files never touches the developer's tree.
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]
