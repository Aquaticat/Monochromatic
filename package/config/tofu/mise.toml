[tasks.lint]
run = [{ tasks = ["lint:tofu", "lint:oxlint", "lint:types"] }]

[tasks.test]
run = [
  { tasks = ["test:storagebox-resolver", "test:hosts-resolver", "test:external-caches"] },
]

[tasks."test:storagebox-resolver"]
description = "Smoke-test Storage Box hostname resolver without network access"
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const result = JSON.parse(execFileSync('node', ['src/resolve_storagebox_hosts.ts'], { input: '{"hostnames":""}', encoding: 'utf8' }))
if (result.ips !== '') { throw new Error(`expected empty ips, got ${result.ips}`) }
let wildcardFailed = false
try { execFileSync('node', ['src/resolve_storagebox_hosts.ts'], { input: '{"hostnames":"*.your-storagebox.de"}', encoding: 'utf8' }) } catch { wildcardFailed = true }
if (!wildcardFailed) { throw new Error('expected wildcard hostname resolution to fail') }
"""

[tasks."test:storagebox-resolver:network"]
description = "Resolve a real Storage Box hostname through DNS"
usage = 'arg "host" help="Concrete your-storagebox.de hostname to resolve"'
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const host = process.env.usage_host
const result = JSON.parse(execFileSync('node', ['src/resolve_storagebox_hosts.ts'], { input: JSON.stringify({ hostnames: host }), encoding: 'utf8' }))
if (result.ips === '') { throw new Error(`expected resolved ips for ${host}`) }
"""

[tasks."test:hosts-resolver"]
description = "Smoke-test service hostname resolver without network access"
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const result = JSON.parse(execFileSync('node', ['src/resolve_hosts.ts'], { input: '{"hostnames":""}', encoding: 'utf8' }))
if (Object.keys(result).length !== 0) { throw new Error(`expected empty map, got ${JSON.stringify(result)}`) }
let wildcardFailed = false
try { execFileSync('node', ['src/resolve_hosts.ts'], { input: '{"hostnames":"*.example.com"}', encoding: 'utf8', stdio: ['pipe', 'pipe', 'pipe'] }) } catch { wildcardFailed = true }
if (!wildcardFailed) { throw new Error('expected wildcard hostname resolution to fail') }
"""

[tasks."test:hosts-resolver:network"]
description = "Resolve a real service hostname through DNS"
usage = 'arg "host" default="nginx.org" help="Hostname to resolve"'
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const host = process.env.usage_host
const result = JSON.parse(execFileSync('node', ['src/resolve_hosts.ts'], { input: JSON.stringify({ hostnames: host }), encoding: 'utf8' }))
if (!result[host]) { throw new Error(`expected resolved ips for ${host}`) }
"""

[tasks."test:external-caches"]
description = "Smoke-test OpenTofu external helpers against local cache files when present"
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { existsSync, readFileSync } = await import('node:fs')
if (existsSync('src/cache_AS41231.txt')) {
  const asn = JSON.parse(execFileSync('node', ['src/fetch_ips.ts'], { input: '{"asn":"AS41231"}', encoding: 'utf8' }))
  if (asn.ips === '') { throw new Error('expected cached AS41231 ips') }
}
if (existsSync('src/cache_tor_relays.txt')) {
  const tor = JSON.parse(execFileSync('node', ['src/fetch_tor_relays.ts'], { input: '{}', encoding: 'utf8' }))
  if (tor.ips === '') { throw new Error('expected cached Tor relay ips') }
}
if (existsSync('src/cache_resolved_hosts.json')) {
  const hosts = JSON.parse(readFileSync('src/cache_resolved_hosts.json', 'utf8'))
  if (Object.keys(hosts).length === 0) { throw new Error('expected cached resolved hosts') }
}
"""

[tasks.format]
run = [{ tasks = ["format:tofu"] }]

[tasks."format:tofu"]
description = "Format OpenTofu configuration"
run = "tofu fmt"

[tasks."lint:tofu"]
description = "Validate OpenTofu configuration"
run = [
  "tofu fmt -check -diff",
  "tofu validate",
]

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."lint:types"]
extends = "lint:types"
