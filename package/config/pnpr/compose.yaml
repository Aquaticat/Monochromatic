# Coolify "Docker Compose" resource for the private pnpr registry.
# Runbook: doc/runbook/deploy-pnpr-registry.md
services:
  pnpr:
    build:
      context: .
      dockerfile: Containerfile
    # pnpr as PID 1 ignores SIGTERM, so every stop waited for the kill timeout.
    init: true
    restart: unless-stopped
    # Loopback only: the host's self-managed Caddy terminates TLS and reverse-proxies here.
    ports:
      - '127.0.0.1:7677:7677'
    environment:
      # Signing secret for pnpr sessions and tokens; set in Coolify, never committed.
      PNPR_SECRET: ${PNPR_SECRET:?Set PNPR_SECRET in the Coolify environment variables}
      # Public origin used for tarball URLs; also the OIDC audience in config.yaml.
      PNPR_PUBLIC_URL: https://pnpr.c.aquati.cat
    volumes:
      # No backup by decision: recovery republishes current versions.
      # Named pnpr-registry-storage since the switch to the patched image, which runs as user pnpr:
      # the earlier pnpr-storage volume is owned by the node:24-slim image's node user and held no packages.
      - pnpr-registry-storage:/pnpr/storage

volumes:
  pnpr-registry-storage:
