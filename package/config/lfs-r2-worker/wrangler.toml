name = "monochromatic-lfs"
# The handler-only neutral bundle produced by `mise run build`; the deploy tasks depend on
# that build so wrangler ships the same artifact the unit tests exercised.
main = "dist/final/neutral/worker.mjs"
compatibility_date = "2026-06-01"
workers_dev = true

# Download is anonymous (public read). Upload is gated by the LFS_WRITE_TOKEN
# secret, set out-of-band with: wrangler secret put LFS_WRITE_TOKEN
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "monochromatic-lfs"
