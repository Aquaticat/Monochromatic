[tasks.lint]
run = [{ tasks = ["lint:tofu", "lint:oxlint", "lint:types"] }]

[tasks.test]
run = [{ tasks = ["test:storagebox-resolver", "test:external-caches"] }]

[tasks."test:storagebox-resolver"]
description = "Smoke-test Storage Box hostname resolver without network access"
run = """
let result = ('{\"hostnames\":\"\"}' | bun run resolve_storagebox_hosts.ts | from json)
if $result.ips != '' {
  error make { msg: $'expected empty ips, got ($result.ips)' }
}
let wildcard = ('{\"hostnames\":\"*.your-storagebox.de\"}' | bun run resolve_storagebox_hosts.ts | complete)
if $wildcard.exit_code == 0 {
  error make { msg: 'expected wildcard hostname resolution to fail' }
}
"""

[tasks."test:storagebox-resolver:network"]
description = "Resolve a real Storage Box hostname through DNS"
usage = 'arg "host" help="Concrete your-storagebox.de hostname to resolve"'
run = """
let result = ($'{\"hostnames\":\"($env.usage_host)\"}' | bun run resolve_storagebox_hosts.ts | from json)
if $result.ips == '' {
  error make { msg: $'expected resolved ips for ($env.usage_host)' }
}
"""

[tasks."test:external-caches"]
description = "Smoke-test OpenTofu external helpers against local cache files when present"
run = """
if ('cache_AS41231.json' | path exists) {
  let asn = ('{\"asn\":\"AS41231\"}' | bun run fetch_ips.ts | from json)
  if $asn.ips == '' {
    error make { msg: 'expected cached AS41231 ips' }
  }
}
if ('cache_tor_relays.json' | path exists) {
  let tor = ('{}' | bun run fetch_tor_relays.ts | from json)
  if $tor.ips == '' {
    error make { msg: 'expected cached Tor relay ips' }
  }
}
"""

[tasks.format]
run = [{ tasks = ["format:tofu"] }]

[tasks."format:tofu"]
description = "Format OpenTofu configuration"
run = "tofu fmt"

[tasks."lint:tofu"]
description = "Validate OpenTofu configuration"
run = [
  "tofu fmt -check -diff",
  "tofu validate",
]

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."lint:types"]
extends = "lint:types"
