[tasks.lint]
run = [{ tasks = ["lint:tofu", "lint:oxlint", "lint:types"] }]

[tasks.test]
run = [{ tasks = ["test:storagebox-resolver", "test:external-caches"] }]

[tasks."test:storagebox-resolver"]
description = "Smoke-test Storage Box hostname resolver without network access"
shell = "node -e"
run = """
const { execFileSync } = await import('node:child_process')
const result = JSON.parse(execFileSync('node', ['resolve_storagebox_hosts.ts'], { input: '{"hostnames":""}', encoding: 'utf8' }))
if (result.ips !== '') { throw new Error(`expected empty ips, got ${result.ips}`) }
let wildcardFailed = false
try { execFileSync('node', ['resolve_storagebox_hosts.ts'], { input: '{"hostnames":"*.your-storagebox.de"}', encoding: 'utf8' }) } catch { wildcardFailed = true }
if (!wildcardFailed) { throw new Error('expected wildcard hostname resolution to fail') }
"""

[tasks."test:storagebox-resolver:network"]
description = "Resolve a real Storage Box hostname through DNS"
usage = 'arg "host" help="Concrete your-storagebox.de hostname to resolve"'
shell = "node -e"
run = """
const { execFileSync } = await import('node:child_process')
const host = process.env.usage_host
const result = JSON.parse(execFileSync('node', ['resolve_storagebox_hosts.ts'], { input: JSON.stringify({ hostnames: host }), encoding: 'utf8' }))
if (result.ips === '') { throw new Error(`expected resolved ips for ${host}`) }
"""

[tasks."test:external-caches"]
description = "Smoke-test OpenTofu external helpers against local cache files when present"
shell = "node -e"
run = """
const { execFileSync } = await import('node:child_process')
const { existsSync } = await import('node:fs')
if (existsSync('cache_AS41231.json')) {
  const asn = JSON.parse(execFileSync('node', ['fetch_ips.ts'], { input: '{"asn":"AS41231"}', encoding: 'utf8' }))
  if (asn.ips === '') { throw new Error('expected cached AS41231 ips') }
}
if (existsSync('cache_tor_relays.json')) {
  const tor = JSON.parse(execFileSync('node', ['fetch_tor_relays.ts'], { input: '{}', encoding: 'utf8' }))
  if (tor.ips === '') { throw new Error('expected cached Tor relay ips') }
}
"""

[tasks.format]
run = [{ tasks = ["format:tofu"] }]

[tasks."format:tofu"]
description = "Format OpenTofu configuration"
run = "tofu fmt"

[tasks."lint:tofu"]
description = "Validate OpenTofu configuration"
run = [
  "tofu fmt -check -diff",
  "tofu validate",
]

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."lint:types"]
extends = "lint:types"
