[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
description = "Auto-fix this package with Oxlint (non-type-aware fixes)"
run = "task-oxlint --fix"

[tasks."test:unit"]
extends = "test:unit"
