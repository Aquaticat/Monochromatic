<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200">
  <!-- Military-style gray jacket - shorter cropped style matching reference -->
  <defs>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#888888"/>
      <stop offset="50%" stop-color="#9a9a9a"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
  </defs>

  <!-- Main jacket body - cropped, ending at natural waist -->
  <path d="M352,235
           Q358,228 372,225
           L393,222 L407,222
           L428,225
           Q442,228 448,235
           L456,258
           Q458,278 457,300
           L455,330
           Q454,350 453,365
           L451,380
           Q449,386 445,390
           L355,390
           Q351,386 349,380
           L347,365
           Q346,350 345,330
           L343,300
           Q342,278 344,258
           Z"
        fill="url(#jacket)" stroke="#2a2a2a" stroke-width="2"/>

  <!-- Collar -->
  <path d="M378,225 L390,248 L400,240 L410,248 L422,225"
        fill="#c8c4be" stroke="#2a2a2a" stroke-width="1.5"/>
  <path d="M382,228 L392,246 L400,240 L408,246 L418,228"
        fill="none" stroke="#6a6a6a" stroke-width="1"/>

  <!-- Center button placket -->
  <line x1="400" y1="242" x2="400" y2="386" stroke="#6a6a6a" stroke-width="1.5"/>

  <!-- Buttons -->
  <circle cx="400" cy="262" r="3" fill="#555" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="400" cy="290" r="3" fill="#555" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="400" cy="318" r="3" fill="#555" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="400" cy="346" r="3" fill="#555" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Diagonal trim lines (chevron/X pattern) -->
  <line x1="346" y1="292" x2="397" y2="258" stroke="#c8c4be" stroke-width="2"/>
  <line x1="454" y1="292" x2="403" y2="258" stroke="#c8c4be" stroke-width="2"/>
  <line x1="348" y1="355" x2="397" y2="322" stroke="#c8c4be" stroke-width="2"/>
  <line x1="452" y1="355" x2="403" y2="322" stroke="#c8c4be" stroke-width="2"/>

  <!-- Crossbody strap -->
  <path d="M444,232 L440,248 L360,378 L354,373 L432,240 L436,226 Z"
        fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Strap pouch at right hip -->
  <path d="M450,386 L454,404 L449,416 L442,416 L440,404 L442,390 Z"
        fill="#cc2244" stroke="#2a2a2a" stroke-width="1.2"/>
  <line x1="447" y1="386" x2="448" y2="394" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- Collar pin / badge -->
  <rect x="374" y="252" width="24" height="12" rx="2" fill="#cc2244" stroke="#2a2a2a" stroke-width="1.2"/>
  <text x="386" y="262" font-family="sans-serif" font-size="8" font-weight="bold"
        fill="#ffffff" text-anchor="middle">0401</text>

  <!-- Jacket hem -->
  <path d="M349,386 Q400,394 451,386" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
</svg>
