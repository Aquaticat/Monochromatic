<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200">
  <!-- Head/face with neck stub - narrower to match reference proportions -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e0d0"/>
      <stop offset="100%" stop-color="#ebd0c0"/>
    </linearGradient>
  </defs>
  <!-- Neck (extends under torso) -->
  <path d="M390,205 L410,205 L412,260 L388,260 Z"
        fill="#ebd0c0" stroke="#2a2a2a" stroke-width="1"/>
  <!-- Face - widened to match reference head proportions -->
  <ellipse cx="400" cy="150" rx="55" ry="65" fill="url(#skin)" stroke="#2a2a2a" stroke-width="1.8"/>
  <!-- Ears -->
  <ellipse cx="349" cy="155" rx="8" ry="14" fill="#ebd0c0" stroke="#2a2a2a" stroke-width="1.2"/>
  <ellipse cx="451" cy="155" rx="8" ry="14" fill="#ebd0c0" stroke="#2a2a2a" stroke-width="1.2"/>
  <!-- Ear inner -->
  <ellipse cx="350" cy="155" rx="4" ry="8" fill="#dfc0b0"/>
  <ellipse cx="450" cy="155" rx="4" ry="8" fill="#dfc0b0"/>
  <!-- Chin definition -->
  <path d="M380,198 Q400,214 420,198" fill="none" stroke="#dfc0b0" stroke-width="1.2"/>
  <!-- Nose -->
  <path d="M398,158 L397,168 L400,171" fill="none" stroke="#dfc0b0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Blush marks -->
  <ellipse cx="373" cy="172" rx="13" ry="6" fill="#f0b0a0" opacity="0.3"/>
  <ellipse cx="427" cy="172" rx="13" ry="6" fill="#f0b0a0" opacity="0.3"/>
</svg>
