<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200">
  <!-- Front skirt - more contained A-line matching reference -->
  <defs>
    <linearGradient id="skirt-gray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a9a9a"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
  </defs>

  <!-- Waistband -->
  <path d="M335,388
           Q365,382 400,380
           Q435,382 465,388
           L468,402
           Q435,408 400,410
           Q365,408 332,402
           Z"
        fill="#555555" stroke="#2a2a2a" stroke-width="1.8"/>

  <!-- Red underskirt sides - narrower flare -->
  <path d="M332,402
           Q322,425 315,452
           Q308,480 306,500
           Q304,508 308,512
           L348,504
           L352,410
           Z"
        fill="#cc2244" stroke="#2a2a2a" stroke-width="1.2"/>
  <path d="M468,402
           Q478,425 485,452
           Q492,480 494,500
           Q496,508 492,512
           L452,504
           L448,410
           Z"
        fill="#cc2244" stroke="#2a2a2a" stroke-width="1.2"/>

  <!-- Front gray panel -->
  <path d="M353,404
           Q345,434 338,468
           Q330,495 326,510
           Q344,520 378,524
           L400,526
           L422,524
           Q456,520 474,510
           Q470,495 462,468
           Q455,434 447,404
           Z"
        fill="url(#skirt-gray)" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- Musical staff lines -->
  <line x1="335" y1="474" x2="465" y2="474" stroke="#c8c4be" stroke-width="1.8"/>
  <line x1="332" y1="484" x2="468" y2="484" stroke="#c8c4be" stroke-width="1.8"/>
  <line x1="330" y1="494" x2="470" y2="494" stroke="#c8c4be" stroke-width="1.8"/>
  <line x1="328" y1="504" x2="472" y2="504" stroke="#c8c4be" stroke-width="1.8"/>

  <!-- Fold lines -->
  <path d="M385,412 L372,510" stroke="#777" stroke-width="0.8" opacity="0.5"/>
  <path d="M415,412 L428,510" stroke="#777" stroke-width="0.8" opacity="0.5"/>

  <!-- Black ruffle petticoat -->
  <path d="M304,510
           Q308,521 320,527
           Q340,533 358,531
           Q378,534 395,532
           Q405,534 415,532
           Q435,534 455,531
           Q472,533 486,527
           Q498,521 500,510
           Q496,525 486,533
           Q468,543 452,540
           Q435,543 415,541
           Q405,543 395,541
           Q378,543 358,540
           Q340,543 320,533
           Q308,525 304,510
           Z"
        fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Red trim above ruffle -->
  <path d="M306,511 Q400,523 494,511" fill="none" stroke="#cc2244" stroke-width="2"/>
</svg>
