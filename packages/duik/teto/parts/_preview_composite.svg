<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 1200" width="800" height="1200">
  <!-- Composite preview: all parts stacked in correct Duik layer order (back to front) -->
  <!-- Background -->
  <rect width="800" height="1200" fill="#f5f5f0"/>

  <!-- Layer order reference grid -->
  <text x="10" y="20" font-family="monospace" font-size="11" fill="#888">
    Kasane Teto SV - Duik composite preview
  </text>

  <!-- Back-to-front layer stack -->

  <!-- 1. hair_back -->
  <image href="hair_back.svg" width="800" height="1200"/>

  <!-- 2. torso_front -->
  <image href="torso_front.svg" width="800" height="1200"/>

  <!-- 3. skirt_back -->
  <image href="skirt_back.svg" width="800" height="1200"/>

  <!-- 4-6. Left arm (behind torso) -->
  <image href="upper_arm_L.svg" width="800" height="1200"/>
  <image href="forearm_L.svg" width="800" height="1200"/>
  <image href="hand_L.svg" width="800" height="1200"/>

  <!-- 7-9. Right arm (behind torso) -->
  <image href="upper_arm_R.svg" width="800" height="1200"/>
  <image href="forearm_R.svg" width="800" height="1200"/>
  <image href="hand_R.svg" width="800" height="1200"/>

  <!-- 10-15. Legs and boots -->
  <image href="upper_leg_L.svg" width="800" height="1200"/>
  <image href="lower_leg_L.svg" width="800" height="1200"/>
  <image href="boot_L.svg" width="800" height="1200"/>
  <image href="upper_leg_R.svg" width="800" height="1200"/>
  <image href="lower_leg_R.svg" width="800" height="1200"/>
  <image href="boot_R.svg" width="800" height="1200"/>

  <!-- 16. skirt_front -->
  <image href="skirt_front.svg" width="800" height="1200"/>

  <!-- 17-18. Epaulettes -->
  <image href="epaulette_L.svg" width="800" height="1200"/>
  <image href="epaulette_R.svg" width="800" height="1200"/>

  <!-- 19. Head/face -->
  <image href="head_face.svg" width="800" height="1200"/>

  <!-- 20. Bangs -->
  <image href="hair_bangs.svg" width="800" height="1200"/>

  <!-- 21-22. Drills -->
  <image href="hair_drill_L.svg" width="800" height="1200"/>
  <image href="hair_drill_R.svg" width="800" height="1200"/>

  <!-- 23-24. Hair accessories -->
  <image href="hair_accessory_L.svg" width="800" height="1200"/>
  <image href="hair_accessory_R.svg" width="800" height="1200"/>

  <!-- 25. Eyes -->
  <image href="eyes.svg" width="800" height="1200"/>

  <!-- 26. Mouth -->
  <image href="mouth.svg" width="800" height="1200"/>

  <!-- Joint markers (for Duik pin placement reference) -->
  <g fill="none" stroke="#00cc66" stroke-width="1" opacity="0.6">
    <!-- Neck pivot -->
    <circle cx="400" cy="225" r="5"/>
    <text x="410" y="228" font-size="8" fill="#00cc66" font-family="monospace">neck</text>

    <!-- Left shoulder -->
    <circle cx="310" cy="245" r="5"/>
    <!-- Right shoulder -->
    <circle cx="490" cy="245" r="5"/>

    <!-- Left elbow -->
    <circle cx="275" cy="350" r="5"/>
    <!-- Right elbow -->
    <circle cx="525" cy="350" r="5"/>

    <!-- Left wrist -->
    <circle cx="250" cy="445" r="5"/>
    <!-- Right wrist -->
    <circle cx="550" cy="445" r="5"/>

    <!-- Hip center -->
    <circle cx="400" cy="440" r="5"/>
    <text x="410" y="443" font-size="8" fill="#00cc66" font-family="monospace">hip</text>

    <!-- Left knee -->
    <circle cx="348" cy="700" r="5"/>
    <!-- Right knee -->
    <circle cx="436" cy="700" r="5"/>

    <!-- Left ankle -->
    <circle cx="340" cy="900" r="5"/>
    <!-- Right ankle -->
    <circle cx="444" cy="900" r="5"/>
  </g>
</svg>
