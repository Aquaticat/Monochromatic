[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."prepare:tracer"]
description = "Build tracer container image (potrace only); skipped if host has potrace"
run = """
if (which potrace | is-not-empty) { print "Host potrace found, skipping container build"; return }
task-depends -s "sh:echo Infinity" -o "sh:podman image exists monochromatic-tracer && echo Infinity || echo -Infinity" -- podman build -t monochromatic-tracer -f tracer.Dockerfile .
"""

[tasks.crop]
description = "Crop front view from the 3-view reference sheet"
run = "bun run src/mise.crop.ts"

[tasks.segment]
description = "Generate binary masks for each body part via ImageMagick color matching"
depends = ["crop"]
run = "bun run src/mise.segment.ts"

[tasks.trace]
description = "Trace binary masks to SVG paths with potrace (host or container)"
depends = ["prepare:tracer", "segment"]
run = "bun run src/mise.trace.ts"

[tasks.assemble]
description = "Transform traced SVG paths into positioned, colored part files"
depends = ["trace"]
run = "bun run src/mise.assemble.ts"

[tasks.composite]
description = "Stack all parts into a single composite SVG preview"
depends = ["assemble"]
run = "bun run src/mise.composite.ts"

[tasks.compare]
description = "Compare generated composite against reference with perceptual metrics"
depends = ["composite"]
run = "bun run src/mise.compare.ts"

[tasks.generate]
description = "Run full pipeline: crop -> segment -> trace -> assemble -> composite"
depends = ["composite"]
