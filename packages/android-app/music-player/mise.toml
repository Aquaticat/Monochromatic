# Android island. This package is a self-contained Gradle build; mise owns it by
# shelling to the committed Gradle wrapper, exactly the pattern the kopia Jetpack
# Compose vet established. pnpm and cargo have no part in this build graph.
#
# The JDK comes from the mise-managed Temurin 21 below (AGP 9 / Gradle 9 need a
# JDK in the 17..21 range; the host's newer JBR is too new). The Android SDK
# location is machine-local and lives in the gitignored local.properties
# (sdk.dir=...), which Gradle reads natively, so no ANDROID_HOME env is set here.
#
# One engine, one variant: the media3 and hybrid flavors are gone (the full-Rust
# engine won the head-to-head), so the tasks below drive the single debug/release
# variant (assembleDebug, testDebugUnitTest, connectedDebugAndroidTest, lintDebug).

[tools]
java = "temurin-21"

[tasks."build:native"]
description = "Cross-compile the native engine .so (arm64-v8a, 16KB-aligned, API 26 floor) into app/src/main/jniLibs. Requires ANDROID_NDK_HOME (see docs/handover/music-player-android-port.md)."
dir = "{{config_root}}/rust"
shell = "node -e"
run = '''
const ndk = process.env.ANDROID_NDK_HOME;
if (!ndk) {
  throw new Error("ANDROID_NDK_HOME is unset; export it to an Android NDK path (see docs/handover/music-player-android-port.md). cargo-ndk dumps the whole environment on a missing-NDK panic, so this task refuses to run without it.");
}
const { execFileSync } = require("node:child_process");
execFileSync(
  "cargo",
  ["ndk", "-t", "arm64-v8a", "--platform", "26", "-o", "../app/src/main/jniLibs", "build", "--release"],
  { stdio: "inherit", env: process.env },
);
'''

[tasks.build]
description = "Assemble the debug APK (rebuilds the native .so first)"
dir = "{{config_root}}"
depends = ["build:native"]
run = "./gradlew :app:assembleDebug --no-daemon --console=plain"

[tasks."build:release"]
description = "Assemble the optimized (non-debuggable) release APK, debug-signed so it installs (rebuilds the native .so first)"
dir = "{{config_root}}"
depends = ["build:native"]
run = "./gradlew :app:assembleRelease --no-daemon --console=plain"

[tasks.install]
description = "Install the debug APK on the connected device (rebuilds the native .so first)"
dir = "{{config_root}}"
depends = ["build:native"]
run = "./gradlew :app:installDebug --no-daemon --console=plain"

[tasks."test:unit"]
description = "Run host JVM unit tests for the pure-logic core (no device)"
dir = "{{config_root}}"
run = "./gradlew :app:testDebugUnitTest --no-daemon --console=plain"

[tasks."test:instrumented:build"]
description = "Assemble the app + instrumented-test APKs (native .so included; no device). Run on device with am instrument or connectedAndroidTest."
dir = "{{config_root}}"
depends = ["build:native"]
run = "./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain"

[tasks."test:instrumented"]
description = "Run instrumented tests on the connected device (pin ANDROID_SERIAL; hold the adb flock; rebuilds the native .so first)"
dir = "{{config_root}}"
depends = ["build:native"]
run = "./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain"

[tasks.lint]
description = "Run Android Lint on the debug variant"
dir = "{{config_root}}"
run = "./gradlew :app:lintDebug --no-daemon --console=plain"

[tasks.clean]
description = "Delete Gradle build outputs"
dir = "{{config_root}}"
run = "./gradlew clean --no-daemon --console=plain"
