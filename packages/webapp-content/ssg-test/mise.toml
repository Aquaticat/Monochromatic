[tasks.build]
extends = "build"

[tasks."build:i18n"]
description = "Generate typesafe-i18n types from locale files"
run = "node_modules/.bin/typesafe-i18n --no-watch"

[tasks."build:js:client"]
extends = "build:js:client"

[tasks."build:site"]
description = "Build static site"
depends = ["build:i18n", "build:js:client"]
run = "bun src/build.ts"

[tasks."build:site:clean"]
description = "Build static site from scratch (no cache)"
run = "rm -rf .cache; bun src/build.ts"

[tasks."dev:site"]
description = "Build then serve dist/ with Caddy, rebuilding on source changes"
run = [{ tasks = ["build:site"] }, { tasks = ["_dev:site:watch", "dev:site:serve"] }]

[tasks."dev:site:serve"]
hide = true
description = "Serve dist/ with Caddy (clean URLs via try_files)"
run = "caddy run --config Caddyfile"

[tasks."_dev:site:watch"]
hide = true
description = "Rebuild on source changes"
run = "mise watch -w src -r build:site"

[tasks."generate:favicons"]
description = "Generate favicon files from SVG source if missing"
run = "bun src/build/favicon.ts"

[tasks."format:images"]
description = "Convert non-AVIF raster images to AVIF counterparts"
run = "bun src/images/format.ts"

[tasks."watch:site"]
description = "Rebuild site on source changes"
run = "mise watch -w src -r build:site"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"
hide = true

[tasks."lint:oxlint"]
extends = "lint:oxlint"
