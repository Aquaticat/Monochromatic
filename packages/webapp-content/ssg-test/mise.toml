[tools]
"npm:pagefind" = "latest"

[tasks.build]
description = "Build SSG pipeline: clean, i18n + client JS, then site, then search index, then compress"
run = [
  { tasks = ["build:clean"] },
  { tasks = ["build:i18n", "build:js:client"] },
  { tasks = ["build:site"] },
  { tasks = ["build:search"] },
  { tasks = ["build:fingerprint"] },
  { tasks = ["build:compress"] },
]

[tasks."build:clean"]
description = "Remove dist/ before rebuild so stale artifacts (e.g. logs or editor state accidentally written with cwd=dist) never get packaged by build:compress"
run = "rm -rf dist"

[tasks."build:i18n"]
description = "Generate typesafe-i18n types from locale files"
run = "typesafe-i18n --no-watch"

[tasks."build:js:client"]
extends = "build:js:client"

[tasks."build:site"]
description = "Build static site from MDX content"
run = "bun src/build.ts"

[tasks."build:site:clean"]
description = "Build static site from scratch (no cache)"
run = "rm -rf .cache; bun src/build.ts"

[tasks."build:search"]
description = "Generate Pagefind search index from built HTML"
run = "pagefind --site dist"

[tasks."build:fingerprint"]
description = "Add content hashes to asset filenames and rewrite references"
run = "bun src/build/fingerprint.ts"

[tasks."build:compress"]
description = "Compress dist/ with zstd"
run = "zstd -z -f --no-check -T0 --exclude-compressed --no-content-size -r --adapt dist"

[tasks.dev]
description = "Build then serve dist/ with Caddy, rebuilding on source changes"
run = [{ tasks = ["build"] }, { tasks = ["dev:watch", "dev:serve"] }]

[tasks."dev:watch"]
hide = true
description = "Rebuild on source changes"
run = "mise watch -w src -r build"

[tasks."dev:serve"]
hide = true
description = "Serve dist/ with Caddy (clean URLs via try_files)"
run = "caddy run --config Caddyfile"

[tasks."generate:favicons"]
description = "Generate favicon files from SVG source if missing"
run = "bun src/build/favicon.ts"

[tasks."format:images"]
description = "Convert non-AVIF raster images to AVIF counterparts"
run = "bun src/images/format.ts"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"
hide = true

[tasks."lint:oxlint"]
extends = "lint:oxlint"
