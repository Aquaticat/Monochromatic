[tasks.run]
description = "Run git wrapper CLI"
run = "node src/index.ts"

[tasks.build]
extends = "build"

[tasks.'build:js']
extends = "build:js"

[tasks.'build:js:node']
extends = "build:js:node"

[tasks.'watch:build']
extends = "watch:build"

[tasks.'watch:build:js']
extends = "watch:build:js"

[tasks.'watch:build:js:node']
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks.'lint:types']
extends = "lint:types"

[tasks.'lint:oxlint']
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks.'test:unit']
extends = "test:unit"

[tasks.'pack:npm']
description = "Build and create the unpublished npm tarball"
depends = ["build"]
run = [
  "pnpm install --force --config.dedupe-direct-deps=false --filter @monochromatic-dev/cli-git",
  "node -e \"const { mkdirSync } = await import('node:fs'); mkdirSync('dist/pack', { recursive: true })\"",
  "pnpm pack --pack-destination dist/pack",
]

[tasks.'test:built:trust']
description = "Exercise packed shadow git trust lifecycle in a disposable container"
depends = ["pack:npm"]
run = "podman run --memory=1g --cpus=1 --cap-add SYS_ADMIN --rm --volume \"$PWD/dist/pack/monochromatic-dev-cli-git-0.0.1.tgz:/fixture/cli.tgz:ro,Z\" --volume \"$PWD/src/trust/fixtures:/fixture/tests:ro,Z\" --tmpfs /work/recursive/child:rw,size=16m docker.io/library/node:24-slim node /fixture/tests/built-trust-consumer.ts"

[tasks.'test:hk-config-cleanup']
description = "Verify exact idempotent hk Git-config cleanup in disposable local and global fixtures"
run = "node src/trust/fixtures/hk-config-cleanup-consumer.ts"

[tasks.'perf:lifecycle-latency']
description = "Measure and enforce packed lifecycle latency budgets in a bounded container"
depends = ["pack:npm"]
shell = "node --input-type=module-typescript -e"
run = '''
const { execFile, spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { mkdir } = await import('node:fs/promises')
const { join } = await import('node:path')
const { promisify } = await import('node:util')
const packageRoot = process.cwd()
const evidenceRoot = join(packageRoot, 'dist/perf')
await mkdir(evidenceRoot, { recursive: true })
const execute = promisify(execFile)
const { stdout: revisionOutput } = await execute('/usr/bin/git', ['rev-parse', 'HEAD'], { cwd: packageRoot })
const revision = revisionOutput.trim()
const bootstrap = `
const { execFile } = await import('node:child_process')
const { mkdir } = await import('node:fs/promises')
const { promisify } = await import('node:util')
const run = promisify(execFile)
await run('apt-get', ['update'])
await run('apt-get', ['install', '--yes', '--no-install-recommends', 'git'])
await mkdir('/work', { recursive: true })
await run('npm', ['init', '--yes'], { cwd: '/work' })
await run('npm', ['pkg', 'set', 'type=module'], { cwd: '/work' })
await run('npm', ['install', '--ignore-scripts', '/fixture/cli.tgz'], { cwd: '/work' })
await import('/work/perf/lifecycle-latency-benchmark.ts')
`
const child = spawn('podman', [
  'run',
  '--memory=2g',
  '--cpus=2',
  '--rm',
  '--env',
  'CLI_GIT_CAPTURE_LATENCY_BASELINE',
  '--env',
  `CLI_GIT_BENCHMARK_REVISION=${revision}`,
  '--env',
  'CLI_GIT_BENCHMARK_OUTPUT=/evidence/lifecycle-latency.json',
  '--volume',
  `${join(packageRoot, 'dist/pack/monochromatic-dev-cli-git-0.0.1.tgz')}:/fixture/cli.tgz:ro,Z`,
  '--volume',
  `${evidenceRoot}:/evidence:rw,Z`,
  '--volume',
  `${join(packageRoot, 'perf')}:/work/perf:ro,Z`,
  '--tmpfs',
  '/work:rw,size=1g',
  'docker.io/library/node:24-slim',
  'node',
  '--input-type=module-typescript',
  '--eval',
  bootstrap,
], { stdio: 'inherit' })
const [code] = await once(child, 'exit')
if (code !== 0) throw new Error(`Lifecycle latency container exited with ${String(code)}`)
'''
