[tasks.run]
description = "Run git wrapper CLI"
run = "node src/bin.ts"

[tasks.build]
extends = "build"

[tasks.'build:js']
extends = "build:js"

[tasks.'build:js:node']
extends = "build:js:node"

[tasks.'watch:build']
extends = "watch:build"

[tasks.'watch:build:js']
extends = "watch:build:js"

[tasks.'watch:build:js:node']
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks.'lint:types']
extends = "lint:types"

[tasks.'lint:oxlint']
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks.'test:unit']
extends = "test:unit"

[tasks.'pack:npm']
description = "Build and create the unpublished npm tarball"
depends = ["build"]
run = [
  "pnpm install --force --config.dedupe-direct-deps=false --filter @monochromatic-dev/cli-git",
  "node -e \"const { mkdirSync } = await import('node:fs'); mkdirSync('dist/pack', { recursive: true })\"",
  "pnpm pack --pack-destination dist/pack",
]

[tasks.'test:built:trust']
description = "Exercise packed shadow git trust lifecycle in a disposable container"
depends = ["pack:npm"]
run = [
  "mise run //packages/git-policies/repository:pack:npm",
  "podman run --memory=1g --cpus=1 --cap-add SYS_ADMIN --rm --volume \"$PWD/dist/pack/monochromatic-dev-cli-git-0.0.1.tgz:/fixture/cli.tgz:ro,Z\" --volume \"$PWD/../../git-policies/repository/dist/pack/monochromatic-dev-git-policy-repository-0.0.1.tgz:/fixture/repository-plugin.tgz:ro,Z\" --volume \"$PWD/src/trust/fixtures:/fixture/tests:ro,Z\" --tmpfs /work/recursive/child:rw,size=16m docker.io/library/node:24-slim node /fixture/tests/built-trust-consumer.ts",
]
