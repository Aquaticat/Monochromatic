# Cargo work runs on the HOST when the native dev libraries are present, and
# falls back to the Fedora build container otherwise (see Containerfile).
# On non-Linux targets (macOS, Windows) every task takes a NATIVE cargo branch
# first (`$nu.os-info.name != "linux"`): no pkg-config/PipeWire probe, no podman
# fallback (a Linux container cannot produce a macOS or Windows binary), and the
# audio backend is cpal (src/output_cpal.rs: CoreAudio on macOS, WASAPI on
# Windows). Prereqs:
#   macOS:   a Rust toolchain with `cargo` on PATH; `cmake` plus the Command Line
#            Tools C compiler (the opus crate's opusic-sys backend builds libopus
#            1.6.1 from source via cmake). The repo's mise `aqua:Kitware/CMake`
#            tool provides cmake; `brew install cmake` also works.
#   Windows: rustup (msvc host) + a nightly toolchain on PATH; Visual Studio (CRT
#            + Windows SDK); `cmake` on PATH (opusic-sys builds libopus 1.6.1 via
#            cmake; 1.6.1's cmake_minimum_required is 3.16, so CMake 4 needs no
#            policy override); and LLVM's `bin` on PATH so `lld-link.exe` (the
#            linker pinned for windows-msvc in .cargo/config.toml) resolves. See
#            HANDOVER.windows-toolchain-and-check.md.
# Host build deps (layer with rpm-ostree on an immutable Fedora):
#   pipewire-devel fontconfig-devel freetype-devel
# plus rustup/cargo and libclang already on PATH; cmake comes from the repo's mise
# `aqua:Kitware/CMake` tool (opusic-sys vendors and cmake-builds libopus 1.6.1, so
# no system opus-devel is needed) and the host's system `make` is its generator.
# The {{vars.host_ok}} predicate probes pkg-config for those libraries; when any
# is missing the {{vars.container_cargo}} prefix runs the same cargo command in
# podman instead (package dir bind-mounted at /work, cargo registry in a named
# volume, `label=disable` to skip SELinux relabeling of the host tree).
# The *:container tasks force the podman path regardless of host libraries so the
# container build stays asserted; verify:container is the umbrella assertion.
# Why podman and not mise-managed deps (conda route rejected):
# see ../../../docs/decisions/desktop-app-podman-build.md

[env]
# Slint's experimental builtins (FlexboxLayout in the page-tab bar) must be
# enabled for the markup compiler on the host exactly as the Containerfile bakes
# them for the container path; without it the UI compile fails with "Unknown
# element". podman does not forward host env into the container, so this only
# affects the host branch (the image sets its own copy). Needed on macOS too,
# since the same UI markup is compiled there.
SLINT_ENABLE_EXPERIMENTAL_FEATURES = "1"
# NOTE: LIBCLANG_PATH was a process-wide env here but is now set inside the Linux
# host_env var below, NOT globally. On macOS it must stay UNSET so bindgen finds
# the Command Line Tools' libclang automatically; a global Linux path
# (/usr/lib64) would point bindgen at a nonexistent directory there.

[vars]
# True when the host can build natively: cargo on PATH and the native libraries
# Slint/PipeWire link against (pipewire + fontconfig/freetype) resolvable through
# pkg-config (fontconfig also validates its freetype2 Requires). libopus is NOT
# probed: the opus crate is pinned to the opusic-sys backend, which compiles
# libopus 1.6.1 from source via cmake (the mise `aqua:Kitware/CMake` tool), so no
# system libopus is required.
host_ok = '((which cargo | is-not-empty) and ((^pkg-config --exists libpipewire-0.3 fontconfig freetype2 | complete | get exit_code) == 0))'
# Host-only env for the native LINUX cargo branch (interpolated into the same
# nushell block as `cargo`, so these $env mutations reach it). LIBCLANG_PATH:
# host libclang ships only versioned (libclang.so.NN, no unversioned symlink), so
# point bindgen (libspa-sys) at the lib dir explicitly. The clang
# resource headers (stdbool.h and friends) live under /usr/lib/clang/<v>, but
# libclang.so sits in /usr/lib64 and looks for them beside itself, so bindgen
# cannot find them without an explicit -resource-dir. Glob the major-version dir
# so an LLVM bump does not need a manual edit. macOS uses NEITHER of these (its
# build path skips host_env entirely; CLT clang is found automatically).
host_env = '$env.LIBCLANG_PATH = "/usr/lib64"; let _rd = (glob "/usr/lib/clang/*" | sort | last); $env.BINDGEN_EXTRA_CLANG_ARGS = $"-resource-dir=($_rd)"'
# Forced-container cargo prefix: build the image when it is missing, then run
# the cargo subcommand appended by the caller inside podman.
container_cargo = '(if ((^podman image exists localhost/monochromatic/music-player | complete | get exit_code) != 0) { ^podman build -t localhost/monochromatic/music-player -f Containerfile . }); ^podman run --rm --security-opt label=disable -v $"(pwd):/work" -v music-player-cargo:/cargo -w /work localhost/monochromatic/music-player cargo'

[tasks.image]
description = "Build the Fedora build/run container image"
run = "podman build -t localhost/monochromatic/music-player -f Containerfile ."

[tasks.build]
description = "Release build (macOS/Windows native, else Linux host if dev libs present, else container)"
run = 'if ($nu.os-info.name != "linux") { cargo build --release } else if {{vars.host_ok}} { {{vars.host_env}}; cargo build --release } else { {{vars.container_cargo}} build --release }'

[tasks."build:debug"]
description = "Debug build (macOS/Windows native, else Linux host if dev libs present, else container)"
run = 'if ($nu.os-info.name != "linux") { cargo build } else if {{vars.host_ok}} { {{vars.host_env}}; cargo build } else { {{vars.container_cargo}} build }'

[tasks.lint]
description = "cargo check, no codegen (macOS/Windows native, else Linux host if dev libs present, else container)"
run = 'if ($nu.os-info.name != "linux") { cargo check } else if {{vars.host_ok}} { {{vars.host_env}}; cargo check } else { {{vars.container_cargo}} check }'

[tasks."lint:clippy"]
description = "Run clippy with warnings denied (macOS/Windows native, else Linux host if dev libs present, else container)"
run = 'if ($nu.os-info.name != "linux") { cargo clippy --release -- -D warnings } else if {{vars.host_ok}} { {{vars.host_env}}; cargo clippy --release -- -D warnings } else { {{vars.container_cargo}} clippy --release -- -D warnings }'

[tasks."format:clippy"]
description = "Apply clippy's machine-applicable suggestions in place (host if dev libs present, else container)"
# --allow-no-vcs is harmless on the host (the repo .git is visible) and required
# in the container, where only the package dir is bind-mounted at /work so the
# repo-root .git is not visible and cargo fix would otherwise refuse to run.
run = 'if ($nu.os-info.name != "linux") { cargo clippy --fix --allow-dirty --allow-staged --allow-no-vcs } else if {{vars.host_ok}} { {{vars.host_env}}; cargo clippy --fix --allow-dirty --allow-staged --allow-no-vcs } else { {{vars.container_cargo}} clippy --fix --allow-dirty --allow-staged --allow-no-vcs }'

[tasks."lint:max-lines"]
description = "Enforce the 300 code-line budget on .rs files (monochromatic-rust-linter)"
# Runs on the HOST, not in the container: the linter is a separate crate with
# no pipewire/opus/clang deps, so it needs no container. .gitignore-aware
# walking skips target/ (including Slint's generated .rs).
run = "cargo run --quiet --manifest-path ../../linter/rust/Cargo.toml -- ."

[tasks.test]
description = "cargo nextest run (macOS/Windows native, else Linux host if dev libs present, else container)"
# The native (non-Linux) branch needs cargo-nextest on PATH (`cargo install
# cargo-nextest`, or `brew install cargo-nextest` on macOS); the tests are pure
# logic with no audio backend, so they run identically on macOS and Windows.
run = 'if ($nu.os-info.name != "linux") { cargo nextest run --release } else if {{vars.host_ok}} { {{vars.host_env}}; cargo nextest run --release } else { {{vars.container_cargo}} nextest run --release }'

[tasks."build:container"]
description = "Release build forced inside the container (asserts the container path)"
run = '{{vars.container_cargo}} build --release'

[tasks."lint:clippy:container"]
description = "clippy with warnings denied forced inside the container"
run = '{{vars.container_cargo}} clippy --release -- -D warnings'

[tasks."test:container"]
description = "cargo nextest run forced inside the container"
run = '{{vars.container_cargo}} nextest run --release'

[tasks."verify:container"]
description = "Assert the container build/clippy/test path works even when the host has the dev libs"
# Aborts on the first failing step so a broken container path fails the task
# rather than being masked by a later passing step (nushell `;` is not fail-fast).
run = '''
mise run image
{{vars.container_cargo}} build --release
if $env.LAST_EXIT_CODE != 0 { error make { msg: "container release build failed" } }
{{vars.container_cargo}} clippy --release -- -D warnings
if $env.LAST_EXIT_CODE != 0 { error make { msg: "container clippy failed" } }
{{vars.container_cargo}} nextest run --release
if $env.LAST_EXIT_CODE != 0 { error make { msg: "container tests failed" } }
'''

[tasks.run]
description = "Build (host if dev libs present, else container), then run the music-player GUI on the host (pass file/folder paths after --)"
usage = '''
arg "[args]" var=#true help="File or folder paths to enqueue"
'''
# The binary is BUILT host-first (or in the container when the host lacks the
# PipeWire/Opus/clang dev headers) and RUN directly on the host. Running on the
# host means the window, audio, D-Bus, and the KDE taskbar all use the host
# session natively: no socket passthrough, no --userns=keep-id, and the .desktop
# association + LauncherEntry taskbar progress work without the container's SASL
# EXTERNAL uid juggling. A container-built binary links only against runtime libs
# present on the host (verified with `ldd`), and a binary built on the older
# container glibc (Fedora 41) runs on the newer host glibc (Fedora 44+).
#
# The host environment already provides WAYLAND_DISPLAY, XDG_RUNTIME_DIR, the
# D-Bus session bus, PipeWire, and the XDG user dirs, so the empty-launch auto-load
# finds the music directory, GPU GL uses /dev/dri directly, and the session file
# lands in the real ~/.config/music-player. SLINT_BACKEND is read from the host env
# if set (to force the software renderer).
run = '''
let home = ($env.HOME? | default '')
# Build the release binary: macOS/Windows build natively with cargo; on Linux it
# is host-first, and the container fallback surfaces it on the host at
# target/release/music-player via the bind-mounted target/.
if ($nu.os-info.name != "linux") { cargo build --release } else if {{vars.host_ok}} { {{vars.host_env}}; cargo build --release } else { {{vars.container_cargo}} build --release }
# Install onto the host so the KDE .desktop launcher and `mise run` exercise the
# SAME binary. The .desktop uses a bare `Exec=music-player`, which KDE resolves on
# the systemd user PATH: that PATH includes ~/.local/bin (verified via
# `systemctl --user show-environment`) but NOT this package's target/release, so the
# binary must be copied to ~/.local/bin or the launcher fails with "binary not
# found". The .desktop is installed alongside so the shell can resolve
# application://monochromatic.music-player.desktop and attach taskbar progress to the
# window (matched by Wayland app id == StartupWMClass). Best-effort: when $HOME is
# unset, both installs are skipped and the freshly built target/release copy is run
# instead. KDE picks up a new .desktop file on next login if it does not appear
# immediately.
let bin = if ($nu.os-info.name != "linux") {
  # macOS/Windows: the KDE .desktop launcher and ~/.local/bin install are
  # Linux-only, so just run the freshly built release binary directly. Windows
  # needs the .exe extension; macOS has none.
  if ($nu.os-info.name == "windows") { './target/release/music-player.exe' } else { './target/release/music-player' }
} else if ($home != '') {
  let apps_dir = ($home | path join '.local/share/applications')
  mkdir $apps_dir
  cp --force share/applications/monochromatic.music-player.desktop $apps_dir
  let bin_dir = ($home | path join '.local/bin')
  mkdir $bin_dir
  cp --force target/release/music-player $bin_dir
  ($bin_dir | path join 'music-player')
} else {
  './target/release/music-player'
}
let extras = ($env.usage_args? | default '' | str trim | split row "' '" | each {|p| $p | str trim --char "'" } | where {|p| $p != '' })
# Run the installed binary directly on the host (same path KDE launches).
^$bin ...$extras
'''

[tasks."run-debug"]
description = "Debug build (host if dev libs present, else container), then run it on the host for fast iteration (pass file/folder paths after --)"
usage = '''
arg "[args]" var=#true help="File or folder paths to enqueue"
'''
# Fast-iteration sibling of `run`. `run` builds the optimised release binary
# (fat LTO, ~1-2 min) and installs it to ~/.local/bin so the KDE .desktop
# launcher and `mise run` exercise the SAME binary. This task skips all of that:
# it builds the unoptimised DEBUG binary (~10s incremental, no LTO/strip) and
# runs target/debug/music-player directly. It deliberately does NOT copy into
# ~/.local/bin or install the .desktop, so the installed release binary the
# launcher resolves is left untouched. The host session still supplies
# WAYLAND_DISPLAY, XDG_RUNTIME_DIR, the D-Bus bus, PipeWire, and the XDG user
# dirs, so the GUI, audio, and auto-load behave exactly as under `run`.
run = '''
# Build the debug binary: macOS/Windows build natively with cargo; on Linux it is
# host-first, and the container fallback surfaces it at target/debug/music-player
# via the bind-mounted target/.
if ($nu.os-info.name != "linux") { cargo build } else if {{vars.host_ok}} { {{vars.host_env}}; cargo build } else { {{vars.container_cargo}} build }
let extras = ($env.usage_args? | default '' | str trim | split row "' '" | each {|p| $p | str trim --char "'" } | where {|p| $p != '' })
# Run the freshly built debug binary directly. Windows needs the .exe extension.
let bin = if ($nu.os-info.name == "windows") { './target/debug/music-player.exe' } else { './target/debug/music-player' }
^$bin ...$extras
'''

[tasks."gen:fixtures"]
description = "Generate tiny per-codec audio fixtures with host ffmpeg (run once, commit results)"
# Runs on the host: ffmpeg is present there. 0.3s 440Hz stereo sine per codec.
# All dash-leading codec args are quoted strings so nushell treats them as
# data, not flags. 48000 Hz is used because libopus only accepts a fixed set
# of input rates (8000/12000/16000/24000/48000); 48000 is the safe common rate.
run = '''
let specs = [
  [ext, args];
  ["wav" []]
  ["flac" []]
  ["mp3" ["-c:a" "libmp3lame"]]
  ["ogg" ["-c:a" "libvorbis"]]
  ["opus" ["-c:a" "libopus"]]
  ["aac.m4a" ["-c:a" "aac"]]
  ["alac.m4a" ["-c:a" "alac"]]
]
for s in $specs {
  let out = $"fixtures/tone.($s.ext)"
  print $"generating ($out)"
  ffmpeg -y -f lavfi -i "sine=frequency=440:duration=0.3" -ac 2 -ar 48000 ...$s.args $out
}
# offset.opus: a remux of tone.opus with a +0.5s timestamp offset, so its first
# audio frame is NOT frame 0 (track start_ts becomes non-zero). This reproduces
# the real-world Ogg/Opus seek-to-start bug (seeking to second 0 mapped to frame
# 0, which the demuxer rejects as out-of-range). The seek_to_start_of_offset_opus
# regression test depends on this fixture.
print "generating fixtures/offset.opus"
ffmpeg -y -i fixtures/tone.opus -c copy -output_ts_offset 0.5 fixtures/offset.opus
'''

[tasks."gen:icons"]
description = "Regenerate the macOS .icns + Windows .ico from assets/icon.svg (run once, commit results)"
# The host (immutable Fedora) carries none of the icon tools, so generation runs
# in the Containerfile.icons image (built first; layer-cached after the first
# run). rsvg-convert renders the SVG to PNG at each size; png2icns packs the
# macOS set (16/32/48/128/256/512/1024 are the icns-valid sizes), icotool packs
# the Windows set (16/32/48/64/128/256). The PNGs are throwaway (under dist/,
# gitignored); the committed outputs are assets/music-player.{icns,ico}, which
# the bundle:macos task and the Windows build.rs consume, so neither needs this
# image. Rerun only when assets/icon.svg changes.
run = '''
podman build -t localhost/monochromatic/icon-tools -f Containerfile.icons .
let img = "localhost/monochromatic/icon-tools"
let mount = $"(pwd):/work"
mkdir dist/icons
for s in [16 32 48 64 128 256 512 1024] {
  podman run --rm --security-opt label=disable -v $mount -w /work $img rsvg-convert -w $s -h $s assets/icon.svg -o $"dist/icons/icon-($s).png"
}
podman run --rm --security-opt label=disable -v $mount -w /work $img png2icns assets/music-player.icns dist/icons/icon-16.png dist/icons/icon-32.png dist/icons/icon-48.png dist/icons/icon-128.png dist/icons/icon-256.png dist/icons/icon-512.png dist/icons/icon-1024.png
podman run --rm --security-opt label=disable -v $mount -w /work $img icotool -c -o assets/music-player.ico dist/icons/icon-16.png dist/icons/icon-32.png dist/icons/icon-48.png dist/icons/icon-64.png dist/icons/icon-128.png dist/icons/icon-256.png
print "regenerated assets/music-player.icns and assets/music-player.ico; commit them"
'''
