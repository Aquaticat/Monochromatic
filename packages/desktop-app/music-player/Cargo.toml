[package]
name = "music-player"
version = "0.1.0"
edition = "2024"
description = "Minimal Wayland + PipeWire music player built with Slint. Ad-hoc queue, broad codec support (symphonia + Opus)."
license = "LGPL-3.0-or-later"
publish = false

[lib]
name = "music_player"
path = "src/lib.rs"

[[bin]]
name = "music-player"
path = "src/main.rs"

[dependencies]
# Pinned to a Slint master revision (not a crates.io release) for smooth
# mouse-wheel scrolling. Flickable animates discrete wheel events with a short
# fixed-duration easing in slint-ui/slint#11338 (merged 2026-04-15, fixes
# #11312). That commit diverged from the 1.16 release line, so it is absent from
# the latest release (1.16.1, 2026-04-23) and ships only on master, landing in a
# 1.17 release. The rev is pinned (not branch=master) so the exact Slint commit
# is fixed and `cargo update` cannot move it; Cargo.lock is gitignored repo-wide
# (`*.lock`), so the rev pin, not the lockfile, is what fixes Slint. slint-build
# below MUST track the same rev. Revert both to a crates.io `version` once a
# release including #11338 ships.
slint = { git = "https://github.com/slint-ui/slint", rev = "85e3eb76819762cdcaa732fa87533ff896546bac", features = ["backend-winit", "renderer-femtovg", "renderer-software"] }
# Same Slint rev as above: the winit backend is constructed explicitly (not via
# the default backend selector) so a window-attributes hook can set the Wayland
# app_id, which KDE needs to attach taskbar progress to the running window. Its
# re-exported `winit` (`i_slint_backend_winit::winit`) is reused for the
# WindowAttributes ext trait, so no separate `winit` dependency is added.
i-slint-backend-winit = { git = "https://github.com/slint-ui/slint", rev = "85e3eb76819762cdcaa732fa87533ff896546bac" }
symphonia = { version = "0.6", features = ["all"] }
opus = "0.3"
# 0.10 (pulls libspa/libspa-sys 0.10) so the bindgen step parses the host's
# newer PipeWire/SPA headers. libspa-sys 0.8 emitted an opaque `spa_pod_builder`
# against PipeWire 1.6.x, breaking the `libspa` wrapper's `.data`/`.size` access.
pipewire = "0.10"
# Linux scheduler syscalls (sched_setscheduler / SCHED_IDLE) used to run the
# background true-peak measurement sweep at idle priority so it never competes
# with the realtime audio thread or the UI. std exposes no scheduling-class API.
libc = "0.2"
rfd = "0.15"
ringbuf = "0.4"
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the tree transitively (Slint's color-scheme watcher, rfd's portal
# picker). Used directly to emit the com.canonical.Unity.LauncherEntry `Update`
# signal that drives the KDE taskbar progress. Default features include the
# blocking API and async-io backend.
zbus = "5"

[build-dependencies]
# Must match the `slint` git rev above (the compiler and runtime are versioned
# together). See the comment on the `slint` dependency for why this is a git pin.
slint-build = { git = "https://github.com/slint-ui/slint", rev = "85e3eb76819762cdcaa732fa87533ff896546bac" }

[profile.release]
# Drop the ~8.5 MB .symtab/.strtab symbol table from the shipped binary; it is
# never loaded at runtime (no .debug_* sections are emitted in release anyway).
# "symbols" keeps unwind info intact, so panic backtraces and Drop-on-panic are
# unchanged. The remaining ~15 MB .text is real code (static Slint + symphonia).
strip = "symbols"
# Thin LTO: per-unit cross-module inlining and dead-code elimination that
# parallelises and links far faster than fat `lto = true`, for most of the .text
# savings. codegen-units is left at the release default (16) so codegen stays
# parallel; fat LTO + codegen-units = 1 saved a little more but the link cost ~2
# min, which is not worth it here. panic stays "unwind" (default) deliberately.
lto = "thin"
