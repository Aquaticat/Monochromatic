[package]
name = "music-player"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false
description = "Minimal Wayland + PipeWire music player built with Slint. Ad-hoc queue, broad codec support (symphonia + Opus)."

[lib]
name = "music_player"
path = "src/lib.rs"

[[bin]]
name = "music-player"
path = "src/main.rs"

[dependencies]
# Pinned to a Slint master revision (not a crates.io release) for smooth
# mouse-wheel scrolling. Flickable animates discrete wheel events with a short
# fixed-duration easing in slint-ui/slint#11338 (merged 2026-04-15, fixes
# #11312). That commit diverged from the 1.16 release line, so it is absent from
# the latest release (1.16.1, 2026-04-23) and ships only on master, landing in a
# 1.17 release. The rev is pinned (not branch=master) so the exact Slint commit
# is fixed and `cargo update` cannot move it; Cargo.lock is gitignored repo-wide
# (`*.lock`), so the rev pin, not the lockfile, is what fixes Slint. slint-build
# below MUST track the same rev. Revert both to a crates.io `version` once a
# release including #11338 ships.
directories = "5"
# Same Slint rev as above: the winit backend is constructed explicitly (not via
# the default backend selector) so a window-attributes hook can set the Wayland
# app_id, which KDE needs to attach taskbar progress to the running window. Its
# re-exported `winit` (`i_slint_backend_winit::winit`) is reused for the
# WindowAttributes ext trait, so no separate `winit` dependency is added.
i-slint-backend-winit = { git = "https://github.com/slint-ui/slint", rev = "85e3eb76819762cdcaa732fa87533ff896546bac" }
# Not called from our code: a feature-unification shim. icu_provider reaches the
# tree transitively (slint -> parley -> icu_segmenter -> icu_provider). With its
# `logging` feature OFF, a DEBUG build routes ICU's internal `warn!` to a raw
# `std::eprintln!` (icu_provider 2.2 src/lib.rs:194), so opening a folder with
# Japanese (or Thai/Khmer/etc.) filenames floods stderr with
# "ICU4X data error: No segmentation model for language: ja" once per layout pass:
# parley builds LineSegmenter::new_for_non_complex_scripts, which bundles no CJK
# dictionary, so icu_segmenter warns it cannot dictionary-segment the run (text
# still renders, breaking between graphemes). Release builds already no-op those
# warns; turning on `logging` makes debug builds route through the real `log`
# facade too (silent with no subscriber installed), so the flood stops in both.
# RUST_LOG cannot suppress it (the eprintln shim ignores log filtering). The
# version must stay compatible with the transitive pin so cargo unifies, not
# duplicates. See docs/troubleshooting/slint-parley-icu-cjk-segmentation.md.
icu_provider = { version = "2", features = ["logging"] }
# Linux scheduler syscalls (sched_setscheduler / SCHED_IDLE) used to run the
# background true-peak measurement sweep at idle priority so it never competes
# with the realtime audio thread or the UI. std exposes no scheduling-class API.
libc = "0.2"
# Pinned to opus-rs git HEAD (post-0.3.1) instead of the crates.io 0.3.1 release.
# 0.3.1 depends on audiopus_sys 0.2.2, whose BUNDLED libopus (commit 7b05f44)
# declares cmake_minimum_required(VERSION 3.1); CMake 4.x removed compatibility
# with < 3.5 and aborts configuring it (seen on Windows with CMake 4.3.3). opus-rs
# HEAD replaced audiopus_sys with opusic-sys 0.7.3, which bundles libopus 1.6.1
# (cmake_minimum_required(VERSION 3.16)), so it configures cleanly under CMake 4
# with no CMAKE_POLICY_VERSION_MINIMUM override. opusic-sys's `bundled` feature is
# ON by default and the `opus` crate pulls it with default features, so libopus is
# compiled from source via cmake on EVERY platform (this is why the Containerfile
# now installs cmake; macOS and Windows already have it). The public `opus` API
# (Decoder/Channels/decode_float/reset_state/Error) is unchanged at this rev, so
# src/opus.rs and error.rs need no edits. The rev is pinned (not branch=master) so
# `cargo update` cannot move it, and Cargo.lock is gitignored repo-wide (`*.lock`).
# Revert to a crates.io `version` once a release with the opusic-sys backend ships.
# See ../../../docs/troubleshooting/audiopus-cmake4-libopus-min-version.md.
opus = { git = "https://github.com/SpaceManiac/opus-rs", rev = "559876660603dc8079a053e03e6438766f669e69" }
rfd = "0.15"
ringbuf = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { git = "https://github.com/slint-ui/slint", rev = "85e3eb76819762cdcaa732fa87533ff896546bac", features = ["backend-winit", "renderer-femtovg", "renderer-software"] }
symphonia = { version = "0.6", features = ["all"] }

# Linux-only native backends. PipeWire (audio) and zbus (KDE taskbar progress)
# have no macOS equivalent, so cargo compiles them only when target_os = linux;
# on macOS they are absent from the dependency graph entirely.
[target.'cfg(target_os = "linux")'.dependencies]
# PipeWire is the Linux-only native audio path (src/output_pipewire.rs); it has
# no macOS port. 0.10 (pulls libspa/libspa-sys 0.10) so the bindgen step parses
# the host's newer PipeWire/SPA headers. libspa-sys 0.8 emitted an opaque
# `spa_pod_builder` against PipeWire 1.6.x, breaking the `libspa` wrapper's
# `.data`/`.size` access.
pipewire = "0.10"
# Already in the tree transitively (Slint's color-scheme watcher, rfd's portal
# picker). Used directly to emit the com.canonical.Unity.LauncherEntry `Update`
# signal that drives the KDE taskbar progress. Default features include the
# blocking API and async-io backend. macOS has no D-Bus session bus, so it is
# gated to Linux alongside the launcher integration it powers.
zbus = "5"

# Non-Linux native backend. cpal drives the OS audio engine (src/output_cpal.rs):
# CoreAudio on macOS, WASAPI on Windows, the counterpart to the PipeWire path. One
# cfg(not(linux)) table covers both targets, matching the module gate in lib.rs.
# cpal links no C: it reaches CoreAudio through Apple framework bindings and WASAPI
# through pure-Rust windows-sys bindings. The OS audio engine sample-rate-converts
# to the hardware clock, so the engine still feeds samples at each track's native
# rate exactly as under PipeWire (no in-player resampling).
[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.15"

[build-dependencies]
# Must match the `slint` git rev above (the compiler and runtime are versioned
# together). See the comment on the `slint` dependency for why this is a git pin.
slint-build = { git = "https://github.com/slint-ui/slint", rev = "85e3eb76819762cdcaa732fa87533ff896546bac" }

[profile.release]
# strip: drop the ~8.5 MB .symtab/.strtab symbol table (never loaded at runtime;
# no .debug_* sections are emitted in release anyway). "symbols" keeps unwind
# info intact, so panic backtraces and Drop-on-panic are unchanged. Mandatory.
strip = "symbols"
# Fat LTO: whole-program inlining and dead-code elimination across the entire
# dependency graph (Slint, symphonia-all, zbus). This is what actually shrinks
# .text; thin LTO was measured to give ~no gain over strip alone on this crate.
# Measured here: fat LTO + default 16 codegen-units -> ~17.5 MB at ~2m06s.
# codegen-units = 1 reaches ~16.4 MB at about the SAME build time (fat LTO's
# serial whole-program link dominates either way, so one unit buys no speed-up),
# but that extra ~1.1 MB is not worth carrying an extra knob, so codegen-units
# stays at the default. Release builds run ~2 min vs ~10s unoptimised; the
# run-debug mise task is the fast-iteration path. panic stays "unwind" (default).
lto = true
