# Cargo work runs on the HOST when Zig and the native dev libraries are present,
# and falls back to the Fedora build container otherwise (see Containerfile).
# Host build deps: Zig 0.15.x (provided repo-wide via the root mise `zig` tool)
# plus fontconfig-devel and freetype-devel (layer with rpm-ostree on an immutable
# Fedora). libghostty-vt-sys compiles vendored Ghostty with Zig either way.
# The {{vars.host_ok}} predicate probes for zig and pkg-config fontconfig/freetype2;
# when anything is missing the {{vars.container_cargo}} prefix runs the same cargo
# command in podman instead (package dir bind-mounted at /work, cargo registry and
# Ghostty git cache in a named volume, `label=disable` to skip SELinux relabeling).
# The *:container tasks force the podman path regardless of host libraries so the
# container build stays asserted; verify:container is the umbrella assertion.
# Why podman and not mise-managed deps (conda route rejected):
# see ../../../docs/decisions/desktop-app-podman-build.md

[env]
# Property-changed callbacks and the pinned Slint Flickable improvements must be
# compiled consistently on the host, matching the Containerfile's baked ENV.
# podman does not forward host env into the container, so this only affects the
# host branch (the image sets its own copy).
SLINT_ENABLE_EXPERIMENTAL_FEATURES = "1"
# Host libclang ships only versioned (libclang.so.NN, no unversioned symlink), so
# point bindgen (libghostty-vt-sys) at the lib dir explicitly. Host only; not
# forwarded into the container, which carries its own clang.
LIBCLANG_PATH = "/usr/lib64"

[vars]
# True when the host can build natively: cargo and zig on PATH and the Slint font
# libraries resolvable through pkg-config (fontconfig also validates freetype2).
host_ok = '((which cargo | is-not-empty) and (which zig | is-not-empty) and ((^pkg-config --exists fontconfig freetype2 | complete | get exit_code) == 0))'
# Host-only env for the native cargo branch.
# BINDGEN_EXTRA_CLANG_ARGS: clang resource headers (stdbool.h) live under
# /usr/lib/clang/<v> but libclang.so sits in /usr/lib64 and looks beside itself,
# so bindgen (libghostty-vt-sys) needs an explicit -resource-dir. Glob the
# major-version dir so an LLVM bump needs no manual edit.
# ZIG_GLOBAL_CACHE_DIR: HOME is /home/user, a symlink to /var/home/user, while
# the build runs from the physical /var/home path, so zig's default
# $HOME/.cache/zig cache computes a broken relative path to the spawned codegen
# exe (FileNotFound on uucode_build_tables). Pin the cache to a physical path
# under target/ (pwd resolves physically) to keep both sides in one path-space.
host_env = 'let _rd = (glob "/usr/lib/clang/*" | sort | last); $env.BINDGEN_EXTRA_CLANG_ARGS = $"-resource-dir=($_rd)"; $env.ZIG_GLOBAL_CACHE_DIR = $"(pwd)/target/zig-global-cache"'
# Forced-container cargo prefix: build the image when it is missing, then run the
# cargo subcommand appended by the caller inside podman. Memory and cpu caps bound
# the vendored Ghostty + Slint compile.
container_cargo = '(if ((^podman image exists localhost/monochromatic/terminal | complete | get exit_code) != 0) { ^podman build --tag localhost/monochromatic/terminal --file Containerfile . }); ^podman run --rm --memory=4g --cpus=4 --security-opt label=disable --volume $"(pwd):/work" --volume terminal-cargo:/cargo --workdir /work localhost/monochromatic/terminal cargo'

[tasks.image]
description = "Build the Fedora build/run container image"
run = "podman build --tag localhost/monochromatic/terminal --file Containerfile ."

[tasks.build]
description = "Release build (host if Zig + dev libs present, else container), then stage runtime shared libraries"
run = '''
if {{vars.host_ok}} { {{vars.host_env}}; cargo build --release } else { {{vars.container_cargo}} build --release }
if $env.LAST_EXIT_CODE != 0 { error make { msg: "terminal release build failed" } }
mise run //packages/desktop-app/terminal:stage:runtime-libs:release
'''

[tasks."build:debug"]
description = "Debug build (host if Zig + dev libs present, else container), then stage runtime shared libraries"
run = '''
if {{vars.host_ok}} { {{vars.host_env}}; cargo build } else { {{vars.container_cargo}} build }
if $env.LAST_EXIT_CODE != 0 { error make { msg: "terminal debug build failed" } }
mise run //packages/desktop-app/terminal:stage:runtime-libs:debug
'''

[tasks."stage:runtime-libs:release"]
description = "Copy release libghostty-vt shared libraries into the binary rpath directory"
run = '''
let lib_dirs = (glob "target/release/build/libghostty-vt-sys-*/out/ghostty-install/lib" | sort)
if ($lib_dirs | is-empty) {
  error make { msg: "missing release libghostty-vt build output; run build first" }
}
let source_lib_dir = ($lib_dirs | last)
let staged_lib_dir = "target/lib/monochromatic-terminal"
mkdir $staged_lib_dir
for name in ["libghostty-vt.so" "libghostty-vt.so.0" "libghostty-vt.so.0.1.0"] {
  cp --force ($source_lib_dir | path join $name) $staged_lib_dir
}
'''

[tasks."stage:runtime-libs:debug"]
description = "Copy debug libghostty-vt shared libraries into the binary rpath directory"
run = '''
let lib_dirs = (glob "target/debug/build/libghostty-vt-sys-*/out/ghostty-install/lib" | sort)
if ($lib_dirs | is-empty) {
  error make { msg: "missing debug libghostty-vt build output; run build:debug first" }
}
let source_lib_dir = ($lib_dirs | last)
let staged_lib_dir = "target/lib/monochromatic-terminal"
mkdir $staged_lib_dir
for name in ["libghostty-vt.so" "libghostty-vt.so.0" "libghostty-vt.so.0.1.0"] {
  cp --force ($source_lib_dir | path join $name) $staged_lib_dir
}
'''

[tasks.lint]
description = "cargo check (host if Zig + dev libs present, else container)"
run = 'if {{vars.host_ok}} { {{vars.host_env}}; cargo check } else { {{vars.container_cargo}} check }'

[tasks."lint:clippy"]
description = "Run clippy with warnings denied (host if Zig + dev libs present, else container)"
run = 'if {{vars.host_ok}} { {{vars.host_env}}; cargo clippy --release -- --deny warnings } else { {{vars.container_cargo}} clippy --release -- --deny warnings }'

[tasks."format:clippy"]
description = "Apply clippy's machine-applicable suggestions in place (host if Zig + dev libs present, else container)"
# --allow-no-vcs is harmless on the host (the repo .git is visible) and required
# in the container, where only the package dir is bind-mounted at /work so the
# repo-root .git is not visible and cargo fix would otherwise refuse to run.
run = 'if {{vars.host_ok}} { {{vars.host_env}}; cargo clippy --fix --allow-dirty --allow-staged --allow-no-vcs } else { {{vars.container_cargo}} clippy --fix --allow-dirty --allow-staged --allow-no-vcs }'

[tasks."lint:max-lines"]
description = "Enforce the 300 code-line budget on .rs files"
run = "cargo run --quiet --manifest-path ../../linter/rust/Cargo.toml -- ."

[tasks.test]
description = "cargo nextest run (host if Zig + dev libs present, else container)"
run = 'if {{vars.host_ok}} { {{vars.host_env}}; cargo nextest run --release } else { {{vars.container_cargo}} nextest run --release }'

[tasks."build:container"]
description = "Release build forced inside the container, then stage runtime libraries (asserts the container path)"
run = '''
{{vars.container_cargo}} build --release
if $env.LAST_EXIT_CODE != 0 { error make { msg: "container release build failed" } }
mise run //packages/desktop-app/terminal:stage:runtime-libs:release
'''

[tasks."lint:clippy:container"]
description = "clippy with warnings denied forced inside the container"
run = '{{vars.container_cargo}} clippy --release -- --deny warnings'

[tasks."test:container"]
description = "cargo nextest run forced inside the container"
run = '{{vars.container_cargo}} nextest run --release'

[tasks."verify:container"]
description = "Assert the container build/clippy/test path works even when the host has Zig and the dev libs"
# Aborts on the first failing step so a broken container path fails the task
# rather than being masked by a later passing step (nushell `;` is not fail-fast).
run = '''
mise run image
{{vars.container_cargo}} build --release
if $env.LAST_EXIT_CODE != 0 { error make { msg: "container release build failed" } }
{{vars.container_cargo}} clippy --release -- --deny warnings
if $env.LAST_EXIT_CODE != 0 { error make { msg: "container clippy failed" } }
{{vars.container_cargo}} nextest run --release
if $env.LAST_EXIT_CODE != 0 { error make { msg: "container tests failed" } }
'''

[tasks.run]
description = "Build (host if Zig + dev libs present, else container), install desktop metadata and runtime libraries, then run the GUI on the host"
run = '''
let home = ($env.HOME? | default '')
if {{vars.host_ok}} { {{vars.host_env}}; cargo build --release } else { {{vars.container_cargo}} build --release }
if $env.LAST_EXIT_CODE != 0 { error make { msg: "terminal release build failed" } }
mise run //packages/desktop-app/terminal:stage:runtime-libs:release
let staged_lib_dir = "target/lib/monochromatic-terminal"
let bin = if ($home != '') {
  let apps_dir = ($home | path join '.local/share/applications')
  mkdir $apps_dir
  cp --force share/applications/monochromatic.terminal.desktop $apps_dir
  let bin_dir = ($home | path join '.local/bin')
  mkdir $bin_dir
  cp --force target/release/monochromatic-terminal $bin_dir
  let installed_lib_dir = ($home | path join '.local/lib/monochromatic-terminal')
  mkdir $installed_lib_dir
  for name in ["libghostty-vt.so" "libghostty-vt.so.0" "libghostty-vt.so.0.1.0"] {
    cp --force ($staged_lib_dir | path join $name) $installed_lib_dir
  }
  ($bin_dir | path join 'monochromatic-terminal')
} else {
  './target/release/monochromatic-terminal'
}
^$bin
'''
