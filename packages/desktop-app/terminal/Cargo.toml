[package]
name = "terminal"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false
description = "Slint desktop terminal prototype backed by Ghostty's libghostty-vt core."

[lints.clippy]
disallowed_methods = "deny"

[lib]
name = "terminal_app"
path = "src/lib.rs"

[[bin]]
name = "monochromatic-terminal"
path = "src/main.rs"

[dependencies]
# Same Slint release family as packages/music-player/desktop-app so both desktop
# prototypes share Flickable smooth wheel and touch scrolling. The explicit winit
# backend lets the app stamp its Wayland app id before the window is created.
# Keep slint-build below on the same release family because the markup compiler
# and runtime are versioned together.
i-slint-backend-winit = "1.17.0"
# Safe Rust binding for Ghostty's terminal core. Default features are disabled
# because this prototype renders text cells only and does not need Kitty images.
libghostty-vt = { version = "0.1.1", default-features = false }
# WezTerm's PTY abstraction. It gives this app safe shell spawn, read, write,
# and resize operations without hand-written forkpty or ioctl setup.
portable-pty = "0.9.0"
slint = { version = "1.17.0", features = ["backend-winit", "renderer-femtovg", "renderer-software"] }

[build-dependencies]
# Must match the `slint` release family above.
slint-build = "1.17.0"
