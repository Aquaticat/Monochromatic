[package]
name = "file-manager-qt"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false
description = "Qt/cxx-qt desktop file-manager: native Wayland drag-and-drop, successor to the Slint prototype."

[lints.clippy]
disallowed_methods = "deny"

[[bin]]
name = "monochromatic-file-manager-qt"
path = "src/main.rs"

[dependencies]
# cxx-qt 0.9.1 bridges Rust <-> Qt6. The UI is real Qt/QtQuick, so native OS
# drag-and-drop (including native Wayland, which winit/Slint lack) comes from Qt
# itself. Versions match the cxx-qt 0.9.1 release family; cxx is pinned to the
# same 1.0.176 the cxx-qt workspace uses so the generated bridge stays compatible.
cxx = "1.0.176"
cxx-qt = "0.9.1"
# `full` pulls the complete cxx-qt-lib type surface (QString, QUrl, QList, the
# QAbstractItemModel base, etc.) the file-manager model and drop handlers need.
cxx-qt-lib = { version = "0.9.1", features = ["full"] }

[build-dependencies]
# `link_qt_object_files` links the QML module's generated object files (the qrc
# resource embedding qml/main.qml and the registered QObject) into the binary.
cxx-qt-build = { version = "0.9.1", features = ["link_qt_object_files"] }
