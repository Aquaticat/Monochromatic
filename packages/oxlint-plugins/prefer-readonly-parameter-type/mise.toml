[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"
# Invoke package entry directly so Windows does not depend on executable shim discovery.
run = "node ../../../node_modules/rolldown/bin/cli.mjs --configLoader native --config rolldown.node.config.ts"
run_windows = '"%LOCALAPPDATA%\mise\bin\mise.exe" exec node -- node ../../../node_modules/rolldown/bin/cli.mjs --configLoader native --config rolldown.node.config.ts'

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"

[tasks."test:semantic-bridge-host"]
description = "Exercise built semantic bridge lifecycle on current host"
run = "node src/typescript-sync-adapter.unit.test.ts"
run_windows = '"%LOCALAPPDATA%\mise\bin\mise.exe" exec node -- node src/typescript-sync-adapter.unit.test.ts'

[tasks."test:external-consumer-host"]
description = "Exercise built package from external consumer on current host"
run = "node src/external-consumer.unit.test.ts"
run_windows = '"%LOCALAPPDATA%\mise\bin\mise.exe" exec node pnpm -- node src/external-consumer.unit.test.ts'
