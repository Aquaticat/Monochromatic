# Generated by file-enforcer from mise-packages.config.ts; do not hand-edit.
# Build flavors derive from tsdown.{node,browser,client}.config.ts presence.
# Boilerplate task bodies live in ../../../mise-shared/*.toml (generated from
# mise-packages.bodies.config.ts); bespoke tasks live in
# mise-packages/<category>/<package>.toml.

[task_config]
includes = [
  "../../../mise-shared/base.toml",
  "../../../mise-shared/client.toml",
  "../../../mise-shared/lint.toml",
  "../../../mise-shared/lint-types.toml",
  "../../../mise-shared/oxlint.toml",
]

[tasks."lint:types"]
hide = true

[tasks."dev:site"]
description = "Start Done in watch mode"
run = "mise watch -w src -r -- node src/server.ts"

# start:site intentionally omitted -- production is managed by the
# orchestrator container, not by mise (see PLAN.md section 7).

[tasks."dev"]
description = "Start Done in watch mode alongside a local llama.cpp inference server"
run = [{ tasks = ["dev:site:llama", "dev:site"] }]

[tasks."dev:llama"]
hide = true
description = "Start llama-server with default model (LFM2.5-1.2B-Instruct-Q4_K_M)"
run = "llama-server --hf-repo LiquidAI/LFM2.5-1.2B-Instruct-GGUF --hf-file LFM2.5-1.2B-Instruct-Q4_K_M.gguf --ctx-size 4096 --host 127.0.0.1 --port 8080"
