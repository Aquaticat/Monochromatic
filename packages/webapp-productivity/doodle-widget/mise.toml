# Generated by file-enforcer from mise-packages.config.ts; do not hand-edit.
# Build flavors derive from tsdown.{node,browser,client}.config.ts presence.
# Boilerplate task bodies live in ../../../mise-shared/*.toml (generated from
# mise-packages.bodies.config.ts); bespoke tasks live in
# mise-packages/<category>/<package>.toml.

[task_config]
includes = [
  "../../../mise-shared/lint.toml",
  "../../../mise-shared/lint-types.toml",
  "../../../mise-shared/oxlint.toml",
]

[tasks."build:js:client"]
run = "tsdown --config tsdown.client.config.ts"

[tasks.build]
description = "Bundle client JS then generate self-contained HTML"
run = ["mise run build:js:client", "node src/build.ts"]

[tasks."format:oxlint"]
description = "Auto-fix lint issues with Oxlint (type-aware), scoped to this package"
shell = "node -e"
run = """
{{vars.dispatch_workspace_node}}
ensureOxlintConfig()
runWorkspaceNode('packages/dev-script/task-util', 'oxlint-wrapper', ['--type-aware', '--fix'])
"""
