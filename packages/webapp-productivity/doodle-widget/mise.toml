[tasks.build]
description = "Bundle client JS then generate self-contained HTML"
run = ["mise run build:js:client", "bun src/build.ts"]

[tasks."build:js:client"]
extends = "build:js:client"

[tasks.lint]
extends = "lint"

[tasks.'lint:types']
extends = "lint:types"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
description = "Auto-fix lint issues with Oxlint (type-aware), scoped to this package"
run = """
{{vars.monorepo_root_setup}}
{{vars.ensure_oxlint_config}}
{{vars.workspace_node_dispatch}}
run_workspace_node $root packages/dev-script/task-util oxlint-wrapper --type-aware --fix
"""
