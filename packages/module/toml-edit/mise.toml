[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:browser"]
extends = "build:js:browser"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:browser"]
extends = "watch:build:js:browser"

[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"

[tasks.buildAndTest]
description = "Build the neutral bundle, then run unit tests against the built dist"
run = ["mise run build", "mise run test:unit"]

[tasks.fuzz]
description = "Build the bundle, then run *.property.unit.test.ts as a time-budgeted fuzz campaign under node"
usage = '''
flag "--budget <ms>" help="Per-property time budget in milliseconds (default 60000)"
'''
shell = "node -e"
run = """
const { execFileSync } = await import('node:child_process')
const { glob } = await import('node:fs/promises')
const budget = (process.env.usage_budget ?? '60000').trim()
// Property files import the built package entry point, so the dist must be
// fresh before any property runs; rebuild first to avoid chasing a bug that
// the stale artifact has not yet seen fixed.
execFileSync('mise', ['run', 'build'], { stdio: 'inherit' })
const files = []
for await (const file of glob('src/**/*.property.unit.test.ts')) { files.push(file) }
console.log(`Fuzz campaign over ${files.length} property files at ${budget}ms each`)
for (const file of files) {
  console.log(`fuzzing ${file}`)
  execFileSync('node', [file], { stdio: 'inherit', env: { ...process.env, TOML_EDIT_FUZZ_BUDGET_MS: budget } })
}
"""
