# Pinned BurntSushi reference decoder for the phase 7 differential oracle
# (`test:differential`). Pinned, not `@latest`, so the differential verdicts are
# reproducible and the executed external Go code is auditable; v1.6.0 targets
# TOML 1.0, matching our parser's default version.
[tools]
"go:github.com/BurntSushi/toml/cmd/toml-test-decoder" = "v1.6.0"

[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:browser"]
extends = "build:js:browser"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:browser"]
extends = "watch:build:js:browser"

[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
description = "Auto-fix this package with Oxlint (non-type-aware)"
shell = "node -e"
run = """
{{vars.dispatch_workspace_node}}
ensureOxlintConfig()
runWorkspaceNode('packages/dev-script/task-util', 'oxlint-wrapper', ['--fix'])
"""

[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"

[tasks.buildAndTest]
description = "Build the neutral bundle, then run unit tests against the built dist"
run = ["mise run build", "mise run test:unit"]

[tasks.fuzz]
description = "Build the bundle, then run *.property.unit.test.ts as a time-budgeted fuzz campaign under node"
usage = '''
flag "--budget <ms>" help="Per-property time budget in milliseconds (default 60000)"
'''
shell = "node -e"
run = """
const { execFileSync } = await import('node:child_process')
const { glob } = await import('node:fs/promises')
const budget = (process.env.usage_budget ?? '60000').trim()
// Property files import the built package entry point, so the dist must be
// fresh before any property runs; rebuild first to avoid chasing a bug that
// the stale artifact has not yet seen fixed.
execFileSync('mise', ['run', 'build'], { stdio: 'inherit' })
const files = []
for await (const file of glob('src/**/*.property.unit.test.ts')) { files.push(file) }
console.log(`Fuzz campaign over ${files.length} property files at ${budget}ms each`)
for (const file of files) {
  console.log(`fuzzing ${file}`)
  execFileSync('node', [file], { stdio: 'inherit', env: { ...process.env, TOML_EDIT_FUZZ_BUDGET_MS: budget } })
}
"""

[tasks."test:conformance"]
description = "Run the upstream toml-test suite against the package decode/encode adapters for TOML 1.0 and 1.1"
shell = "node -e"
run = """
const { execFileSync } = await import('node:child_process')
// The adapters import the built package entry point, so the dist must be fresh.
execFileSync('mise', ['run', 'build'], { stdio: 'inherit' })
// Follow the latest upstream runner through mise (not pinned) so corpus updates
// are exercised; mise verifies the release attestation and SLSA provenance on
// install. The version is logged so a future failure can be traced to an
// upstream corpus change versus a local code change.
const runner = ['exec', 'github:toml-lang/toml-test@latest', '--', 'toml-test']
// WARN=false silences the package's CRLF-normalization warning so the decoder's
// stderr stays clean on success (the runner treats any stderr as the result).
const env = { ...process.env, WARN: 'false' }
execFileSync('mise', [...runner, 'version'], { stdio: 'inherit', env })
const decoder = `${process.cwd()}/src/conformance/decode.ts`
const encoder = `${process.cwd()}/src/conformance/encode.ts`
for (const version of ['1.0', '1.1']) {
  console.log(`toml-test conformance: TOML ${version}`)
  execFileSync('mise', [...runner, 'test',
    `-decoder=node ${decoder} ${version}`,
    `-encoder=node ${encoder} ${version}`,
    `-toml=${version}`, '-color', 'never'],
    { stdio: 'inherit', env })
}
console.log('toml-test conformance: all decoder, encoder, and invalid cases passed for 1.0 and 1.1')
"""

[tasks."test:differential"]
description = "Differential parser oracle: compare our decoder against the pinned BurntSushi reference decoder over generated and corrupted TOML"
shell = "node -e"
run = """
const { execFileSync } = await import('node:child_process')
// The property imports the built package entry point, so the dist must be fresh.
execFileSync('mise', ['run', 'build'], { stdio: 'inherit' })
// Resolve the pinned reference decoder declared in [tools]; a missing binary
// fails loud here since running it is this task's whole purpose. The path is
// passed to the property via env so it does not re-resolve per case.
const bin = execFileSync('mise', ['which', 'toml-test-decoder'], { encoding: 'utf8' }).trim()
console.log(`reference decoder: ${bin}`)
execFileSync('node', [`${process.cwd()}/src/fuzz/differential.expensive.unit.test.ts`], {
  stdio: 'inherit',
  env: { ...process.env, TOML_EDIT_REF_DECODER: bin },
})
"""
