[tasks."stress"]
description = "Run a stress scenario; --scenario=hot-repo|bursty-comment (or all)"
usage = 'arg "[args]" var=#true help="Forwarded to stress CLI"'
run = """
let args = ($env.usage_args? | default '' | split row ' ' | where {|p| $p != ''})
bun src/cli.ts ...$args
"""

[tasks."stress:hot-repo"]
description = "Run the hot-repo stress scenario"
run = "bun src/cli.ts --scenario=hot-repo"

[tasks."stress:bursty-comment"]
description = "Run the bursty-comment stress scenario"
run = "bun src/cli.ts --scenario=bursty-comment"

[tasks.test]
extends = "test"

[tasks."test:unit"]
hide = true
description = "Run unit tests"
usage = 'arg "[args]" var=#true help="Test file paths to run (when provided, only those files run)"'
run = """
let args = ($env.usage_args? | default '' | str trim | split row ' ' | where {|part| $part != '' })
if ($args | is-empty) {
  glob "**/*.unit.test.ts" | where { not ($in | str contains "/deprecated/") } | par-each { |file| bun $file }
} else {
  $args | par-each { |file| bun $file }
}
"""

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"
hide = true

[tasks."lint:oxlint"]
extends = "lint:oxlint"
