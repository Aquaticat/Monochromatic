[tasks."start:server"]
hide = true
description = "Run the h3 forge server (used by dev:server under mise watch)"
run = "bun src/index.ts"

[tasks."dev:server"]
description = "Start the forge server in watch mode"
run = "mise watch -w src -r -- start:server"

[tasks."dev"]
description = "Start the forge server in watch mode against in-memory storage + libSQL"
run = "mise run dev:server"

[tasks.test]
extends = "test"

[tasks."test:unit"]
hide = true
description = "Run unit tests"
usage = 'arg "[args]" var=#true help="Test file paths to run (when provided, only those files run)"'
run = """
let args = ($env.usage_args? | default '' | str trim | split row ' ' | where {|part| $part != '' })
if ($args | is-empty) {
  glob "**/*.unit.test.ts" | where { not ($in | str contains "/deprecated/") } | par-each { |file| bun $file }
} else {
  $args | par-each { |file| bun $file }
}
"""

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"
hide = true

[tasks."lint:oxlint"]
extends = "lint:oxlint"
