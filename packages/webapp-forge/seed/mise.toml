[tasks."seed:demo"]
description = "Seed a synthetic forge dataset; --repos=N --users=N --seed=N --out=path"
usage = 'arg "[args]" var=#true help="Forwarded to seed CLI"'
run = """
let args = ($env.usage_args? | default '' | split row ' ' | where {|p| $p != ''})
bun src/cli.ts ...$args
"""

[tasks.test]
extends = "test"

[tasks."test:unit"]
hide = true
description = "Run unit tests"
usage = 'arg "[args]" var=#true help="Test file paths to run (when provided, only those files run)"'
run = """
let args = ($env.usage_args? | default '' | str trim | split row ' ' | where {|part| $part != '' })
if ($args | is-empty) {
  glob "**/*.unit.test.ts" | where { not ($in | str contains "/deprecated/") } | par-each { |file| bun $file }
} else {
  $args | par-each { |file| bun $file }
}
"""

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"
hide = true

[tasks."lint:oxlint"]
extends = "lint:oxlint"
