# Bench sidecar for truepeak-core: corpus-scale evaluation and the corrected-target
# parameter search. It reads a per-track measurement file (full true peak plus
# per-second bin peaks) and simulates any window policy WITHOUT re-decoding, scoring it
# with the SHARED truepeak-core gain, window-placement, and policy math so the evidence
# cannot diverge from production behavior. See README.md and
# ../../../doc/planning/music-player-shared-truepeak-core.md.
[package]
name = "truepeak-core-bench"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false
description = "Corpus evaluation and corrected-target parameter search for the shared true-peak policy, scored with the production truepeak-core meter, gain, and window math."

[lints.clippy]
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"

# Standalone crate, its own workspace root, matching the core crate and the Android
# island so no ancestor Cargo.toml absorbs it.
[workspace]

[[bin]]
name = "truepeak-core-bench"
path = "src/main.rs"

# The corpus collector: decode the library through the SHARED truepeak-core meter (via
# ffmpeg, so no decoder is ported here) and emit fine-grained cache bins. Separate bin so
# the search tool stays decode-free.
[[bin]]
name = "truepeak-core-collect"
path = "src/bin/collect.rs"

[dependencies]
# `anyhow` carries application-level errors for corpus readers and report binaries.
anyhow = "1"
# The production meter, gain math, window placement, and policy identity, by path so the
# bench scores candidates with the exact code playback will run.
truepeak-core = { path = "../truepeak-core" }

# Read the per-track measurement file (one JSON object per line) the corpus collector
# emits: derive feature lets the track record declare its fields.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Surface truepeak-core's tracing events during corpus runs on stderr; the report itself
# stays on stdout via println!. tracing now arrives through truepeak-core (default-on), and
# adding it directly lets these bins call the macros and install a stderr subscriber.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Whole-program optimization for the corpus sweep over thousands of tracks.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
