# Custom detekt configuration for the music-player app. Only the require-kdoc rule
# set runs (detekt's default rule sets are disabled in app/build.gradle.kts), so this
# file configures that one rule set and nothing else.
require-kdoc:
  RequireKDoc:
    active: true
    # Skip test sources, mirroring how the repo's require-tsdoc rule skips .test.ts.
    excludes: ['**/test/**', '**/androidTest/**']
    # Set true to let `override` members inherit documentation from the supertype.
    # Default false to require KDoc on every declaration, as require-tsdoc does.
    allowOverride: false
