[package]
name = "musicplayer-native"
version = "0.1.0"
edition = "2021"
publish = false

[lints.clippy]
disallowed_methods = "deny"

# Standalone crate: this Android package is a Gradle island that no parent cargo
# workspace owns. An empty [workspace] table pins this crate as its own root, so a
# future ancestor Cargo.toml cannot silently absorb it.
[workspace]

[lib]
# System.loadLibrary("musicplayer_native") loads libmusicplayer_native.so, so the
# lib name (not the package name) is what Kotlin references.
name = "musicplayer_native"
crate-type = ["cdylib"]

[dependencies]
# Pure-Rust JNI bindings (no C).
jni = "0.21"

# Cache fingerprint hash (src/fingerprint.rs, exposed to Kotlin over JNI as
# NativeBridge.nativeFingerprint). gxhash has no JVM/Kotlin port, so the
# fingerprint that used to be hand-written FNV-1a in pure Kotlin moved into this
# native crate. Pinned to major 3, matching the desktop crate, so identical
# (path, size, mtime) input hashes identically on both flavors (gxhash output is
# stable within a major and across its supported platforms). REQUIRES the `aes`
# CPU feature with NO software fallback: .cargo/config.toml enables
# -C target-feature=+aes for the Android target triples, and the arm64 device must
# carry the ARMv8 crypto extensions (a SIGILL at runtime otherwise). Builds on
# STABLE Rust (the nightly-only `hybrid` feature is left OFF). See
# ../../../docs/troubleshooting/gxhash-aes-target-feature.md.
gxhash = "3"

# libopus via opus-rs HEAD: its opusic-sys backend bundles libopus 1.6.1 and
# builds it from source with cmake on every platform. Pinned to the same rev as
# the desktop crate (the CMake 4.x compatibility fix; see that crate's Cargo.toml).
# This is the one C cross-compile the full-Rust variant must clear for arm64 Android.
opus = { git = "https://github.com/SpaceManiac/opus-rs", rev = "559876660603dc8079a053e03e6438766f669e69" }

# Pure-Rust demux + decoders for FLAC/WAV/MP3/Vorbis/AAC/ALAC (Opus is handled by
# the opus crate above). Same version and feature set as the desktop crate; no C,
# so it cross-compiles for Android with no extra toolchain.
symphonia = { version = "0.6", features = ["all"] }

# AAudio output (raw ndk::audio, the chosen output backend): pure-Rust FFI to the
# NDK audio C API, no C/C++ build; links the sysroot libaaudio via #[link]. The
# `audio` feature is off by default and pulls api-level-26 (the app targets 35).
ndk = { version = "0.9", features = ["audio"] }

# Lock-free SPSC ring buffer between the decode worker (producer) and the AAudio
# data callback (consumer), so the realtime callback never decodes or allocates.
# Same major version as the desktop crate, whose engine this one ports.
ringbuf = "0.4"
