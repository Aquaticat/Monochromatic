# Shared true-peak core for the music player: the Catmull-Rom meter, the
# attenuate-only gain math, the decoded-audio source trait, window-placement math,
# and the versioned policy identity that keys the cache. Desktop and Android are being
# migrated onto this crate one at a time (neither depends on it yet) so a track will be
# normalized under one shared policy on either flavor. See README.md, the integration
# handover ../../../doc/handover/music-player-truepeak-core-integration.md, and the plan
# ../../../doc/planning/music-player-shared-truepeak-core.md.
[package]
name = "truepeak-core"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false
description = "Shared true-peak meter, attenuate-only gain math, and versioned policy identity for the desktop and Android music players. Catmull-Rom inter-sample peak estimation feeding a -1 dBTP normalization gain."

[lints.clippy]
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"

# Standalone crate: there is no root Cargo workspace in this repo, and the Android
# package is its own Gradle island with an empty [workspace] table. Pinning this
# crate as its own workspace root keeps its target/ and Cargo.lock local and stops a
# future ancestor Cargo.toml from silently absorbing it, exactly as the Android crate
# does. Desktop and Android reach it as a plain path dependency, which does not
# require workspace membership.
[workspace]

[lib]
# Crate paths use the Rust identifier form (underscore), so a consumer writes
# `use truepeak_core::...` while the package on disk stays kebab-case.
name = "truepeak_core"
path = "src/lib.rs"

# The pure surface (meter, gain, window math, policy identity, source contract, and the
# resolver) has NO dependencies, so a consumer that only wants the meter cross-compiles for
# the Android ABIs with nothing extra to clear. The persistent decision cache is behind the
# optional `service` feature so it does not force `turso`/`tokio` onto the meter-only apps;
# each platform enables it when it adopts the shared cache (desktop already carries these
# crates, and the Android cross-compile of `turso` was proven by the Stage-zero spike).
[features]
service = ["dep:turso", "dep:tokio"]

[dependencies]
# The logging facade. Non-optional (unlike the cache crates below) so the pure meter,
# resolver, and bones surface log in every build, including the meter-only bench: repo
# policy is that everything is logged and logging is permanent infrastructure. The crate
# is a tiny pure-Rust facade already resolved transitively in every consumer's lock, and
# its macros compile to a cheap max-level check when no subscriber is installed, so it
# adds no runtime cost to the meter-only apps. Binaries install the sink; this library
# only emits, so the module path is the tag (mirroring the TS tagged loggers).
tracing = "0.1"

# Drives the Turso async API for the decision cache (behind the `service` feature). The
# feature set mirrors the desktop cache: `rt` for a runtime, `sync` for the channels a
# handle blocks on, `macros` for `select!`. Optional so the default build stays dep-free.
tokio = { version = "1", features = ["rt", "sync", "macros"], optional = true }

# The pure-Rust SQLite rewrite that stores decision rows (behind the `service` feature).
# Pinned to the same major 0.6 the desktop cache uses, `default-features = false` to drop
# the full-text and mimalloc defaults. Optional so it is absent from the meter-only build.
turso = { version = "0.6", default-features = false, optional = true }
