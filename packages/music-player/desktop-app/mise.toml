[tasks."verify:container"]
description = "Assert the container build/clippy/test path works even when the host has the dev libs"
# Aborts on the first failing step (execFileSync throws) so a broken container
# path fails the task rather than being masked by a later passing step.
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
execFileSync('mise', ['run', 'image'], { stdio: 'inherit' })
containerCargo(['build', '--release'])
containerCargo(['clippy', '--release', '--', '-D', 'warnings'])
// Only the test step needs the introspection debug info; set it right before so
