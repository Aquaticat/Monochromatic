# Cargo work runs on the HOST when the native dev libraries are present, and
# falls back to the Fedora build container otherwise (see Containerfile).
# On non-Linux targets (macOS, Windows) every task takes a NATIVE cargo branch
# first (process.platform !== 'linux'): no pkg-config/PipeWire probe, no podman
# fallback (a Linux container cannot produce a macOS or Windows binary), and the
# audio backend is cpal (src/output_cpal.rs: CoreAudio on macOS, WASAPI on
# Windows). Prereqs:
#   macOS:   a Rust toolchain with `cargo` on PATH; `cmake` plus the Command Line
#            Tools C compiler (the opus crate's opusic-sys backend builds libopus
#            1.6.1 from source via cmake). The repo's mise `aqua:Kitware/CMake`
#            tool provides cmake; `brew install cmake` also works.
#   Windows: rustup (msvc host) + a nightly toolchain on PATH; Visual Studio (CRT
#            + Windows SDK); `cmake` on PATH (opusic-sys builds libopus 1.6.1 via
#            cmake; 1.6.1's cmake_minimum_required is 3.16, so CMake 4 needs no
#            policy override); and LLVM's `bin` on PATH so `lld-link.exe` (the
#            linker pinned for windows-msvc in .cargo/config.toml) resolves. See
#            HANDOVER.windows-toolchain-and-check.md.
# Host build deps (layer with rpm-ostree on an immutable Fedora):
#   pipewire-devel fontconfig-devel freetype-devel
# plus rustup/cargo and libclang already on PATH; cmake comes from the repo's mise
# `aqua:Kitware/CMake` tool (opusic-sys vendors and cmake-builds libopus 1.6.1, so
# no system opus-devel is needed) and the host's system `make` is its generator.
# The cargo_dispatch var (node -e) probes pkg-config for those libraries; when any
# is missing containerCargo runs the same cargo command in podman instead (package
# dir bind-mounted at /work, cargo registry in a named volume, `label=disable` to
# skip SELinux relabeling of the host tree). The *:container tasks call
# containerCargo directly to force the podman path regardless of host libraries;
# verify:container is the umbrella assertion.
# Why podman and not mise-managed deps (conda route rejected):
# see ../../../docs/decisions/desktop-app-podman-build.md

[env]
# Slint's experimental builtins (FlexboxLayout in the page-tab bar) must be
# enabled for the markup compiler on the host exactly as the Containerfile bakes
# them for the container path; without it the UI compile fails with "Unknown
# element". podman does not forward host env into the container, so this only
# affects the host branch (the image sets its own copy). Needed on macOS too,
# since the same UI markup is compiled there.
SLINT_ENABLE_EXPERIMENTAL_FEATURES = "1"
# NOTE: LIBCLANG_PATH was a process-wide env here but is now set inside the Linux
# hostEnv() of cargo_dispatch below, NOT globally. On macOS it must stay UNSET so
# bindgen finds the Command Line Tools' libclang automatically; a global Linux
# path (/usr/lib64) would point bindgen at a nonexistent directory there.

[vars]
# Bootstrap-safe cargo dispatch for this package. Interpolated into the cargo
# tasks, each of which sets `shell = "node --input-type=module-typescript -e"`.
# - On macOS/Windows (process.platform !== 'linux') runCargo builds natively with
#   no host env and no container (a Linux container cannot produce those binaries;
#   cpal is the audio backend there).
# - hostOk (Linux): cargo on PATH and pkg-config resolves the PipeWire + Slint font
#   libraries (fontconfig also validates its freetype2 Requires). libopus is NOT
#   probed; the opus crate's opusic-sys backend cmake-builds libopus 1.6.1.
# - hostEnv() (Linux host branch only): LIBCLANG_PATH points bindgen (libspa-sys)
#   at the versioned host libclang, and BINDGEN_EXTRA_CLANG_ARGS supplies the clang
#   resource dir (globbed so an LLVM bump needs no edit) since libclang in
#   /usr/lib64 looks beside itself for stdbool.h under /usr/lib/clang/<v>.
# - containerCargo(args): build the image when missing, then run cargo in podman.
# - runCargo(args): native off Linux, else host when hostOk, else container.
# Its imported bindings (execFileSync, globSync) are reused by inline follow-ups,
# so those must not reimport them.
cargo_dispatch = """
const { execFileSync } = await import('node:child_process')
const { globSync } = await import('node:fs')
const onPath = (command) => { try { execFileSync('which', [command], { stdio: 'ignore' }); return true } catch { return false } }
const pkgConfigOk = () => { try { execFileSync('pkg-config', ['--exists', 'libpipewire-0.3', 'fontconfig', 'freetype2'], { stdio: 'ignore' }); return true } catch { return false } }
const hostOk = onPath('cargo') && pkgConfigOk()
const hostEnv = () => {
  const clangDirs = globSync('/usr/lib/clang/*').sort()
  const resourceDir = clangDirs[clangDirs.length - 1]
  return { ...process.env, LIBCLANG_PATH: '/usr/lib64', BINDGEN_EXTRA_CLANG_ARGS: `-resource-dir=${resourceDir}` }
}
const containerCargo = (cargoArgs) => {
  let imageExists = true
  try { execFileSync('podman', ['image', 'exists', 'localhost/monochromatic/music-player'], { stdio: 'ignore' }) } catch { imageExists = false }
  if (!imageExists) { execFileSync('podman', ['build', '-t', 'localhost/monochromatic/music-player', '-f', 'Containerfile', '.'], { stdio: 'inherit' }) }
  // Forward SLINT_EMIT_DEBUG_INFO into the container ONLY when the caller set it
  // (the test + mcp tasks do). podman does not inherit host env, and the
  // ElementHandle / MCP introspection APIs refuse to run without this debug info.
  // Production build tasks never set it, so their container binaries stay lean.
  const debugInfoEnv = process.env.SLINT_EMIT_DEBUG_INFO ? ['-e', 'SLINT_EMIT_DEBUG_INFO=1'] : []
  execFileSync('podman', ['run', '--rm', '--security-opt', 'label=disable', ...debugInfoEnv, '-v', `${process.cwd()}:/work`, '-v', 'music-player-cargo:/cargo', '-w', '/work', 'localhost/monochromatic/music-player', 'cargo', ...cargoArgs], { stdio: 'inherit' })
}
const runCargo = (cargoArgs) => {
  if (process.platform !== 'linux') { execFileSync('cargo', cargoArgs, { stdio: 'inherit' }) }
  else if (hostOk) { execFileSync('cargo', cargoArgs, { stdio: 'inherit', env: hostEnv() }) }
  else { containerCargo(cargoArgs) }
}
"""

[tasks.image]
description = "Build the Fedora build/run container image"
run = "podman build -t localhost/monochromatic/music-player -f Containerfile ."

[tasks.build]
description = "Release build (macOS/Windows native, else Linux host if dev libs present, else container)"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
runCargo(['build', '--release'])
"""

[tasks."build:debug"]
description = "Debug build (macOS/Windows native, else Linux host if dev libs present, else container)"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
runCargo(['build'])
"""

[tasks.lint]
description = "cargo check, no codegen (macOS/Windows native, else Linux host if dev libs present, else container)"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
runCargo(['check'])
"""

[tasks."lint:clippy"]
description = "Run clippy with warnings denied (macOS/Windows native, else Linux host if dev libs present, else container)"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
runCargo(['clippy', '--release', '--', '-D', 'warnings'])
"""

[tasks."format:clippy"]
description = "Apply clippy's machine-applicable suggestions in place (host if dev libs present, else container)"
# --allow-no-vcs is harmless on the host (the repo .git is visible) and required
# in the container, where only the package dir is bind-mounted at /work so the
# repo-root .git is not visible and cargo fix would otherwise refuse to run.
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
runCargo(['clippy', '--fix', '--allow-dirty', '--allow-staged', '--allow-no-vcs'])
"""

[tasks."lint:rust"]
description = "Run monochromatic-rust-linter (max-lines + require-rustdoc) over this package's .rs"
# Runs on the HOST, not in the container: the linter is a separate crate with
# no pipewire/opus/clang deps, so it needs no container. .gitignore-aware
# walking skips target/ (including Slint's generated .rs).
run = "cargo run --quiet --manifest-path ../../linter/rust/Cargo.toml -- ."

[tasks.test]
description = "cargo nextest run (macOS/Windows native, else Linux host if dev libs present, else container)"
# The native (non-Linux) branch needs cargo-nextest on PATH (`cargo install
# cargo-nextest`, or `brew install cargo-nextest` on macOS); the tests are pure
# logic with no audio backend, so they run identically on macOS and Windows.
# SLINT_EMIT_DEBUG_INFO=1 makes slint-build embed element ids + source locations in
# the generated UI so src/ui_binding_tests.rs's ElementHandle locators work; the
# testing crate refuses to run without it. It is set here (not in [env]) so the
# size-optimized production build/run binaries stay free of the extra metadata.
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
process.env.SLINT_EMIT_DEBUG_INFO = '1'
runCargo(['nextest', 'run'])
"""

[tasks.mcp]
description = "Build --features slint/mcp (debug) and run HEADLESS with the embedded Slint MCP server on SLINT_MCP_PORT (default 9315) so an agent can drive/inspect the UI. Pass file/folder paths after --."
usage = '''
arg "[args]" var=#true help="File or folder paths to enqueue (loaded PAUSED)"
'''
# The embedded MCP server (Slint 1.17 `slint/mcp` feature, activated by
# SLINT_MCP_PORT) exposes get_element_tree / find_elements_by_id / take_screenshot
# / click_element / set_element_value etc. over MCP Streamable HTTP on
# 127.0.0.1:<port>/mcp. The repo-root .mcp.json points Claude at that URL, so a
# session runs THIS task first, then drives the running app through the MCP tools.
# - `mcp` is passed on the command line, NEVER added to Cargo.toml [features], so
#   the size-optimized production binary never carries the introspection server.
# - SLINT_EMIT_DEBUG_INFO=1 is required so element ids + source locations survive
#   into the compiled UI for find_elements_by_id / the element tree.
# - SLINT_BACKEND=headless renders real frames off-screen (software renderer, which
#   this crate already enables) so take_screenshot works with no window on your
#   desktop; override to empty (SLINT_BACKEND= ) to run on the live session, or run
#   nested under niri for a GPU render off your main workspace.
# The app loads PAUSED (no --start-playing), so nothing plays until an MCP client
# clicks the transport; drive volume down first if a test must exercise playback.
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
{{vars.parse_usage_args}}
const { mkdirSync } = await import('node:fs')
const { join } = await import('node:path')
process.env.SLINT_EMIT_DEBUG_INFO = '1'
process.env.SLINT_MCP_PORT = process.env.SLINT_MCP_PORT ?? '9315'
process.env.SLINT_BACKEND = process.env.SLINT_BACKEND ?? 'headless'
// Isolate this test instance's state under a gitignored throwaway (target/mcp-xdg)
// so it never grabs the real ~/.config/musicplayer cache lock held by an installed
// music-player, and never mutates the user's real session/cache (throwaway-fixture
// rule). directories/ProjectDirs honors these XDG vars.
const xdgRoot = join(process.cwd(), 'target', 'mcp-xdg')
for (const sub of ['config', 'cache', 'data']) { mkdirSync(join(xdgRoot, sub), { recursive: true }) }
process.env.XDG_CONFIG_HOME = join(xdgRoot, 'config')
process.env.XDG_CACHE_HOME = join(xdgRoot, 'cache')
process.env.XDG_DATA_HOME = join(xdgRoot, 'data')
runCargo(['build', '--features', 'slint/mcp'])
const extras = parseUsageArgs(process.env.usage_args ?? '')
const bin = process.platform === 'win32' ? './target/debug/music-player.exe' : './target/debug/music-player'
console.error(`music-player MCP server: http://127.0.0.1:${process.env.SLINT_MCP_PORT}/mcp (backend=${process.env.SLINT_BACKEND || 'default'})`)
execFileSync(bin, extras, { stdio: 'inherit' })
"""

[tasks."lint:slint"]
description = "Type-check ui/app.slint with slint-viewer --check (compiles the markup, opens no window, exits non-zero on error)"
# slint-viewer is the same 1.17 compiler family as slint-build, and
# SLINT_ENABLE_EXPERIMENTAL_FEATURES (from [env]) enables the FlexboxLayout builtin
# the UI uses, so this catches .slint markup errors fast without a full Rust build.
run = "slint-viewer --check ui/app.slint"

[tasks.screenshot]
description = "Render ui/app.slint to target/app.slint.png HEADLESS (slint-viewer --screenshot: default property values, no Rust backend, no window) for a quick static-layout snapshot"
# --screenshot installs slint-viewer's own offscreen platform; SLINT_BACKEND=software
# pins the software renderer for a deterministic frame. This renders the MARKUP with
# default property values only (no engine/model data); drive the running app via the
# `mcp` task's take_screenshot for real-data snapshots.
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { mkdirSync } = await import('node:fs')
mkdirSync('target', { recursive: true })
execFileSync('slint-viewer', ['--screenshot', 'target/app.slint.png', 'ui/app.slint'], { stdio: 'inherit', env: { ...process.env, SLINT_BACKEND: 'software' } })
console.error('rendered ui/app.slint -> target/app.slint.png')
"""

[tasks."build:container"]
description = "Release build forced inside the container (asserts the container path)"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
containerCargo(['build', '--release'])
"""

[tasks."lint:clippy:container"]
description = "clippy with warnings denied forced inside the container"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
containerCargo(['clippy', '--release', '--', '-D', 'warnings'])
"""

[tasks."test:container"]
description = "cargo nextest run forced inside the container"
# SLINT_EMIT_DEBUG_INFO=1 as in the host `test` task: the ElementHandle UI tests
