[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:client"]
extends = "build:js:client"

[tasks."build:css"]
description = "Build global CSS from h-css style modules"
run = "bun src/client/styles/build.ts"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:client"]
extends = "watch:build:js:client"

[tasks."watch:build:css"]
description = "Watch h-css style modules and rebuild global CSS on change"
# Initial build so global.css exists before the first file change;
# tsdown --watch does this automatically but mise watch does not.
# Glob includes styles/*.ts to catch reset.ts and theme.ts alongside *.styles.ts.
run = "mise run build:css; mise watch -w src/client -g '*.styles.ts' -g 'styles/*.ts' -r -- build:css"

[tasks."dev"]
description = "Start editord in watch mode (rebuilds client, restarts server)"
run = [{ tasks = ["watch:build:js:client", "watch:build:css", "dev:server"] }]

[tasks."dev:server"]
hide = true
description = "Start editord server with file-watch auto-restart"
# --no-meta: ignore metadata-only changes (touch, chmod) at the kernel level.
# -j @content-changed.jaq: compare file content hashes via kv_store so
#   same-content writes (e.g. format-on-save producing identical output,
#   or editing editord source files in editord itself) do not trigger restarts.
run = "mise watch -w src/server --no-meta -j @src/server/content-changed.jaq -r -- start:server"

[tasks."start:server"]
hide = true
description = "Start editord server (single run)"
run = "bun src/server/index.ts"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"
hide = true

[tasks."lint:oxlint"]
extends = "lint:oxlint"
