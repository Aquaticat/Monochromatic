<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>editord</title>
  <style>
    :root {
      --fg: #ccc;
      --bg: #000;
      --gutter-fg: #555;
      --tree-hover-bg: #1a1a1a;
      --tree-selected-bg: #2a2a2a;
      --editor-padding: 0.5rem;
      --hl-keyword: #c678dd;
      --hl-string: #98c379;
      --hl-comment: #5c6370;
      --hl-number: #d19a66;
      --hl-type: #e5c07b;
      --hl-function: #61afef;
      --hl-property: #e06c75;
      --hl-heading: #e5c07b;
      --hl-link: #61afef;
      --hl-emphasis: #d19a66;
    }
    :root[data-theme="light"] {
      --fg: #444;
      --bg: #fff;
      --gutter-fg: #aaa;
      --tree-hover-bg: #f0f0f0;
      --tree-selected-bg: #e0e0e0;
      --hl-keyword: #a626a4;
      --hl-string: #50a14f;
      --hl-comment: #a0a1a7;
      --hl-number: #986801;
      --hl-type: #c18401;
      --hl-function: #4078f2;
      --hl-property: #e45649;
      --hl-heading: #c18401;
      --hl-link: #4078f2;
      --hl-emphasis: #986801;
    }
    * {
      margin-block: 0;
      margin-inline: 0;
      padding-block: 0;
      padding-inline: 0;
      box-sizing: border-box;
    }
    html, body {
      block-size: 100%;
      inline-size: 100%;
      background-color: var(--bg);
      color: var(--fg);
      font-family: 'JetBrains Mono', monospace;
    }
    #app {
      display: flex;
      block-size: 100%;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/dist/client/app.js"></script>
</body>
</html>
