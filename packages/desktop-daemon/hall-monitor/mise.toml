# Generated by file-enforcer from mise-packages.config.ts; do not hand-edit.
# Build flavors derive from tsdown.{node,browser,client}.config.ts presence.
# Bespoke tasks (if any) live in mise-packages/<category>/<package>.toml.

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks.build]
description = "Compile hall-monitor to a standalone binary"
run = "bun build src/index.ts --compile --minify --bytecode --sourcemap --outfile hall-monitor"

[tasks.run]
description = "Run hall-monitor directly"
run = "node src/index.ts"

[tasks.'run:dev']
description = "Run hall-monitor with file-watch auto-restart"
run = "mise watch -w src -r -- node src/index.ts"
