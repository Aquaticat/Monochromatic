[task_config]
includes = [
  "../../../mise-shared/build-js.toml",
  "../../../mise-shared/build.toml",
  "../../../mise-shared/lint-types.toml",
  "../../../mise-shared/lint.toml",
  "../../../mise-shared/node.toml",
  "../../../mise-shared/oxlint.toml",
  "../../../mise-shared/test-unit.toml",
  "../../../mise-shared/watch-build.toml",
]

[tasks.run]
description = "Build container image and import as libvirt VM"
run = "node src/build-and-import.ts"

[tasks.import]
description = "Import already-built qcow2 into libvirt (skips build+convert)"
run = "node src/import.ts"

[tasks.push]
description = "Push image to GHCR and sign with cosign"
run = "node src/sign-and-push.ts"

[tasks.buildAndTest]
description = "Build the node bin (verification is the build + dts emit; the bin has no inert invocation to smoke-run)"
run = ["mise run build", "mise run test:unit"]
