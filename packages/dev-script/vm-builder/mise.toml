[tasks.run]
description = "Build container image and import as libvirt VM"
run = "bun src/build-and-import.ts"

[tasks.import]
description = "Import already-built qcow2 into libvirt (skips build+convert)"
run = "bun src/import.ts"

[tasks.push]
description = "Push image to GHCR and sign with cosign"
run = "bun src/sign-and-push.ts"

[tasks.build]
extends = "build"

[tasks.'build:js']
extends = "build:js"

[tasks.'build:js:node']
extends = "build:js:node"

[tasks.'watch:build']
extends = "watch:build"

[tasks.'watch:build:js']
extends = "watch:build:js"

[tasks.'watch:build:js:node']
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks.'lint:types']
extends = "lint:types"

[tasks.'lint:oxlint']
extends = "lint:oxlint"

[tasks.'test:unit']
extends = "test:unit"

[tasks.buildAndTest]
description = "Build the node bin (verification is the build + dts emit; the bin has no inert invocation to smoke-run)"
run = ["mise run build", "mise run test:unit"]
