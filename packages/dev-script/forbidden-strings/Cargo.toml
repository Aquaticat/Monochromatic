[package]
name = "forbidden-strings"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "forbidden-strings"
path = "src/main.rs"

[dependencies]
aho-corasick = "1"
ignore = "0.4"
memchr = "2"
rayon = "1"
regex = "1"
resharp = "0.5.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
