[task_config]
includes = [
  "../../../mise-shared/build-js.toml",
  "../../../mise-shared/build.toml",
  "../../../mise-shared/lint-types.toml",
  "../../../mise-shared/lint.toml",
  "../../../mise-shared/node.toml",
  "../../../mise-shared/oxlint.toml",
  "../../../mise-shared/test-unit.toml",
  "../../../mise-shared/watch-build.toml",
]

[tasks."test:container"]
description = "Run ensurePackage container tests across OS/user matrix"
run = "node src/package/mise.container-test.ts"

[tasks.fuzz]
description = "Run the property tests as a time-budgeted fuzz campaign under node"
usage = '''
flag "--budget <ms>" help="Per-property time budget in milliseconds (default 60000)"
'''
shell = "node -e"
run = """
const { execFileSync } = await import('node:child_process')
const { glob } = await import('node:fs/promises')
const budget = (process.env.usage_budget ?? '60000').trim()
const files = []
for await (const file of glob('src/**/*.property.unit.test.ts')) { files.push(file) }
console.log(`Fuzz campaign over ${files.length} property files at ${budget}ms each`)
for (const file of files) {
  console.log(`fuzzing ${file}`)
  execFileSync('node', [file], { stdio: 'inherit', env: { ...process.env, FILE_ENFORCER_FUZZ_BUDGET_MS: budget } })
}
"""

[tasks."test:mutation"]
description = "Run container-isolated Stryker mutation tests"
usage = 'arg "[args]" var=#true help="Optional mutation-test flags and package-relative source files"'
shell = "node -e"
run = """
{{vars.dispatch_workspace_node}}
const args = (process.env.usage_args ?? '').trim().split(' ').filter(Boolean)
runWorkspaceNode('packages/dev-script/mutation-test', 'index', ['--package', 'packages/dev-script/file-enforcer', ...args])
"""
