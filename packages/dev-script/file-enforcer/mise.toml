[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks.'lint:types']
extends = "lint:types"

[tasks.'test:unit']
extends = "test:unit"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."test:container"]
description = "Run ensurePackage container tests across OS/user matrix"
run = "bun src/package/mise.container-test.ts"

[tasks.fuzz]
description = "Run the property tests as a time-budgeted fuzz campaign under node"
usage = '''
flag "--budget <ms>" help="Per-property time budget in milliseconds (default 60000)"
'''
run = '''
let budget = ($env.usage_budget? | default "60000" | str trim)
let files = (glob src/**/*.property.unit.test.ts)
print $"Fuzz campaign over ($files | length) property files at ($budget)ms each"
$files | each {|file|
  print $"fuzzing ($file)"
  with-env { FILE_ENFORCER_FUZZ_BUDGET_MS: $budget } { ^node $file }
}
'''

[tasks."test:mutation"]
description = "Run container-isolated Stryker mutation tests"
usage = 'arg "[args]" var=#true help="Optional mutation-test flags and package-relative source files"'
run = '''
{{vars.monorepo_root_setup}}
{{vars.workspace_node_dispatch}}
let raw_args = ($env.usage_args? | default '' | str trim)
let args = if $raw_args == '' { [] } else { (nu -c $"echo ($raw_args)") | split row ' ' | where {|arg| $arg != '' } }
run_workspace_node $root packages/dev-script/mutation-test index --package packages/dev-script/file-enforcer ...$args
'''
