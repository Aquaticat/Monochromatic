[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks.'lint:types']
extends = "lint:types"

[tasks.'test:unit']
run = "glob '**/*.unit.test.ts' | par-each { |file| bun $file }"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."generate:index"]
description = "Generate packages.generated.ts from Repology data"
run = "bun src/package/mise.generate-index.ts"
