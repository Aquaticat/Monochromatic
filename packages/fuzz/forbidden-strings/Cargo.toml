[package]
name = "forbidden-strings-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[lints.clippy]
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"

[package.metadata]
cargo-fuzz = true

[dependencies]
# `anyhow` carries errors in the developer-only seed corpus helper binary.
anyhow = "1"
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
rayon = "1"
sha2 = "0.10"

[dependencies.forbidden-strings]
path = "../../cli/forbidden-strings"
features = ["fuzzing"]

# Use independent workspace for fuzzers
[workspace]
members = ["."]

# Library target hosting the shared structured generator used by
# every fuzz target via `use forbidden_strings_fuzz::generators::*;`.
# Cargo would auto-detect `src/lib.rs` even without this section; we
# spell it out so the rename / path-override surface is explicit.
[lib]
name = "forbidden_strings_fuzz"
path = "src/lib.rs"

# Inherit `panic = "unwind"` from the parent crate so libFuzzer can capture
# and minimize crashes via unwinding. The parent currently also uses `unwind`
# (load-bearing for the resharp-panic safety wrapper, see
# ../../cli/forbidden-strings/Cargo.toml:49-97),
# so these settings do not currently change the panic strategy. They are spelled
# out anyway so the fuzz harness keeps working if the parent's setting changes
# again — under `panic = "abort"`, panics would abort the process before
# libFuzzer gets a chance to record a reproducer.
[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"

[[bin]]
name = "fuzz_extract_gate_soundness"
path = "fuzz_targets/fuzz_extract_gate_soundness.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_ruleset_scan_invariants"
path = "fuzz_targets/fuzz_ruleset_scan_invariants.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_regex_engine_dispatch"
path = "fuzz_targets/fuzz_regex_engine_dispatch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_regex_syntax_walkers"
path = "fuzz_targets/fuzz_regex_syntax_walkers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_scan_format"
path = "fuzz_targets/fuzz_scan_format.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_residual_shards"
path = "fuzz_targets/fuzz_residual_shards.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_literal_roundtrip"
path = "fuzz_targets/fuzz_literal_roundtrip.rs"
test = false
doc = false
bench = false
