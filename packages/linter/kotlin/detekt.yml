# detekt configuration for the monorepo-wide require-kdoc run. Detekt's default rule
# sets stay active, and this file adds the repo custom require-kdoc rule set.
# File-level exclusions (build output, .kts scripts, test sources) are passed as
# global --excludes by the runner, which stops detekt parsing them at all.
require-kdoc:
  active: true
  # detekt 2 fails the run on error-severity findings, replacing build.maxIssues.
  severity: error
  RequireKDoc:
    active: true
    # Set true to let `override` members inherit documentation from the supertype.
    # Default false to require KDoc on every declaration, as require-tsdoc does.
    allowOverride: false
