[tasks.'perf:setup']
description = "Create performance benchmark fixture files in /tmp"
run = "bun packages/fixture/file-enforcer-perf/src/setup-fixture.ts"

[tasks.'perf:micro']
description = "Run micro-benchmarks of individual file-enforcer operations"
run = "bun packages/fixture/file-enforcer-perf/src/perf.bench.test.ts"

[tasks.'perf:e2e']
description = "Run end-to-end benchmarks with hyperfine on host"
run = "bun packages/fixture/file-enforcer-perf/src/run-e2e.ts"

[tasks.'perf:constrained']
description = "Run benchmarks under CPU contention (5 containers on 1 core, 1GB RAM)"
run = "bun packages/fixture/file-enforcer-perf/src/run-constrained.ts"

[tasks.'perf:teardown']
description = "Remove performance benchmark fixture files"
run = "rm -rf ($env.TMPDIR? | default '/tmp' | path join 'file-enforcer-perf')"

# lint:oxlint omitted -- see BUG-REPORT.oxlint-ignorePatterns-cwd.md

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"
