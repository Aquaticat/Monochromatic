[tasks.'perf:setup']
description = "Create performance benchmark fixture files in /tmp"
run = "bun src/setup-fixture.ts"

[tasks.'perf:micro']
description = "Run micro-benchmarks of individual file-enforcer operations (hardware counters appear once CAP_PERFMON is granted via perf:enable-counters)"
run = "bun src/perf.bench.test.ts"

[tasks.'perf:e2e']
description = "Run end-to-end benchmarks with hyperfine on host"
run = "bun src/run-e2e.ts"

[tasks.'perf:constrained']
description = "Run benchmarks under CPU contention (5 containers on 1 core, 1GB RAM)"
run = "bun src/run-constrained.ts"

[tasks.'perf:teardown']
description = "Remove performance benchmark fixture files"
shell = "node -e"
run = """
const { rmSync } = await import('node:fs')
const { join } = await import('node:path')
rmSync(join(process.env.TMPDIR ?? '/tmp', 'file-enforcer-perf'), { recursive: true, force: true })
"""

# CAP_PERFMON / setcap are Linux-only, so this task is intentionally non-portable.
[tasks.'perf:enable-counters']
description = "Grant CAP_PERFMON to the bun binary so mitata surfaces hardware counters in perf:micro (system-wide; re-run after a bun upgrade)"
shell = "node -e"
run = """
const { execFileSync } = await import('node:child_process')
const { realpathSync } = await import('node:fs')
const bun = realpathSync(execFileSync('which', ['bun'], { encoding: 'utf8' }).trim())
execFileSync('sudo', ['setcap', 'cap_perfmon+ep', bun], { stdio: 'inherit' })
execFileSync('getcap', [bun], { stdio: 'inherit' })
"""

[tasks.'perf:disable-counters']
description = "Remove the CAP_PERFMON file capability that perf:enable-counters granted to bun"
shell = "node -e"
run = """
const { execFileSync } = await import('node:child_process')
const { realpathSync } = await import('node:fs')
const bun = realpathSync(execFileSync('which', ['bun'], { encoding: 'utf8' }).trim())
execFileSync('sudo', ['setcap', '-r', bun], { stdio: 'inherit' })
console.log(`removed file capabilities from ${bun}`)
"""

# lint:oxlint omitted -- see docs/troubleshooting/oxlint.md

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"
