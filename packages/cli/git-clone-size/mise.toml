# Generated by file-enforcer from mise-packages.config.ts; do not hand-edit.
# Build flavors derive from tsdown.{node,browser,client}.config.ts presence.
# Boilerplate task bodies live in ../../../mise-shared/*.toml (generated from
# mise-packages.bodies.config.ts); bespoke tasks live in
# mise-packages/<category>/<package>.toml.

[task_config]
includes = [
  "../../../mise-shared/base.toml",
  "../../../mise-shared/node.toml",
  "../../../mise-shared/lint.toml",
  "../../../mise-shared/lint-types.toml",
  "../../../mise-shared/oxlint.toml",
  "../../../mise-shared/test-unit.toml",
]

[tasks.run]
description = "Run git-clone-size"
run = "node src/index.ts"

[tasks.'format:oxlint']
description = "Auto-fix this package with Oxlint (non-type-aware)"
shell = "node -e"
run = """
{{vars.dispatch_workspace_node}}
ensureOxlintConfig()
runWorkspaceNode('packages/dev-script/task-util', 'oxlint-wrapper', ['--fix'])
"""

[tasks.'format:dprint']
description = "Format this package's files with dprint"
run = "dprint fmt src"

[tasks.buildAndTest]
description = "Build the node bin, then run unit tests; cli.unit.test.ts spawns the built bin"
run = ["mise run build", "mise run test:unit"]
