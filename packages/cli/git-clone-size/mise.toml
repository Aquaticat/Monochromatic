[tasks.run]
description = "Run git-clone-size"
usage = 'arg "[args]" var=#true help="Remote URL or local path plus flags"'
shell = "node -e"
run = """
const { execFileSync } = await import('node:child_process')
const args = (process.env.usage_args ?? '').trim().split(' ').filter(Boolean)
execFileSync('bun', ['src/index.ts', ...args], { stdio: 'inherit' })
"""

[tasks.build]
extends = "build"

[tasks.'build:js']
extends = "build:js"

[tasks.'build:js:node']
extends = "build:js:node"

[tasks.'watch:build']
extends = "watch:build"

[tasks.'watch:build:js']
extends = "watch:build:js"

[tasks.'watch:build:js:node']
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks.'lint:types']
extends = "lint:types"

[tasks.'lint:oxlint']
extends = "lint:oxlint"

[tasks.'format:oxlint']
description = "Auto-fix this package with Oxlint (non-type-aware)"
shell = "node -e"
run = """
{{vars.dispatch_workspace_node}}
ensureOxlintConfig()
runWorkspaceNode('packages/dev-script/task-util', 'oxlint-wrapper', ['--fix'])
"""

[tasks.'format:dprint']
description = "Format this package's files with dprint"
run = "dprint fmt src"

[tasks.'test:unit']
extends = "test:unit"

[tasks.buildAndTest]
description = "Build the node bin, then run unit tests; cli.unit.test.ts spawns the built bin"
run = ["mise run build", "mise run test:unit"]
