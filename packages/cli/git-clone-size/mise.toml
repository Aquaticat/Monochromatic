# Generated by file-enforcer from mise-packages.config.ts; do not hand-edit.
# Build flavors derive from tsdown.{node,browser,client}.config.ts presence.
# Bespoke tasks (if any) live in mise-packages/<category>/<package>.toml.

[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."test:unit"]
extends = "test:unit"

[tasks.run]
description = "Run git-clone-size"
run = "node src/index.ts"

[tasks.'format:oxlint']
description = "Auto-fix this package with Oxlint (non-type-aware)"
shell = "node -e"
run = """
{{vars.dispatch_workspace_node}}
ensureOxlintConfig()
runWorkspaceNode('packages/dev-script/task-util', 'oxlint-wrapper', ['--fix'])
"""

[tasks.'format:dprint']
description = "Format this package's files with dprint"
run = "dprint fmt src"

[tasks.buildAndTest]
description = "Build the node bin, then run unit tests; cli.unit.test.ts spawns the built bin"
run = ["mise run build", "mise run test:unit"]
