[tasks.run]
description = "Run terminal-exec"
usage = 'arg "[args]" var=#true help="Command and arguments to execute in the terminal"'
shell = "node -e"
run = """
const { execFileSync } = await import('node:child_process')
const args = (process.env.usage_args ?? '').trim().split(' ').filter(Boolean)
execFileSync('bun', ['src/index.ts', ...args], { stdio: 'inherit' })
"""

[tasks.build]
extends = "build"

[tasks.'build:js']
extends = "build:js"

[tasks.'build:js:node']
extends = "build:js:node"

[tasks.'watch:build']
extends = "watch:build"

[tasks.'watch:build:js']
extends = "watch:build:js"

[tasks.'watch:build:js:node']
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks.'lint:types']
extends = "lint:types"

[tasks.'lint:oxlint']
extends = "lint:oxlint"

[tasks.'test:unit']
extends = "test:unit"

[tasks.buildAndTest]
description = "Build the node lib + bin, then run unit tests (the bin opens a terminal and is NOT executed by any test)"
run = ["mise run build", "mise run test:unit"]
