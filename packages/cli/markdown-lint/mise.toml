[tasks.run]
description = "Run the markdown-lint CLI"
usage = 'arg "[args]" var=#true help="File paths, globs, or flags (e.g. --fix)"'
shell = "node -e"
run = """
const { execFileSync } = await import('node:child_process')
const args = (process.env.usage_args ?? '').trim().split(' ').filter(Boolean)
execFileSync('node', ['src/cli.ts', ...args], { stdio: 'inherit' })
"""

[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"

[tasks.buildAndTest]
description = "Build the CLI, then run *.unit.test.ts"
run = ["mise run build", "mise run test:unit"]
