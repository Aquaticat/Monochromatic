[tasks.run]
description = "Run the markdown-lint CLI"
usage = 'arg "[args]" var=#true help="File paths, globs, or flags (e.g. --fix)"'
run = "bun src/cli.ts ...($env.usage_args? | default '' | split row ' ' | where {|part| $part != '' })"

[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"

[tasks.buildAndTest]
description = "Build the CLI, then run *.unit.test.ts"
run = ["mise run build", "mise run test:unit"]
