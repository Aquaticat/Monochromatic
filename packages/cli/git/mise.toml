[tasks.run]
description = "Run git wrapper CLI"
usage = 'arg "[args]" var=#true help="Git subcommand and arguments"'
shell = "node -e"
run = """
const { execFileSync } = await import('node:child_process')
const args = (process.env.usage_args ?? '').trim().split(' ').filter(Boolean)
execFileSync('node', ['src/index.ts', ...args], { stdio: 'inherit' })
"""

[tasks.build]
extends = "build"

[tasks.'build:js']
extends = "build:js"

[tasks.'build:js:node']
extends = "build:js:node"

[tasks.'watch:build']
extends = "watch:build"

[tasks.'watch:build:js']
extends = "watch:build:js"

[tasks.'watch:build:js:node']
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks.'lint:types']
extends = "lint:types"

[tasks.'lint:oxlint']
extends = "lint:oxlint"

[tasks.'test:unit']
extends = "test:unit"
