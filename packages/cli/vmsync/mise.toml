[tasks.run]
description = "Run vmsync CLI"
usage = 'arg "[args]" var=#true help="Subcommand and arguments"'
run = "bun src/index.ts ...($env.usage_args? | default '' | split row ' ' | where {|part| $part != '' })"

[tasks.'build:js:node']
extends = "build:js:node"

[tasks.lint]
extends = "lint"

[tasks.'lint:types']
extends = "lint:types"

[tasks.'lint:oxlint']
extends = "lint:oxlint"

[tasks.'test:unit']
run = "glob '**/*.unit.test.ts' | where { not ($in | str contains 'lifecycle') } | par-each { |file| bun $file }"

[tasks.'test:e2e']
description = "Run vmsync VM lifecycle tests (creates VMs, requires KVM)"
depends = ["build:js:node"]
run = "bun src/lifecycle.unit.test.ts"
