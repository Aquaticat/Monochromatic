[tasks.run]
description = "Run mvm CLI"
usage = 'arg "[args]" var=#true help="Subcommand and arguments"'
shell = "node -e"
run = """
const { execFileSync } = await import('node:child_process')
const args = (process.env.usage_args ?? '').trim().split(' ').filter(Boolean)
execFileSync('bun', ['src/cli.ts', ...args], { stdio: 'inherit' })
"""

[tasks.build]
extends = "build"

[tasks.'build:js']
extends = "build:js"

[tasks.'build:js:node']
extends = "build:js:node"

[tasks.'watch:build']
extends = "watch:build"

[tasks.'watch:build:js']
extends = "watch:build:js"

[tasks.'watch:build:js:node']
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks.'lint:types']
extends = "lint:types"

[tasks.'lint:oxlint']
extends = "lint:oxlint"

[tasks.'test:unit']
extends = "test:unit"

[tasks.buildAndTest]
description = "Build the node lib + bin, then run unit tests; cli.unit.test.ts spawns the built cli.mjs"
run = ["mise run build", "mise run test:unit"]

# Live, BILLED Hetzner provisioning test. Excluded from test:unit (the .expensive.
# marker); run deliberately. Auto-extracts HCLOUD_TOKEN from the tofu tfvars so
# you do not have to export it. Provisions and then destroys real, billed servers.
[tasks.'test:hetzner']
description = "Run the live, BILLED Hetzner provisioning test (token auto-read from packages/config/tofu/hetzner.auto.tfvars)"
run = '''
let tfvars = '../../config/tofu/hetzner.auto.tfvars'
let rows = (open --raw $tfvars | lines | parse --regex '^\s*hcloud_token\s*=\s*"(?<v>[^"]*)"')
if ($rows | is-empty) { error make { msg: $"hcloud_token not found in ($tfvars)" } }
with-env { HCLOUD_TOKEN: ($rows | get v | first) } { bun src/backends/hetzner/provision.expensive.unit.test.ts }
'''
