[package]
name = "forbidden-strings"
version = "0.1.2"
categories = ["command-line-utilities", "development-tools"]
edition = "2021"
homepage = "https://github.com/Aquaticat/Monochromatic/tree/main/packages/cli/forbidden-strings"
include = [
  "src/**/*.rs",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
]
keywords = ["security", "secrets", "scanner", "deny-list", "ci"]
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticat/Monochromatic.git"
description = "Out-of-band scanner for forbidden literal strings and regex patterns. Gitignore-aware, fast, dependency-light: built for CI deny-listing of leaked credentials and banned tokens."

[lib]
name = "forbidden_strings"
path = "src/lib.rs"

[[bin]]
name = "forbidden-strings"
path = "src/main.rs"

[features]
# What:     `fuzzing` Cargo feature. When enabled (`cargo build --features fuzzing`),
#           the crate exposes `mod fuzz_api`, a curated re-export bundle of
#           internal compile/extract/walker helpers used by `fuzz/fuzz_targets/*.rs`.
# Why:      Production consumers (the bin target, integration tests) build
#           with this feature off, so they see the same public surface as
#           before. Fuzz targets opt in by depending on
#           `forbidden-strings = { path = "..", features = ["fuzzing"] }`,
#           gaining access to the internal compile pipeline without
#           widening the production public API.
fuzzing = []

[dependencies]
aho-corasick = "1"
gix-hash = { version = "0.25", default-features = false, features = ["sha1", "sha256"] }
gix-index = { version = "0.51", default-features = false, features = ["sha1"] }
ignore = "0.4"
memchr = "2"
rayon = "1"
regex = "1"
resharp = "0.5.2"

# Why `panic = "unwind"` and `overflow-checks = true` instead of the smaller
# "abort" + default-off overflow checks:
#
# `src/rules/engine.rs` and `src/rules.rs` use `std::panic::catch_unwind`
# to intercept panics inside the resharp 0.5.x algebra / engine, which
# panics on a handful of fuzzer-discovered rule shapes:
#   - `attempt to add with overflow` inside resharp-algebra
#     `attempt_rw_concat_2` (compile path; `Regex::new` on shapes like
#     `(?u:...~(\_)...)` with nested constructs);
#   - `unexpected end 0 > 56` inside resharp `scan_fwd_all` (runtime
#     path; `find_all` on shapes like `(?:lookahead&lookbehind)`).
#
# Two profile settings are load-bearing here:
#
# 1. `panic = "unwind"`: `catch_unwind` only intercepts when the process
#    unwinds. Under `panic = "abort"` the process dies before the unwind
#    barrier runs, and the scanner -- a CI gate -- aborts instead of
#    surfacing the bad rule.
#
# 2. `overflow-checks = true`: the algebra panic is Rust's standard
#    checked-arithmetic panic from a `+` on `usize`. Cargo's default
#    release profile disables overflow checks for speed; without this
#    setting the `add` silently wraps, resharp builds the wrong DFA,
#    and the rule fails open (zero hits on content that should match).
#    That is the worst case for a secret scanner: a corrupt rule
#    silently passes CI. With this setting the wrap becomes a real
#    panic that catch_unwind can intercept and convert to "rule=N
#    engine error", which `scan.rs` already emits as a fail-closed
#    synthetic hit.
#
# See TROUBLESHOOTING.resharp.md for the full panic shapes and the
# pre-validator coverage in `src/rules.rs` / `src/rules/engine.rs`.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "unwind"
overflow-checks = true
strip = true
