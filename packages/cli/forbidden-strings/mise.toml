[tasks.build]
description = "Build the forbidden-strings binary in release mode"
run = "cargo build --release"

[tasks."build:debug"]
description = "Build the forbidden-strings binary in debug mode"
run = "cargo build"

[tasks."generate:rules"]
description = "Regenerate the root forbidden-strings.local.example.txt baseline from the vendored betterleaks config"
run = "node src/mise.port-betterleaks.ts"

[tasks.lint]
description = "cargo check (no codegen)"
run = "cargo check"

[tasks."lint:clippy"]
description = "Run clippy"
run = "cargo clippy --release -- -D warnings"

[tasks."format:clippy"]
description = "Apply clippy's machine-applicable suggestions in place"
run = "cargo clippy --fix --allow-dirty --allow-staged"

[tasks."lint:rust"]
description = "Run monochromatic-rust-linter (max-lines + require-rustdoc) over this package's .rs"
# The linter is a separate host crate with no system deps; run it over this
# package. .gitignore-aware walking skips target/.
run = "cargo run --quiet --manifest-path ../../linter/rust/Cargo.toml -- ."

[tasks.package]
description = "Build the crates.io package tarball"
run = "cargo package"

[tasks.publish]
description = "Fallback local publish. Canonical path is .github/workflows/cargo-publish.yml (OIDC Trusted Publishing + SLSA build provenance attestation); use this task only when CI cannot."
run = "cargo publish"

[tasks.test]
description = "cargo nextest run"
run = "cargo nextest run --release"

# Fuzzing moved to its own config root at packages/fuzz/forbidden-strings so a
# scoped nightly toolchain does not force this published crate onto nightly.
# Run targets via `mise run //packages/fuzz/forbidden-strings:build` etc.
