[tasks.build]
description = "Build the forbidden-strings binary in release mode"
run = "cargo build --release"

[tasks."build:debug"]
description = "Build the forbidden-strings binary in debug mode"
run = "cargo build"

[tasks."generate:rules"]
description = "Regenerate the root forbidden-strings.local.example.txt baseline from the vendored betterleaks config"
run = "bun src/mise.port-betterleaks.ts"

[tasks.lint]
description = "cargo check (no codegen)"
run = "cargo check"

[tasks."lint:clippy"]
description = "Run clippy"
run = "cargo clippy --release -- -D warnings"

[tasks.package]
description = "Build the crates.io package tarball"
run = "cargo package"

[tasks.publish]
description = "Publish the crate to crates.io"
run = "cargo publish"

[tasks.test]
description = "cargo test"
run = "cargo test --release"

[tasks."fuzz:list"]
description = "List all fuzz targets in fuzz/"
env.RUSTUP_TOOLCHAIN = "nightly"
run = "cargo fuzz list"

[tasks."fuzz:build"]
description = "Build all fuzz targets (nightly required)"
env.RUSTUP_TOOLCHAIN = "nightly"
# `--target x86_64-unknown-linux-gnu` is load-bearing: cargo-fuzz 0.13.1
# defaults to `x86_64-unknown-linux-musl` on Linux, but the ASAN flags it
# sets via RUSTFLAGS conflict with musl's static libc
# (`sanitizer is incompatible with statically linked libc, disable it
# using -C target-feature=-crt-static`). Forcing gnu picks a target where
# dynamic libc satisfies the sanitizer. macOS / Windows hosts cannot use
# this task as-written; would need a per-platform target switch.
run = "cargo fuzz build --target x86_64-unknown-linux-gnu"

[tasks."fuzz:smoke"]
description = "Run every fuzz target for 30s with the dictionary as a smoke test"
env.RUSTUP_TOOLCHAIN = "nightly"
# `--target x86_64-unknown-linux-gnu` rationale: see fuzz:build.
run = """
let targets = (cargo fuzz list | lines | where {|t| ($t | str trim) != "" })
for target in $targets {
  print $"--- ($target) ---"
  cargo fuzz run $target --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=2048 -dict=fuzz/dictionaries/forbidden-strings.dict
}
"""

[tasks."fuzz:run"]
description = "Run one fuzz target (pass the target name and libFuzzer args after --)"
env.RUSTUP_TOOLCHAIN = "nightly"
usage = """
arg "target" help="Fuzz target name (e.g. fuzz_extract_gate_soundness)"
arg "[args]" var=#true help="Extra libFuzzer args to pass through"
"""
# `--target x86_64-unknown-linux-gnu` rationale: see fuzz:build.
#
# `usage_args` arrives shell-quoted: mise/usage formats the variadic
# `[args]` collection as `'-flag1=v1' '-flag2=v2'` so a downstream shell
# can re-split safely. Nushell's `split row ' '` splits on every space
# and keeps the surrounding quotes as part of each element, so cargo
# then forwards them to libfuzzer as `'-max_total_time=10'` (literal
# quote chars). libfuzzer treats anything not starting with `-` as a
# corpus directory, so the run fails with
# "The required directory '-max_total_time=10' does not exist".
#
# Fix: split on the inter-arg separator `"' '"` (quote space quote)
# and then trim the lone outer quotes off the first and last elements.
# Limitation: libfuzzer flags must not contain literal single quotes;
# they never do in practice (numbers and flag names only).
run = """
let target = $env.usage_target
let extras = (
  $env.usage_args?
  | default ''
  | str trim
  | split row "' '"
  | each {|p| $p | str trim --char "'" }
  | where {|p| $p != '' }
)
cargo fuzz run $target --target x86_64-unknown-linux-gnu -- -dict=fuzz/dictionaries/forbidden-strings.dict ...$extras
"""

[tasks."fuzz:seed"]
description = "Regenerate the curated corpus from rules/<area>_tests.rs"
env.RUSTUP_TOOLCHAIN = "nightly"
run = "cd fuzz; cargo run --release --bin seed-from-tests"
