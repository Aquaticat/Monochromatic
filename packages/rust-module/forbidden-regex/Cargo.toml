[package]
name = "forbidden-regex"
version = "0.1.0"
categories = ["text-processing", "development-tools"]
edition = "2024"
homepage = "https://github.com/Aquaticat/Monochromatic/tree/main/packages/rust-module/forbidden-regex"
include = [
  "src/**/*.rs",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
]
keywords = ["regex", "derivative", "dfa", "intersection", "complement"]
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticat/Monochromatic.git"
description = "Restricted Brzozowski-derivative regex engine compiled to a serializable byte-class DFA. Supports intersection (&) and complement (~), matches a single line as bytes, and combines a whole ruleset into one RegexSet pass. Built for the forbidden-strings secret scanner."

[lib]
name = "forbidden_regex"
path = "src/lib.rs"

[dependencies]
# `serde` derives the (de)serialization for the compiled `Dfa`/`Regex`/`RegexSet`
# so a built automaton can be persisted and reloaded. Derive feature lets the DFA
# structs declare `#[derive(Serialize, Deserialize)]` instead of hand-written impls.
serde = { version = "1", features = ["derive"] }

# `bincode` 1.3 is a pure-serde, dependency-light binary codec (its only dep is
# serde). It encodes the compiled DFA to bytes and decodes it back. 1.x is chosen
# over 2.x because 2.x adds its own `Encode`/`Decode` derive layer this crate does
# not need; the plain `bincode::serialize`/`deserialize` serde path is enough.
bincode = "1"

# Why `panic = "unwind"` + `overflow-checks = true` here, mirroring the
# forbidden-strings scanner this engine serves:
#
# 1. `overflow-checks = true`: the DFA builder does index and counter arithmetic
#    (state ids, byte-class indices, repetition desugaring counts). A silent wrap
#    would build the WRONG automaton and the engine would fail OPEN (a secret
#    scanner that misses a leak), the worst failure for this use. With checks on,
#    a wrap becomes a real panic at the arithmetic site instead of a corrupt DFA.
#
# 2. `panic = "unwind"`: keeps a panicking compile recoverable by a caller's
#    `catch_unwind` boundary (the scanner uses one), rather than aborting the CI
#    process. `compile`/`new` themselves return `Result` and aim never to panic;
#    this is defense-in-depth for unknown shapes during the build phase.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "unwind"
overflow-checks = true
strip = true
