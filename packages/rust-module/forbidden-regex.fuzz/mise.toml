# No [tools] here: the Rust toolchain (nightly + rust-src + llvm-tools-preview) is
# managed repo-wide in the root mise.no-env.toml [tools], so every crate shares one
# channel. mise still applies that toolchain to tasks run here; cargo-fuzz needs the
# nightly it provides.

[tasks.list]
description = "List all fuzz targets"
run = "cargo fuzz list --fuzz-dir ."

[tasks.build]
description = "Build all fuzz targets (AddressSanitizer instrumented)"
# `--target x86_64-unknown-linux-gnu` is load-bearing: cargo-fuzz defaults to
# `x86_64-unknown-linux-musl` on Linux, but the ASAN flags it sets via RUSTFLAGS
# conflict with musl's static libc. Forcing gnu picks a target where dynamic libc
# satisfies the sanitizer. macOS / Windows hosts would need a per-platform switch.
#
# `--sanitizer address` is explicit even though it is the default: it pins
# AddressSanitizer (heap/stack overflow, use-after-free) so a future cargo-fuzz default
# change cannot silently drop it. A Rust panic is a logic abort, not a memory error, so
# libFuzzer (not ASAN) reports it.
run = "cargo fuzz build --fuzz-dir . --sanitizer address --target x86_64-unknown-linux-gnu"

[tasks.smoke]
description = "Run every fuzz target for 30s as a smoke test (AddressSanitizer instrumented)"
# `--target x86_64-unknown-linux-gnu` and `--sanitizer address` rationale: see build.
shell = "node -e"
run = """
const { execFileSync } = await import('node:child_process')
const targets = execFileSync('cargo', ['fuzz', 'list', '--fuzz-dir', '.'], { encoding: 'utf8' }).split('\\n').map((line) => line.trim()).filter(Boolean)
for (const target of targets) {
  console.log(`--- ${target} ---`)
  execFileSync('cargo', ['fuzz', 'run', '--fuzz-dir', '.', target, '--sanitizer', 'address', '--target', 'x86_64-unknown-linux-gnu', '--', '-max_total_time=30', '-rss_limit_mb=2048'], { stdio: 'inherit' })
}
"""

[tasks.run]
description = "Run or replay one fuzz target. Pass libFuzzer flags (e.g. -max_total_time=30) and/or input paths after --."
usage = """
arg "target" help="Fuzz target name (e.g. fuzz_compile)"
arg "[args]" var=#true help="libFuzzer flags (-flag=v) and/or input paths to replay (artifacts/<target>/crash-...)"
"""
# `--target x86_64-unknown-linux-gnu` rationale: see build. Inputs (crash artifacts or
# corpus dirs) go BEFORE `--` (cargo-fuzz CORPUS slot, suppressing the default corpus);
# libFuzzer flags go AFTER `--`. With no input the command fuzzes the default corpus.
shell = "node -e"
run = """
{{vars.parse_usage_args}}
const { execFileSync } = await import('node:child_process')
const target = process.env.usage_target
const extras = parseUsageArgs(process.env.usage_args ?? '')
const flags = extras.filter((part) => part.startsWith('-'))
const inputs = extras.filter((part) => !part.startsWith('-'))
execFileSync('cargo', ['fuzz', 'run', '--fuzz-dir', '.', target, '--sanitizer', 'address', '--target', 'x86_64-unknown-linux-gnu', ...inputs, '--', ...flags], { stdio: 'inherit' })
"""
