# Inference canary: periodic LLM probe runner + static dashboard viewer.
#
# Coolify: add as a Docker Compose resource; set INFERENCE_VALIDATION_OPENROUTER_API_KEY
#          in the Coolify UI environment variables panel.
#
# Standalone:
#   INFERENCE_VALIDATION_OPENROUTER_API_KEY=sk-or-... docker compose up -d --build
#
# The container runs the canary probes on startup, builds the viewer dashboard,
# serves it on the configured port, then re-runs probes every CANARY_INTERVAL_SECONDS.
#
# Add a .dockerignore at the monorepo root to speed up builds:
#   node_modules
#   .git
#   **/dist
#   **/*.jsonl

services:
  canary:
    build:
      # Coolify sets --project-directory to the repo root, so context
      # must be relative to repo root (not the compose file location).
      context: .
      dockerfile: Dockerfile.canary
    privileged: true
    cgroup: host
    volumes:
    - canary-artifacts:/app/packages/dev-script/inference-canary/src/canary-lint
    - podman-storage:/var/lib/containers
    ports:
    - '127.0.0.1:${CANARY_PORT:-1021}:3000'
    environment:
      INFERENCE_VALIDATION_OPENROUTER_API_KEY: '${INFERENCE_VALIDATION_OPENROUTER_API_KEY:?}'
      CANARY_INTERVAL_SECONDS: '${CANARY_INTERVAL_SECONDS:-10800}'
    healthcheck:
      test: ['CMD', 'bun', '-e', "await fetch('http://0.0.0.0:3000')"]
      start_period: 120s
      interval: 30s
    restart: unless-stopped
    command:
    - sh
    - -c
    - |
        # Initial canary run (tolerate failure on first deploy with no cached data)
        bun packages/dev-script/inference-canary/src/codegen/perf-test-data/mise.generate-css-mixin-perf.ts
        bun packages/dev-script/inference-canary/src/codegen/perf-test-data/mise.generate-csv-perf.ts
        bun packages/dev-script/inference-canary/src/codegen/perf-test-data/mise.generate-expr-perf.ts

        bun packages/dev-script/inference-canary/src/index.ts --retest-all || true
        bun packages/dev-script/inference-canary-viewer/src/build.ts || true

        # Serve dashboard on 0.0.0.0 so Docker port mapping works
        # (bun's built-in static server binds to ::1 by default)
        DIST=packages/dev-script/inference-canary-viewer/dist/final
        bun -e "Bun.serve({port:3000,hostname:'0.0.0.0',fetch(r){const p=new URL(r.url).pathname.replace(/^\/$/,'index.html');return new Response(Bun.file('$$DIST/'+p))}})" &
        SERVE_PID=$$!
        trap 'kill $$SERVE_PID 2>/dev/null; exit 0' TERM INT

        # Re-run canary probes on a fixed interval
        while sleep "$$CANARY_INTERVAL_SECONDS"; do
          bun packages/dev-script/inference-canary/src/index.ts || true
          bun packages/dev-script/inference-canary-viewer/src/build.ts || true
        done

volumes:
  canary-artifacts:
  podman-storage:
