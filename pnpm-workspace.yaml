catalogs:
  # Classic TypeScript 6 compiler that re-exports the legacy programmatic compiler
  # API (dropped from typescript@7 until 7.1). Consumed only by tooling that imports
  # the `typescript` module, e.g. @stryker-mutator/typescript-checker. Binary: tsc6.
  classic:
    'typescript': 'npm:@typescript/typescript6@^6.0.0'
childConcurrency: 16
dedupeDirectDeps: true
hoist: false
hoistWorkspacePackages: false
linkWorkspacePackages: true
managePackageManagerVersions: false
minimumReleaseAgeExclude:
  # First-party @earendil-works/pi-* packages are exempted from the
  # minimumReleaseAge gate by bare name (every version). pnpm's version-policy
  # matcher (evaluateVersionPolicy) returns the first rule whose name matches,
  # so listing one `name@version` entry per release only ever honored the first
  # (oldest) version and let each newer release fail lockfile verification. A
  # bare name parses to an empty version set, which the matcher treats as "all
  # versions", and it ends the per-release churn this list used to accumulate.
  - '@earendil-works/pi-agent-core'
  - '@earendil-works/pi-ai'
  - '@earendil-works/pi-coding-agent'
  - '@earendil-works/pi-tui'
  - '@oxlint/binding-android-arm-eabi@1.67.0'
  - '@oxlint/binding-android-arm64@1.67.0'
  - '@oxlint/binding-darwin-arm64@1.67.0'
  - '@oxlint/binding-darwin-x64@1.67.0'
  - '@oxlint/binding-freebsd-x64@1.67.0'
  - '@oxlint/binding-linux-arm-gnueabihf@1.67.0'
  - '@oxlint/binding-linux-arm-musleabihf@1.67.0'
  - '@oxlint/binding-linux-arm64-gnu@1.67.0'
  - '@oxlint/binding-linux-arm64-musl@1.67.0'
  - '@oxlint/binding-linux-ppc64-gnu@1.67.0'
  - '@oxlint/binding-linux-riscv64-gnu@1.67.0'
  - '@oxlint/binding-linux-riscv64-musl@1.67.0'
  - '@oxlint/binding-linux-s390x-gnu@1.67.0'
  - '@oxlint/binding-linux-x64-gnu@1.67.0'
  - '@oxlint/binding-linux-x64-musl@1.67.0'
  - '@oxlint/binding-openharmony-arm64@1.67.0'
  - '@oxlint/binding-win32-arm64-msvc@1.67.0'
  - '@oxlint/binding-win32-ia32-msvc@1.67.0'
  - '@oxlint/binding-win32-x64-msvc@1.67.0'
