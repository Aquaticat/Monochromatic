name: Release access transfer probe

on:
  push:
    branches: [trial/depot-20261015]
    paths: [.github/workflows/release-access-probe.yml]
  workflow_dispatch:

permissions:
  contents: read
  attestations: read
  actions: read
  checks: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MISE_AUTO_INSTALL: 'false'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        # Keep discovery consistent with the verified trial runtime.
        version: 2026.10.9
        install: false
        cache: false
    - run: mise install node
    - name: Check GraphQL analysis history with the workflow token
      env:
        GH_TOKEN: ${{ github.token }}
      run: mise run //package/cli/forbidden-strings:inspect:analysis-history
