name: Depot trial Alpine behavior checks

on:
  push:
    branches: [trial/depot-20261015]
    paths: [.github/workflows/depot-trial-alpine-checks.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpine:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 60
    env:
      MISE_AUTO_INSTALL: 'false'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        minimum_release_age: 1d
        install: false
        cache: false
    - name: Install the task runtime
      run: mise install node
    - name: Run the existing bounded Alpine unit and graphical audio smoke task
      run: mise run //package/music-player/desktop-app:test:alpine
