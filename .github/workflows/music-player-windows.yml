name: Research complete Linux coverage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-complete-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  libraries:
    name: Frozen libraries ${{ matrix.shard }}
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [a, b]
    env:
      COVERAGE_SOURCE: e02be6c8b8fe9efb41a7f8f1a0b311c17796588a
      COVERAGE_SHARD: ${{ matrix.shard }}
      MISE_AUTO_INSTALL: 'false'
      MISE_JOBS: '2'
      NODE_OPTIONS: --max-old-space-size=2048
      OXLINT_THREADS: '2'
      CI: 'true'
    steps:
    - name: Checkout immutable application source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: e02be6c8b8fe9efb41a7f8f1a0b311c17796588a
        persist-credentials: false

    - name: Initialize source-bound receipt before setup
      shell: node {0}
      run: |
        const { mkdirSync, writeFileSync, readFileSync } = require('node:fs');
        const { execFileSync } = require('node:child_process');
        const { cpus, totalmem, arch, platform } = require('node:os');
        const path = process.env.RUNNER_TEMP + '/coverage-' + process.env.COVERAGE_SHARD;
        mkdirSync(path, { recursive: true });
        const source = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
        if (source !== process.env.COVERAGE_SOURCE) throw new Error('Application checkout differs from frozen source');
        const metadata = {
          source, workflowCommit: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID,
          attempt: process.env.GITHUB_RUN_ATTEMPT, shard: process.env.COVERAGE_SHARD,
          runner: process.env.RUNNER_NAME, platform: platform(), arch: arch(),
          cpuCount: cpus().length, memoryBytes: totalmem(),
          osRelease: readFileSync('/etc/os-release', 'utf8'),
          startedAt: new Date().toISOString(), state: 'setup_pending',
          limits: { taskMilliseconds: 90000, campaignMilliseconds: 540000, jobMinutes: 15 },
        };
        writeFileSync(path + '/source.json', JSON.stringify(metadata, null, 2));

    - name: Set up frozen Mise parser without global tool installation
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        # Match the parser used to capture the frozen task inventory.
        version: 2026.10.0
        install: false

    - name: Install only Node and pnpm
      timeout-minutes: 3
      run: mise install --locked node pnpm

    - name: Install immutable dependencies without the prepare umbrella
      timeout-minutes: 4
      run: mise exec node pnpm -- pnpm install --frozen-lockfile

    - name: Write disposable owning research tasks
      shell: node {0}
      run: |
        const { mkdirSync, writeFileSync } = require('node:fs');
        async function consumeArtifact() {
          const { cp, mkdtemp, readFile, readdir, writeFile } = await import('node:fs/promises');
          const { join } = await import('node:path');
          const { pathToFileURL } = await import('node:url');
          const { strict: assert } = await import('node:assert');
          const root = process.env.MISE_MONOREPO_ROOT;
          const packagePath = process.env.COVERAGE_PACKAGE;
          if (!root || !/^package\/module\/[a-z-]+$/.test(packagePath ?? '')) throw new Error('Invalid artifact consumer package');
          const pkg = JSON.parse(await readFile(join(root, packagePath, 'package.json'), 'utf8'));
          const fixture = await mkdtemp(join(process.env.RUNNER_TEMP, 'artifact-consumer-'));
          await cp(join(root, packagePath, 'dist'), join(fixture, 'dist'), { recursive: true });
          await writeFile(join(fixture, 'package.json'), JSON.stringify(pkg));
          const mainExport = pkg.exports?.['.'];
          const entry = typeof mainExport === 'string' ? mainExport : mainExport?.default ?? pkg.module ?? pkg.main;
          if (!entry) throw new Error('No default artifact export for ' + packagePath);
          process.chdir(fixture);
          const mod = await import(pathToFileURL(join(fixture, entry)).href);
          assert.ok(Object.keys(mod).length > 0, 'Built module must expose runtime exports');
          const assertions = ['isolated_dist_import', 'nonempty_runtime_exports'];
          if (packagePath.endsWith('/array-at')) {
            assert.equal(mod.arrayAt({ array: [10, 20], index: -1 }), 20);
            assert.throws(() => mod.arrayAt({ array: [], index: 0 }), mod.ArrayAtError);
            assertions.push('negative_index', 'empty_array_rejection');
          }
          if (packagePath.endsWith('/function-arity')) {
            assert.deepEqual(['10', '10'].map(mod.unary(Number.parseInt)), [10, 10]);
            assertions.push('callback_arity');
          }
          if (packagePath.endsWith('/caught-value')) {
            assert.equal(mod.caughtValueText(new Error('offline')), 'offline');
            assert.equal(mod.caughtValueText(404), '404');
            assertions.push('error_message', 'primitive_conversion');
          }
          console.log(JSON.stringify({ packagePath, entry, assertions, fixtureOutsideWorkspace: !fixture.startsWith(root + '/') }));
        }
        async function campaign() {
          const { spawn, execFileSync } = await import('node:child_process');
          const { once } = await import('node:events');
          const { openSync, closeSync, readFileSync, writeFileSync, existsSync, cpSync, readdirSync, mkdirSync } = await import('node:fs');
          const { join } = await import('node:path');
          const { createHash } = await import('node:crypto');
          const root = process.env.MISE_MONOREPO_ROOT;
          const shard = process.env.COVERAGE_SHARD;
          const receipt = join(process.env.RUNNER_TEMP, 'coverage-' + shard);
          const groups = {
            a: ['array-at', 'async-time', 'const', 'pipe', 'or-throw', 'pnpm-workspace-catalog'],
            b: ['fs-id', 'fs-path', 'zip-writer', 'numeric-format', 'function-arity', 'caught-value'],
          };
          const packages = groups[shard];
          if (!packages) throw new Error('Unknown fixed coverage shard');
          const commands = [{ task: '//package/config/oxlint:build:js:node', packagePath: 'package/config/oxlint', kind: 'shared_static_prerequisite' }];
          for (const name of packages) {
            const packagePath = 'package/module/' + name;
            for (const kind of ['build', 'lint:types', 'lint:oxlint', 'test:unit']) {
              commands.push({ task: '//' + packagePath + ':' + kind, packagePath, kind });
            }
            commands.push({ task: '//package/dev-script/coverage-research:test:artifact-consumer', packagePath, kind: 'artifact_consumer' });
          }
          const sourceReceipt = JSON.parse(readFileSync(join(receipt, 'source.json'), 'utf8'));
          const deadline = Math.min(Date.now() + 540000, Date.parse(sourceReceipt.startedAt) + 780000);
          const manifest = { source: process.env.COVERAGE_SOURCE, workflowCommit: process.env.GITHUB_SHA, shard, profile: 'linux-libraries-pilot', commands, outcomes: [] };
          const save = () => writeFileSync(join(receipt, 'campaign.json'), JSON.stringify(manifest, null, 2));
          manifest.toolVersions = Object.fromEntries([['mise', ['--version']], ['node', ['--version']], ['pnpm', ['--version']]].map(([tool, args]) => [tool, execFileSync(tool, args, { cwd: root, encoding: 'utf8' }).trim()]));
          save();
          for (const [index, command] of commands.entries()) {
            const remaining = deadline - Date.now();
            if (remaining < 20000) {
              manifest.outcomes.push({ ...command, state: 'not_started_campaign_budget' });
              save();
              continue;
            }
            const logName = String(index).padStart(3, '0') + '.log';
            const logPath = join(receipt, logName);
            const fd = openSync(logPath, 'w');
            const started = Date.now();
            const outcome = { ...command, log: logName, startedAt: new Date(started).toISOString(), state: 'running' };
            manifest.outcomes.push(outcome);
            save();
            const proc = spawn('mise', ['run', command.task], { cwd: root, env: { ...process.env, COVERAGE_PACKAGE: command.packagePath }, detached: true, stdio: ['ignore', fd, fd] });
            let timedOut = false;
            let killTimer;
            const stopGroup = signal => {
              try { process.kill(-proc.pid, signal); }
              catch (error) { if (error.code !== 'ESRCH') throw error; }
            };
            const timer = setTimeout(() => {
              timedOut = true;
              stopGroup('SIGTERM');
              killTimer = setTimeout(() => stopGroup('SIGKILL'), 3000);
            }, Math.min(90000, remaining - 10000));
            try {
              const [code, signal] = await once(proc, 'close');
              outcome.exitCode = code;
              outcome.signal = signal;
              outcome.state = timedOut ? 'task_budget_exhausted' : code === 0 ? 'command_succeeded' : 'command_failed_requires_classification';
            } catch (error) {
              outcome.state = 'harness_spawn_failed';
              outcome.error = String(error);
            } finally {
              clearTimeout(timer);
              clearTimeout(killTimer);
              closeSync(fd);
            }
            outcome.durationMilliseconds = Date.now() - started;
            const log = readFileSync(logPath);
            outcome.logSha256 = createHash('sha256').update(log).digest('hex');
            outcome.logBytes = log.length;
            outcome.discovery = { basis: 'tracked_test_file_candidates_not_runtime_case_counts', files: execFileSync('git', ['ls-files', '--', command.packagePath], { cwd: root, encoding: 'utf8' }).trim().split('\n').filter(path => path.endsWith('.unit.test.ts') && !path.includes('.expensive.')) };
            save();
            console.log(command.task + ' ' + outcome.state + ' ' + outcome.durationMilliseconds + 'ms');
          }
          manifest.completedAt = new Date().toISOString();
          manifest.artifactFiles = [];
          for (const name of packages) {
            const dist = join(root, 'package/module', name, 'dist');
            if (!existsSync(dist)) continue;
            const destination = join(receipt, 'artifacts', name, 'dist');
            mkdirSync(join(receipt, 'artifacts', name), { recursive: true });
            cpSync(dist, destination, { recursive: true });
            cpSync(join(root, 'package/module', name, 'package.json'), join(receipt, 'artifacts', name, 'package.json'));
            const pending = [destination];
            while (pending.length) {
              const dir = pending.pop();
              for (const entry of readdirSync(dir, { withFileTypes: true })) {
                const path = join(dir, entry.name);
                if (entry.isDirectory()) pending.push(path);
                else if (entry.isFile()) {
                  const bytes = readFileSync(path);
                  manifest.artifactFiles.push({ path: path.slice(receipt.length + 1), bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') });
                }
              }
            }
          }
          manifest.changedTrackedFiles = execFileSync('git', ['diff', '--name-only'], { cwd: root, encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          save();
          if (manifest.outcomes.some(outcome => outcome.state !== 'command_succeeded')) throw new Error('Frozen coverage commands did not all succeed; inspect source-bound receipts');
        }
        const dir = 'package/dev-script/coverage-research';
        mkdirSync(dir, { recursive: true });
        const task = (name, fn) => '[tasks.' + JSON.stringify(name) + ']\nshell = "node --input-type=module-typescript -e"\nrun = ' + JSON.stringify('await (' + fn.toString() + ')()') + '\n';
        writeFileSync(dir + '/mise.toml', task('campaign', campaign) + '\n' + task('test:artifact-consumer', consumeArtifact));

    - name: Execute owning frozen tasks with bounded command budgets
      run: mise run //package/dev-script/coverage-research:campaign

    - name: Preserve source-bound receipts and task logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: frozen-linux-coverage-${{ matrix.shard }}-${{ github.run_id }}
        path: ${{ runner.temp }}/coverage-${{ matrix.shard }}
        if-no-files-found: error
        retention-days: 14
