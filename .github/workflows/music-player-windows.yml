":\"package/module/test-sandbox\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/throws:build\",\"packagePath\":\"package/module/throws\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/token-count:build\",\"packagePath\":\"package/module/token-count\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/toml-edit:build\",\"packagePath\":\"package/module/toml-edit\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/wg-allowedips:build\",\"packagePath\":\"package/module/wg-allowedips\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/zip-writer:build\",\"packagePath\":\"package/module/zip-writer\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/agent-harness-shared/current-time-context:build\",\"packagePath\":\"package/agent-harness-shared/current-time-context\",\"kind\":\"reviewed_node_build\"},{\"task\":\"//package/agent-harness-shared/terminal-title:build\",\"packagePath\":\"package/agent-harness-shared/terminal-title\",\"kind\":\"reviewed_node_build\"},{\"task\":\"//package/build-tool/css:build\",\"packagePath\":\"package/build-tool/css\",\"kind\":\"reviewed_node_build\"},{\"task\":\"//package/claude-code-plugin/guardrail:build\",\"packagePath\":\"package/claude-code-plugin/guardrail\",\"kind\":\"reviewed_node_build\"},{\"task\":\"//package/cli/android-exempt-unused:build\",\"packagePath\":\"package/cli/android-exempt-unused\",\"kind\":\"reviewed_node_build\"},{\"task\":\"//package/cli/terminal-exec:build\",\"packagePath\":\"package/cli/terminal-exec\",\"kind\":\"reviewed_node_build\"},{\"task\":\"//package/cli/wg-quicker:build\",\"packagePath\":\"package/cli/wg-quicker\",\"kind\":\"reviewed_node_build\"},{\"task\":\"//package/desktop-app/electron-infra:build\",\"packagePath\":\"package/desktop-app/electron-infra\",\"kind\":\"reviewed_node_build\"},{\"task\":\"//package/dev-script/vm-builder:build\",\"packagePath\":\"package/dev-script/vm-builder\",\"kind\":\"reviewed_node_build\"},{\"tas