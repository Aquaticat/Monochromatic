name: Depot pool routing research
run-name: routing-${{ inputs.pool }}-negative-${{ inputs.fail_pool }}-hold-${{ inputs.hold_seconds }}
on:
  workflow_dispatch:
    inputs:
      pool:
        type: choice
        options:
          - compare
          - github
          - depot
        default: compare
        required: true
      fail_pool:
        type: choice
        options:
          - none
          - depot
        default: none
        required: true
      hold_seconds:
        type: choice
        options:
          - "0"
          - "90"
        default: "0"
        required: true
permissions:
  contents: read
concurrency:
  group: routing-research-${{ github.ref }}-${{ inputs.pool }}-${{ inputs.fail_pool }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      pools: ${{ steps.plan.outputs.pools }}
    steps:
      - name: Select only allowlisted pools and labels
        id: plan
        shell: node {0}
        env:
          REQUESTED_POOL: ${{ inputs.pool }}
          FAIL_POOL: ${{ inputs.fail_pool }}
        run: |
          const { appendFileSync } = require('node:fs');
          const { strict: assert } = require('node:assert');
          const rows = [
            { pool: 'github', runner: 'ubuntu-24.04' },
            { pool: 'depot', runner: 'depot-ubuntu-24.04-4' },
          ];
          assert(['compare', 'github', 'depot'].includes(process.env.REQUESTED_POOL));
          assert(['none', 'depot'].includes(process.env.FAIL_POOL));
          const include = process.env.REQUESTED_POOL === 'compare'
            ? rows
            : rows.filter(row => row.pool === process.env.REQUESTED_POOL);
          assert(include.length > 0);
          const pools = include.map(row => row.pool);
          assert(process.env.FAIL_POOL === 'none' || pools.includes(process.env.FAIL_POOL));
          appendFileSync(process.env.GITHUB_OUTPUT,
            'matrix=' + JSON.stringify({ include }) + '\n' +
            'pools=' + JSON.stringify(pools) + '\n');
          console.log(JSON.stringify({ include, negativeControl: process.env.FAIL_POOL }));
  workers:
    name: routing-worker-${{ matrix.pool }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Record immutable run identity and actual hardware
        shell: node {0}
        env:
          SELECTED_POOL: ${{ matrix.pool }}
          SELECTED_LABEL: ${{ matrix.runner }}
          FAIL_POOL: ${{ inputs.fail_pool }}
        run: |
          const { writeFileSync } = require('node:fs');
          const { cpus, totalmem } = require('node:os');
          const { strict: assert } = require('node:assert');
          assert(/^[0-9a-f]{40}$/.test(process.env.GITHUB_SHA));
          assert(['github', 'depot'].includes(process.env.SELECTED_POOL));
          assert.equal(cpus().length, 4);
          const receipt = {
            schemaVersion: 1,
            workload: 'additive-pool-routing-and-gate-probe',
            sourceSha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
            eventName: process.env.GITHUB_EVENT_NAME,
            selectedPool: process.env.SELECTED_POOL,
            selectedLabel: process.env.SELECTED_LABEL,
            intendedNegativeControl: process.env.FAIL_POOL === process.env.SELECTED_POOL,
            runner: {
              name: process.env.RUNNER_NAME,
              environment: process.env.RUNNER_ENVIRONMENT,
              os: process.env.RUNNER_OS,
              architecture: process.env.RUNNER_ARCH,
              logicalCpus: cpus().length,
              totalMemoryBytes: totalmem(),
              node: process.version,
            },
          };
          writeFileSync('routing-receipt-' + receipt.selectedPool + '.json', JSON.stringify(receipt, null, 2) + '\n');
          console.log(JSON.stringify(receipt));
      - name: Upload source-bound receipt before the failure control
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: routing-receipt-${{ github.run_id }}-${{ matrix.pool }}
          path: routing-receipt-${{ matrix.pool }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Bounded hold for explicit cancellation control
        if: matrix.pool == 'depot' && inputs.hold_seconds == '90'
        shell: node {0}
        run: |
          const { setTimeout } = require('node:timers/promises');
          async function hold() {
            console.log('CANCELLATION_CONTROL_READY: bounded 90-second idle timer');
            await setTimeout(90000);
            console.log('CANCELLATION_CONTROL_COMPLETED_WITHOUT_CANCELLATION');
          }
          hold();
      - name: Intentional source failure control
        shell: node {0}
        env:
          SELECTED_POOL: ${{ matrix.pool }}
          FAIL_POOL: ${{ inputs.fail_pool }}
        run: |
          if (process.env.FAIL_POOL === process.env.SELECTED_POOL)
            throw new Error('INTENTIONAL_SOURCE_FAILURE_CONTROL: selected worker must fail the final gate');
          console.log('Worker source control passed.');
  gate:
    name: routing-proof-gate
    needs:
      - plan
      - workers
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download receipts from this exact workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: routing-receipt-${{ github.run_id }}-*
          path: receipts
          merge-multiple: true
      - name: Require all selected jobs and their original receipts
        shell: node {0}
        env:
          EXPECTED_POOLS: ${{ needs.plan.outputs.pools }}
          PLAN_RESULT: ${{ needs.plan.result }}
          WORKERS_RESULT: ${{ needs.workers.result }}
        run: |
          const { readdirSync, readFileSync, appendFileSync } = require('node:fs');
          const { strict: assert } = require('node:assert');
          assert.equal(process.env.PLAN_RESULT, 'success');
          const expected = JSON.parse(process.env.EXPECTED_POOLS).sort();
          const files = readdirSync('receipts').sort();
          assert.deepEqual(files, expected.map(pool => 'routing-receipt-' + pool + '.json').sort());
          const receipts = files.map(file => JSON.parse(readFileSync('receipts/' + file, 'utf8')));
          assert.deepEqual(receipts.map(r => r.selectedPool).sort(), expected);
          for (const receipt of receipts) {
            assert.equal(receipt.sourceSha, process.env.GITHUB_SHA);
            assert.equal(receipt.runId, process.env.GITHUB_RUN_ID);
            assert.equal(receipt.attempt, process.env.GITHUB_RUN_ATTEMPT);
            assert.equal(receipt.eventName, 'workflow_dispatch');
            assert.equal(receipt.runner.logicalCpus, 4);
          }
          console.log(JSON.stringify({ expected, sourceSha: process.env.GITHUB_SHA,
            workersResult: process.env.WORKERS_RESULT, receipts }));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            'Validated receipts for: ' + expected.join(', ') + '. Worker result: ' +
            process.env.WORKERS_RESULT + '.\n');
          assert.equal(process.env.WORKERS_RESULT, 'success',
            'The stable gate must preserve any selected worker failure or cancellation.');
