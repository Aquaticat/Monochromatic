# Research branch only: pinned archive, exact source and tools, no production routing change.
name: Matched archived lock provider controls
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  github:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: "true"
      MISE_AUTO_INSTALL: "false"
      MISE_LOCKED: "1"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      REUSE_LOCK_PROVIDER: github-hosted
    outputs:
      archive_ready: ${{ steps.prepare.outputs.archive_ready }}
    steps:
      - &a1
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1
      - &a2
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.10.9
          install: true
          install_args: node
          cache: false
      - id: prepare
        name: Admit exact diagnostic ZIP and bundled tools
        env:
          REUSE_LOCK_STAGE: prepare
          MONO_RESEARCH_LOCK_ARCHIVE_URL_20261018: ${{ secrets.MONO_RESEARCH_LOCK_ARCHIVE_URL_20261018 }}
        run: mise run //package/dev-script/task-util:research:reuse:lock-prepare
      - &a3
        name: Repeat archived lock tests with ordinary and tmpfs fixtures
        env:
          REUSE_LOCK_STAGE: consume
        run: mise run //package/dev-script/task-util:research:reuse:lock-portability
      - name: Mirror the admitted original diagnostic ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.prepare.outcome == 'success'
        with:
          name: lock-diagnostic-original-20261018
          path: .research-lock/input/archive.zip
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: github-hosted-archived-lock-controls
          path: .research-lock/receipts
          retention-days: 7
          if-no-files-found: warn
  depot:
    needs: github
    if: always() && needs.github.outputs.archive_ready == 'true'
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 10
    env:
      CI: "true"
      MISE_AUTO_INSTALL: "false"
      MISE_LOCKED: "1"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      REUSE_LOCK_PROVIDER: depot-github
    steps:
      - *a1
      - *a2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lock-diagnostic-original-20261018
          path: .research-lock/input
      - id: prepare
        name: Admit exact diagnostic ZIP and bundled tools
        env:
          REUSE_LOCK_STAGE: prepare
        run: mise run //package/dev-script/task-util:research:reuse:lock-prepare
      - *a3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: depot-github-archived-lock-controls
          path: .research-lock/receipts
          retention-days: 7
          if-no-files-found: warn
