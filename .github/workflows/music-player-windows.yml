{
  "name": "research GitHub KVM access-state repeated controls",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "MISE_AUTO_INSTALL": "false",
    "MISE_LOCKED": "1"
  },
  "jobs": {
    "capability": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 8,
      "env": {
        "PROBE_PLATFORM_PROVIDER": "github-hosted-ubuntu-24.04"
      },
      "steps": [
        {
          "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c",
          "with": {
            "version": "2026.10.9",
            "install": false,
            "cache": false
          }
        },
        {
          "run": "mise install node"
        },
        {
          "run": "mise run //.depot/research/mvm:capability-access-repeats",
          "working-directory": ".depot/research/mvm"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "research-github-kvm-access-repeats",
            "path": ".depot/research/mvm/access-evidence/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
