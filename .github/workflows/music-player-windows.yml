{
  "name": "research actual guest payload consumer",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "MISE_AUTO_INSTALL": "false",
    "MISE_LOCKED": "1"
  },
  "jobs": {
    "guestFiles": {
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 20,
      "env": {
        "PROBE_PLATFORM_PROVIDER": "${{ matrix.provider }}",
        "MVM_RESEARCH_KVM_GROUP": "${{ matrix.group }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c",
          "with": {
            "version": "2026.10.9",
            "install": false,
            "cache": false
          }
        },
        {
          "run": "mise install node pnpm"
        },
        {
          "run": "mise run prepare:pnpm:install -- --frozen-lockfile"
        },
        {
          "name": "Guest read, distinct output, transformation and pull",
          "run": "mise run //.depot/research/mvm:lifecycle",
          "working-directory": ".depot/research/mvm",
          "timeout-minutes": 18
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "research-mvm-guest-files-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": ".depot/research/mvm/evidence/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ],
      "strategy": {
        "fail-fast": false,
        "max-parallel": 1,
        "matrix": {
          "include": [
            {
              "key": "github",
              "runner": "ubuntu-24.04",
              "provider": "github-hosted-ubuntu-24.04",
              "group": "device"
            },
            {
              "key": "depot",
              "runner": "depot-ubuntu-24.04-4",
              "provider": "github-depot-ubuntu-24.04-4",
              "group": ""
            }
          ]
        }
      }
    }
  }
}
