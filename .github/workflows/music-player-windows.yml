            if kernel32.WaitForSingleObject(process, wait_ms) == WAIT_TIMEOUT:
                kernel32.TerminateProcess(process, 1)
                kernel32.WaitForSingleObject(process, INFINITE)
            else:
                exit_code = wintypes.DWORD(0)
                kernel32.GetExitCodeProcess(process, ctypes.byref(exit_code))
                code = exit_code.value
            kernel32.CloseHandle(process)
            return code


        def window_text(hwnd):
            # WM_GETTEXT, not GetWindowTextW: GetWindowTextW does not read the controls of another process.
            length = user32.SendMessageW(hwnd, WM_GETTEXTLENGTH, 0, None)
            buffer = ctypes.create_unicode_buffer(length + 1)
            user32.SendMessageW(hwnd, WM_GETTEXT, length + 1, ctypes.cast(buffer, ctypes.c_void_p))
            return buffer.value


        def class_name(hwnd):
            buffer = ctypes.create_unicode_buffer(256)
            user32.GetClassNameW(hwnd, buffer, 256)
            return buffer.value


        def find_dialog(pid, seconds):
            """The first dialog-class (#32770) top-level window of the process, or None after the wait."""
            deadline = time.monotonic() + seconds
            while time.monotonic() < deadline:
                found = []

                def visit(hwnd, _):
                    owner = wintypes.DWORD(0)
                    user32.GetWindowThreadProcessId(hwnd, ctypes.byref(owner))
                    if owner.value == pid and class_name(hwnd) == "#32770":
                        found.append(hwnd)
                    return True

                user32.EnumWindows(EnumWindowsProc(visit), 0)
                if found:
                    return found[0]
                time.sleep(0.2)
            return None


        def dialog_message(hwnd):
            texts = []

            def visit(child, _):
                if class_name(child) == "Static":
                    texts.append(window_text(child))
                return True

            user32.EnumChildWindows(hwnd, EnumWindowsProc(visit), 0)
            return "\n".join(text for text in texts if text)


