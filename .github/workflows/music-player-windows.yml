name: Research actual pnpr packing isolated installs and consumers
on:
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: research-packed-installs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  libraries:
    name: Actual frozen packing and consumers
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard:
          - a
    env:
      COVERAGE_SOURCE: e02be6c8b8fe9efb41a7f8f1a0b311c17796588a
      COVERAGE_SHARD: ${{ matrix.shard }}
      MISE_AUTO_INSTALL: "false"
      MISE_JOBS: "2"
      NODE_OPTIONS: --max-old-space-size=2048
      OXLINT_THREADS: "2"
      CI: "true"
      COVERAGE_TASK_NAMES_SHA256: 149afd917a4fa10f4b5846fc2c02a4ed69f89401ab9230c4869ff34c3cd76e7c
      GOMAXPROCS: "2"
      GOMEMLIMIT: 768MiB
    steps:
      - name: Checkout immutable application source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e02be6c8b8fe9efb41a7f8f1a0b311c17796588a
          persist-credentials: false
      - name: Initialize source-bound receipt before setup
        shell: node {0}
        run: >
          const { mkdirSync, writeFileSync, readFileSync } = require('node:fs');

          const { execFileSync } = require('node:child_process');

          const { cpus, totalmem, arch, platform } = require('node:os');

          const path = process.env.RUNNER_TEMP + '/coverage-' + process.env.COVERAGE_SHARD;

          mkdirSync(path, { recursive: true });

          const source = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();

          if (source !== process.env.COVERAGE_SOURCE) throw new Error('Application checkout differs from
          frozen source');

          const metadata = {
            source, workflowCommit: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT, shard: process.env.COVERAGE_SHARD,
            runner: process.env.RUNNER_NAME, platform: platform(), arch: arch(),
            uid: process.getuid(), gid: process.getgid(), cpuCount: cpus().length, memoryBytes: totalmem(),
            osRelease: readFileSync('/etc/os-release', 'utf8'),
            startedAt: new Date().toISOString(), state: 'setup_pending',
            limits: { taskMilliseconds: 180000, campaignMilliseconds: 540000, jobMinutes: 15 },
          };

          writeFileSync(path + '/source.json', JSON.stringify(metadata, null, 2));


          mkdirSync(path+"/runtime",{recursive:true});
      - name: Set up frozen Mise parser without global tool installation
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.10.0
          install: false
      - name: Install only Node and pnpm
        timeout-minutes: 3
        run: mise install --locked node pnpm
      - name: Install immutable dependencies without the prepare umbrella
        timeout-minutes: 4
        run: mise exec node pnpm -- pnpm install --frozen-lockfile
      - name: Verify source-filtered cloud task inventory
        shell: node {0}
        run: >-
          (async function captureTaskInventory() {
           const { execFileSync } = await import('node:child_process')
           const { writeFileSync } = await import('node:fs')
           const { relative, join } = await import('node:path')
           const { createHash } = await import('node:crypto')
           const root = process.cwd()
           const tasks = JSON.parse(execFileSync('mise', ['tasks','ls','--all','--hidden','--json'], { encoding:'utf8', maxBuffer: 64*1024*1024 }))
           const repositoryTasks = tasks.filter(task => task.source.startsWith(root + '/')).map(task => ({ name:task.name, source:relative(root,task.source), configSources:task.config_sources.map(source => relative(root,source)), directory:relative(root,task.dir), runTemplate:task.run, tools:task.tools, environmentKeys:Object.keys(task.env ?? {}) }))
           const namesHash = createHash('sha256').update(repositoryTasks.map(task => task.name).sort().join('\n')).digest('hex')
           const evidence = { source: process.env.COVERAGE_SOURCE, repositoryTaskCount: repositoryTasks.length, repositoryTaskNamesSha256: namesHash, outsideRepositoryTaskCount: tasks.length - repositoryTasks.length, tasks: repositoryTasks }
           writeFileSync(join(process.env.RUNNER_TEMP,'coverage-' + process.env.COVERAGE_SHARD,'task-inventory.json'), JSON.stringify(evidence,null,2))
           if (namesHash !== process.env.COVERAGE_TASK_NAMES_SHA256) throw new Error('Cloud task inventory differs from source-filtered frozen local inventory')
           console.log('Matched ' + repositoryTasks.length + ' frozen repository task names')
          })()
      - name: Write disposable owning research tasks
        shell: node {0}
        run: |-
          const { mkdirSync, writeFileSync } = require('node:fs');
          async function consumeArtifact() {
            const { cp, mkdtemp, readFile, readdir, writeFile } = await import('node:fs/promises');
            const { join } = await import('node:path');
            const { pathToFileURL } = await import('node:url');
            const { strict: assert } = await import('node:assert');
            const root = process.env.MISE_MONOREPO_ROOT;
            const packagePath = process.env.COVERAGE_PACKAGE;
            if (!root || !/^package\/module\/[a-z-]+$/.test(packagePath ?? '')) throw new Error('Invalid artifact consumer package');
            const pkg = JSON.parse(await readFile(join(root, packagePath, 'package.json'), 'utf8'));
            const fixture = await mkdtemp(join(process.env.RUNNER_TEMP, 'artifact-consumer-'));
            await cp(join(root, packagePath, 'dist'), join(fixture, 'dist'), { recursive: true });
            await writeFile(join(fixture, 'package.json'), JSON.stringify(pkg));
            const mainExport = pkg.exports?.['.'];
            const entry = typeof mainExport === 'string' ? mainExport : mainExport?.default ?? pkg.module ?? pkg.main;
            if (!entry) throw new Error('No default artifact export for ' + packagePath);
            process.chdir(fixture);
            const mod = await import(pathToFileURL(join(fixture, entry)).href);
            assert.ok(Object.keys(mod).length > 0, 'Built module must expose runtime exports');
            const assertions = ['isolated_dist_import', 'nonempty_runtime_exports'];
            if (packagePath.endsWith('/array-at')) {
              assert.equal(mod.arrayAt({ array: [10, 20], index: -1 }), 20);
              assert.throws(() => mod.arrayAt({ array: [], index: 0 }), mod.ArrayAtError);
              assertions.push('negative_index', 'empty_array_rejection');
            }
            if (packagePath.endsWith('/function-arity')) {
              assert.deepEqual(['10', '10'].map(mod.unary(Number.parseInt)), [10, 10]);
              assertions.push('callback_arity');
            }
            if (packagePath.endsWith('/caught-value')) {
              assert.equal(mod.caughtValueText(new Error('offline')), 'offline');
              assert.equal(mod.caughtValueText(404), '404');
              assertions.push('error_message', 'primitive_conversion');
            }
            console.log(JSON.stringify({ packagePath, entry, assertions, fixtureOutsideWorkspace: !fixture.startsWith(root + '/') }));
          }
          async function campaign() {
           const { glob } = await import("node:fs/promises");
            const { spawn, execFileSync } = await import('node:child_process');
            const { once } = await import('node:events');
            const { openSync, closeSync, readFileSync, writeFileSync, existsSync, cpSync, readdirSync, mkdirSync } = await import('node:fs');
            const { join } = await import('node:path');
            const { createHash } = await import('node:crypto');
            const root = process.env.MISE_MONOREPO_ROOT;
            const shard = process.env.COVERAGE_SHARD;
            const receipt = join(process.env.RUNNER_TEMP, 'coverage-' + shard);
            const plans = JSON.parse(readFileSync(join(root, 'package/dev-script/coverage-research/plan.json'), 'utf8'));
            const plan = plans[shard];
            if (!plan || plan.source !== process.env.COVERAGE_SOURCE) throw new Error('Source or shard plan mismatch');
            const packages = plan.packages;
            const commands = plan.commands;
            const sourceReceipt = JSON.parse(readFileSync(join(receipt, 'source.json'), 'utf8'));
            const deadline = Math.min(Date.now() + 540000, Date.parse(sourceReceipt.startedAt) + 780000);
            const manifest = { source: process.env.COVERAGE_SOURCE, workflowCommit: process.env.GITHUB_SHA, shard, profile: plan.profile, commands, outcomes: [] };
            const save = () => writeFileSync(join(receipt, 'campaign.json'), JSON.stringify(manifest, null, 2));
            manifest.toolVersions = Object.fromEntries([['mise', ['--version']], ['node', ['--version']], ['pnpm', ['--version']]].map(([tool, args]) => [tool, execFileSync(tool, args, { cwd: root, encoding: 'utf8' }).trim()]));
            save();
            for (const [index, command] of commands.entries()) {
              const remaining = deadline - Date.now();
              if (remaining < 20000) {
                manifest.outcomes.push({ ...command, state: 'not_started_campaign_budget' });
                save();
                continue;
              }
              const logName = String(index).padStart(3, '0') + '.log';
              const logPath = join(receipt, logName);
              const fd = openSync(logPath, 'w');
              const started = Date.now();
              const outcome = { ...command, log: logName, startedAt: new Date(started).toISOString(), state: 'running' };
              manifest.outcomes.push(outcome);
           if(command.requiredSourceFiles){for(const file of command.requiredSourceFiles){if(createHash('sha256').update(readFileSync(join(root,file.path))).digest('hex')!==file.sha256)throw new Error('Frozen declared source input mismatch: '+file.path);}outcome.declaredSourceInputsVerified=true;}
           if(command.discoveryPattern){const discovered=[];for await(const file of glob(command.discoveryPattern,{cwd:join(root,command.packagePath)})){const path=command.packagePath+'/'+file;discovered.push({path,sha256:createHash('sha256').update(readFileSync(join(root,path))).digest('hex')});}const sort=rows=>rows.toSorted((a,b)=>a.path.localeCompare(b.path));outcome.actualFilesystemDiscovery=sort(discovered);if(JSON.stringify(sort(discovered))!==JSON.stringify(sort(command.expectedFiles)))throw new Error('Actual property discovery differs from frozen source plan: '+command.task);}

           if (command.kind === "default_typescript_unit") {
           const discovered=[]; const pkg=join(root, command.packagePath);
           for await (const file of glob("**/*.unit.test.ts", {cwd:pkg, exclude:name=>name.includes("node_modules")})) { if (!file.includes(".expensive.") && !file.includes("/deprecated/") && !file.startsWith("package-deprecated/") && !file.includes("/package-deprecated/") && !file.startsWith("package-paused/") && !file.includes("/package-paused/")) { const path=command.packagePath+"/"+file; discovered.push({path,sha256:createHash("sha256").update(readFileSync(join(root,path))).digest("hex")}); } }
           const sort=rows=>rows.toSorted((a,b)=>a.path.localeCompare(b.path));
           outcome.actualFilesystemDiscovery=sort(discovered);
           if (JSON.stringify(sort(discovered)) !== JSON.stringify(sort(command.expectedFiles))) throw new Error("Actual owning-template discovery differs from frozen expected file set: " + command.task);
           }
              save();
              const proc = spawn('mise', ['run', command.task, ...(command.args ?? [])], { cwd: root, env: { ...process.env, COVERAGE_PACKAGE: command.packagePath }, detached: true, stdio: ['ignore', fd, fd] });
              let timedOut = false;
              let killTimer;
              const stopGroup = signal => {
                try { process.kill(-proc.pid, signal); }
                catch (error) { if (error.code !== 'ESRCH') throw error; }
              };
              const timer = setTimeout(() => {
                timedOut = true;
                stopGroup('SIGTERM');
                killTimer = setTimeout(() => stopGroup('SIGKILL'), 3000);
              }, Math.min(180000, remaining - 10000));
              try {
                const [code, signal] = await once(proc, 'close');
                outcome.exitCode = code;
                outcome.signal = signal;
                outcome.state = timedOut ? 'task_budget_exhausted' : code === 0 ? 'command_succeeded' : 'command_failed_requires_classification';
              } catch (error) {
                outcome.state = 'harness_spawn_failed';
                outcome.error = String(error);
              } finally {
                clearTimeout(timer);
                clearTimeout(killTimer);
                closeSync(fd);
              }
              outcome.durationMilliseconds = Date.now() - started;
              const log = readFileSync(logPath);
              outcome.logSha256 = createHash('sha256').update(log).digest('hex');
              outcome.logBytes = log.length;
              outcome.discovery = { basis: 'tracked_test_file_candidates_not_runtime_case_counts', files: execFileSync('git', ['ls-files', '--', command.packagePath], { cwd: root, encoding: 'utf8' }).trim().split('\n').filter(path => path.endsWith('.unit.test.ts') && !path.includes('.expensive.')) };
              save();
              console.log(command.task + ' ' + outcome.state + ' ' + outcome.durationMilliseconds + 'ms');
            }
            manifest.completedAt = new Date().toISOString();
            manifest.artifactFiles = [];
            for (const name of packages) {
              const dist = join(root, name, 'dist');
              if (!existsSync(dist)) continue;
              const destination = join(receipt, 'artifacts', name, 'dist');
              mkdirSync(join(receipt, 'artifacts', name), { recursive: true });
              cpSync(dist, destination, { recursive: true });
              cpSync(join(root, name, 'package.json'), join(receipt, 'artifacts', name, 'package.json'));
              const pending = [destination];
              while (pending.length) {
                const dir = pending.pop();
                for (const entry of readdirSync(dir, { withFileTypes: true })) {
                  const path = join(dir, entry.name);
                  if (entry.isDirectory()) pending.push(path);
                  else if (entry.isFile()) {
                    const bytes = readFileSync(path);
                    manifest.artifactFiles.push({ path: path.slice(receipt.length + 1), bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') });
                  }
                }
              }
            }
            manifest.changedTrackedFiles = execFileSync('git', ['diff', '--name-only'], { cwd: root, encoding: 'utf8' }).trim().split('\n').filter(Boolean);
            save();
            if (manifest.outcomes.some(outcome => outcome.state !== 'command_succeeded')) throw new Error('Frozen coverage commands did not all succeed; inspect source-bound receipts');
          }
          const dir = 'package/dev-script/coverage-research';
          mkdirSync(dir, { recursive: true });
          const task = (name, fn) => '[tasks.' + JSON.stringify(name) + ']\nshell = "node --input-type=module-typescript -e"\nrun = ' + JSON.stringify('await (' + fn.toString() + ')()') + '\n';
          writeFileSync(dir + '/mise.toml', task('campaign', campaign) + '\n' + task('test:artifact-consumer', consumeArtifact));






          writeFileSync(dir+"/plan.json","{\"a\":{\"source\":\"e02be6c8b8fe9efb41a7f8f1a0b311c17796588a\",\"profile\":\"finite_toml_conformance_declared_types_and_mutation_fixture\",\"packages\":[\"package/module/deepmerge-ts.fuzz\"],\"commands\":[{\"task\":\"//package/module/test:build\",\"packagePath\":\"package/module/test\",\"kind\":\"shared_harness_build\"},{\"task\":\"//package/module/logger:build\",\"packagePath\":\"package/module/logger\",\"kind\":\"shared_logger_build\"},{\"task\":\"//package/config/oxlint:build:js:node\",\"packagePath\":\"package/config/oxlint\",\"kind\":\"shared_static_prerequisite\"},{\"task\":\"//package/module/array-at:build\",\"packagePath\":\"package/module/array-at\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/async-iter:build\",\"packagePath\":\"package/module/async-iter\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/async-time:build\",\"packagePath\":\"package/module/async-time\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/caught-value:build\",\"packagePath\":\"package/module/caught-value\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/conf-fork:build\",\"packagePath\":\"package/module/conf-fork\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/const:build\",\"packagePath\":\"package/module/const\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/css-edit:build\",\"packagePath\":\"package/module/css-edit\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/dom:build\",\"packagePath\":\"package/module/dom\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/fs-id:build\",\"packagePath\":\"package/module/fs-id\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/fs-path:build\",\"packagePath\":\"package/module/fs-path\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/function-arity:build\",\"packagePath\":\"package/module/function-arity\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/hyperscript:build\",\"packagePath\":\"package/module/hyperscript\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/i18n-compose:build\",\"packagePath\":\"package/module/i18n-compose\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/image-diff:build\",\"packagePath\":\"package/module/image-diff\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/jsonc-edit:build\",\"packagePath\":\"package/module/jsonc-edit\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/kv-store:build\",\"packagePath\":\"package/module/kv-store\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/llm-type:build\",\"packagePath\":\"package/module/llm-type\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/make-asynchronous-fork:build\",\"packagePath\":\"package/module/make-asynchronous-fork\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/matcher-fork:build\",\"packagePath\":\"package/module/matcher-fork\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/matrix:build\",\"packagePath\":\"package/module/matrix\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/memoize:build\",\"packagePath\":\"package/module/memoize\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/numeric-format:build\",\"packagePath\":\"package/module/numeric-format\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/observable:build\",\"packagePath\":\"package/module/observable\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/or-throw:build\",\"packagePath\":\"package/module/or-throw\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/p-limit-fork:build\",\"packagePath\":\"package/module/p-limit-fork\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/p-map-fork:build\",\"packagePath\":\"package/module/p-map-fork\",\"kind\":\"shared_module_build\"},{\"task\":\"//package/module/p-memoize-fork:build\",\"packagePath\":\"