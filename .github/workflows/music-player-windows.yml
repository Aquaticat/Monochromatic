name: Depot fresh-job pnpm store research
run-name: pnpm cache research ${{ inputs.phase }} ${{ inputs.scope }}

on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        required: true
        options: [cold, seed, warm, branch]
      scope:
        type: string
        required: true
      samples:
        type: string
        required: true
        default: '[1,2]'

permissions:
  contents: read

concurrency:
  group: depot-pnpm-cache-research-${{ github.ref }}-${{ inputs.phase }}
  cancel-in-progress: false

jobs:
  cache:
    name: pnpm store ${{ matrix.pool }} ${{ inputs.phase }} sample ${{ matrix.sample }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pool: [github, depot]
        sample: ${{ fromJSON(inputs.samples) }}
        include:
        - pool: github
          runner: ubuntu-24.04
        - pool: depot
          runner: depot-ubuntu-24.04-4
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    env:
      CI: 'true'
      MISE_AUTO_INSTALL: 'false'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      RESEARCH_POOL: ${{ matrix.pool }}
      RESEARCH_PHASE: ${{ inputs.phase }}
      RESEARCH_SAMPLE: ${{ matrix.sample }}
      RESEARCH_SCOPE: ${{ inputs.scope }}
    steps:
    - name: Checkout immutable experiment source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        fetch-depth: 1
    - name: Bootstrap mise only
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        # Freeze the installer as well as the Node/pnpm versions for repeated measurements.
        version: 2026.10.9
        install: false
        cache: false
    - name: Install only the tool versions frozen in this source lock
      run: mise install node@26.12.0 pnpm@12.14.0
    - name: Record fresh allocation and immutable dependency identity
      run: mise run //package/dev-script/task-util:research:depot:pnpm:prepare
    - name: Restore pnpm store through the runner's actual cache backend
      id: cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: .research-depot/pnpm-store
        key: research-${{ inputs.scope }}-${{ matrix.pool }}-Linux-X64-${{ hashFiles('pnpm-lock.yaml', 'mise.lock') }}${{ inputs.phase == 'cold' && format('-miss-{0}', matrix.sample) || '' }}
    - name: Verify hit or miss and producer manifest
      env:
        RESEARCH_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        RESEARCH_MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
      run: mise run //package/dev-script/task-util:research:depot:pnpm:verify
    - name: Install frozen workspace dependencies
      id: install
      if: ${{ inputs.phase != 'branch' }}
      run: mise run //package/dev-script/task-util:research:depot:pnpm:install
    - name: Bound the experimental archive before saving
      id: guard
      if: ${{ always() && inputs.phase == 'seed' && steps.install.outcome == 'success' }}
      run: mise run //package/dev-script/task-util:research:depot:pnpm:guard
    - name: Save only the successful trusted dependency preparation
      if: ${{ always() && inputs.phase == 'seed' && steps.install.outcome == 'success' && steps.guard.outcome == 'success' }}
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: .research-depot/pnpm-store
        key: ${{ steps.cache.outputs.cache-primary-key }}
    - name: Exercise existing semantic bridge artifact consumers
      if: ${{ inputs.phase != 'branch' && steps.install.outcome == 'success' }}
      run: mise run //package/dev-script/task-util:research:depot:pnpm:consume
    - name: Preserve allocation, cache and consumer receipts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pnpm-store-${{ matrix.pool }}-${{ inputs.phase }}-${{ matrix.sample }}-${{ github.run_id }}
        path: .research-depot/evidence
        if-no-files-found: error
        retention-days: 7
