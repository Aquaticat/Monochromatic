name: toml-edit-fuzz

# Runs the property-based fuzz smoke, the toml-test conformance suite, and the
# V8 line-coverage reachability gate for @monochromatic-dev/module-toml-edit on
# changes that touch the package, its shared fixtures, or the fuzzing decision
# doc. The same *.property.unit.test.ts files run bounded in test:unit and as a
# short per-property campaign through the package fuzz task. See
# package/module/toml-edit/HANDOVER.fuzzing.md and
# doc/decision/toml-edit-fuzzing.md.
#
# push and pull_request are path-filtered to toml-edit. merge_group cannot be
# path-filtered (a GitHub limitation), so the Scope step below skips the heavy
# steps when a merge-queue entry changes no toml-edit files; the job still
# succeeds so a required merge-queue check stays green.

on:
  pull_request:
    branches: ['main']
    paths:
    - 'package/module/toml-edit/**'
    - 'package/test-fixture/toml-edit/**'
    - 'doc/decision/toml-edit-fuzzing.md'
    - '.github/workflows/toml-edit-fuzz.yml'
  merge_group:
    branches: ['main']
  push:
    branches: ['main']
    paths:
    - 'package/module/toml-edit/**'
    - 'package/test-fixture/toml-edit/**'
    - 'doc/decision/toml-edit-fuzzing.md'
    - '.github/workflows/toml-edit-fuzz.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    env:
      # The root mise config sets auto_install=true and lists heavy dev tools:
      # cargo:slint-ui/slint (slint-lsp and slint-viewer) builds from a git rev
      # and needs system fontconfig the runner lacks, so it fails to compile.
      # Disabling auto-install makes every `mise run`/`mise exec` use only the
      # tools this job installs explicitly below, instead of rebuilding slint on
      # each command. The toml-edit tasks need only node, pnpm, and toml-test.
      MISE_AUTO_INSTALL: 'false'
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        # Full history so the merge_group scope check can diff against origin/main.
        fetch-depth: 0

    - name: Scope to toml-edit changes
      id: scope
      # push and pull_request are already filtered to the toml-edit paths, so they
      # always run. merge_group cannot be path-filtered, so detect whether the
      # queued changes touch toml-edit and skip the heavy steps when they do not.
      run: |
        set -euo pipefail
        run=true
        if [ "${{ github.event_name }}" = 'merge_group' ]; then
          changed=$(git diff --name-only --diff-filter=ACMRT origin/main...HEAD || true)
          if ! printf '%s\n' "$changed" | grep -qE '^(package/(module|test-fixture)/toml-edit/|doc/decision/toml-edit-fuzzing\.md|\.github/workflows/toml-edit-fuzz\.yml)'; then
            run=false
            echo 'No toml-edit files in the merge group; skipping the fuzz steps.'
          fi
        fi
        echo "run=$run" >> "$GITHUB_OUTPUT"

    - name: Set up mise (skip auto-install of all tools)
      if: steps.scope.outputs.run == 'true'
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151
      with:
        # mise-action defaults to install:true, which runs `mise install` over
        # the whole root toolset (slint included) before any step. Matches
        # publish.yml and cargo-publish.yml.
        install: false

    - name: Install only the tools this workflow needs
      if: steps.scope.outputs.run == 'true'
      # toml-test feeds the conformance task (mise exec github:toml-lang/toml-test
      # inside test:conformance); with auto-install off it must be present.
      run: mise install node pnpm 'github:toml-lang/toml-test@latest'

    - name: Install dependencies
      if: steps.scope.outputs.run == 'true'
      run: mise exec node pnpm -- pnpm install --frozen-lockfile

    - name: Build the bundle
      if: steps.scope.outputs.run == 'true'
      # Build before type-check: the test and conformance files import the built
      # `@monochromatic-dev/module-toml-edit`, so its dist .d.mts must exist for
      # tsgo to resolve them on a fresh checkout.
      run: mise run //package/module/toml-edit:build

    - name: Type-check
      if: steps.scope.outputs.run == 'true'
      run: mise run //package/module/toml-edit:lint:types

    - name: Unit suite (bounded property runs plus fixtures)
      if: steps.scope.outputs.run == 'true'
      run: mise run //package/module/toml-edit:test:unit

    - name: Fuzz smoke (short per-property campaign)
      if: steps.scope.outputs.run == 'true'
      # A short per-property budget, not the 60s local default, keeps the smoke
      # bounded while still exploring well past the bounded-mode run count.
      run: mise run //package/module/toml-edit:fuzz --budget 3000

    - name: Conformance (toml-test decode and encode for 1.0 and 1.1)
      if: steps.scope.outputs.run == 'true'
      # Follows the latest upstream toml-test runner through mise (a deliberate
      # moving oracle); the task logs the resolved runner version.
      run: mise run //package/module/toml-edit:test:conformance

    - name: Coverage gate (no per-file src reachability regression)
      if: steps.scope.outputs.run == 'true'
      # The committed baseline is a V8-coverage artifact. This repo always tracks
      # the latest node, so a node release that shifts V8 coverage is handled by
      # refreezing the baseline with
      # `mise run //package/module/toml-edit:fuzz:coverage --write`, not by
      # pinning node.
      run: mise run //package/module/toml-edit:fuzz:coverage
