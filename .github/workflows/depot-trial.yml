name: Depot trial runner comparison

on:
  push:
    branches:
    - trial/depot-20261015
    paths:
    - .github/workflows/depot-trial.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: depot-trial-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpine:
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-24.04
        - depot-ubuntu-24.04-4
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      MISE_AUTO_INSTALL: 'false'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        minimum_release_age: 1d
        install: false
    - name: Install the task runtime
      run: mise install node
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - name: Build the identical Alpine artifact and repeat with warm Cargo caches
      run: mise run //package/music-player/desktop-app:trial:github:build
