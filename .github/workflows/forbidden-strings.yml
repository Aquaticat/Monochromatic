name: forbidden-strings

on:
  pull_request:
    branches: ['main']
  merge_group:
    branches: ['main']
  push:
    branches: ['main']

permissions:
  contents: read
  attestations: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout (full history)
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0

    - name: Set up mise (skip auto-install of all tools)
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151
      with:
        install: false
        cache: true

    - name: Install only the tools this workflow needs
      # The root mise.toml lists ~25 tools (including llama.cpp, which
      # intermittently lacks a Linux release at install time). This scan
      # only needs hk (the runner) and pkl (hk's config language). The
      # scanner binary itself is downloaded prebuilt from GitHub releases
      # (see Download step below), so no rust toolchain is needed here.
      run: mise install 'aqua:jdx/hk' 'aqua:apple/pkl'

    - name: Download prebuilt forbidden-strings binary
      # The cargo-publish.yml workflow uploads SLSA-attested binaries for
      # x86_64-unknown-linux-gnu (and six other targets) on every
      # Cargo.toml version bump merged to main. Downloading is seconds;
      # building from source is minutes. We try the Cargo.toml version
      # first so the scanner matches the source tree, then fall back to
      # the latest release to cover the window between a version-bump PR
      # merging and cargo-publish.yml finishing.
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        cargo_toml='packages/cli/forbidden-strings/Cargo.toml'
        version=$(awk -F'"' '/^version = / { print $2; exit }' "$cargo_toml")
        tag="forbidden-strings-v${version}"
        if ! gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
          echo "::notice::Release $tag not yet published; falling back to latest forbidden-strings-v* release."
          tag=$(gh release list --repo "$REPO" --limit 50 --json tagName \
            --jq '[.[].tagName | select(startswith("forbidden-strings-v"))][0] // ""')
          if [ -z "$tag" ]; then
            echo "::error::No forbidden-strings-v* release found in $REPO." >&2
            exit 1
          fi
          version="${tag#forbidden-strings-v}"
          echo "Using fallback release: $tag"
        fi

        archive="forbidden-strings-${version}-x86_64-unknown-linux-gnu.tar.gz"
        gh release download "$tag" --repo "$REPO" --pattern "$archive"

        # SLSA build-provenance: binds the archive's sha256 to the
        # cargo-publish.yml run that produced it. A swapped-out release
        # asset would fail this step.
        gh attestation verify "$archive" --repo "$REPO"

        # hk.pkl line 3 and the push-to-main full-tree-scan step both
        # hard-code this path. Match it exactly so neither needs editing.
        target_dir='packages/cli/forbidden-strings/target/release'
        mkdir -p "$target_dir"
        tar -xzf "$archive" \
          --strip-components=1 \
          -C "$target_dir" \
          "forbidden-strings-${version}-x86_64-unknown-linux-gnu/forbidden-strings"
        chmod +x "$target_dir/forbidden-strings"
        "$target_dir/forbidden-strings" --version

    - name: Materialize deny-list
      # Mirror the local file-enforcer composition: always seed from the
      # committed baseline (betterleaks port, not sensitive), then append
      # the per-repo secret if one is configured. This keeps the baseline
      # credential scan running even when no secret exists, while still
      # honoring the design that puts repo-specific literals out-of-band.
      # Use printenv (not shell interpolation) so the secret bytes are
      # never expanded into a logged command line.
      env:
        FORBIDDEN_STRINGS_LIST: ${{ secrets.FORBIDDEN_STRINGS_LIST }}
      run: |
        cp forbidden-strings.local.example.txt forbidden-strings.local.txt
        if [ -n "$FORBIDDEN_STRINGS_LIST" ]; then
          printenv FORBIDDEN_STRINGS_LIST >> forbidden-strings.local.txt
        else
          echo "::notice::FORBIDDEN_STRINGS_LIST secret not set; baseline-only scan."
        fi

    - name: Run hk check (changed files only)
      run: |
        mise exec -- hk check --from-ref origin/main

    - name: Run forbidden-strings full-tree scan (push to main only)
      if: github.event_name == 'push'
      run: |
        packages/cli/forbidden-strings/target/release/forbidden-strings \
          --rules forbidden-strings.local.txt \
          --all
