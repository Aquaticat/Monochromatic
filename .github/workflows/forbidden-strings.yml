name: forbidden-strings

on:
  pull_request:
    branches: ['main']
  merge_group:
    branches: ['main']
  push:
    branches: ['main']

permissions:
  contents: read
  attestations: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout (full history)
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0

    - name: Download prebuilt forbidden-strings binary
      # The cargo-publish.yml workflow uploads SLSA-attested binaries for
      # x86_64-unknown-linux-gnu (and six other targets) on every
      # Cargo.toml version bump merged to main. We try the Cargo.toml
      # version first so the scanner matches the source tree, then fall
      # back to the latest release to cover the window between a
      # version-bump PR merging and cargo-publish.yml finishing.
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        cargo_toml='package/cli/forbidden-strings/Cargo.toml'
        version=$(awk -F'"' '/^version = / { print $2; exit }' "$cargo_toml")
        tag="forbidden-strings-v${version}"
        if ! gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
          echo "::notice::Release $tag not yet published; falling back to latest forbidden-strings-v* release."
          tag=$(gh release list --repo "$REPO" --limit 50 --json tagName \
            --jq '[.[].tagName | select(startswith("forbidden-strings-v"))][0] // ""')
          if [ -z "$tag" ]; then
            echo "::error::No forbidden-strings-v* release found in $REPO." >&2
            exit 1
          fi
          version="${tag#forbidden-strings-v}"
          echo "Using fallback release: $tag"
        fi

        archive="forbidden-strings-${version}-x86_64-unknown-linux-gnu.tar.gz"
        gh release download "$tag" --repo "$REPO" --pattern "$archive"

        # SLSA build-provenance: binds the archive's sha256 to the
        # cargo-publish.yml run that produced it. A swapped-out release
        # asset would fail this step.
        gh attestation verify "$archive" --repo "$REPO"

        # Install to a path on PATH so downstream steps invoke the binary
        # as plain `forbidden-strings`. Lives under RUNNER_TEMP so it
        # doesn't pollute the working tree.
        bin_dir="$RUNNER_TEMP/forbidden-strings"
        mkdir -p "$bin_dir"
        tar -xzf "$archive" \
          --strip-components=1 \
          -C "$bin_dir" \
          "forbidden-strings-${version}-x86_64-unknown-linux-gnu/forbidden-strings"
        chmod +x "$bin_dir/forbidden-strings"
        echo "$bin_dir" >> "$GITHUB_PATH"
        "$bin_dir/forbidden-strings" --version

    - name: Materialize deny-list
      # Mirror the local file-enforcer composition: seed from the committed
      # baseline (betterleaks port, not sensitive), append the committed
      # shared appendix (forbidden-strings.append.txt, non-sensitive repo-
      # wide rules), then append the per-repo secret if one is configured.
      # This keeps the baseline credential scan running even when no secret
      # exists, while still honoring the design that puts sensitive repo-
      # specific literals out-of-band: the gitignored append.local.txt is
      # absent in CI, so its sensitive equivalent is the
      # FORBIDDEN_STRINGS_LIST secret. Use printenv (not shell
      # interpolation) so the secret bytes are never expanded into a logged
      # command line.
      env:
        FORBIDDEN_STRINGS_LIST: ${{ secrets.FORBIDDEN_STRINGS_LIST }}
      run: |
        cp forbidden-strings.local.example.txt forbidden-strings.local.txt
        cat forbidden-strings.append.txt >> forbidden-strings.local.txt
        if [ -n "$FORBIDDEN_STRINGS_LIST" ]; then
          printenv FORBIDDEN_STRINGS_LIST >> forbidden-strings.local.txt
        else
          echo "::notice::FORBIDDEN_STRINGS_LIST secret not set; baseline + shared appendix scan."
        fi

    - name: Scan changed files (PR and merge_group only)
      # Skipped on push-to-main because the full-tree scan below already
      # covers everything; on push events `git diff origin/main...HEAD`
      # is a no-op anyway (HEAD == origin/main after the push). Replaces
      # the previous `mise exec -- hk check` step, which was forcing mise
      # to auto-install ~25 unrelated tools (including cargo crates that
      # compile from source) before running the actual scan.
      if: github.event_name != 'push'
      run: |
        set -euo pipefail
        mapfile -t changed < <(git diff --name-only --diff-filter=ACMRT origin/main...HEAD)
        if [ ${#changed[@]} -eq 0 ]; then
          echo "No changed files vs origin/main; nothing to scan."
          exit 0
        fi
        printf 'Scanning %d changed file(s):\n' "${#changed[@]}"
        printf '  %s\n' "${changed[@]}"
        forbidden-strings --rules forbidden-strings.local.txt "${changed[@]}"

    - name: Scan full tree (push to main only)
      if: github.event_name == 'push'
      run: forbidden-strings --rules forbidden-strings.local.txt --all
