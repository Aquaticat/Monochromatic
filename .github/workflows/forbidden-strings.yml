name: forbidden-strings

on:
  workflow_dispatch:
    inputs:
      cohort_id:
        description: Frozen shared replay identity
        required: true
        type: string
      manifest_sha256:
        description: SHA256 of the exact published common manifest bytes
        required: true
        type: string
      requested_at:
        description: Shared canonical UTC request instant after publication
        required: true
        type: string
      case_id:
        description: Immutable case selected by the common manifest
        required: true
        type: choice
        options: [toml, logger, native, desktop]
      source_head:
        description: Immutable source revision to scan
        required: true
        type: string
      source_base:
        description: Immutable comparison base
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.cohort_id }}-${{ inputs.case_id }}
  cancel-in-progress: false

permissions:
  contents: read
  attestations: read

jobs:
  scan:
    runs-on: ubuntu-latest
    name: ${{ inputs.case_id }} scanner
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source
    env:
      MISE_AUTO_INSTALL: 'false'
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      DEPOT_CI_CASE: ${{ inputs.case_id }}
      DEPOT_CI_ROUTE: ${{ format('{0}.scanner', inputs.case_id) }}
      SOURCE_HEAD: ${{ inputs.source_head }}
      SOURCE_BASE: ${{ inputs.source_base }}
      COHORT_ID: ${{ inputs.cohort_id }}
      COHORT_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      COHORT_REQUESTED_AT: ${{ inputs.requested_at }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout frozen harness
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: harness
        fetch-depth: 0
        persist-credentials: false

    - name: Install verified task runner bootstrap
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        # Reuse the bootstrap exercised by the existing trial workflows.
        version: 2026.10.9
        working_directory: harness
        install: false
        env: false
        export_path: false
        cache: false
    - name: Install the frozen harness Node runtime
      working-directory: harness
      run: mise install node
    - name: Checkout immutable source for the selected change
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: source
        ref: ${{ inputs.source_head }}
        fetch-depth: 0
        persist-credentials: false

    - name: Bind immutable source and shared cohort before scanner
      id: cohort_before
      working-directory: harness
      env:
        DEPOT_CI_IDENTITY_PHASE: before
      run: mise run //package/dev-script/task-util:trial:depot:ci:cohort-identity
    - name: Download prebuilt forbidden-strings binary
      working-directory: harness
      # The cargo-publish.yml workflow uploads SLSA-attested binaries for
      # x86_64-unknown-linux-gnu (and six other targets) on every
      # Cargo.toml version bump merged to main. We try the Cargo.toml
      # version first so the scanner matches the source tree, then fall
      # back to the latest release to cover the window between a
      # version-bump PR merging and cargo-publish.yml finishing.
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        cargo_toml='package/cli/forbidden-strings/Cargo.toml'
        version=$(awk -F'"' '/^version = / { print $2; exit }' "$cargo_toml")
        tag="forbidden-strings-v${version}"
        archive="forbidden-strings-${version}-x86_64-unknown-linux-gnu.tar.gz"
        # Download the public asset directly. `gh release view/download` use
        # the shared installation REST quota and can mask HTTP 403 as 404.
        status=$(curl --silent --show-error --location --output "$archive" --write-out '%{http_code}' \
          "https://github.com/$REPO/releases/download/$tag/$archive")
        if [ "$status" = '404' ]; then
          echo "::notice::Release $tag not yet published; falling back to latest forbidden-strings-v* release."
          tag=$(gh release list --repo "$REPO" --limit 50 --json tagName \
            --jq '[.[].tagName | select(startswith("forbidden-strings-v"))][0] // ""')
          if [ -z "$tag" ]; then
            echo "::error::No forbidden-strings-v* release found in $REPO." >&2
            exit 1
          fi
          version="${tag#forbidden-strings-v}"
          echo "Using fallback release: $tag"
          archive="forbidden-strings-${version}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/$REPO/releases/download/$tag/$archive"
        elif [ "$status" != '200' ]; then
          echo "::error::Downloading $archive from $REPO returned HTTP $status." >&2
          exit 1
        fi

        # SLSA build-provenance: binds the archive's sha256 to the
        # cargo-publish.yml run that produced it. A swapped-out release
        # asset would fail this step.
        if [ "$version" = '0.5.0' ]; then
          # This release was signed before the organization transfer. Retain
          # its original signed bundle and exact signing identity; signatures
          # and the archive digest are still verified by gh.
          gh attestation verify "$archive" --repo Aquaticat/Monochromatic \
            --signer-workflow Aquaticat/Monochromatic/.github/workflows/cargo-publish.yml \
            --bundle package/cli/forbidden-strings/provenance/0.5.0-x86_64-unknown-linux-gnu.sigstore.jsonl
        else
          gh attestation verify "$archive" --repo "$REPO"
        fi

        # Install to a path on PATH so downstream steps invoke the binary
        # as plain `forbidden-strings`. Lives under RUNNER_TEMP so it
        # doesn't pollute the working tree.
        bin_dir="$RUNNER_TEMP/forbidden-strings"
        mkdir -p "$bin_dir"
        tar -xzf "$archive" \
          --strip-components=1 \
          -C "$bin_dir" \
          "forbidden-strings-${version}-x86_64-unknown-linux-gnu/forbidden-strings"
        chmod +x "$bin_dir/forbidden-strings"
        echo "$bin_dir" >> "$GITHUB_PATH"
        "$bin_dir/forbidden-strings" --version

    - name: Verify immutable source and comparison base
      env:
        SOURCE_HEAD: ${{ inputs.source_head }}
        SOURCE_BASE: ${{ inputs.source_base }}
      run: |
        set -euo pipefail
        [[ "$SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]]
        [[ "$SOURCE_BASE" =~ ^[0-9a-f]{40}$ ]]
        test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
        git merge-base --is-ancestor "$SOURCE_BASE" "$SOURCE_HEAD"
        printf 'source_head=%s\nsource_base=%s\n' "$SOURCE_HEAD" "$SOURCE_BASE"

    - name: Materialize deny-list
      # De-root design (commit 58995afff): no root example file and no root
      # rules file exist anymore. Compose the runtime rules file from the
      # committed shared appendix (forbidden-strings.append.txt, non-sensitive
      # repo-wide rules) plus the per-repo secret when one is configured. The
      # embedded betterleaks-ported baseline is NOT a file here: the scan steps
      # activate it with --builtin-rules, which reads it from inside the
      # downloaded binary. This keeps the baseline credential scan running even when
      # no secret exists, while the sensitive repo-specific literals stay
      # out-of-band: the gitignored forbidden-strings.append.local.txt is
      # absent in CI, so its sensitive equivalent is the FORBIDDEN_STRINGS_LIST
      # secret. Compose under RUNNER_TEMP so the secret-bearing file never
      # enters the working tree, and use printenv (not shell interpolation) so
      # the secret bytes are never expanded into a logged command line.
      env:
        FORBIDDEN_STRINGS_LIST: ${{ secrets.FORBIDDEN_STRINGS_LIST }}
      run: |
        set -euo pipefail
        rules="$RUNNER_TEMP/forbidden-strings.rules.txt"
        cp forbidden-strings.append.txt "$rules"
        chmod 600 "$rules"
        if [ -n "$FORBIDDEN_STRINGS_LIST" ]; then
          printenv FORBIDDEN_STRINGS_LIST >> "$rules"
        else
          echo "::notice::FORBIDDEN_STRINGS_LIST secret not set; baseline + shared appendix scan."
        fi

    - name: Scan changed files
      # Pushes use the event's before/after range because origin/main already
      # points at HEAD after checkout. Pull requests and merge groups retain
      # their merge-base comparison with main. Replaces both the old full-tree
      # push scan and the earlier `mise exec -- hk check` step.
      env:
        EVENT_NAME: push
        HEAD_SHA: ${{ inputs.source_head }}
        PUSH_BASE_SHA: ${{ inputs.source_base }}
      run: |
        set -euo pipefail
        if [ "$EVENT_NAME" = 'push' ]; then
          # A rewritten main branch can leave the event's before commit outside
          # every fetched ref even with fetch-depth 0. Fetch that exact object
          # before comparing trees instead of falling back to a full-tree scan.
          if ! git cat-file -e "$PUSH_BASE_SHA^{commit}"; then
            git fetch --no-tags --depth=1 origin "$PUSH_BASE_SHA"
          fi
          mapfile -d '' -t changed < <(
            git diff --name-only --diff-filter=ACMRT -z "$PUSH_BASE_SHA" "$HEAD_SHA"
          )
          comparison="$PUSH_BASE_SHA..$HEAD_SHA"
        else
          mapfile -d '' -t changed < <(
            git diff --name-only --diff-filter=ACMRT -z origin/main...HEAD
          )
          comparison='origin/main...HEAD'
        fi
        if [ ${#changed[@]} -eq 0 ]; then
          echo "No changed files in $comparison; nothing to scan."
          exit 0
        fi
        printf 'Scanning %d changed file(s) from %s:\n' "${#changed[@]}" "$comparison"
        printf '  %s\n' "${changed[@]}"
        forbidden-strings --builtin-rules --rules "$RUNNER_TEMP/forbidden-strings.rules.txt" "${changed[@]}"

    - name: Verify immutable source and shared cohort after scanner
      if: ${{ always() && steps.cohort_before.outcome == 'success' }}
      working-directory: harness
      env:
        DEPOT_CI_IDENTITY_PHASE: after
      run: mise run //package/dev-script/task-util:trial:depot:ci:cohort-identity
    - name: Preserve scanner cohort provenance
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: scanner-${{ inputs.case_id }}-cohort-evidence
        path: ~/temp/agent/depot-complete-ci/*-provenance-*.json
        if-no-files-found: ignore
