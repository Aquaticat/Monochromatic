      - id: tools
        name: Install only selected locked runtime tools
        run: mise install ${{ matrix.tools }}
      - name: Frozen host source
        if: ${{ always() && steps.tools.outcome == 'success' }}
        continue-on-error: true
        run: mise run //package/dev-script/coverage-host-research:host:source
      - name: Frozen host dependencies
        if: ${{ always() && steps.tools.outcome == 'success' && matrix.kind == 'all' }}
        continue-on-error: true
        run: mise run //package/dev-script/coverage-host-research:host:dependencies
      - name: Frozen host modules
        if: ${{ always() && steps.tools.outcome == 'success' && matrix.kind == 'all' }}
        continue-on-error: true
        run: mise run //package/dev-script/coverage-host-research:host:modules
      - name: Frozen host node-owners
        if: ${{ always() && steps.tools.outcome == 'success' && matrix.kind == 'all' }}
        continue-on-error: true
        run: mise run //package/dev-script/coverage-host-research:host:node-owners
      - name: Frozen host filesystem
        if: ${{ always() && steps.tools.outcome == 'success' && matrix.kind != 'rust' }}
        continue-on-error: true
        run: mise run //package/dev-script/coverage-host-research:host:filesystem
      - name: Frozen host rust-setup
        if: ${{ always() && steps.tools.outcome == 'success' && matrix.kind != 'fsid' }}
        continue-on-error: true
        run: mise run //package/dev-script/coverage-host-research:host:rust-setup
      - name: Frozen host rust-tests
        if: ${{ always() && steps.tools.outcome == 'success' && matrix.kind != 'fsid' }}
        continue-on-error: true
        run: mise run //package/dev-script/coverage-host-research:host:rust-tests
      - name: Frozen host binary-consumer
        if: ${{ always() && steps.tools.outcome == 'success' && matrix.kind == 'all' }}
        continue-on-error: true
        run: mise run //package/dev-script/coverage-host-research:host:binary-consumer
      - name: Frozen host finalize
        if: ${{ always() && steps.tools.outcome == 'success' }}
        continue-on-error: false
        run: mise run //package/dev-script/coverage-host-research:host:finalize
      - name: Preserve source-bound receipts and task logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-e02-host-${{ matrix.id }}-${{ github.run_id }}
          path: .coverage-host-evidence
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
