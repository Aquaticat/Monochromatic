name: Frozen source Windows GNU scheduler correction
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: frozen-windows-gnu-owner-correction
  cancel-in-progress: false
jobs:
  public:
    name: Current e02 host (${{ matrix.id }})
    runs-on: ${{ matrix.label }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - id: windows2025-gnu-ucrt64-current
            label: windows-2025
            kind: rust
            flavor: gnu
            target: x86_64-pc-windows-gnu
            tools: node
    env:
      MISE_AUTO_INSTALL: "false"
      COVERAGE_HOST_CASE: ${{ matrix.id }}
      COVERAGE_HOST_KIND: ${{ matrix.kind }}
      COVERAGE_HOST_LABEL: ${{ matrix.label }}
      COVERAGE_HOST_FLAVOR: ${{ matrix.flavor }}
      COVERAGE_HOST_TARGET: ${{ matrix.target }}
      COVERAGE_HOST_PROVIDER: public
      COVERAGE_HOST_CAMPAIGN_MINUTES: "27"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      SLINT_ENABLE_EXPERIMENTAL_FEATURES: "1"
      SLINT_EMIT_DEBUG_INFO: "1"
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Checkout immutable application source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e02be6c8b8fe9efb41a7f8f1a0b311c17796588a
          persist-credentials: false
          fetch-depth: 1
          lfs: false
      - name: Set up frozen Mise parser without global tool installation
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          minimum_release_age: 1d
          install: false
