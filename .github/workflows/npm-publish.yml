name: npm-publish

# Targeted public release, including validation of the transferred repository's
# trusted publisher, without publishing unrelated pending package versions.
on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to publish from the selected revision'
        type: choice
        required: true
        default: fs-path
        options:
          - fs-path
          - logger

permissions: {}

env:
  MISE_AUTO_INSTALL: 'false'
  NPM_MODULE: ${{ inputs.module }}

concurrency:
  group: npm-publish-module-${{ inputs.module }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      pnpm_config_dedupe_direct_deps: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          minimum_release_age: 1d
          install: false
      - run: mise install node pnpm
      - run: mise exec node pnpm -- pnpm install --frozen-lockfile
      - run: mise run "//package/module/$NPM_MODULE:build"
      - run: mise run "//package/module/$NPM_MODULE:test:unit"
      - run: mise run npm:module:pack
        env:
          NPM_PACK_DIR: ${{ runner.temp }}/npm-pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: module-tarball
          path: ${{ runner.temp }}/npm-pack/*.tgz
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          minimum_release_age: 1d
          install: false
      - run: mise install node
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: module-tarball
          path: ${{ runner.temp }}/npm-pack
      - run: mise run npm:module:publish
        env:
          NPM_PACK_DIR: ${{ runner.temp }}/npm-pack
