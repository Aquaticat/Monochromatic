name: final newline

on:
  pull_request:
    branches: ['main']
  merge_group:
    branches: ['main']
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Set up Node
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 26.5.0
        package-manager-cache: false

    - name: Set up pnpm
      run: npm install --global pnpm@11.10.0

    - name: Install cli-git dependency closure
      run: pnpm install --frozen-lockfile --filter @monochromatic-dev/cli-git...

    - name: Check final newlines in isolated repository
      run: node package/git-policy/cli/src/trust/fixtures/final-newline-workflow.ts
