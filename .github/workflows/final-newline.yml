name: final newline

on:
  pull_request:
    branches: ['main']
  merge_group:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Set up Node
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 26.5.0
        package-manager-cache: false

    # The cache shares its key with the version job of npm-release.yml, which builds the same executable on main.
    # Pull request and merge group runs only restore: a pull request ref cannot share its entry with another
    # pull request, so saving there would add one entry per pull request. Key shape and size budget:
    # doc/decision/ci-caching.md
    - name: Identify the Rust toolchain for the cache key
      id: toolchain
      run: echo "id=${ImageOS}-$(rustc --verbose --version | awk '/^commit-hash:/ { print $2 }')" >> "$GITHUB_OUTPUT"

    - name: Restore cargo build artifacts
      id: cargo-cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: package/git-policy/cli/target
        key: cargo-v2-cli-git-release-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('package/git-policy/cli/Cargo.lock') }}
        restore-keys: |
          cargo-v2-cli-git-release-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-

    # The runner's rustup toolchain builds the wrapper, as the release job of cargo-publish.yml does.
    # --locked builds the dependency versions the crate's Cargo.lock records; the release profile keeps panic = "unwind",
    # which the linked scanner requires.
    - name: Build the native wrapper from the checkout
      working-directory: package/git-policy/cli
      run: cargo build --release --locked --bin cli-git-native

    - name: Save cargo build artifacts
      if: ${{ steps.cargo-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: package/git-policy/cli/target
        key: cargo-v2-cli-git-release-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('package/git-policy/cli/Cargo.lock') }}

    - name: Check final newlines in isolated repository
      run: node package/git-policy/cli/bin/final-newline-workflow.mjs package/git-policy/cli/target/release/cli-git-native
