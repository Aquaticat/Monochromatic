name: final newline

on:
  pull_request:
    branches: ['main']
  merge_group:
    branches: ['main']
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Set up Node
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 26.5.0
        package-manager-cache: false

    - name: Set up pnpm
      run: npm install --global pnpm@11.10.0

    - name: Install cli-git dependency closure
      run: pnpm install --frozen-lockfile --filter @monochromatic-dev/cli-git...

    - name: Create isolated core policy repository
      run: |
        git clone --local --no-hardlinks "$GITHUB_WORKSPACE" "$RUNNER_TEMP/final-newline"
        printf 'export default {};\n' > "$RUNNER_TEMP/final-newline/cli-git.config.mjs"

    - name: Verify isolated repository
      working-directory: ${{ runner.temp }}/final-newline
      run: |
        test -d .git
        test -f cli-git.config.mjs
        test "$(git rev-parse --show-toplevel)" = "$RUNNER_TEMP/final-newline"
        node --input-type=module-typescript --eval "import { findGitRepoRoot } from '$GITHUB_WORKSPACE/packages/module/fs-path/src/index.ts'; const root = await findGitRepoRoot({ cwd: process.cwd() }); if (root !== process.cwd()) throw new Error('cli-git repository discovery mismatch: ' + root)"

    - name: Trust isolated core policy config
      working-directory: ${{ runner.temp }}/final-newline
      run: node "$GITHUB_WORKSPACE/packages/git-policies/cli/src/index.ts" cli-git trust --yes

    - name: Check final newlines
      working-directory: ${{ runner.temp }}/final-newline
      run: node "$GITHUB_WORKSPACE/packages/git-policies/cli/src/index.ts" cli-git check --policy final-newline --all
