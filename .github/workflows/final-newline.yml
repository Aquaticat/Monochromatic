name: final newline

on:
  pull_request:
    branches: ['main']
  merge_group:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Set up Node
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 26.5.0
        package-manager-cache: false

    # The runner's rustup toolchain builds the wrapper, as the release job of cargo-publish.yml does.
    # --locked builds the dependency versions the crate's Cargo.lock records; the release profile keeps panic = "unwind",
    # which the linked scanner requires.
    - name: Build the native wrapper from the checkout
      working-directory: package/git-policy/cli
      run: cargo build --release --locked --bin cli-git-native

    - name: Check final newlines in isolated repository
      run: node package/git-policy/cli/bin/final-newline-workflow.mjs package/git-policy/cli/target/release/cli-git-native
