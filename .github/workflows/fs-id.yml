name: depot-complete-logger-hosts

on:
  workflow_dispatch:

concurrency:
  group: depot-complete-logger-hosts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hosts:
    name: Logger host gate (${{ matrix.gate }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        gate: [filesystem, semantic]
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      MISE_AUTO_INSTALL: 'false'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # Retain the filesystem workflow's Node version and the semantic source lock version.
      MISE_NODE_VERSION: ${{ matrix.gate == 'filesystem' && '26.5.0' || '26.11.1' }}
      MISE_PNPM_VERSION: '12.11.2'
      SOURCE_HEAD: ef01490f5e960f8ca0b424c12242caeb3c5a2b5e
    steps:
    - name: Checkout trial harness
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: harness
        persist-credentials: false
    - name: Checkout immutable source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        path: source
        ref: ef01490f5e960f8ca0b424c12242caeb3c5a2b5e
        persist-credentials: false
    - name: Bootstrap mise outside source
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        # Retain the trial's verified bootstrap version.
        version: 2026.10.9
        working_directory: harness
        install: false
        cache: false
    - name: Install exact workflow tools outside source
      working-directory: harness
      run: mise install --yes "node@$MISE_NODE_VERSION" pnpm@12.11.2
    - name: Verify source identity
      working-directory: harness
      run: mise run //package/dev-script/task-util:trial:depot:logger-host:identity
    - name: Exercise preferred filesystem identity
      if: matrix.gate == 'filesystem'
      working-directory: harness
      run: mise run //package/dev-script/task-util:trial:depot:logger-host:filesystem
    - name: Install immutable semantic dependencies
      if: matrix.gate == 'semantic'
      run: mise run prepare:pnpm:install -- --frozen-lockfile
    - name: Build semantic plugin artifact
      id: plugin
      if: matrix.gate == 'semantic'
      run: mise run //package/oxlint-plugin/prefer-readonly-parameter-type:build:js:node
    - name: Exercise native bridge lifecycle and platform paths
      if: ${{ !cancelled() && matrix.gate == 'semantic' && steps.plugin.outcome == 'success' }}
      run: mise run //package/oxlint-plugin/prefer-readonly-parameter-type:test:semantic-bridge-host
    - name: Exercise external consumer artifact
      if: ${{ !cancelled() && matrix.gate == 'semantic' && steps.plugin.outcome == 'success' }}
      run: mise run //package/oxlint-plugin/prefer-readonly-parameter-type:test:external-consumer-host
    - name: Verify source remained immutable
      if: ${{ !cancelled() }}
      working-directory: harness
      run: mise run //package/dev-script/task-util:trial:depot:logger-host:identity
