name: cli-git trust host evidence

on:
  pull_request:
    branches: ['main']
    paths:
    - 'packages/git-policies/**'
    - 'packages/module/fs-id/**'
    - 'packages/module/fs-path/**'
    - 'pnpm-lock.yaml'
    - '.github/workflows/cli-git-trust.yml'
  merge_group:
    branches: ['main']
  push:
    branches: ['main']
    paths:
    - 'packages/git-policies/**'
    - 'packages/module/fs-id/**'
    - 'packages/module/fs-path/**'
    - 'pnpm-lock.yaml'
    - '.github/workflows/cli-git-trust.yml'

permissions:
  contents: read

jobs:
  trust:
    name: Trust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Set up Node
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 26.5.0
        package-manager-cache: false

    - name: Set up pnpm
      run: npm install --global pnpm@11.10.0

    - name: Install cli-git dependency closure
      run: pnpm install --frozen-lockfile --filter @monochromatic-dev/cli-git...

    - name: Exercise real filesystem identity commands
      run: node packages/module/fs-id/src/host-evidence.ts

    - name: Verify strict and relaxed MJS snapshots
      run: node packages/git-policies/cli/src/trust/trust-service.unit.test.ts

    - name: Verify strict and relaxed TypeScript cache
      run: node packages/git-policies/cli/src/trust/typescript-trust.unit.test.ts

    - name: Verify reversible trust paths
      run: node packages/git-policies/cli/src/trust/registry-path.unit.test.ts

    - name: Verify Windows protected ACL rejection
      if: runner.os == 'Windows'
      run: node packages/git-policies/cli/src/trust/windows-acl.host-evidence.ts
