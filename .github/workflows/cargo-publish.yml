  ml-build-binary:
    needs: ml-detect
    # Not gated on !inputs.dry-run: a dry run builds every target too.
    if: ${{ needs.ml-detect.outputs.should_publish == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64-unknown-linux-gnu
          runner: ubuntu-latest
        - target: x86_64-unknown-linux-musl
          runner: ubuntu-latest
          needs_musl: true
        - target: aarch64-unknown-linux-gnu
          runner: ubuntu-24.04-arm
        - target: aarch64-unknown-linux-musl
          runner: ubuntu-24.04-arm
          needs_musl: true
        - target: x86_64-apple-darwin
          runner: macos-latest
        - target: aarch64-apple-darwin
          runner: macos-latest
        - target: x86_64-pc-windows-msvc
          runner: windows-latest
        - target: aarch64-pc-windows-msvc
          runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Install musl tools
      if: ${{ matrix.needs_musl }}
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - name: Add rust target
      shell: bash
      run: rustup target add ${{ matrix.target }}

    - name: Show the toolchain that builds the release
      shell: bash
      run: rustc --version --verbose

    # --locked builds the dependency versions the published crate's Cargo.lock
    # records; the release profile in Cargo.toml applies fat LTO and one codegen unit.
    - name: Build binary
      shell: bash
      working-directory: package/linter/monochromatic-lint
      run: cargo build --release --locked --target ${{ matrix.target }}

    - name: Package binary archive
      id: pkg
      shell: bash
      env:
        VERSION: ${{ needs.ml-detect.outputs.version }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        bin='monochromatic-lint'
        ext=''
        case "$TARGET" in
          *windows*) ext='.exe' ;;
        esac
        stage_dir="monochromatic-lint-${VERSION}-${TARGET}"
        mkdir -p "dist/${stage_dir}"
        cp "package/linter/monochromatic-lint/target/${TARGET}/release/${bin}${ext}" "dist/${stage_dir}/"
        if [ -f package/linter/monochromatic-lint/README.md ]; then
          cp package/linter/monochromatic-lint/README.md "dist/${stage_dir}/"
        fi
        case "$TARGET" in
          *windows*)
            archive="${stage_dir}.zip"
            (cd dist && 7z a "${archive}" "${stage_dir}" >/dev/null)
            ;;
          *)
            archive="${stage_dir}.tar.gz"
            (cd dist && tar czf "${archive}" "${stage_dir}")
            ;;
        esac
        archive_path="dist/${archive}"
        echo "archive_path=${archive_path}" >> "$GITHUB_OUTPUT"
        echo "archive_name=${archive}" >> "$GITHUB_OUTPUT"
        ls -la dist/

    - name: Attest binary provenance
      if: ${{ !inputs.dry-run }}
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: ${{ steps.pkg.outputs.archive_path }}

    # Uploaded in a dry run too, so the archive layout can be inspected and the
    # binary run before anything is released.
    - name: Upload archive as workflow artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ml-bin-${{ matrix.target }}
        path: ${{ steps.pkg.outputs.archive_path }}
        if-no-files-found: error
        retention-days: 7

  ml-create-release:
    needs: [ml-detect, ml-build-binary]
    if: ${{ needs.ml-detect.outputs.should_publish == 'true' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Download all binary archives
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
