name: cargo-publish

on:
  workflow_dispatch:
    inputs:
      crate:
        description: 'Which crate to publish (manual runs only)'
        type: choice
        options:
        - forbidden-strings
        - monochromatic-nested-wayland-session
        - forbidden-regex
        - monochromatic-jsonc-edit
        - monochromatic-lint
        - monochromatic-git-policy-cli
        default: forbidden-strings
      dry-run:
        description: 'Dry run (package + verify, no crates.io upload, no GH release, no attestation)'
        type: boolean
        default: true
  push:
    branches: ['main']
    paths:
    - 'package/cli/forbidden-strings/Cargo.toml'
    - 'package/cli/nested-wayland-session/Cargo.toml'
    - 'package/rust-module/forbidden-regex/Cargo.toml'
    - 'package/rust-module/jsonc-edit/Cargo.toml'
    - 'package/linter/monochromatic-lint/Cargo.toml'
    - 'package/git-policy/cli/Cargo.toml'

permissions:
  contents: read

# Serialize runs so a second version bump landing while a publish is still
# uploading does not race the first. cancel-in-progress=false keeps the
# running publish alive; the second run queues.
concurrency:
  group: cargo-publish
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}
      version: ${{ steps.detect.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        # need before+after revs to detect a version bump on push events.
        # fetch-depth: 2 holds `before` for a one-generation push; the detect
        # step fetches it when a push carries more, and treats a first push
        # (no `before`) as a bump.
        fetch-depth: 2

    - name: Detect version bump
      id: detect
      env:
        BEFORE_SHA: ${{ github.event.before }}
        EVENT_NAME: ${{ github.event_name }}
        INPUT_CRATE: ${{ github.event.inputs.crate }}
      run: |
        set -euo pipefail
        cargo_toml='package/cli/forbidden-strings/Cargo.toml'
        after=$(awk -F'"' '/^version = / { print $2; exit }' "$cargo_toml")
        before=''
        if [ -n "${BEFORE_SHA:-}" ] \
          && [ "$BEFORE_SHA" != '0000000000000000000000000000000000000000' ]; then
          # A push can carry several generations, such as a merge whose second parent
          # holds commits that were not on origin yet, so the pre-push head can lie
          # outside the depth-2 checkout. Fetch it instead of reading its absence as
          # a version bump; a failed fetch fails this job, so nothing publishes.
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          fi
          if git cat-file -e "${BEFORE_SHA}:${cargo_toml}" 2>/dev/null; then
            before=$(git show "${BEFORE_SHA}:${cargo_toml}" | awk -F'"' '/^version = / { print $2; exit }')
          fi
        fi
        printf 'before=%s\nafter=%s\n' "$before" "$after"
        if [ -z "$after" ]; then
          echo 'No version found in Cargo.toml; refusing to publish.' >&2
          exit 1
        fi
        # A manual dispatch publishes only the selected crate; a push publishes
        # only if this crate's Cargo.toml version actually changed.
        publish=false
        if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$INPUT_CRATE" = 'forbidden-strings' ]; then
          publish=true
        elif [ "$EVENT_NAME" = 'push' ] && [ "$before" != "$after" ]; then
          publish=true
        fi
        if [ "$publish" = 'true' ]; then
          {
            echo "should_publish=true"
            echo "version=$after"
          } >> "$GITHUB_OUTPUT"
        else
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
        fi

  publish-crate:
    needs: detect
    if: ${{ needs.detect.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Set up mise (skip auto-install of all tools)
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        # Resolve "latest" through the GitHub releases API, published releases only,
        # one day old like pnpm's minimumReleaseAge. Without it the action installs
        # whatever mise.jdx.dev/VERSION names, which runs ahead of the GitHub release
        # (2025.8.19, 2026.9.3): doc/troubleshooting/mise-action-version-ahead-of-release.md
        minimum_release_age: 1d
        install: false
        # mise-action saves its cache only when install is true: doc/decision/ci-caching.md
        cache: false

    - name: Install only the tools this workflow needs
      run: mise install rust

    # Key shape, restore-keys rule, and size budget: doc/decision/ci-caching.md
    - name: Identify the Rust toolchain for the cache key
      id: toolchain
      run: echo "id=${ImageOS}-$(mise exec rust -- rustc --verbose --version | awk '/^commit-hash:/ { print $2 }')" >> "$GITHUB_OUTPUT"

    - name: Cache cargo build artifacts
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: |
          package/cli/forbidden-strings/target
          !package/cli/forbidden-strings/target/package
        key: cargo-v2-publish-fs-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('package/cli/forbidden-strings/Cargo.lock') }}
        restore-keys: |
          cargo-v2-publish-fs-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-

    # `cargo package` verifies by compiling the packaged crate and leaves
    # the .crate at target/package/. We attest THESE bytes, then upload
    # with `cargo publish --no-verify` which uses the existing .crate
    # without re-packaging or deleting it (verified locally: file sha256
    # is byte-identical before and after `cargo publish --no-verify`).
    # We cannot attest after `cargo publish` because cargo deletes the
    # .crate as part of its post-upload cleanup when --no-verify is NOT
    # passed; that was the 0.1.6 failure mode.
    - name: Build .crate package (verifies by compile)
      working-directory: package/cli/forbidden-strings
      run: mise exec rust -- cargo package

    - name: Log cargo directory sizes
      if: always()
      run: |
        du --summarize --human-readable package/cli/forbidden-strings/target "$HOME/.cargo/registry" "$HOME/.cargo/git" || true
        du --max-depth=2 --human-readable package/cli/forbidden-strings/target | sort --human-numeric-sort --reverse | head --lines=15 || true

    - name: Attest .crate provenance
      if: ${{ !inputs.dry-run }}
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: 'package/cli/forbidden-strings/target/package/forbidden-strings-${{ needs.detect.outputs.version }}.crate'

    - name: Authenticate with crates.io (Trusted Publishing)
      if: ${{ !inputs.dry-run }}
      id: auth
      uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe

    - name: Publish (dry run)
      if: ${{ inputs.dry-run }}
      working-directory: package/cli/forbidden-strings
      run: mise exec rust -- cargo publish --dry-run --no-verify

    - name: Publish
      if: ${{ !inputs.dry-run }}
      working-directory: package/cli/forbidden-strings
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      run: mise exec rust -- cargo publish --no-verify

  build-binary:
    needs: detect
    if: ${{ needs.detect.outputs.should_publish == 'true' && !inputs.dry-run }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64-unknown-linux-gnu
          runner: ubuntu-latest
        - target: x86_64-unknown-linux-musl
          runner: ubuntu-latest
          needs_musl: true
        - target: aarch64-unknown-linux-gnu
          runner: ubuntu-24.04-arm
        - target: aarch64-unknown-linux-musl
          runner: ubuntu-24.04-arm
          needs_musl: true
        - target: x86_64-apple-darwin
          runner: macos-latest
        - target: aarch64-apple-darwin
          runner: macos-latest
        - target: x86_64-pc-windows-msvc
          runner: windows-latest
        # Native Windows arm64 runner, free for public repositories (GA 2025-08-07).
        # Absent until 0.4.1 only because we believed GitHub had no hosted Windows arm64
        # runner: doc/decision/forbidden-strings-windows-arm64-release-target.md
        - target: aarch64-pc-windows-msvc
          runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Install musl tools
      if: ${{ matrix.needs_musl }}
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - name: Add rust target
      shell: bash
      run: rustup target add ${{ matrix.target }}

    - name: Build binary
      shell: bash
      working-directory: package/cli/forbidden-strings
      run: cargo build --release --target ${{ matrix.target }}

    - name: Package binary archive
      id: pkg
      shell: bash
      env:
        VERSION: ${{ needs.detect.outputs.version }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        bin='forbidden-strings'
        ext=''
        case "$TARGET" in
          *windows*) ext='.exe' ;;
        esac
        stage_dir="forbidden-strings-${VERSION}-${TARGET}"
        mkdir -p "dist/${stage_dir}"
        cp "package/cli/forbidden-strings/target/${TARGET}/release/${bin}${ext}" "dist/${stage_dir}/"
        # README is decoration; if it ever moves or is renamed, ship the
        # binary anyway rather than failing the whole release pipeline.
        if [ -f package/cli/forbidden-strings/README.md ]; then
          cp package/cli/forbidden-strings/README.md "dist/${stage_dir}/"
        fi
        case "$TARGET" in
          *windows*)
            archive="${stage_dir}.zip"
            (cd dist && 7z a "${archive}" "${stage_dir}" >/dev/null)
            ;;
          *)
            archive="${stage_dir}.tar.gz"
            (cd dist && tar czf "${archive}" "${stage_dir}")
            ;;
        esac
        archive_path="dist/${archive}"
        echo "archive_path=${archive_path}" >> "$GITHUB_OUTPUT"
        echo "archive_name=${archive}" >> "$GITHUB_OUTPUT"
        ls -la dist/

    # Attest each binary archive: the SLSA build-provenance signature binds
    # the archive's sha256 to this workflow run. Since the artifact transit
    # (upload-artifact -> download-artifact -> gh release create) is
    # byte-preserving, the digest still matches when consumers download
    # from the release page and run `gh attestation verify`.
    - name: Attest binary provenance
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: ${{ steps.pkg.outputs.archive_path }}

    - name: Upload archive as workflow artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: bin-${{ matrix.target }}
        path: ${{ steps.pkg.outputs.archive_path }}
        if-no-files-found: error
        retention-days: 7

  # Immutable releases (repo setting) means `gh release create` must include
  # every asset at creation time; you cannot add files later. So we wait for
  # every matrix entry to finish, collect all archives, then create the
  # release in one shot with all files attached.
  create-release:
    needs: [detect, build-binary]
    if: ${{ needs.detect.outputs.should_publish == 'true' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Download all binary archives
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: bin-*
        path: assets
        merge-multiple: true

    - name: Create GitHub release with all archives
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.detect.outputs.version }}
        SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        tag="forbidden-strings-v${VERSION}"
        ls -la assets/
        gh release create "$tag" assets/* \
          --repo "$REPO" \
          --title "forbidden-strings v${VERSION}" \
          --notes "forbidden-strings v${VERSION}. crates.io: https://crates.io/crates/forbidden-strings/${VERSION}" \
          --target "$SHA"

  # monochromatic-nested-wayland-session: a Wayland compositor, so LINUX-ONLY
  # (x86_64/aarch64 gnu; no macOS/Windows/musl, which cannot build/link the
  # Wayland stack) and it installs the system -dev libraries it links before
  # every compile. Its jobs are gated identically to forbidden-strings' but on
  # the nested-wayland-session Cargo.toml and the matching dispatch crate.

  nws-detect:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}
      version: ${{ steps.detect.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 2

    - name: Detect version bump
      id: detect
      env:
        BEFORE_SHA: ${{ github.event.before }}
        EVENT_NAME: ${{ github.event_name }}
        INPUT_CRATE: ${{ github.event.inputs.crate }}
      run: |
        set -euo pipefail
        cargo_toml='package/cli/nested-wayland-session/Cargo.toml'
        after=$(awk -F'"' '/^version = / { print $2; exit }' "$cargo_toml")
        before=''
        if [ -n "${BEFORE_SHA:-}" ] \
          && [ "$BEFORE_SHA" != '0000000000000000000000000000000000000000' ]; then
          # A push can carry several generations, such as a merge whose second parent
          # holds commits that were not on origin yet, so the pre-push head can lie
          # outside the depth-2 checkout. Fetch it instead of reading its absence as
          # a version bump; a failed fetch fails this job, so nothing publishes.
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          fi
          if git cat-file -e "${BEFORE_SHA}:${cargo_toml}" 2>/dev/null; then
            before=$(git show "${BEFORE_SHA}:${cargo_toml}" | awk -F'"' '/^version = / { print $2; exit }')
          fi
        fi
        printf 'before=%s\nafter=%s\n' "$before" "$after"
        if [ -z "$after" ]; then
          echo 'No version found in Cargo.toml; refusing to publish.' >&2
          exit 1
        fi
        publish=false
        if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$INPUT_CRATE" = 'monochromatic-nested-wayland-session' ]; then
          publish=true
        elif [ "$EVENT_NAME" = 'push' ] && [ "$before" != "$after" ]; then
          publish=true
        fi
        if [ "$publish" = 'true' ]; then
          {
            echo "should_publish=true"
            echo "version=$after"
          } >> "$GITHUB_OUTPUT"
        else
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
        fi

  nws-publish-crate:
    needs: nws-detect
    if: ${{ needs.nws-detect.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Install system libraries the crate links
      # Ubuntu equivalents of the Fedora -devel packages in the package's
      # Containerfile: libwayland (use_system_lib), libxkbcommon (linked, not
      # dlopened), libdrm (backend_drm), EGL headers, and clang/libclang for any
      # bindgen in the drm-sys / wayland-sys graph.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config \
          libwayland-dev libxkbcommon-dev libdrm-dev libegl-dev \
          clang libclang-dev

    - name: Set up mise (skip auto-install of all tools)
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        # Resolve "latest" through the GitHub releases API, published releases only,
        # one day old like pnpm's minimumReleaseAge. Without it the action installs
        # whatever mise.jdx.dev/VERSION names, which runs ahead of the GitHub release
        # (2025.8.19, 2026.9.3): doc/troubleshooting/mise-action-version-ahead-of-release.md
        minimum_release_age: 1d
        install: false
        # mise-action saves its cache only when install is true: doc/decision/ci-caching.md
        cache: false

    - name: Install only the tools this workflow needs
      run: mise install rust

    # Key shape, restore-keys rule, and size budget: doc/decision/ci-caching.md
    - name: Identify the Rust toolchain for the cache key
      id: toolchain
      run: echo "id=${ImageOS}-$(mise exec rust -- rustc --verbose --version | awk '/^commit-hash:/ { print $2 }')" >> "$GITHUB_OUTPUT"

    - name: Cache cargo build artifacts
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: |
          package/cli/nested-wayland-session/target
          !package/cli/nested-wayland-session/target/package
        key: cargo-v2-publish-nws-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('package/cli/nested-wayland-session/Cargo.lock') }}
        restore-keys: |
          cargo-v2-publish-nws-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-

    - name: Build .crate package (verifies by compile)
      working-directory: package/cli/nested-wayland-session
      run: mise exec rust -- cargo package

    - name: Log cargo directory sizes
      if: always()
      run: |
        du --summarize --human-readable package/cli/nested-wayland-session/target "$HOME/.cargo/registry" "$HOME/.cargo/git" || true
        du --max-depth=2 --human-readable package/cli/nested-wayland-session/target | sort --human-numeric-sort --reverse | head --lines=15 || true

    - name: Attest .crate provenance
      if: ${{ !inputs.dry-run }}
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: 'package/cli/nested-wayland-session/target/package/monochromatic-nested-wayland-session-${{ needs.nws-detect.outputs.version }}.crate'

    - name: Authenticate with crates.io (Trusted Publishing)
      if: ${{ !inputs.dry-run }}
      id: auth
      uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe

    - name: Publish (dry run)
      if: ${{ inputs.dry-run }}
      working-directory: package/cli/nested-wayland-session
      run: mise exec rust -- cargo publish --dry-run --no-verify

    - name: Publish (skips if this version is already on crates.io)
      # v0.1.0 was published manually to bootstrap the crate (crates.io Trusted
      # Publishing cannot be configured until the crate exists). This step is
      # idempotent: it skips when the version is already present, so re-running
      # to (re)build the release binaries never fails on a duplicate upload.
      if: ${{ !inputs.dry-run }}
      working-directory: package/cli/nested-wayland-session
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        VERSION: ${{ needs.nws-detect.outputs.version }}
      run: |
        set -euo pipefail
        if curl -sSf -H 'User-Agent: monochromatic-ci' \
          "https://crates.io/api/v1/crates/monochromatic-nested-wayland-session/${VERSION}" >/dev/null 2>&1; then
          echo "::notice::monochromatic-nested-wayland-session ${VERSION} already on crates.io; skipping publish."
        else
          mise exec rust -- cargo publish --no-verify
        fi

  nws-build-binary:
    needs: nws-detect
    if: ${{ needs.nws-detect.outputs.should_publish == 'true' && !inputs.dry-run }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64-unknown-linux-gnu
          runner: ubuntu-latest
        - target: aarch64-unknown-linux-gnu
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Install system libraries the crate links
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config \
          libwayland-dev libxkbcommon-dev libdrm-dev libegl-dev \
          clang libclang-dev

    - name: Add rust target
      shell: bash
      run: rustup target add ${{ matrix.target }}

    - name: Build binary
      shell: bash
      working-directory: package/cli/nested-wayland-session
      run: cargo build --release --target ${{ matrix.target }}

    - name: Package binary archive
      id: pkg
      shell: bash
      env:
        VERSION: ${{ needs.nws-detect.outputs.version }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        bin='monochromatic-nested-wayland-session'
        stage_dir="monochromatic-nested-wayland-session-${VERSION}-${TARGET}"
        mkdir -p "dist/${stage_dir}"
        cp "package/cli/nested-wayland-session/target/${TARGET}/release/${bin}" "dist/${stage_dir}/"
        if [ -f package/cli/nested-wayland-session/README.md ]; then
          cp package/cli/nested-wayland-session/README.md "dist/${stage_dir}/"
        fi
        archive="${stage_dir}.tar.gz"
        (cd dist && tar czf "${archive}" "${stage_dir}")
        archive_path="dist/${archive}"
        echo "archive_path=${archive_path}" >> "$GITHUB_OUTPUT"
        echo "archive_name=${archive}" >> "$GITHUB_OUTPUT"
        ls -la dist/

    - name: Attest binary provenance
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: ${{ steps.pkg.outputs.archive_path }}

    - name: Upload archive as workflow artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: nws-bin-${{ matrix.target }}
        path: ${{ steps.pkg.outputs.archive_path }}
        if-no-files-found: error
        retention-days: 7

  # Tag / asset names follow cargo-binstall's default templates
  # ({name}-v{version} tag, {name}-{version}-{target}.tar.gz asset,
  # {name}-{version}-{target}/{bin} inside), so
  # `cargo binstall monochromatic-nested-wayland-session` works with no
  # [package.metadata.binstall], matching forbidden-strings.
  nws-create-release:
    needs: [nws-detect, nws-build-binary]
    if: ${{ needs.nws-detect.outputs.should_publish == 'true' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Download all binary archives
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: nws-bin-*
        path: assets
        merge-multiple: true

    - name: Create GitHub release with all archives
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.nws-detect.outputs.version }}
        SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        tag="monochromatic-nested-wayland-session-v${VERSION}"
        ls -la assets/
        gh release create "$tag" assets/* \
          --repo "$REPO" \
          --title "nested-wayland-session v${VERSION}" \
          --notes "monochromatic-nested-wayland-session v${VERSION}. crates.io: https://crates.io/crates/monochromatic-nested-wayland-session/${VERSION}. Linux only (x86_64 and aarch64 gnu)." \
          --target "$SHA"

  # forbidden-regex: the regex engine LIBRARY powering forbidden-strings.
  # No [[bin]], so no binary matrix and no GitHub release; just the crate
  # publish with provenance attestation. Its jobs are gated identically to
  # the other crates' but on the forbidden-regex Cargo.toml and the matching
  # dispatch crate.

  fr-detect:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}
      version: ${{ steps.detect.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 2

    - name: Detect version bump
      id: detect
      env:
