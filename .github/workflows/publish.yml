name: publish

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (pack + manifest only, no upload)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Set up mise (skip auto-install of all tools)
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151
      with:
        install: false
        cache: true

    - name: Install pnpm and node
      run: mise install 'npm:pnpm' node

    - name: Install dependencies
      run: mise exec -- pnpm install --frozen-lockfile

    - name: Configure npm registry auth
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        if [ -z "$NPM_TOKEN" ]; then
          echo "::error::NPM_TOKEN secret is not set. Add it in Settings -> Secrets and variables -> Actions."
          exit 1
        fi
        printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc

    - name: Publish (dry run)
      if: ${{ inputs.dry-run }}
      run: |
        mise exec -- pnpm publish -r \
          --filter '@monochromatic-dev/shim-node-domexception' \
          --filter '@monochromatic-dev/stub-silent' \
          --filter '@monochromatic-dev/stub-throwing' \
          --filter '@monochromatic-dev/module-async-time' \
          --filter '@monochromatic-dev/module-or-throw' \
          --filter '@monochromatic-dev/module-numeric-const' \
          --filter '@monochromatic-dev/module-numeric-format' \
          --filter '@monochromatic-dev/config-tsdown' \
          --filter '@monochromatic-dev/config-oxlint-no-restricted-syntax' \
          --filter '@monochromatic-dev/config-dprint' \
          --no-git-checks \
          --provenance \
          --access public \
          --dry-run

    - name: Publish
      if: ${{ !inputs.dry-run }}
      env:
        NPM_CONFIG_PROVENANCE: 'true'
      run: |
        mise exec -- pnpm publish -r \
          --filter '@monochromatic-dev/shim-node-domexception' \
          --filter '@monochromatic-dev/stub-silent' \
          --filter '@monochromatic-dev/stub-throwing' \
          --filter '@monochromatic-dev/module-async-time' \
          --filter '@monochromatic-dev/module-or-throw' \
          --filter '@monochromatic-dev/module-numeric-const' \
          --filter '@monochromatic-dev/module-numeric-format' \
          --filter '@monochromatic-dev/config-tsdown' \
          --filter '@monochromatic-dev/config-oxlint-no-restricted-syntax' \
          --filter '@monochromatic-dev/config-dprint' \
          --no-git-checks \
          --provenance \
          --access public
