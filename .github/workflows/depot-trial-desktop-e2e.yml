name: Depot trial desktop interaction

on:
  push:
    branches: [trial/depot-20261015]
    paths: [.github/workflows/depot-trial-desktop-e2e.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 60
    env:
      MISE_AUTO_INSTALL: 'false'
      CARGO_BUILD_JOBS: '16'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        # Pin for this trial: release discovery returned HTTP 403.
        version: 2026.10.9
        install: false
        cache: false
    - name: Install build runtimes
      run: mise install node rust pnpm
    - name: Probe desktop session prerequisites
      run: mise run //package/music-player/desktop-app:trial:depot:desktop:probe
    - name: Provision desktop prerequisites
      run: mise run //package/music-player/desktop-app:trial:depot:desktop:prepare
    - name: Install workspace dependencies
      run: mise run prepare:pnpm:install
    - name: Build the desktop application
      run: mise run //package/music-player/desktop-app:trial:depot:desktop:build
    - name: Build the compositor
      run: mise run //package/cli/nested-wayland-session:build
    - name: Verify all desktop sessions with the corrected portal Read contract
      run: mise run //package/music-player/desktop-app:trial:depot:desktop:run
