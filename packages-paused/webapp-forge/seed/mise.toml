[tasks."seed:demo"]
description = "Seed a synthetic forge dataset; --repos=N --users=N --seed=N --out=path"
usage = 'arg "[args]" var=#true help="Forwarded to seed CLI"'
run = """
let args = ($env.usage_args? | default '' | split row ' ' | where {|p| $p != ''})
node src/cli.ts ...$args
"""

[tasks.test]
extends = "test"

[tasks."test:unit"]
extends = "test:unit"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"
hide = true

[tasks."lint:oxlint"]
extends = "lint:oxlint"
