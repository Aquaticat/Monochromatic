logLevel = 'warn'
telemetry = false

[test]
coverageSkipTestFiles = true
concurrentTestGlob = "**/*.test.ts"

[install]
# Prevent Bun from auto-installing missing imports; pnpm manages node_modules
auto = 'disable'

[run]
# Always use Bun's shell
shell = 'bun'

# Auto alias node to Bun
bun = true

silent = true
